    rodDraw(ctx,ax,rTop,rBot,rw,anRod,cu&&A[3]==='cuDis'?1-shr:1,0);
    const emit=(arr,x,rate,col,kind)=>{ if(kind==='gas'){ bubbleStep(arr,dt,rate*7,x,by+bh-26,g.sy-4,rw*1.6,col,2.5,5.5); bubbleDraw(ctx,arr); } };
    if(C[3]==='gas') emit(gC,cx,rs,C[4],'gas'); else gC.length=0;
    if(A[3]==='gas') emit(gA,ax,rs,A[4],'gas'); else gA.length=0;
    if(C[3]==='metalNa'){ const n=poisson(rs*3,dt); for(let i=0;i<n;i++) na.push({x:cx+(Math.random()-0.5)*rw*2,y:rBot-30-Math.random()*60,r:3+Math.random()*3,vy:-(8+Math.random()*10)}); }
    for(let i=na.length-1;i>=0;i--){ const p=na[i]; p.y+=p.vy*dt; if(p.y<g.sy+2) na.splice(i,1); else circ(ctx,p.x,p.y,p.r,COL.yellow,'#fbe9a9',1.8); }
    if(A[3]==='dis'||A[3]==='cuDis'){ const n=poisson(rs*5,dt); for(let i=0;i<n;i++) dis.push({x:ax,y:sy+Math.random()*sh,vx:-(12+Math.random()*18),life:1,cu:A[3]==='cuDis'}); }
    for(let i=dis.length-1;i>=0;i--){ const p=dis[i]; p.x+=p.vx*dt; p.life-=dt*0.3; if(p.life<=0) dis.splice(i,1); else if(p.cu) ionGlyph(ctx,p.x,p.y,1,5,p.life); else circ(ctx,p.x,p.y,3.2,COL.yellow,'#fbe9a9',1.6); }
    pill(ctx,cx,rTop-14,'cathode (−)',CAT_COL,'center'); pill(ctx,ax,rTop-14,'anode (+)',AN_COL,'center');
    textAt(ctx,Y.n+(cu?'  ·  Cu electrodes':'  ·  Pt electrodes'),lx+bw/2,by+bh+22,{align:'center',size:12,weight:700,color:COL.ink});
    // wire, battery, voltmeter
    const mr=Math.min(38,h*0.07), yw=Math.max(h*0.12,mr+10);
    const W=mkPath([[ax,rTop],[ax,yw],[cx,yw],[cx,rTop]]); drawPath(ctx,W,COL.ink,3); if(rs>0.01) carriers(ctx,W,ph,26,E_COL,4.2);
    const bxs=ax-(ax-cx)*0.22; rect(ctx,bxs-10,yw-17,20,34,COL.ink,'#fff',0); batterySym(ctx,bxs,yw,false,true,CTL);
    textAt(ctx,fmt(V,2)+' V',bxs,yw-24,{align:'center',size:11.5,weight:700,color:CTL});
    dialMeter(ctx,cx+(ax-cx)*0.42,yw,mr,nd,rs,0,1,'Current','',E_COL,dt,0);
    if(V<=Vmin) pill(ctx,lx+bw/2,by+bh*0.45,'below '+fmt(Vmin,2)+' V — nothing happens',COL.mid,'center');
    // --- right: the contest ---
    const px=w*0.55, pw=w*0.42, rowH=Math.min(30,h*0.06);
    const rows=(y,title,list,win,col,rule)=>{
      textAt(ctx,title,px,y,{size:12.5,weight:700,color:col}); textAt(ctx,rule,px+pw,y,{align:'right',size:10.5,weight:600,color:COL.muted});
      list.forEach((q,i)=>{ const yy=y+8+i*(rowH+5), won=i===win; ctx.save(); rrect(ctx,px,yy,pw,rowH,8); ctx.fillStyle=won?'rgba(255,255,255,1)':'#f6f9fc'; ctx.fill(); ctx.lineWidth=won?2.6:1.2; ctx.strokeStyle=won?col:'#dbe4f0'; ctx.stroke(); ctx.restore();
        textAt(ctx,q[0],px+9,yy+rowH/2+4,{size:11,weight:won?700:500,color:won?COL.ink:COL.muted});
        textAt(ctx,(q[1]>0?'+':'')+fmt(q[1],2)+' V'+(won?'  ✔':''),px+pw-8,yy+rowH/2+4,{align:'right',size:11,weight:700,color:won?col:COL.mid}); });
      return y+8+list.length*(rowH+5);
    };
    let yy=rows(h*0.14,'Cathode · reduction',Y.cat,ci,CAT_COL,'higher E° wins');
    yy=rows(yy+h*0.07,'Anode · oxidation',an,ai,AN_COL,'lower E° wins');
    if(kinTxt) pill(ctx,px+pw/2,yy+22,'overpotential: slow O₂ loses',COL.red,'center');
    else if(cu) pill(ctx,px+pw/2,yy+22,'reactive Cu anode dissolves first',COL.red,'center');
  });
  return wrap;
}

/* =====================================================================
   2.10 LEAD STORAGE BATTERY — discharge and recharge (§2.6.2, Fig 2.10)
   Anode: Pb + SO₄²⁻ → PbSO₄ + 2e⁻      Cathode: PbO₂ + SO₄²⁻ + 4H⁺ + 2e⁻ → PbSO₄ + 2H₂O
   Discharging uses up H₂SO₄ (38 % at full charge) → acid density falls; charging reverses it.
   ===================================================================== */
function buildA10(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group">${uiChips('md','Mode',['Discharge (use it)','Charge (recharge it)'],0)}
      <div style="height:8px"></div>${uiSlider('rt','Current',0,100,1,60,CTL)}
      <div class="toggle-group"><button class="toggle-btn small" id="gf">Fully charged</button><button class="toggle-btn small" id="gz">Nearly flat</button></div></div>
    <div class="control-group"><div class="result-cards">
      ${uiCard('c1','Charge left',CAT_COL)}${uiCard('c2','Acid H₂SO₄',AN_COL)}
      ${uiCard('c3','One cell')}${uiCard('c4','Battery (6 cells)',COL.ink)}
      ${uiCard('c5','Acid density',null,true)}</div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), rtR=$('#rt');
  let mode=0, t=0, soc=0.9, goal=null, ph=0, I=0; const nd={x:0,v:0}, hy={x:0.5,v:0}, B=ionBox(); const R=rng(21), crys=Array.from({length:70},()=>[R(),R(),R()]);
  bindChips(wrap,'md',i=>{ mode=i; });
  $('#gf').onclick=()=>{ goal=1; }; $('#gz').onclick=()=>{ goal=0.06; };
  animLoop(dt=>{
    t+=dt;
    const rate=+rtR.value/100; $('#rtV').textContent=Math.round(rate*100)+' %';
    if(goal!==null){ soc=approach(soc,goal,2.5,dt); if(Math.abs(soc-goal)<0.004){ soc=goal; goal=null; } }
    let flow=rate; if(mode===0&&soc<=0.02) flow=0; if(mode===1&&soc>=0.995) flow=0;
    if(goal===null) soc=clamp(soc+(mode===0?-1:1)*flow*0.035*dt,0,1);
    I=approach(I,flow,6,dt);
    const Ecell=1.75+0.30*soc, Vt=mode===0?Ecell-0.18*I:Ecell+0.22*I, wt=16+22*soc;
    const rho=1.025+0.00695*wt;                // ≈1.29 g/mL at 38 %, ≈1.14 at 16 %
    $('#c1').textContent=Math.round(soc*100)+' %'; $('#c2').textContent=fmt(wt,1)+' %'; $('#c3').textContent=fmt(Vt,2)+' V'; $('#c4').textContent=fmt(Vt*6,1)+' V'; $('#c5').textContent=fmt(rho,3)+' g/mL';
    ph+=(mode===0?1:-1)*I*80*dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // --- cell: one compartment of the battery ---
    const bw=w*0.56, bh=Math.min(h*0.46,290), lx=w*0.04, by=h*0.34;
    ctx.save(); rrect(ctx,lx,by,bw,bh,10); ctx.fillStyle='rgba(47,143,224,'+(0.05+0.12*soc)+')'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.stroke(); ctx.restore();
    const pbx=lx+bw*0.22, pox=lx+bw*0.78, pw=bw*0.12, pTop=by-h*0.10, pBot=by+bh-12;
    // plates (grids) with PbSO₄ crystals building up as the cell runs down
    const plate=(x,fill,lab)=>{ rect(ctx,x-pw/2,pTop,pw,pBot-pTop,COL.ink,fill,2.6);
      for(let i=1;i<6;i++) line(ctx,x-pw/2,pTop+(pBot-pTop)*i/6,x+pw/2,pTop+(pBot-pTop)*i/6,COL.mid,1);
      line(ctx,x,pTop,x,pBot,COL.mid,1);
      const nC=Math.round((1-soc)*crys.length); crys.slice(0,nC).forEach(q=>{ const cy=by+8+q[1]*(bh-24), cxx=x-pw/2+q[0]*pw; if(cy<by) return; ctx.save(); ctx.fillStyle='#ffffff'; ctx.strokeStyle=COL.ink; ctx.lineWidth=1.1; ctx.beginPath(); ctx.moveTo(cxx-3,cy+3); ctx.lineTo(cxx,cy-4); ctx.lineTo(cxx+3,cy+3); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); });
      pill(ctx,x,by+bh+24,lab,COL.ink,'center'); };
    plate(pbx,'#cfd5dc','Pb  anode (−)'); plate(pox,'#d8b7a3','PbO₂  cathode (+)');
    // ions in the acid; migration toward the plates while current flows
    const nIon=Math.round(3+11*soc); ionStep(B,dt,nIon,nIon,10+I*10,null,null);
    ionDraw(ctx,B,lx+pw*1.3+bw*0.12,by+8,bw*0.5,bh-24,5.5);
    textAt(ctx,'H₂SO₄ (aq)',lx+bw/2,by+20,{align:'center',size:12,weight:700,color:COL.ink});
    // circuit
    const mr=Math.min(36,h*0.065), yw=Math.max(h*0.13,mr+12);
    const Wp=mkPath([[pbx,pTop],[pbx,yw],[pox,yw],[pox,pTop]]); drawPath(ctx,Wp,COL.ink,3); if(I>0.01) carriers(ctx,Wp,ph,26,E_COL,4.2);
    const mx=lx+bw*0.5;
    if(mode===0){ rect(ctx,mx-4,yw-30,8,60,COL.ink,'#fff',0); bulb(ctx,mx,yw-6,mr*0.55,I*(0.6+0.4*soc),t); textAt(ctx,'load',mx,yw+mr*1.3+8,{align:'center',size:11,weight:700,color:COL.muted}); }
    else { rect(ctx,mx-10,yw-17,20,34,COL.ink,'#fff',0); batterySym(ctx,mx,yw,false,false,CTL); textAt(ctx,'charger',mx,yw+30,{align:'center',size:11,weight:700,color:CTL}); }
    // hydrometer: a float that rises in dense acid and sinks (with a bounce) as acid is used
    const hx=w*0.78, hw=28, hT=h*0.18, hB=h*0.78;
    rect(ctx,hx-hw/2,hT,hw,hB-hT,COL.ink,'rgba(47,143,224,'+(0.06+0.12*soc)+')',2.6);
    for(let i=0;i<=5;i++){ const yy=hB-(hB-hT)*(0.08+0.84*i/5); line(ctx,hx+hw/2,yy,hx+hw/2+7,yy,COL.mid,1.3); textAt(ctx,fmt(1.10+0.04*i,2),hx+hw/2+10,yy+4,{size:10,weight:600,color:COL.muted}); }
    const tgt=clamp((rho-1.10)/(1.30-1.10),0,1); springTo(hy,tgt,45,5.5,dt);
    const fy=hB-(hB-hT)*(0.08+0.84*hy.x);
    ctx.save(); rrect(ctx,hx-8,fy-18,16,36,8); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.red; ctx.stroke(); ctx.restore();
    line(ctx,hx,fy-18,hx,fy-30,COL.red,2.2);
    textAt(ctx,'hydrometer',hx,hT-10,{align:'center',size:11.5,weight:700,color:COL.ink}); textAt(ctx,'g/mL',hx+hw/2+10,hB+16,{size:10,weight:600,color:COL.muted});
    const dead=(mode===0&&soc<=0.02), full=(mode===1&&soc>=0.995);
    textAt(ctx,mode===0?'Pb + PbO₂ + 2H₂SO₄ → 2PbSO₄ + 2H₂O':'2PbSO₄ + 2H₂O → Pb + PbO₂ + 2H₂SO₄',lx+bw/2,h-40,{align:'center',size:12,weight:700,color:COL.ink});
    pill(ctx,lx+bw/2,h-14,dead?'FLAT — recharge it':full?'FULLY CHARGED':(mode===0?'DISCHARGING — acid used up, PbSO₄ builds':'CHARGING — PbSO₄ converted back'),dead?COL.red:full?COL.green:(mode===0?COL.blue:COL.green),'center');
  });
  return wrap;
}

/* =====================================================================
   2.11 H₂–O₂ FUEL CELL (§2.7, Fig 2.12)
   Anode: 2H₂ + 4OH⁻ → 4H₂O + 4e⁻      Cathode: O₂ + 2H₂O + 4e⁻ → 4OH⁻      Overall: 2H₂ + O₂ → 2H₂O
   Reactants are fed continuously, so it runs as long as they last.  Per 4 e⁻: 2 H₂, 1 O₂ used.
   Efficiency ≈ 70 % (fuel cell) vs ≈ 40 % (thermal power plant).
   ===================================================================== */
function buildA11(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group">${uiSlider('hf','H₂ feed',0,100,1,80,COL.blue)}
      <div style="height:8px"></div>${uiSlider('of','O₂ feed',0,100,1,80,COL.red)}
      <div style="height:8px"></div>${uiSlider('ld','Load demand (motor)',0,100,1,50,CTL)}</div>
    <div class="control-group"><div class="result-cards">
      ${uiCard('c1','Current',E_COL)}${uiCard('c2','Power',COL.ink)}
      ${uiCard('c3','H₂ used')}${uiCard('c4','Water formed')}
      ${uiCard('c5','Limited by',null,true)}</div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), hfR=$('#hf'), ofR=$('#of'), ldR=$('#ld');
  let t=0, I=0, ph=0, ang=0, om=0, wlev=0, effT=0; const nd={x:0,v:0}, bH=[], bO=[], oh=[], B=ionBox();
  animLoop(dt=>{
    t+=dt; effT=Math.min(1,effT+dt*0.6);
    const hf=+hfR.value/100, of=+ofR.value/100, ld=+ldR.value/100, cap=Math.min(hf,2*of);
    $('#hfV').textContent=Math.round(hf*100)+' %'; $('#ofV').textContent=Math.round(of*100)+' %'; $('#ldV').textContent=Math.round(ld*100)+' %';
    const target=Math.min(ld,cap); I=approach(I,target,4,dt); const IA=I*10;
    const lim=ld<=cap+1e-9?'the load (motor)':(hf<=2*of?'H₂ supply':'O₂ supply');
    $('#c1').textContent=fmt(IA,1)+' A'; $('#c2').textContent=fmt(IA*0.9,1)+' W'; $('#c3').textContent=sciStr(IA/(2*FAR))+' mol/s'; $('#c4').textContent=fmt(IA/FAR*0.5*18*3600,2)+' g/h'; $('#c5').textContent=I<0.01&&ld>0.01?(cap<0.01?'no fuel — '+(hf<=2*of?'H₂':'O₂')+' feed is off':lim):lim;
    om=approach(om,I*16,3,dt); ang+=om*dt; ph+=I*90*dt; wlev=Math.min(1,wlev+I*0.03*dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // --- cell body ---
    const bw=w*0.56, bh=Math.min(h*0.40,260), lx=w*0.04, by=h*0.34, ew=Math.max(14,bw*0.075);
    const ax=lx+bw*0.16, cx=lx+bw*0.84;
    ctx.save(); rrect(ctx,lx,by,bw,bh,10); ctx.fillStyle='rgba(47,143,224,0.07)'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.stroke(); ctx.restore();
    // porous carbon electrodes with Pt specks
    [[ax,'#e4e8ee'],[cx,'#e4e8ee']].forEach(([x,f])=>{ rect(ctx,x-ew/2,by-h*0.06,ew,bh+h*0.06,COL.ink,f,2.6); for(let i=0;i<14;i++){ const yy=by-h*0.04+((i*47)%100)/100*(bh+h*0.02); circ(ctx,x+((i%3)-1)*ew*0.25,yy,1.6,COL.ink,COL.ink,1); } });
    // gas inlets: bubbles rise through each electrode
    const hbub=hf, obub=of;
    bubbleStep(bH,dt,hbub*9,ax,by+bh-6,by-h*0.05,ew*0.5,COL.blue,2.2,3.6); bubbleDraw(ctx,bH);
    bubbleStep(bO,dt,obub*9,cx,by+bh-6,by-h*0.05,ew*0.5,COL.red,2.2,3.6); bubbleDraw(ctx,bO);
    line(ctx,ax,by+bh,ax,by+bh+34,COL.ink,3); line(ctx,cx,by+bh,cx,by+bh+34,COL.ink,3);
    textAt(ctx,'H₂ in',ax,by+bh+50,{align:'center',size:12,weight:700,color:COL.blue}); textAt(ctx,'O₂ in',cx,by+bh+50,{align:'center',size:12,weight:700,color:COL.red});
    vec(ctx,ax,by+bh+30,ax,by+bh+8,COL.blue,2.4); vec(ctx,cx,by+bh+30,cx,by+bh+8,COL.red,2.4);
    // OH⁻ ions migrate cathode → anode, rate ∝ current; resting Na⁺/OH⁻ jiggle
    const nr=Math.round(6+4*I); ionStep(B,dt,nr,nr,10,null,null); ionDraw(ctx,B,ax+ew/2+4,by+6,cx-ax-ew-8,bh-14,5.5);
    const nO=poisson(I*5,dt); for(let i=0;i<nO;i++) oh.push({x:cx-ew/2-4,y:by+10+Math.random()*(bh-24)});
    for(let i=oh.length-1;i>=0;i--){ const p=oh[i]; p.x-=(30+I*50)*dt; if(p.x<ax+ew/2+3) oh.splice(i,1); else ionGlyph(ctx,p.x,p.y,-1,6); }
    textAt(ctx,'NaOH (aq)',lx+bw/2,by+bh+22,{align:'center',size:11.5,weight:700,color:COL.muted});
    pill(ctx,ax,by-h*0.06-14,'anode (−)',COL.red,'center'); pill(ctx,cx,by-h*0.06-14,'cathode (+)',COL.blue,'center');
    // circuit with motor and ammeter
    const mr=Math.min(34,h*0.065), yw=Math.max(h*0.12,mr+12), yTop=by-h*0.06;
    const Wp=mkPath([[ax,yTop],[ax,yw],[cx,yw],[cx,yTop]]); drawPath(ctx,Wp,COL.ink,3); if(I>0.01) carriers(ctx,Wp,ph,26,E_COL,4.2);
    const mx=ax+(cx-ax)*0.70;
    circ(ctx,mx,yw,mr*0.92,COL.ink,'#fff',2.8);
    for(let k=0;k<4;k++){ const a=ang+k*Math.PI/2; ctx.save(); ctx.translate(mx,yw); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(mr*0.5,-mr*0.38,mr*0.8,-mr*0.04); ctx.lineTo(mr*0.8,mr*0.12); ctx.closePath(); ctx.fillStyle='rgba(217,160,23,0.35)'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); }
    circ(ctx,mx,yw,3.5,COL.ink,COL.ink,1); textAt(ctx,'motor',mx,yw+mr+16,{align:'center',size:11.5,weight:700,color:COL.ink});
    dialMeter(ctx,ax+(cx-ax)*0.30,yw,mr,nd,IA,0,10,'Current','A',E_COL,dt,1);
    // water collected from the anode side
    const cyx=w*0.82, cyT=h*0.30, cyB=h*0.70, cyW=34;

    drawPath(ctx,P,COL.mid,1.4,[3,4]); if(I>0.01) carriers(ctx,P,ph*0.8,30,COL.blue,3.4);
    rect(ctx,cyx-cyW/2,cyT,cyW,cyB-cyT,COL.ink,'#fff',2.6); const wy=(cyB-cyT)*wlev; rect(ctx,cyx-cyW/2+1,cyB-wy,cyW-2,wy,COL.blue,'rgba(47,143,224,0.28)',0);
    for(let i=1;i<=5;i++) line(ctx,cyx+cyW/2-(i%2?8:13),cyB-(cyB-cyT)*i/5,cyx+cyW/2,cyB-(cyB-cyT)*i/5,COL.mid,1.2);
    textAt(ctx,'H₂O',cyx,cyT-12,{align:'center',size:12,weight:700,color:COL.blue}); textAt(ctx,'collected',cyx,cyB+16,{align:'center',size:11,weight:600,color:COL.muted});
    // efficiency bars
    const ex=w*0.66, ew2=w*0.30, ey=h*0.84;
    const bar=(y,lab,eff,col)=>{ textAt(ctx,lab,ex,y-6,{size:11.5,weight:700,color:col}); rect(ctx,ex,y,ew2,13,COL.ink,'#fff',2); rect(ctx,ex,y,ew2*eff*effT,13,col,col==='#1f9d55'?'rgba(31,157,85,0.3)':'rgba(217,67,43,0.25)',0); textAt(ctx,Math.round(eff*100*effT)+' %',ex+ew2*eff*effT+(effT>0.2?-4:4),y+11,{align:effT>0.2?'right':'left',size:11,weight:700,color:col}); };
    bar(ey,'Fuel cell  efficiency',0.70,COL.green); bar(ey+h*0.09,'Thermal power plant',0.40,COL.red);
    textAt(ctx,'2H₂ + O₂ → 2H₂O',lx+bw/2,h-14,{align:'center',size:13,weight:700,color:COL.ink});
  });
  return wrap;
}

/* =====================================================================
   2.12 CORROSION OF IRON — an electrochemical cell in a water drop (§2.8, Fig 2.13)
   Anode spot:   Fe → Fe²⁺ + 2e⁻ (E° −0.44 V)     Cathode spot: O₂ + 4H⁺ + 4e⁻ → 2H₂O (E° +1.23 V)
   E°cell = 1.67 V ; Fe²⁺ is oxidised further by O₂ → rust Fe₂O₃·xH₂O.
   Protection: paint (no drop contact) · Zn coating & Mg block (E° lower than Fe → they corrode instead)
   · Sn coating (E° higher than Fe → iron corrodes faster once scratched).
   ===================================================================== */
const PROT12=[
 {n:'None',fe:1,sac:0,lab:'Fe',E:'1.67 V',msg:'Bare iron: the drop becomes a tiny cell'},
 {n:'Paint',fe:0,sac:0,lab:'—',E:'—',msg:'Paint keeps water and air off — no cell forms'},
 {n:'Zn coat',fe:0.02,sac:1,lab:'Zn',E:'1.99 V',msg:'Zn (−0.76 V) is oxidised first, iron survives'},
 {n:'Sn coat',fe:1.7,sac:0,lab:'Fe',E:'1.67 V',msg:'Sn (−0.14 V) is less reactive: scratched iron rusts faster'},
 {n:'Mg block',fe:0.02,sac:1,lab:'Mg',E:'3.59 V',msg:'Sacrificial Mg (−2.36 V) corrodes, iron is saved'}];
function buildA12(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group">${uiSlider('mo','Moisture  (water drop)',0,1,0.01,0.7,COL.blue)}
      <div style="height:8px"></div>${uiSlider('ox','Oxygen from air',0,1,0.01,0.7,COL.red)}
      <div style="height:8px"></div>${uiSlider('ac','CO₂ / acid in the water',0,1,0.01,0.5,CAT_COL)}</div>
    <div class="control-group">${uiChips('pr','Protection',PROT12.map(p=>p.n),0)}
      <button class="toggle-btn navy" id="rs">Reset metal</button></div>
    <div class="control-group"><div class="result-cards">
      ${uiCard('c1','Corrosion rate',E_COL)}${uiCard('c2','Iron lost')}
      ${uiCard('c3','Rust formed')}${uiCard('c4','Oxidised metal')}
      ${uiCard('c5','E°cell of the corrosion cell',null,true)}</div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), moR=$('#mo'), oxR=$('#ox'), acR=$('#ac');
  let pi=0, t=0, pit=0, rust=0, sacL=0, ph=0, Dw=0.4, Dh=0.1; const Fe=[], O2=[]; const nd={x:0,v:0};
  bindChips(wrap,'pr',i=>{ pi=i; pit=0; rust=0; sacL=0; Fe.length=0; });
  $('#rs').onclick=()=>{ pit=0; rust=0; sacL=0; Fe.length=0; };
  animLoop(dt=>{
    t+=dt;
    const P=PROT12[pi], mo=+moR.value, ox=+oxR.value, ac=+acR.value;
    $('#moV').textContent=Math.round(mo*100)+' %'; $('#oxV').textContent=Math.round(ox*100)+' %'; $('#acV').textContent=Math.round(ac*100)+' %';
    const r0=mo>0.03?mo*ox*(0.35+0.65*ac):0, rFe=r0*P.fe, rSac=r0*P.sac;
    pit=Math.min(1,pit+rFe*0.12*dt); rust=Math.min(1,rust+rFe*0.09*dt); sacL=Math.min(1,sacL+rSac*0.10*dt);
    ph+=Math.max(rFe,rSac)*120*dt;
    $('#c1').textContent=fmt(Math.max(rFe,rSac)*100,0)+' %'; $('#c2').textContent=fmt(pit*100,0)+' %'; $('#c3').textContent=fmt(rust*100,0)+' %';
    const oxm=(pi===1||r0===0)?'—':((pi===2||pi===4)?P.lab:'Fe'); $('#c4').textContent=oxm; $('#c5').textContent=P.E+(P.E!=='—'?'   (Fe: 2Fe + O₂ + 4H⁺ → 2Fe²⁺ + 2H₂O)':'');
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // --- geometry ---
    const px0=w*0.05, px1=w*0.95, y0=h*0.62, thk=h*0.19, cl=(pi>=1&&pi<=3)?h*0.035:0, ys=y0-cl;
    Dw=approach(Dw,lerp(0.16,0.60,mo)*w,6,dt); Dh=approach(Dh,lerp(0.02,0.26,mo)*h,6,dt);
    const xc=pi===4?w*0.46:w*0.50, xa=xc-Dw*0.10, xcat=xc+Dw*0.40, sw=Math.max(10,Dw*0.07);
    const depth=pit*thk*0.78;
    // air
    textAt(ctx,'air  (O₂)',w*0.5,h*0.07,{align:'center',size:12,weight:700,color:COL.red});
    // plate with pit
    ctx.save(); ctx.beginPath(); ctx.moveTo(px0,y0+thk); ctx.lineTo(px0,y0);
    for(let x=px0;x<=px1;x+=3) ctx.lineTo(x,y0+(pi===3||pi===0?depth*Math.exp(-Math.pow((x-xa)/sw,2)):0));
    ctx.lineTo(px1,y0+thk); ctx.closePath(); ctx.fillStyle='#d8dde4'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.stroke(); ctx.restore();
    textAt(ctx,'iron',px0+10,y0+thk-8,{size:12,weight:700,color:COL.muted});
    // coatings
    if(cl>0){ const gw=(pi===1?0:sw*0.9+sacL*sw*0.8), col=pi===1?'#9ec7ef':(pi===2?'#cfe0ee':'#e7e7d4');
      const seg=(a,b)=>{ if(b>a){ rect(ctx,a,y0-cl,b-a,cl,COL.ink,col,2.2); } };
      if(pi===1) seg(px0,px1); else { seg(px0,xa-gw); seg(xa+gw,px1); }
      textAt(ctx,pi===1?'paint':(pi===2?'Zn coat':'Sn coat'),px1-6,y0-cl-6,{align:'right',size:11.5,weight:700,color:COL.muted}); }
    // magnesium block
    if(pi===4){ const bwid=w*0.11*(1-sacL*0.85); rect(ctx,px0+w*0.03,y0-h*0.09,bwid,h*0.09,COL.ink,'#e5e9ee',2.6); textAt(ctx,'Mg',px0+w*0.03+bwid/2,y0-h*0.03,{align:'center',size:12,weight:700,color:COL.ink}); }
    // water drop
    ctx.save(); ctx.beginPath(); ctx.ellipse(xc,ys,Dw/2,Dh,0,Math.PI,Math.PI*2); ctx.closePath(); ctx.fillStyle='rgba(47,143,224,'+(0.10+0.10*ac)+')'; ctx.fill(); ctx.lineWidth=2.4; ctx.strokeStyle=COL.blue; ctx.stroke(); ctx.restore();
    // rust mound
    if(rust>0.01){ const mxr=xc+Dw*0.26, mh=rust*thk*0.9+2, mw=Dw*0.16*(0.5+0.5*rust); ctx.save(); ctx.beginPath(); ctx.moveTo(mxr-mw,y0); ctx.quadraticCurveTo(mxr-mw*0.5,y0-mh,mxr,y0-mh); ctx.quadraticCurveTo(mxr+mw*0.5,y0-mh,mxr+mw,y0); ctx.closePath(); ctx.fillStyle='#d9a07a'; ctx.fill(); ctx.lineWidth=2.2; ctx.strokeStyle='#8f4a25'; ctx.stroke(); ctx.restore();
      for(let i=0;i<5;i++) line(ctx,mxr-mw*0.5+i*mw*0.25,y0-2,mxr-mw*0.45+i*mw*0.25,y0-mh*0.7,'#8f4a25',1); textAt(ctx,'rust  Fe₂O₃·xH₂O',mxr,y0-mh-8,{align:'center',size:11.5,weight:700,color:'#8f4a25'}); }
    // O₂ molecules falling into the drop near the cathode edge
    const nO=poisson(ox*mo*4+ (mo>0.03?ox*0.8:0),dt); for(let i=0;i<nO;i++) O2.push({x:xcat-Dw*0.35+Math.random()*Dw*0.5,y:h*0.12,vx:(Math.random()-0.5)*8});
    for(let i=O2.length-1;i>=0;i--){ const p=O2[i]; p.y+=(60+ox*40)*dt; p.x+=p.vx*dt+(xcat-p.x)*0.6*dt; const lim=ys-Dh*Math.sqrt(Math.max(0,1-Math.pow((p.x-xc)/(Dw/2),2)))+4;
      if(p.y>lim+ (mo>0.03?Dh*0.45:0)){ O2.splice(i,1); continue; } circ(ctx,p.x-3.2,p.y,3.2,COL.red,'#fff',1.5); circ(ctx,p.x+3.2,p.y,3.2,COL.red,'#fff',1.5); line(ctx,p.x-3.2,p.y,p.x+3.2,p.y,COL.red,1.5); }
    // Fe²⁺ (or Zn²⁺/Mg²⁺) leaving the anode spot, drifting to the cathode edge
    const srcX=pi===4?px0+w*0.03+w*0.05:xa, srcY=pi===4?y0-h*0.03:ys+(pi===3||pi===0?depth*0.0:0)-4;
    const nF=poisson(Math.max(rFe,rSac)*6,dt); for(let i=0;i<nF;i++) Fe.push({x:srcX+(Math.random()-0.5)*sw,y:srcY-2,vy:-(6+Math.random()*10)});
    for(let i=Fe.length-1;i>=0;i--){ const p=Fe[i]; p.x+=(xcat-p.x)*0.35*dt+(Math.random()-0.5)*6*dt+14*dt; p.y=Math.min(p.y+p.vy*dt,srcY); p.y=Math.max(p.y,ys-Dh*0.8); p.vy+=(Math.random()-0.5)*40*dt; p.vy=clamp(p.vy,-16,12);
      if(p.x>xc+Dw*0.30){ Fe.splice(i,1); continue; } ionGlyph(ctx,p.x,Math.min(p.y,srcY),1,5.5); }
    // electrons inside the metal, anode → cathode
    const rr=Math.max(rFe,rSac);
    if(rr>0.01){ const ey=y0+thk*0.55, ea=(pi===4?px0+w*0.08:xa), Pe=mkPath([[ea,ey],[xcat,ey]]); line(ctx,ea,ey,xcat,ey,E_COL,1.2,[2,6]); carriers(ctx,Pe,ph,22,E_COL,3.6); textAt(ctx,'e⁻',(ea+xcat)/2,ey+16,{align:'center',size:11.5,weight:700,color:E_COL}); }
    // labels
    if(r0>0.01&&pi!==1){ { const am=(pi===2||pi===4)?P.lab:'Fe'; pill(ctx,(pi===4?px0+w*0.09:xa-Dw*0.14),ys-Dh-26,'anode: '+am+' → '+am+'²⁺ + 2e⁻',COL.red,'center'); } }
    pill(ctx,xcat+Dw*0.10,ys-Dh-26,'cathode: O₂ → H₂O',COL.blue,'center');
    pill(ctx,w/2,h-14,P.msg,pi===0?COL.red:(pi===1?COL.blue:COL.green),'center');
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const activities = [
  { num:'2.1', title:'Daniell Cell', desc:'Galvanic ⇄ electrolytic · external voltage decides', build: buildA1 },
  { num:'2.2', title:'Electrode Potentials', desc:'Pick two half-cells · read the voltage', build: buildA2 },
  { num:'2.3', title:'Nernst Equation', desc:'Concentration changes the cell potential', build: buildA3 },
  { num:'2.4', title:'Energy & Equilibrium', desc:'ΔG = −nFE · the cell runs down to Q = K', build: buildA4 },
  { num:'2.5', title:'Conductivity Cell', desc:'R = ρl/A · ions carry the current', build: buildA5 },
  { num:'2.6', title:'Λm against √c', desc:'Strong vs weak electrolyte on dilution', build: buildA6 },
  { num:'2.7', title:'Kohlrausch Law', desc:'Each ion migrates independently', build: buildA7 },
  { num:'2.8', title:"Faraday's Laws", desc:'Charge decides the mass deposited', build: buildA8 },
  { num:'2.9', title:'Products of Electrolysis', desc:'Higher E° at the cathode · lower E° at the anode', build: buildA9 },
  { num:'2.10', title:'Lead Storage Battery', desc:'Discharge uses acid · charging restores it', build: buildA10 },
  { num:'2.11', title:'Fuel Cell', desc:'H₂ + O₂ → electricity + water', build: buildA11 },
  { num:'2.12', title:'Corrosion of Iron', desc:'A water drop is a tiny galvanic cell', build: buildA12 },
];
let currentIndex = 0;
function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* INIT */
render();
</script>
