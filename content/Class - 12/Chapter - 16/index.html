<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 12 · Chemistry · Chapter 2 — Electrochemistry | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

<div class="app">

<script>
/* =========================================================================
   GRADE 12 — CHAPTER 2: ELECTROCHEMISTRY
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; electrons, ions, rods, needles and gases ease, spring or integrate
   toward it every frame — never a static picture.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function lw(k,base){ return clamp(k*base,1,3); }

/* --- tiny HTML builders (same classes as the design system) --- */
function uiSlider(id,label,min,max,step,val,color){
  return `<label>${label} <span class="val" id="${id}V"${color?` style="color:${color}"`:''}></span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">`;
}
function uiChips(id,label,items,act){
  return `<label style="margin-bottom:5px;">${label}</label><div class="toggle-group" id="${id}">`+
    items.map((it,i)=>`<button class="toggle-btn small${i===act?' active':''}" data-i="${i}">${it}</button>`).join('')+`</div>`;
}
function uiCard(id,label,color,wide){
  return `<div class="rcard${wide?' wide':''}"><div class="rlabel">${label}</div><div class="rval" id="${id}"${color?` style="color:${color}"`:''}>—</div></div>`;
}
function bindChips(root,id,cb){
  const btns=[...root.querySelectorAll('#'+id+' .toggle-btn')];
  toggleWire(btns,b=>cb(+b.dataset.i));
}

/* --- particle motion --- */
function wander(p,dt,sp,turn){        // liquid-like random walk in normalised (u,v) box
  p.a+=gauss()*turn*Math.sqrt(dt);
  p.u+=Math.cos(p.a)*sp*dt; p.v+=Math.sin(p.a)*sp*dt;
  if(p.u<0.03){p.u=0.03;p.a=Math.PI-p.a;} if(p.u>0.97){p.u=0.97;p.a=Math.PI-p.a;}
  if(p.v<0.03){p.v=0.03;p.a=-p.a;}        if(p.v>0.97){p.v=0.97;p.a=-p.a;}
}
function flight(p,dt,y0){             // gas-like ballistic flight in normalised box, floor at y0
  p.u+=p.du*dt; p.v+=p.dv*dt;
  if(p.u<0.02){p.u=0.02;p.du=Math.abs(p.du);} if(p.u>0.98){p.u=0.98;p.du=-Math.abs(p.du);}
  if(p.v<0.02){p.v=0.02;p.dv=Math.abs(p.dv);} if(p.v>(y0===undefined?0.98:y0)){p.v=(y0===undefined?0.98:y0);p.dv=-Math.abs(p.dv);}
}
function newGas(type,spd,u,v){ const a=Math.random()*6.283; return {u:u===undefined?Math.random():u,v:v===undefined?Math.random():v,du:Math.cos(a)*spd,dv:Math.sin(a)*spd,type,age:0}; }
function poisson(rate,dt){ let n=0,x=rate*dt; while(x>0){ if(Math.random()<Math.min(1,x)) n++; x-=1; } return n; }
/* plot frame with mappers */
function plotFrame(ctx,r,o){
  const {x,y,w,h}=r;
  const X=v=>x+(v-o.x0)/(o.x1-o.x0)*w, Y=v=>y+h-(v-o.y0)/(o.y1-o.y0)*h;
  ctx.save();
  (o.yTicks||[]).forEach(([v,l])=>{ line(ctx,x,Y(v),x+w,Y(v),'#e6edf6',1); line(ctx,x-4,Y(v),x,Y(v),COL.ink,1.4); textAt(ctx,l,x-7,Y(v)+4,{align:'right',size:10.5,weight:600,color:COL.muted}); });
  (o.xTicks||[]).forEach(([v,l])=>{ line(ctx,X(v),y,X(v),y+h,'#eef3f9',1); line(ctx,X(v),y+h,X(v),y+h+4,COL.ink,1.4); textAt(ctx,l,X(v),y+h+16,{align:'center',size:10.5,weight:600,color:COL.muted}); });
  line(ctx,x,y,x,y+h,COL.ink,2.2); line(ctx,x,y+h,x+w,y+h,COL.ink,2.2);
  if(o.xl) textAt(ctx,o.xl,x+w/2,y+h+33,{align:'center',size:11.5,weight:700,color:COL.ink});
  if(o.yl){ ctx.translate(x-(o.ylOff||38),y+h/2); ctx.rotate(-Math.PI/2); textAt(ctx,o.yl,0,0,{align:'center',size:11.5,weight:700,color:COL.ink}); }
  ctx.restore();

}
function polyline(ctx,pts,col,wd,dash){
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=wd||2.4; ctx.lineJoin='round'; ctx.setLineDash(dash||[]);
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore();
}
function dot(ctx,x,y,r,col){ circ(ctx,x,y,r+3,col,'#fff',2); circ(ctx,x,y,r-1,col,col,1); }
/* chip label in canvas */
function pill(ctx,x,y,txt,col,align){

  const bx=align==='center'?x-tw/2-7:align==='right'?x-tw-14:x;

/* open beaker. returns geometry; liquid surface waves */
function beakerDraw(ctx,x,y,w,h,lvl,tint,t,opts){
  opts=opts||{}; const sy=y+h*(1-lvl);
  ctx.save(); ctx.lineJoin='round';
  if(lvl>0.01){ ctx.fillStyle=tint||'rgba(47,143,224,0.12)'; ctx.beginPath(); ctx.moveTo(x+2,sy); for(let i=0;i<=20;i++) ctx.lineTo(x+2+(w-4)*i/20,sy+Math.sin(i*0.9+t*(opts.agit||2))*(opts.amp||1.5)); ctx.lineTo(x+w-2,y+h-2); ctx.lineTo(x+2,y+h-2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=COL.blue; ctx.lineWidth=2; ctx.beginPath(); for(let i=0;i<=20;i++){ const xx=x+2+(w-4)*i/20, yy=sy+Math.sin(i*0.9+t*(opts.agit||2))*(opts.amp||1.5); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);} ctx.stroke(); }
  ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x-5,y-6); ctx.quadraticCurveTo(x,y-6,x,y); ctx.lineTo(x,y+h-8); ctx.quadraticCurveTo(x,y+h,x+8,y+h); ctx.lineTo(x+w-8,y+h); ctx.quadraticCurveTo(x+w,y+h,x+w,y+h-8); ctx.lineTo(x+w,y); ctx.quadraticCurveTo(x+w,y-6,x+w+5,y-6); ctx.stroke();
  if(opts.grad){ for(let i=1;i<=opts.grad;i++){ const yy=y+h-(h-6)*i/opts.grad; line(ctx,x+w-(i%2?10:16),yy,x+w,yy,COL.mid,1.3); } }
  ctx.restore();
  return {x,y,w,h,sy};
}
function fmtSci(x,d){ if(!isFinite(x)||x===0) return '0'; const e=Math.floor(Math.log10(Math.abs(x))); const m=x/Math.pow(10,e); return (e>=-2&&e<=3)?fmt(x,d===undefined?3:d):fmt(m,d===undefined?2:Math.min(d,2))+'×10'+String(e).replace(/-/g,'⁻').replace(/\d/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]); }
function sup(n){ return String(n).replace(/-/g,'⁻').replace(/\d/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]); }

function sig(x,n){ if(!isFinite(x)) return '—'; if(x===0) return '0'; const d=Math.max(0,n-1-Math.floor(Math.log10(Math.abs(x)))); return Number(x.toFixed(Math.min(d,6))).toString(); }

function niceStep(v){ const e=Math.pow(10,Math.floor(Math.log10(v))), m=v/e; return (m<=1.5?1:m<=3?2:m<=7?5:10)*e; }
function niceTicks(max,n){ const st=niceStep(max/(n||4)); const a=[]; for(let v=0;v<=max+1e-9;v+=st) a.push([v,fmt(v,st<1?2:0)]); return a; }

/* ease a slider element toward a target (set by preset chips); a user drag cancels it */
function sliderGlide(el){
  const S={tgt:null,cur:+el.value};
  el.addEventListener("input",()=>{ S.tgt=null; S.cur=+el.value; });
  S.step=(dt,rate)=>{ if(S.tgt===null){ S.cur=+el.value; return; } S.cur=approach(S.cur,S.tgt,rate||6,dt); if(Math.abs(S.cur-S.tgt)<0.002*(+el.max-+el.min)){ S.cur=S.tgt; S.tgt=null; } el.value=S.cur; };
  return S;
}

/* ---------------------------------------------------------------------
   0d. CHAPTER-2 TOOLKIT — constants, wires + electron flow, meters,
       rods, half-cell beakers with ions (all line diagrams, all animated)
   --------------------------------------------------------------------- */
const FAR = 96487;            // C mol⁻¹
const NERN = 0.059;           // 2.303RT/F at 298 K, as used in the textbook
const CAT_COL = COL.blue, AN_COL = COL.green, E_COL = COL.red, CTL = COL.yellow;
const SUB = n => String(n).replace(/\d/g,c=>'₀₁₂₃₄₅₆₇₈₉'[+c]);

/* a polyline path you can walk along: P = mkPath([[x,y],...]) ; pathAt(P,s) */
function mkPath(pts){ const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])); return {pts,cum,len:cum[cum.length-1]}; }
function pathAt(P,s){ s=clamp(s,0,P.len); for(let i=1;i<P.cum.length;i++){ if(s<=P.cum[i]){ const t=(s-P.cum[i-1])/Math.max(1e-6,P.cum[i]-P.cum[i-1]); return [lerp(P.pts[i-1][0],P.pts[i][0],t),lerp(P.pts[i-1][1],P.pts[i][1],t)]; } } return P.pts[P.pts.length-1]; }
function drawPath(ctx,P,col,wd,dash){ polyline(ctx,P.pts,col||COL.ink,wd||3,dash); }
/* evenly spaced carriers marching along a path; phase is advanced by the caller (signed) */
function carriers(ctx,P,phase,gap,col,r,glyph){
  const off=((phase%gap)+gap)%gap;
  for(let s=off;s<P.len;s+=gap){ const [x,y]=pathAt(P,s); circ(ctx,x,y,r,col,'#fff',2);
    if(glyph) textAt(ctx,glyph,x,y+r*0.42,{align:'center',size:r*1.35,weight:700,color:col}); }
}
/* little ion: blue + (cation) or green − (anion) */
function ionGlyph(ctx,x,y,sign,r,alpha){
  const col=sign>0?CAT_COL:AN_COL; ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha;
  circ(ctx,x,y,r,col,'#fff',1.8);
  line(ctx,x-r*0.5,y,x+r*0.5,y,col,1.6); if(sign>0) line(ctx,x,y-r*0.5,x,y+r*0.5,col,1.6);
  ctx.restore();
}
function electronDot(ctx,x,y,r){ circ(ctx,x,y,r,E_COL,E_COL,1); }

/* dial meter with a spring-damped needle. st = {x,v} spring state; val within [min,max] */
function dialMeter(ctx,cx,cy,r,st,val,min,max,label,unit,col,dt,dec){
  springTo(st,clamp(val,min,max),70,11,dt);
  const a0=Math.PI*1.12, a1=Math.PI*1.88;
  const ang=v=>lerp(a0,a1,(v-min)/(max-min));
  ctx.save();
  circ(ctx,cx,cy,r,COL.ink,'#fff',3);
  ctx.beginPath(); ctx.arc(cx,cy,r*0.86,a0,a1); ctx.strokeStyle='#dbe4f0'; ctx.lineWidth=r*0.1; ctx.stroke();
  const zero=(min<0&&max>0)?ang(0):null;
  const na=ang(st.x), base=zero===null?a0:zero;
  ctx.beginPath(); ctx.arc(cx,cy,r*0.86,Math.min(base,na),Math.max(base,na)); ctx.strokeStyle=col; ctx.lineWidth=r*0.1; ctx.stroke();
  for(let i=0;i<=10;i++){ const aa=lerp(a0,a1,i/10), l=i%5===0?0.2:0.12; line(ctx,cx+Math.cos(aa)*r*0.72,cy+Math.sin(aa)*r*0.72,cx+Math.cos(aa)*r*(0.72-l),cy+Math.sin(aa)*r*(0.72-l),COL.ink,i%5===0?1.8:1); }
  line(ctx,cx,cy,cx+Math.cos(na)*r*0.74,cy+Math.sin(na)*r*0.74,COL.red,2.6);
  circ(ctx,cx,cy,r*0.07,COL.ink,COL.ink,1);
  ctx.restore();
  textAt(ctx,fmt(val,dec===undefined?2:dec)+' '+unit,cx,cy+r*0.5,{align:'center',size:Math.max(11,r*0.28),weight:700,color:col});
  textAt(ctx,label,cx,cy+r+17,{align:'center',size:12,weight:700,color:COL.ink});
}
/* a rod/plate dipping in a beaker. frac = how much of the full width is left (0.3…1). dep = deposit thickness px */
function rodDraw(ctx,x,top,bot,w,fill,frac,dep,depFill){
  const ww=w*clamp(frac,0.25,1.3), xx=x-ww/2;
  if(dep>0.3){ ctx.save(); ctx.fillStyle=depFill||'#d9965b'; ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6; ctx.fillRect(xx-dep,top+(bot-top)*0.38,ww+dep*2,(bot-top)*0.62); ctx.strokeRect(xx-dep,top+(bot-top)*0.38,ww+dep*2,(bot-top)*0.62); ctx.restore(); }
  rect(ctx,xx,top,ww,bot-top,COL.ink,fill,2.4);
}
/* ion cloud inside a rectangle, cation/anion sets with target counts (gently adds/removes) */
function ionBox(){ return {cat:[],an:[]}; }
function ionStep(B,dt,nCat,nAn,spd,spawnCat,spawnAn){
  const sync=(arr,n,sp)=>{ while(arr.length<n){ const s=sp?sp():null; arr.push({u:s?s[0]:Math.random(),v:s?s[1]:Math.random(),a:Math.random()*6.28,pop:0}); }
    if(arr.length>n){ const i=Math.floor(Math.random()*arr.length); arr.splice(i,1); } };
  sync(B.cat,Math.round(nCat),spawnCat); sync(B.an,Math.round(nAn),spawnAn);
  B.cat.forEach(p=>wander(p,dt,spd,3)); B.an.forEach(p=>wander(p,dt,spd,3));
}
function ionDraw(ctx,B,x,y,w,h,r){
  B.cat.forEach(p=>ionGlyph(ctx,x+p.u*w,y+p.v*h,1,r)); B.an.forEach(p=>ionGlyph(ctx,x+p.u*w,y+p.v*h,-1,r));
}
/* salt bridge (inverted U) between two beakers: returns the path the ions travel */
function saltBridge(ctx,x1,x2,yTop,yIn,wd,tint){
  const rr=wd*1.1, P=[[x1,yIn],[x1,yTop+rr],[x1+rr,yTop],[x2-rr,yTop],[x2,yTop+rr],[x2,yIn]];
  ctx.save(); ctx.lineJoin="round"; ctx.lineCap="butt";
  ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.strokeStyle=COL.ink; ctx.lineWidth=wd+5; ctx.stroke();
  ctx.strokeStyle=tint||"#f2f6fb"; ctx.lineWidth=wd-1; ctx.stroke(); ctx.restore();
  return mkPath(P);
}
/* a battery symbol (long line +, short line −) drawn between two points on a wire */
function batterySym(ctx,x,y,vertical,flip,col){
  ctx.save(); ctx.translate(x,y); if(vertical) ctx.rotate(Math.PI/2); if(flip) ctx.scale(-1,1);
  line(ctx,-6,-14,-6,14,col,3); line(ctx,6,-8,6,8,col,3); ctx.restore();
}
/* bulb: glow ∝ level (0…1) */
function bulb(ctx,cx,cy,r,level,t){
  const g=clamp(level,0,1);
  if(g>0.02){ ctx.save(); const grd=ctx.createRadialGradient(cx,cy,r*0.2,cx,cy,r*(1.6+g)); grd.addColorStop(0,'rgba(255,214,70,'+(0.5*g)+')'); grd.addColorStop(1,'rgba(255,214,70,0)'); ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx,cy,r*(1.6+g),0,7); ctx.fill(); ctx.restore();
    for(let i=0;i<10;i++){ const a=i/10*6.283+t*0.5, r1=r*1.15, r2=r*(1.3+0.35*g*(0.7+0.3*Math.sin(t*9+i))); line(ctx,cx+Math.cos(a)*r1,cy+Math.sin(a)*r1,cx+Math.cos(a)*r2,cy+Math.sin(a)*r2,COL.yellow,2); } }
  circ(ctx,cx,cy,r,COL.ink,g>0.02?mixCol('#ffffff','#ffe27a',g):'#fff',2.6);
  ctx.save(); ctx.strokeStyle=g>0.02?COL.red:COL.mid; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx-r*0.4,cy+r*0.9); ctx.lineTo(cx-r*0.4,cy+r*0.1); ctx.lineTo(cx-r*0.2,cy-r*0.2); ctx.lineTo(cx,cy+r*0.1); ctx.lineTo(cx+r*0.2,cy-r*0.2); ctx.lineTo(cx+r*0.4,cy+r*0.1); ctx.lineTo(cx+r*0.4,cy+r*0.9); ctx.stroke(); ctx.restore();
  rect(ctx,cx-r*0.4,cy+r*0.98,r*0.8,r*0.42,COL.ink,'#eef2f8',2);
}
/* gas bubble rising */
function bubble(ctx,x,y,r,col){ circ(ctx,x,y,r,col,'rgba(255,255,255,0.75)',1.6); }

/* a reusable bubble stream: streams of {x,y,r,vy,ph} born at (x0,y0) up to ytop */
function bubbleStep(arr,dt,rate,x0,y0,ytop,spread,col,rmin,rmax){
  const n=poisson(rate,dt); for(let i=0;i<n;i++) arr.push({x:x0+(Math.random()-0.5)*spread,y:y0,r:rmin+Math.random()*(rmax-rmin),vy:40+Math.random()*50,ph:Math.random()*6,col});
  for(let i=arr.length-1;i>=0;i--){ const b=arr[i]; b.y-=b.vy*dt; b.x+=Math.sin(b.y*0.07+b.ph)*0.35; if(b.y<ytop) arr.splice(i,1); }
}
function bubbleDraw(ctx,arr){ arr.forEach(b=>bubble(ctx,b.x,b.y,b.r,b.col)); }

/* small data helpers */
function log10(x){ return Math.log(x)/Math.LN10; }
function niceTop(v){ const e=Math.pow(10,Math.floor(log10(v))); const m=v/e; return (m<=1?1:m<=2?2:m<=5?5:10)*e; }
function dashPill(ctx,x,y,txt,col){ pill(ctx,x,y,txt,col,'center'); }
function sciStr(x){ if(!isFinite(x)||x===0) return '0'; const e=Math.floor(log10(Math.abs(x))); const m=x/Math.pow(10,e); return (e>=-3&&e<=4)?fmt(x,e<0?4:2):fmt(m,2)+'×10'+sup(e); }
/* preset chips that glide a slider (cancelled by a manual drag) */
function presetRow(id,label,items){ return `<label style="margin-bottom:5px;">${label}</label><div class="toggle-group" id="${id}">`+items.map((t,i)=>`<button class="toggle-btn small" data-i="${i}">${t}</button>`).join('')+`</div>`; }

/* =====================================================================
   2.1 DANIELL CELL — galvanic cell ⇄ electrolytic cell (Fig 2.1, 2.2)
   Zn|Zn²⁺ ‖ Cu²⁺|Cu , E°cell = 1.10 V.  An external voltage E_ext opposes the cell.
   Net drive = E°cell − E_ext :  >0 galvanic (e⁻ Zn→Cu) · =0 no reaction · <0 electrolytic (reverse)
   I = (E°cell − E_ext)/R , R = 13.75 Ω  (so the ammeter reads ≈ ±70 mA per volt of net drive)
   ===================================================================== */
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group">${uiSlider('ev','External voltage E_ext',0,2,0.01,0.3,CTL)}
      <div style="height:8px"></div>${presetRow('pre','Quick set',['Below 1.1 V','Exactly 1.10 V','Above 1.1 V'])}</div>
    <div class="control-group"><div class="result-cards">
      ${uiCard('c1','Cell emf E°',CAT_COL)}${uiCard('c2','Net drive')}
      ${uiCard('c3','Current',E_COL)}${uiCard('c4','Electrons flow')}
      ${uiCard('c5','Mode',null,true)}</div>
      <button class="toggle-btn navy" id="rst">Reset electrodes</button></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), evR=$('#ev'), gl=sliderGlide(evR);
  wrap.querySelectorAll('#pre .toggle-btn').forEach(b=>b.onclick=()=>{ gl.tgt=[0.3,1.1,1.7][+b.dataset.i]; });
  let t=0, cur=0, ph=0, bph=0, extent=0; const nd={x:0,v:0};
  $('#rst').onclick=()=>{ extent=0; };
  const Bz=ionBox(), Bc=ionBox();
  animLoop(dt=>{
    t+=dt; gl.step(dt,5);
    const E0=1.10, Eext=+evR.value, net=E0-Eext, Ima=net/13.75*1000;
    $('#evV').textContent=fmt(Eext,2)+' V';
    cur=approach(cur,Ima,5,dt);
    const I=cur/80;                                // normalised for animation speed
    extent=clamp(extent+I*0.05*dt,-1,1);
    const mode=Math.abs(net)<0.015?0:(net>0?1:-1);
    $('#c1').textContent='1.10 V'; $('#c2').textContent=(net>=0?'+':'')+fmt(net,2)+' V';
    $('#c3').textContent=fmt(Math.abs(cur)<0.5?0:cur,0)+' mA';
    $('#c4').textContent=mode===0?'none':(mode>0?'Zn → Cu':'Cu → Zn');
    $('#c5').textContent=mode===0?'Equilibrium — no reaction':(mode>0?'Galvanic cell (E_ext < 1.1 V)':'Electrolytic cell (E_ext > 1.1 V)');

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const bw=Math.min(w*0.30,250), gap=w*0.14, bh=Math.min(h*0.36,230);
    const lx=(w-2*bw-gap)/2, rx=lx+bw+gap, by=h*0.50;
    const rw=Math.max(14,bw*0.09), zx=lx+bw*0.30, cx=rx+bw*0.70;
    const rTop=by-h*0.20, rBot=by+bh-14;
    // liquids
    const cuN=10-7*extent, znN=8+7*extent;
    const gz=beakerDraw(ctx,lx,by,bw,bh,0.78,'rgba(47,143,224,0.07)',t,{amp:1.2,agit:1.5});
    const gc=beakerDraw(ctx,rx,by,bw,bh,0.78,'rgba(47,143,224,'+(0.07+0.014*cuN)+')',t,{amp:1.2,agit:1.5});
    ionStep(Bz,dt,znN,znN,14,()=>[clamp((zx-lx)/bw+(Math.random()-0.5)*0.12,0.05,0.95),Math.random()],null);
    ionStep(Bc,dt,cuN,cuN,14,null,null);
    ionDraw(ctx,Bz,lx+8,gz.sy+8,bw-16,bh*0.78-16,6.5); ionDraw(ctx,Bc,rx+8,gc.sy+8,bw-16,bh*0.78-16,6.5);
    // rods
    rodDraw(ctx,zx,rTop,rBot,rw,'#cfd8e3',1-0.4*Math.max(extent,0),Math.max(-extent,0)*7,'#e6ecf3');
    rodDraw(ctx,cx,rTop,rBot,rw,'#e8b48a',1-0.4*Math.max(-extent,0),Math.max(extent,0)*7,'#e0a070');
    // salt bridge + its moving ions
    const sbx1=lx+bw*0.62, sbx2=rx+bw*0.38, sbw=Math.min(22,bw*0.1);
    const SB=saltBridge(ctx,sbx1,sbx2,by-h*0.11,by+bh*0.30,sbw,'#f2f6fb');
    bph+=I*70*dt;
    carriers(ctx,SB,bph,34,CAT_COL,5.5,'+'); carriers(ctx,SB,-bph+17,34,AN_COL,5.5,'−');
    // wire loop (Zn top → meter → battery → Cu top), electrons march along it
    const mr=Math.min(46,h*0.085), yw=Math.max(h*0.13,mr+12);
    const W=mkPath([[zx,rTop],[zx,yw],[cx,yw],[cx,rTop]]);
    drawPath(ctx,W,COL.ink,3);
    ph+=I*110*dt;
    carriers(ctx,W,ph,26,E_COL,4.2);
    // electron dots are hidden under the meter/battery masks
    const mx=(zx+cx)/2, bx=zx+(cx-zx)*0.78;
    rect(ctx,bx-10,yw-17,20,34,COL.ink,'#fff',0); batterySym(ctx,bx,yw,false,false,CTL);
    textAt(ctx,'E_ext = '+fmt(Eext,2)+' V',bx,yw-24,{align:'center',size:12,weight:700,color:CTL});
    dialMeter(ctx,mx-(cx-zx)*0.10,yw,mr,nd,Math.abs(cur)<0.5?0:cur,-100,100,'Ammeter','mA',E_COL,dt,0);
    // role tags
    const znRole=mode>0?'anode (−)':mode<0?'cathode (−)':'Zn', cuRole=mode>0?'cathode (+)':mode<0?'anode (+)':'Cu';
    pill(ctx,zx,rTop-14,znRole,mode===0?COL.mid:(mode>0?E_COL:CAT_COL),'center'); pill(ctx,cx,rTop-14,cuRole,mode===0?COL.mid:(mode>0?CAT_COL:E_COL),'center');
    textAt(ctx,'ZnSO₄  1 M',lx+bw/2,by+bh+22,{align:'center',size:12.5,weight:700,color:COL.ink});
    textAt(ctx,'CuSO₄  1 M',rx+bw/2,by+bh+22,{align:'center',size:12.5,weight:700,color:COL.ink});
    textAt(ctx,'salt bridge',(sbx1+sbx2)/2,by-h*0.11-10,{align:'center',size:11,weight:600,color:COL.muted});
    const L1=mode>=0?'Zn → Zn²⁺ + 2e⁻':'Zn²⁺ + 2e⁻ → Zn', L2=mode>=0?'Cu²⁺ + 2e⁻ → Cu':'Cu → Cu²⁺ + 2e⁻';
    if(mode!==0){ textAt(ctx,L1,lx+bw/2,by+bh+42,{align:'center',size:12,weight:600,color:mode>0?E_COL:CAT_COL}); textAt(ctx,L2,rx+bw/2,by+bh+42,{align:'center',size:12,weight:600,color:mode>0?CAT_COL:E_COL}); }
    else textAt(ctx,'E_ext = E°cell  →  I = 0, reaction stops',w/2,by+bh+42,{align:'center',size:12.5,weight:700,color:COL.muted});
    pill(ctx,w/2,h-16,mode===0?'EQUILIBRIUM':(mode>0?'GALVANIC CELL — chemical → electrical':'ELECTROLYTIC CELL — electrical → chemical'),mode===0?COL.mid:(mode>0?COL.green:COL.red),'center');
  });
  return wrap;
}

/* =====================================================================
   2.2 ELECTRODE POTENTIALS — any two half-cells, SHE as zero (Table 2.1, Fig 2.3)
   E°cell = E°right − E°left ; electrons flow from the lower-E° half-cell (anode)
   to the higher-E° half-cell (cathode).  Cu|Ag → 0.46 V (Ex 2.2) · Zn|Cu → 1.10 V
   ===================================================================== */
const MET2=[
 {k:'SHE',lab:'SHE  (H⁺/H₂)',E:0.00,ne:1,ion:'H⁺',fill:'#e9edf2',she:true},
 {k:'Li',lab:'Li⁺/Li',E:-3.05,ne:1,ion:'Li⁺',fill:'#e8e3f0'},
 {k:'Mg',lab:'Mg²⁺/Mg',E:-2.36,ne:2,ion:'Mg²⁺',fill:'#e5e9ee'},
 {k:'Al',lab:'Al³⁺/Al',E:-1.66,ne:3,ion:'Al³⁺',fill:'#e0e6ec'},
 {k:'Zn',lab:'Zn²⁺/Zn',E:-0.76,ne:2,ion:'Zn²⁺',fill:'#cfd8e3'},
 {k:'Fe',lab:'Fe²⁺/Fe',E:-0.44,ne:2,ion:'Fe²⁺',fill:'#c9ced6'},
 {k:'Ni',lab:'Ni²⁺/Ni',E:-0.25,ne:2,ion:'Ni²⁺',fill:'#d8dde3'},
 {k:'Pb',lab:'Pb²⁺/Pb',E:-0.13,ne:2,ion:'Pb²⁺',fill:'#bcc3cd'},
 {k:'Cu',lab:'Cu²⁺/Cu',E:0.34,ne:2,ion:'Cu²⁺',fill:'#e8b48a'},
 {k:'Ag',lab:'Ag⁺/Ag',E:0.80,ne:1,ion:'Ag⁺',fill:'#eef1f5'},
 {k:'Au',lab:'Au³⁺/Au',E:1.40,ne:3,ion:'Au³⁺',fill:'#f1d48a'}];
function halfRx(m,ox){ const e=m.ne===1?'e⁻':m.ne+'e⁻'; if(m.she) return ox?'½H₂ → H⁺ + e⁻':'H⁺ + e⁻ → ½H₂'; return ox?m.k+' → '+m.ion+' + '+e:m.ion+' + '+e+' → '+m.k; }
function buildA2(){
  const wrap=labShell();
  const opts=MET2.map((m,i)=>`<option value="${i}">${m.lab}</option>`).join('');
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Choose the two half-cells</label>
      <div class="role-row"><span class="rdot" style="background:${CTL}"></span><span class="rname">Left</span><select id="selL">${opts}</select></div>
      <div class="role-row"><span class="rdot" style="background:${CTL}"></span><span class="rname">Right</span><select id="selR">${opts}</select></div>
      <div style="height:8px"></div>${presetRow('pre','Try these',['Zn | Cu','Cu | Ag','SHE | Cu','SHE | Zn'])}</div>
    <div class="control-group"><div class="result-cards">
      ${uiCard('c1','E° left')}${uiCard('c2','E° right')}
      ${uiCard('c3','E°cell = E°R − E°L',CAT_COL,true)}
      ${uiCard('c4','Anode (oxidation)',E_COL,true)}${uiCard('c5','Cathode (reduction)',CAT_COL,true)}</div>
      <div class="hint">All ions 1 M · H₂ gas 1 bar · 298 K</div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), sL=$('#selL'), sR=$('#selR');
  const idx=k=>MET2.findIndex(m=>m.k===k);
  const setPair=(a,b)=>{ sL.value=idx(a); sR.value=idx(b); };
  setPair('Zn','Cu');
  wrap.querySelectorAll('#pre .toggle-btn').forEach(b=>b.onclick=()=>{ [['Zn','Cu'],['Cu','Ag'],['SHE','Cu'],['SHE','Zn']].slice(+b.dataset.i)[0].forEach((k,j)=>{ (j?sR:sL).value=idx(k); }); });
  let t=0, ph=0, ext=0, lastKey=''; const nd={x:0,v:0}; const BL=ionBox(), BR=ionBox(); const gasL=[], gasR=[];
  animLoop(dt=>{
    t+=dt;
    const L=MET2[+sL.value], R=MET2[+sR.value], Ecell=R.E-L.E;
    const key=sL.value+'/'+sR.value; if(key!==lastKey){ lastKey=key; ext=0; }
    const dir=Ecell>0.005?1:Ecell<-0.005?-1:0;                 // electrons: +1 = left → right
    ext=clamp(ext+Math.abs(Ecell)/2.5*0.05*dt,0,1);
    ph+=dir*Math.min(190,40+Math.abs(Ecell)*55)*dt;
    const anodeLeft=dir>=0;                                     // equal ⇒ draw left as anode
    const A=anodeLeft?L:R, C=anodeLeft?R:L;
    $('#c1').textContent=(L.E>0?'+':'')+fmt(L.E,2)+' V'; $('#c2').textContent=(R.E>0?'+':'')+fmt(R.E,2)+' V';
    $('#c3').textContent=(Ecell>0?'+':'')+fmt(Ecell,2)+' V';
    $('#c4').textContent=dir===0?'—':halfRx(A,true); $('#c5').textContent=dir===0?'—':halfRx(C,false);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const lw0=w*0.62, bw=Math.min(lw0*0.36,200), gap=lw0*0.16, bh=Math.min(h*0.34,210);
    const lx=(lw0-2*bw-gap)/2+w*0.015, rx=lx+bw+gap, by=h*0.52, rw=Math.max(13,bw*0.1);
    const rTop=by-h*0.20, rBot=by+bh-14;
    [[L,lx,BL,gasL,dir>0],[R,rx,BR,gasR,dir<0]].forEach(([M,x0,B,gas,isAnode],k)=>{
      const asAnode=(k===0)===anodeLeft && dir!==0, asCath=(k===0)!==anodeLeft && dir!==0;
      const g=beakerDraw(ctx,x0,by,bw,bh,0.76,'rgba(47,143,224,0.09)',t,{amp:1,agit:1.4});
      const nC=M.she?9:(asAnode?6+6*ext:asCath?8-4*ext:7);
      ionStep(B,dt,nC,M.she?5:7,13,null,null);
      ionDraw(ctx,B,x0+8,g.sy+8,bw-16,bh*0.76-16,6);
      const rx0=x0+bw*0.5;
      if(M.she){                                              // Pt foil in a gas jacket, H₂ bubbling
        rect(ctx,rx0-bw*0.2,by+bh*0.12,bw*0.4,bh*0.82,COL.mid,'rgba(255,255,255,0.4)',1.6);
        rect(ctx,rx0-rw/2,rTop,rw,rBot-rTop-6,COL.ink,'#e9edf2',2.4);
        bubbleStep(gas,dt,9,rx0,by+bh-16,by+bh*0.14,bw*0.22,COL.blue,2.5,4.5); bubbleDraw(ctx,gas);
        textAt(ctx,'Pt',rx0,rTop+14,{align:'center',size:10.5,weight:700,color:COL.muted});
        textAt(ctx,'H₂ 1 bar',rx0,by+bh+6+18,{align:'center',size:10.5,weight:600,color:COL.blue});
      } else {
        rodDraw(ctx,rx0,rTop,rBot,rw,M.fill,asAnode?1-0.4*ext:1,asCath?ext*6:0,M.fill);
      }
      textAt(ctx,M.she?'H⁺ 1 M':M.ion+'  1 M',x0+bw/2,by+bh+22+(M.she?14:0),{align:'center',size:12,weight:700,color:COL.ink});
      if(dir!==0){ const lab=asAnode?'anode (−)':'cathode (+)'; pill(ctx,rx0,rTop-14,lab,asAnode?E_COL:CAT_COL,'center'); }
      else pill(ctx,rx0,rTop-14,M.she?'SHE':M.k,COL.mid,'center');
    });
    // salt bridge
    const sbx1=lx+bw*0.80, sbx2=rx+bw*0.20, sbw=Math.min(20,bw*0.1);
    const SB=saltBridge(ctx,sbx1,sbx2,by-h*0.10,by+bh*0.28,sbw,'#f2f6fb');
    carriers(ctx,SB,dir*ph*0.6,34,CAT_COL,5,'+'); carriers(ctx,SB,-dir*ph*0.6+17,34,AN_COL,5,'−');
    // wire + meter
    const mr=Math.min(44,h*0.08), yw=Math.max(h*0.13,mr+12), zx=lx+bw*0.5, cx=rx+bw*0.5;
    const Wp=mkPath([[zx,rTop],[zx,yw],[cx,yw],[cx,rTop]]); drawPath(ctx,Wp,COL.ink,3); carriers(ctx,Wp,ph,26,E_COL,4.2);
    dialMeter(ctx,(zx+cx)/2,yw,mr,nd,Ecell,-4.5,4.5,'Voltmeter','V',COL.blue,dt,2);
    // potential ladder
    const px=w*0.78, y0=h*0.08, y1=h*0.92, Vmin=-3.4, Vmax=1.7, Y=v=>y1-(v-Vmin)/(Vmax-Vmin)*(y1-y0);
    line(ctx,px,y0,px,y1,COL.ink,2.4); arrowHead(ctx,px,y0,-Math.PI/2,COL.ink,8);
    textAt(ctx,'E° (V)',px,y0-8,{align:'center',size:11.5,weight:700,color:COL.ink});
    MET2.forEach((m,i)=>{ const yy=Y(m.E), side=(i%2===0)?-1:1; const isL=m===L, isR=m===R, sel=isL||isR;
      const isAn=m===A&&dir!==0, isCa=m===C&&dir!==0;
      const c2=isAn?E_COL:isCa?CAT_COL:(sel?CTL:COL.mid);
      line(ctx,px-6,yy,px+6,yy,c2,sel?3.2:1.6);
      textAt(ctx,(m.she?"SHE  ":m.lab+"  ")+(m.E>0?"+":"")+fmt(m.E,2),px+(side<0?-12:12),yy+4,{align:side<0?"right":"left",size:sel?11.5:10,weight:sel?700:500,color:sel?c2:COL.muted});
    });
    // potential difference bracket between the two
    if(dir!==0){ const ya=Y(A.E), yc=Y(C.E), bx=w-22; line(ctx,px+6,ya,bx,ya,E_COL,1.4,[3,3]); line(ctx,px+6,yc,bx,yc,CAT_COL,1.4,[3,3]);
      vec(ctx,bx,ya,bx,yc,CTL,3); pill(ctx,Math.min(bx,w-34),(ya+yc)/2,fmt(Math.abs(Ecell),2)+' V',CTL,'center'); }
    pill(ctx,lw0*0.5+w*0.015,h-16,dir===0?'Same half-cell — no potential difference':'Electrons leave the lower E° and flow to the higher E°',dir===0?COL.mid:COL.red,'center');
  });
  return wrap;
}

/* =====================================================================
   2.3 NERNST EQUATION — concentration changes the cell potential (§2.3)
   E = E° − (0.059/n)·log Q ,  Q = [anode ion]^a / [cathode ion]^c
   Check (Ex 2.1):  Mg|Ag  E°=3.17 V, [Mg²⁺]=0.130, [Ag⁺]=1×10⁻⁴  →  E = 2.96 V
   Check (Intext 2.5): Ni|Ag E°=1.05 V, [Ni²⁺]=0.160, [Ag⁺]=0.002  →  E = 0.91 V
   ===================================================================== */
const CELL3=[
 {n:'Zn | Cu',E0:1.10,ne:2,an:'Zn²⁺',ca:'Cu²⁺',aM:'Zn',cM:'Cu',ea:1,ec:1,aF:'#cfd8e3',cF:'#e8b48a',ex:null},
 {n:'Mg | Ag',E0:3.17,ne:2,an:'Mg²⁺',ca:'Ag⁺',aM:'Mg',cM:'Ag',ea:1,ec:2,aF:'#e5e9ee',cF:'#eef1f5',ex:[0.130,0.0001]},
 {n:'Ni | Ag',E0:1.05,ne:2,an:'Ni²⁺',ca:'Ag⁺',aM:'Ni',cM:'Ag',ea:1,ec:2,aF:'#d8dde3',cF:'#eef1f5',ex:[0.160,0.002]},
 {n:'Cu | Ag',E0:0.46,ne:2,an:'Cu²⁺',ca:'Ag⁺',aM:'Cu',cM:'Ag',ea:1,ec:2,aF:'#e8b48a',cF:'#eef1f5',ex:null}];
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group">${uiChips('cl','Cell',CELL3.map(c=>c.n),0)}</div>
    <div class="control-group">${uiSlider('la','log [anode ion]',-4,0.5,0.01,0,CAT_COL)}
      <div style="height:8px"></div>${uiSlider('lc','log [cathode ion]',-4,0.5,0.01,0,CAT_COL)}
      <div style="height:8px"></div>
      <div class="toggle-group"><button class="toggle-btn small" id="pS">Standard 1 M</button><button class="toggle-btn small" id="pD">Dilute cathode</button><button class="toggle-btn small" id="pX">Textbook values</button></div></div>
    <div class="control-group"><div class="result-cards">
      ${uiCard('c1','E° (standard)')}${uiCard('c2','E (this cell)',CAT_COL)}
      ${uiCard('c3','Q')}${uiCard('c4','log Q')}
      ${uiCard('c5','Correction −(0.059/n)·log Q',null,true)}</div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), laR=$('#la'), lcR=$('#lc'), gA=sliderGlide(laR), gC=sliderGlide(lcR);
  let ci=0, t=0, ph=0; const nd={x:0,v:0}; const BA=ionBox(), BC=ionBox();
  bindChips(wrap,'cl',i=>{ ci=i; });
  $('#pS').onclick=()=>{ gA.tgt=0; gC.tgt=0; };
  $('#pD').onclick=()=>{ gA.tgt=0; gC.tgt=-3; };
  $('#pX').onclick=()=>{ const c=CELL3[ci]; if(c.ex){ gA.tgt=log10(c.ex[0]); gC.tgt=log10(c.ex[1]); } else { gA.tgt=-1; gC.tgt=-2; } };
  const cnt=lc=>Math.round(2+13*clamp((lc+4)/4.5,0,1));
  animLoop(dt=>{
    t+=dt; gA.step(dt,5); gC.step(dt,5);
    const C=CELL3[ci], la=+laR.value, lc=+lcR.value;
    const logQ=C.ea*la-C.ec*lc, E=C.E0-NERN/C.ne*logQ, corr=-NERN/C.ne*logQ;
    $('#laV').textContent=sciStr(Math.pow(10,la))+' M'; $('#lcV').textContent=sciStr(Math.pow(10,lc))+' M';
    $('#c1').textContent=fmt(C.E0,2)+' V'; $('#c2').textContent=fmt(E,2)+' V'; $('#c3').textContent=sciStr(Math.pow(10,logQ));
    $('#c4').textContent=fmt(logQ,2); $('#c5').textContent=(corr>=0?'+':'')+fmt(corr,3)+' V';
    ph+=Math.max(0,E)/C.E0*70*dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // --- left: the two half-cells ---
    const bw=w*0.215, bh=Math.min(h*0.34,220), lx=w*0.04, rx=lx+bw+w*0.065, by=h*0.50, rw=Math.max(13,bw*0.1);
    const rTop=by-h*0.18, rBot=by+bh-14, zx=lx+bw*0.3, cx=rx+bw*0.7;
    const gA2=beakerDraw(ctx,lx,by,bw,bh,0.76,'rgba(47,143,224,'+(0.04+0.02*cnt(la))+')',t,{amp:1,agit:1.4});
    const gC2=beakerDraw(ctx,rx,by,bw,bh,0.76,'rgba(47,143,224,'+(0.04+0.02*cnt(lc))+')',t,{amp:1,agit:1.4});
    ionStep(BA,dt,cnt(la),cnt(la),12,null,null); ionStep(BC,dt,cnt(lc),cnt(lc),12,null,null);
    ionDraw(ctx,BA,lx+8,gA2.sy+8,bw-16,bh*0.76-16,5.5); ionDraw(ctx,BC,rx+8,gC2.sy+8,bw-16,bh*0.76-16,5.5);
    rodDraw(ctx,zx,rTop,rBot,rw,C.aF,1,0); rodDraw(ctx,cx,rTop,rBot,rw,C.cF,1,0);
    const sbx1=lx+bw*0.66, sbx2=rx+bw*0.30, sbw=Math.min(18,bw*0.1);
    const SB=saltBridge(ctx,sbx1,sbx2,by-h*0.10,by+bh*0.28,sbw,'#f2f6fb');
    carriers(ctx,SB,ph*0.5,30,CAT_COL,5,'+'); carriers(ctx,SB,-ph*0.5+15,30,AN_COL,5,'−');
    const mr=Math.min(46,h*0.085), yw=Math.max(h*0.14,mr+12);
    const Wp=mkPath([[zx,rTop],[zx,yw],[cx,yw],[cx,rTop]]); drawPath(ctx,Wp,COL.ink,3); carriers(ctx,Wp,ph,26,E_COL,4.2);
    dialMeter(ctx,(zx+cx)/2,yw,mr,nd,E,0,Math.ceil((C.E0+0.4)*2)/2,'E','V',CAT_COL,dt,2);
    pill(ctx,zx,rTop-14,C.aM+'  (−)',E_COL,'center'); pill(ctx,cx,rTop-14,C.cM+'  (+)',CAT_COL,'center');
    textAt(ctx,C.an+'  '+sciStr(Math.pow(10,la))+' M',lx+bw/2,by+bh+22,{align:'center',size:12,weight:700,color:COL.ink});
    textAt(ctx,C.ca+'  '+sciStr(Math.pow(10,lc))+' M',rx+bw/2,by+bh+22,{align:'center',size:12,weight:700,color:COL.ink});
    textAt(ctx,'Q = ['+C.an+']'+(C.ea>1?sup(C.ea):'')+' / ['+C.ca+']'+(C.ec>1?sup(C.ec):''),lx+(rx+bw-lx)/2,by+bh+44,{align:'center',size:12.5,weight:700,color:COL.muted});
    // --- right: E against log Q ---
    const px=w*0.61, py=h*0.10, pw=w*0.34, ph2=h*0.62;
    const x0=-6, x1=9, yc=C.E0, yLo=yc-0.28, yHi=yc+0.22;
    const F=plotFrame(ctx,{x:px,y:py,w:pw,h:ph2},{x0,x1,y0:yLo,y1:yHi,xl:'log Q',yl:'E  (V)',ylOff:46,
      xTicks:[[-6,'−6'],[-3,'−3'],[0,'0'],[3,'3'],[6,'6'],[9,'9']],
      yTicks:[-0.2,-0.1,0,0.1,0.2].map(d=>[yc+d,fmt(yc+d,2)])});
    polyline(ctx,[[F.X(x0),F.Y(yc-NERN/C.ne*x0)],[F.X(x1),F.Y(yc-NERN/C.ne*x1)]],COL.blue,2.6);
    line(ctx,F.X(0),py,F.X(0),py+ph2,COL.mid,1.2,[4,4]);
    dot(ctx,F.X(0),F.Y(yc),4,COL.mid); textAt(ctx,'E°',F.X(0)+8,F.Y(yc)-8,{size:11,weight:700,color:COL.muted});
    const qx=clamp(logQ,x0,x1), qy=clamp(E,yLo,yHi);
    line(ctx,F.X(qx),F.Y(yLo),F.X(qx),F.Y(qy),CTL,1.4,[3,3]); line(ctx,px,F.Y(qy),F.X(qx),F.Y(qy),CTL,1.4,[3,3]);
    dot(ctx,F.X(qx),F.Y(qy),5,CTL);
    textAt(ctx,'E = E° − (0.059/'+C.ne+') log Q',px+pw/2,py-12,{align:'center',size:12.5,weight:700,color:COL.ink});
    pill(ctx,px+pw/2,py+ph2+58,'Q < 1 → E > E°      Q > 1 → E < E°',COL.blue,'center');
  });
  return wrap;
}

/* =====================================================================
   2.4 ENERGY & EQUILIBRIUM — ΔG = −nFE , E° = (0.059/n) log K  (§2.3.1, 2.3.2)
   The cell keeps running, Q climbs towards K, E falls to 0 and ΔG → 0.
   Check: Daniell  ΔG° = −2(96487)(1.10) = −212.27 kJ/mol (Ex 2.3) · K ≈ 2×10³⁷
          Cu|Ag    E° = 0.46 V → log K = 15.6 , K = 3.92×10¹⁵ (Ex 2.2)
          Fe³⁺/I⁻  E° = 0.236 V → ΔG° = −45.54 kJ/mol (Intext 2.6; K = 1.0×10⁸ with 0.059, book 9.62×10⁷ uses exact RT/F)
   ===================================================================== */
const CELL4=[
 {n:'Zn + Cu²⁺',E0:1.10,ne:2,rx:'Zn + Cu²⁺ ⇌ Zn²⁺ + Cu',aM:'Zn',cM:'Cu',aF:'#cfd8e3',cF:'#e8b48a',aI:'Zn²⁺',cI:'Cu²⁺',metal:true},
 {n:'Cu + 2Ag⁺',E0:0.46,ne:2,rx:'Cu + 2Ag⁺ ⇌ Cu²⁺ + 2Ag',aM:'Cu',cM:'Ag',aF:'#e8b48a',cF:'#eef1f5',aI:'Cu²⁺',cI:'Ag⁺',metal:true},
 {n:'2Fe³⁺ + 2I⁻',E0:0.236,ne:2,rx:'2Fe³⁺ + 2I⁻ ⇌ 2Fe²⁺ + I₂',aM:'Pt',cM:'Pt',aF:'#e9edf2',cF:'#e9edf2',aI:'I⁻',cI:'Fe³⁺',metal:false}];
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group">${uiChips('cl','Reaction in the cell',CELL4.map(c=>c.n),0)}</div>
    <div class="control-group">${uiSlider('lq','Reaction progress  log Q',0,40,0.01,0,CTL)}
      <div class="toggle-group"><button class="toggle-btn play" id="go">▶ Run the cell</button><button class="toggle-btn" id="rs">Reset</button></div></div>
    <div class="control-group"><div class="result-cards">
      ${uiCard('c1','E (cell)',CAT_COL)}${uiCard('c2','ΔG (kJ/mol)',E_COL)}
      ${uiCard('c3','log K')}${uiCard('c4','K')}
      ${uiCard('c5','Q now',null,true)}</div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), lqR=$('#lq'), goB=$('#go');
  let ci=0, t=0, ph=0, run=false, lq=0; const nd={x:0,v:0}, bar={x:1,v:0}; const BA=ionBox(), BC=ionBox();
  const setCell=i=>{ ci=i; const C=CELL4[i]; lqR.max=(C.ne*C.E0/NERN).toFixed(2); lq=0; run=false; goB.textContent='▶ Run the cell'; };
  setCell(0);
  bindChips(wrap,'cl',i=>setCell(i));
  lqR.addEventListener('input',()=>{ lq=+lqR.value; run=false; goB.textContent='▶ Run the cell'; });
  goB.onclick=()=>{ run=!run; goB.textContent=run?'⏸ Pause':'▶ Run the cell'; };
  $('#rs').onclick=()=>{ lq=0; run=false; goB.textContent='▶ Run the cell'; };
  animLoop(dt=>{
    t+=dt;
    const C=CELL4[ci], logK=C.ne*C.E0/NERN;
    if(run){ lq=approach(lq,logK,0.7,dt); if(logK-lq<0.006*logK){ lq=logK; run=false; goB.textContent='▶ Run the cell'; } }
    lqR.value=lq;
    const E=NERN/C.ne*(logK-lq), dG=-C.ne*FAR*E/1000, f=clamp(lq/logK,0,1);
    $('#lqV').textContent=fmt(lq,1);
    $('#c1').textContent=fmt(E,3)+' V'; $('#c2').textContent=fmt(dG,1); $('#c3').textContent=fmt(logK,2); $('#c4').textContent=sciStr(Math.pow(10,logK));
    $('#c5').textContent=sciStr(Math.pow(10,lq));
    const speed=E/C.E0; ph+=speed*100*dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // --- cell (left) ---
    const bw=w*0.19, bh=Math.min(h*0.30,190), lx=w*0.04, rx=lx+bw+w*0.06, by=h*0.50, rw=Math.max(12,bw*0.1);
    const rTop=by-h*0.17, rBot=by+bh-12, zx=lx+bw*0.3, cx=rx+bw*0.7;
    const iodine=!C.metal;
    const gA=beakerDraw(ctx,lx,by,bw,bh,0.76,iodine?mixCol('#ffffff','#e0b894',f):'rgba(47,143,224,0.08)',t,{amp:1,agit:1.4});
    const gC=beakerDraw(ctx,rx,by,bw,bh,0.76,'rgba(47,143,224,'+(0.04+0.17*(1-f))+')',t,{amp:1,agit:1.4});
    ionStep(BA,dt,3+9*f,3+9*f,12,null,null); ionStep(BC,dt,1+11*(1-f),1+11*(1-f),12,null,null);
    ionDraw(ctx,BA,lx+8,gA.sy+8,bw-16,bh*0.76-16,5.5); ionDraw(ctx,BC,rx+8,gC.sy+8,bw-16,bh*0.76-16,5.5);
    rodDraw(ctx,zx,rTop,rBot,rw,C.aF,C.metal?1-0.4*f:1,0); rodDraw(ctx,cx,rTop,rBot,rw,C.cF,1,C.metal?f*7:0,C.cF);
    const sbx1=lx+bw*0.68, sbx2=rx+bw*0.30, sbw=Math.min(18,bw*0.1);
    const SB=saltBridge(ctx,sbx1,sbx2,by-h*0.10,by+bh*0.28,sbw,'#f2f6fb');
    carriers(ctx,SB,ph*0.5,30,CAT_COL,5,'+'); carriers(ctx,SB,-ph*0.5+15,30,AN_COL,5,'−');
    const mr=Math.min(44,h*0.08), yw=Math.max(h*0.14,mr+12);
    const Wp=mkPath([[zx,rTop],[zx,yw],[cx,yw],[cx,rTop]]); drawPath(ctx,Wp,COL.ink,3); if(speed>0.004) carriers(ctx,Wp,ph,26,E_COL,4.2);
    dialMeter(ctx,(zx+cx)/2,yw,mr,nd,E,0,Math.ceil(C.E0*1.1*10)/10+0.1,'Voltmeter','V',CAT_COL,dt,2);
    pill(ctx,zx,rTop-14,C.aM+' — anode',E_COL,'center'); pill(ctx,cx,rTop-14,C.cM+' — cathode',CAT_COL,'center');
    textAt(ctx,C.rx,lx+(rx+bw-lx)/2,by+bh+28,{align:'center',size:13,weight:700,color:COL.ink});
    // --- right: ΔG bar, E-vs-logQ plot, Q→K track ---
    const px=w*0.60, pw=w*0.34;
    springTo(bar,E/C.E0,40,9,dt);
    textAt(ctx,'Energy still available  (−ΔG = nFE)',px,h*0.10,{size:12,weight:700,color:COL.ink});
    rect(ctx,px,h*0.12,pw,22,COL.ink,'#fff',2); rect(ctx,px,h*0.12,Math.max(0,pw*bar.x),22,COL.red,'rgba(217,67,43,0.25)',0);
    textAt(ctx,fmt(-dG,1)+' kJ/mol',px+pw/2,h*0.12+16,{align:'center',size:12,weight:700,color:COL.red});
    const py=h*0.27, ph2=h*0.34;
    const F=plotFrame(ctx,{x:px,y:py,w:pw,h:ph2},{x0:0,x1:logK,y0:0,y1:C.E0*1.08,xl:'log Q',yl:'E (V)',ylOff:44,
      xTicks:[[0,'0'],[logK,fmt(logK,1)]],yTicks:[[0,'0'],[C.E0,fmt(C.E0,2)]]});
    polyline(ctx,[[F.X(0),F.Y(C.E0)],[F.X(logK),F.Y(0)]],COL.blue,2.6);
    line(ctx,F.X(lq),F.Y(0),F.X(lq),F.Y(E),CTL,1.4,[3,3]); dot(ctx,F.X(lq),F.Y(E),5,CTL);
    textAt(ctx,'E°',F.X(0)+8,F.Y(C.E0)-6,{size:11,weight:700,color:COL.muted}); textAt(ctx,'E = 0  at  Q = K',F.X(logK),F.Y(0)-10,{align:'right',size:11,weight:700,color:COL.red});
    // Q → K track
    const ty=h*0.78; textAt(ctx,'Q chases K',px,ty-16,{size:12,weight:700,color:COL.ink});
    line(ctx,px,ty,px+pw,ty,COL.ink,2.6); line(ctx,px+pw,ty-9,px+pw,ty+9,COL.red,3); textAt(ctx,'K',px+pw,ty-14,{align:'center',size:12,weight:700,color:COL.red});
    vec(ctx,px+pw*f,ty-24,px+pw*f,ty-4,CTL,3); textAt(ctx,'Q',px+pw*f,ty-30,{align:'center',size:12,weight:700,color:COL.yellow});
    pill(ctx,px+pw/2,ty+34,f>0.995?'EQUILIBRIUM — voltmeter reads 0':'E° = (0.059/n) log K',f>0.995?COL.red:COL.blue,'center');
  });
  return wrap;
}

function dimArrowH(ctx,x1,x2,y,col){ line(ctx,x1,y,x2,y,col,1.8); arrowHead(ctx,x1,y,Math.PI,col,5); arrowHead(ctx,x2,y,0,col,5); }
function syncArr(arr,n,mk){ n=Math.max(0,Math.round(n)); while(arr.length<n) arr.push(mk?mk():{u:Math.random(),v:Math.random(),a:Math.random()*6.28}); while(arr.length>n) arr.splice(Math.floor(Math.random()*arr.length),1); }

/* ---- conductivity models (all per Table 2.3, Eq. 2.23, Ex 2.5, Ex 2.9) ----
   KCl   : Λm = 150.0 − 87.46√c up to √c = 0.1, then straight through the table points
           (c = 0.1 → 129.0 , c = 1 → 111.3)
   NaOH  : Λ°m = 50.1 + 199.1 = 249.2 ; Λm = Λ°m − 87.5√c   (gives 229.6 at 0.05 M, Ex 2.5)
   CH₃COOH: weak — Λm = α Λ°m , Λ°m = 390.5 , Ka = 1.78×10⁻⁵ (Ex 2.9)                      */
const KA_HAC=1.78e-5, L0_HAC=390.5;
function alphaHAc(c){ return (-KA_HAC+Math.sqrt(KA_HAC*KA_HAC+4*KA_HAC*c))/(2*c); }
function lamKCl(c){ const s=Math.sqrt(c); if(s<=0.1) return 150.0-87.46*s; if(s<=0.3162) return lerp(150.0-87.46*0.1,129.0,(s-0.1)/(0.3162-0.1)); return lerp(129.0,111.3,(s-0.3162)/(1-0.3162)); }
function lamNaOH(c){ return 249.2-87.5*Math.sqrt(c); }
function lamHAc(c){ return alphaHAc(c)*L0_HAC; }

/* =====================================================================
   2.5 CONDUCTIVITY CELL — R = ρ l/A , κ = 1/ρ , Λm = κ·1000/c   (§2.4, Fig 2.4)
   Check (Ex 2.5): 0.05 M NaOH, d = 1 cm, l = 50 cm, R = 5.55×10³ Ω → ρ = 87.1 Ω cm,
                   κ = 0.01148 S cm⁻¹ , Λm = 229.6 S cm² mol⁻¹
   ===================================================================== */
const ELEC5=[{n:'KCl',f:lamKCl,ions:2},{n:'NaOH',f:lamNaOH,ions:2},{n:'CH₃COOH',f:lamHAc,ions:2,weak:true}];
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group">${uiChips('el','Electrolyte',ELEC5.map(e=>e.n),1)}
      <div style="height:8px"></div>${uiSlider('lc','Concentration c',-3,0,0.01,Math.log10(0.05),AN_COL)}</div>
    <div class="control-group">${uiSlider('ll','Length of column  l',5,100,1,50,CTL)}
      <div style="height:8px"></div>${uiSlider('ld','Diameter  d',0.5,3,0.1,1,CTL)}
      <div style="height:8px"></div>${uiSlider('lv','AC voltage',0,10,0.1,2,CTL)}
      <button class="toggle-btn navy" id="ex">Load Example 2.5</button></div>
    <div class="control-group"><div class="result-cards">
      ${uiCard('c1','R',E_COL)}${uiCard('c2','ρ')}${uiCard('c3','κ',CAT_COL)}
      ${uiCard('c4','G')}${uiCard('c5','Λm',AN_COL)}${uiCard('c6','I',E_COL)}</div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), lcR=$('#lc'), llR=$('#ll'), ldR=$('#ld'), lvR=$('#lv');
  const gc=sliderGlide(lcR), gl=sliderGlide(llR), gd=sliderGlide(ldR);
  let ei=1, t=0, eph=0; const nd={x:0,v:0}; let dmax=1; const geo={L:0.4,D:30}, cat=[], an=[], mol=[];
  bindChips(wrap,'el',i=>{ ei=i; });
  $('#ex').onclick=()=>{ wrap.querySelectorAll('#el .toggle-btn')[1].click(); gc.tgt=Math.log10(0.05); gl.tgt=50; gd.tgt=1; };
  animLoop(dt=>{
    t+=dt; gc.step(dt,5); gl.step(dt,5); gd.step(dt,5);
    const E=ELEC5[ei], c=Math.pow(10,+lcR.value), l=+llR.value, d=+ldR.value, V=+lvR.value;
    const lam=E.f(c), kap=lam*c/1000, A=Math.PI*d*d/4, R=l/(kap*A), rho=1/kap, G=1/R, I=V/R*1000;
    const alpha=E.weak?alphaHAc(c):1;
    $('#lcV').textContent=sciStr(c)+' M'; $('#llV').textContent=fmt(l,0)+' cm'; $('#ldV').textContent=fmt(d,1)+' cm'; $('#lvV').textContent=fmt(V,1)+' V';
    $('#c1').textContent=(R>=1e4?sciStr(R):fmt(R,0))+' Ω'; $('#c2').textContent=fmt(rho,1)+' Ω cm'; $('#c3').textContent=sciStr(kap)+' S/cm';
    $('#c4').textContent=sciStr(G)+' S'; $('#c5').textContent=fmt(lam,1); $('#c6').textContent=(I<1?fmt(I,3):fmt(I,1))+' mA';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // geometry eases toward the sliders
    const Lt=lerp(0.30,0.86,(l-5)/95), Dt=lerp(24,115,(d-0.5)/2.5);
    geo.L=approach(geo.L,Lt,8,dt); geo.D=approach(geo.D,Dt,8,dt);
    const Lp=w*geo.L, Dp=geo.D, x0=(w-Lp)/2, ty=h*0.56-Dp/2;
    // tube + solution
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.10)'; ctx.fillRect(x0,ty,Lp,Dp); ctx.restore();
    line(ctx,x0,ty,x0+Lp,ty,COL.ink,3); line(ctx,x0,ty+Dp,x0+Lp,ty+Dp,COL.ink,3);
    // ions: number density follows the ion concentration, speed follows Λ/Λ°
    const cIon=alpha*c, dens=0.12+0.88*clamp((log10(cIon)+4)/4,0,1);
    const nIon=clamp(dens*Lp*Dp/300,3,150);
    syncArr(cat,nIon); syncArr(an,nIon);
    syncArr(mol,E.weak?clamp((1-alpha)*0.5*Lp*Dp/700*(0.4+0.6*clamp((log10(c)+3)/3,0,1)),0,70):0);
    const ac=Math.sin(t*2*Math.PI/1.8), drift=0.55*(V/10)*clamp(30/l,0.2,2)*clamp(lam/250,0.25,1.4);
    cat.forEach(p=>{ wander(p,dt,0.03,2.5); p.u=clamp(p.u-ac*drift*dt,0.02,0.98); });
    an.forEach(p=>{ wander(p,dt,0.03,2.5); p.u=clamp(p.u+ac*drift*dt,0.02,0.98); });
    mol.forEach(p=>wander(p,dt,0.025,2.5));
    const rI=clamp(Dp*0.11,3,6.5);
    mol.forEach(p=>{ const x=x0+p.u*Lp, y=ty+p.v*Dp; line(ctx,x-rI*0.8,y,x+rI*0.8,y,COL.mid,2); circ(ctx,x-rI*0.8,y,rI*0.8,CAT_COL,'#fff',1.4); circ(ctx,x+rI*0.8,y,rI*0.8,AN_COL,'#fff',1.4); });
    cat.forEach(p=>ionGlyph(ctx,x0+p.u*Lp,ty+p.v*Dp,1,rI)); an.forEach(p=>ionGlyph(ctx,x0+p.u*Lp,ty+p.v*Dp,-1,rI));
    // platinum plates
    const pt=(x)=>{ rect(ctx,x-5,ty-9,10,Dp+18,COL.ink,'#cfd8e3',2.6); };
    pt(x0); pt(x0+Lp);
    // circuit: plate → ammeter → AC source → plate
    const yw=Math.max(h*0.15,70), tx=ty-9;
    const W=mkPath([[x0,tx],[x0,yw],[x0+Lp,yw],[x0+Lp,tx]]); drawPath(ctx,W,COL.ink,3);
    eph+=ac*clamp(Math.sqrt(I)*18,4,120)*dt*(V>0?1:0);
    carriers(ctx,W,eph,26,E_COL,4.2);
    const mr=Math.min(40,h*0.075), mx=x0+Lp*0.3, sx=x0+Lp*0.74;
    // AC source
    circ(ctx,sx,yw,mr*0.62,COL.ink,'#fff',2.8);
    ctx.save(); ctx.strokeStyle=CTL; ctx.lineWidth=2.4; ctx.beginPath(); for(let i=0;i<=20;i++){ const xx=sx-mr*0.4+mr*0.8*i/20, yy=yw-Math.sin(i/20*6.283)*mr*0.22; i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); } ctx.stroke(); ctx.restore();
    textAt(ctx,fmt(V,1)+' V ac',sx,yw-mr*0.62-8,{align:'center',size:11.5,weight:700,color:CTL});
    dmax=approach(dmax,niceTop(Math.max(I*1.2,0.01)),4,dt);
    dialMeter(ctx,mx,yw,mr,nd,Math.min(I,dmax),0,dmax,'Ammeter','mA',E_COL,dt,I<1?2:1);
    // dimensions
    dimArrowH(ctx,x0,x0+Lp,ty+Dp+34,CTL); pill(ctx,x0+Lp/2,ty+Dp+34,'l = '+fmt(l,0)+' cm',CTL,'center');
    const ax=x0+Lp+26; dimArrow(ctx,ax,ty,ty+Dp,CTL); textAt(ctx,'d = '+fmt(d,1)+' cm',ax+8,ty+Dp/2+4,{size:12,weight:700,color:CTL});
    textAt(ctx,'A = '+fmt(A,3)+' cm²',x0+Lp/2,ty+Dp+66,{align:'center',size:12,weight:700,color:COL.muted});
    textAt(ctx,'R = ρ l / A   ·   κ = 1/ρ   ·   Λm = κ × 1000 / c',w/2,h-18,{align:'center',size:12.5,weight:700,color:COL.ink});
    pill(ctx,w/2,ty-26,E.n+'  '+sciStr(c)+' M'+(E.weak?'   α = '+fmt(alpha,3):''),AN_COL,'center');
  });
  return wrap;
}

/* =====================================================================
   2.6 MOLAR CONDUCTIVITY AGAINST √c — strong vs weak electrolyte (Fig 2.6, 2.7)
   Strong (KCl): Λm = Λ°m − A√c, Λ°m = 150.0 by extrapolation.
   Weak (CH₃COOH): Λm = αΛ°m rises steeply on dilution; Λ°m = 390.5 (from Kohlrausch law).
   Check (Ex 2.9): c = 0.001028 M → Λm = 48.15 , α = 0.1233 , Ka = 1.78×10⁻⁵
   ===================================================================== */
function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group">${uiSlider('lc','Concentration c',-4,-0.7,0.01,-1.5,CTL)}
      <div style="height:8px"></div>${presetRow('pre','Quick set',['0.1 M','0.01 M','0.001 M','0.0001 M'])}</div>
    <div class="control-group"><div class="result-cards">
      ${uiCard('c1','Λm  KCl',CAT_COL)}${uiCard('c2','Λm  CH₃COOH',AN_COL)}
      ${uiCard('c3','α  (acetic acid)',AN_COL)}${uiCard('c4','Ka = cα²/(1−α)')}</div>
      <div class="hint">Λm in S cm² mol⁻¹ · weak-acid Ka stays constant on dilution</div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), lcR=$('#lc'), gc=sliderGlide(lcR);
  wrap.querySelectorAll('#pre .toggle-btn').forEach(b=>b.onclick=()=>{ gc.tgt=[-1,-2,-3,-4][+b.dataset.i]; });
  let t=0; const N=22, rS=(()=>{ const R=rng(7); return Array.from({length:N},()=>R()); })();
  const mk=()=>Array.from({length:N},(_,i)=>({a:{u:Math.random(),v:Math.random(),a:Math.random()*6.28},b:{u:Math.random(),v:Math.random(),a:Math.random()*6.28},r:rS[i],dis:0}));
  const SB=mk(), WB=mk();
  animLoop(dt=>{
    t+=dt; gc.step(dt,5);
    const c=Math.pow(10,+lcR.value), s=Math.sqrt(c), lK=lamKCl(c), al=alphaHAc(c), lH=al*L0_HAC;
    $('#lcV').textContent=sciStr(c)+' M';
    $('#c1').textContent=fmt(lK,1); $('#c2').textContent=fmt(lH,1); $('#c3').textContent=fmt(al,4); $('#c4').textContent=sciStr(c*al*al/(1-al));
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // --- left: two boxes, each holding 1 mol of electrolyte (22 formula units shown) ---
    const bx=w*0.04, bw=w*0.32, bh=h*0.30;
    const box=(y,title,col,B,disFn,mobil)=>{
      rect(ctx,bx,y,bw,bh,COL.ink,'rgba(47,143,224,0.06)',2.6); textAt(ctx,title,bx,y-8,{size:12.5,weight:700,color:col});
      B.forEach(p=>{ const target=disFn(p.r); p.dis=approach(p.dis,target,3,dt);
        const sp=0.05*mobil; wander(p.a,dt,sp,2.5); wander(p.b,dt,sp,2.5);
        // bound pair: b follows a, close by; free: independent
        const bound=1-p.dis; p.b.u=lerp(p.b.u,p.a.u+0.04,bound*0.9); p.b.v=lerp(p.b.v,p.a.v,bound*0.9);
        const ax=bx+6+p.a.u*(bw-12), ay=y+6+p.a.v*(bh-12), qx=bx+6+p.b.u*(bw-12), qy=y+6+p.b.v*(bh-12);
        if(bound>0.5) line(ctx,ax,ay,qx,qy,COL.mid,2.2);
        ionGlyph(ctx,ax,ay,1,5.5); ionGlyph(ctx,qx,qy,-1,5.5); });
    };
    box(h*0.12,'Strong  KCl',CAT_COL,SB,()=>1,clamp(lK/150,0.3,1.2));
    box(h*0.55,'Weak  CH₃COOH   α = '+fmt(al,3),AN_COL,WB,r=>r<al?1:0,0.9);
    textAt(ctx,'each box holds 1 mol',bx+bw/2,h*0.55+bh+22,{align:'center',size:11.5,weight:600,color:COL.muted});
    // --- right: plot Λm against √c ---
    const px=w*0.54, py=h*0.14, pw=w*0.42, ph2=h*0.64, xm=0.45, ym=420;
    const F=plotFrame(ctx,{x:px,y:py,w:pw,h:ph2},{x0:0,x1:xm,y0:0,y1:ym,xl:'√c   (mol L⁻¹)½',yl:'Λm  (S cm² mol⁻¹)',ylOff:44,
      xTicks:[0,0.1,0.2,0.3,0.4].map(v=>[v,fmt(v,1)]),yTicks:[0,100,200,300,400].map(v=>[v,String(v)])});
    const curve=(fn,col)=>{ const pts=[]; for(let i=0;i<=80;i++){ const ss=0.008+(xm-0.008)*i/80; pts.push([F.X(ss),F.Y(fn(ss*ss))]); } polyline(ctx,pts,col,2.8); };
    curve(lamKCl,CAT_COL); curve(lamHAc,AN_COL);
    line(ctx,px,F.Y(150),F.X(xm),F.Y(150),CAT_COL,1.2,[5,4]); textAt(ctx,'Λ°m = 150.0',F.X(xm)-4,F.Y(150)+14,{align:'right',size:11,weight:700,color:CAT_COL});
    line(ctx,px,F.Y(390.5),F.X(xm),F.Y(390.5),AN_COL,1.2,[5,4]); textAt(ctx,'Λ°m = 390.5',F.X(xm)-4,F.Y(390.5)-6,{align:'right',size:11,weight:700,color:AN_COL});
    const sc=Math.min(s,xm);
    line(ctx,F.X(sc),F.Y(0),F.X(sc),F.Y(Math.max(lK,lH)),CTL,1.4,[3,3]);
    dot(ctx,F.X(sc),F.Y(lK),5,CAT_COL); dot(ctx,F.X(sc),F.Y(lH),5,AN_COL);
    textAt(ctx,'KCl',F.X(0.28),F.Y(lamKCl(0.28*0.28))-10,{align:'center',size:12,weight:700,color:CAT_COL});
    textAt(ctx,'CH₃COOH',F.X(0.2),F.Y(lamHAc(0.04))-12,{size:12,weight:700,color:AN_COL});
    pill(ctx,px+pw/2,py-18,'Strong: straight  ·  Weak: steep rise',COL.blue,'center');
  });
  return wrap;
}

/* =====================================================================
   2.7 KOHLRAUSCH LAW — independent migration of ions (§2.4.2)
   Λ°m = ν₊λ°₊ + ν₋λ°₋  (Table 2.4).  Ions drift under the field at speeds ∝ λ°.
   Check: CaCl₂ = 119.0 + 2(76.3) = 271.6 · MgSO₄ = 106.0 + 160.0 = 266.0 (Ex 2.7)
          CH₃COOH = 349.6 + 40.9 = 390.5 (Ex 2.8) · NaCl 126.4 · HCl 425.9
   ===================================================================== */
const CAT7=[{s:'H⁺',z:1,l:349.6,sym:'H'},{s:'Na⁺',z:1,l:50.1,sym:'Na'},{s:'K⁺',z:1,l:73.5,sym:'K'},{s:'Ca²⁺',z:2,l:119.0,sym:'Ca'},{s:'Mg²⁺',z:2,l:106.0,sym:'Mg'}];

function buildA7(){
  const wrap=labShell();

/* =====================================================================

const ELY9=[

  cat:[['Na⁺ → Na',-2.71,'Na','metalNa']], an:[['Cl⁻ → ½Cl₂',1.36,'Cl₂','gas',COL.green]]},

 {n:'dil. H₂SO₄',kin:-1,net:'2H₂O → 2H₂ + O₂',
  cat:[['H⁺ → ½H₂',0.00,'H₂','gas',COL.blue]], an:[['H₂O → O₂',1.23,'O₂','gas',COL.red],['SO₄²⁻ → S₂O₈²⁻',1.96,'S₂O₈²⁻','dis']]},

  cat:[['Cu²⁺ → Cu',0.34,'Cu','metalCu'],['H⁺ → ½H₂',0.00,'H₂','gas',COL.blue]], an:[['H₂O → O₂',1.23,'O₂','gas',COL.red],['SO₄²⁻ → S₂O₈²⁻',1.96,'S₂O₈²⁻','dis']]}];

    const sy=g.sy+8, sh=by+bh-18-sy;
    // resting ions
    for(let i=0;i<8;i++){ const px=lx+12+((i*137+t*(i%2?4:-4)+900)%1000)/1000*(bw-24), py=sy+((i*61)%100)/100*sh; ionGlyph(ctx,px,py,i%2?1:-1,5,0.4); }
    // cathode product
    if(C[3]==='metalCu'){ dep=Math.min(1,dep+rs*dt*0.05); }
