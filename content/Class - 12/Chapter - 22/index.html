<head>

<title>Grade 12 · Chemistry Part 2 · Chapter 3 — Aldehydes, Ketones and Carboxylic Acids | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

<script>
/* =========================================================================
   GRADE 8 — CHAPTER 2: THE INVISIBLE LIVING WORLD — BEYOND OUR NAKED EYE
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn object eases, springs or physically integrates toward
   it every frame. Living things are always moving — cilia beat, amoebae
   crawl, yeast buds, bacteria divide — never a static picture.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

/* ---------------------------------------------------------------------
   0c. CHAPTER-3 HELPERS
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function rgba(hex,a){ const c=hexRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function dashed(ctx,x1,y1,x2,y2,color,width,off){ ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||1.6; ctx.setLineDash([5,4]); ctx.lineDashOffset=off||0; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); }
function pill(ctx,txt,x,y,col,size){ size=size||12; ctx.save(); ctx.font='700 '+size+'px Poppins, sans-serif'; const tw=ctx.measureText(txt).width; rrect(ctx,x-tw/2-6,y-size*0.9,tw+12,size*1.7,6); ctx.fillStyle='rgba(255,255,255,0.94)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); textAt(ctx,txt,x,y+size*0.3,{align:'center',size:size,weight:700,color:col}); }
function hexagon(ctx,x,y,r,stroke,fill,lw,rot){ ctx.save(); ctx.beginPath(); for(let i=0;i<6;i++){ const a=(rot||0)+i*Math.PI/3; const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py); } ctx.closePath(); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.lineWidth=lw||2; ctx.stroke(); ctx.restore(); }
function waterV(ctx,x,y,a,s,col){ // tiny bent H2O line glyph
  ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.strokeStyle=col||COL.blue; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-s,-s*0.7); ctx.lineTo(0,0); ctx.lineTo(s,-s*0.7); ctx.stroke(); ctx.restore(); }
/** liquid/test-tube outline path (open top). */
function tubePath(ctx,cx,top,bot,hw){ ctx.beginPath(); ctx.moveTo(cx-hw,top); ctx.lineTo(cx-hw,bot-hw); ctx.arc(cx,bot-hw,hw,Math.PI,0,true); ctx.lineTo(cx+hw,top); }

/* DOM helpers for the right-hand control column */
const UI={
  slider:(id,label,min,max,step,val,hint)=>`<div class="control-group"><label>${label} <span class="val" id="${id}V"></span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">${hint?`<div class="hint">${hint}</div>`:''}</div>`,
  chips:(id,label,items,sel)=>`<div class="control-group"><label>${label}</label><div class="chip-wrap" id="${id}">${items.map((s,i)=>`<button class="chip-btn${i===sel?' active':''}" data-i="${i}">${s}</button>`).join('')}</div></div>`,
  cards:(arr,three)=>`<div class="control-group"><div class="result-cards${three?' three':''}">${arr.map(c=>`<div class="rcard${c[3]?' wide':''}"><div class="rlabel">${c[1]}</div><div class="rval" id="${c[0]}">${c[2]||'—'}</div></div>`).join('')}</div></div>`,
  btn:(id,txt,cls)=>`<button class="toggle-btn ${cls||'navy'}" id="${id}" style="margin-top:0;padding:10px;width:100%;flex:0 0 auto;">${txt}</button>`
};
function wireChips(root,id,cb){
  const els=[...root.querySelectorAll('#'+id+' .chip-btn')];
  els.forEach((b,i)=>b.onclick=()=>{ els.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(i); });
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}
/** Poisson-ish number of events in a frame with mean m */
function nEvents(m){ let n=0; while(m>0){ if(Math.random()<Math.min(1,m)) n++; m-=1; } return n; }

/* =====================================================================
   3.1 THE CARBONYL GROUP
   C=O is trigonal planar (sp², 120°). The π cloud sits above and below the plane
   and is pulled towards the more electronegative O (resonance A ⇄ B).
   Dipole moments (D): methanal 2.33, ethanal 2.69, propanone 2.88, dimethyl ether 1.30.
   μ is drawn ∝ the share of structure B, so the arrow grows as O pulls harder.
   ===================================================================== */
const CARB=[
  {n:'Methanal',  f:'HCHO',    r1:'H',   r2:'H',   mu:2.33, pull:0.30, L:[0.95,0.95]},
  {n:'Ethanal',   f:'CH₃CHO',  r1:'CH₃', r2:'H',   mu:2.69, pull:0.36, L:[1.15,0.95]},
  {n:'Propanone', f:'CH₃COCH₃',r1:'CH₃', r2:'CH₃', mu:2.88, pull:0.40, L:[1.15,1.15]},
  {n:'Ether C–O–C', f:'CH₃OCH₃', ether:true, mu:1.30, pull:0.18}
];
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    UI.chips('cmp','Compound',CARB.map(c=>c.n),2)+
    UI.slider('vw','View the molecule from',0,90,1,0,'0° = face-on · 90° = edge-on to the plane')+
    UI.slider('pl','Oxygen’s pull on π electrons',0,100,1,40)+
    UI.btn('spin','↻ Spin the molecule','play')+
    UI.cards([['c1','Dipole μ'],['c2','Shape'],['c3','C=O carbon'],['c4','O atom']]);
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), vw=$('#vw'), pl=$('#pl');
  let t=0, sel=2, spin=false, yaw=0, tilt=0.28, pull=CARB[2].pull, etherMix=0, muDraw=CARB[2].mu;
  const geo=CARB.map(()=>({a:0,b:0}));
  pl.value=Math.round(CARB[2].pull*100);
  wireChips(wrap,'cmp',i=>{ sel=i; pl.value=Math.round(CARB[i].pull*100); });
  $('#spin').onclick=()=>{ spin=!spin; $('#spin').textContent=spin?'■ Stop spinning':'↻ Spin the molecule'; if(spin) $('#spin').classList.add('active'); else $('#spin').classList.remove('active'); };
  animLoop(dt=>{
    t+=dt;
    $('#vwV').textContent=vw.value+'°'; $('#plV').textContent=pl.value+'%';
    const C=CARB[sel];
    pull=approach(pull,pl.value/100,6,dt);
    etherMix=approach(etherMix,C.ether?1:0,5,dt);
    if(spin) yaw+=dt*0.9; else { const tg=vw.value*Math.PI/180; yaw=yaw+angDiff(tg,yaw)*(1-Math.exp(-5*dt)); }
    muDraw=approach(muDraw, C.mu*(pull/Math.max(0.05,C.pull)), 4, dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cx=w*0.5, cy=h*0.47, S=Math.min(w*0.2,h*0.25);
    const cy_=Math.cos(yaw), sy_=Math.sin(yaw), ct=Math.cos(tilt), st=Math.sin(tilt);
    const P=(x,y,z)=>{ const x1=x*cy_+z*sy_, z1=-x*sy_+z*cy_; const y1=y*ct-z1*st, z2=y*st+z1*ct; return {x:cx+x1*S, y:cy-y1*S, z:z2}; };
    // ---------- carbonyl molecule ----------
    const aC=1-etherMix;
    if(aC>0.02){
      ctx.save(); ctx.globalAlpha=aC;
      const l1=C.L?C.L[0]:1, l2=C.L?C.L[1]:1, ox=1.22, sh=-0.55;
      const c0=P(sh,0,0), o0=P(sh+ox,0,0);
      const r1=P(sh-0.5*l1,0.866*l1,0), r2=P(sh-0.5*l2,-0.866*l2,0);
      // plane
      const pc=[P(-1.9,1.7,0),P(2.0,1.7,0),P(2.0,-1.7,0),P(-1.9,-1.7,0)];
      ctx.save(); ctx.beginPath(); pc.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.fillStyle='rgba(129,149,171,0.08)'; ctx.fill(); ctx.setLineDash([6,5]); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
      // lobes (behind/front by z)
      const lobe=(at,size,sgn)=>{
        const base=P(at[0],at[1],0), dz=P(at[0],at[1],1), vx=dz.x-base.x, vy=dz.y-base.y, lz=Math.hypot(vx,vy), ang=Math.atan2(vy,vx);
        const off=0.55*size*sgn, ctr=P(at[0],at[1],off);
        const rx=Math.max(0.12*S*size, 0.5*size*lz*0.9)+0.1*S*size, ry=0.3*S*size;
        ctx.save(); ctx.translate(ctr.x,ctr.y); ctx.rotate(ang); ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
        ctx.fillStyle=rgba('#2f8fe0',0.16+0.12*size); ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
      };
      const cs=1-0.55*pull, os=0.85+0.9*pull;
      // draw order: back lobes (z<0 in view) first
      const front=(P(0,0,1).z>0)?1:-1;
      [-front].forEach(s=>{ lobe([sh,0],cs,s); lobe([sh+ox,0],os,s); });
      // bonds
      const bond=(a,b,col,w)=>line(ctx,a.x,a.y,b.x,b.y,col||COL.ink,w||3);
      bond(c0,r1); bond(c0,r2);
      // C=O double: two parallel strokes in the plane
      const d1=P(sh,0.07,0), d2=P(sh,-0.07,0), e1=P(sh+ox,0.07,0), e2=P(sh+ox,-0.07,0);
      bond(d1,e1,COL.ink,3); ctx.save(); ctx.globalAlpha=aC*(1-0.55*pull); bond(d2,e2,COL.ink,3); ctx.restore();
      // atoms
      circ(ctx,c0.x,c0.y,0.17*S,COL.ink,'#fff',2.4); textAt(ctx,'C',c0.x,c0.y+4.5,{align:'center',size:13,weight:700});
      circ(ctx,o0.x,o0.y,0.19*S,COL.red,'#fff',2.6); textAt(ctx,'O',o0.x,o0.y+4.5,{align:'center',size:13,weight:700,color:COL.red});
      [[r1,C.r1],[r2,C.r2]].forEach(([p,lab])=>{ const big=lab==='CH₃'; circ(ctx,p.x,p.y,(big?0.2:0.14)*S,COL.mid,'#fff',2); textAt(ctx,lab,p.x,p.y+4,{align:'center',size:big?11:12,weight:700,color:COL.muted}); });
      // front lobes
      [front].forEach(s=>{ lobe([sh,0],cs,s); lobe([sh+ox,0],os,s); });
      // charges
      const dp=clamp(pull*2.2,0,1);
      ctx.save(); ctx.globalAlpha=aC*dp;
      textAt(ctx,'δ+',c0.x-0.05*S,c0.y-0.34*S,{align:'center',size:15,weight:700,color:COL.red});
      textAt(ctx,'δ–',o0.x+0.05*S,o0.y-0.38*S,{align:'center',size:15,weight:700,color:COL.blue});
      ctx.restore();
      // 120° markers (only when seen face-on)
      const face=clamp(1-Math.abs(Math.sin(yaw))*2.2,0,1)*Math.abs(cy_)*1;
      if(face>0.05){
        ctx.save(); ctx.globalAlpha=aC*face; ctx.strokeStyle=COL.green; ctx.lineWidth=2;
        const a1=Math.atan2(r1.y-c0.y,r1.x-c0.x), a2=Math.atan2(o0.y-c0.y,o0.x-c0.x), a3=Math.atan2(r2.y-c0.y,r2.x-c0.x);
        const arc=(from,to,tx)=>{ ctx.beginPath(); ctx.arc(c0.x,c0.y,0.5*S,from,to,false); ctx.stroke(); const m=(from+to)/2; textAt(ctx,'120°',c0.x+Math.cos(m)*0.72*S,c0.y+Math.sin(m)*0.72*S+4,{align:'center',size:11,weight:700,color:COL.green}); };
        const ws=(a,b)=>{ let d=b-a; while(d<0) d+=Math.PI*2; return d<Math.PI?[a,b]:[b,a]; };
        let [f1,t1]=ws(a1,a2); arc(f1,t1<f1?t1+Math.PI*2:t1);
        [f1,t1]=ws(a2,a3); arc(f1,t1<f1?t1+Math.PI*2:t1);
        ctx.restore();
      }
      // dipole arrow below molecule: + at C end → O end
      const mu=P(sh-0.1,-2.05,0), mv=P(sh+0.1+muDraw/3*1.2,-2.05,0);
      ctx.save(); ctx.globalAlpha=aC; line(ctx,mu.x,mu.y,mv.x,mv.y,COL.red,3.4); arrowHead(ctx,mv.x,mv.y,Math.atan2(mv.y-mu.y,mv.x-mu.x),COL.red,10);
      line(ctx,mu.x,mu.y-6,mu.x,mu.y+6,COL.red,2.4); line(ctx,mu.x-6,mu.y,mu.x+6,mu.y,COL.red,2.4);
      textAt(ctx,'μ = '+fmt(muDraw,2)+' D',(mu.x+mv.x)/2,Math.max(mu.y,mv.y)+22,{align:'center',size:13,weight:700,color:COL.red}); ctx.restore();
      ctx.restore();
    }
    // ---------- ether (comparison) ----------
    if(etherMix>0.02){
      ctx.save(); ctx.globalAlpha=etherMix;
      const o=P(0,0.1,0), a=P(-1.05,-0.75,0), b=P(1.05,-0.75,0);
      line(ctx,o.x,o.y,a.x,a.y,COL.ink,3); line(ctx,o.x,o.y,b.x,b.y,COL.ink,3);
      circ(ctx,a.x,a.y,0.22*S,COL.mid,'#fff',2); textAt(ctx,'CH₃',a.x,a.y+4,{align:'center',size:11,weight:700,color:COL.muted});
      circ(ctx,b.x,b.y,0.22*S,COL.mid,'#fff',2); textAt(ctx,'CH₃',b.x,b.y+4,{align:'center',size:11,weight:700,color:COL.muted});
      circ(ctx,o.x,o.y,0.19*S,COL.red,'#fff',2.6); textAt(ctx,'O',o.x,o.y+4.5,{align:'center',size:13,weight:700,color:COL.red});
      // lone pairs
      [-0.55,0.55].forEach((dx,i)=>{ const q=P(dx,0.75,0); for(let k=-1;k<=1;k+=2) circ(ctx,q.x+k*4,q.y+Math.sin(t*3+i)*1.5,2.4,COL.blue,COL.blue,1); });
      textAt(ctx,'C–O single bonds · no π cloud',cx,cy+S*1.55,{align:'center',size:12,weight:600,color:COL.muted});
      const m0=P(-0.2,-2.05,0), m1=P(-0.2+muDraw/3*1.2,-2.05,0);
      line(ctx,m0.x,m0.y,m1.x,m1.y,COL.red,3.4); arrowHead(ctx,m1.x,m1.y,Math.atan2(m1.y-m0.y,m1.x-m0.x),COL.red,10);
      textAt(ctx,'μ = '+fmt(muDraw,2)+' D',(m0.x+m1.x)/2,m0.y+22,{align:'center',size:13,weight:700,color:COL.red});
      ctx.restore();
    }
    // legend / captions
    textAt(ctx,'π cloud: above and below the plane',w*0.04,h*0.07,{size:12,weight:700,color:COL.blue});
    textAt(ctx,'dipole points to the oxygen',w*0.04,h*0.07+18,{size:12,weight:700,color:COL.red});
    // resonance meter A ⇄ B
    const mx=w*0.6, my=h*0.07, mw=w*0.34;
    textAt(ctx,'A  C=O',mx,my-8,{size:11,weight:700,color:COL.muted});
    textAt(ctx,'C⁺–O⁻  B',mx+mw,my-8,{size:11,weight:700,color:COL.muted,align:'right'});
    line(ctx,mx,my+4,mx+mw,my+4,'#dbe4f0',6); line(ctx,mx,my+4,mx+mw*pull,my+4,COL.red,6);
    circ(ctx,mx+mw*pull,my+4,7,COL.red,'#fff',2.4);
    $('#c1').textContent=fmt(muDraw,2)+' D'; $('#c2').textContent=C.ether?'bent, sp³ O':'planar 120°';
    $('#c3').textContent=C.ether?'—':'sp² · δ+'; $('#c4').textContent=C.ether?'2 lone pairs':'sp² · δ–';
  });
  return wrap;
}

/* =====================================================================
   3.2 NUCLEOPHILIC ADDITION
   Nu⁻ attacks the δ+ carbon, ⟂ to the plane. C goes sp² → sp³.
   Success per collision  P = E · (1 − 0.85·B·(0.3 + 0.7·cos α))
     E = electrophilicity of C (alkyl groups reduce it, Ph resonance reduces it)
     B = steric bulk of the two groups on C,  α = angle of approach to the plane
   Textbook check (Intext 8.4, Ex 8.3), α = 90°:
     ethanal .76 > propanal .69 > propanone .43 > butanone .39;
     p-nitrobenzaldehyde .55 > benzaldehyde .44 > p-tolualdehyde .39 > acetophenone .20
     and benzaldehyde (.44) < propanal (.69).
   ===================================================================== */
const NUADD=[
  {n:'Methanal',   r1:'H',  r2:'H',   E:1.00,B:0.00},
  {n:'Ethanal',    r1:'CH₃',r2:'H',   E:0.82,B:0.28},
  {n:'Propanal',   r1:'C₂H₅',r2:'H',  E:0.76,B:0.34},
  {n:'Propanone',  r1:'CH₃',r2:'CH₃', E:0.50,B:0.56},
  {n:'Butanone',   r1:'C₂H₅',r2:'CH₃',E:0.46,B:0.62},
  {n:'p-Nitrobenzaldehyde', r1:'Ph',r2:'H', E:0.62,B:0.45},
  {n:'Benzaldehyde',r1:'Ph', r2:'H',  E:0.50,B:0.45},
  {n:'p-Tolualdehyde',r1:'Ph',r2:'H', E:0.44,B:0.45},
  {n:'Acetophenone',r1:'Ph', r2:'CH₃',E:0.25,B:0.73}
];
const NUCS=[{n:'CN⁻',p:'cyanohydrin'},{n:'HSO₃⁻',p:'bisulphite adduct'},{n:'R–OH',p:'hemiacetal'}];
function nuP(c,alphaDeg){ return c.E*(1-0.85*c.B*(0.3+0.7*Math.cos(alphaDeg*Math.PI/180))); }
function groupDraw(ctx,lab,x,y,r,col){
  if(lab==='Ph'){ hexagon(ctx,x,y,r,col,'#fff',2,Math.PI/6); circ(ctx,x,y,r*0.55,col,null,1); }
  else { circ(ctx,x,y,r,col,'#fff',2); textAt(ctx,lab,x,y+4,{align:'center',size:lab.length>2?10:12,weight:700,color:COL.muted}); }
}
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    UI.chips('cmp','Carbonyl compound',NUADD.map(c=>c.n),1)+
    UI.chips('nu','Nucleophile',NUCS.map(c=>c.n),0)+
    UI.slider('ang','Approach angle to the plane',5,90,1,90,'90° = straight down onto the carbon')+
    UI.slider('rate','Nucleophile supply',1,10,1,5)+
    UI.cards([['c1','Success / hit'],['c2','Rank of 9'],['c3','Adducts made'],['c4','Bounced off']]);
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), angS=$('#ang'), rateS=$('#rate');
  let t=0, sel=1, nuI=0;
  let pyr=0, busy=0, phase=0, ptimer=0, nus=[], hp=null, added=0, bounced=0, flash=0;
  wireChips(wrap,'cmp',i=>{ sel=i; });
  wireChips(wrap,'nu',i=>{ nuI=i; });
  animLoop(dt=>{
    t+=dt;
    const C=NUADD[sel], alpha=+angS.value, P=nuP(C,alpha), nu=NUCS[nuI];
    $('#angV').textContent=alpha+'°'; $('#rateV').textContent=rateS.value;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const L=Math.min(w,h)*0.16, cx=w*0.5, cy=h*0.62;
    const a=alpha*Math.PI/180;
    const dir={x:-Math.cos(a),y:-Math.sin(a)};           // from carbon towards where Nu comes from
    // geometry (pyr 0 = planar, 1 = tetrahedral)
    const Cp={x:cx,y:cy};
    const Op={x:cx+L*lerp(1.2,1.0,pyr), y:cy+L*lerp(0,0.55,pyr)};
    const Rf={x:cx-L*lerp(0.62,0.42,pyr), y:cy+L*lerp(0.45,0.85,pyr)};
    const Rb={x:cx-L*lerp(0.62,0.72,pyr), y:cy-L*lerp(0.4,-0.1,pyr)};
    // plane parallelogram
    const pl=[[cx-L*1.7,cy+L*0.75],[cx+L*0.4,cy+L*0.75],[cx+L*1.9,cy-L*0.75],[cx-L*0.2,cy-L*0.75]];
    ctx.save(); ctx.beginPath(); pl.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fillStyle='rgba(129,149,171,0.08)'; ctx.fill(); ctx.setLineDash([6,5]); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.globalAlpha=1-pyr*0.7; ctx.stroke(); ctx.restore();
    textAt(ctx,'plane of the carbonyl group',cx-L*1.55,cy+L*0.98,{size:11,weight:600,color:COL.muted,alpha:1-pyr});
    // approach path (yellow = what you change)
    const D=Math.min(w,h)*0.55, sx=cx+dir.x*D, sy=cy+dir.y*D;
    dashed(ctx,sx,sy,cx+dir.x*L*0.5,cy+dir.y*L*0.5,COL.yellow,2.4,-t*30);
    // angle arc + label
    ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,L*1.15,Math.PI,Math.PI+a,false); ctx.stroke(); ctx.restore();
    line(ctx,cx-L*1.5,cy,cx,cy,rgba('#d9a017',0.5),1.4);
    textAt(ctx,alpha+'°',cx-L*1.5,cy-L*0.35,{size:13,weight:700,color:COL.yellow});
    // bonds
    const bw=3;
    line(ctx,Cp.x,Cp.y,Rb.x,Rb.y,COL.ink,bw); line(ctx,Cp.x,Cp.y,Rf.x,Rf.y,COL.ink,bw);
    line(ctx,Cp.x,Cp.y,Op.x,Op.y,COL.ink,bw);
    ctx.save(); ctx.globalAlpha=1-pyr; line(ctx,Cp.x+2,Cp.y-6,Op.x+2,Op.y-6,COL.ink,bw); ctx.restore();
    // groups (bulk drawn as size)
    const rr=(g)=>L*(g==='H'?0.17:g==='CH₃'?0.24:g==='C₂H₅'?0.3:0.36);
    groupDraw(ctx,C.r1,Rf.x,Rf.y,rr(C.r1),COL.mid); groupDraw(ctx,C.r2,Rb.x,Rb.y,rr(C.r2),COL.mid);
    circ(ctx,Cp.x,Cp.y,L*0.16,COL.ink,'#fff',2.4); textAt(ctx,'C',Cp.x,Cp.y+4.5,{align:'center',size:13,weight:700});
    circ(ctx,Op.x,Op.y,L*0.18,COL.red,'#fff',2.6); textAt(ctx,'O',Op.x,Op.y+4.5,{align:'center',size:13,weight:700,color:COL.red});
    const dl=clamp(1-pyr*1.6,0,1);
    textAt(ctx,'δ+',Cp.x-L*0.05,Cp.y-L*0.3,{align:'center',size:14,weight:700,color:COL.red,alpha:dl});
    textAt(ctx,'δ–',Op.x+L*0.05,Op.y-L*0.3,{align:'center',size:14,weight:700,color:COL.blue,alpha:dl});
    // ---- nucleophile stream ----
    if(busy===0 && Math.random()<dt*(+rateS.value)*0.6){ // spawn
      const jit=(Math.random()-0.5)*0.16, ang2=Math.atan2(dir.y,dir.x)+jit;
      const px=cx+Math.cos(ang2)*D, py=cy+Math.sin(ang2)*D;
      nus.push({x:px,y:py,vx:-Math.cos(ang2)*190,vy:-Math.sin(ang2)*190,s:'fly',life:0,a:1});
    } else if(busy>0 && Math.random()<dt*(+rateS.value)*0.5){
      const ang2=Math.atan2(dir.y,dir.x)+(Math.random()-0.5)*0.2;
      nus.push({x:cx+Math.cos(ang2)*D,y:cy+Math.sin(ang2)*D,vx:-Math.cos(ang2)*190,vy:-Math.sin(ang2)*190,s:'fly',life:0,a:1});
    }
    nus=nus.filter(n=>{
      if(n.s==='fly'){
        n.x+=n.vx*dt; n.y+=n.vy*dt;
        const d=Math.hypot(n.x-cx,n.y-cy);
        if(d<L*0.95){
          if(busy===0 && Math.random()<P){ busy=1; phase=0; ptimer=0; n.s='stuck'; added++; flash=1; }
          else { bounced++; n.s='bounce'; const ang3=Math.atan2(n.y-cy,n.x-cx)+(Math.random()-0.5)*1.5; n.vx=Math.cos(ang3)*200; n.vy=Math.sin(ang3)*200; }
        }
      } else if(n.s==='bounce'){ n.x+=n.vx*dt; n.y+=n.vy*dt; n.a-=dt*1.1; if(n.a<=0) return false; }
      else if(n.s==='stuck'){
        const tx=cx-L*0.12, ty=cy-L*1.02*pyr-L*0.2*(1-pyr);
        n.x=approach(n.x,tx,10,dt); n.y=approach(n.y,ty,10,dt);
        if(busy===0) { n.a-=dt*2; if(n.a<=0) return false; }
      }
      const col=n.s==='stuck'&&pyr>0.8?COL.green:COL.blue;
      ctx.save(); ctx.globalAlpha=clamp(n.a,0,1);
      circ(ctx,n.x,n.y,L*0.15,col,'#fff',2.4); textAt(ctx,nu.n.length>3?'Nu⁻':nu.n,n.x,n.y+3.5,{align:'center',size:9,weight:700,color:col});
      ctx.restore();
      return n.x>-40&&n.x<w+40&&n.y>-40&&n.y<h+40;
    });
    // ---- reaction state machine: attack → sp3 → H⁺ → product → reset ----
    if(busy===1){
      ptimer+=dt;
      pyr=approach(pyr,1,3.2,dt);
      if(phase===0 && ptimer>0.7){ phase=1; ptimer=0; hp={x:cx+L*2.2,y:cy-L*1.6}; }
      if(phase===1){ hp.x=approach(hp.x,Op.x+L*0.2,5,dt); hp.y=approach(hp.y,Op.y-L*0.2,5,dt);
        ctx.save(); circ(ctx,hp.x,hp.y,L*0.11,COL.red,'#fff',2.2); textAt(ctx,'H⁺',hp.x+L*0.2,hp.y-L*0.12,{size:11,weight:700,color:COL.red}); ctx.restore();
        if(Math.hypot(hp.x-Op.x-L*0.2,hp.y-Op.y+L*0.2)<4){ phase=2; ptimer=0; hp=null; } }
      if(phase===2 && ptimer>2.0){ busy=2; ptimer=0; }
    } else if(busy===2){ pyr=approach(pyr,0,4,dt); ptimer+=dt; if(pyr<0.03){ pyr=0; busy=0; } }
    if(busy>=1){
      const prod=phase>=2&&busy===1;
      const lab=phase>=2?'O–H':'O⁻';
      pill(ctx,lab,Op.x+L*0.55,Op.y+L*0.1,phase>=2?COL.green:COL.blue,12);
      if(prod) pill(ctx,nu.p,cx+L*0.6,cy+L*1.5,COL.green,13);
    }
    // ---- reactivity ranking bar chart (all 9, at current angle) ----
    const bx=w*0.04, by=h*0.07, bwid=w*0.2;
    textAt(ctx,'Chance each collision succeeds',bx,by-10,{size:11,weight:700,color:COL.muted});
    const order=NUADD.map((c,i)=>({i,p:nuP(c,alpha)})).sort((x,y)=>y.p-x.p);
    order.forEach((o,k)=>{ const y=by+k*17; const me=o.i===sel;
      rect(ctx,bx,y,bwid*o.p,11,me?COL.yellow:COL.mid,me?rgba('#d9a017',0.35):'#eef2f8',me?2:1);
      textAt(ctx,NUADD[o.i].n,bx+bwid+8,y+10,{size:10.5,weight:me?700:500,color:me?COL.yellow:COL.muted}); });
    const rank=order.findIndex(o=>o.i===sel)+1;
    flash=approach(flash,0,3,dt);
    $('#c1').textContent=fmt(P*100,0)+' %'; $('#c2').textContent='#'+rank; $('#c3').textContent=added; $('#c4').textContent=bounced;
  });
  return wrap;
}

/* =====================================================================
   3.3 BOILING POINTS
   Real 2-D Lennard-Jones molecular dynamics. The well depth ε of each liquid is
   proportional to its textbook b.p. (ε = b.p.), the thermostat holds T* = T/b.p.,
   so every liquid is about half vapour when T = its own b.p. (calibrated on this box).
   Data (Section 8.3): n-butane 273 K, methoxyethane 281 K, propanal 322 K,
   propanone 329 K, propan-1-ol 370 K, ethanoic acid 391 K (M ≈ 58–60 g/mol).
   ===================================================================== */
const BPS=[
  {n:'n-Butane',     f:'CH₃CH₂CH₂CH₃', bp:273, M:58, type:'vdw',  force:'van der Waals only'},
  {n:'Methoxyethane',f:'CH₃OC₂H₅',     bp:281, M:60, type:'ether',force:'weak dipole'},
  {n:'Propanal',     f:'C₂H₅CHO',      bp:322, M:58, type:'dip',  force:'dipole–dipole'},
  {n:'Propanone',    f:'CH₃COCH₃',     bp:329, M:58, type:'dip',  force:'dipole–dipole'},
  {n:'Propan-1-ol',  f:'C₃H₇OH',       bp:370, M:60, type:'hb',   force:'H-bonds'},
  {n:'Ethanoic acid',f:'CH₃COOH',      bp:391, M:60, type:'acid', force:'H-bonds (dimers)'}
];
const BPCOL={vdw:'#8195ab',ether:'#8fb4d9',dip:COL.blue,hb:COL.red,acid:COL.red};
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    UI.chips('cmp','Liquid',BPS.map(c=>c.n),4)+
    UI.slider('tt','Heater setting',200,430,1,300,'Thermometer follows the heater')+
    UI.cards([['c1','Boiling point'],['c2','Held together by'],['c3','Now',''],['c4','Vapour']]);
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), tt=$('#tt');
  const N=46, W=11, Hh=20, G=0.01;
  let t=0, sel=4, T=300, vap=0;
  const p=[]; { const cols=Math.floor(W/1.12); for(let i=0;i<N;i++) p.push({x:0.6+(i%cols)*1.12+(Math.floor(i/cols)%2)*0.3,y:Hh-0.6-Math.floor(i/cols)*0.98,vx:(Math.random()-0.5),vy:(Math.random()-0.5),fx:0,fy:0,a:Math.random()*6.28,om:(Math.random()-0.5)*2}); }
  wireChips(wrap,'cmp',i=>{ sel=i; });
  function step(dt,Tstar){
    for(const a of p){ a.fx=0; a.fy=G; }
    for(let i=0;i<N;i++){ const a=p[i]; for(let j=i+1;j<N;j++){ const b=p[j]; const dx=a.x-b.x, dy=a.y-b.y, r2=dx*dx+dy*dy; if(r2>6.25) continue;
      const rr=Math.max(r2,0.6), i2=1/rr, i6=i2*i2*i2, f=24*i2*(2*i6*i6-i6); a.fx+=f*dx; a.fy+=f*dy; b.fx-=f*dx; b.fy-=f*dy; } }
    let K=0;
    for(const a of p){ a.vx+=a.fx*dt; a.vy+=a.fy*dt; a.x+=a.vx*dt; a.y+=a.vy*dt;
      if(a.x<0.5){a.x=0.5;a.vx=Math.abs(a.vx);} if(a.x>W-0.5){a.x=W-0.5;a.vx=-Math.abs(a.vx);}
      if(a.y<0.5){a.y=0.5;a.vy=Math.abs(a.vy);} if(a.y>Hh-0.5){a.y=Hh-0.5;a.vy=-Math.abs(a.vy);}
      K+=a.vx*a.vx+a.vy*a.vy; }
    const Tn=K/(2*N), lam=Math.sqrt(1+0.03*(Tstar/Math.max(Tn,1e-3)-1)); for(const a of p){ a.vx*=lam; a.vy*=lam; }
  }
  animLoop(dt=>{
    t+=dt;
    const C=BPS[sel], target=+tt.value;
    T=approach(T,target,1.1,dt);
    $('#ttV').textContent=Math.round(T)+' K';
    const Tstar=clamp(1.0*T/C.bp,0.05,1.8);
    const sub=clamp(Math.round(dt*60*12),4,24);
    for(let s=0;s<sub;s++) step(0.004,Tstar);
    p.forEach(a=>{ a.a+=a.om*dt; a.om+=gauss()*dt*3; a.om=clamp(a.om,-3,3); });
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const sg=Math.min(h*0.6/Hh,w*0.3/W), vw=W*sg, vh=Hh*sg, vx0=w*0.27-vw/2, vy0=h*0.1;
    // heater
    const hot=clamp((target-T)/60+0.25,0,1)*(target>240?1:0);
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(vx0-20,vy0+vh+70); ctx.lineTo(vx0+vw+20,vy0+vh+70); ctx.stroke(); ctx.restore();
    rect(ctx,vx0+vw/2-14,vy0+vh+46,28,24,COL.ink,'#fff',2.4);
    flame(ctx,vx0+vw/2,vy0+vh+44,vw*0.6,hot,t);
    // vessel (closed flask with stopper)
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3.2; ctx.beginPath(); ctx.moveTo(vx0-6,vy0-6); ctx.lineTo(vx0-6,vy0+vh+6); ctx.lineTo(vx0+vw+6,vy0+vh+6); ctx.lineTo(vx0+vw+6,vy0-6); ctx.stroke(); ctx.restore();
    line(ctx,vx0-14,vy0-6,vx0+vw+14,vy0-6,COL.ink,5);
    // liquid tint
    ctx.save(); ctx.beginPath(); ctx.rect(vx0-4,vy0-4,vw+8,vh+8); ctx.clip();
    // links
    const cap=C.type==='hb'||C.type==='acid'?2:C.type==='dip'?3:4;
    const lc=new Array(N).fill(0), pairs=[];
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){ const d=Math.hypot(p[i].x-p[j].x,p[i].y-p[j].y); if(d<1.55) pairs.push([d,i,j]); }
    pairs.sort((a,b)=>a[0]-b[0]);
    const lk=BPCOL[C.type];
    let nb=new Array(N).fill(0); for(const [d,i,j] of pairs){ nb[i]++; nb[j]++; }
    pairs.forEach(([d,i,j])=>{ if(lc[i]>=cap||lc[j]>=cap) return; lc[i]++; lc[j]++;
      const a=p[i], b=p[j], x1=vx0+a.x*sg, y1=vy0+a.y*sg, x2=vx0+b.x*sg, y2=vy0+b.y*sg;
      const lw=C.type==='acid'?2.4:C.type==='hb'?2.2:C.type==='dip'?1.8:1.1;
      ctx.save(); ctx.globalAlpha=C.type==='vdw'?0.4:C.type==='ether'?0.55:0.95; dashed(ctx,x1,y1,x2,y2,lk,lw,-t*20);
      if(C.type==='acid'){ const nx=-(y2-y1)/(d*sg||1)*3, ny=(x2-x1)/(d*sg||1)*3; dashed(ctx,x1+nx,y1+ny,x2+nx,y2+ny,lk,1.6,-t*20); }
      ctx.restore(); });
    // molecules
    p.forEach(a=>{
      const x=vx0+a.x*sg, y=vy0+a.y*sg, r=sg*0.46;
      circ(ctx,x,y,r,lk,'rgba(255,255,255,0.9)',2);
      const tx=x+Math.cos(a.a)*r, ty=y+Math.sin(a.a)*r;
      const polar=C.type!=='vdw';
      if(polar){ circ(ctx,tx,ty,r*0.34,C.type==='hb'||C.type==='acid'?COL.red:COL.blue,C.type==='hb'||C.type==='acid'?COL.red:COL.blue,1); }
      else line(ctx,x-Math.cos(a.a)*r*0.5,y-Math.sin(a.a)*r*0.5,tx,ty,COL.mid,1.6);
    });
    ctx.restore();
    // vapour fraction (isolated molecules)
    let v=0; for(let i=0;i<N;i++) if(nb[i]<=1) v++;
    vap=approach(vap,v/N,2,dt);
    // thermometer with b.p. mark
    const thx=vx0+vw+44, thT=vy0+10, thB=vy0+vh-28;
    const fr=(x)=>clamp((x-200)/(430-200),0,1);
    thermo(ctx,thx,thT,thB,fr(T),COL.ink,COL.red);
    const bpy=thB-(thB-thT-5)*fr(C.bp);
    line(ctx,thx-12,bpy,thx+12,bpy,COL.yellow,2.6); textAt(ctx,'b.p.',thx+16,bpy+4,{size:11,weight:700,color:COL.yellow});
    textAt(ctx,Math.round(T)+' K',thx,thT-8,{align:'center',size:13,weight:700,color:COL.red});
    // b.p. ladder (all six liquids, same scale)
    const lx=w*0.58, lw=w*0.36, ly=h*0.14, rh=Math.min(36,h*0.075);
    textAt(ctx,'Boiling points — M ≈ 58–60 g/mol',lx,ly-16,{size:12,weight:700,color:COL.muted});
    BPS.forEach((b,i)=>{ const y=ly+i*rh*1.35, me=i===sel, col=BPCOL[b.type];
      const bw=lw*(b.bp-200)/(430-200);
      rect(ctx,lx,y,bw,rh*0.72,col,rgba(col.length===7?col:'#2f8fe0',me?0.28:0.1),me?2.6:1.2);
      textAt(ctx,b.n,lx+6,y+rh*0.5,{size:11.5,weight:me?700:600,color:COL.ink});
      textAt(ctx,b.bp+' K',lx+bw+6,y+rh*0.5,{size:11.5,weight:700,color:col}); });
    const tx=lx+lw*(T-200)/(430-200);
    dashed(ctx,tx,ly-8,tx,ly+BPS.length*rh*1.35,COL.red,2.2,-t*25); textAt(ctx,'T',tx,ly-12,{align:'center',size:12,weight:700,color:COL.red});
    // state label
    const boil=T>=C.bp-1;
    pill(ctx,boil?'boiling · vapour rising':T>C.bp-40?'evaporating':'liquid',vx0+vw/2,vy0-24,boil?COL.red:COL.blue,12);
    // force legend
    textAt(ctx,'dashes = intermolecular forces',lx,h*0.92,{size:11.5,weight:600,color:COL.muted});
    dashed(ctx,lx+190,h*0.92-4,lx+230,h*0.92-4,lk,2.2,-t*20);
    $('#c1').textContent=C.bp+' K'; $('#c2').textContent=C.force; $('#c3').textContent=boil?'Boiling':'Below b.p.'; $('#c4').textContent=fmt(vap*100,0)+' %';
  });
  return wrap;
}

/* =====================================================================
   3.4 SOLUBILITY IN WATER
   Lower members form H-bonds with water; the hydrocarbon tail is hydrophobic.
   Textbook: aldehydes/ketones up to 3 C and acids up to 4 C are miscible,
   solubility then falls rapidly. Model: f(n) = 1 for n ≤ limit, else exp(−0.9·(n − limit)).
   Each molecule carries a fixed random threshold u: it dissolves while u < f(n).
   ===================================================================== */
const SOLF=[
  {n:'Aldehyde',  lim:3, min:1, col:COL.green, names:['Methanal','Ethanal','Propanal','Butanal','Pentanal','Hexanal','Heptanal','Octanal','Nonanal','Decanal'], head:'CHO'},
  {n:'Ketone',    lim:3, min:3, col:COL.blue,  names:['','','Propanone','Butanone','Pentan-2-one','Hexan-2-one','Heptan-2-one','Octan-2-one','Nonan-2-one','Decan-2-one'], head:'CO'},
  {n:'Carboxylic acid', lim:4, min:1, col:COL.red, names:['Methanoic acid','Ethanoic acid','Propanoic acid','Butanoic acid','Pentanoic acid','Hexanoic acid','Heptanoic acid','Octanoic acid','Nonanoic acid','Decanoic acid'], head:'COOH'}
];
function solF(fam,n){ const F=SOLF[fam]; return n<=F.lim?1:Math.exp(-0.9*(n-F.lim)); }
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    UI.chips('fam','Family',SOLF.map(f=>f.n),0)+
    UI.slider('cn','Carbon atoms in the molecule',1,10,1,3)+
    `<div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="add" style="padding:10px;flex:1 1 0">+ Add 8 molecules</button><button class="toggle-btn navy" id="stir" style="padding:10px;margin-top:0;flex:1 1 0">Stir</button></div>`+
    UI.cards([['c1','Compound'],['c2','Dissolved'],['c3','Floating layer'],['c4','Mixes with water?']]);
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), cn=$('#cn');
  let fMark=1, t=0, fam=0, nShown=3, stir=0, queue=16, qt=0, spawned=0, nTail=3;
  const mol=[]; const water=[];
  const R=rng(5); for(let i=0;i<70;i++) water.push({x:R(),y:R(),a:R()*6.28,vx:0,vy:0});
  wireChips(wrap,'fam',i=>{ fam=i; if(+cn.value<SOLF[i].min) cn.value=SOLF[i].min; });
  $('#add').onclick=()=>{ if(mol.length+queue<40) queue+=8; };
  $('#stir').onclick=()=>{ stir=2.5; };
  animLoop(dt=>{
    t+=dt; stir=Math.max(0,stir-dt);
    const F=SOLF[fam]; let n=+cn.value; if(n<F.min){ n=F.min; cn.value=n; }
    $('#cnV').textContent=n+' C';
    nTail=approach(nTail,n,6,dt);
    const f=solF(fam,n); fMark=approach(fMark,f,5,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const bx0=w*0.1, bx1=w*0.56, byT=h*0.2, byB=h*0.88, wlv=h*0.38, bw=bx1-bx0, bcx=(bx0+bx1)/2;
    const seg=Math.min(8,h*0.014);
    // dropper
    qt-=dt; if(queue>0 && qt<=0){ queue--; qt=0.13; mol.push({x:bcx+(Math.random()-0.5)*bw*0.25,y:h*0.1,vx:(Math.random()-0.5)*20,vy:60,u:Math.random(),mode:'fall',a:Math.random()*6.28,slot:0,ph:Math.random()*6.28}); }
    const dx=bcx, dy=h*0.04;
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(dx-9,dy); ctx.lineTo(dx-9,dy+h*0.07); ctx.lineTo(dx,dy+h*0.1); ctx.lineTo(dx+9,dy+h*0.07); ctx.lineTo(dx+9,dy); ctx.stroke(); ctx.restore();
    rect(ctx,dx-12,dy-18,24,18,COL.ink,'#fff',2.2);
    // beaker back + water
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.09)'; ctx.fillRect(bx0,wlv,bw,byB-wlv); ctx.restore();
    // water molecules (blue V) jiggle
    water.forEach(wm=>{ wm.vx+=gauss()*dt*0.25-wm.vx*dt*2; wm.vy+=gauss()*dt*0.25-wm.vy*dt*2; wm.x=clamp(wm.x+wm.vx*dt*(1+stir*3),0.02,0.98); wm.y=clamp(wm.y+wm.vy*dt*(1+stir*3),0.02,0.98); wm.a+=gauss()*dt*2;
      waterV(ctx,bx0+wm.x*bw,wlv+14+wm.y*(byB-wlv-24),wm.a,4.5,rgba('#2f8fe0',0.55)); });
    // ripples + stirring rod
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.beginPath(); for(let x=0;x<=bw;x+=4){ const y=wlv+Math.sin(x*0.06+t*2.2)*(1.5+stir*3); x?ctx.lineTo(bx0+x,y):ctx.moveTo(bx0+x,y); } ctx.stroke(); ctx.restore();
    if(stir>0){ const rx=bcx+Math.cos(t*7)*bw*0.22, ry=wlv+(byB-wlv)*0.5+Math.sin(t*7)*20; line(ctx,rx+30,byT-20,rx,ry,COL.mid,5); line(ctx,rx+30,byT-20,rx,ry,'#fff',2.4); }
    // molecules
    const dis=[], flo=[];
    mol.forEach((m,i)=>{
      const dissolves=m.u<f;
      if(m.mode==='fall'){ m.vy+=560*dt; m.x+=m.vx*dt; m.y+=m.vy*dt; if(m.y>wlv+4){ m.mode='live'; m.vy*=0.25; } }
      if(m.mode==='live'){
        if(dissolves){ // diffuse in the water
          m.vx+=gauss()*dt*(60+stir*260)-m.vx*dt*2.5; m.vy+=gauss()*dt*(60+stir*260)-m.vy*dt*2.5;
          m.x+=m.vx*dt; m.y+=m.vy*dt;
          if(m.y<wlv+18){ m.vy+=500*dt; }
          m.a+=gauss()*dt*2.2;
          dis.push(m);
        } else { // hydrophobic: rise and join the floating layer
          flo.push(m);
        }
      }
      m.x=clamp(m.x,bx0+18,bx1-18); m.y=clamp(m.y,m.mode==='fall'?-40:wlv-30,byB-14);
    });
    // floating layer slots
    const perRow=Math.max(2,Math.floor((bw-30)/(nTail*seg*0.9+10)));
    flo.forEach((m,k)=>{ const row=Math.floor(k/perRow), col=k%perRow;
      const tx=bx0+20+(col+0.5)*(bw-40)/perRow, ty=wlv-8-row*10;
      m.vx=approach(m.vx,(tx-m.x)*6,6,dt); m.vy=approach(m.vy,(ty-m.y)*8+Math.sin(t*2+m.ph)*6,6,dt);
      m.x+=m.vx*dt; m.y+=m.vy*dt; m.a=approach(m.a,0,6,dt); });
    // draw molecules
    const drawMol=(m,dissolved)=>{
      ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(dissolved?m.a:0);
      const len=nTail*seg*0.9; ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(-len/2,0);
      const ns=Math.max(1,Math.round(nTail)); for(let k=1;k<=ns;k++) ctx.lineTo(-len/2+k*len/ns,(k%2?-1:1)*seg*0.35); ctx.stroke();
      const hx=len/2+4, col=F.col;
      circ(ctx,hx,0,4.2,COL.red,'#fff',2);
      if(fam===2) circ(ctx,hx+7,-3,3.4,COL.red,'#fff',2);
      ctx.restore();
      if(dissolved){ // hydrogen bonds to the two nearest water glyphs
        const hxs=m.x+Math.cos(m.a)*(len/2+4), hys=m.y+Math.sin(m.a)*(len/2+4);
        let best=[]; water.forEach(wm=>{ const X=bx0+wm.x*bw, Y=wlv+14+wm.y*(byB-wlv-24); const d=Math.hypot(X-hxs,Y-hys); best.push([d,X,Y]); }); best.sort((a,b)=>a[0]-b[0]);
        for(let k=0;k<(fam===2?3:2);k++){ if(best[k][0]<36) dashed(ctx,hxs,hys,best[k][1],best[k][2],COL.blue,1.4,-t*12); }
      }
    };
    flo.forEach(m=>drawMol(m,false)); dis.forEach(m=>drawMol(m,true));
    mol.filter(m=>m.mode==='fall').forEach(m=>drawMol(m,false));
    // beaker front
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(bx0-6,byT); ctx.lineTo(bx0,byT); ctx.lineTo(bx0,byB); ctx.lineTo(bx1,byB); ctx.lineTo(bx1,byT); ctx.lineTo(bx1+6,byT); ctx.stroke(); ctx.restore();
    textAt(ctx,'water',bcx,byB+22,{align:'center',size:12,weight:700,color:COL.blue});
    if(flo.length>0) pill(ctx,'floating layer',bcx,wlv-16-Math.ceil(flo.length/perRow)*10-10,F.col,11.5);
    // solubility curves
    const cx0=w*0.64, cy0=h*0.12, cw=w*0.31, ch=h*0.42;
    textAt(ctx,'Dissolved fraction vs carbon atoms',cx0,cy0-12,{size:12,weight:700,color:COL.muted});
    line(ctx,cx0,cy0+ch,cx0+cw,cy0+ch,COL.ink,2); line(ctx,cx0,cy0,cx0,cy0+ch,COL.ink,2);

    parts.forEach(p=>{
      if(p.gone){ p.gone+=dt; p.y-=dt*2; p.x+=dt*0.1; if(p.gone>1.8){ p.dead=true; } }
      else { p.vx+=gauss()*dt*3-p.vx*dt*2; p.vy+=gauss()*dt*3-p.vy*dt*2; p.x+=p.vx*dt*0.12*(spd/60+0.6); p.y+=p.vy*dt*0.12*(spd/60+0.6); }
      p.fl=Math.max(0,p.fl-dt*2.5);
      let X=fx+(p.x-0.5)*2*fr*0.9, Y=fy+(p.y-0.5)*2*fr*0.9;
      if(!p.gone){ const dx=X-fx, dy=Y-fy, d=Math.hypot(dx,dy), lim=fr*0.88; if(d>lim){ p.x=0.5+(dx/d*lim*0.97)/(2*fr*0.9); p.y=0.5+(dy/d*lim*0.97)/(2*fr*0.9); p.vx*=-1; p.vy*=-1; X=fx+(p.x-0.5)*2*fr*0.9; Y=fy+(p.y-0.5)*2*fr*0.9; } }
      else { Y=fy-fr*0.8-p.gone*h*0.18; X=fx+(p.x-0.5)*fr; }
      ctx.save(); ctx.globalAlpha=p.gone?Math.max(0,1-p.gone/1.8):1;
      const col=[COL.red,COL.blue,COL.green,COL.yellow][p.ty], r=p.ty===3?3.6:p.ty===2?6.5:5;
      circ(ctx,X,Y,r,col,'#fff',2); if(p.ty===2) circ(ctx,X,Y,r*0.45,col,null,1.4);
      if(p.fl>0) circ(ctx,X,Y,r+8*(1-p.fl),COL.green,null,2*p.fl);
      ctx.restore(); });
    parts=parts.filter(p=>!p.dead);
    // legend
    [['acid',COL.red],['alcohol',COL.blue],['ester',COL.green],['water',COL.yellow]].forEach(([l,c],k)=>{ circ(ctx,w*0.06+k*w*0.095,h*0.06,5,c,'#fff',2); textAt(ctx,l,w*0.06+k*w*0.095+10,h*0.06+4,{size:11.5,weight:600,color:COL.muted}); });
    // yield chart
    ht+=dt; if(ht>0.25){ ht=0; hist.push(cnt[2]/NA); if(hist.length>160) hist.shift(); }
    const cx0=w*0.55, cy0=h*0.14, cw=w*0.4, chh=h*0.5;
    textAt(ctx,'Ester formed (% of acid)',cx0,cy0-12,{size:12,weight:700,color:COL.muted});
    line(ctx,cx0,cy0+chh,cx0+cw,cy0+chh,COL.ink,2); line(ctx,cx0,cy0,cx0,cy0+chh,COL.ink,2);
    textAt(ctx,'100',cx0-6,cy0+4,{align:'right',size:10.5,weight:600,color:COL.muted}); textAt(ctx,'0',cx0-6,cy0+chh,{align:'right',size:10.5,weight:600,color:COL.muted});
    const eq=eqYield(NA,Math.round(NA*ratio),K), eqY=cy0+chh-chh*(dry?1:eq);
    dashed(ctx,cx0,eqY,cx0+cw,eqY,COL.yellow,2.2,-t*20); textAt(ctx,dry?'→ 100 % as water leaves':'equilibrium '+fmt(eq*100,0)+' %',cx0+cw,eqY-6,{align:'right',size:11.5,weight:700,color:COL.yellow});
    ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=3; ctx.beginPath(); hist.forEach((v,i)=>{ const X=cx0+cw*i/160, Y=cy0+chh-chh*clamp(v,0,1); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.stroke(); ctx.restore();
    if(hist.length){ const v=hist[hist.length-1]; circ(ctx,cx0+cw*(hist.length-1)/160,cy0+chh-chh*clamp(v,0,1),5,COL.green,COL.green,1); }
    textAt(ctx,'time →',cx0+cw,cy0+chh+18,{align:'right',size:11,weight:600,color:COL.muted});
    // bars
    const by=h*0.78; [['acid',cnt[0],COL.red],['alcohol',cnt[1],COL.blue],['ester',cnt[2],COL.green],['water',cnt[3],COL.yellow]].forEach(([l,n,c],k)=>{ const x=cx0+k*cw/4; rect(ctx,x,by-n*1.2,cw/5,n*1.2,c,rgba(c,0.2),2); textAt(ctx,l+' '+n,x+cw/10,by+16,{align:'center',size:11,weight:700,color:c}); });
    $('#c1').textContent=fmt(cnt[2]/NA*100,0)+' %'; $('#c2').textContent=dry?'→ 100 %':fmt(eq*100,0)+' %'; $('#c3').textContent=cnt[3]; $('#c4').textContent=catF<0.1?'very slow':catF*tF>0.8?'fast':'moderate';
  });
  return wrap;
}

/* =====================================================================
   3.10 SODIUM HYDROGENCARBONATE TEST
   RCOOH + NaHCO₃ → RCOONa + H₂O + CO₂↑   happens only if the acid is stronger than
   H₂CO₃ (pKa ≈ 6.35). Fizz rate ∝ (6.35 − pKa). Phenol (10) and ethanol (16) give no gas.
   CO₂ led into lime water → milky CaCO₃.
   ===================================================================== */
const BICARB=[{n:'Methanoic acid',pKa:3.75},{n:'Benzoic acid',pKa:4.19},{n:'Ethanoic acid',pKa:4.76},{n:'Phenol',pKa:10},{n:'Ethanol',pKa:16}];
function buildA10(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    UI.chips('cm','Sample',BICARB.map(c=>c.n),2)+
    UI.slider('dr','Drops of sample',1,20,1,8)+
    `<div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go" style="padding:10px;flex:1 1 0">Add drops</button><button class="toggle-btn navy" id="rst" style="padding:10px;margin-top:0;flex:1 1 0">Fresh tubes</button></div>`+
    UI.cards([['c1','pKa'],['c2','Stronger than H₂CO₃?'],['c3','CO₂ gas'],['c4','Lime water']]);
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let t=0, sel=2, left=0, tm=0, fizz=0, co2=0, milk=0, drops=[], bub=[], bub2=[], gas=[];
  wireChips(wrap,'cm',i=>{ sel=i; fizz=0; co2=0; milk=0; });
  $('#go').onclick=()=>{ left+=+$('#dr').value; };
  $('#rst').onclick=()=>{ left=0; fizz=0; co2=0; milk=0; bub=[]; bub2=[]; gas=[]; };
  animLoop(dt=>{
    t+=dt; $('#drV').textContent=$('#dr').value;
    const C=BICARB[sel], act=clamp((6.35-C.pKa)/3,0,1);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const hw=Math.min(w*0.07,50), t1=w*0.26, t2=w*0.7, top=h*0.3, bot=h*0.82, lq=h*0.55;
    // dropper
    const dx=t1; tm-=dt; if(left>0&&tm<=0){ left--; tm=0.28; drops.push({x:dx,y:h*0.17,vy:20}); }
    drops=drops.filter(d=>{ d.vy+=800*dt; d.y+=d.vy*dt; if(d.y>=lq){ fizz+=act*1.0; for(let q=0;q<4;q++) bub.push({x:t1+(Math.random()-0.5)*hw*1.4,y:lq+Math.random()*20,r:2+Math.random()*3,s:30+Math.random()*30}); return false; } ctx.beginPath(); ctx.ellipse(d.x,d.y,3.2,5,0,0,Math.PI*2); ctx.fillStyle='#e5f0f9'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.4; ctx.stroke(); return true; });
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(dx-8,h*0.06); ctx.lineTo(dx-8,h*0.13); ctx.lineTo(dx,h*0.16); ctx.lineTo(dx+8,h*0.13); ctx.lineTo(dx+8,h*0.06); ctx.closePath(); ctx.fill(); ctx.stroke(); rrect(ctx,dx-11,h*0.02,22,h*0.05,8); ctx.fillStyle=COL.yellow; ctx.fill(); ctx.stroke(); ctx.restore();
    // fizz dynamics
    const rate=fizz*38; fizz*=Math.exp(-0.45*dt); co2+=fizz*dt*0.45;
    if(Math.random()<dt*rate) bub.push({x:t1+(Math.random()-0.5)*hw*1.6,y:bot-hw,r:2+Math.random()*3.5,s:40+Math.random()*40});
    bub=bub.filter(b=>{ b.y-=b.s*dt; b.x+=Math.sin(b.y*0.15)*0.4; if(b.y<lq-hw*0.2){ if(Math.random()<0.6&&gas.length<40) gas.push({u:0}); return false; } return true; });
    // tube 1
    ctx.save(); tubePath(ctx,t1,top,bot,hw); ctx.closePath(); ctx.clip(); ctx.fillStyle='#eef6fd'; ctx.fillRect(t1-hw,lq,2*hw,bot-lq);
    bub.forEach(b=>circ(ctx,b.x,b.y,b.r,COL.blue,null,1.4));
    if(fizz>0.05){ const fh=Math.min(hw*1.2,fizz*18); for(let q=0;q<10;q++) circ(ctx,t1-hw+((q*0.137+t*0.1)%1)*hw*2,lq-fh*((q%3)/3)-2,2.5+(q%3),COL.mid,'#fff',1.2); }
    ctx.restore();
    line(ctx,t1-hw,lq,t1+hw,lq,COL.ink,1.6);
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineCap='round'; tubePath(ctx,t1,top,bot,hw); ctx.stroke(); ctx.restore();
    textAt(ctx,'NaHCO₃ solution',t1,bot+hw*0.5+22,{align:'center',size:12,weight:700,color:COL.blue});
    // stopper + delivery tube
    rect(ctx,t1-hw-2,top-10,hw*2+4,12,COL.ink,'#d9e2ee',2.4);
    const path=[[t1,top-4],[t1,top-h*0.1],[t2,top-h*0.1],[t2,bot-hw*0.6]];
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=7; ctx.lineJoin='round'; ctx.beginPath(); path.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.strokeStyle='#fff'; ctx.lineWidth=3.6; ctx.stroke(); ctx.restore();
    // gas packets travel along the delivery tube
    const segs=[]; let tot=0; for(let i=1;i<path.length;i++){ const L=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]); segs.push(L); tot+=L; }
    gas=gas.filter(g=>{ g.u+=dt*0.5; if(g.u>=1){ for(let q=0;q<2;q++) bub2.push({x:t2+(Math.random()-0.5)*8,y:bot-hw*0.6,r:2+Math.random()*2.5,s:35+Math.random()*25}); co2+=0.0; milk=Math.min(1,milk+0.018); return false; }
      let d=g.u*tot, i=0; while(i<segs.length-1&&d>segs[i]){ d-=segs[i]; i++; } const a=path[i], b=path[i+1], k=d/segs[i]; circ(ctx,lerp(a[0],b[0],k),lerp(a[1],b[1],k),2.6,COL.mid,'#fff',1.4); return true; });
    // tube 2 — lime water
    ctx.save(); tubePath(ctx,t2,top,bot,hw); ctx.closePath(); ctx.clip();
    ctx.fillStyle=mixCol('#f1f8fd','#cfd5db',milk); ctx.fillRect(t2-hw,lq,2*hw,bot-lq);
    if(milk>0.1){ const R=rng(3); ctx.fillStyle='rgba(255,255,255,'+(0.5*milk)+')'; for(let q=0;q<40;q++){ ctx.beginPath(); ctx.arc(t2-hw+R()*hw*2,lq+R()*(bot-lq)+Math.sin(t+q)*2,1.6+R()*1.4,0,Math.PI*2); ctx.fill(); } }
    bub2=bub2.filter(b=>{ b.y-=b.s*dt; if(b.y<lq) return false; circ(ctx,b.x,b.y,b.r,COL.blue,null,1.3); return true; });
    ctx.restore(); line(ctx,t2-hw,lq,t2+hw,lq,COL.ink,1.6);
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineCap='round'; tubePath(ctx,t2,top,bot,hw); ctx.stroke(); ctx.restore();
    textAt(ctx,'lime water',t2,bot+hw*0.5+22,{align:'center',size:12,weight:700,color:COL.blue});
    pill(ctx,C.n,t1,top-h*0.16,COL.yellow,12);
    const strong=C.pKa<6.35;
    textAt(ctx,'pKa '+C.pKa+'  vs  H₂CO₃ 6.35',w*0.5,h*0.06,{align:'center',size:12.5,weight:700,color:strong?COL.green:COL.red});
    $('#c1').textContent=C.pKa; $('#c2').textContent=strong?'Yes':'No'; $('#c3').textContent=fizz>0.05?'Fizzing':co2>0.01?'Released':'None'; $('#c4').textContent=milk>0.4?'Milky':milk>0.05?'Clouding':'Clear';
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   1. ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const activities = [
  { num:'3.1', title:'The Carbonyl Group', desc:'Spin it · see the π cloud and the dipole', build: buildA1 },
  { num:'3.2', title:'Nucleophilic Addition', desc:'Fire nucleophiles at C=O · change the angle', build: buildA2 },
  { num:'3.3', title:'Boiling Points', desc:'Heat each liquid · watch it escape', build: typeof buildA3==='function'?buildA3:null },
  { num:'3.4', title:'Solubility in Water', desc:'Lengthen the chain · see it stop mixing', build: typeof buildA4==='function'?buildA4:null },
  { num:'3.5', title:'Tollens’ & Fehling’s Tests', desc:'Warm the tubes · aldehyde or ketone?', build: typeof buildA5==='function'?buildA5:null },
  { num:'3.6', title:'Iodoform & 2,4-DNP Tests', desc:'Which compounds give the precipitate?', build: typeof buildA6==='function'?buildA6:null },
  { num:'3.7', title:'Aldol & Cannizzaro', desc:'α-hydrogen decides the path', build: typeof buildA7==='function'?buildA7:null },
  { num:'3.8', title:'Acidity of Carboxylic Acids', desc:'Substituents · pKa · ions in water', build: typeof buildA8==='function'?buildA8:null },
  { num:'3.9', title:'Esterification', desc:'Acid + alcohol ⇌ ester + water', build: typeof buildA9==='function'?buildA9:null },
  { num:'3.10', title:'Sodium Hydrogencarbonate Test', desc:'Which compounds fizz with NaHCO₃?', build: typeof buildA10==='function'?buildA10:null },
].filter(a=>a.build);
let currentIndex = 0;
try{ const s=parseInt(localStorage.getItem('c3act')); if(s>=0&&s<activities.length) currentIndex=s; }catch(e){}
if(location.hash){ const k=parseInt(location.hash.slice(1)); if(k>=0&&k<activities.length) currentIndex=k; }

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; try{localStorage.setItem('c3act',i);}catch(e){} render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}

render();
</script>
