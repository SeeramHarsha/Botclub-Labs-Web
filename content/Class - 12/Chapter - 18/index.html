/* =====================================================================
   4.10 ALLOYS AND INTERSTITIAL COMPOUNDS — why they are hard (§4.3.13-14)
   Top block of atoms is pushed by a shear force F. A periodic lattice
   potential resists:   s'' = k(F − Fc·sin(2πs/a)) − c·s'
   • F < Fc : the layers stretch elastically and stay locked
   • F > Fc : the layers slip — stick-slip motion from the equation itself
   Foreign atoms raise Fc. Alloys form readily only when radii differ < 15 %.
   ===================================================================== */
function buildA10(){
  const L=makeLab(
    uiToggle('Material','mode',[['pure','Pure metal'],['sub','Alloy (replaces atoms)'],['int','Interstitial (C, N, H)']],true)+
    uiSlider('Foreign atoms (%)','x',0,40,1,20)+
    uiSlider('Size of foreign atom ÷ host','r',0.7,1.3,0.01,1.08)+
    uiSlider('Shear force F','F',0,100,1,0)+
    uiButtons([['rl','Release','']])+
    uiCards([['c1','Force needed to slip',COL.blue],['c2','Hardness vs pure',COL.red],['c3','Layers',COL.green,'',1]])+
    uiHint('h1','')
  );
  L.$('#c3').parentElement.classList.add('wide');
  const {$,canvas}=L; let mode='pure', t=0;
  chipWire($('#mode'),v=>mode=v); $('#rl').onclick=()=>{ $('#F').value=0; };
  const N=12, ROWS=6, R=rng(9);
  const site=[]; for(let r=0;r<ROWS;r++) for(let c=0;c<N;c++) site.push({r,c,u:R(),u2:R()});
  const gaps=[]; for(let c=0;c<N;c++){ gaps.push({c,u:R(),row:2}); gaps.push({c,u:R(),row:1}); gaps.push({c,u:R(),row:4}); }
  const S={x:0,v:0}; let Fv=0;
  animLoop(dt=>{
    t+=dt;
    const x=+$('#x').value/100, ratio=+$('#r').value, F=+$('#F').value;
    $('#xV').textContent=Math.round(x*100)+' %'; $('#rV').textContent=ratio.toFixed(2); $('#FV').textContent=F;
    const mism=Math.abs(ratio-1), separate=mode==='sub'&&mism>0.15&&x>0;
    let hard=1;
    if(mode==='sub') hard=separate?1+1.0*x:1+5*x*(1+8*mism);
    if(mode==='int') hard=1+14*x;
    const Fc=12*hard, a0=1;
    $('#rV').parentElement.style.opacity=mode==='sub'?1:0.4; $('#r').disabled=mode!=='sub';
    $('#x').disabled=mode==='pure'; $('#xV').parentElement.style.opacity=mode==='pure'?0.4:1;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const a=Math.min((w*0.86)/(N+0.5),(h*0.7)/(ROWS*0.866+0.6)), rowH=a*0.866, x0=w*0.07+a/2, yb=h*0.84;
    // lattice dynamics (stick–slip)
    const k=26, c=7;
    Fv=approach(Fv,F,10,dt);
    for(let i=0;i<4;i++){ const sub=dt/4; const acc=k*(Fv-Fc*Math.sin(2*Math.PI*S.x/a))-c*S.v; S.v+=acc*sub; S.x+=S.v*sub; }
    const slipping=Math.abs(S.v)>6;
    const hatch=()=>{ for(let q=0;q<40;q++){ const xx=w*0.04+q*(w*0.92)/40; line(ctx,xx,yb+rowH*0.62,xx-10,yb+rowH*0.62+12,COL.mid,1.4); } line(ctx,w*0.04,yb+rowH*0.62,w*0.96,yb+rowH*0.62,COL.ink,3); };
    hatch();
    // slip plane
    const ySlip=yb-rowH*2.5;
    line(ctx,w*0.04,ySlip,w*0.96,ySlip,COL.yellow,2.4,[8,6]);
    textAt(ctx,'slip plane',w*0.96,ySlip-6,{align:'right',size:11,weight:700,color:COL.yellow});
    const isForeign=s=>{
      if(mode==='pure') return false;
      if(mode==='sub'){ if(separate) return (s.c+s.r*0.35)/(N+2)<x*0.9; return s.u<x; }
      return false;
    };
    const rF=mode==='sub'?ratio:1;
    const drawAtom=(s,xx,yy)=>{ const f=isForeign(s);
      const r0=a*0.46*(f?rF:1);
      circ(ctx,xx,yy,r0,f?COL.red:COL.blue,f?rgba('#d9432b',0.16):rgba('#2f8fe0',0.06),2.2); };
    // bottom block (rows 0..2)
    for(const s of site){ if(s.r>2) continue; drawAtom(s,x0+s.c*a+(s.r%2?a/2:0),yb-s.r*rowH); }
    // interstitial atoms sit in the gaps; the ones at the slip plane ride on the bottom block
    if(mode==='int'){ gaps.forEach(g=>{ if(g.u<x*0.8){ const yy=g.row===2?yb-2.5*rowH:(g.row===1?yb-1.5*rowH:yb-4.5*rowH); const xx=x0+g.c*a+a*0.25+(g.row%2?a/2:0); const top=g.row>=3;
        const sx=top?((xx-x0+S.x)%(N*a)+N*a)%(N*a)+x0:xx; circ(ctx,sx,yy,a*0.17,COL.red,rgba('#d9432b',0.45),2); } }); }
    // top block (rows 3..5) slides by S.x (wrapped)
    const W=N*a;
    for(const s of site){ if(s.r<3) continue; const bx=(s.c*a+(s.r%2?a/2:0)+S.x); const xx=x0+((bx%W)+W)%W; drawAtom(s,xx,yb-s.r*rowH); }
    // force arrow
    const fl=Fv/100*w*0.18;
    if(fl>2){ vec(ctx,x0-a*0.2-fl,yb-4*rowH,x0-a*0.2,yb-4*rowH,COL.yellow,4); textAt(ctx,'F',x0-a*0.2-fl-12,yb-4*rowH+5,{align:'right',size:16,weight:700,color:COL.yellow}); }
    // resisting force indicator
    const fcl=Fc/100*w*0.18;
    textAt(ctx,'Fc = '+Math.round(Fc),w*0.04,h*0.05,{size:13,weight:700,color:COL.blue});
    rect(ctx,w*0.04+70,h*0.05-12,w*0.18,14,COL.mid,'#f6f9fc',1.4); rect(ctx,w*0.04+70,h*0.05-12,Math.min(w*0.18,fcl),14,COL.blue,rgba('#2f8fe0',0.3),2);
    const Fp=Math.min(w*0.18,Fv/100*w*0.18); ctx.save(); ctx.fillStyle=COL.yellow; ctx.fillRect(w*0.04+70,h*0.05+4,Fp,6); ctx.restore();
    textAt(ctx,'blue = resistance of the lattice · yellow = your push',w*0.04+70,h*0.05+32,{size:10.5,color:COL.muted,weight:600});
    textAt(ctx,'F = '+Math.round(Fv),w*0.04,h*0.05+20,{size:13,weight:700,color:COL.yellow});
    if(separate) textAt(ctx,'Radii differ by more than 15 % → atoms cluster, no true alloy',w*0.5,yb+rowH*0.62+34,{align:'center',size:12.5,weight:700,color:COL.red});
    else if(mode==='sub') textAt(ctx,'Mismatched atoms distort the lattice and block slip',w*0.5,yb+rowH*0.62+34,{align:'center',size:12.5,weight:700,color:COL.red});
    else if(mode==='int') textAt(ctx,'Small atoms wedge into the gaps — rows cannot glide',w*0.5,yb+rowH*0.62+34,{align:'center',size:12.5,weight:700,color:COL.red});
    $('#c1').textContent=Math.round(Fc); $('#c2').textContent='× '+hard.toFixed(1);
    const st=Fv<Fc?(Math.abs(S.v)>3?'Settling…':'Locked — only elastic stretch'):'Slipping — layers glide';
    $('#c3').textContent=st; $('#c3').style.color=Fv<Fc?COL.green:COL.red;
    $('#h1').textContent=mode==='pure'?'Pure metal: the layers glide at a low force (soft, malleable).':mode==='sub'?'Brass (Cu–Zn), bronze (Cu–Sn): radii within ~15 % mix freely and harden the metal.':'TiC, Mn₄N, Fe₃H: very hard, high melting, still conduct.';
  });
  return L.wrap;
}

/* =====================================================================
   4.11 LANTHANOID CONTRACTION  (Table 4.9, Fig. 4.6)
   Each step adds +1 nuclear charge and one 4f electron; 4f electrons
   shield one another poorly, so the Ln³⁺ ion shrinks.  Radii: Table 4.9.
   ===================================================================== */
const LN = [['La',106],['Ce',103],['Pr',101],['Nd',99],['Pm',98],['Sm',96],['Eu',95],['Gd',94],['Tb',92],['Dy',91],['Ho',89],['Er',88],['Tm',87],['Yb',86],['Lu',85]];
function buildA11(){
  const L=makeLab(
    uiSlider('Lanthanoid (Z)','z',57,71,1,57)+
    uiButtons([['pl','▶ Play La → Lu','play'],['rs','↺ Back to La','']])+
    uiCards([['c1','Ln³⁺ ion',COL.ink],['c2','4f electrons',COL.green],['c3','Ionic radius',COL.blue],['c4','Shrink since La',COL.red]])+
    uiHint('','Zr (160 pm) and Hf (159 pm) end up the same size because Hf comes after the 4f series — that is why they occur together and are hard to separate.')
  );
  const {$,canvas}=L; let t=0, play=false, pt=0;
  $('#pl').onclick=()=>{ play=!play; if(play&&+$('#z').value>=71) $('#z').value=57; $('#pl').textContent=play?'⏸ Pause':'▶ Play La → Lu'; pt=0; };
  $('#rs').onclick=()=>{ play=false; $('#pl').textContent='▶ Play La → Lu'; $('#z').value=57; };
  const Rr={x:106,v:0}, Zs={x:57,v:0}, Mk={x:57,v:0};
  const el=Array.from({length:14},(_,i)=>({r:{x:2.4,v:0},a:i*0.9}));
  animLoop(dt=>{
    t+=dt;
    if(play){ pt+=dt; if(pt>1.1){ pt=0; const v=+$('#z').value; if(v<71) $('#z').value=v+1; else { play=false; $('#pl').textContent='▶ Play La → Lu'; } } }
    const z=+$('#z').value, i=z-57, ion=LN[i], n=i;
    $('#zV').textContent=ion[0]+' ('+z+')';
    springTo(Rr,ion[1],34,5.5,dt); springTo(Zs,z,40,12,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    /* ion model (left) */
    const cx=w*0.27, cy=h*0.42, ppm=Math.min(w*0.24,h*0.36)/110;
    const R=Rr.x*ppm;
    // boundary of the ion (5s² 5p⁶ shell) — springs to the new radius
    circ(ctx,cx,cy,R,COL.blue,rgba('#2f8fe0',0.07),3.2);
    circ(ctx,cx,cy,R*0.62,'#dbe4f0',null,1.2);
    // 5s/5p electrons on the boundary
    for(let q=0;q<8;q++){ const ang=t*0.5+q*Math.PI/4; circ(ctx,cx+Math.cos(ang)*R,cy+Math.sin(ang)*R,3,COL.ink,'#fff',1.6); }
    // nucleus
    const nr=Math.max(10,ppm*9); circ(ctx,cx,cy,nr,COL.blue,rgba('#2f8fe0',0.2),3); textAt(ctx,'+'+z,cx,cy+4,{align:'center',size:Math.max(10,nr*0.8),weight:700,color:COL.blue});
    // 4f electrons (green) orbit inside; the new one flies in from outside
    el.forEach((e,k)=>{ const inn=k<n; const tg=inn?(R*0.3+ppm*2+ (k%2)*ppm*3):(R+ppm*45); springTo(e.r,tg,inn?24:6,inn?6:3,dt); e.a+=dt*(1.8+ (k%3)*0.2);
      const al=inn?1:clamp(1-(e.r.x-R)/(ppm*40),0,1)*0.0; if(!inn&&al<0.01&&e.r.x>R+ppm*30) return;
      const X=cx+Math.cos(e.a)*e.r.x, Y=cy+Math.sin(e.a)*e.r.x; ctx.save(); ctx.globalAlpha=inn?1:0.5; circ(ctx,X,Y,3.6,COL.green,'#e4f7ec',2); ctx.restore(); });
    // pull arrows: effective nuclear charge grows because 4f shield poorly
    const na=3+Math.round(n*0.6);
    for(let q=0;q<na;q++){ const ang=q*Math.PI*2/na+0.3; const r1=R+ppm*20, r2=R+ppm*3; vec(ctx,cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1,cx+Math.cos(ang)*r2,cy+Math.sin(ang)*r2,COL.red,2.2); }
    textAt(ctx,ion[0]+'³⁺',cx,cy+R+ppm*28+14,{align:'center',size:20,weight:700,color:COL.ink});
    textAt(ctx,'4f'+sup(n)+'  ·  r = '+Math.round(Rr.x)+' pm',cx,cy+R+ppm*28+34,{align:'center',size:12.5,weight:700,color:COL.blue});
    // Zr vs Hf (consequence)
    const zy=h*0.9, zr=ppm*160*0.18;
    circ(ctx,w*0.08,zy-6,zr*0.9,COL.mid,rgba('#8195ab',0.12),2.2); textAt(ctx,'Zr 160 pm',w*0.08,zy+zr*0.9+10,{align:'center',size:11,weight:700,color:COL.muted});
    circ(ctx,w*0.2,zy-6,zr*0.9*159/160,COL.green,rgba('#1f9d55',0.12),2.2); textAt(ctx,'Hf 159 pm',w*0.2,zy+zr*0.9+10,{align:'center',size:11,weight:700,color:COL.green});
    textAt(ctx,'≈ same size',w*0.14,zy-zr*0.9-14,{align:'center',size:11,weight:700,color:COL.red});
    /* radius graph (right) */
    const gx=w*0.6, gw=w*0.34, gy=h*0.14, gh=h*0.56;
    textAt(ctx,'Ln³⁺ radius vs atomic number',gx,gy-10,{size:12,weight:700,color:COL.muted});
    line(ctx,gx,gy+gh,gx+gw,gy+gh,COL.ink,2); line(ctx,gx,gy+gh,gx,gy,COL.ink,2);
    const X=zz=>gx+(zz-57)/14*gw, Y=r=>gy+gh-(r-80)/(110-80)*gh;
    for(const v of [85,90,95,100,105,110]){ line(ctx,gx-4,Y(v),gx,Y(v),COL.ink,1.4); textAt(ctx,v+'',gx-7,Y(v)+4,{align:'right',size:10,color:COL.muted}); }
    [57,60,63,66,69,71].forEach(zz=>textAt(ctx,zz+'',X(zz),gy+gh+14,{align:'center',size:10,color:COL.muted}));
    textAt(ctx,'pm',gx-7,gy-2,{align:'right',size:10,color:COL.mid});
    // perfect shielding reference
    line(ctx,X(57),Y(106),X(71),Y(106),COL.mid,1.6,[5,5]); textAt(ctx,'if shielding were perfect',X(71),Y(106)-6,{align:'right',size:10.5,color:COL.mid,weight:600});
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6; ctx.beginPath(); LN.slice(0,i+1).forEach((p,q)=>{ q?ctx.lineTo(X(57+q),Y(p[1])):ctx.moveTo(X(57+q),Y(p[1])); }); ctx.stroke(); ctx.restore();
    LN.forEach((p,q)=>{ const done=q<=i; circ(ctx,X(57+q),Y(p[1]),done?4:3,done?COL.blue:COL.mid,done?COL.blue:'#fff',1.6); if(q%2===0||q===14) textAt(ctx,p[0],X(57+q),Y(p[1])-9,{align:'center',size:10,color:done?COL.blue:COL.mid,weight:600}); });
    springTo(Mk,z,50,10,dt);
    const mxp=gx+(Mk.x-57)/14*gw, mpm=Rr.x; circ(ctx,mxp,Y(mpm),8,COL.red,rgba('#d9432b',0.25),3);
    line(ctx,mxp,Y(mpm)+9,mxp,gy+gh,COL.red,1.4,[3,3]);
    $('#c1').textContent=ion[0]+'³⁺'; $('#c2').textContent='4f'+sup(n); $('#c3').textContent=ion[1]+' pm'; $('#c4').textContent='−'+(106-ion[1])+' pm';
  });
  return L.wrap;
}

/* =====================================================================
   ROUTER

const activities = [
  { num:'4.1', title:'Filling the d-Orbitals', desc:'Walk Sc → Zn · see Cr and Cu break the rule', fn:'buildA1' },
  { num:'4.2', title:'Melting a Transition Metal', desc:'Heat the block · bond strength decides when it flows', fn:'buildA2' },
  { num:'4.3', title:'Stripping Electrons', desc:'Supply energy · 4s leaves first, then 3d', fn:'buildA3' },
  { num:'4.4', title:'Metals in Acid (E°)', desc:'Which M²⁺/M couples can release H₂?', fn:'buildA4' },
  { num:'4.5', title:'Weighing Magnetism', desc:'Unpaired electrons pull the sample into the field', fn:'buildA5' },
  { num:'4.6', title:'Why Ions Are Coloured', desc:'A d–d jump removes one colour from white light', fn:'buildA6' },
  { num:'4.7', title:'Fe³⁺ the Catalyst', desc:'A lower barrier · more successful collisions', fn:'buildA7' },
  { num:'4.8', title:'Oxidant Titration', desc:'KMnO₄ or K₂Cr₂O₇ into Fe²⁺', fn:'buildA8' },
  { num:'4.9', title:'Chromate ⇌ Dichromate', desc:'Change the pH · watch the ions join and split', fn:'buildA9' },
  { num:'4.10', title:'Alloys & Interstitials', desc:'Push the layers · foreign atoms block the slip', fn:'buildA10' },
  { num:'4.11', title:'Lanthanoid Contraction', desc:'Add 4f electrons · the ion shrinks', fn:'buildA11' },
];
let currentIndex = 0;
function buildNav(){
  const nav = document.getElementById('sideNav'); nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops(); buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody'); body.innerHTML='';
  const f = window[a.fn];
  if(typeof f==='function') body.appendChild(f());
  else body.innerHTML='<p class="hint" style="padding:20px">Coming up…</p>';
}
render();
</script>
<script src="../../nav/back-button.js"></script>
