<style>

  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);

  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }

.topbar{ flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);

.topbar .chip{ display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px; }
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center; flex-wrap:wrap;}

.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}

.rcard .rval.sm{font-size:var(--fs-sm); line-height:1.25;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}

  .lab-side{min-width:0;}

  .topbar .legend{display:none;}

}

<div class="app">

<script>
/* =========================================================================
   GRADE 12 — CHAPTER 8: ELECTROMAGNETIC WAVES
   Every scene runs a continuous loop. Sliders and buttons only set TARGETS;
   parameters ease toward them, springy things settle, waves are drawn from
   the real equations  E = E0 sin(kz − ωt),  B0 = E0/c,  v = 1/√(με).
   Light speed is slowed to a watchable pace; wavelengths, frequencies, field
   amplitudes and currents shown in the cards use the real values.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', navy:'#1a3a5c', muted:'#4c6178', mid:'#8195ab', grid:'#dbe4f0'};
const TAU = Math.PI*2, C0 = 3e8, MU0 = 4e-7*Math.PI, EPS0 = 8.854e-12, HEV = 4.1357e-15;

/* ---------- canvas + drawing helpers ---------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width,head){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,head||8); }
function textAt(ctx,txt,x,y,o){
  o=o||{}; ctx.save(); ctx.font=(o.weight||600)+' '+(o.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=o.color||COL.ink; ctx.textAlign=o.align||'left'; ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!==undefined) ctx.globalAlpha=o.alpha; ctx.fillText(txt,x,y); ctx.restore();
}
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,TAU); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.stroke();} ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function hexRgb(h){ if(h[0]==='r'){ const m=h.match(/[0-9.]+/g); return [+m[0],+m[1],+m[2]]; } const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rgba(hex,a){ const c=hexRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+clamp(a,0,1).toFixed(3)+')'; }
/* engineering-prefix formatter: 1.6e-11,'T' → "16.3 pT" */
function si(x,unit,d){
  if(!isFinite(x)) return '—'; if(x===0) return '0 '+unit; d=d===undefined?2:d;
  const P=[[1e12,'T'],[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p'],[1e-15,'f']], a=Math.abs(x);
  for(const [m,p] of P){ if(a>=m*0.9995) return fmt(x/m,d)+' '+p+unit; }
  return x.toExponential(1)+' '+unit;
}
/* scientific formatter: "1.87 × 10¹⁰ V/s" */
function sci(x,unit,d){
  if(!isFinite(x)||x===0) return '0 '+unit; d=d===undefined?2:d;
  let e=Math.floor(Math.log10(Math.abs(x))), m=x/Math.pow(10,e); if(Math.abs(Number(m.toFixed(d)))>=10){ m/=10; e++; }
  const sup={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  return fmt(m,d)+' × 10'+String(e).split('').map(c=>sup[c]).join('')+' '+unit;
}
/* a short travelling wave-packet drawn along a direction (a photon) */
function wavy(ctx,x,y,ang,len,amp,waves,color,lw,ph){
  const dx=Math.cos(ang), dy=Math.sin(ang); ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lw||2.2; ctx.lineJoin='round'; ctx.beginPath();
  for(let i=0;i<=26;i++){ const u=i/26, s=(u-0.5)*len, off=amp*Math.sin(waves*TAU*u+(ph||0))*Math.sin(Math.PI*u);
    const px=x+dx*s-dy*off, py=y+dy*s+dx*off; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.stroke(); ctx.restore();
}
function lamp(ctx,x,y,r,b){
  if(b>0.03){ const gr=r*(1.6+b*1.8), g=ctx.createRadialGradient(x,y,r*0.2,x,y,gr); g.addColorStop(0,'rgba(255,214,90,'+(0.85*b).toFixed(3)+')'); g.addColorStop(1,'rgba(255,214,90,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,gr,0,TAU); ctx.fill(); }
  circ(ctx,x,y,r,COL.ink,'rgba(255,255,255,0.9)',2.4);
  ctx.save(); ctx.strokeStyle=mixCol('#9aa8b8',COL.red,clamp(b*1.2,0,1)); ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.beginPath();
  ctx.moveTo(x-r*0.45,y+r*0.55); ctx.lineTo(x-r*0.25,y-r*0.1); ctx.lineTo(x,y+r*0.3); ctx.lineTo(x+r*0.25,y-r*0.1); ctx.lineTo(x+r*0.45,y+r*0.55); ctx.stroke(); ctx.restore();
}
/* H2O drawn as a line diagram: red O, blue H, bond lines. ang = direction of the H side. */
function h2o(ctx,x,y,s,ang,lw){
  const a1=ang-0.91, a2=ang+0.91, hx1=x+s*Math.cos(a1), hy1=y+s*Math.sin(a1), hx2=x+s*Math.cos(a2), hy2=y+s*Math.sin(a2);
  line(ctx,x,y,hx1,hy1,COL.ink,lw||1.6); line(ctx,x,y,hx2,hy2,COL.ink,lw||1.6);
  circ(ctx,hx1,hy1,s*0.26,COL.blue,'#fff',lw||1.6); circ(ctx,hx2,hy2,s*0.26,COL.blue,'#fff',lw||1.6); circ(ctx,x,y,s*0.4,COL.red,'#fff',lw||1.6);
}

/* ---------- animation engine ---------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now(), raf;
  function frame(now){ const dt = Math.max(0, Math.min(0.04, (now-last)/1000)); last = now; tick(dt); raf = requestAnimationFrame(frame); }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf); activeStops.push(stop); return stop;
}
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
function springTo(s,target,k,damping,dt){ s.v += ((target-s.x)*k - s.v*damping)*dt; s.x += s.v*dt; return s.x; }
function toggleWire(btns,cb){ btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); if(cb) cb(b); }); }

/* ---------- UI builders ---------- */
const activities = [];
function labShell(){ const wrap=document.createElement('div'); wrap.className='lab-view'; wrap.innerHTML=`<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`; return wrap; }
function sl(id,label,min,max,step,val){ return `<div class="control-group"><label>${label}<span class="val" id="${id}V"></span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`; }
function seg(id,title,opts,sel){ sel=sel||0; return `<div class="control-group"><label>${title}</label><div class="toggle-group" id="${id}">`+opts.map((o,i)=>`<button class="toggle-btn${i===sel?' active':''}" data-v="${o[0]}">${o[1]}</button>`).join('')+`</div></div>`; }
function btns(id,title,opts){ return `<div class="control-group">${title?`<label>${title}</label>`:''}<div class="toggle-group" id="${id}">`+opts.map(o=>`<button class="toggle-btn" data-v="${o[0]}">${o[1]}</button>`).join('')+`</div></div>`; }
function cards(list){ return `<div class="control-group"><div class="result-cards">`+list.map(c=>`<div class="rcard"><div class="rlabel">${c[1]}</div><div class="rval" id="${c[0]}" style="${c[2]?'color:'+c[2]:''}">—</div></div>`).join('')+`</div></div>`; }
function mkUI(wrap){
  const $=s=>wrap.querySelector(s);
  return {$, canvas:$('canvas'), val:id=>parseFloat($('#'+id).value), set:(id,v)=>{$('#'+id).value=v;}, txt:(id,s)=>{ const e=$('#'+id); if(e) e.textContent=s; }};
}
const wireSeg=(wrap,id,cb)=>toggleWire(wrap.querySelectorAll('#'+id+' button'),cb);
const getSeg=(wrap,id)=>wrap.querySelector('#'+id+' .active').dataset.v;
const press=(wrap,id,v)=>wrap.querySelector('#'+id+' button[data-v="'+v+'"]').click();

/* =====================================================================
   8.2  DISPLACEMENT CURRENT — Ampère–Maxwell law
   B(2πr) = μ0 (ic + id),  id = ε0 dΦE/dt.  A loop of radius r around the wire
   can be capped by a flat disc (ic threads it) or a pot / tiffin box that
   bulges between the plates (only id threads it). Ampère alone gives B = 0
   for the pot; adding id gives the same B for every surface.
   Textbook checks: Ex 8.1 (R = 12 cm, d = 5 cm, i = 0.15 A → C = 8.0 pF,
   dV/dt = 1.9×10¹⁰ V/s, id = 0.15 A).  Ex 8.2 (R = 6 cm, i0 = 9.8 µA →
   B at 3 cm in the gap = 16 pT).
   ===================================================================== */
function buildDisp(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    seg('law','Law used to find B',[['amp','Ampère only'],['max','Ampère–Maxwell']],1) +
    seg('surf','Surface on the loop',[['flat','Flat disc'],['pot','Pot'],['box','Tiffin']]) +
    seg('mode','Current',[['dc','Steady charge'],['ac','AC']]) +
    sl('I','Current i',-6,0,0.001,-0.824) + sl('R','Plate radius R',2,15,0.5,12) + sl('P','Probe radius r′ in the gap',10,170,1,100) +
    btns('pre','Textbook',[['1','Ex 8.1'],['2','Ex 8.2']]) +
    cards([['cIc','ic through surface','var(--f-yellow)'],['cId','id through surface','var(--f-green)'],['cB','B on the loop','var(--f-blue)'],['cBg','B in the gap at r′','var(--f-blue)'],['cC','Capacitance C',null],['cDv','dV/dt',null]]) +
    `<p class="hint">Peak values · plate gap 5 cm</p>`;
  const {$,canvas,val,set,txt}=mkUI(wrap);
  ['law','surf','mode'].forEach(id=>wireSeg(wrap,id));
  wrap.querySelectorAll('#pre button').forEach(b=>b.onclick=()=>{
    if(b.dataset.v==='1'){ press(wrap,'mode','dc'); set('I',-0.824); set('R',12); set('P',100); }
    else { press(wrap,'mode','ac'); set('I',-5.011); set('R',6); set('P',50); } });
  let t=0, th=0, iS=0, Qs=0, iD=0, QD=0, drift=0, bOff=0;
  const E={I:val('I'),R:val('R'),P:val('P')};
  animLoop(dt=>{
    t+=dt; E.I=approach(E.I,val('I'),8,dt); E.R=approach(E.R,val('R'),8,dt); E.P=approach(E.P,val('P'),8,dt);
    const mode=getSeg(wrap,'mode'), surf=getSeg(wrap,'surf'), law=getSeg(wrap,'law');
    let iT,QT;
    if(mode==='ac'){ th+=TAU*0.3*dt; iT=Math.cos(th); QT=Math.sin(th); }
    else { const s=t%10, d=s<3?1:(s>=5&&s<8?-1:0); iS=approach(iS,d,7,dt); Qs=clamp(Qs+iS*dt/3,0,1); iT=iS; QT=Qs; }
    iD=approach(iD,iT,14,dt); QD=approach(QD,QT,14,dt);
    const I0=Math.pow(10,E.I), Rm=E.R/100, rl=1.35*Rm, rpb=E.P/100*Rm;
    const contra=(law==='amp'&&surf!=='flat');
    const Bl=contra?0:MU0*I0/(TAU*rl);
    const Bg=law==='amp'?0:(rpb<Rm?MU0*I0*rpb/(TAU*Rm*Rm):MU0*I0/(TAU*rpb));
    const Cap=EPS0*Math.PI*Rm*Rm/0.05;
    txt('IV',si(Math.pow(10,val('I')),'A')); txt('RV',fmt(val('R'),1)+' cm'); txt('PV',fmt(val('P')*val('R')/100/100*100,1)+' cm');
    txt('cIc',surf==='flat'?si(I0,'A'):'0'); txt('cId',surf==='flat'?'0':(law==='max'?si(I0,'A'):'ignored'));

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cy=h*0.5, svW=w*0.6, cx=svW*0.64, gap=36, Rpx=lerp(h*0.1,h*0.26,(E.R-2)/13), rpx=Rpx*1.35;

    // surface capping the loop

    else { const rad=surf==='pot'?rpx*0.7:3, top=cy-rpx, bot=cy+rpx;
      ctx.beginPath(); ctx.moveTo(xP,top); ctx.lineTo(cx-rad,top); ctx.arcTo(cx,top,cx,top+rad,rad); ctx.lineTo(cx,bot-rad); ctx.arcTo(cx,bot,cx-rad,bot,rad); ctx.lineTo(xP,bot);
      ctx.fillStyle='rgba(31,157,85,0.11)'; ctx.fill(); ctx.strokeStyle=COL.green; ctx.lineWidth=2; ctx.setLineDash([7,5]); ctx.stroke(); }
    ctx.restore();
    // E field between the plates
    const sQ=Math.sign(QD)||1, mQ=Math.abs(QD);
    if(mQ>0.04) for(let k=-3;k<=3;k++){ const y=cy+k/3*Rpx*0.88; ctx.save(); ctx.globalAlpha=0.25+0.75*mQ; vec(ctx,sQ>0?xl+4:xr-4,y,sQ>0?xr-4:xl+4,y,COL.red,1+3*mQ,5+4*mQ); ctx.restore(); }
    // plates + charge signs
    line(ctx,xl,cy-Rpx,xl,cy+Rpx,COL.ink,6); line(ctx,xr,cy-Rpx,xr,cy+Rpx,COL.ink,6);
    if(mQ>0.04) for(let k=-3;k<=3;k++){ const y=cy+k/3*Rpx*0.88+5; textAt(ctx,sQ>0?'+':'−',xl-12,y,{align:'center',size:15,color:COL.yellow,alpha:Math.min(1,mQ*1.6)}); textAt(ctx,sQ>0?'−':'+',xr+12,y,{align:'center',size:15,color:COL.yellow,alpha:Math.min(1,mQ*1.6)}); }
    // wires + conduction dots (yellow)
    line(ctx,x0,cy,xl-3,cy,COL.ink,2.6); line(ctx,xr+3,cy,x1,cy,COL.ink,2.6);
    const dotsOn=(a,b)=>{ const len=b-a, sp=22, n=Math.floor(len/sp)+1; for(let j=0;j<n;j++){ const x=a+(((j*sp+drift)%len)+len)%len; circ(ctx,x,cy,4.2,'#fff',COL.yellow,1.2); } };
    dotsOn(x0+4,xl-6); dotsOn(xr+6,x1-4);
    // displacement current in the gap (green dashes continue the flow)
    if(aI>0.04) for(let k=-2;k<=2;k++){ const y=cy+k*Rpx*0.42; ctx.save(); ctx.globalAlpha=Math.min(1,aI*1.2); ctx.strokeStyle=COL.green; ctx.lineWidth=2.8; ctx.setLineDash([7,6]); ctx.lineDashOffset=-drift;
      ctx.beginPath(); ctx.moveTo(xl+3,y); ctx.lineTo(xr-3,y); ctx.stroke(); ctx.restore(); arrowHead(ctx,sI>0?xr-3:xl+3,y,sI>0?0:Math.PI,rgba(COL.green,Math.min(1,aI*1.2)),7); }
    textAt(ctx,'ic',x0+(xl-x0)*0.5,cy+22,{align:'center',size:13,color:COL.yellow}); textAt(ctx,'id',cx,cy+Rpx+24,{align:'center',size:13,color:COL.green});
    // the Ampère loop (blue) with B arrows
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6+2*(contra?0:aI); ctx.globalAlpha=contra?0.35:1; ctx.beginPath(); ctx.ellipse(xP,cy,9,rpx,0,0,TAU); ctx.stroke(); ctx.restore();
    if(!contra && aI>0.05){ ctx.save(); ctx.globalAlpha=Math.min(1,aI*1.3); for(const [al,dir] of [[-Math.PI/2,1],[Math.PI/2,-1]]){ const px=xP+9*Math.cos(al), py=cy+rpx*Math.sin(al); arrowHead(ctx,px,py,(dir>0?0:Math.PI)*(sI>0?1:1)+(sI>0?0:Math.PI),COL.blue,8+7*aI); } ctx.restore(); }
    textAt(ctx,'B',xP-20,cy-rpx-4,{size:14,color:COL.blue,align:'center'});
    textAt(ctx,contra?'✗  B = 0':'✓  same B',xP,cy+rpx+24,{align:'center',size:13,color:contra?COL.red:COL.green});
    textAt(ctx,'side view',svW/2,h-10,{align:'center',size:11,color:COL.mid,weight:500});
    // cross-section: view along the axis

      ctx.save(); ctx.globalAlpha=0.3+0.7*mQ; ctx.strokeStyle=COL.red; ctx.lineWidth=1.8;
      if(sQ>0){ ctx.beginPath(); ctx.moveTo(px-s,py-s); ctx.lineTo(px+s,py+s); ctx.moveTo(px+s,py-s); ctx.lineTo(px-s,py+s); ctx.stroke(); } else { ctx.beginPath(); ctx.arc(px,py,s,0,TAU); ctx.stroke(); ctx.fillStyle=COL.red; ctx.beginPath(); ctx.arc(px,py,1.6,0,TAU); ctx.fill(); }
      ctx.restore(); }
    const rr=Rc*E.P/100, cv=u=>u<1?u:1/u, bn=law==='amp'?0:cv(E.P/100);
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.globalAlpha=0.25+0.75*Math.min(1,bn*aI*1.2); ctx.lineWidth=1.6+2.4*bn*aI; ctx.setLineDash([9,7]); ctx.lineDashOffset=-bOff*0.6; ctx.beginPath(); ctx.arc(icx,icy,rr,0,TAU); ctx.stroke(); ctx.restore();
    if(bn*aI>0.04) for(let k=0;k<6;k++){ const an=k*TAU/6; arrowHead(ctx,icx+rr*Math.cos(an),icy+rr*Math.sin(an),an+Math.PI/2+(iD<0?Math.PI:0),rgba(COL.blue,Math.min(1,bn*aI*1.5)),6+8*bn*aI); }
    textAt(ctx,'E',icx,icy-Rc-8,{align:'center',size:13,color:COL.red}); textAt(ctx,'B',icx+rr*0.72+8,icy-rr*0.72,{size:13,color:COL.blue});
    textAt(ctx,'view along the axis',icx,icy+Rc*1.7+16,{align:'center',size:11,color:COL.mid,weight:500});
    // B(r) profile — rises inside the plates, falls as 1/r outside
    const PX0=svW+22, PX1=w-20, PY0=h*0.7, PY1=h*0.93, UX=u=>PX0+(u/3)*(PX1-PX0), UY=u=>PY1-cv(u)*(PY1-PY0-8);
    line(ctx,PX0,PY1,PX1,PY1,COL.ink,1.4); line(ctx,PX0,PY1,PX0,PY0-4,COL.ink,1.4);
    ctx.save(); ctx.beginPath(); for(let i=0;i<=120;i++){ const u=3*i/120; i?ctx.lineTo(UX(u),UY(u)):ctx.moveTo(UX(u),UY(u)); } ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
    line(ctx,UX(1),PY1,UX(1),UY(1),COL.mid,1,[3,4]); textAt(ctx,'R',UX(1),PY1+14,{align:'center',size:11,color:COL.mid}); textAt(ctx,'B',PX0-6,PY0,{align:'right',size:12,color:COL.blue}); textAt(ctx,'r',PX1,PY1+14,{align:'right',size:11,color:COL.mid});
    const mk=bn*aI; circ(ctx,UX(E.P/100),PY1-mk*(PY1-PY0-8),6,COL.yellow,'#fff',3);
  });
  return wrap;
}

/* =====================================================================
   8.3.1  SOURCES — only an accelerating charge radiates
   A charge at rest gives a static field; one moving steadily gives a steady
   field that just slides along; one that oscillates (accelerates) sheds
   expanding wavefronts, strongest sideways (∝ sin θ) and zero along its axis.
   The wave leaves at speed c, so a second antenna starts to oscillate only
   after the delay d/c — and keeps going for that long after the source stops.
   Frequency of the wave = frequency of the charge.  λ = c/f.
   ===================================================================== */
function buildRadiate(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    seg('mode','Charge motion',[['still','At rest'],['drift','Steady'],['osc','Oscillating']],2) +
    sl('f','Frequency f',10,100,1,50) + sl('A','Swing of the charge',10,100,1,70) +
    cards([['cF','Wave frequency','var(--f-yellow)'],['cL','Wavelength λ = c/f','var(--f-green)'],['cP','Radiated power','var(--f-red)'],['cR','Receiver signal','var(--f-blue)']]) +
    `<p class="hint">Wave speed slowed for viewing · f and λ are real</p>`;
  const {$,canvas,val,txt}=mkUI(wrap);
  wireSeg(wrap,'mode');
  const VPX=125; let t=0, th=0, lastN=0, yd=0, amp=0, rp=0; const E={f:val('f'),A:val('A')}; const rings=[], hist=[];
  animLoop(dt=>{
    t+=dt; E.f=approach(E.f,val('f'),7,dt); E.A=approach(E.A,val('A'),7,dt);
    const mode=getSeg(wrap,'mode'), osc=mode==='osc';
    const lam=4000/E.f, fv=VPX/lam, Apx=6+0.34*E.A, S=(E.A/100)*Math.pow(E.f/100,2), root=Math.sqrt(S);
    amp=approach(amp,osc?1:0,6,dt); if(osc) th+=TAU*fv*dt;
    const nHalf=Math.floor(th/Math.PI); if(osc && nHalf>lastN){ rings.push({t0:t,a:0.18+0.82*root,s:nHalf%2?-1:1}); lastN=nHalf; } if(!osc) lastN=Math.floor(th/Math.PI);
    hist.push([t,Math.sin(th)*Math.min(1,root*1.3)*amp]); while(hist.length>2 && t-hist[0][0]>8) hist.shift();
    txt('fV',fmt(val('f'),0)+' MHz'); txt('AV',fmt(val('A'),0)+' %');
    txt('cF',fmt(E.f,0)+' MHz'); txt('cL',fmt(300/E.f,1)+' m'); txt('cP',fmt(Math.pow(E.A/100,2)*Math.pow(E.f/100,4)*100*(osc?1:0),1)+' %');
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const sx=w*0.2, sy=h*0.5, rx=w*0.8, D=rx-sx;
    // expanding wavefronts: strongest sideways, none along the axis
    for(let i=rings.length-1;i>=0;i--){ const g=rings[i], r=VPX*(t-g.t0); if(r>w*1.1){ rings.splice(i,1); continue; } if(r<8) continue;
      const decay=clamp(110/(r+60),0.15,1), N=72; ctx.save(); ctx.lineWidth=2.6; ctx.setLineDash(g.s>0?[]:[7,6]);
      for(let k=0;k<N;k++){ const a1=k*TAU/N, a2=(k+1.15)*TAU/N, am=(a1+a2)/2, inten=Math.pow(Math.abs(Math.cos(am)),1.1), al=g.a*decay*inten*(g.s>0?1:0.7); if(al<0.03) continue;
        ctx.strokeStyle='rgba(217,67,43,'+al.toFixed(3)+')'; ctx.beginPath(); ctx.arc(sx,sy,r,a1,a2); ctx.stroke(); }
      ctx.restore(); }
    // source antenna + charge
    line(ctx,sx,sy-78,sx,sy+78,COL.ink,3.4);
    let cyc=sy, ca=0;
    if(mode==='osc'){ cyc=sy-Apx*Math.sin(th)*amp; ca=Math.sin(th)*amp; }
    else if(mode==='drift'){ yd=(yd+52*dt)%170; cyc=sy+85-yd; }
    if(mode!=='osc') for(let k=0;k<12;k++){ const an=k*TAU/12; vec(ctx,sx+16*Math.cos(an),cyc+16*Math.sin(an),sx+66*Math.cos(an),cyc+66*Math.sin(an),'rgba(217,67,43,0.65)',1.6,6); }
    circ(ctx,sx,cyc,10,COL.ink,COL.yellow,2.6); textAt(ctx,'+',sx,cyc+5,{align:'center',size:15,color:COL.ink,weight:700});
    if(mode==='drift') vec(ctx,sx+22,cyc,sx+22,cyc-44,COL.blue,2.8,8);
    if(mode==='osc' && Math.abs(ca)>0.05){ const L=-ca*Math.min(70,18+60*root*1.2)*0; vec(ctx,sx+24,cyc,sx+24,cyc+ca*(26+30*E.A/100),COL.green,3,9); }
    textAt(ctx,mode==='osc'?'a':(mode==='drift'?'v':''),sx+34,cyc+4,{size:13,color:mode==='osc'?COL.green:COL.blue});
    textAt(ctx,mode==='osc'?'accelerating  →  radiates':'no acceleration  →  no wave',sx,sy+112,{align:'center',size:12,color:mode==='osc'?COL.red:COL.mid});
    // receiving antenna (Hertz) — responds only after the delay D / c
    let ts=t-D/VPX, sig=0; for(let i=hist.length-1;i>=0;i--){ if(hist[i][0]<=ts){ sig=hist[i][1]; break; } }
    rp=approach(rp,sig*sig,5,dt);
    line(ctx,rx,sy-60,rx,sy+60,COL.ink,3.4);
    for(let k=-1;k<=1;k++) circ(ctx,rx,sy+k*20+sig*34,6,COL.ink,COL.yellow,2);
    line(ctx,rx+2,sy,rx+36,sy,COL.ink,2.6); lamp(ctx,rx+52,sy,15,clamp(rp*3.2,0,1));
    txt('cR',fmt(clamp(Math.sqrt(rp)/0.8,0,1.5)*100*0.8,0)+' %');
    // distance and delay
    line(ctx,sx,h-34,rx,h-34,COL.green,2,[6,5]); arrowHead(ctx,rx,h-34,0,COL.green,8); textAt(ctx,'wave travels at c  →  receiver answers after d/c',(sx+rx)/2,h-42,{align:'center',size:12,color:COL.green});
  });
  return wrap;
}

/* =====================================================================
   shared 3-D wave drawing (oblique projection):  z → right (propagation),
   x ↑ (E, red),  y ↙ (B, blue).  E and B are in phase, ⟂ to each other and to z.
   ===================================================================== */
function wave3D(ctx,O,L,o){
  const N=o.N||72, P=(z,x,y)=>[O.x+z-0.5*y, O.y-x+0.4*y], pts=[];
  for(let i=0;i<=N;i++){ const z=L*i/N; pts.push({z,s:Math.sin(o.phase(z)),Ea:o.Ea(z),Ba:o.Ba(z)}); }
  const hairs=(key,amp,color)=>{ pts.forEach((p,i)=>{ const a=P(p.z,0,0), b=key==='E'?P(p.z,p.s*p.Ea,0):P(p.z,0,p.s*p.Ba); const len=Math.hypot(b[0]-a[0],b[1]-a[1]); line(ctx,a[0],a[1],b[0],b[1],rgba(color,0.5),1.4); if(len>10&&i%2===0) arrowHead(ctx,b[0],b[1],Math.atan2(b[1]-a[1],b[0]-a[0]),rgba(color,0.8),6); }); };
  const curve=(key,color)=>{ ctx.save(); ctx.beginPath(); pts.forEach((p,i)=>{ const q=key==='E'?P(p.z,p.s*p.Ea,0):P(p.z,0,p.s*p.Ba); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }); ctx.strokeStyle=color; ctx.lineWidth=3.2; ctx.lineJoin='round'; ctx.stroke(); ctx.restore(); };
  if(o.showB!==false){ hairs('B',0,COL.blue); curve('B',COL.blue); }
  const a0=P(0,0,0), a1=P(L,0,0); vec(ctx,a0[0],a0[1],a1[0],a1[1],COL.green,2.6,10);
  if(o.showE!==false){ hairs('E',0,COL.red); curve('E',COL.red); }
  return {P,pts};
}
function axesKey(ctx,x,y){
  vec(ctx,x,y,x+38,y,COL.green,2.2,7); textAt(ctx,'z',x+46,y+4,{size:12,color:COL.green});
  vec(ctx,x,y,x,y-36,COL.red,2.2,7); textAt(ctx,'x  (E)',x+4,y-42,{size:12,color:COL.red});
  vec(ctx,x,y,x-22,y+18,COL.blue,2.2,7); textAt(ctx,'y  (B)',x-26,y+34,{size:12,color:COL.blue,align:'right'});
}

/* =====================================================================
   8.3.2  NATURE OF EM WAVES —  Ex = E0 sin(kz − ωt),  By = B0 sin(kz − ωt)
   B0 = E0/c,  ω = ck,  λ = c/f.   Textbook checks:
   Ex 8.1: 25 MHz, E = 6.3 V/m → B = 2.1×10⁻⁸ T, λ = 12 m.
   Ex 8.9: E0 = 120 N/C, 50 MHz → B0 = 4×10⁻⁷ T, ω = 3.14×10⁸ rad/s, k = 1.05 rad/m, λ = 6 m.
   ===================================================================== */
function buildWave(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    sl('f','Frequency f',6.7,8.7,0.001,7.398) + sl('E','Electric amplitude E₀',1,150,0.1,60) +
    btns('pre','Textbook',[['1','Ex 8.1'],['2','Ex 8.9'],['p','⏯ Pause']]) +
    cards([['cL','Wavelength λ','var(--f-green)'],['cB','B₀ = E₀/c','var(--f-blue)'],['cW','ω = 2πf',null],['cK','k = 2π/λ',null]]) +
    `<p class="hint">E ⟂ B ⟂ direction · in phase · speed slowed</p>`;
  const {$,canvas,val,set,txt}=mkUI(wrap);
  let paused=false, t=0; const E={f:val('f'),E:val('E')};
  const pb=wrap.querySelector('#pre button[data-v="p"]');
  wrap.querySelector('#pre button[data-v="1"]').onclick=()=>{ set('f',Math.log10(25e6)); set('E',6.3); };
  wrap.querySelector('#pre button[data-v="2"]').onclick=()=>{ set('f',Math.log10(50e6)); set('E',120); };
  pb.onclick=()=>{ paused=!paused; pb.classList.toggle('act',paused); };
  animLoop(dt=>{
    if(!paused) t+=dt; E.f=approach(E.f,val('f'),7,dt); E.E=approach(E.E,val('E'),7,dt);
    const f=Math.pow(10,val('f')), lam=C0/f, B0=val('E')/C0;
    txt('fV',si(f,'Hz')); txt('EV',fmt(val('E'),1)+' V/m');
    txt('cL',si(lam,'m')); txt('cB',sci(B0,'T')); txt('cW',sci(TAU*f,'rad/s')); txt('cK',fmt(TAU/lam,3)+' rad/m');
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const L=w*0.8, O={x:w*0.1,y:h*0.52}, nW=1.5+4.5*(E.f-6.7)/2, lamPx=L/nW, k=TAU/lamPx, om=k*105, sc=clamp(h/460,0.8,1.5), Ea=(18+72*Math.sqrt(E.E/150))*sc, Ba=Ea*1.05;
    const ph=z=>k*z-om*t;
    // wave-front plane at the probe (E and B lie in it)
    const zp=L*0.5, Pj=(z,x,y)=>[O.x+z-0.5*y, O.y-x+0.4*y], hx=Ea+22, hy=Ba+22;
    ctx.save(); ctx.beginPath(); [[-hx,-hy],[hx,-hy],[hx,hy],[-hx,hy]].forEach((c,i)=>{ const q=Pj(zp,c[0],c[1]); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }); ctx.closePath(); ctx.fillStyle='rgba(19,42,68,0.04)'; ctx.fill(); ctx.strokeStyle=COL.grid; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
    wave3D(ctx,O,L,{phase:ph,Ea:()=>Ea,Ba:()=>Ba});
    // probe: E and B at one point rise and fall together
    const s=Math.sin(ph(zp)), p0=Pj(zp,0,0), pe=Pj(zp,s*Ea,0), pb2=Pj(zp,0,s*Ba);
    if(Math.abs(s)>0.05){ vec(ctx,p0[0],p0[1],pe[0],pe[1],COL.red,4.2,11); vec(ctx,p0[0],p0[1],pb2[0],pb2[1],COL.blue,4.2,11); }
    circ(ctx,p0[0],p0[1],6.5,COL.ink,COL.yellow,2.6);
    textAt(ctx,'E',pe[0]+12,pe[1]+(s>0?-4:14),{size:14,color:COL.red}); textAt(ctx,'B',pb2[0]-12,pb2[1]+(s>0?16:-4),{size:14,color:COL.blue,align:'right'});
    const e1=Pj(L,0,0); textAt(ctx,'c',e1[0]-6,e1[1]-14,{size:15,color:COL.green,align:'center'});
    // one wavelength bracket
    const bx=O.x+L*0.06, by=O.y+Ea+Ba*0.4+34; line(ctx,bx,by,bx+lamPx,by,COL.green,2); line(ctx,bx,by-5,bx,by+5,COL.green,2); line(ctx,bx+lamPx,by-5,bx+lamPx,by+5,COL.green,2); textAt(ctx,'λ',bx+lamPx/2,by+18,{align:'center',size:14,color:COL.green});
    axesKey(ctx,w*0.11,h*0.17);
  });
  return wrap;
}

/* =====================================================================
   8.3.2b  WAVE IN A MEDIUM —  v = 1/√(με)  = c/√(εr μr)
   Frequency is set by the source and never changes; the speed drops, so the
   wavelength shrinks by the same factor.  B0 = E0/v, so B grows relative to E.
   ===================================================================== */
function buildMedium(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    sl('er','Permittivity ε/ε₀',1,6,0.01,2.25) + sl('mr','Permeability μ/μ₀',1,2,0.01,1) +
    btns('pre','Medium',[['1,1','Vacuum'],['1.77,1','Water'],['2.25,1','Glass'],['5.86,1','Diamond']]) +
    cards([['cV','Speed v','var(--f-green)'],['cN','Index n = c/v',null],['cL','Wavelength λ′','var(--f-green)'],['cBr','B₀ / E₀ vs vacuum','var(--f-blue)']]) +
    `<p class="hint">Source frequency 5 × 10¹⁴ Hz never changes</p>`;
  const {$,canvas,val,set,txt}=mkUI(wrap);

  {n:'Visible',    a:14.632, b:14.875, col:'#d9a017', make:'Electrons drop an energy level',    det:'Eye · photocells'},
  {n:'Ultraviolet',a:14.875, b:17.477, col:'#7a4fd1', make:'Atomic electrons · hot bodies',     det:'Photocells · film'},
  {n:'X-ray',      a:17.477, b:20.477, col:'#1a3a5c', make:'X-ray tube · inner-shell electrons',det:'Film · Geiger tube'},

/* =====================================================================
   8.4.3  INFRARED & THE GREENHOUSE EFFECT
   Visible sunlight passes through the air and warms the ground; the ground
   re-radiates longer-wavelength infrared, which greenhouse molecules absorb
   and re-emit in all directions, so part of it returns.
   One absorbing layer, fraction pa:   top flux = Eg (1 − pa/2) = S
   → T = 255 K · (S/S0)^¼ · (1 − pa/2)^(−¼)   (pa ≈ 0.8 gives ≈ 288 K, today's Earth).
   ===================================================================== */
function buildGreenhouse(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    sl('g','Greenhouse gases (CO₂ …)',0,150,1,40) + sl('S','Sunlight',80,120,1,100) +
    btns('pre','',[['0','No gas'],['40','Today'],['120','Heavy']]) +
    cards([['cT','Ground temperature','var(--f-red)'],['cD','Warming from gas','var(--f-red)'],['cA','IR absorbed in the air','var(--f-green)'],['cE','IR escaping to space','var(--f-yellow)']]) +
    `<p class="hint">Yellow: visible in · Red: infrared out</p>`;
  const {$,canvas,val,set,txt}=mkUI(wrap);
  wrap.querySelectorAll('#pre button').forEach(b=>b.onclick=()=>set('g',b.dataset.v));
  const model=(g,S)=>{ const pa=1-Math.exp(-g/25); return {pa,T:255*Math.pow(S/100,0.25)*Math.pow(1/(1-pa/2),0.25)}; };
  const M0=model(val('g'),val('S')); let T=M0.T, t=0, sunAcc=0, irAcc=0, glow=0; const ph=[], E={g:val('g')};
  const mol=[]; for(let i=0;i<120;i++) mol.push({u:(i*0.754877666)%1,v:(i*0.569840291)%1,ap:0,exc:0,em:-1,rot:i*1.3});
  animLoop(dt=>{
    t+=dt; const gT=val('g'), ST=val('S'); E.g=approach(E.g,gT,6,dt);
    const M=model(gT,ST), M00=model(0,ST), nMol=Math.round(E.g*0.8);
    T=approach(T,M.T,0.35,dt); glow=approach(glow,0,2.2,dt);
    txt('gV',fmt(gT,0)+' %'); txt('SV',fmt(ST,0)+' %'); txt('cT',fmt(T-273.15,0)+' °C'); txt('cD','+ '+fmt(M.T-M00.T,0)+' °C'); txt('cA',fmt(M.pa*100,0)+' %'); txt('cE',fmt(100-M.pa*50,0)+' % of ground IR');
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const gy=h*0.84, bt=h*0.36, bb=h*0.62, sx=w*0.1, sy=h*0.13, sr=Math.min(h*0.07,34);
    // air layer
    ctx.fillStyle='rgba(47,143,224,0.07)'; ctx.fillRect(0,bt,w,bb-bt); line(ctx,0,bt,w,bt,rgba(COL.blue,0.4),1.4,[8,6]); line(ctx,0,bb,w,bb,rgba(COL.blue,0.4),1.4,[8,6]); textAt(ctx,'air',w-14,bt+16,{align:'right',size:11,color:COL.mid,weight:500});
    // sun
    circ(ctx,sx,sy,sr,COL.yellow,'#fff6d8',3.4); for(let k=0;k<12;k++){ const a=k*TAU/12+t*0.3; line(ctx,sx+Math.cos(a)*sr*1.25,sy+Math.sin(a)*sr*1.25,sx+Math.cos(a)*sr*1.7,sy+Math.sin(a)*sr*1.7,COL.yellow,2.6); }
    // ground
    const gc=mixCol('#8195ab',COL.red,clamp((T-250)/70,0,1)); ctx.fillStyle=rgba(COL.ink,0.05); ctx.fillRect(0,gy,w,h-gy); line(ctx,0,gy,w,gy,gc,5+4*glow);
    for(let x=10;x<w;x+=22) line(ctx,x,gy+6,x-9,gy+17,rgba(COL.mid,0.5),1.2);
    // molecules
    mol.forEach((m,i)=>{ m.ap=approach(m.ap,i<nMol?1:0,6,dt); if(m.exc>0){ m.exc-=dt; if(m.em>=0){ m.em-=dt; if(m.em<0){ const an=Math.random()*TAU; ph.push({x:m.u*w,y:bt+8+m.v*(bb-bt-16),vx:Math.cos(an)*110,vy:Math.sin(an)*110,ty:'ir',age:0,src:i}); } } } });
    mol.forEach((m,i)=>{ if(m.ap<0.05) return; const mx=m.u*w+Math.sin(t*0.8+m.rot)*4, my=bt+8+m.v*(bb-bt-16)+Math.cos(t*0.7+m.rot)*3, wob=m.exc>0?Math.sin(t*40)*2.2:0, ex=m.exc>0?clamp(m.exc/0.6,0,1):0;
      ctx.save(); ctx.globalAlpha=m.ap; if(ex>0){ const g=ctx.createRadialGradient(mx,my,2,mx,my,24); g.addColorStop(0,'rgba(217,67,43,'+(0.45*ex).toFixed(2)+')'); g.addColorStop(1,'rgba(217,67,43,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(mx,my,24,0,TAU); ctx.fill(); }
      const ca=Math.cos(m.rot*0.3+t*0.2), sa=Math.sin(m.rot*0.3+t*0.2); line(ctx,mx-9*ca+wob,my-9*sa,mx+9*ca-wob,my+9*sa,COL.ink,1.6);
      circ(ctx,mx-9*ca+wob,my-9*sa,4.2,COL.red,'#fff',1.8); circ(ctx,mx+9*ca-wob,my+9*sa,4.2,COL.red,'#fff',1.8); circ(ctx,mx,my,3.2,COL.ink,COL.ink,1); ctx.restore(); });
    // photons
    sunAcc+=2.0*ST/100*dt; irAcc+=2.8*Math.pow(T/286,4)*dt;
    while(sunAcc>=1){ sunAcc-=1; const tx=w*(0.2+Math.random()*0.7), dx=tx-sx, dy=gy-sy, d=Math.hypot(dx,dy); ph.push({x:sx+dx/d*sr*1.6,y:sy+dy/d*sr*1.6,vx:dx/d*175,vy:dy/d*175,ty:'vis',age:0}); }
    while(irAcc>=1){ irAcc-=1; const an=-Math.PI/2+(Math.random()-0.5)*0.9; ph.push({x:w*(0.08+Math.random()*0.84),y:gy-2,vx:Math.cos(an)*110,vy:Math.sin(an)*110,ty:'ir',age:0,src:-1}); }
    for(let i=ph.length-1;i>=0;i--){ const p=ph[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.age+=dt;
      if(p.ty==='vis'){ if(p.y>=gy){ glow=Math.min(1,glow+0.22); ph.splice(i,1); continue; } }
      else { if(p.y<-30||p.x<-40||p.x>w+40){ ph.splice(i,1); continue; } if(p.y>=gy){ glow=Math.min(1,glow+0.12); ph.splice(i,1); continue; }
        if(p.y>bt&&p.y<bb){ let hit=false; for(let j=0;j<mol.length;j++){ const m=mol[j]; if(m.ap<0.6||m.exc>0) continue; if(p.src===j&&p.age<0.5) continue; const mx=m.u*w, my=bt+8+m.v*(bb-bt-16); if((p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my)<324){ m.exc=0.6; m.em=0.38; hit=true; break; } } if(hit){ ph.splice(i,1); continue; } } } }
    ph.forEach(p=>{ const an=Math.atan2(p.vy,p.vx); if(p.ty==='vis') wavy(ctx,p.x,p.y,an,30,4.6,4,COL.yellow,2.4,t*10); else wavy(ctx,p.x,p.y,an,52,6.5,2,COL.red,2.6,t*6); });
    // thermometer
    const tx=w*0.94, ty0=h*0.2, ty1=h*0.74, lv=clamp((T-230)/100,0,1); rrect(ctx,tx-7,ty0,14,ty1-ty0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
    ctx.save(); rrect(ctx,tx-7,ty0,14,ty1-ty0,7); ctx.clip(); ctx.fillStyle=COL.red; ctx.fillRect(tx-7,ty1-(ty1-ty0)*lv,14,(ty1-ty0)*lv); ctx.restore(); circ(ctx,tx,ty1+10,12,COL.ink,COL.red,2.2);
    textAt(ctx,fmt(T-273.15,0)+' °C',tx,ty0-10,{align:'center',size:13,color:COL.red});
  });
  return wrap;
}

/* =====================================================================
   8.4.5  ULTRAVIOLET, OZONE & GLASS
   The ozone layer absorbs most solar UV (fraction 1 − e^(−d/22)); ordinary glass
   absorbs the rest, so there is no tanning behind a window. Visible light is
   untouched by either. Skin tans with UV dose and burns when it is intense.
   ===================================================================== */
function buildUV(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    sl('d','Ozone layer',0,100,1,100) + seg('gl','Glass pane overhead',[['0','Removed'],['1','In place']]) +
    btns('pre','',[['100','Healthy ozone'],['12','Ozone hole']]) +
    cards([['cA','UV absorbed by ozone','var(--f-blue)'],['cU','UV reaching skin','var(--f-blue)'],['cV','Visible reaching skin','var(--f-yellow)'],['cK','Skin tan',null]]) +
    `<p class="hint">Blue: ultraviolet · Yellow: visible light</p>`;
  const {$,canvas,val,set,txt}=mkUI(wrap);
  wireSeg(wrap,'gl'); wrap.querySelectorAll('#pre button').forEach(b=>b.onclick=()=>set('d',b.dataset.v));
  let t=0, uvAcc=0, vAcc=0, uvRate=0, tan=0, burn=0, dose=0; const ph=[], E={d:val('d')};
  const mol=[]; for(let i=0;i<40;i++) mol.push({u:(i*0.754877666)%1,v:(i*0.569840291)%1,ap:0,exc:0,rot:i*1.7});
  animLoop(dt=>{
    t+=dt; E.d=approach(E.d,val('d'),5,dt); const dT=val('d'), glass=getSeg(wrap,'gl')==='1', pO=1-Math.exp(-dT/22);
    uvRate=approach(uvRate,0,0.4,dt); tan=clamp(tan+(0.1*uvRate*(1-tan)-0.004*tan)*dt,0,1); burn=approach(burn,clamp((uvRate-1.1)/1.4,0,1),1.5,dt);
    txt('dV',fmt(dT,0)+' %'); txt('cA',fmt(pO*100,0)+' %'); txt('cU',fmt((glass?0:1-pO)*100,0)+' %'); txt('cV','100 %'); txt('cK',fmt(tan*100,0)+' %');
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const gy=h*0.9, bt=h*0.2, bb=h*0.38, sx=w*0.1, sy=h*0.08, sr=Math.min(h*0.06,30), px=w*0.68, pyFeet=gy, ph0=h*0.2, headY=pyFeet-ph0*1.95;
    const tgt=()=>({x:px+(Math.random()-0.5)*16,y:headY+Math.random()*ph0*1.7});
    const pathX=(y,tx,ty)=>sx+(tx-sx)*(y-sy)/(ty-sy), paneY=h*0.62;
    // ozone layer
    const nM=Math.round(E.d*0.38); ctx.fillStyle='rgba(31,157,85,'+(0.04+0.09*E.d/100).toFixed(3)+')'; ctx.fillRect(0,bt,w,bb-bt); line(ctx,0,bt,w,bt,rgba(COL.green,0.45),1.4,[8,6]); line(ctx,0,bb,w,bb,rgba(COL.green,0.45),1.4,[8,6]); textAt(ctx,'ozone layer',w-14,bt+16,{align:'right',size:11,color:COL.green,weight:500});
    mol.forEach((m,i)=>{ m.ap=approach(m.ap,i<nM?1:0,6,dt); if(m.exc>0) m.exc-=dt; if(m.ap<0.05) return; const mx=m.u*w, my=bt+8+m.v*(bb-bt-16)+Math.sin(t+m.rot)*2, ex=m.exc>0?clamp(m.exc/0.5,0,1):0, sp=ex*10;
      ctx.save(); ctx.globalAlpha=m.ap; if(ex>0){ const g=ctx.createRadialGradient(mx,my,2,mx,my,22); g.addColorStop(0,'rgba(47,143,224,'+(0.5*ex).toFixed(2)+')'); g.addColorStop(1,'rgba(47,143,224,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(mx,my,22,0,TAU); ctx.fill(); }
      const ax=mx-7, bx=mx+7+sp, by=my+5; line(ctx,ax,by,mx,my-3,COL.ink,1.5); line(ctx,mx,my-3,bx,by,COL.ink,1.5); circ(ctx,ax,by,3.8,COL.red,'#fff',1.7); circ(ctx,mx,my-3,3.8,COL.red,'#fff',1.7); circ(ctx,bx,by,3.8,COL.red,'#fff',1.7); ctx.restore(); });
    // glass pane
    const gx0=px-w*0.17, gx1=px+w*0.05, gA=glass?1:0; ctx.save(); ctx.globalAlpha=0.18+0.82*gA; rrect(ctx,gx0,paneY-4,gx1-gx0,9,3); ctx.fillStyle='rgba(47,143,224,0.18)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.2; ctx.setLineDash(glass?[]:[6,5]); ctx.stroke(); ctx.restore();
    textAt(ctx,'glass',gx0-8,paneY+4,{align:'right',size:11,color:COL.blue,weight:500,alpha:0.4+0.6*gA});
    // sun
    circ(ctx,sx,sy,sr,COL.yellow,'#fff6d8',3.4); for(let k=0;k<12;k++){ const a=k*TAU/12+t*0.3; line(ctx,sx+Math.cos(a)*sr*1.25,sy+Math.sin(a)*sr*1.25,sx+Math.cos(a)*sr*1.7,sy+Math.sin(a)*sr*1.7,COL.yellow,2.6); }
    // spawn photons
    uvAcc+=3*dt; vAcc+=3*dt;
    const launch=(kind)=>{ const q=tgt(); const dx=q.x-sx, dy=q.y-sy, d=Math.hypot(dx,dy); let stop=q.y, fate='skin';
      if(kind==='uv'){ if(Math.random()<pO){ stop=bt+6+Math.random()*(bb-bt-12); fate='ozone'; } else if(glass && true){ const gxAt=pathX(paneY,q.x,q.y); if(gxAt>gx0&&gxAt<gx1){ stop=paneY; fate='glass'; } } }
      ph.push({x:sx+dx/d*sr*1.6,y:sy+dy/d*sr*1.6,vx:dx/d*185,vy:dy/d*185,ty:kind,stop,fate,age:0,ang:Math.atan2(dy,dx)}); };
    while(uvAcc>=1){ uvAcc-=1; launch('uv'); } while(vAcc>=1){ vAcc-=1; launch('vis'); }
    for(let i=ph.length-1;i>=0;i--){ const p=ph[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.age+=dt;
      if(p.y>=p.stop){ if(p.fate==='ozone'){ let bj=-1,bd=1e9; mol.forEach((m,j)=>{ if(m.ap<0.5) return; const dd=Math.hypot(m.u*w-p.x,bt+8+m.v*(bb-bt-16)-p.y); if(dd<bd){bd=dd;bj=j;} }); if(bj>=0) mol[bj].exc=0.5; }
        else if(p.fate==='skin' && p.ty==='uv'){ uvRate+=0.4; dose+=1; } ph.splice(i,1); } }
    ph.forEach(p=>{ if(p.ty==='uv') wavy(ctx,p.x,p.y,p.ang,24,4.4,6,COL.blue,2.4,t*14); else wavy(ctx,p.x,p.y,p.ang,40,5.2,2,COL.yellow,2.6,t*7); });
    // ground + person (line figure; face and hands take the skin colour)
    line(ctx,0,gy,w,gy,COL.ink,3); for(let x=10;x<w;x+=22) line(ctx,x,gy+4,x-9,gy+15,rgba(COL.mid,0.5),1.2);
    const skin=mixCol(mixCol('#f2cfae','#7a4a2c',tan),COL.red,burn*0.45), hr=ph0*0.2, hy=pyFeet-ph0*1.75, by0=hy+hr, by1=pyFeet-ph0*0.85;
    line(ctx,px,by0,px,by1,COL.ink,3.6); line(ctx,px,by0+ph0*0.18,px-ph0*0.42,by0+ph0*0.62,COL.ink,3.4); line(ctx,px,by0+ph0*0.18,px+ph0*0.42,by0+ph0*0.62,COL.ink,3.4);
    line(ctx,px,by1,px-ph0*0.3,pyFeet,COL.ink,3.6); line(ctx,px,by1,px+ph0*0.3,pyFeet,COL.ink,3.6);
    circ(ctx,px-ph0*0.42,by0+ph0*0.62,4.6,COL.ink,skin,1.8); circ(ctx,px+ph0*0.42,by0+ph0*0.62,4.6,COL.ink,skin,1.8); circ(ctx,px,hy,hr,COL.ink,skin,3);
    line(ctx,px-hr*0.4,hy-hr*0.1,px-hr*0.4,hy-hr*0.1,COL.ink,3); line(ctx,px+hr*0.4,hy-hr*0.1,px+hr*0.4,hy-hr*0.1,COL.ink,3);
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.beginPath(); ctx.arc(px,hy+hr*0.15,hr*0.45,0.2,Math.PI-0.2); ctx.stroke(); ctx.restore();
    // tan gauge
    const gx=w*0.9, g0=h*0.45, g1=h*0.85; rrect(ctx,gx-8,g0,16,g1-g0,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
    ctx.save(); rrect(ctx,gx-8,g0,16,g1-g0,6); ctx.clip(); ctx.fillStyle=mixCol('#c28a5c','#7a4a2c',tan); ctx.fillRect(gx-8,g1-(g1-g0)*tan,16,(g1-g0)*tan); ctx.restore(); textAt(ctx,'tan',gx,g0-8,{align:'center',size:12,color:COL.muted});
    if(burn>0.25) textAt(ctx,'sunburn risk',px,headY-ph0*0.25,{align:'center',size:12,color:COL.red,alpha:burn});
  });
  return wrap;
}

activities.push(

let currentIndex = 0;
function buildNav(){

  activities.forEach((a,i)=>{ const b=document.createElement('button'); b.className='nav-item'+(i===currentIndex?' active':'');
