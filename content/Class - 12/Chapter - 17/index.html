    ctx.restore();
    if(m1&&m2&&Math.abs(m1.T-m2.T)>1){ const l1=Math.log(kOf(m1.T,Ea)), l2=Math.log(kOf(m2.T,Ea)); const ea=-R_GAS*(l2-l1)/(1/m2.T-1/m1.T);
      $('#ea2').textContent=fmt(ea/1000,1)+' kJ/mol'; } else $('#ea2').textContent='mark T₁ and T₂';
    textAt(ctx,'slope = −Eₐ/R = '+fmt(-Ea/R_GAS,0)+' K',gx+gw-8,gy+18,{align:'right',size:12,weight:700,color:COL.blue});
    legend(ctx,gx,gy+gh+54,[[COL.blue,'ln k vs 1/T','line'],[COL.red,'now'],[COL.mid,'given k']]);
  });
  return wrap;
}

/* =====================================================================
   3.8 EFFECT OF A CATALYST
   Beads are random walkers (overdamped Langevin dynamics) on the potential-energy profile
   U(x) = 16·B·x²(1−x)² − D·x,  B = Ea/12.5 (in kT). A catalyst lowers B for the forward AND
   reverse path equally, so both runs reach the same equilibrium — one just gets there sooner.
   Real speed-up from Arrhenius: k_cat/k = e^(ΔEa / RT).
   ===================================================================== */
function buildA8(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="cat">＋ Add catalyst</button><button class="toggle-btn" id="rs">↺ Restart</button></div></div>
    <div class="control-group"><label>Eₐ without catalyst <span class="val" id="eV"></span></label><input type="range" id="eR" min="50" max="110" step="1" value="75">
      <label style="margin-top:9px">Catalyst lowers Eₐ by <span class="val" id="dV"></span></label><input type="range" id="dR" min="10" max="50" step="1" value="30">
      <label style="margin-top:9px">Temperature <span class="val" id="tV"></span></label><input type="range" id="tR" min="280" max="360" step="1" value="300"></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Speed-up  k<sub>cat</sub>/k</div><div class="rval" id="su" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">ΔH (both)</div><div class="rval" id="dh" style="color:var(--f-blue)">same</div></div>
      <div class="rcard"><div class="rlabel">Product, plain</div><div class="rval" id="pp">—</div></div>
      <div class="rcard"><div class="rlabel">Product, catalysed</div><div class="rval" id="pc" style="color:var(--f-green)">—</div></div></div>
      <p class="hint">Same equilibrium, reached sooner</p></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const NB=90, D=1.6, MU=3;
  let catOn=false, t=0, simT=0, hist=[], hAcc=0; const dB={x:6,v:0};
  const mkBeads=()=>{ const a=[]; for(let i=0;i<NB;i++) a.push({x:0.02+Math.random()*0.12,r:Math.random()}); return a; };
  let A=mkBeads(), B=mkBeads();
  const bPlain={x:6,v:0}, bCat={x:6,v:0};
  $('#cat').onclick=()=>{ catOn=!catOn; $('#cat').textContent=catOn?'－ Remove catalyst':'＋ Add catalyst'; };
  $('#rs').onclick=()=>{ A=mkBeads(); B=mkBeads(); simT=0; hist=[]; };
  const U=(x,b)=>16*b*x*x*(1-x)*(1-x)-D*x;
  const dU=(x,b)=>32*b*x*(1-x)*(1-2*x)-D;
  function step(list,b,kT,dt){ const n=Math.max(1,Math.ceil(dt/0.0004)), h=dt/n;
    for(let s=0;s<n;s++) list.forEach(q=>{ q.x+=-MU*dU(q.x,b)*h+Math.sqrt(2*MU*kT*h)*randn(); if(q.x<-0.12){q.x=-0.12;} if(q.x>1.12){q.x=1.12;} }); }
  animLoop(dt=>{
    t+=dt; const Ea=+$('#eR').value, dE=+$('#dR').value, T=+$('#tR').value, kT=T/300;
    $('#eV').textContent=Ea+' kJ/mol'; $('#dV').textContent=dE+' kJ/mol'; $('#tV').textContent=T+' K';
    springTo(bPlain,Ea/12.5,70,14,dt); springTo(bCat,(catOn?Ea-dE:Ea)/12.5,38,7,dt);
    const dtc=Math.min(dt,0.033); simT+=dtc; step(A,bPlain.x,kT,dtc); step(B,bCat.x,kT,dtc);
    hAcc+=dtc; if(hAcc>=0.25){ hAcc=0; hist.push([simT,A.filter(q=>q.x>0.5).length/NB,B.filter(q=>q.x>0.5).length/NB]); if(hist.length>400) hist.shift(); }
    const pA=A.filter(q=>q.x>0.5).length/NB, pB=B.filter(q=>q.x>0.5).length/NB;
    $('#pp').textContent=Math.round(pA*100)+' %'; $('#pc').textContent=Math.round(pB*100)+' %'; $('#su').textContent=catOn?'× '+sci(Math.exp(dE*1000/(R_GAS*T)),2):'× 1';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const px=w*0.05, pw=w*0.50, ph=h*0.33;
    const panel=(y,title,b,list,ghost,col)=>{
      const yTop=y, yBot=y+ph, umin=-D-0.2, umax=Math.max(10.5,ghost+0.8);
      const X=u=>px+u*pw, Y=v=>yBot-(v-umin)/(umax-umin)*(ph-12);
      addLabelTitle(ctx,title,px+pw/2,yTop-8,12.5);
      line(ctx,px,yBot+2,px+pw,yBot+2,COL.ink,2);
      const pts=[]; for(let i=0;i<=120;i++){ const u=i/120; pts.push([X(u),Y(U(u,b))]); }
      if(ghost>b+0.2){ const gp=[]; for(let i=0;i<=120;i++){ const u=i/120; gp.push([X(u),Y(U(u,ghost))]); } polyline(ctx,gp,COL.red,1.8,[5,5]); }
      polyline(ctx,pts,col,3.4);
      // Ea and ΔH markers
      const xb=0.5, ypk=Y(U(xb,b)), yR=Y(U(0.0,b)), yP=Y(U(1,b));
      line(ctx,X(0.0),yR,X(0.5),yR,COL.mid,1.2,[3,4]); dimArrow(ctx,X(0.5),ypk,yR,COL.red); pill(ctx,'Eₐ = '+fmt(b*12.5,0)+' kJ/mol',X(0.53),(ypk+yR)/2,COL.red);
      line(ctx,X(1.0),yR,X(1.12),yR,COL.mid,1.2,[3,4]); dimArrow(ctx,X(1.08),yR,yP,COL.blue); textAt(ctx,'ΔH',X(1.09)+6,(yR+yP)/2+4,{size:12,weight:700,color:COL.blue});
      textAt(ctx,'reactants',X(0.04),yBot+18,{size:11.5,weight:600,color:COL.blue}); textAt(ctx,'products',X(0.9),yBot+18,{size:11.5,weight:600,color:COL.green,align:'center'});
      list.forEach((q,i)=>{ const xx=clamp(q.x,-0.05,1.08), prd=q.x>0.5; circ(ctx,X(xx),Y(U(xx,b))-6+Math.sin(t*9+i)*0.8,4.2,prd?COL.green:COL.blue,prd?'#e3f6ec':'#eef6fe',2); });
    };
    panel(h*0.10,'Without catalyst',bPlain.x,A,0,COL.red);
    panel(h*0.58,'With catalyst'+(catOn?'':' (off)'),bCat.x,B,bPlain.x,catOn?COL.green:COL.red);
    textAt(ctx,'reaction coordinate →',px+pw/2,h*0.985,{align:'center',size:11.5,weight:600,color:COL.muted});
    // product fraction chart
    const gx=w*0.70, gw=w*0.26, gy=h*0.14, gh=h*0.52, tmax=Math.max(40,hist.length?hist[hist.length-1][0]:0);
    const G=plotFrame(ctx,gx,gy,gw,gh,{x0:Math.max(0,tmax-40),x1:Math.max(40,tmax),y0:0,y1:1,xt:4,yt:5,xf:v=>fmt(v,0),yf:v=>Math.round(v*100)+'%',xl:'time  (s)',yl:'products formed',yoff:44});
    const ke=Math.exp(-D*1)*0+1; // equilibrium reference
    const eq=(()=>{ let z0=0,z1=0; for(let i=0;i<=200;i++){ const u=-0.1+1.2*i/200, e=Math.exp(-U(u,3)); if(u<0.5) z0+=e; else z1+=e; } return z1/(z0+z1); })();
    line(ctx,gx,G.Y(eq),gx+gw,G.Y(eq),COL.mid,1.6,[5,4]); textAt(ctx,'equilibrium',gx+gw-4,G.Y(eq)-6,{align:'right',size:10.5,weight:600,color:COL.muted});
    ctx.save(); clipRect(ctx,gx,gy,gw,gh);
    polyline(ctx,hist.map(r=>[G.X(r[0]),G.Y(r[1])]),COL.red,2.8); polyline(ctx,hist.map(r=>[G.X(r[0]),G.Y(r[2])]),COL.green,2.8); ctx.restore();
    legend(ctx,gx,gy+gh+54,[[COL.red,'plain','line'],[COL.green,'catalysed','line']]);
  });
  return wrap;
}

/* =====================================================================
   3.9 COLLISION THEORY            Rate = P · Z_AB · e^(−Ea/RT)
   CH₃Br + OH⁻ → CH₃OH + Br⁻   (Fig. 3.12)  Effective collision = enough energy AND proper orientation.
   Energy: OH⁻ climbs a potential hill of height Ea (force −dU/dx) — it either crosses or slides back.
   Orientation: attack must come from the side opposite Br (within ±35°); otherwise it hits the Br/H
   side, bounces off like a hard sphere and sets the molecule spinning.
   ===================================================================== */
function buildA9(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="fire">➤ Fire OH⁻</button><button class="toggle-btn" id="auto">Auto: off</button></div></div>
    <div class="control-group"><label>Kinetic energy of OH⁻ <span class="val" id="kV"></span></label><input type="range" id="kR" min="5" max="80" step="1" value="55">
      <label style="margin-top:9px">Orientation of CH₃Br <span class="val" id="oV"></span></label><input type="range" id="oR" min="0" max="180" step="1" value="0">
      <div class="hint">0° → Br points away from the attacker</div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Collisions</div><div class="rval" id="n1">0</div></div>
      <div class="rcard"><div class="rlabel">Effective</div><div class="rval" id="n2" style="color:var(--f-green)">0</div></div>
      <div class="rcard"><div class="rlabel">Too little energy</div><div class="rval" id="n3" style="color:var(--f-red)">0</div></div>
      <div class="rcard"><div class="rlabel">Wrong orientation</div><div class="rval" id="n4" style="color:var(--f-yellow)">0</div></div></div>
      <p class="hint">Threshold Eₐ = 40 kJ/mol · proper-orientation window ±35°</p></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const EA=40, VS=34, DC=170, DB=62, DW=104;
  let phase='idle', t=0, ox=0, oy=0, ovx=0, ang=0, angTarget=0, angV=0, ax=0, avx=0, banner=null, bannerT=0, auto=false, autoT=0, cnt=[0,0,0,0];
  let Br={x:0,y:0,vx:0}, trail=[], midReact=false, startX=0;
  const fire=()=>{ if(phase!=='idle') return; phase='fly'; ox=startX; ovx=Math.sqrt(+$('#kR').value)*VS; ang=angTarget=(auto?(Math.random()<0.5?Math.random()*35:35+Math.random()*145):+$('#oR').value)*Math.PI/180; angV=0; ax=0; avx=0; midReact=false; trail=[]; if(auto) $('#oR').value=Math.round(angTarget*180/Math.PI); };
  $('#fire').onclick=fire; $('#auto').onclick=()=>{ auto=!auto; $('#auto').textContent='Auto: '+(auto?'on':'off'); $('#auto').classList.toggle('active',auto); };
  function result(kind,msg,col){ phase='done'; bannerT=2.4; banner={msg,col}; if(kind!==null) cnt[kind]++; cnt[0]++; }
  animLoop(dt=>{
    t+=dt; const KE=+$('#kR').value, deg=+$('#oR').value;
    $('#kV').textContent=KE+' kJ/mol'; $('#oV').textContent=deg+'°'; cnt.forEach((c,i)=>$('#n'+(i+1)).textContent=c);
    const {ctx,w:w0,h:h0}=fitCanvas(canvas); ctx.clearRect(0,0,w0,h0);
    const SC=clamp(Math.min(w0/760,h0/430),0.8,2.2), w=w0/SC, h=h0/SC; ctx.save(); ctx.scale(SC,SC);
    const cx=w*0.60, cy=h*0.50; startX=w*0.10;
    if(phase==='idle'){ ox=startX; oy=cy; angTarget=deg*Math.PI/180; ang=approach(ang,angTarget,6,dt); }
    // ---------- physics ----------
    const dMol=cx+ax-ox; // centre-to-centre distance along x
    const proper=Math.abs(ang)<35*Math.PI/180+1e-6;
    if(phase==='fly'){
      const hits=proper?DC:DW+40;
      if(proper){
        let Uslope=0; if(dMol<DC&&dMol>DB) Uslope=EA/(DC-DB); // dU/dd (energy per px), U rises as d falls
        const a=Uslope*VS*VS/2; // deceleration = −dU/dx · vs²/2 (see derivation)
        ovx-=a*dt; ox+=ovx*dt;
        if(dMol<DC&&ovx<0&&dMol>DC-2){ /* returned */ }
        if(dMol<=DB){ phase='react'; Br={x:cx+ax+80,y:cy,vx:150}; avx=40; cnt[0]++; cnt[1]++; banner={msg:'Effective collision ✓  CH₃Br + OH⁻ → CH₃OH + Br⁻',col:COL.green}; bannerT=3; midReact=true; ovx=0; }
        if(ovx<0&&dMol>=DC){ phase='back'; result(2,'Not enough energy — OH⁻ slides back down the hill',COL.red); }
      } else {
        ox+=ovx*dt;
        if(dMol<=DW){ phase='back'; ovx=-ovx*0.75; avx=Math.abs(ovx)*0.25; angV=(ang>Math.PI/2?-1:1)*3.2*(0.6+Math.random()*0.8)*(ang>Math.PI/2?1:-1); result(3,'Wrong orientation — it bounced off, no reaction',COL.yellow); }
      }
      if(ox>w) phase='idle';
    } else if(phase==='back'||phase==='done'){
      ox+=ovx*dt; ax+=avx*dt; avx=approach(avx,0,1.2,dt); ang+=angV*dt; angV=approach(angV,0,0.9,dt);
      if(ox<-60||ox>w+60){ phase='idle'; ax=0; } if(phase==='back'&&ox<startX-40){ phase='done'; }
      if(phase==='done'&&bannerT<=0){ phase='idle'; ax=0; }
    } else if(phase==='react'){
      ax+=avx*dt; Br.x+=Br.vx*dt; ox+=avx*dt; if(Br.x>w+40&&bannerT<=0){ phase='idle'; ax=0; }
    }
    if(phase!=='react') ox=phase==='idle'?startX:ox;
    bannerT-=dt; if(bannerT<=0&&(phase==='done'||phase==='react')&&Br.x>cx+ax+200){ phase='idle'; ax=0; banner=null; }
    if(phase==='idle'&&auto){ autoT+=dt; if(autoT>0.9){ autoT=0; fire(); } } else autoT=0;
    // ---------- draw ----------
    const mx=cx+ax;
    // energy hill under the scene
    const hy=h*0.88, hh=h*0.16;
    const Uof=d=>d>=DC?0:(d<=DB?EA:EA*(DC-d)/(DC-DB));
    const hp=[]; for(let X=w*0.05;X<=mx;X+=6){ const d=mx-X; hp.push([X,hy-hh*Uof(d)/EA]); }
    line(ctx,w*0.05,hy,mx+10,hy,'#dbe4f0',1.5);
    polyline(ctx,hp,COL.red,2.2); textAt(ctx,'energy barrier  Eₐ',mx-DC+10,hy-hh-8,{size:11,weight:700,color:COL.red});
    // OH⁻ position marker on hill
    if(phase==='fly'||phase==='back'||phase==='react'){ const d=mx-ox; circ(ctx,ox,hy-hh*Uof(d)/EA,4.4,COL.yellow,COL.yellow,1); }
    // CH3Br molecule
    const reacted=phase==='react';
    ctx.save(); ctx.translate(mx,cy);
    ctx.rotate(Math.PI-0);  // draw with Br pointing toward −x at ang=0? we rotate below
    ctx.restore();
    const brDirAng=ang; // ang=0 → Br points to +x (away from attacker coming from −x)
    ctx.save(); ctx.translate(mx,cy); ctx.rotate(brDirAng);
    // bonds
    if(!reacted) line(ctx,0,0,64,0,COL.ink,3);
    for(let i=0;i<3;i++){ const a=Math.PI+(i-1)*0.95; const hx=Math.cos(a)*46, hy2=Math.sin(a)*46; line(ctx,0,0,hx,hy2,COL.ink,2.6); circ(ctx,hx,hy2,10,COL.ink,'#fff',2); textAt(ctx,'H',hx,hy2+3.6,{align:'center',size:9.5,weight:700,color:COL.ink}); }
    circ(ctx,0,0,22,COL.blue,'#eef6fe',3); textAt(ctx,'C',0,5,{align:'center',size:13,weight:700,color:COL.blue});
    if(!reacted){ circ(ctx,74,0,19,COL.ink,'#fff',3); textAt(ctx,'Br',74,4.6,{align:'center',size:11.5,weight:700,color:COL.ink}); }
    ctx.restore();
    if(reacted){ // OH attached on the side the attacker came from, Br⁻ leaving
      circ(ctx,mx-46,cy,14,COL.green,'#e3f6ec',3); textAt(ctx,'OH',mx-46,cy+4,{align:'center',size:10.5,weight:700,color:COL.green});
      circ(ctx,Br.x,cy,19,COL.green,'#e3f6ec',3); textAt(ctx,'Br⁻',Br.x,cy+4.6,{align:'center',size:11,weight:700,color:COL.green}); }
    // OH⁻ projectile
    if(!reacted){ const oyy=cy; circ(ctx,ox,oyy,14,COL.yellow,'#fff8e6',3); textAt(ctx,'O',ox,oyy+4.4,{align:'center',size:12,weight:700,color:COL.yellow});
      circ(ctx,ox-18,oyy-10,6,COL.yellow,'#fff',2.2); textAt(ctx,'−',ox+14,oyy-14,{size:14,weight:700,color:COL.yellow});
      // velocity arrow
      if(phase==='fly'||phase==='idle'){ const L=(phase==='idle'?Math.sqrt(KE)*VS:ovx)*0.28; if(Math.abs(L)>4) vec(ctx,ox+22,oyy+26,ox+22+L,oyy+26,COL.yellow,3); } }
    // orientation guide
    if(phase==='idle'){ const ra=Math.abs(ang); ctx.save(); ctx.translate(mx,cy); ctx.strokeStyle=proper?COL.green:COL.red; ctx.lineWidth=2.2; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(0,0,98,-35*Math.PI/180,35*Math.PI/180); ctx.stroke(); ctx.restore();
      textAt(ctx,'Br must point inside the dashed arc',mx+112,cy-8,{size:10.5,weight:600,color:COL.muted});
      textAt(ctx,proper?'proper orientation':'improper orientation',mx,cy+130,{align:'center',size:12,weight:700,color:proper?COL.green:COL.red}); }
    // KE vs Ea meter
    const mxm=w*0.06, myy=h*0.12, mw=w*0.26; textAt(ctx,'energy of OH⁻ vs  Eₐ',mxm,myy-14,{size:11.5,weight:700});
    rect(ctx,mxm,myy,mw,14,COL.ink,'#fff',1.8); const ke=(phase==='fly'||phase==='react')?Math.pow(Math.abs(ovx)/VS,2):KE;
    ctx.save(); ctx.fillStyle=ke>=EA?COL.green:COL.yellow; ctx.fillRect(mxm+1,myy+1,(mw-2)*clamp(ke/80,0,1),12); ctx.restore();
    line(ctx,mxm+mw*EA/80,myy-4,mxm+mw*EA/80,myy+18,COL.red,3); textAt(ctx,'Eₐ',mxm+mw*EA/80,myy+32,{align:'center',size:11.5,weight:700,color:COL.red});
    if(banner&&bannerT>0) pill(ctx,banner.msg,w/2,h*0.80-(phase==='idle'?0:0),banner.col,'center');
    textAt(ctx,'CH₃Br + OH⁻ → CH₃OH + Br⁻',w*0.5,h*0.05+4,{align:'center',size:14,weight:700});
    legend(ctx,w*0.06,h*0.97-2,[[COL.blue,'CH₃Br carbon'],[COL.yellow,'OH⁻'],[COL.green,'products'],[COL.red,'energy barrier','line']]);
    ctx.restore();
  });
  return wrap;
}

render();
</script>
