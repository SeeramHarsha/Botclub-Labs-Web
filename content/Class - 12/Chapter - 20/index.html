<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}
.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}
.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease; color:inherit;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}
.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1); white-space:nowrap;}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}
.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn:hover{background:var(--surface-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.hot{background:var(--f-red); border-color:var(--f-red); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

<div class="app">
  <div class="topbar">
    <div class="brand-badge">⚗️</div>

      <div class="chip">Grade 12 · Chemistry Part 2 · Ch 1</div>

<script>
/* =========================================================================
   GRADE 12 — CHEMISTRY PART 2 — CHAPTER 1: HALOALKANES AND HALOARENES
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn object eases, springs or is physically integrated
   toward it every frame (Morse oscillator, Langevin barrier-crossing,
   molecular dynamics) — never a jump, never a static picture.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab', pale:'#eef2f8'};

/* ---------------- canvas helpers ---------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.lineCap='round';
  ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,8); }
function textAt(ctx,txt,x,y,o){
  o=o||{}; ctx.save();
  ctx.font=(o.weight||500)+' '+(o.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=o.color||COL.ink; ctx.textAlign=o.align||'left'; ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!==undefined) ctx.globalAlpha=o.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.stroke();} ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function normal(){ let u=0,v=0; while(!u) u=Math.random(); v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function rgba(hex,a){ const c=hexRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

/* ---------------- animation engine ---------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now(), raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now; tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop); return stop;
}
/** Exponential ease — frame-rate independent. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — natural overshoot and settle. */
function springTo(s,target,k,damping,dt){ const a=(target-s.x)*k - s.v*damping; s.v+=a*dt; s.x+=s.v*dt; return s.x; }
/** Langevin dynamics on a 1-D coordinate: real thermal barrier crossing. */
function langevin(s,force,theta,gamma,dt,m){
  m=m||1; const n=Math.max(1,Math.ceil(dt/0.004)), h=dt/n;
  for(let i=0;i<n;i++){
    const a=force(s.x)/m - gamma*s.v;
    s.v += a*h + Math.sqrt(2*gamma*theta/m*h)*normal();
    s.x += s.v*h;
  }
}

/* ---------------- chemistry drawing helpers ---------------- */
function atom(ctx,x,y,r,col,label,fill,lw){
  circ(ctx,x,y,r,col,fill||'#fff',lw||2.4);
  if(label) textAt(ctx,label,x,y+Math.min(5,r*0.32),{align:'center',size:Math.max(9,Math.min(15,r*0.85)),weight:700,color:col});
}
function dashLine(ctx,x1,y1,x2,y2,col,w){ line(ctx,x1,y1,x2,y2,col,w||2,[6,5]); }
function wedge(ctx,x1,y1,x2,y2,col,w0,w1){
  const a=Math.atan2(y2-y1,x2-x1), nx=-Math.sin(a), ny=Math.cos(a);
  ctx.save(); ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x1+nx*w0,y1+ny*w0); ctx.lineTo(x2+nx*w1,y2+ny*w1); ctx.lineTo(x2-nx*w1,y2-ny*w1); ctx.lineTo(x1-nx*w0,y1-ny*w0); ctx.closePath(); ctx.fill(); ctx.restore();
}
function hashDash(ctx,x1,y1,x2,y2,col,w1){
  const a=Math.atan2(y2-y1,x2-x1), nx=-Math.sin(a), ny=Math.cos(a), n=6;
  for(let i=1;i<=n;i++){ const u=i/n, px=lerp(x1,x2,u), py=lerp(y1,y2,u), hw=w1*u; line(ctx,px-nx*hw,py-ny*hw,px+nx*hw,py+ny*hw,col,1.8); }
}
/* water molecule, H-side pointing at (tx,ty) if given (solvating an anion) */
function water(ctx,x,y,ang,sc,col){
  sc=sc||1; col=col||COL.blue;
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  const a=0.9, L=11*sc;
  line(ctx,0,0,Math.cos(a)*L,Math.sin(a)*L,col,1.6); line(ctx,0,0,Math.cos(-a)*L,Math.sin(-a)*L,col,1.6);
  circ(ctx,Math.cos(a)*L,Math.sin(a)*L,3*sc,col,'#fff',1.4); circ(ctx,Math.cos(-a)*L,Math.sin(-a)*L,3*sc,col,'#fff',1.4);
  circ(ctx,0,0,5.5*sc,COL.ink,'#fff',1.6);
  ctx.restore();
}

/* energy-profile chart with the live ball on it.  ymin/ymax = energy range */
function profilePlot(ctx,x,y,w,h,U,x0,x1,ymin,ymax,ball,o){
  o=o||{};
  const X=v=>x+(v-x0)/(x1-x0)*w, Y=v=>y+h-(v-ymin)/(ymax-ymin)*h;
  line(ctx,x,y,x,y+h,COL.ink,1.8); line(ctx,x,y+h,x+w,y+h,COL.ink,1.8);
  arrowHead(ctx,x,y-1,-Math.PI/2,COL.ink,6); arrowHead(ctx,x+w+1,y+h,0,COL.ink,6);
  textAt(ctx,o.ylab||'Energy',x-8,y-6,{size:11,weight:600,color:COL.muted});
  textAt(ctx,o.xlab||'Reaction progress',x+w,y+h+16,{size:11,weight:600,color:COL.muted,align:'right'});
  if(o.base!==undefined){ line(ctx,x,Y(o.base),x+w,Y(o.base),COL.mid,1,[3,4]); }
  ctx.save(); ctx.beginPath(); ctx.strokeStyle=o.curve||COL.blue; ctx.lineWidth=2.8; ctx.lineJoin='round';
  for(let i=0;i<=120;i++){ const v=x0+(x1-x0)*i/120; const px=X(v), py=Y(clamp(U(v),ymin,ymax)); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.stroke(); ctx.restore();
  if(ball!==undefined){
    const bx=X(clamp(ball,x0,x1)), by=Y(clamp(U(clamp(ball,x0,x1)),ymin,ymax));
    circ(ctx,bx,by-8,8,COL.yellow,'#fff3cc',2.6);
    line(ctx,bx,by,bx,by-1,COL.yellow,1);
  }
  return {X,Y};
}

/* ---------------- small UI framework ---------------- */
const ACTS=[];
function addAct(a){ ACTS.push(a); }
function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

function makeUI(side){
  const ui={};
  ui.slider=(label,min,max,step,val,f,onInput)=>{
    const g=el('div','control-group'); const lb=el('label',null,'<span>'+label+'</span><span class="val"></span>');
    const inp=el('input'); inp.type='range'; inp.min=min; inp.max=max; inp.step=step; inp.value=val;
    const vEl=lb.querySelector('.val'); const upd=()=>{ vEl.textContent=f?f(+inp.value):inp.value; };
    inp.addEventListener('input',()=>{ upd(); onInput(+inp.value); });
    g.appendChild(lb); g.appendChild(inp); side.appendChild(g); upd(); onInput(+val);
    return {set(v){ inp.value=v; upd(); onInput(+inp.value); }, get(){ return +inp.value; }};
  };
  ui.chips=(label,opts,sel,onPick)=>{
    const g=el('div','control-group'); g.appendChild(el('label',null,'<span>'+label+'</span>'));
    const row=el('div','toggle-group'); const btns=[];
    opts.forEach(o=>{ const b=el('button','toggle-btn',o.t); b.type='button';
      b.onclick=()=>{ set(o.k); onPick(o.k); }; b.dataset.k=o.k; btns.push(b); row.appendChild(b); });
    function set(k){ btns.forEach(b=>b.classList.toggle('active',b.dataset.k==String(k))); }
    g.appendChild(row); side.appendChild(g); set(sel); onPick(sel);
    return {set};
  };
  ui.toggles=(label,opts,sel,onChange)=>{
    const g=el('div','control-group'); g.appendChild(el('label',null,'<span>'+label+'</span>'));
    const row=el('div','toggle-group'); const on=new Set(sel);
    opts.forEach(o=>{ const b=el('button','toggle-btn'+(on.has(o.k)?' active':''),o.t); b.type='button';
      b.onclick=()=>{ if(on.has(o.k)) on.delete(o.k); else on.add(o.k); b.classList.toggle('active',on.has(o.k)); onChange(on); }; row.appendChild(b); });
    g.appendChild(row); side.appendChild(g); onChange(on);
  };
  ui.buttons=(list)=>{
    const g=el('div','control-group'); const row=el('div','toggle-group'); row.style.marginTop='0';
    list.forEach(b=>{ const x=el('button','toggle-btn '+(b.cls||'navy'),b.t); x.type='button'; x.onclick=b.fn; row.appendChild(x); });
    g.appendChild(row); side.appendChild(g);
  };
  ui.readout=(items)=>{
    const g=el('div','result-cards'); const map={};
    items.forEach(it=>{ const c=el('div','rcard'+(it.wide?' wide':''),'<div class="rlabel">'+it.label+'</div><div class="rval">—</div>'); map[it.id]=c.querySelector('.rval'); g.appendChild(c); });
    side.appendChild(g);
    return (id,txt,col)=>{ const e=map[id]; if(e){ if(e._t!==txt){ e.textContent=txt; e._t=txt; } e.style.color=col||''; } };
  };
  ui.hint=(t)=>{ side.appendChild(el('div','hint',t)); };
  return ui;
}

let current=null;
function openAct(i){
  stopAllLoops();
  const a=ACTS[i]; current=i;
  document.querySelectorAll('.nav-item').forEach((n,j)=>n.classList.toggle('active',j===i));
  document.getElementById('panelBadge').textContent=a.num;
  document.getElementById('panelTitle').textContent=a.title;
  document.getElementById('panelDesc').textContent=a.desc;
  const body=document.getElementById('panelBody'); body.innerHTML='';
  const view=el('div','lab-view'); const wrap=el('div','lab-canvas-wrap'); const cv=el('canvas'); wrap.appendChild(cv);
  const side=el('div','lab-side'); view.appendChild(wrap); view.appendChild(side); body.appendChild(view);
  const ui=makeUI(side);
  const draw=a.make(ui);
  let T=0;
  animLoop(dt=>{
    const {ctx,w,h}=fitCanvas(cv); T+=dt;
    ctx.clearRect(0,0,w,h);
    draw(ctx,w,h,dt,T);
  });
  try{ history.replaceState(null,'','#'+a.num); }catch(e){}
}
function boot(){
  const nav=document.getElementById('sideNav');
  ACTS.forEach((a,i)=>{
    const b=el('button','nav-item','<span class="n-num">'+a.num+'</span><span class="n-title">'+a.title+'</span>');
    b.type='button'; b.onclick=()=>openAct(i); nav.appendChild(b);
  });
  const hash=location.hash.slice(1); let start=ACTS.findIndex(a=>a.num===hash); if(start<0) start=0;
  openAct(start);
}
/* =========================================================================

const GROUPS={
  H:{r:9,col:COL.mid,t:'H'}, Me:{r:15,col:COL.green,t:'CH₃'}, Et:{r:19,col:COL.blue,t:'C₂H₅'}, Pr:{r:21,col:COL.blue,t:'C₃H₇'}

/* tetrahedral / planar / inverted centre.
   phi = angle between the substituent bonds and the +x axis (109.5° → 90° → 70.5°) */
function drawCenter(ctx,o){
  const {cx,cy,U,phi,groups,t}=o, ph=phi*Math.PI/180, L=1.1*U;
  const psi=[0,120,240].map(d=>d*Math.PI/180+(o.spin||0));
  const sub=groups.map((g,i)=>{
    const rho=L*Math.sin(ph), x=L*Math.cos(ph), y=-rho*Math.cos(psi[i]), z=rho*Math.sin(psi[i]);
    return {g,x:cx+x+z*0.5, y:cy+y, z, i};
  });
  sub.sort((a,b)=>a.z-b.z);
  const ghost=o.ghost;
  if(ghost){ /* faint original umbrella */
    groups.forEach((g,i)=>{ const p0=109.5*Math.PI/180, rho=L*Math.sin(p0), x=L*Math.cos(p0), y=-rho*Math.cos(psi[i]), z=rho*Math.sin(psi[i]);
      circ(ctx,cx+x+z*0.5,cy+y,GROUPS[g].r*(U/100)*1.25+3,rgba('#8195ab',0.5),null,1.4); });
  }
  sub.forEach(s=>{
    const G=GROUPS[s.g], rr=G.r*(U/100)*1.25+3, a=Math.atan2(s.y-cy,s.x-cx), ex=s.x-Math.cos(a)*rr, ey=s.y-Math.sin(a)*rr;
    const sx=cx+Math.cos(a)*7, sy=cy+Math.sin(a)*7;
    if(Math.abs(s.z)<2) line(ctx,sx,sy,ex,ey,COL.ink,3); else if(s.z>0) wedge(ctx,sx,sy,ex,ey,COL.ink,1.2,5.2); else hashDash(ctx,sx,sy,ex,ey,COL.ink,5.2);
    atom(ctx,s.x,s.y,rr,G.col,G.t,'#fff',2.4);
  });
  circ(ctx,cx,cy,9,COL.ink,'#fff',3); textAt(ctx,'C',cx,cy+4,{align:'center',size:12,weight:700});
}
/* a bond that is solid, dashed (partial) or absent depending on strength 0..1 */

   (alkene, Zaitsev: the more substituted but-2-ene wins).  Every collision
   is drawn as a real mechanism; the tally converges to the probabilities.
   ========================================================================= */
addAct({num:'1.5', title:'Substitution vs Elimination', desc:'Same halide, same KOH — only the solvent and heat decide: alcohol or alkene.', make(ui){
  let solv='aq', temp=320;
  let kind=null, q=0, hold=0, fade=1; const tally={S:0,Z:0,H:0};
  const pE=()=>solv==='aq'?clamp(0.10+(temp-300)/120*0.42,0.05,0.9):clamp(0.84+(temp-300)/120*0.14,0.8,0.98);
  const probs=()=>{ const e=pE(); return {S:1-e,Z:e*0.81,H:e*0.19}; };
  const read=ui.readout([{id:'ps',label:'Substitution (alcohol)'},{id:'pz',label:'But-2-ene (Zaitsev)'},{id:'ph',label:'But-1-ene'},{id:'n',label:'Collisions run'}]);
  ui.chips('Solvent for KOH',[{k:'aq',t:'Aqueous'},{k:'alc',t:'Alcoholic'}],solv,k=>{ solv=k; });
  ui.slider('Temperature (K)',300,420,5,320,f=>f+' K',v=>{ temp=v; });
  ui.buttons([{t:'Clear tally',cls:'navy',fn:()=>{ tally.S=tally.Z=tally.H=0; }}]);
  ui.hint('Alcoholic KOH gives RO⁻: a stronger base, a poorer nucleophile.');
  function pick(){ const p=probs(), r=Math.random(); kind=r<p.S?'S':(r<p.S+p.Z?'Z':'H'); q=0; hold=0; fade=0; }
  pick();
  const waters=[0,1,2,3,4].map(i=>({a:i/5*6.28+0.3}));

  return function draw(ctx,w,h,dt,t){
    if(hold<=0){ q=Math.min(1,q+dt/3.6); if(q>=1){ hold=1.3; tally[kind]++; } } else { hold-=dt; if(hold<=0) pick(); }
    fade=Math.min(1,fade+dt*3);
    const S=Math.min(w*0.085,84*Math.max(0.75,h/560)), ox=w*0.37, oy=h*0.52;
    const P=(u,v)=>[ox+u*S,oy+v*S];
    const C1=P(-1.73,-0.5), C2=P(-0.87,0), C3=P(0,-0.5), C4=P(0.87,0);
    const sm=smooth01;
    ctx.save(); ctx.globalAlpha=fade;
    /* carbon skeleton */
    line(ctx,C1[0],C1[1],C2[0],C2[1],COL.ink,3); line(ctx,C2[0],C2[1],C3[0],C3[1],COL.ink,3); line(ctx,C3[0],C3[1],C4[0],C4[1],COL.ink,3);
    const dbl=sm(0.45,0.85,q);
    const dbl2=(a,b)=>{ const ang=Math.atan2(b[1]-a[1],b[0]-a[0]), nx=-Math.sin(ang)*0.2*S, ny=Math.cos(ang)*0.2*S; line(ctx,a[0]+nx+(b[0]-a[0])*0.12,a[1]+ny+(b[1]-a[1])*0.12,b[0]+nx-(b[0]-a[0])*0.12,b[1]+ny-(b[1]-a[1])*0.12,rgba('#1f9d55',dbl),3.2); };
    if(kind==='Z') dbl2(C2,C3); if(kind==='H') dbl2(C1,C2);
    /* bromide leaves downward */
    const brK=1-sm(0.4,0.75,q), brPos=P(-0.87,lerp(1.15,2.7,sm(0.38,1,q))+Math.sin(t*3)*0.02);
    partialBond(ctx,C2[0],C2[1]+4,brPos[0],brPos[1]-24,brK>0.97?1:brK,COL.red,t);
    atom(ctx,brPos[0],brPos[1],24,COL.red,'Br','#fff3f0',2.8);
    textAt(ctx,q<0.35?'δ−':'−',brPos[0]+22,brPos[1]-16,{size:14,weight:700,color:COL.red});
    textAt(ctx,'δ+',C2[0]-26,C2[1]-12,{size:13,weight:700,color:COL.red,alpha:1-sm(0.3,0.6,q)});
    /* the base / nucleophile */
    const base=solv==='aq'?'OH':'OR';
    let oPos, hPos=null, hStart=null, hAnchor=null, bondK=0, cHk=0;
    if(kind==='S'){
      oPos=P(-0.87,lerp(-3.0,-1.3,sm(0,0.62,q)));
      bondK=sm(0.35,0.78,q);
      partialBond(ctx,C2[0],C2[1]-4,oPos[0],oPos[1]+22,bondK>0.97?1:bondK,COL.blue,t);
    } else {
      const cx=kind==='Z'?C3:C1, hb=kind==='Z'?[0,-1.45]:[-1.73,-1.45];
      const start=kind==='Z'?[2.0,-3.0]:[-3.4,-3.0], tgt=kind==='Z'?[0.75,-2.2]:[-2.4,-2.3];
      const away=kind==='Z'?[2.0,-1.5]:[-1.6,-1.6];
      const e=sm(0,0.55,q), ex=sm(0.68,1,q);
      const ou=[lerp(start[0],tgt[0],e)+away[0]*ex, lerp(start[1],tgt[1],e)+away[1]*ex*-0.6];
      oPos=P(ou[0],ou[1]);
      const hu=[lerp(hb[0],tgt[0]-0.5*Math.sign(tgt[0]-hb[0])*0.9,sm(0.4,0.68,q))+away[0]*ex, lerp(hb[1],tgt[1]+0.55,sm(0.4,0.68,q))+away[1]*ex*-0.6];
      hPos=P(hu[0],hu[1]); hAnchor=cx;
      cHk=1-sm(0.38,0.66,q);
      partialBond(ctx,cx[0],cx[1]-4,hPos[0],hPos[1]+(hPos[1]<cx[1]?7:-7),cHk>0.97?1:cHk,COL.ink,t);
      const ohK=sm(0.38,0.68,q);
      partialBond(ctx,hPos[0],hPos[1],oPos[0],oPos[1],ohK>0.97?1:ohK,COL.blue,t);
      atom(ctx,hPos[0],hPos[1],8,COL.mid,'H','#fff',1.8);
    }
    /* water cage round the base in aqueous KOH */
    if(solv==='aq'){ waters.forEach((wa,i)=>{ const a=wa.a+t*0.35, rr=40+3*Math.sin(t*2+i);
      water(ctx,oPos[0]+Math.cos(a)*rr,oPos[1]+Math.sin(a)*rr,a+Math.PI,0.85,COL.blue); }); }
    atom(ctx,oPos[0],oPos[1],22,COL.blue,base,'#e6f1fc',2.8);
    textAt(ctx,q<0.5?'−':'',oPos[0]+18,oPos[1]-18,{size:15,weight:700,color:COL.blue});
    /* curly arrows: electron movement, early in the collision */
    const aA=sm(0.02,0.18,q)*(1-sm(0.5,0.68,q));
    if(aA>0.02){
      const curl=(x1,y1,x2,y2,bend,col)=>{ const mx=(x1+x2)/2+bend*(y2-y1)*0.35, my=(y1+y2)/2-bend*(x2-x1)*0.35; ctx.save(); ctx.strokeStyle=rgba(col,aA); ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo(mx,my,x2,y2); ctx.stroke(); ctx.restore(); arrowHead(ctx,x2,y2,Math.atan2(y2-my,x2-mx),rgba(col,aA),8); };
      if(kind==='S'){ curl(oPos[0]+14,oPos[1]+18,C2[0]-4,C2[1]-14,-0.6,COL.blue); curl((C2[0]+brPos[0])/2+4,(C2[1]+brPos[1])/2,brPos[0]+6,brPos[1]-26,-0.7,COL.red); }
      else { const cx=kind==='Z'?C3:C1; curl(oPos[0],oPos[1]+20,hPos[0]-2,hPos[1]-6,0.6,COL.blue); curl((cx[0]+hPos[0])/2,(cx[1]+hPos[1])/2,(cx[0]+C2[0])/2+3,(cx[1]+C2[1])/2-3,0.9,COL.green); curl((C2[0]+brPos[0])/2+4,(C2[1]+brPos[1])/2,brPos[0]+6,brPos[1]-26,-0.7,COL.red); }
    }
    ctx.restore();
    /* caption */
    const cap=kind==='S'?['Substitution — Nu⁻ attacks carbon, Br⁻ leaves (butan-2-ol)',COL.blue]:kind==='Z'?['Elimination — base pulls a β-H from C3: but-2-ene (Zaitsev, major)',COL.green]:['Elimination — base pulls a β-H from CH₃: but-1-ene (minor)',COL.green];
    textAt(ctx,cap[0],ox,28,{align:'center',size:13,weight:700,color:cap[1]});
    if(q>0.97) textAt(ctx,kind==='S'?'CH₃CH(OH)CH₂CH₃':kind==='Z'?'CH₃CH=CHCH₃':'CH₂=CHCH₂CH₃',ox,h-26,{align:'center',size:15,weight:700,color:COL.green});

    /* ---- tallies vs expected ---- */
    const tx=w*0.72, tw=w*0.24, p=probs(), tot=Math.max(1,tally.S+tally.Z+tally.H);
    textAt(ctx,'Outcome of every collision',tx,60,{size:12,weight:700,color:COL.muted});
    [['S','Alcohol',COL.blue],['Z','But-2-ene',COL.green],['H','But-1-ene',COL.yellow]].forEach(([k,l,c],i)=>{
      const y=80+i*58; textAt(ctx,l,tx,y+10,{size:11,weight:700,color:c});
      const full=tw-6, obs=tally[k]/tot*full, exp=p[k]*full;
      rrect(ctx,tx,y+16,Math.max(2,obs),14,4); ctx.fillStyle=rgba(c,0.85); ctx.fill();
      line(ctx,tx+exp,y+12,tx+exp,y+34,COL.red,2.2);
      textAt(ctx,tally[k]+'',tx+Math.max(2,obs)+6,y+28,{size:11,weight:700,color:c});
    });
    textAt(ctx,'red tick = expected share',tx,80+3*58+6,{size:10,weight:600,color:COL.red});
    read('ps',Math.round(p.S*100)+' %',COL.blue); read('pz',Math.round(p.Z*100)+' %',COL.green); read('ph',Math.round(p.H*100)+' %',COL.yellow); read('n',(tally.S+tally.Z+tally.H)+'');
  };
}});
/* =========================================================================
   1.6  OPTICAL ACTIVITY — polarimeter  (Section 6.7.2 (c))
   The plane of polarised light twists as it travels through a chiral
   sample, by α = [α]·l·c.  (+) and (−) enantiomers twist equally and
   oppositely; a racemic mixture cancels to zero.  The analyser lets
   through I = cos²(θ − β) of the light.
   ========================================================================= */
addAct({num:'1.6', title:'Optical Activity', desc:'Light twists in a chiral solution. Equal (+) and (−) cancel — a racemic mixture.', make(ui){
  const SPEC=40; // specific rotation, deg · dm⁻¹ · (g/mL)⁻¹
  let sf=null, f=1, ach=false, conc=0.4, len=1.5, betaT=90;
  const A={x:0,v:0}, Bt={x:90,v:0};
  const read=ui.readout([{id:'alpha',label:'Rotation α (°)'},{id:'int',label:'Light at the eye'},{id:'mix',label:'(+) : (−) molecules'},{id:'bal',label:'Analyser − plane (°)'}]);
  const chips=ui.chips('Sample',[{k:'d',t:'(+) form'},{k:'l',t:'(−) form'},{k:'dl',t:'(±) racemic'},{k:'ach',t:'Achiral'}],'d',k=>{
    ach=false; if(k==='d') f=1; else if(k==='l') f=0; else if(k==='dl') f=0.5; else { ach=true; } if(sf) sf.set(Math.round(f*100)); });
  sf=ui.slider('% (+) enantiomer',0,100,1,100,v=>v+' %',v=>{ f=v/100; ach=false; });
  ui.slider('Concentration (g/mL)',0.05,0.5,0.01,0.4,v=>v.toFixed(2),v=>{ conc=v; });
  ui.slider('Tube length (dm)',0.5,2,0.1,1.5,v=>v.toFixed(1),v=>{ len=v; });
  const as=ui.slider('Analyser angle β (°)',0,180,1,90,v=>v+'°',v=>{ betaT=v; });
  ui.buttons([{t:'Find the dark point',cls:'play',fn:()=>{ as.set(Math.round(clamp(alphaTarget()+90,0,180))); }},{t:'Cross (β = 90°)',cls:'navy',fn:()=>as.set(90)}]);
  ui.hint('α>0 turns clockwise as the eye sees it.');
  const alphaTarget=()=>ach?0:(2*f-1)*SPEC*len*conc;
  const mols=[]; for(let i=0;i<44;i++) mols.push({u:Math.random(),v:Math.random(),a:Math.random()*6.28,du:0,dv:0,hand:i});

  function dial(ctx,x,y,r,ang,col,label,extra){
    circ(ctx,x,y,r,COL.ink,'#fff',2);
    line(ctx,x,y-r,x,y-r+6,COL.mid,1.6); line(ctx,x-r,y,x-r+5,y,COL.mid,1.2); line(ctx,x+r,y,x+r-5,y,COL.mid,1.2); line(ctx,x,y+r,x,y+r-5,COL.mid,1.2);
    const a=ang*Math.PI/180, dx=Math.sin(a)*(r-6), dy=-Math.cos(a)*(r-6);
    line(ctx,x-dx,y-dy,x+dx,y+dy,col,4); circ(ctx,x,y,3,col,col,1);
    textAt(ctx,label,x,y+r+16,{align:'center',size:11,weight:700,color:col});
    if(extra) textAt(ctx,extra,x,y+r+30,{align:'center',size:11,weight:600,color:COL.muted});
  }

  return function draw(ctx,w,h,dt,t){
    springTo(A,alphaTarget(),55,11,dt); springTo(Bt,betaT,55,11,dt);
    const alpha=A.x, beta=Bt.x;
    const cy=h*0.33, amp=Math.min(h*0.14,64), k=2*Math.PI/38, om=7;
    const xL=w*0.05, xP=w*0.2, xs=w*0.3, Lpx=lerp(w*0.17,w*0.37,(len-0.5)/1.5), xe=xs+Lpx, xA=w*0.78, xD=w*0.91;
    const Ith=(alpha-(beta-90)); // plane after sample (deg) relative to analyser axis rotated: analyser transmits angle beta-90 from vertical
    const betaV=beta-90;               // analyser axis measured from vertical (clockwise +): crossed at 90 → axis horizontal
    const thOut=alpha, trans=Math.pow(Math.cos((thOut-(beta))*Math.PI/180),2); // axis at β from vertical
    /* ---- apparatus (line diagrams) ---- */
    // lamp
    circ(ctx,xL,cy,15,COL.yellow,'#fff3cc',2.6); for(let i=0;i<8;i++){ const a=i*0.785+t*0.4; line(ctx,xL+Math.cos(a)*20,cy+Math.sin(a)*20,xL+Math.cos(a)*27,cy+Math.sin(a)*27,COL.yellow,2); }
    // polariser, analyser plates
    const plate=(x,col,lab)=>{ ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=rgba(col,0.08); ctx.lineWidth=2.6; rrect(ctx,x-6,cy-amp-30,12,2*amp+60,3); ctx.fill(); ctx.stroke(); ctx.restore(); textAt(ctx,lab,x,cy-amp-40,{align:'center',size:11,weight:700,color:col}); };
    plate(xP,COL.ink,'polariser'); plate(xA,COL.yellow,'analyser');
    // sample tube with chiral molecules
    const tubeTop=cy-amp-16, tubeH=2*amp+32;
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6; ctx.fillStyle=rgba('#2f8fe0',0.05); rrect(ctx,xs,tubeTop,Lpx,tubeH,14); ctx.fill(); ctx.stroke(); ctx.restore();
    textAt(ctx,'sample  l = '+fmt(len,1)+' dm',xs+Lpx/2,tubeTop+tubeH+16,{align:'center',size:11,weight:700,color:COL.blue});
    const nMol=Math.round(8+conc*70), nD=Math.round(nMol*f);
    mols.forEach((m,i)=>{
      if(i>=nMol) return;
      m.du+=normal()*0.5*dt; m.dv+=normal()*0.5*dt; m.du*=0.96; m.dv*=0.96; m.u+=m.du*dt*8; m.v+=m.dv*dt*8; m.a+=normal()*dt*2;
      if(m.u<0.04){m.u=0.04;m.du*=-1;} if(m.u>0.96){m.u=0.96;m.du*=-1;} if(m.v<0.1){m.v=0.1;m.dv*=-1;} if(m.v>0.9){m.v=0.9;m.dv*=-1;}
      const mx=xs+m.u*Lpx, my=tubeTop+m.v*tubeH, isD=i<nD, r=7;
      ctx.save(); ctx.translate(mx,my); ctx.rotate(m.a);
      circ(ctx,0,0,3,COL.ink,'#fff',1.4);
      const cols=ach?[COL.mid,COL.mid,COL.mid]:(isD?[COL.red,COL.blue,COL.green]:[COL.red,COL.green,COL.blue]);
      cols.forEach((c,j)=>{ const a=j*2.094; circ(ctx,Math.cos(a)*r,Math.sin(a)*r,2.4,c,c,1); line(ctx,Math.cos(a)*3,Math.sin(a)*3,Math.cos(a)*r,Math.sin(a)*r,COL.ink,1); });
      ctx.restore();
    });
    // eye
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.beginPath(); ctx.ellipse(xD,cy,22,13,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
    const glow=trans; circ(ctx,xD,cy,8,COL.ink,mixCol('#132a44','#ffe07a',glow),2.4);
    if(glow>0.03){ const g=ctx.createRadialGradient(xD,cy,6,xD,cy,48); g.addColorStop(0,rgba('#d9a017',0.55*glow)); g.addColorStop(1,rgba('#d9a017',0)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(xD,cy,48,0,6.3); ctx.fill(); }
    textAt(ctx,'eye',xD,cy+36,{align:'center',size:11,weight:700,color:COL.ink});
    line(ctx,xL,cy,xD-24,cy,rgba('#8195ab',0.55),1.2,[2,5]);

    /* ---- the light wave: 3-D helix of the E-vector ---- */
    function wave(x0,x1,thFn,ampFn,col,al){
      ctx.save(); ctx.globalAlpha=al; ctx.strokeStyle=rgba(col,0.55); ctx.lineWidth=1.3; ctx.beginPath();
      const pts=[];
      for(let x=x0;x<=x1;x+=3){ const th=thFn(x)*Math.PI/180, E=ampFn(x)*Math.cos(k*x-om*t), Ey=E*Math.cos(th), Ez=-E*Math.sin(th);
        const X=x-0.5*Ez, Y=cy-Ey+0.32*Ez; pts.push([X,Y]); ctx.moveTo(x,cy); ctx.lineTo(X,Y); }
      ctx.stroke(); ctx.strokeStyle=col; ctx.lineWidth=2.8; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore();
    }
    // unpolarised light: several planes, no order
    for(let j=0;j<4;j++) wave(xL+30,xP-8,()=>j*45+Math.sin(t*3+j*2)*25,()=>amp*0.45,COL.yellow,0.35);
    // polarised, vertical
    wave(xP+8,xs,()=>0,()=>amp,COL.yellow,1);
    // inside the sample: plane turns steadily (this IS the optical rotation)
    wave(xs,xe,x=>alpha*(x-xs)/Lpx,()=>amp,COL.yellow,1);
    wave(xe,xA-8,()=>alpha,()=>amp,COL.yellow,1);
    // after the analyser: only the component along β survives
    const aTrans=Math.cos((thOut-beta)*Math.PI/180);
    wave(xA+8,xD-26,()=>beta,()=>amp*Math.abs(aTrans),COL.yellow,0.5+0.5*Math.abs(aTrans));
    if(Math.abs(aTrans)<0.04) textAt(ctx,'dark — the plane is crossed with the analyser',xA,cy+amp+44,{align:'center',size:11,weight:700,color:COL.red});

    /* ---- dials (end-on views) ---- */
    const dr=Math.min(h*0.105,w*0.05), dy=h*0.76;
    dial(ctx,xP,dy,dr,0,COL.ink,'polarised plane','0°');
    dial(ctx,(xs+xe)/2+0,dy,dr,alpha,COL.blue,'plane after sample',(alpha>=0?'+':'')+fmt(alpha,1)+'°');
    dial(ctx,xA,dy,dr,beta,COL.yellow,'analyser axis',fmt(beta,0)+'°');
    textAt(ctx,'end-on, clockwise = +',xP-dr,dy-dr-12,{size:10,weight:600,color:COL.mid});
    // transmitted intensity bar
    const bx=xD-26, by=dy-dr, bh=dr*2;
    rrect(ctx,bx,by,18,bh,4); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.stroke();
    rrect(ctx,bx+2,by+bh-2-(bh-4)*glow,14,Math.max(0,(bh-4)*glow),3); ctx.fillStyle=COL.yellow; ctx.fill();
    textAt(ctx,'I = cos²',bx+9,by+bh+16,{align:'center',size:11,weight:700,color:COL.yellow});

    read('alpha',(alpha>=0?'+':'')+fmt(alpha,1)+'°',COL.blue); read('int',Math.round(glow*100)+' %',COL.yellow);
    read('mix',ach?'achiral':(nD+' : '+(nMol-nD)),COL.green); read('bal',fmt(beta-alpha,0)+'°  (dark at 90°)');
  };
}});
/* =========================================================================
   1.7  HALOARENES — nucleophilic substitution & the NO₂ effect (6.7.2)
   Chlorobenzene needs 623 K.  An –NO₂ at ortho/para spreads the negative
   charge of the intermediate onto itself and lowers the barrier
   (443 K → 368 K → 298 K); at meta it cannot, and nothing changes.
   ========================================================================= */
addAct({num:'1.7', title:'Haloarene + NO₂ Groups', desc:'Chlorobenzene → phenol. Where the –NO₂ sits decides how hot it must be.', make(ui){
  /* ring vertices: k=0 is C1 (bears Cl); 1,5 ortho; 2,4 meta; 3 para */
  const POS={o2:1,m3:2,p4:3,m5:4,o6:5};
  let nitro=new Set(), temp=300, kickReq=0, nextHit=1;
  const s={x:0,v:0}; let hold=0, fade=1, done=0, fell=0, peak=0;
  const nOP=()=>['o2','p4','o6'].filter(k=>nitro.has(k)).length;
  const Treq=()=>[623,443,368,298][nOP()];
  const Ea=()=>Treq()/62, EI=()=>Math.max(0.4,Ea()*0.55);
  const sm=x=>{ x=clamp(x,0,1); return x*x*(3-2*x); };
  const U=x=>{ const Y=[0,Ea(),EI(),EI()+0.9,-1.2]; let u;
    if(x<=0) u=60*x*x; else if(x>=2) u=-1.2+60*(x-2)*(x-2); else { const i=Math.min(3,Math.floor(x*2)), f=x*2-i; u=lerp(Y[i],Y[i+1],sm(f)); } return u; };
  const F=x=>-(U(x+1e-3)-U(x-1e-3))/2e-3;
  const read=ui.readout([{id:'need',label:'Temperature needed'},{id:'now',label:'Temperature now'},{id:'done',label:'Phenol formed'},{id:'fell',label:'Slid back'}]);
  ui.toggles('Put –NO₂ on the ring',[{k:'o2',t:'ortho 2'},{k:'m3',t:'meta 3'},{k:'p4',t:'para 4'},{k:'m5',t:'meta 5'},{k:'o6',t:'ortho 6'}],[],on=>{ nitro=new Set(on); reset(); });
  const ts=ui.slider('Temperature (K)',280,700,5,300,f=>f+' K',v=>{ temp=v; });
  ui.buttons([{t:'Room 298 K',cls:'navy',fn:()=>ts.set(298)},{t:'Heat to what is needed',cls:'hot',fn:()=>ts.set(Math.min(700,Treq()+15))}]);
  ui.hint('Needs aq. NaOH. Only 2, 4, 6 can hold the extra charge.');
  function reset(){ s.x=0; s.v=0; hold=0; fade=0; peak=0; }

  return function draw(ctx,w,h,dt,t){
    const th=temp/(62*3.5);
    nextHit-=dt;
    if(hold<=0 && nextHit<=0){ nextHit=-Math.log(Math.random())/6; s.v+=Math.sqrt(2*(-Math.log(Math.random())*th)); }
    if(hold<=0){
      langevin(s,F,0.01,1.5,dt,1);
      if(s.x>=1.0 && peak<1){ peak=1; }
      if(s.x<0.15 && peak>=1){ fell++; peak=0; }
      if(s.x>1.96){ hold=2.2; done++; peak=0; }
    } else { hold-=dt; s.x=approach(s.x,2,6,dt); if(hold<=0) reset(); }
    fade=Math.min(1,fade+dt*2.5);
    const xi=clamp(s.x,0,2);

    /* ---- geometry: tilted ring so the nucleophile can drop in from above ---- */
    const topH=h*0.6, R=Math.min(w*0.13,topH*0.52), cx=w*0.5, cy=topH*0.56, sq=0.55;
    const V=k=>{ const a=(180+60*k)*Math.PI/180; return [cx+R*Math.cos(a), cy-R*sq*Math.sin(a)]; };
    const vs=[0,1,2,3,4,5].map(V);
    ctx.save(); ctx.globalAlpha=fade;
    const inter=smooth01(0.35,1.0,xi)*(1-smooth01(1.5,1.95,xi));   // how "Meisenheimer" the ring is
    /* hexagon */
    ctx.save(); ctx.lineJoin='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=3.2; ctx.beginPath(); vs.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.stroke(); ctx.restore();
    /* aromatic circle; when the intermediate forms it opens at C1 */
    ctx.save(); ctx.strokeStyle=rgba('#132a44',0.9); ctx.lineWidth=2.4; ctx.beginPath();
    const gap=inter*1.1; ctx.ellipse(cx,cy,R*0.62,R*0.62*sq,0,Math.PI+gap*1.0,Math.PI+Math.PI*2-gap*1.0); ctx.stroke(); ctx.restore();
    /* nitro groups */
    const op=new Set(['o2','p4','o6']);
    Object.keys(POS).forEach(key=>{
      if(!nitro.has(key)) return; const p=vs[POS[key]], dx=p[0]-cx, dy=(p[1]-cy)/sq, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
      const ex=p[0]+ux*R*0.55, ey=p[1]+uy*R*0.55*sq*1.15+ (uy>0?8:-8)*0, ok=op.has(key);
      line(ctx,p[0],p[1],ex-ux*18,ey-uy*10,COL.ink,2.8);
      ctx.save(); rrect(ctx,ex-24,ey-13,48,26,7); ctx.fillStyle=ok&&inter>0.4?rgba('#1f9d55',0.18+0.2*Math.sin(t*5)):'#fff'; ctx.fill(); ctx.strokeStyle=ok?COL.green:COL.mid; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
      textAt(ctx,'NO₂',ex,ey+4,{align:'center',size:12,weight:700,color:ok?COL.green:COL.muted});
      if(inter>0.5) textAt(ctx,ok?'charge taken up ✓':'cannot help ✕',ex,ey+(uy>0?30:-20),{align:'center',size:10,weight:700,color:ok?COL.green:COL.red,alpha:inter});
    });
    /* delocalised negative charge on 2, 4, 6 (blue = the electron pair) */
    if(inter>0.05){
      [1,3,5].forEach((k,i)=>{ const p=vs[k], hasN=nitro.has(['o2','m3','p4','m5','o6'][k-1]);
        const d=0.55+0.45*Math.sin(t*4+i*2.1); const r=(7+7*d)*(hasN?1.3:1)*inter;
        circ(ctx,p[0],p[1],r,rgba('#2f8fe0',0.9*inter),rgba('#2f8fe0',0.35*inter),2);
        textAt(ctx,'−',p[0]+(p[0]<cx?-18:p[0]>cx?12:0),p[1]+(p[1]>cy?18:-10),{align:'center',size:15,weight:700,color:COL.blue,alpha:inter*0.9});
      });
    }
    /* chlorine: leaves to the left after the intermediate */
    const c1=vs[0], dCl=lerp(R*0.62,R*1.3,smooth01(1.3,1.98,xi));
    const clx=c1[0]-dCl, cly=c1[1]+Math.sin(t*3)*1.2;
    const clK=1-smooth01(1.2,1.7,xi)*1;
    if(clK>0.03) partialBond(ctx,c1[0]-3,c1[1],clx+20,cly,xi<1?1:clK,COL.red,t);
    atom(ctx,clx,cly,22,COL.red,'Cl','#fff3f0',2.8); if(xi>1.6) textAt(ctx,'−',clx+18,cly-16,{size:15,weight:700,color:COL.red});
    /* hydroxide drops from above onto C1, then settles into the ring plane (phenol) */
    const eN=smooth01(0,0.6,xi), ny=lerp(c1[1]-topH*0.32, c1[1]-R*0.62, eN), nx=lerp(c1[0]-R*0.95, c1[0], eN);
    const toPlaneX=smooth01(1.65,1.99,xi), ox=lerp(nx,c1[0]-R*0.62,toPlaneX), oy=lerp(ny,c1[1],toPlaneX);
    const nuK=smooth01(0.3,0.75,xi);
    partialBond(ctx,c1[0],c1[1]-3,ox+(c1[0]-ox)*0.0,oy+20*(1-toPlaneX),xi>0.9?1:nuK,COL.blue,t);
    if(xi<1.9){ /* Cl and the C–H are pushed out of plane while sp3: draw out-of-plane hint */ }
    atom(ctx,ox,oy,22,COL.blue,'OH','#e6f1fc',2.8); if(xi<0.5) textAt(ctx,'−',ox+18,oy-16,{size:15,weight:700,color:COL.blue});
    /* captions */
    if(xi>0.5&&xi<1.5) textAt(ctx,'intermediate: ring open at C1, negative charge on 2 · 4 · 6',cx,26,{align:'center',size:13,weight:700,color:COL.blue});
    else if(xi>1.96) textAt(ctx,'phenol + Cl⁻',cx,26,{align:'center',size:13,weight:700,color:COL.green});
    else if(xi<0.4) textAt(ctx,'OH⁻ must attack the ring carbon — it is electron-rich, so it is repelled',cx,26,{align:'center',size:12,weight:600,color:COL.muted});
    ctx.restore();

    /* ---- temperature gauge (red tick = needed) ---- */
    const gx=w*0.06, gt=h*0.1, gb=topH*0.9, ft=v=>clamp((v-280)/(700-280),0,1), gy=v=>gb-(gb-gt)*ft(v);
    ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,gx-7,gt,14,gb-gt,7); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.fillStyle=COL.red; rrect(ctx,gx-3.5,gy(temp),7,gb-gy(temp)-2,3); ctx.fill(); ctx.restore();
    [300,400,500,600,700].forEach(v=>{ line(ctx,gx+8,gy(v),gx+13,gy(v),COL.ink,1.2); textAt(ctx,v+'',gx+16,gy(v)+3,{size:9,color:COL.mid}); });
    line(ctx,gx-20,gy(Treq()),gx+8,gy(Treq()),COL.yellow,2.6,[5,3]); textAt(ctx,'needed',gx-22,gy(Treq())+3,{align:'right',size:10,weight:700,color:COL.yellow});

    /* ---- profile ---- */
    const px=w*0.12, pw=w*0.78, py=topH+20, ph=h-topH-54;
    const pp=profilePlot(ctx,px,py,pw,ph,U,-0.1,2.1,-1.8,11.5,s.x,{base:0});
    textAt(ctx,'Ar–Cl + OH⁻',pp.X(0),pp.Y(0)-30,{size:11,weight:700,color:COL.muted});
    textAt(ctx,'intermediate',pp.X(1),pp.Y(EI())-32,{size:11,weight:700,color:COL.blue,align:'center'});
    textAt(ctx,'Ar–OH + Cl⁻',pp.X(2),pp.Y(-1.2)-14,{size:11,weight:700,color:COL.green,align:'right'});
    line(ctx,pp.X(0.5),pp.Y(0),pp.X(0.5),pp.Y(Ea()),COL.red,1.6,[4,3]); textAt(ctx,'Eₐ',pp.X(0.5)+8,pp.Y(Ea()/2),{size:12,weight:700,color:COL.red});

    read('need',Treq()+' K',COL.yellow); read('now',Math.round(temp)+' K',COL.red); read('done',done+'',COL.green); read('fell',fell+'');
  };
}});
/* =========================================================================
   1.8  FREONS & THE OZONE LAYER  (Section 6.8.5)
   CFCs are inert, so they drift up to the stratosphere; UV splits off a
   chlorine atom; Cl• then destroys ozone in a catalytic chain and is
   handed back unchanged — one Cl atom, thousands of O₃.
   ========================================================================= */
addAct({num:'1.8', title:'Freons & Ozone', desc:'CFCs rise unchanged, UV frees Cl•, and one Cl• wrecks ozone again and again.', make(ui){
  let emit=0.2, uv=0.8;
  const N0=46;
  let cfcs=[], cls=[], o3=[], o2=[], photons=[], flashes=[], beams=[];
  let destroyed=0, regenAcc=0, emitAcc=0, photAcc=0, clMax=0, puff=0;
  const read=ui.readout([{id:'o3',label:'Ozone remaining'},{id:'uv',label:'UV-B reaching ground'},{id:'cl',label:'Cl• atoms at work'},{id:'kill',label:'O₃ destroyed'}]);
  const es=ui.slider('CFC released',0,1.5,0.05,0.2,f=>f.toFixed(2)+' /s',v=>{ emit=v; });
  ui.slider('Sunlight (UV) intensity',0.2,1,0.05,0.8,f=>Math.round(f*100)+' %',v=>{ uv=v; });
  ui.buttons([{t:'Puff of CFC',cls:'hot',fn:()=>{ puff+=8; }},{t:'Ban CFCs',cls:'play',fn:()=>es.set(0)},{t:'Reset sky',cls:'navy',fn:()=>reset()}]);
  ui.hint('Cl• is never used up — it is handed back every cycle.');
  function reset(){ cfcs=[]; cls=[]; o3=[]; o2=[]; photons=[]; flashes=[]; beams=[]; destroyed=0; clMax=0; seeded=false; }
  let seeded=false;

  return function draw(ctx,w,h,dt,t){
    const gY=h*0.9, bT=h*0.3, bB=h*0.5, bM=(bT+bB)/2, sun=[w*0.09,h*0.1];
    if(!seeded){ for(let i=0;i<N0;i++) o3.push({x:w*0.04+Math.random()*w*0.84,y:bT+8+Math.random()*(bB-bT-16),vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*5,a:Math.random()*6.28,l:1,dying:false}); seeded=true; }
    const nO3=o3.filter(o=>!o.dying).length, frac=nO3/N0;
    /* ---- sources ---- */
    emitAcc+=emit*dt+(puff>0?Math.min(puff,dt*8):0); if(puff>0) puff=Math.max(0,puff-dt*8);
    while(emitAcc>=1){ emitAcc-=1; cfcs.push({x:w*0.5+(Math.random()-0.5)*40,y:gY-30,vx:(Math.random()-0.5)*12,vy:-(h*0.07+Math.random()*h*0.02),a:Math.random()*6.28,ph:Math.random()*6}); }
    photAcc+=uv*3.2*dt; while(photAcc>=1){ photAcc-=1; const tx=w*0.18+Math.random()*w*0.62, dx=tx-sun[0], dy=gY-sun[1], L=Math.hypot(dx,dy); photons.push({x:sun[0]+Math.random()*10,y:sun[1]+Math.random()*10,ux:dx/L,uy:dy/L,sp:300,done:false,passed:false}); }
    regenAcc+=dt*3.0*uv*(1-frac); while(regenAcc>=1){ regenAcc-=1; if(nO3<N0) o3.push({x:w*0.04+Math.random()*w*0.84,y:bT+8+Math.random()*(bB-bT-16),vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*5,a:Math.random()*6.28,l:0,dying:false}); }

    /* ---- sky backdrop (line diagram) ---- */
    ctx.save(); ctx.fillStyle=rgba('#1f9d55',0.07+0.06*frac); ctx.fillRect(0,bT,w,bB-bT); ctx.restore();
    line(ctx,0,bT,w,bT,rgba('#1f9d55',0.6),1.6,[8,6]); line(ctx,0,bB,w,bB,rgba('#1f9d55',0.6),1.6,[8,6]);
    textAt(ctx,'ozone layer',w*0.5,bT-8,{align:'center',size:12,weight:700,color:COL.green});
    textAt(ctx,'stratosphere',w*0.02,h*0.22,{size:11,weight:700,color:COL.mid}); textAt(ctx,'troposphere',w*0.02,h*0.7,{size:11,weight:700,color:COL.mid});
    line(ctx,0,gY,w,gY,COL.ink,3);
    for(let i=0;i<30;i++){ const x=i*w/29; line(ctx,x,gY,x-8,gY+10,COL.mid,1.4); }
    /* sun */
    circ(ctx,sun[0],sun[1],22,COL.yellow,'#fff3cc',2.8); for(let i=0;i<12;i++){ const a=i*Math.PI/6+t*0.3; line(ctx,sun[0]+Math.cos(a)*29,sun[1]+Math.sin(a)*29,sun[0]+Math.cos(a)*37,sun[1]+Math.sin(a)*37,COL.yellow,2.2); }
    /* aerosol can + fridge on the ground */
    const ex=w*0.5; ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.fillStyle='#fff';
    rrect(ctx,ex-60,gY-62,34,62,4); ctx.fill(); ctx.stroke(); line(ctx,ex-60,gY-38,ex-26,gY-38,COL.ink,2); circ(ctx,ex-52,gY-30,2.6,COL.ink,COL.ink,1);
    rrect(ctx,ex-8,gY-44,16,44,4); ctx.fill(); ctx.stroke(); rrect(ctx,ex-8,gY-52,16,8,2); ctx.fill(); ctx.stroke(); line(ctx,ex+4,gY-52,ex+12,gY-56,COL.ink,2);
    rrect(ctx,ex+30,gY-70,36,70,4); ctx.fill(); ctx.stroke(); line(ctx,ex+30,gY-42,ex+66,gY-42,COL.ink,2); ctx.restore();
    textAt(ctx,'CCl₂F₂',ex+4,gY+24,{align:'center',size:11,weight:700,color:COL.red});

    /* ---- photons (yellow): absorbed by ozone, or reach the ground ---- */
    for(let i=photons.length-1;i>=0;i--){ const p=photons[i];
      const ny=p.y+p.uy*p.sp*dt;
      if(!p.passed && p.y<bM && ny>=bM){ p.passed=true; if(Math.random()<0.93*frac){ flashes.push({x:p.x,y:bM,l:1,c:COL.green,r:16}); photons.splice(i,1); continue; } }
      p.x+=p.ux*p.sp*dt; p.y=ny;
      if(p.y>=gY){ flashes.push({x:p.x,y:gY,l:1,c:COL.red,r:12}); photons.splice(i,1); continue; }
      line(ctx,p.x,p.y,p.x-p.ux*16,p.y-p.uy*16,COL.yellow,2.6);
    }
    /* ---- CFC molecules: rise, photolyse once in the stratosphere ---- */
    for(let i=cfcs.length-1;i>=0;i--){ const c=cfcs[i];
      c.x+=c.vx*dt+Math.sin(t*1.3+c.ph)*6*dt; c.y+=c.vy*dt; c.a+=dt*1.2;
      if(c.y<bB-4 && Math.random()<(0.55*uv)*dt){
        beams.push({x1:sun[0],y1:sun[1],x2:c.x,y2:c.y,l:1});
        flashes.push({x:c.x,y:c.y,l:1,c:COL.red,r:20});
        cls.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*20,state:'free',tm:0,life:25,target:null,ClOt:0});
        o2.push({x:c.x+8,y:c.y-6,vx:30,vy:-18,l:1,frag:true}); cfcs.splice(i,1); continue; }
      if(c.y<-20){ cfcs.splice(i,1); continue; }
      /* molecule: C, 2 Cl (red), 2 F (grey) */
      ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.a);
      [[-1,-1,COL.red,5.5],[1,-1,COL.red,5.5],[-1,1,COL.mid,3.6],[1,1,COL.mid,3.6]].forEach(([a,b,col,r])=>{ line(ctx,0,0,a*7,b*7,COL.ink,1.4); circ(ctx,a*7,b*7,r,col,'#fff',1.6); });
      circ(ctx,0,0,2.6,COL.ink,COL.ink,1); ctx.restore();
    }
    /* ---- ozone: drift, absorb the catalytic chain ---- */
    o3.forEach(o=>{ if(o.dying){ o.l-=dt*2.4; } else o.l=Math.min(1,o.l+dt*1.5);
      o.vx+=(Math.random()-0.5)*14*dt; o.vy+=(Math.random()-0.5)*10*dt; o.vx=clamp(o.vx,-12,12); o.vy=clamp(o.vy,-8,8);
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.a+=dt*0.4;
      if(o.x<8||o.x>w*0.88) o.vx*=-1; if(o.y<bT+6||o.y>bB-6) o.vy*=-1; });
    o3=o3.filter(o=>o.l>0);
    /* ---- chlorine radicals: the catalytic cycle ---- */
    for(let i=cls.length-1;i>=0;i--){ const c=cls[i]; c.life-=dt;
      if(c.life<=0||c.y<-30){ cls.splice(i,1); continue; }
      if(c.state==='free'){
        let tgt=c.target&&!c.target.dying&&o3.includes(c.target)?c.target:null;
        if(!tgt){ let best=1e9; o3.forEach(o=>{ if(o.dying) return; const d=Math.hypot(o.x-c.x,o.y-c.y); if(d<best){best=d; tgt=o;} }); c.target=tgt; }
        if(tgt){ const dx=tgt.x-c.x, dy=tgt.y-c.y, d=Math.hypot(dx,dy)||1; const sp=55; c.vx=approach(c.vx,dx/d*sp,4,dt); c.vy=approach(c.vy,dy/d*sp,4,dt);
          if(d<14){ tgt.dying=true; destroyed++; c.state='ClO'; c.tm=0.9+Math.random()*0.8; c.target=null; flashes.push({x:tgt.x,y:tgt.y,l:1,c:COL.red,r:22});
            o2.push({x:tgt.x,y:tgt.y,vx:(Math.random()-0.5)*50,vy:-30-Math.random()*20,l:1}); } }
        else { c.vx+=(Math.random()-0.5)*40*dt; c.vy+=(Math.random()-0.5)*30*dt; }
      } else { c.tm-=dt; c.vx*=0.97; c.vy*=0.97; c.vx+=(Math.random()-0.5)*30*dt; c.vy+=(Math.random()-0.5)*20*dt;
        if(c.tm<=0){ c.state='free'; flashes.push({x:c.x,y:c.y,l:1,c:COL.green,r:16}); o2.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*50,vy:-26,l:1}); } }
      c.x+=c.vx*dt; c.y+=c.vy*dt; c.y=clamp(c.y,bT-6,bB+6); c.x=clamp(c.x,6,w*0.88);
    }
    clMax=Math.max(clMax,cls.length);

    /* ---- draw ozone, O₂, radicals ---- */
    o3.forEach(o=>{ ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.a); ctx.globalAlpha=clamp(o.l,0,1);
      line(ctx,0,0,-7,6,COL.blue,1.8); line(ctx,0,0,7,6,COL.blue,1.8); circ(ctx,0,0,4.6,COL.blue,'#e6f1fc',2); circ(ctx,-7,6,4,COL.blue,'#e6f1fc',2); circ(ctx,7,6,4,COL.blue,'#e6f1fc',2); ctx.restore(); });
    for(let i=o2.length-1;i>=0;i--){ const m=o2[i]; m.x+=m.vx*dt; m.y+=m.vy*dt; m.l-=dt*(m.frag?0.4:0.5); if(m.l<=0){ o2.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha=clamp(m.l,0,1); if(m.frag){ circ(ctx,m.x,m.y,5,COL.mid,'#fff',1.6); textAt(ctx,'•CClF₂',m.x+8,m.y-6,{size:9,weight:600,color:COL.mid}); } else { line(ctx,m.x-3.5,m.y,m.x+3.5,m.y,COL.blue,1.6); circ(ctx,m.x-3.5,m.y,3.4,COL.blue,'#fff',1.6); circ(ctx,m.x+3.5,m.y,3.4,COL.blue,'#fff',1.6); } ctx.restore(); }
    cls.forEach(c=>{ circ(ctx,c.x,c.y,7.5,COL.red,'#fff3f0',2.4); circ(ctx,c.x+9.5*0,c.y,1.8,COL.red,COL.red,1);
      if(c.state==='ClO'){ line(ctx,c.x,c.y,c.x+9,c.y+6,COL.blue,1.8); circ(ctx,c.x+9,c.y+6,4.4,COL.blue,'#e6f1fc',2); } });
    beams.forEach(b=>{ b.l-=dt*3; if(b.l>0) line(ctx,b.x1,b.y1,b.x2,b.y2,rgba('#d9a017',b.l*0.7),2.2,[6,5]); }); beams=beams.filter(b=>b.l>0);
    flashes.forEach(f=>{ f.l-=dt*2.2; if(f.l>0) circ(ctx,f.x,f.y,f.r*(1.4-f.l*0.6),rgba(f.c,f.l),null,2.2); }); flashes=flashes.filter(f=>f.l>0);

    /* ---- UV at ground meter (blue = measured) ---- */
    const survive=clamp(1-0.9*frac,0,1), uvShown=survive*uv;
    const mx=w*0.93, mt=h*0.12, mb=gY-8;
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; rrect(ctx,mx-11,mt,22,mb-mt,6); ctx.stroke(); ctx.restore();
    const fh=(mb-mt-4)*clamp(uvShown,0,1); rrect(ctx,mx-8,mb-2-fh,16,Math.max(2,fh),4); ctx.fillStyle=mixCol('#2f8fe0','#d9432b',clamp(uvShown*1.1,0,1)); ctx.fill();
    textAt(ctx,'UV at ground',mx,mt-8,{align:'center',size:11,weight:700,color:COL.blue});
    line(ctx,mx-16,mb-2-(mb-mt-4)*0.18*uv,mx+16,mb-2-(mb-mt-4)*0.18*uv,COL.green,2,[4,3]); textAt(ctx,'healthy',mx-18,mb-4-(mb-mt-4)*0.18*uv,{align:'right',size:9,weight:700,color:COL.green});

    read('o3',Math.round(frac*100)+' %',frac<0.7?COL.red:COL.green); read('uv',Math.round(survive*100)+' % of incoming',COL.blue); read('cl',cls.length+'',COL.red); read('kill',destroyed+(cls.length?'  ('+fmt(destroyed/Math.max(1,clMax),0)+' per Cl•)':''));
  };
}});

boot();
