<script>
/* =========================================================================
   CLASS 12 — CHAPTER 1: RELATIONS AND FUNCTIONS
   Every activity runs a continuous animation loop. Controls only set a
   TARGET; the drawn arrows, tokens, curves and lines ease or spring toward
   it every frame — nothing ever jumps. Line diagrams only.
   Red = missing / clash · Blue = the relation or f · Green = holds / onto
   Yellow = what you change / the test.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab', grid:'#e6edf5', navy:'#1a3a5c'};
const PAL = [COL.red, COL.blue, COL.green, COL.yellow, COL.navy];

/* ---------------- canvas + drawing helpers ---------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash,off){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.lineCap='round';
  ctx.setLineDash(dash||[]); if(off) ctx.lineDashOffset=off;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||8; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function textAt(ctx,txt,x,y,o){
  o=o||{}; ctx.save();
  ctx.font=(o.weight||500)+' '+(o.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=o.color||COL.ink; ctx.textAlign=o.align||'left'; ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!==undefined) ctx.globalAlpha=o.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function circ(ctx,x,y,r,stroke,fill,lw,dash){
  ctx.save(); ctx.lineWidth=lw||2.2; ctx.setLineDash(dash||[]); ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2);
  if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.stroke();} ctx.restore();
}
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function pill(ctx,x,y,txt,color,size){
  size=size||13; ctx.save(); ctx.font='700 '+size+'px Poppins, sans-serif'; const tw=ctx.measureText(txt).width; ctx.restore();
  ctx.save(); rrect(ctx,x-tw/2-12,y-size*0.95,tw+24,size*1.9,size); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
  textAt(ctx,txt,x,y+size*0.36,{align:'center',size:size,weight:700,color:color});
}
function node(ctx,x,y,r,label,stroke,fill,lw,size){
  size=size||Math.max(12,r*0.78);
  circ(ctx,x,y,r,stroke,fill||'#fff',lw||2.4);
  textAt(ctx,label,x,y+size*0.36,{align:'center',size:size,weight:700,color:COL.ink});
}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; const s=Number(x.toFixed(d)).toString(); return s==='-0'?'0':s.replace('-','−'); }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function alphaCol(hex,a){ const c=hexRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

/* quadratic edge: from node P to node Q, bent sideways so reverse arrows separate */
function qpt(a,c,b,t){const u=1-t; return [u*u*a[0]+2*u*t*c[0]+t*t*b[0], u*u*a[1]+2*u*t*c[1]+t*t*b[1]];}
function edge(P,Q,r,bend){
  const dx=Q[0]-P[0], dy=Q[1]-P[1], d=Math.hypot(dx,dy)||1, nx=-dy/d, ny=dx/d;
  const c=[(P[0]+Q[0])/2+nx*d*bend, (P[1]+Q[1])/2+ny*d*bend];
  const ua=Math.hypot(c[0]-P[0],c[1]-P[1])||1, ub=Math.hypot(c[0]-Q[0],c[1]-Q[1])||1;
  return {a:[P[0]+(c[0]-P[0])/ua*r, P[1]+(c[1]-P[1])/ua*r], c, b:[Q[0]+(c[0]-Q[0])/ub*(r+3), Q[1]+(c[1]-Q[1])/ub*(r+3)]};
}
function drawEdge(ctx,e,g,color,lw,dash,off){
  if(g<=0.01) return;
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.setLineDash(dash||[]); if(off) ctx.lineDashOffset=off;
  ctx.beginPath(); const N=30; for(let i=0;i<=N;i++){ const p=qpt(e.a,e.c,e.b,g*i/N); if(i) ctx.lineTo(p[0],p[1]); else ctx.moveTo(p[0],p[1]); }
  ctx.stroke(); ctx.restore();
  const p2=qpt(e.a,e.c,e.b,g), p1=qpt(e.a,e.c,e.b,Math.max(0,g-0.05));
  arrowHead(ctx,p2[0],p2[1],Math.atan2(p2[1]-p1[1],p2[0]-p1[0]),color,lw*3.4);
}
function drawLoop(ctx,P,out,r,g,color,lw,dash){
  if(g<=0.01) return;
  const lr=r*0.78, cx=P[0]+Math.cos(out)*(r+lr*0.72), cy=P[1]+Math.sin(out)*(r+lr*0.72);
  const a0=out+Math.PI+0.95, tot=(Math.PI*2-1.9)*g;
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.arc(cx,cy,lr,a0,a0+tot); ctx.stroke(); ctx.restore();
  const ea=a0+tot; arrowHead(ctx,cx+Math.cos(ea)*lr,cy+Math.sin(ea)*lr,ea+Math.PI/2,color,lw*3.4);
}

/* ---------------- animation engine ---------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now(), raf, T=0;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000)); last = now; T+=dt;
    tick(dt,T); raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf); activeStops.push(stop); return stop;
}
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
function springTo(s,target,k,damp,dt){ const sub=Math.ceil(dt/0.008); const h=dt/sub; for(let i=0;i<sub;i++){ s.v += ((target-s.x)*k - s.v*damp)*h; s.x += s.v*h; } return s.x; }
function toggleWire(btns,cb){ btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); }); }

/* ---------------- UI helpers ---------------- */
function labShell(){ const wrap=document.createElement('div'); wrap.className='lab-view'; wrap.innerHTML=`<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`; return wrap; }
function slider(id,label,min,max,step,val){ return `<div class="control-group"><label>${label}<span class="val" id="${id}V"></span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`; }
function rc(id,label,cls){ return `<div class="rcard ${cls||''}"><div class="rlabel">${label}</div><div class="rval" id="${id}">—</div></div>`; }
function setV(el,ok,yes,no){ el.textContent=ok?yes:no; el.className='rval '+(ok?'ok':'bad'); }
function optList(items,active){ return items.map((t,i)=>`<button class="opt-btn${i===active?' active':''}" data-i="${i}">${t}</button>`).join(''); }

/* =====================================================================
   1.1  RELATION = A SUBSET OF A × B          (Section 1.1, Example 1)
   ===================================================================== */
function buildA1(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const RULES=[
    {t:'b = a + 1',f:(a,b)=>b===a+1},
    {t:'a < b',f:(a,b)=>a<b},
    {t:'a + b is even',f:(a,b)=>(a+b)%2===0},
    {t:'a − b = 10  (empty)',f:(a,b)=>a-b===10},
    {t:'|a − b| ≥ 0  (universal)',f:()=>true}];
  side.innerHTML=`<div class="control-group"><label>Rule for R</label><div id="rl">${optList(RULES.map(r=>r.t),0)}</div></div>
    ${slider('nR','Elements in A and B',2,5,1,4)}
    <div class="control-group"><div class="result-cards three">${rc('c1','|R|')}${rc('c2','|A × B|')}${rc('c3','R is')}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let n=4, rule=0, cyc=0; const grow={};
  $('#nRV').textContent=' 4';
  $('#nR').oninput=e=>{ n=+e.target.value; $('#nRV').textContent=' '+n; };
  toggleWire(wrap.querySelectorAll('#rl .opt-btn'),b=>rule=+b.dataset.i);
  animLoop((dt,T)=>{
    const {ctx,w,h}=fitCanvas(canvas), fs=clamp(w/55,12,17);
    const R=RULES[rule].f, pairs=[];
    for(let a=1;a<=5;a++) for(let b=1;b<=5;b++){
      const k=a+'-'+b, on=(a<=n&&b<=n&&R(a,b)); grow[k]=approach(grow[k]||0,on?1:0,6,dt);
      if(on) pairs.push([a,b]);
    }
    cyc+=dt/0.75; const act=pairs.length?pairs[Math.floor(cyc)%pairs.length]:null;
    // arrow diagram
    const Lw=w*0.5, xA=Lw*0.2, xB=Lw*0.8, top=h*0.16, avail=h*0.7, step=avail/n, r=Math.min(22,step*0.34);
    const yy=i=>top+(i-0.5)*step;
    textAt(ctx,'A',xA,h*0.09,{align:'center',size:fs+3,weight:700}); textAt(ctx,'B',xB,h*0.09,{align:'center',size:fs+3,weight:700});
    for(let a=1;a<=n;a++) for(let b=1;b<=n;b++){
      const g=grow[a+'-'+b]; if(g<0.02) continue;
      const isAct=act&&act[0]===a&&act[1]===b, col=isAct?COL.yellow:COL.blue;
      const x1=xA+r, y1=yy(a), x2=xB-r-3, y2=yy(b), ex=lerp(x1,x2,g), ey=lerp(y1,y2,g);
      line(ctx,x1,y1,ex,ey,col,isAct?4:2.4);
      arrowHead(ctx,ex,ey,Math.atan2(y2-y1,x2-x1),col,isAct?13:10);
    }
    for(let i=1;i<=n;i++){ node(ctx,xA,yy(i),r,''+i,COL.ink,'#fff',2.2); node(ctx,xB,yy(i),r,''+i,COL.ink,'#fff',2.2); }
    // A × B grid
    const gs=Math.min(w*0.4/n,h*0.66/n), gx0=w*0.58, gy0=h*0.16+n*gs;
    textAt(ctx,'A × B',gx0+n*gs/2,h*0.09,{align:'center',size:fs+3,weight:700});
    for(let a=1;a<=n;a++) for(let b=1;b<=n;b++){
      const x=gx0+(a-1)*gs, y=gy0-b*gs, g=grow[a+'-'+b], isAct=act&&act[0]===a&&act[1]===b;
      ctx.save(); ctx.strokeStyle=COL.grid; ctx.lineWidth=1.4; ctx.strokeRect(x,y,gs,gs); ctx.restore();
      if(g>0.02){ ctx.save(); ctx.fillStyle=alphaCol(isAct?COL.yellow:COL.blue,0.16*g+(isAct?0.18:0)); ctx.fillRect(x,y,gs,gs); ctx.restore();
        circ(ctx,x+gs/2,y+gs/2,gs*0.2*g*(isAct?1.25:1),isAct?COL.yellow:COL.blue,isAct?COL.yellow:COL.blue,1); }
      else circ(ctx,x+gs/2,y+gs/2,2,COL.mid,COL.mid,1);
    }
    for(let i=1;i<=n;i++){ textAt(ctx,''+i,gx0+(i-1)*gs+gs/2,gy0+fs+4,{align:'center',size:fs,weight:600,color:COL.muted}); textAt(ctx,''+i,gx0-8,gy0-(i-1)*gs-gs/2+fs*0.35,{align:'right',size:fs,weight:600,color:COL.muted}); }
    textAt(ctx,'a →',gx0+n*gs,gy0+fs*2.2,{align:'right',size:fs,weight:700,color:COL.muted}); textAt(ctx,'b ↑',gx0-8,gy0-n*gs-8,{align:'right',size:fs,weight:700,color:COL.muted});
    const cnt=pairs.length, tot=n*n, kind=cnt===0?'∅':cnt===tot?'A × B':'⊂ A × B', kc=cnt===0?COL.red:cnt===tot?COL.green:COL.blue;
    pill(ctx,w*0.5,h*0.95,'R = '+(cnt===0?'∅  (empty relation)':cnt===tot?'A × B  (universal relation)':'a subset of A × B'),kc,fs);
    $('#c1').textContent=cnt; $('#c2').textContent=tot; const c3=$('#c3'); c3.textContent=cnt===0?'Empty':cnt===tot?'Universal':'Neither'; c3.style.color=kc;
  });
  return wrap;
}

/* =====================================================================
   1.2  REFLEXIVE · SYMMETRIC · TRANSITIVE   (Definition 3–4, Examples 3, 4)
   ===================================================================== */
function buildA2(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side'), N=4;
  const pr=l=>l.map(s=>[+s[0]-1,+s[1]-1]);
  const PRE=[
    {t:'Reflexive only  (Ex 4)',p:pr(['11','22','33','44','12','23'])},
    {t:'Symmetric only  (Ex 1.1 Q6)',p:pr(['12','21'])},
    {t:'Reflexive + transitive  (Q15)',p:pr(['12','22','11','44','13','33','32'])},
    {t:'Same parity  (Ex 6)',p:(()=>{const o=[];for(let a=1;a<=4;a++)for(let b=1;b<=4;b++)if((a-b)%2===0)o.push([a-1,b-1]);return o;})()},
    {t:'Empty relation',p:[]}];
  let mxh='<div class="h"></div>'+[1,2,3,4].map(i=>`<div class="h">${i}</div>`).join('');
  for(let a=0;a<N;a++){ mxh+=`<div class="h">${a+1}</div>`; for(let b=0;b<N;b++) mxh+=`<button class="toggle-btn small" data-a="${a}" data-b="${b}"></button>`; }
  side.innerHTML=`<div class="control-group"><label>Start from</label><div id="pl">${optList(PRE.map(p=>p.t),0)}</div></div>
    <div class="control-group"><label>Pairs (a, b) in R</label><div class="mx" style="grid-template-columns:22px repeat(4,1fr)">${mxh}</div>
      <div class="toggle-group"><button class="toggle-btn navy" id="fix">Add a missing link</button><button class="toggle-btn" id="clr">Clear</button></div></div>
    <div class="control-group"><label>Highlight</label><div class="toggle-group" id="fc"><button class="toggle-btn small active" data-f="all">All</button><button class="toggle-btn small" data-f="r">Reflexive</button><button class="toggle-btn small" data-f="s">Symmetric</button><button class="toggle-btn small" data-f="t">Transitive</button></div></div>
    <div class="control-group"><div class="result-cards three">${rc('vr','Reflexive')}${rc('vs','Symmetric')}${rc('vt','Transitive')}${rc('ve','Equivalence relation','wide')}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), mbtn=[...wrap.querySelectorAll('.mx .toggle-btn')];
  const M=[...Array(N)].map(()=>Array(N).fill(false)), G=[...Array(N)].map(()=>Array(N).fill(0));
  let focus='all';
  const sync=()=>mbtn.forEach(b=>{ const on=M[+b.dataset.a][+b.dataset.b]; b.classList.toggle('active',on); b.textContent=on?'●':''; });
  const load=p=>{ for(let i=0;i<N;i++)for(let j=0;j<N;j++)M[i][j]=false; p.forEach(([a,b])=>M[a][b]=true); sync(); };
  load(PRE[0].p);
  toggleWire(wrap.querySelectorAll('#pl .opt-btn'),b=>load(PRE[+b.dataset.i].p));
  toggleWire(wrap.querySelectorAll('#fc .toggle-btn'),b=>focus=b.dataset.f);
  mbtn.forEach(b=>b.onclick=()=>{ M[+b.dataset.a][+b.dataset.b]^=1; sync(); wrap.querySelectorAll('#pl .opt-btn').forEach(x=>x.classList.remove('active')); });
  $('#clr').onclick=()=>load([]);
  function analyse(){
    const mr=[], ms=[], mt=[];
    for(let i=0;i<N;i++) if(!M[i][i]) mr.push([i]);
    for(let i=0;i<N;i++)for(let j=0;j<N;j++) if(i!==j&&M[i][j]&&!M[j][i]) ms.push([j,i]);
    const seen={};
    for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(M[i][j])for(let k=0;k<N;k++)if(M[j][k]&&!M[i][k]&&!seen[i+'-'+k]){ seen[i+'-'+k]=1; mt.push([i,k,j]); }
    return {mr,ms,mt};
  }
  $('#fix').onclick=()=>{ const A=analyse();
    const order=focus==='r'?['mr']:focus==='s'?['ms']:focus==='t'?['mt']:['mr','ms','mt'];
    for(const k of order){ if(A[k].length){ const m=A[k][0]; if(k==='mr') M[m[0]][m[0]]=true; else M[m[0]][m[1]]=true; break; } }
    sync(); };
  animLoop((dt,T)=>{
    const {ctx,w,h}=fitCanvas(canvas), fs=clamp(w/55,12,17), A=analyse();
    const cx=w*0.5, cy=h*0.5, Rr=Math.min(w*0.3,h*0.34), nr=clamp(Math.min(w,h)*0.058,20,34);
    const P=[...Array(N)].map((_,i)=>[cx+Math.cos(-Math.PI/2+i*Math.PI/2)*Rr, cy+Math.sin(-Math.PI/2+i*Math.PI/2)*Rr]);
    const out=i=>-Math.PI/2+i*Math.PI/2;
    const isEq=!A.mr.length&&!A.ms.length&&!A.mt.length;
    // equivalence classes fill
    const cls=Array(N).fill(-1); let nc=0;
    if(isEq) for(let i=0;i<N;i++) if(cls[i]<0){ for(let j=0;j<N;j++) if(M[i][j]) cls[j]=nc; nc++; }
    const show=k=>focus==='all'||focus===k, pul=0.55+0.45*Math.sin(T*6), off=-T*26;
    // ghost (missing) links
    if(show('r')) A.mr.forEach(([i])=>drawLoop(ctx,P[i],out(i),nr,1,alphaCol(COL.red,pul),2.6,[6,5]));
    if(show('s')) A.ms.forEach(([i,j])=>{ const e=edge(P[i],P[j],nr,0.18); drawEdge(ctx,e,1,alphaCol(COL.red,pul),2.6,[6,5],off); });
    if(show('t')) A.mt.forEach(([i,k,j])=>{
      if(i===k){ drawLoop(ctx,P[i],out(i),nr,1,alphaCol(COL.yellow,pul),2.6,[6,5]); }
      else { const e=edge(P[i],P[k],nr,0.18); drawEdge(ctx,e,1,alphaCol(COL.yellow,pul),2.6,[6,5],off); }
      // travelling witness  i → j → k
      const f=(T*0.55+i*0.13)%1, ea=edge(P[i],P[j],nr,0.18), eb=edge(P[j],P[k],nr,0.18);
      const q=f<0.5?qpt(ea.a,ea.c,ea.b,f*2):qpt(eb.a,eb.c,eb.b,(f-0.5)*2);
      if(i!==j&&j!==k) circ(ctx,q[0],q[1],5,COL.yellow,COL.yellow,1);
    });
    // real links
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      G[i][j]=approach(G[i][j],M[i][j]?1:0,7,dt);
      if(G[i][j]<0.02) continue;
      if(i===j) drawLoop(ctx,P[i],out(i),nr,G[i][j],COL.blue,2.8);
      else { const e=edge(P[i],P[j],nr,0.18); drawEdge(ctx,e,G[i][j],COL.blue,2.8);
        if(G[i][j]>0.95){ const q=qpt(e.a,e.c,e.b,(T*0.5+i*0.21+j*0.1)%1); circ(ctx,q[0],q[1],3,COL.blue,'#fff',1.6); } }
    }
    for(let i=0;i<N;i++){
      const c=isEq?PAL[cls[i]%4]:COL.ink; node(ctx,P[i][0],P[i][1],nr,''+(i+1),c,isEq?alphaCol(c,0.14):'#fff',isEq?3.6:2.6);
    }
    textAt(ctx,'A = {1, 2, 3, 4}',16,fs+8,{size:fs+1,weight:700,color:COL.muted});
    // legend
    const ly=h-16; line(ctx,16,ly,46,ly,COL.blue,3); textAt(ctx,'in R',54,ly+4,{size:fs-1,color:COL.muted});
    line(ctx,100,ly,130,ly,COL.red,3,[6,4]); textAt(ctx,'missing',138,ly+4,{size:fs-1,color:COL.muted});
    line(ctx,210,ly,240,ly,COL.yellow,3,[6,4]); textAt(ctx,'forced by transitivity',248,ly+4,{size:fs-1,color:COL.muted});
    if(isEq) pill(ctx,cx,h*0.93,'Equivalence relation — A splits into '+nc+' class'+(nc>1?'es':''),COL.green,fs);
    const rv=A.mr.length===0, sv=A.ms.length===0, tv=A.mt.length===0;
    setV($('#vr'),rv,'✓ Yes','✗ No'); setV($('#vs'),sv,'✓ Yes','✗ No'); setV($('#vt'),tv,'✓ Yes','✗ No'); setV($('#ve'),isEq,'✓ Equivalence relation','✗ Not an equivalence relation');
  });
  return wrap;
}

/* =====================================================================
   1.3  EQUIVALENCE CLASSES — "n divides a − b" on Z   (Example 5, 6)
   ===================================================================== */
function buildA3(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  side.innerHTML=`${slider('mR','Divisor n',2,5,1,3)}${slider('aR','Pick an integer a',-6,6,1,1)}
    <div class="control-group"><label>View</label><div class="toggle-group" id="vw"><button class="toggle-btn active" data-v="0">Number line</button><button class="toggle-btn" data-v="1">Sort into classes</button></div></div>
    <div class="control-group"><div class="result-cards">${rc('k1','Class of a','wide')}${rc('k2','Number of classes')}${rc('k3','Classes overlap?')}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let n=3, a=1, mode=0;
  const vals=[]; for(let v=-6;v<=6;v++) vals.push(v);
  const tk=vals.map((v,i)=>({v,x:0,y:0,p:0,init:false,rate:3+(i%5)*0.7}));
  const upd=()=>{ $('#mRV').textContent=' '+n; $('#aRV').textContent=' '+fmt(a,0); };
  $('#mR').oninput=e=>{ n=+e.target.value; upd(); }; $('#aR').oninput=e=>{ a=+e.target.value; upd(); }; upd();
  toggleWire(wrap.querySelectorAll('#vw .toggle-btn'),b=>mode=+b.dataset.v);
  const cl=v=>((v%n)+n)%n;
  animLoop((dt,T)=>{
    const {ctx,w,h}=fitCanvas(canvas), fs=clamp(w/55,12,17);
    const tok=clamp(Math.min(w/17,h/11),22,36), pad=w*0.05, lineY=h*0.7;
    const bw=(w-2*pad-(n-1)*12)/n, bTop=h*0.2, cols=Math.max(1,Math.floor(bw/(tok+8)));
    const members=[...Array(n)].map((_,r)=>vals.filter(v=>cl(v)===r));
    const bH=Math.min(h*0.66,tok*1.2+Math.ceil(Math.max(...members.map(m=>m.length))/cols)*(tok+10)+10);
    const gAll=tk.reduce((s,t)=>s+t.p,0)/tk.length;
    // class bins
    if(gAll>0.02) for(let r=0;r<n;r++){
      const bx=pad+r*(bw+12), sel=cl(a)===r, c=PAL[r];
      ctx.save(); ctx.globalAlpha=clamp(gAll*1.4,0,1); rrect(ctx,bx,bTop,bw,bH,16); ctx.fillStyle=alphaCol(c,sel?0.12:0.05); ctx.fill(); ctx.strokeStyle=c; ctx.lineWidth=sel?3.4:1.6; ctx.setLineDash(sel?[]:[7,5]); ctx.stroke(); ctx.restore();
      textAt(ctx,'['+r+']',bx+bw/2,bTop-10,{align:'center',size:fs+2,weight:700,color:c,alpha:clamp(gAll*1.4,0,1)});
    }
    // number line + arcs
    const lp=1-gAll;
    if(lp>0.02){
      line(ctx,pad*0.6,lineY+tok*0.7,w-pad*0.6,lineY+tok*0.7,alphaCol(COL.ink,0.5*lp),2);
      textAt(ctx,'… −7',pad*0.6,lineY+tok*0.7+fs+6,{size:fs-2,color:COL.mid,alpha:lp}); textAt(ctx,'7 …',w-pad*0.6,lineY+tok*0.7+fs+6,{align:'right',size:fs-2,color:COL.mid,alpha:lp});
      const xs=v=>pad+(v+6)/12*(w-2*pad);
      vals.forEach(v=>{ if(v!==a&&cl(v)===cl(a)){
        const x1=xs(a),x2=xs(v), hgt=Math.min(h*0.5,Math.abs(x2-x1)*0.45+10);
        ctx.save(); ctx.globalAlpha=lp; ctx.strokeStyle=PAL[cl(a)]; ctx.lineWidth=2.4; ctx.setLineDash([7,5]); ctx.lineDashOffset=-T*24;
        ctx.beginPath(); ctx.moveTo(x1,lineY-tok/2); ctx.quadraticCurveTo((x1+x2)/2,lineY-tok/2-hgt*2,x2,lineY-tok/2); ctx.stroke(); ctx.restore(); } });
      textAt(ctx,'a − b is a multiple of '+n,w/2,h*0.1,{align:'center',size:fs+1,weight:600,color:COL.muted,alpha:lp});
    }
    // tokens
    tk.forEach((t,i)=>{
      t.p=approach(t.p,mode,t.rate,dt);
      const lx=pad+(t.v+6)/12*(w-2*pad), ly=lineY;
      const r=cl(t.v), k=members[r].indexOf(t.v), cu=Math.min(cols,members[r].length);
      const gx=pad+r*(bw+12)+bw/2+((k%cols)-(cu-1)/2)*(tok+8), gy=bTop+tok*0.9+Math.floor(k/cols)*(tok+10);
      const tx=lerp(lx,gx,t.p), ty=lerp(ly,gy,t.p)-Math.sin(Math.PI*t.p)*h*0.06;
      if(!t.init){ t.x=tx; t.y=ty; t.init=true; }
      t.x=approach(t.x,tx,16,dt); t.y=approach(t.y,ty,16,dt);
      const sel=cl(t.v)===cl(a), c=PAL[cl(t.v)], rr=tok/2*(t.v===a?1.18:1);
      if(t.v===a) circ(ctx,t.x,t.y,rr+5+2*Math.sin(T*5),COL.yellow,null,2.6);
      circ(ctx,t.x,t.y,rr,c,alphaCol(c,sel?0.22:0.08),sel?3:1.8);
      textAt(ctx,fmt(t.v,0),t.x,t.y+fs*0.36,{align:'center',size:fs,weight:700});
    });
    // readout
    const cls=[a-2*n,a-n,a,a+n,a+2*n].map(v=>fmt(v,0)).join(', ');
    const K1=$('#k1'); K1.textContent='[ '+fmt(a,0)+' ] = { …, '+cls+', … }'; K1.style.color=PAL[cl(a)];
    $('#k2').textContent=n; setV($('#k3'),true,'No — disjoint','');
  });
  return wrap;
}

/* =====================================================================
   1.4  ONE-ONE · ONTO · BIJECTIVE          (Fig 1.2, Examples 7–14)
   ===================================================================== */
function buildA4(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const PRE=[{t:'f₁  one-one, not onto',nx:3,ny:5,m:[0,1,2]},{t:'f₂  many-one, not onto',nx:3,ny:4,m:[1,1,2]},{t:'f₃  many-one, onto',nx:4,ny:3,m:[0,0,1,2]},{t:'f₄  one-one and onto',nx:3,ny:3,m:[1,2,0]}];
  side.innerHTML=`<div class="control-group"><label>Start from</label><div id="pl">${optList(PRE.map(p=>p.t),0)}</div></div>
    ${slider('nx','Elements in X',2,5,1,3)}${slider('ny','Elements in Y',2,5,1,5)}
    <div class="control-group"><label>Where does each x go?</label><div id="stp"></div><div class="toggle-group"><button class="toggle-btn navy" id="shf">Shuffle</button></div></div>
    <div class="control-group"><div class="result-cards three">${rc('v1','One-one')}${rc('v2','Onto')}${rc('v3','Type')}</div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), LET='abcde';
  let nx=3, ny=5, m=[0,1,2]; const yEnd=[0,1,2,3,4].map(()=>({x:0,v:0,init:false}));
  function steppers(){
    $('#stp').innerHTML=m.map((_,i)=>`<div class="var-row"><span class="vname">x = ${i+1} →</span><div class="toggle-group"><button class="toggle-btn small" data-i="${i}" data-d="-1">◀</button><span class="stv" id="sv${i}">${LET[m[i]]}</span><button class="toggle-btn small" data-i="${i}" data-d="1">▶</button></div></div>`).join('');
    $('#stp').querySelectorAll('.toggle-btn').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; m[i]=(m[i]+ +b.dataset.d+ny)%ny; $('#sv'+i).textContent=LET[m[i]]; clearActive(); });
  }
  const clearActive=()=>wrap.querySelectorAll('#pl .opt-btn').forEach(x=>x.classList.remove('active'));
  function setAll(x,y,mm){ nx=x; ny=y; m=mm.slice(0,nx); while(m.length<nx) m.push(0); m=m.map(v=>Math.min(v,ny-1)); $('#nx').value=nx; $('#ny').value=ny; lab(); steppers(); }
  const lab=()=>{ $('#nxV').textContent=' '+nx; $('#nyV').textContent=' '+ny; };
  $('#nx').oninput=e=>{ nx=+e.target.value; m=m.slice(0,nx); while(m.length<nx) m.push(Math.floor(Math.random()*ny)); lab(); steppers(); clearActive(); };
  $('#ny').oninput=e=>{ ny=+e.target.value; m=m.map(v=>Math.min(v,ny-1)); lab(); steppers(); clearActive(); };
  $('#shf').onclick=()=>{ m=m.map(()=>Math.floor(Math.random()*ny)); steppers(); clearActive(); };
  toggleWire(wrap.querySelectorAll('#pl .opt-btn'),b=>{ const p=PRE[+b.dataset.i]; setAll(p.nx,p.ny,p.m); });
  setAll(PRE[0].nx,PRE[0].ny,PRE[0].m);
  animLoop((dt,T)=>{
    const {ctx,w,h}=fitCanvas(canvas), fs=clamp(w/55,12,17);
    const hits=Array(ny).fill(0); m.forEach(v=>hits[v]++);
    const xX=w*0.2, xY=w*0.8, top=h*0.13, avail=h*0.76, sx=avail/nx, sy=avail/ny;
    const rx=Math.min(24,sx*0.36), ry=Math.min(24,sy*0.36);
    const yX=i=>top+(i+0.5)*sx, yY=j=>top+(j+0.5)*sy;
    // domain / co-domain ovals
    [[xX,'X'],[xY,'Y']].forEach(([x,l])=>{ ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(x,top+avail/2,w*0.1,avail/2+10,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); textAt(ctx,l,x,top-18,{align:'center',size:fs+4,weight:700}); });
    textAt(ctx,'f',w/2,top-14,{align:'center',size:fs+4,weight:700,color:COL.blue,});
    arrowHead(ctx,w/2+18,top-20,0,COL.blue,10); line(ctx,w/2+8,top-20,w/2+11,top-20,COL.blue,2);
    // arrows
    for(let i=0;i<nx;i++){
      const s=yEnd[i]; if(!s.init){ s.x=yY(m[i]); s.init=true; }
      springTo(s,yY(m[i]),70,9,dt);
      const clash=hits[m[i]]>1, col=clash?COL.yellow:COL.blue;
      const x1=xX+rx, y1=yX(i), x2=xY-ry-3, y2=s.x, ang=Math.atan2(y2-y1,x2-x1);
      line(ctx,x1,y1,x2,y2,col,3);
      arrowHead(ctx,x2,y2,ang,col,12);
      const f=(T*0.5+i*0.23)%1; circ(ctx,lerp(x1,x2,f),lerp(y1,y2,f),3.4,col,'#fff',1.8);
    }
    for(let i=0;i<nx;i++){ const clash=hits[m[i]]>1; node(ctx,xX,yX(i),rx,''+(i+1),clash?COL.yellow:COL.blue,'#fff',clash?3.4:2.6); }
    const pul=0.5+0.5*Math.sin(T*6);
    for(let j=0;j<ny;j++){
      const k=hits[j], c=k===0?COL.red:k>1?COL.yellow:COL.green;
      if(k===0) circ(ctx,xY,yY(j),ry+5+3*pul,alphaCol(COL.red,0.35+0.4*pul),null,2.4,[5,4]);
      node(ctx,xY,yY(j),ry,LET[j],c,k===0?'#fff':alphaCol(c,0.1),3.2);
      if(k===0) textAt(ctx,'no x maps here',xY+ry+16,yY(j)+4,{size:fs-1,weight:600,color:COL.red});
      else if(k>1) textAt(ctx,'← '+k+' x’s land here',xY+ry+16,yY(j)+4,{size:fs-1,weight:600,color:COL.yellow});
    }
    const one=hits.every(v=>v<=1), onto=hits.every(v=>v>=1);
    const rng=hits.map((v,j)=>v?LET[j]:null).filter(Boolean).join(', ');
    pill(ctx,w/2,h*0.96,'Range = { '+rng+' }   '+(onto?'= Y':'⊊ Y'),onto?COL.green:COL.red,fs);
    setV($('#v1'),one,'✓ Yes','✗ Many-one'); setV($('#v2'),onto,'✓ Yes','✗ No');
    const t=$('#v3'); t.textContent=one&&onto?'Bijective':one?'Injective':onto?'Surjective':'Neither'; t.className='rval '+(one&&onto?'ok':'');
  });
  return wrap;
}

/* =====================================================================
   1.5  HORIZONTAL-LINE TEST ON A GRAPH    (Examples 8–12, Exercise 1.2)
   ===================================================================== */
function buildA5(){
  const wrap=labShell(), side=wrap.querySelector('.lab-side');
  const FN={
    dbl:{t:'2x',f:x=>2*x},
    sq:{t:'x²',f:x=>x*x},
    cu:{t:'x³',f:x=>x*x*x},

    for(let i=0;i<n;i++){ node(ctx,xX,yy(i),r,''+(i+1),PAL[i%4],'#fff',3); node(ctx,xY,yy(i),r,''+(i+1),COL.green,alphaCol(COL.green,0.1),3); }
    // progress bar for auto-play
    if(playing){ line(ctx,xX-r,top+avail+26,xX-r+(xY-xX+2*r)*(tc/2.3),top+avail+26,COL.yellow,4); }
    // gallery
    const N=perms.length, cols=N<=2?2:N<=6?3:4, rows=Math.ceil(N/cols), gx=w*0.6, gw=w*0.38, gy=h*0.08, gh=h*0.84;
    const cw=gw/cols, ch=Math.min(gh/rows,cw*1.05);
    perms.forEach((q,k)=>{
      const x=gx+(k%cols)*cw, y=gy+Math.floor(k/cols)*ch, act=k===idx, sc=1+(act?0.04-pop.x*0.002:0);
      ctx.save(); ctx.translate(x+cw/2,y+ch/2); ctx.scale(sc,sc);
      rrect(ctx,-cw/2+4,-ch/2+4,cw-8,ch-8,9); ctx.fillStyle=act?alphaCol(COL.yellow,0.14):'#fff'; ctx.fill(); ctx.strokeStyle=act?COL.yellow:COL.border||'#dbe4f0'; ctx.lineWidth=act?3:1.4; ctx.stroke();
      const a1=-cw*0.2, a2=cw*0.2, ih=(ch-24)/n;
      for(let i=0;i<n;i++){ const y1=-ch/2+12+(i+0.5)*ih, y2=-ch/2+12+(q[i]+0.5)*ih; line(ctx,a1,y1,a2,y2,PAL[i%4],act?2.6:1.8); circ(ctx,a1,y1,2.6,COL.ink,COL.ink,1); circ(ctx,a2,y2,2.6,COL.ink,COL.ink,1); }
      ctx.restore();
    });
    const fact=[...Array(n).keys()].map(i=>n-i), tot=fact.reduce((a,b)=>a*b,1);
    $('#p1').textContent=n+'! = '+tot; $('#p2').textContent=(idx+1)+' of '+tot;
    $('#p3').textContent=fact.join(' × ')+' = '+tot; $('#p4').textContent='one-one AND onto'; $('#p4').className='rval ok'; $('#iV').textContent=' '+(idx+1);
  });
  return wrap;
}

    b.innerHTML=`<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`; b.onclick=()=>{ currentIndex=i; render(); }; nav.appendChild(b); });
}
function render(){
  stopAllLoops(); buildNav(); const a=activities[currentIndex];
