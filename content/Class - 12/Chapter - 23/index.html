<title>Class 12 · Chapter 4 — Amines | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.toggle-btn.red{background:var(--f-red); border-color:var(--f-red); color:#fff;}
.toggle-btn.blue{background:var(--f-blue); border-color:var(--f-blue); color:#fff;}
.toggle-btn.sm{font-size:11px; padding:6px 3px; min-width:0;}
.control-group select{width:100%; margin-top:7px; padding:7px; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface-1); font-size:var(--fs-sm); color:var(--text-1); cursor:pointer;}
.stat{display:flex; justify-content:space-between; font-size:var(--fs-sm); margin-top:5px; color:var(--text-2);} .stat b{color:var(--text-1);}

<script>
/* =========================================================================
   CLASS 12 — CHAPTER 4 (UNIT 9): AMINES
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn object eases, springs or physically integrates toward
   it every frame. Molecules are line diagrams; nothing jumps.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

/* ---------------------------------------------------------------------
   0c. CHEMISTRY HELPERS — atoms, bonds, rings, lone pairs, protons
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function seg(u,a,b){ return smooth01(a,b,u); }
function tag(ctx,px,py,tx,ty,txt,col){
  const W=ctx.canvas._w||800;
  ctx.save(); ctx.font='700 12px Poppins, sans-serif'; const tw=ctx.measureText(txt).width; ctx.restore();
  const right=tx>px; let bx=right?tx+4:tx-tw-12;
  if(bx+tw+10>W-4) bx=W-tw-14; if(bx<4) bx=4;
  line(ctx,px,py,right?bx:bx+tw+8,ty,col,1.6); circ(ctx,px,py,3,col,col,1);
  ctx.save(); rrect(ctx,bx,ty-10,tw+10,20,6); ctx.fillStyle='rgba(255,255,255,0.94)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
  textAt(ctx,txt,bx+5,ty+4,{size:12,weight:700,color:col});
}
/** element symbol on a white halo */
function atomLbl(ctx,x,y,s,col,size,alpha){
  size=size||16; ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha;
  ctx.font='700 '+size+'px Poppins, sans-serif'; const w=ctx.measureText(s).width;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(x,y,Math.max(w/2+3,size*0.6),size*0.64,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=col; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(s,x,y+1); ctx.restore();
}
/** n parallel lines between two points; trim shortens each end */
function bondN(ctx,x1,y1,x2,y2,col,w,n,t1,t2){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L, nx=-uy, ny=ux, a=t1||0, b=t2||0, sp=Math.max(3,w*2.4);
  if(L<a+b+1) return;
  for(let i=0;i<n;i++){ const o=(i-(n-1)/2)*sp; line(ctx,x1+ux*a+nx*o,y1+uy*a+ny*o,x2-ux*b+nx*o,y2-uy*b+ny*o,col,w); }
}
function hexV(cx,cy,R,rot,k){ const a=rot+k*Math.PI/3; return [cx+R*Math.cos(a), cy+R*Math.sin(a)]; }
/** benzene ring. dbl = list of edge indices (edge k joins vertex k and k+1) drawn as inner double bond.
    dbl===true draws the aromatic circle instead. */
function benzRing(ctx,cx,cy,R,rot,col,w,dbl,alpha){
  ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha; ctx.lineJoin='round';
  ctx.strokeStyle=col; ctx.lineWidth=w; ctx.beginPath();
  for(let k=0;k<6;k++){ const v=hexV(cx,cy,R,rot,k); k?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]); }
  ctx.closePath(); ctx.stroke();
  if(dbl===true){ ctx.beginPath(); ctx.arc(cx,cy,R*0.62,0,Math.PI*2); ctx.stroke(); }
  else if(dbl){ ctx.lineWidth=w*0.9;
    dbl.forEach(k=>{ const a=hexV(cx,cy,R*0.8,rot,k), b=hexV(cx,cy,R*0.8,rot,k+1);
      const ax=lerp(a[0],b[0],0.14), ay=lerp(a[1],b[1],0.14), bx=lerp(a[0],b[0],0.86), by=lerp(a[1],b[1],0.86);
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); }); }
  ctx.restore();
}
/** lone pair: two dots on the side of (x,y) pointing at angle ang */
function lonePair(ctx,x,y,ang,d,col,r,alpha){
  const cx=x+Math.cos(ang)*d, cy=y+Math.sin(ang)*d, px=-Math.sin(ang)*r*1.6, py=Math.cos(ang)*r*1.6;
  ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha; ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(cx+px,cy+py,r,0,Math.PI*2); ctx.arc(cx-px,cy-py,r,0,Math.PI*2); ctx.fill(); ctx.restore();
}
/** teardrop lobe leaving (x,y) in direction ang, length L */
function lobe(ctx,x,y,ang,L,col,fillA,alpha){
  if(L<2) return; ctx.save(); ctx.translate(x,y); ctx.rotate(ang); if(alpha!==undefined) ctx.globalAlpha=alpha;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(L*0.25,-L*0.55,L*0.95,-L*0.45,L,0); ctx.bezierCurveTo(L*0.95,L*0.45,L*0.25,L*0.55,0,0);
  ctx.fillStyle=col; ctx.globalAlpha=(alpha===undefined?1:alpha)*fillA; ctx.fill();
  ctx.globalAlpha=alpha===undefined?1:alpha; ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore();
}
function protonDot(ctx,x,y,r,alpha){
  ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha;
  circ(ctx,x,y,r,COL.red,'#fdece7',2.2); textAt(ctx,'H⁺',x,y+r*0.34,{align:'center',size:r*0.95,weight:700,color:COL.red}); ctx.restore();
}
function plusSign(ctx,x,y,s,col,alpha){ ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha; circ(ctx,x,y,s,col,'#fff',1.6); line(ctx,x-s*0.55,y,x+s*0.55,y,col,1.8); line(ctx,x,y-s*0.55,x,y+s*0.55,col,1.8); ctx.restore(); }
function minusSign(ctx,x,y,s,col,alpha){ ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha; circ(ctx,x,y,s,col,'#fff',1.6); line(ctx,x-s*0.55,y,x+s*0.55,y,col,1.8); ctx.restore(); }
/** zig-zag chain points: n atoms, step s, starting at (x,y), first bond rises (up=true) */
function zigPts(x,y,n,s,up){
  const p=[]; for(let i=0;i<n;i++) p.push([x+i*s*0.866, y+((i%2)?(up?-1:1):0)*s*0.5*(up?1:1)]);
  return p;
}
function polyline(ctx,pts,col,w,ox,oy){ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0]+(ox||0),p[1]+(oy||0)):ctx.moveTo(p[0]+(ox||0),p[1]+(oy||0))); ctx.stroke(); ctx.restore(); }
/** wavy line (for odour, vapours) */
function wavy(ctx,x,y,len,amp,ph,col,w,alpha){
  ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha; ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath();
  for(let i=0;i<=24;i++){ const yy=y-len*i/24, xx=x+Math.sin(i*0.55+ph)*amp*(0.3+0.7*i/24); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }
  ctx.stroke(); ctx.restore();
}
/** an N₂ / gas bubble */
function bubble(ctx,x,y,r,col,alpha){ ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha; circ(ctx,x,y,r,col||COL.blue,'rgba(255,255,255,0.55)',1.6); ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.3,r*0.28,Math.PI,Math.PI*1.6); ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); }
function swirl(R,seed){ return rng(seed); }
/** ticker that fades text for banners on canvas */
function banner(ctx,w,txt,sub,col){
  textAt(ctx,txt,w*0.03,28,{size:18,weight:700,color:col||COL.ink});
  if(sub) textAt(ctx,sub,w*0.03,48,{size:12,weight:500,color:COL.muted});
}

/* =====================================================================
   9.1 SHAPE & CLASSES OF AMINES
   NH₃ is pyramidal, H–N–H ≈ 107°. Replace H by R one at a time:
   1° (RNH₂) · 2° (R₂NH) · 3° (R₃N).  N–H 101 pm → N–C 147 pm.
   The lone pair sits on top of the pyramid; the pyramid flips like an
   umbrella in a gale (nitrogen inversion).
   ===================================================================== */
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Replace H on N</label>
      <div class="toggle-group" id="clsB"><button class="toggle-btn" data-n="0">NH₃</button><button class="toggle-btn active" data-n="1">1°</button><button class="toggle-btn" data-n="2">2°</button><button class="toggle-btn" data-n="3">3°</button></div></div>
    <div class="control-group"><label style="margin-bottom:6px;">Group R</label>
      <div class="toggle-group" id="rB"><button class="toggle-btn active" data-r="alk">Alkyl · CH₃</button><button class="toggle-btn" data-r="aryl">Aryl · C₆H₅</button></div></div>
    <div class="control-group"><label>View angle <span class="val" id="yV"></span></label><input type="range" id="yR" min="0" max="360" value="25"></div>
    <button class="toggle-btn play" id="flipB" style="flex:0 0 auto;padding:10px;">⟲ Flip the pyramid</button>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Class</div><div class="rval" id="cV" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Bond angle</div><div class="rval" id="aV">—</div></div>
      <div class="rcard"><div class="rlabel">H on N</div><div class="rval" id="hV">—</div></div>
      <div class="rcard"><div class="rlabel">R on N</div><div class="rval" id="rV">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), yR=$('#yR');
  let nR=1, aryl=false, t=0;
  const sub=[{a:1},{a:0},{a:0}];            // 0 = H, 1 = R
  const P={x:1,v:0}, YAW={x:25*Math.PI/180,v:0};
  toggleWire(wrap.querySelectorAll('#clsB button'),b=>nR=+b.dataset.n);
  toggleWire(wrap.querySelectorAll('#rB button'),b=>aryl=b.dataset.r==='aryl');
  $('#flipB').onclick=()=>{ P.v+= (P.x>0?-1:1)*9; flipT=(P.x>0?-1:1); };
  let flipT=1;
  const NAMES=['Ammonia','Primary (1°)','Secondary (2°)','Tertiary (3°)'];
  const TH=Math.acos(0.372);

  animLoop((dt)=>{
    t+=dt;
    $('#yV').textContent=yR.value+'°';
    springTo(YAW,yR.value*Math.PI/180,30,9,dt);
    springTo(P,flipT,60,6.2,dt);                       // underdamped: overshoots through the plane like a real umbrella flip
    sub.forEach((s,i)=>{ s.a=approach(s.a,i<nR?1:0,3.4-i*0.4,dt); });
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const S=Math.min(w*0.34,h*0.40), cx=w*0.5, cy=h*0.6, E=0.42;
    const cY=Math.cos(YAW.x), sY=Math.sin(YAW.x), cE=Math.cos(E), sE=Math.sin(E);
    const proj=(x,y,z)=>{ const x1=x*cY-y*sY, y1=x*sY+y*cY; return {X:cx+x1*S, Y:cy-(z*cE+y1*sE)*S, d:y1}; };
    const pOff=P.x;                                     // pyramid height factor: +1 up · −1 flipped
    const cosT=0.372-0.0105*(sub[0].a+sub[1].a+sub[2].a)/3;
    const sinT=Math.sqrt(1-cosT*cosT);
    const nzN=0;                                         // N at the origin
    const dirs=[0,1,2].map(i=>{ const ph=i*2*Math.PI/3+0.5; return [sinT*Math.cos(ph), sinT*Math.sin(ph), -cosT*pOff]; });
    // bond angle from the actual geometry
    const dd=dirs[0], de=dirs[1], dot=(dd[0]*de[0]+dd[1]*de[1]+dd[2]*de[2])/(Math.hypot(...dd)*Math.hypot(...de));
    const ang=Math.acos(clamp(dot,-1,1))*180/Math.PI;

    // plane triangle (faint) + floor ring
    const Lb=0.62;
    const tip=dirs.map((d,i)=>{ const L=Lb*lerp(1,1.45,sub[i].a); return proj(d[0]*L,d[1]*L,d[2]*L); });
    ctx.save(); ctx.beginPath(); tip.forEach((p,i)=>i?ctx.lineTo(p.X,p.Y):ctx.moveTo(p.X,p.Y)); ctx.closePath();
    ctx.fillStyle='rgba(47,143,224,0.06)'; ctx.fill(); ctx.setLineDash([5,5]); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
    const N=proj(0,0,nzN);
    // lone-pair lobes (up for p>0, down for p<0, both at the planar moment)
    const up=clamp(0.5+0.5*pOff,0,1), dn=clamp(0.5-0.5*pOff,0,1);
    const lpPulse=1+0.05*Math.sin(t*5);
    const topP=proj(0,0,1), botP=proj(0,0,-1);
    const upA=Math.atan2(topP.Y-N.Y,topP.X-N.X), upL=Math.hypot(topP.X-N.X,topP.Y-N.Y)*0.95;
    const dnA=Math.atan2(botP.Y-N.Y,botP.X-N.X);
    lobe(ctx,N.X,N.Y,upA,upL*up*lpPulse,COL.blue,0.18);
    lobe(ctx,N.X,N.Y,dnA,upL*dn*lpPulse,COL.blue,0.18);

    // depth-sorted substituents
    const order=[0,1,2].map(i=>({i,d:tip[i].d})).sort((a,b)=>b.d-a.d);
    order.forEach(({i})=>{
      const s=sub[i], d=dirs[i], T=tip[i];
      // vibration: N–H stretches faster than N–C
      const vib=1+0.018*Math.sin(t*(14-6*s.a)+i*2);
      const Tv=proj(d[0]*Lb*lerp(1,1.45,s.a)*vib,d[1]*Lb*lerp(1,1.45,s.a)*vib,d[2]*Lb*lerp(1,1.45,s.a)*vib);
      line(ctx,N.X,N.Y,Tv.X,Tv.Y,COL.ink,3);
      // leaving H flies out, arriving R flies in
      const outK=1+s.a*1.8, inK=1+(1-s.a)*1.8;
      if(s.a<0.995){ const P2=proj(d[0]*Lb*outK,d[1]*Lb*outK,d[2]*Lb*outK);
        const k=lerp(0,1,1-s.a); const hx=lerp(Tv.X,P2.X,1-k+k*0), hy=lerp(Tv.Y,P2.Y,1-k+k*0);
        circ(ctx,lerp(Tv.X,P2.X,s.a),lerp(Tv.Y,P2.Y,s.a),S*0.085,COL.mid,'#fff',2);
        ctx.save(); ctx.globalAlpha=1-s.a; textAt(ctx,'H',lerp(Tv.X,P2.X,s.a),lerp(Tv.Y,P2.Y,s.a)+4,{align:'center',size:S*0.1,weight:700,color:COL.muted}); ctx.restore(); }
      if(s.a>0.005){ const Q=proj(d[0]*Lb*inK*1.0,d[1]*Lb*inK*1.0,d[2]*Lb*inK*1.0);
        const qx=lerp(Q.X,Tv.X,s.a), qy=lerp(Q.Y,Tv.Y,s.a);
        ctx.save(); ctx.globalAlpha=Math.min(1,s.a*1.6);
        if(aryl){ const dx=Tv.X-N.X, dy=Tv.Y-N.Y, L=Math.hypot(dx,dy)||1, rr=S*0.21;
          const ux=L>12?dx/L:0, uy=L>12?dy/L:-1, rc=[qx+ux*rr, qy+uy*rr];
          benzRing(ctx,rc[0],rc[1],rr,Math.atan2(-uy,-ux),COL.ink,2.2,[0,2,4]);
          circ(ctx,qx,qy,4,COL.yellow,COL.yellow,1);
        } else {
          circ(ctx,qx,qy,S*0.2,COL.yellow,'#fff',2.4); textAt(ctx,'CH₃',qx,qy+S*0.045,{align:'center',size:S*0.14,weight:700,color:COL.ink});
        }
        ctx.restore(); }
      // resting H
      if(s.a<0.5){ circ(ctx,Tv.X,Tv.Y,S*0.085,COL.mid,'#fff',2); ctx.save(); ctx.globalAlpha=1-s.a*2; textAt(ctx,'H',Tv.X,Tv.Y+4,{align:'center',size:S*0.1,weight:700,color:COL.muted}); ctx.restore(); }
    });
    // nitrogen
    atomLbl(ctx,N.X,N.Y,'N',COL.blue,S*0.2);
    lonePair(ctx,N.X,N.Y,upA,upL*0.5*up+S*0.16*up,COL.blue,3.2,up);
    if(up>0.5) tag(ctx,N.X+Math.cos(upA)*upL*0.7*up,N.Y+Math.sin(upA)*upL*0.7*up,N.X+S*0.6,N.Y-S*1.02,'lone pair',COL.blue);

    // headline
    banner(ctx,w,NAMES[nR],nR===0?'NH₃':(nR===1?'R–NH₂':nR===2?'R₂NH':'R₃N'),COL.blue);
    textAt(ctx,'N–H  101 pm',w*0.03,h-44,{size:12,weight:600,color:COL.mid});
    textAt(ctx,'N–C  147 pm',w*0.03,h-26,{size:12,weight:600,color:COL.yellow});
    $('#cV').textContent=['NH₃','1°','2°','3°'][nR];
    $('#aV').textContent=fmt(ang,0)+'°';
    $('#hV').textContent=3-nR; $('#rV').textContent=nR;
  });
  return wrap;
}

/* =====================================================================
   9.2 AMMONOLYSIS — A MIXTURE, UNLESS NH₃ IS IN EXCESS
   R–X + NH₃ → RNH₂ ;  RNH₂ + R–X → R₂NH ;  R₂NH + R–X → R₃N ;  R₃N + R–X → R₄N⁺X⁻
   Each amine is a better nucleophile than NH₃, so once made it competes for
   the next R–X.  Excess NH₃ swamps the competition.
   Reactivity of the halide: RI > RBr > RCl.
   Stochastic particle model: a collision of R–X with a nucleophile N-species
   reacts with probability  p = k_species · k_halide · dt.
   ===================================================================== */
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>NH₃ : R–X ratio <span class="val" id="rV"></span></label><input type="range" id="rR" min="1" max="10" step="1" value="1"></div>
    <div class="control-group"><label style="margin-bottom:6px;">Alkyl halide</label>
      <div class="toggle-group" id="hB"><button class="toggle-btn active" data-h="I">R–I</button><button class="toggle-btn" data-h="Br">R–Br</button><button class="toggle-btn" data-h="Cl">R–Cl</button></div></div>
    <button class="toggle-btn play" id="goB" style="flex:0 0 auto;padding:10px;">↻ Run again</button>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Major product</div><div class="rval" id="mV" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">R–X left</div><div class="rval" id="lV">—</div></div></div>
      <p class="hint">Sealed tube · 373 K · ethanolic NH₃</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), rR=$('#rR');
  let halide='I', t=0, P=[], RX=[], flashes=[], ions=[];
  const KH={I:1,Br:0.5,Cl:0.2};
  const KS=[1,3,2.2,1.4];                       // relative nucleophilicity: NH3, 1°, 2°, 3°
  const SPC=[{n:'NH₃',c:COL.mid},{n:'1°',c:COL.blue},{n:'2°',c:COL.green},{n:'3°',c:COL.yellow},{n:'R₄N⁺',c:COL.red}];
  const NRX=24;
  const bars=SPC.slice(1).map(()=>({x:0,v:0}));
  let ratio=1;
  toggleWire(wrap.querySelectorAll('#hB button'),b=>{ halide=b.dataset.h; reset(); });
  $('#goB').onclick=()=>reset();
  rR.oninput=()=>reset();
  function reset(){
    ratio=+rR.value; $('#rV').textContent=ratio+' : 1';
    const nN=Math.min(ratio*NRX,240);
    P=[]; RX=[]; flashes=[]; ions=[];
    for(let i=0;i<nN;i++) P.push({x:Math.random(),y:Math.random(),vx:gauss()*0.12,vy:gauss()*0.12,s:0});
    for(let i=0;i<NRX;i++) RX.push({x:Math.random(),y:Math.random(),vx:gauss()*0.12,vy:gauss()*0.12,alive:true});
  }
  reset();
  animLoop((dt)=>{
    t+=dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // flask region (normalised coords 0..1 inside the box)
    const bx=w*0.05, by=h*0.14, bw=w*0.52, bh=h*0.74;
    const rN=Math.max(4,Math.min(9,bw/Math.sqrt(P.length+RX.length)*0.32));
    const rad=rN/Math.min(bw,bh)*1.9;                // reaction radius in normalised units
    // physics
    const step=dt*1.0;
    P.forEach(p=>{ p.vx+=gauss()*0.5*step; p.vy+=gauss()*0.5*step; const sp=Math.hypot(p.vx,p.vy); if(sp>0.28){p.vx*=0.28/sp;p.vy*=0.28/sp;}
      p.x+=p.vx*step; p.y+=p.vy*step; if(p.x<0.02||p.x>0.98){p.vx*=-1;p.x=clamp(p.x,0.02,0.98);} if(p.y<0.02||p.y>0.98){p.vy*=-1;p.y=clamp(p.y,0.02,0.98);} });
    RX.forEach(p=>{ if(!p.alive) return; p.vx+=gauss()*0.5*step; p.vy+=gauss()*0.5*step; const sp=Math.hypot(p.vx,p.vy); if(sp>0.28){p.vx*=0.28/sp;p.vy*=0.28/sp;}
      p.x+=p.vx*step; p.y+=p.vy*step; if(p.x<0.02||p.x>0.98){p.vx*=-1;p.x=clamp(p.x,0.02,0.98);} if(p.y<0.02||p.y>0.98){p.vy*=-1;p.y=clamp(p.y,0.02,0.98);} });
    // reactions
    RX.forEach(r=>{ if(!r.alive) return;
      for(let i=0;i<P.length;i++){ const p=P[i]; if(p.s>=4) continue;
        const dx=(p.x-r.x)*bw, dy=(p.y-r.y)*bh;
        if(dx*dx+dy*dy<(rN*2.2)*(rN*2.2)){
          const prob=KS[p.s]*KH[halide]*0.9*dt*3.2;
          if(Math.random()<prob){ p.s++; r.alive=false; flashes.push({x:p.x,y:p.y,t:0,c:SPC[p.s].c}); ions.push({x:r.x,y:r.y,vx:gauss()*0.05,vy:-0.04-Math.random()*0.05,t:0}); break; }
        }
      } });
    flashes.forEach(f=>f.t+=dt*1.6); flashes=flashes.filter(f=>f.t<1);
    ions.forEach(f=>{ f.t+=dt*0.7; f.x+=f.vx*dt; f.y+=f.vy*dt; }); ions=ions.filter(f=>f.t<1);
    // draw tube
    ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; rrect(ctx,bx-6,by-6,bw+12,bh+12,16); ctx.fillStyle='#f6fafe'; ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.beginPath(); rrect(ctx,bx,by,bw,bh,10); ctx.clip();
    // particles
    P.forEach(p=>{ const c=SPC[p.s].c; circ(ctx,bx+p.x*bw,by+p.y*bh,rN*(p.s?1.15:0.85),c,p.s?c+'33':'#fff',p.s?2.4:1.6); });
    RX.forEach(r=>{ if(!r.alive) return; const X=bx+r.x*bw, Y=by+r.y*bh; circ(ctx,X-rN*0.5,Y,rN*0.7,COL.ink,'#fff',1.8); circ(ctx,X+rN*0.55,Y,rN*0.55,COL.red,'#fdece7',1.8); });
    ions.forEach(f=>{ textAt(ctx,'X⁻',bx+f.x*bw,by+f.y*bh,{size:11,weight:700,color:COL.red,alpha:1-f.t,align:'center'}); });
    flashes.forEach(f=>{ ctx.save(); ctx.globalAlpha=1-f.t; circ(ctx,bx+f.x*bw,by+f.y*bh,rN+f.t*rN*4,f.c,null,2.4); ctx.restore(); });
    ctx.restore();
    // heat glow under tube
    for(let i=0;i<7;i++){ const fx=bx+bw*(i+0.5)/7; const hh=10+6*Math.sin(t*9+i); line(ctx,fx,by+bh+10,fx,by+bh+10+hh,COL.red,2.4); }
    textAt(ctx,'373 K',bx+bw/2,by+bh+44,{align:'center',size:12,weight:700,color:COL.red});
    // legend
    const lx=bx, ly=h*0.07;
    textAt(ctx,'Ammonolysis',lx,ly+4,{size:18,weight:700});
    // counts + bars
    const cnt=[0,0,0,0,0]; P.forEach(p=>cnt[p.s]++);
    const left=RX.filter(r=>r.alive).length;
    const prod=cnt[1]+cnt[2]+cnt[3]+cnt[4];
    const gx=w*0.64, gy=h*0.16, gw=w*0.31, gh=h*0.58;
    textAt(ctx,'Products formed',gx,gy-12,{size:13,weight:700,color:COL.ink});
    line(ctx,gx,gy+gh,gx+gw,gy+gh,COL.ink,2);
    const names=['1°','2°','3°','R₄N⁺'], cols=[COL.blue,COL.green,COL.yellow,COL.red];
    const bw2=gw/4*0.62;
    let best=0,bv=-1;
    for(let i=0;i<4;i++){
      const frac=prod?cnt[i+1]/prod:0; springTo(bars[i],frac,60,10,dt);
      const bh2=gh*clamp(bars[i].x,0,1), X=gx+gw/4*i+gw/8-bw2/2;
      ctx.save(); ctx.fillStyle=cols[i]+'33'; ctx.strokeStyle=cols[i]; ctx.lineWidth=2.4; ctx.fillRect(X,gy+gh-bh2,bw2,bh2); ctx.strokeRect(X,gy+gh-bh2,bw2,bh2); ctx.restore();
      textAt(ctx,names[i],X+bw2/2,gy+gh+20,{align:'center',size:13,weight:700,color:cols[i]});
      textAt(ctx,Math.round(frac*100)+'%',X+bw2/2,gy+gh-bh2-6,{align:'center',size:12,weight:700,color:cols[i]});
      if(frac>bv){bv=frac;best=i;}
    }
    textAt(ctx,'NH₃ left: '+cnt[0],gx,gy+gh+46,{size:12,weight:600,color:COL.mid});
    $('#mV').textContent=prod?names[best]:'—';
    $('#lV').textContent=left+' / '+NRX;
    if(left===0 && !P._done){ P._done=true; }
  });
  return wrap;
}


/* =====================================================================

function buildA3(){
  const wrap=labShell();

    <div class="control-group"><label style="margin-bottom:6px;">Route</label>

    <div class="control-group"><label>Reaction progress <span class="val" id="pV"></span></label><input type="range" id="pR" min="0" max="100" value="0"></div>
    <button class="toggle-btn play" id="goB" style="flex:0 0 auto;padding:10px;">▶ Run reaction</button>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Carbons start</div><div class="rval" id="c0" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Carbons now</div><div class="rval" id="c1" style="color:var(--f-green)">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);

  const NAMEN=['','methyl','ethyl','propyl','butyl','pentyl'];
  animLoop((dt)=>{
    t+=dt;
    if(running){ const v=Math.min(100,+pR.value+dt*14); pR.value=v; if(v>=100) running=false; }

    const H=(x,y,k,from)=>{ if(k<=0.001) return; const fx=lerp(from[0],x,k), fy=lerp(from[1],y,k); circ(ctx,fx,fy,s*0.13,COL.red,'#fdece7',2); };

      const oDir=(n%2?-1:1);

      const liftX=bye*s*2.6, liftY=-bye*s*3.6, fade=1-bye*0.55;

      ctx.save(); ctx.globalAlpha=mig; line(ctx,re[0],re[1],zN[0],zN[1],COL.green,3.4); ctx.restore();
      ctx.save(); ctx.globalAlpha=(1-seg(u,0.62,0.7)); line(ctx,zN[0],zN[1],cx,cy,COL.ink,3.2); ctx.restore();
      ctx.save(); ctx.globalAlpha=fade;
      bondN(ctx,cx+liftX,cy+liftY,ox+liftX,oy+liftY,COL.ink,2.4,2,s*0.12,s*0.2);
      circ(ctx,cx+liftX,cy+liftY,s*0.16,COL.red,COL.red,2); atomLbl(ctx,ox+liftX,oy+liftY,'O',COL.red,s*0.38);
      if(bye>0.05){ const ax=cx+liftX-s*0.866*0.5, ay=cy+liftY-s*0.9; ctx.globalAlpha=fade*clamp(bye*3,0,1); bondN(ctx,cx+liftX,cy+liftY,ax,ay,COL.ink,2.4,2,s*0.12,s*0.2); atomLbl(ctx,ax,ay,'O',COL.red,s*0.38);
        textAt(ctx,'CO₂ ↑',cx+liftX+s*0.7,cy+liftY-s*1.3,{size:14,weight:800,color:COL.red}); }
      ctx.restore();
      atomLbl(ctx,zN[0],zN[1],'N',COL.blue,s*0.42);
      const hA=1-ph1*(1-bye);
      [[0.25,-0.62],[0.5,0.5]].forEach((p,i)=>{ const hx=zN[0]+p[0]*s+(1-hA)*s*2.2*(i?1:-1), hy=zN[1]+p[1]*s-(1-hA)*s*1.6;
        ctx.save(); ctx.globalAlpha=0.25+0.75*hA; line(ctx,zN[0],zN[1],lerp(zN[0]+p[0]*s,hx,1-hA),lerp(zN[1]+p[1]*s,hy,1-hA),COL.ink,2); circ(ctx,hx,hy,s*0.13,COL.red,'#fdece7',2); ctx.restore(); });
      if(ph1>0.02&&bye<0.9){ ctx.save(); ctx.globalAlpha=clamp(Math.min(ph1,1-bye)*2,0,1); for(let i=0;i<5;i++){ const a=t*2.2+i*1.26, r=s*(0.95+0.12*Math.sin(t*3+i)); circ(ctx,zN[0]+Math.cos(a)*r,zN[1]+Math.sin(a)*r,s*0.1,COL.red,'#fdece7',1.8); } ctx.restore(); }
      c1=(n+1)-(bye>0.35?1:0);
      cap=mig<0.35?'R–CO–NH₂':bye<0.5?'R–N=C=O':'R–NH₂'; capCol=bye>0.8?COL.green:COL.ink;
      if(mig>0.1&&mig<0.95) textAt(ctx,'R moves C → N',w*0.07,h*0.8+22,{size:12,weight:700,color:COL.yellow});
    } else {
      c0=n; banner(ctx,w,'Reduction of a nitro compound','R–NO₂ + 6[H] → R–NH₂ + 2H₂O   (Fe/HCl or H₂/Ni)',COL.blue);
      const lose=seg(u,0.1,0.6), gain=seg(u,0.4,0.9);

        const yy=lerp(ey,sg>0?zN[1]+s*2.6:zN[1]-s*2.9,lose);

      [[0.4,-0.75],[0.5,0.7]].forEach((p,i)=>{ const k=seg(u,0.4+i*0.15,0.75+i*0.1); if(k>0.9) line(ctx,zN[0],zN[1],zN[0]+p[0]*s,zN[1]+p[1]*s,COL.red,2.2); H(zN[0]+p[0]*s,zN[1]+p[1]*s,k,[zN[0]+p[0]*s+s*2.6,zN[1]+p[1]*s+s*(i?2:-2)]); });

  });

}

/* =====================================================================
   9.4 BOILING POINTS — HYDROGEN BONDS DECIDE
   Table 9.2 (molar mass ≈ 73):  n-C₄H₉OH 390.3 K · n-C₄H₉NH₂ 350.8 K ·
   (C₂H₅)₂NH 329.3 K · C₂H₅N(CH₃)₂ 310.5 K · C₂H₅CH(CH₃)₂ 300.8 K
   Each molecule gets its own tiny escape threshold around the true boiling
   point, so the liquid thins out into vapour over a few kelvin instead of
   flipping all at once.
   ===================================================================== */
const BPS=[
  {id:'ol',  n:'Butan-1-ol',          f:'n-C₄H₉OH',    M:74, bp:390.3, hd:'O', hc:'#d9432b', bonds:2, str:1.00, bar:'#d9432b',
    ch:[[[0,0],[0.87,0.5],[1.73,0],[2.6,0.5],[3.46,0]]], head:[3.46,0], lbl:'OH'},
  {id:'p',   n:'Butan-1-amine',       f:'n-C₄H₉NH₂',   M:73, bp:350.8, hd:'N', hc:'#2f8fe0', bonds:2, str:0.62, bar:'#2f8fe0',
    ch:[[[0,0],[0.87,0.5],[1.73,0],[2.6,0.5],[3.46,0]]], head:[3.46,0], lbl:'NH₂'},
  {id:'s',   n:'Diethylamine',        f:'(C₂H₅)₂NH',   M:73, bp:329.3, hd:'N', hc:'#2f8fe0', bonds:1, str:0.45, bar:'#2f8fe0',
    ch:[[[0,0],[0.87,0.5],[1.73,0],[2.6,0.5],[3.46,0]]], head:[1.73,0], lbl:'NH'},
  {id:'t',   n:'N,N-Dimethylethanamine', f:'C₂H₅N(CH₃)₂', M:73, bp:310.5, hd:'N', hc:'#2f8fe0', bonds:0, str:0.0, bar:'#1f9d55',
    ch:[[[-0.87,-0.5],[0,0],[0.87,-0.5],[1.73,0]],[[0,0],[-0.87,0.5]]], head:[0,0], lbl:'N'},
  {id:'a',   n:'2-Methylbutane',      f:'C₂H₅CH(CH₃)₂', M:72, bp:300.8, hd:'', hc:'#8195ab', bonds:0, str:0.0, bar:'#8195ab',
    ch:[[[0,0],[0.87,0.5],[1.73,0],[2.6,0.5]],[[0.87,0.5],[0.87,1.5]]], head:null, lbl:''},
];
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Liquid · M ≈ 73</label>
      <div class="toggle-group" id="cB" style="flex-direction:column;gap:4px;">${BPS.map((b,i)=>`<button class="toggle-btn sm${i===1?' active':''}" data-i="${i}" style="text-align:left;padding:7px 9px;">${b.f}</button>`).join('')}</div></div>
    <div class="control-group"><label>Burner · heat to <span class="val" id="tV"></span></label><input type="range" id="tR" min="285" max="410" step="1" value="300"></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Thermometer</div><div class="rval" id="thV" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">Boils at</div><div class="rval" id="bpV" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">H-bond sites</div><div class="rval" id="hbV">—</div></div>
      <div class="rcard"><div class="rlabel">Vapour</div><div class="rval" id="vV" style="color:var(--f-green)">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), tR=$('#tR');
  let cur=1, t=0, Tcur=295;
  const NM=28;
  let mols=[];
  function mk(){ mols=[]; const R=rng(11); for(let i=0;i<NM;i++) mols.push({x:R(),y:0.55+R()*0.45,a:R()*6.28,va:0,vx:0,vy:0,th:gauss()*2.6,gas:false,ph:R()*6}); }
  mk();
  toggleWire(wrap.querySelectorAll('#cB button'),b=>{ cur=+b.dataset.i; Tcur=Math.min(Tcur,+tR.value); mols.forEach(m=>{m.gas=false; m.y=0.55+Math.random()*0.45;}); });
  animLoop((dt)=>{
    t+=dt;
    const B=BPS[cur], Tt=+tR.value;
    $('#tV').textContent=Tt+' K';
    Tcur=approach(Tcur,Tt,0.55,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const u=clamp(Math.min(w*0.0165,h*0.027),6,15);
    const bx=w*0.05, by=h*0.18, bw=w*0.45, bh=h*0.62, surf=0.40;           // liquid top (normalised in tube)
    // molecule physics (normalised coords inside tube)
    const sp=Math.sqrt(Tcur/300);
    let gasN=0;
    mols.forEach(m=>{
      const thr=B.bp+m.th;
      const want=Tcur>thr;
      if(want&&!m.gas){ m.gas=true; m.vy=-0.25; }
      if(!want&&m.gas&&m.y>surf-0.02&&Math.random()<dt*3){ m.gas=false; }
      if(!want&&m.gas){ m.vy+=0.9*dt; }                 // vapour condenses back
      if(m.gas){ gasN++;
        m.vx+=gauss()*0.9*dt*sp; m.vy+=gauss()*0.9*dt*sp+(want?0:0); const s=Math.hypot(m.vx,m.vy), mx=0.16*sp; if(s>mx){m.vx*=mx/s; m.vy*=mx/s;}
        m.x+=m.vx*dt*2.4; m.y+=m.vy*dt*2.4; m.a+=m.va*dt; m.va+=gauss()*4*dt; m.va*=0.98;
        if(m.x<0.06){m.x=0.06;m.vx=Math.abs(m.vx);} if(m.x>0.94){m.x=0.94;m.vx=-Math.abs(m.vx);} if(m.y<0.05){m.y=0.05;m.vy=Math.abs(m.vy);}
        if(m.y>0.97){m.y=0.97;m.vy=-Math.abs(m.vy);}
      } else {
        m.vx+=gauss()*1.4*dt*sp; m.vy+=gauss()*1.4*dt*sp; const s=Math.hypot(m.vx,m.vy), mx=0.05*sp; if(s>mx){m.vx*=mx/s; m.vy*=mx/s;}
        m.x+=m.vx*dt*2.2; m.y+=m.vy*dt*2.2; m.va+=gauss()*3*dt*sp; m.va*=0.95; m.a+=m.va*dt;
        if(m.x<0.07){m.x=0.07;m.vx=Math.abs(m.vx);} if(m.x>0.93){m.x=0.93;m.vx=-Math.abs(m.vx);}
        if(m.y<surf+0.03){m.y=surf+0.03;m.vy=Math.abs(m.vy);} if(m.y>0.96){m.y=0.96;m.vy=-Math.abs(m.vy);}
      }
    });

    for(let i=0;i<liq.length;i++) for(let j=i+1;j<liq.length;j++){ const a=liq[i], b=liq[j]; const dx=(a.x-b.x)*bw, dy=(a.y-b.y)*bh, d=Math.hypot(dx,dy)||1, min=u*2.4;
      if(d<min){ const f=(min-d)/min*0.5*dt; a.x+=dx/d*f*0.5/bw*u; a.y+=dy/d*f*0.5/bh*u; b.x-=dx/d*f*0.5/bw*u; b.y-=dy/d*f*0.5/bh*u; } }
    // draw tube
    ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; rrect(ctx,bx-5,by-5,bw+10,bh+10,18); ctx.fillStyle='#fbfdff'; ctx.fill(); ctx.stroke(); ctx.restore();
    const sy=by+bh*surf, wob=Math.sin(t*3)*1.2*clamp((Tcur-B.bp+8)/10,0,1);
    ctx.save(); rrect(ctx,bx,by,bw,bh,14); ctx.clip();
    ctx.fillStyle='rgba(47,143,224,0.09)'; ctx.fillRect(bx,sy,bw,bh*(1-surf)+4);
    line(ctx,bx,sy+wob,bx+bw,sy-wob,COL.blue,1.6);
    // bubbling near boiling
    if(Tcur>B.bp-6){ const k=clamp((Tcur-B.bp+6)/10,0,1); for(let i=0;i<7;i++){ const ph=(t*0.7*k+i/7)%1; bubble(ctx,bx+bw*(0.12+0.76*((i*0.37+0.11)%1)),by+bh*(0.97-ph*(0.97-surf)),2.5+ph*3.5,COL.blue,k*(1-ph)); } }
    // molecules + H-bonds
    const hs=B.head, bond=B.bonds;
    const place=m=>{ const cx=bx+m.x*bw, cy=by+m.y*bh; return [cx,cy]; };
    const tp=(m,p)=>{ const [cx,cy]=place(m); const c=Math.cos(m.a), s=Math.sin(m.a); const mid=B.head?B.head:[1.7,0.4]; const dx=(p[0]-mid[0])*u, dy=(p[1]-mid[1])*u; return [cx+dx*c-dy*s, cy+dx*s+dy*c]; };
    // bonds: greedy within range, per-molecule limited by donor count
    if(hs){
      const cnt=new Map(); const pairs=[];
      for(let i=0;i<liq.length;i++) for(let j=i+1;j<liq.length;j++){ const a=place(liq[i]), b=place(liq[j]); const d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(d<u*(4.2+3*B.str)) pairs.push([d,i,j]); }
      pairs.sort((p,q)=>p[0]-q[0]);
      let nb=0;
      pairs.forEach(([d,i,j])=>{ const ci=cnt.get(i)||0, cj=cnt.get(j)||0; if(B.bonds===0||ci>=B.bonds||cj>=B.bonds) return;
        // weaker bonds break more readily when hot
        const keep=B.str*(1.25-(Tcur-285)/220); const hash=((i*7+j*13)%10)/10; if(hash>keep) return;
        cnt.set(i,ci+1); cnt.set(j,cj+1); nb++;
        const a=tp(liq[i],B.head), b=tp(liq[j],B.head); ctx.save(); ctx.setLineDash([4,3]); ctx.strokeStyle=COL.green; ctx.lineWidth=1.4+2.2*B.str; ctx.globalAlpha=0.9; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.restore(); });
    }
    mols.forEach(m=>{
      ctx.save(); ctx.globalAlpha=m.gas?0.95:1;
      B.ch.forEach(pl=>polyline(ctx,pl.map(p=>tp(m,p)),COL.ink,2));
      if(B.head){ const hp=tp(m,B.head); atomLbl(ctx,hp[0],hp[1],B.hd,B.hc,u*1.05); }
      ctx.restore();
    });
    ctx.restore();
    // flame
    const heat=clamp((Tt-Tcur)/40,0,1)+0.12;
    for(let i=0;i<3;i++) flame(ctx,bx+bw*(0.25+0.25*i),by+bh+u*3.2,bw*0.2,heat,t+i);
    // thermometer
    thermo(ctx,bx+bw+w*0.045,by+8,by+bh-34,(Tcur-280)/140,COL.ink,COL.red);
    textAt(ctx,fmt(Tcur,1)+' K',bx+bw+w*0.045,by+bh+26,{align:'center',size:12,weight:700,color:COL.red});
    // bp chart
    const gx=w*0.64, gy=h*0.16, gw=w*0.31, rowH=h*0.1;
    textAt(ctx,'Boiling point · K',gx,gy-14,{size:13,weight:700});
    const lo=290, hi=400, X=v=>gx+gw*(v-lo)/(hi-lo);
    BPS.forEach((b,i)=>{ const y=gy+i*rowH, on=i===cur;
      ctx.save(); ctx.globalAlpha=on?1:0.45; ctx.fillStyle=b.bar+'33'; ctx.strokeStyle=b.bar; ctx.lineWidth=on?2.6:1.6; ctx.fillRect(gx,y,X(b.bp)-gx,rowH*0.5); ctx.strokeRect(gx,y,X(b.bp)-gx,rowH*0.5); ctx.restore();
      textAt(ctx,b.f,gx,y+rowH*0.5+14,{size:11,weight:on?700:500,color:on?COL.ink:COL.muted}); textAt(ctx,fmt(b.bp,1),X(b.bp)+5,y+rowH*0.34,{size:11,weight:700,color:b.bar}); });
    line(ctx,X(clamp(Tcur,lo,hi)),gy-6,X(clamp(Tcur,lo,hi)),gy+5*rowH-4,COL.red,2,[5,4]);
    textAt(ctx,'now',X(clamp(Tcur,lo,hi)),gy+5*rowH+10,{align:'center',size:11,weight:700,color:COL.red});
    // headline
    banner(ctx,w,B.n,B.bonds===0&&B.id!=='a'?'no N–H : no H-bond to a neighbour':B.id==='a'?'no polar group : only weak dispersion forces':B.id==='ol'?'strongest H-bonds (O is more electronegative)':B.bonds===2?'two N–H : two H-bonds each':'one N–H : one H-bond',COL.blue);
    $('#thV').textContent=fmt(Tcur,0)+' K'; $('#bpV').textContent=fmt(B.bp,1)+' K'; $('#hbV').textContent=B.id==='a'?'0':B.bonds; $('#vV').textContent=Math.round(100*gasN/NM)+'%';
  });
  return wrap;
}

/* =====================================================================
   9.5 SOLUBILITY IN WATER
   Lower amines dissolve: N–H···O and O–H···N hydrogen bonds with water.
   The alkyl tail is hydrophobic, so solubility falls as carbons are added.
   Butan-1-ol is more soluble than butan-1-amine (O more electronegative).
   Aniline: big hydrophobic phenyl → essentially insoluble.
   ===================================================================== */
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Add to water</label>
      <div class="toggle-group" id="kB"><button class="toggle-btn active" data-k="am">R–NH₂</button><button class="toggle-btn" data-k="al">R–OH</button><button class="toggle-btn" data-k="an">Aniline</button></div></div>
    <div class="control-group" id="nBox"><label>Carbons in R <span class="val" id="nV"></span></label><input type="range" id="nR" min="1" max="10" step="1" value="2"></div>
    <button class="toggle-btn play" id="stirB" style="flex:0 0 auto;padding:10px;">⟳ Stir</button>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Dissolved</div><div class="rval" id="dV" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Verdict</div><div class="rval" id="vV">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), nR=$('#nR');
  let kind='am', t=0, stir=0;
  const NS=26, NW=110;
  const R=rng(5);
  const sol=Array.from({length:NS},(_,i)=>({r:(i+0.5)/NS,x:R(),y:0.3+R()*0.6,a:R()*6.28,va:0,vx:0,vy:0,tx:0,ty:0}));
  // shuffle ranks so dissolving happens evenly through the liquid
  for(let i=NS-1;i>0;i--){ const j=Math.floor(R()*(i+1)); const q=sol[i].r; sol[i].r=sol[j].r; sol[j].r=q; }
  const wat=Array.from({length:NW},()=>({x:R(),y:0.28+R()*0.7,a:R()*6.28}));
  const F={x:0.9,v:0};
  toggleWire(wrap.querySelectorAll('#kB button'),b=>{ kind=b.dataset.k; $('#nBox').style.opacity=kind==='an'?0.35:1; });
  $('#stirB').onclick=()=>{ stir=1.6; };
  const frac=(k,n)=>{ if(k==='an') return 0.03; const n0=k==='am'?4.2:5.0; return 1/(1+Math.exp((n-n0)*1.5)); };
  animLoop((dt)=>{
    t+=dt; stir=Math.max(0,stir-dt);
    const n0=+nR.value, nEff=kind==='an'?6:n0; $('#nV').textContent=n0;
    springTo(F,frac(kind,n0),24,8,dt);
    const f=clamp(F.x,0,1);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const u=clamp(Math.min(w*0.016,h*0.026),6,13);
    const bx=w*0.06, by=h*0.2, bw=w*0.52, bh=h*0.68, surf=0.38;
    // beaker
    ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.beginPath(); ctx.moveTo(bx-4,by-6); ctx.lineTo(bx-4,by+bh+4); ctx.lineTo(bx+bw+4,by+bh+4); ctx.lineTo(bx+bw+4,by-6); ctx.stroke(); ctx.restore();
    const sy=by+bh*surf;
    ctx.save(); ctx.beginPath(); ctx.rect(bx,by-10,bw,bh+4); ctx.clip();
    ctx.fillStyle='rgba(47,143,224,0.11)'; ctx.fillRect(bx,sy,bw,by+bh-sy);
    line(ctx,bx,sy+Math.sin(t*2)*1.2,bx+bw,sy-Math.sin(t*2)*1.2,COL.blue,1.8);
    // water
    wat.forEach((q,i)=>{ q.x+=Math.sin(t*1.7+i)*0.0009*(1+stir*4); q.y+=Math.cos(t*1.3+i*1.3)*0.0007*(1+stir*4); q.a+=0.01*(i%3-1); q.x=clamp(q.x,0.02,0.98); q.y=clamp(q.y,surf+0.04,0.98); });
    wat.forEach(q=>{ const X=bx+q.x*bw, Y=by+q.y*bh; ctx.save(); ctx.translate(X,Y); ctx.rotate(q.a); ctx.strokeStyle='#9cc4ea'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-u*0.45,u*0.3); ctx.lineTo(0,0); ctx.lineTo(u*0.45,u*0.3); ctx.stroke(); circ(ctx,0,0,u*0.2,'#9cc4ea','#fff',1.2); ctx.restore(); });
    // solute molecules
    let nd=0;
    const tail=Math.max(1,nEff);
    const col=kind==='al'?COL.red:COL.blue, hd=kind==='al'?'OH':'NH₂';
    const rowN=Math.max(1,Math.floor(bw/(u*(tail*0.87+3.4)))),
          layers=Math.ceil(NS/rowN);
    let oi=0;
    sol.forEach((m,i)=>{
      const dissolved=m.r<f; if(dissolved) nd++;
      if(dissolved){
        m.vx+=gauss()*0.8*dt*(1+stir*5); m.vy+=gauss()*0.8*dt*(1+stir*5); const s=Math.hypot(m.vx,m.vy), mx=0.06*(1+stir*3); if(s>mx){m.vx*=mx/s;m.vy*=mx/s;}
        m.x+=m.vx*dt*2; m.y+=m.vy*dt*2; m.va+=gauss()*2*dt; m.va*=0.96; m.a+=m.va*dt;
        const margin=(tail*0.87*u*0.5+u*1.5)/bw; if(m.x<margin){m.x=margin;m.vx=Math.abs(m.vx);} if(m.x>1-margin){m.x=1-margin;m.vx=-Math.abs(m.vx);}
        if(m.y<surf+0.1){m.y=surf+0.1;m.vy=Math.abs(m.vy);} if(m.y>0.93){m.y=0.93;m.vy=-Math.abs(m.vy);}
        m.tx=m.x; m.ty=m.y;
      } else {

        const k=oi++; const row=Math.floor(k/rowN), col2=k%rowN;
        const tx=(col2+0.5)/rowN, ty=surf-0.035-row*(u*1.6/bh);
        m.x=lerp(m.x,tx,1-Math.exp(-3.5*dt)); m.y=lerp(m.y,ty,1-Math.exp(-3.5*dt)); m.a=lerp(m.a,0,1-Math.exp(-4*dt)); m.va=0;
        m.y+=Math.sin(t*2+i)*0.0008; m.vx=m.vy=0;
      }
    });
    sol.forEach((m,i)=>{
      const X=bx+m.x*bw, Y=by+m.y*bh, dis=m.r<f;
      ctx.save(); ctx.translate(X,Y); ctx.rotate(m.a);
      const half=tail*0.87*u*0.5;

      polyline(ctx,pts,COL.ink,1.8); const hp=[half+0.5*u,0];

      line(ctx,pts[tail][0],pts[tail][1],hp[0],hp[1],COL.ink,1.8);
      ctx.restore();
      const c=Math.cos(m.a), s=Math.sin(m.a); const hx=X+(half+0.5*u)*c, hy=Y+(half+0.5*u)*s;
      atomLbl(ctx,hx,hy,hd,col,u*0.95);
      if(dis){ // hydration: dashed H-bonds to two nearest water molecules
        let best=[[1e9,null],[1e9,null]];
        wat.forEach(q=>{ const wx=bx+q.x*bw, wy=by+q.y*bh, d=Math.hypot(wx-hx,wy-hy); if(d<best[0][0]){best[1]=best[0]; best[0]=[d,[wx,wy]];} else if(d<best[1][0]) best[1]=[d,[wx,wy]]; });
        best.forEach(b=>{ if(b[1]&&b[0]<u*6){ ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle=COL.green; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(b[1][0],b[1][1]); ctx.stroke(); ctx.restore(); } });
      }
    });
    ctx.restore();
    // solubility gauge
    const gx=w*0.68, gy=h*0.22, gw=w*0.06, gh=h*0.58;
    ctx.save(); rrect(ctx,gx,gy,gw,gh,gw/2); ctx.fillStyle='#f6f9fc'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); ctx.clip();
    ctx.fillStyle='rgba(47,143,224,0.55)'; ctx.fillRect(gx,gy+gh*(1-f),gw,gh*f+2); ctx.restore();
    textAt(ctx,'dissolved',gx+gw/2,gy-10,{align:'center',size:12,weight:700,color:COL.blue});
    textAt(ctx,Math.round(f*100)+'%',gx+gw/2,gy+gh+22,{align:'center',size:16,weight:700,color:COL.blue});
    // right panel: structure labels
    const px=w*0.80;
    textAt(ctx,'— tail: hydrophobic',px,h*0.3,{size:12,weight:600,color:COL.ink});
    textAt(ctx,'● head: H-bonds to water',px,h*0.3+20,{size:12,weight:700,color:col});
    ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle=COL.green; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(px,h*0.3+48); ctx.lineTo(px+30,h*0.3+48); ctx.stroke(); ctx.restore();
    textAt(ctx,'H-bond',px+38,h*0.3+52,{size:12,weight:700,color:COL.green});
    banner(ctx,w,kind==='am'?'R–NH₂ in water':kind==='al'?'R–OH in water':'Aniline in water',kind==='an'?'phenyl ring is large and hydrophobic':'longer tail → less soluble',col);
    $('#dV').textContent=nd+' / '+NS; $('#vV').textContent=f>0.8?'Soluble':f>0.3?'Partly':'Insoluble';
  });

}

/* =====================================================================
   9.6 BASIC STRENGTH — pKb (Table 9.3)
   R–NH₂ + H₂O ⇌ R–NH₃⁺ + OH⁻ ,  Kb = [RNH₃⁺][OH⁻]/[RNH₂] ,  pKb = −log Kb
   For concentration C:  x = [OH⁻] = (−Kb + √(Kb² + 4·Kb·C)) / 2
   Check: NH₃ (pKb 4.75), C = 0.10 M → [OH⁻] = 1.3×10⁻³ M → pH 11.1 ✓
   Gas phase: only the +I effect acts → 3° > 2° > 1° > NH₃.
   ===================================================================== */
const AMN=[
  {n:'NH₃',               pkb:4.75, g:1, s:['H','H','H']},
  {n:'CH₃NH₂',            pkb:3.38, g:2, s:['Me','H','H']},
  {n:'(CH₃)₂NH',          pkb:3.27, g:3, s:['Me','Me','H']},
  {n:'(CH₃)₃N',           pkb:4.22, g:4, s:['Me','Me','Me']},
  {n:'C₂H₅NH₂',           pkb:3.29, g:2, s:['Et','H','H']},
  {n:'(C₂H₅)₂NH',         pkb:3.00, g:3, s:['Et','Et','H']},
  {n:'(C₂H₅)₃N',          pkb:3.25, g:4, s:['Et','Et','Et']},
  {n:'C₆H₅CH₂NH₂',        pkb:4.70, g:0, s:['Bn','H','H']},
  {n:'C₆H₅NH₂',           pkb:9.38, g:0, s:['Ph','H','H']},
  {n:'C₆H₅NHCH₃',         pkb:9.30, g:0, s:['Ph','Me','H']},
  {n:'C₆H₅N(CH₃)₂',       pkb:8.92, g:0, s:['Ph','Me','Me']},
];
function drawGroup(ctx,type,x,y,ang,u,alpha){
  const c=Math.cos(ang), s=Math.sin(ang);
  ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha;
  const P=(d,off)=>[x+c*d-s*(off||0), y+s*d+c*(off||0)];
  if(type==='H'){ const p=P(u*1.0); line(ctx,x,y,p[0],p[1],COL.ink,2.4); circ(ctx,p[0],p[1],u*0.24,COL.mid,'#fff',1.8); textAt(ctx,'H',p[0],p[1]+u*0.1,{align:'center',size:u*0.3,weight:700,color:COL.muted}); }
  else if(type==='Me'){ const p=P(u*1.0); line(ctx,x,y,p[0],p[1],COL.ink,2.4); circ(ctx,p[0],p[1],u*0.42,COL.ink,'#fff',2); textAt(ctx,'CH₃',p[0],p[1]+u*0.1,{align:'center',size:u*0.3,weight:700,color:COL.ink}); }
  else if(type==='Et'){ const p1=P(u*0.9), p2=P(u*1.75,u*0.45); polyline(ctx,[[x,y],p1,p2],COL.ink,2.4); circ(ctx,p1[0],p1[1],u*0.1,COL.ink,COL.ink,1); circ(ctx,p2[0],p2[1],u*0.42,COL.ink,'#fff',2); textAt(ctx,'CH₃',p2[0],p2[1]+u*0.1,{align:'center',size:u*0.3,weight:700,color:COL.ink}); }
  else if(type==='Ph'||type==='Bn'){ let a=u*1.0; if(type==='Bn'){ const p1=P(u*0.9); line(ctx,x,y,p1[0],p1[1],COL.ink,2.4); circ(ctx,p1[0],p1[1],u*0.1,COL.ink,COL.ink,1); a=u*0.9; }
    const R=u*0.62, cc=P(a+R), bx=P(a); if(type==='Ph') line(ctx,x,y,bx[0],bx[1],COL.ink,2.4); else line(ctx,P(u*0.9)[0],P(u*0.9)[1],bx[0],bx[1],COL.ink,2.4);
    benzRing(ctx,cc[0],cc[1],R,ang+Math.PI,COL.ink,2.2,[0,2,4]); }
  ctx.restore();
}
function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Amine</label><select id="aS">${AMN.map((a,i)=>`<option value="${i}">${a.n}   (pKb ${a.pkb})</option>`).join('')}</select></div>
    <div class="control-group"><label style="margin-bottom:6px;">Medium</label>
      <div class="toggle-group" id="mB"><button class="toggle-btn active" data-m="aq">Water</button><button class="toggle-btn" data-m="gas">Gas phase</button></div></div>
    <div class="control-group" id="cBox"><label>Concentration <span class="val" id="cV"></span></label><input type="range" id="cR" min="-2" max="0" step="0.05" value="-1"></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">pKb</div><div class="rval" id="kV" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">pH of solution</div><div class="rval" id="pV">—</div></div>
      <div class="rcard wide"><div class="rlabel">Ionised</div><div class="rval" id="iV" style="color:var(--f-green)">—</div></div></div>
      <p class="hint">Smaller pKb = stronger base</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), sel=$('#aS'), cR=$('#cR');
  sel.value=0; let cur=0, mode='aq', t=0;

  toggleWire(wrap.querySelectorAll('#mB button'),b=>{ mode=b.dataset.m; $('#cBox').style.opacity=mode==='gas'?0.35:1; });
  const NP=6, R0=rng(3);
  const prot=Array.from({length:NP},(_,i)=>({x:0,y:0,vx:0,vy:0,st:0,tb:0,cool:0,init:false}));
  const rows=AMN.map((a,i)=>({y:i*30,v:0,al:1}));
  animLoop((dt)=>{
    t+=dt;
    const A=AMN[cur], C=Math.pow(10,+cR.value), Kb=Math.pow(10,-A.pkb);
    $('#cV').textContent=fmt(C,2)+' M';
    const x=(-Kb+Math.sqrt(Kb*Kb+4*Kb*C))/2, pOH=-Math.log10(x), pH=14-pOH, alpha=x/C;
    const gasOK=A.g>0;
    const str=mode==='gas'?(gasOK?0.15+0.28*A.g:0.05):clamp((9.6-A.pkb)/6,0.06,1);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // ---- left: molecule in solution ----
    const bx=w*0.04, by=h*0.14, bw=w*0.5, bh=h*0.74, u=Math.min(bw*0.145,bh*0.17);
    ctx.save(); rrect(ctx,bx,by,bw,bh,22); ctx.fillStyle=mode==='aq'?'rgba(47,143,224,0.07)':'#fbfcfe'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
    const N=[bx+bw*0.5, by+bh*0.56];
    // substituents: left, right, down (lone pair up)
    const angs=[Math.PI*1.1, -Math.PI*0.1, Math.PI*0.5];

    A.s.forEach((g,i)=>drawGroup(ctx,g,N[0],N[1],angs[i],u,1));
    const LP=[N[0],N[1]-u*1.35];
    // lone-pair lobe (breathing)
    lobe(ctx,N[0],N[1],-Math.PI/2,u*1.1*(1+0.05*Math.sin(t*5)),COL.blue,0.2);
    // protons
    let bound=0;
    prot.forEach((p,i)=>{
      if(!p.init){ p.x=bx+bw*(0.1+0.8*R0()); p.y=by+bh*(0.1+0.8*R0()); p.vx=gauss()*30; p.vy=gauss()*30; p.init=true; }
      if(p.st===0){

        if(d<u*3.4 && p.cool<=0){ const F=str*9000/(d*d+u*u*0.8); p.vx+=dx/d*F*dt; p.vy+=dy/d*F*dt; }

        const sp=Math.hypot(p.vx,p.vy), mx=140; if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp;}
        p.x+=p.vx*dt; p.y+=p.vy*dt;
        const m=u*0.5; if(p.x<bx+m){p.x=bx+m;p.vx=Math.abs(p.vx);} if(p.x>bx+bw-m){p.x=bx+bw-m;p.vx=-Math.abs(p.vx);} if(p.y<by+m){p.y=by+m;p.vy=Math.abs(p.vy);} if(p.y>by+bh-m){p.y=by+bh-m;p.vy=-Math.abs(p.vy);}

  });

/* ---------------------------------------------------------------------
   0d. PRECIPITATE FLECKS — fall under gravity, bounce once, settle in a pile
   y: 0 = liquid surface · 1 = floor of the vessel (normalised)
   --------------------------------------------------------------------- */
function mkFlecks(n,seed){ const R=rng(seed); return Array.from({length:n},()=>({u:0.1+R()*0.8,y:0,vy:0,r:2.4+R()*2.2,rest:R(),on:false,du:0})); }
function stepFlecks(F,count,dt,swirl){
  F.forEach((f,i)=>{
    if(i>=count){ f.on=false; return; }
    if(!f.on){ f.on=true; f.y=Math.random()*0.3; f.vy=0; }
    f.vy+=1.5*dt; f.vy*=Math.exp(-1.3*dt);
    if(swirl>0.02){ f.vy+=gauss()*swirl*2.4*dt; f.du+=gauss()*swirl*0.9*dt; f.u+=f.du*dt; f.du*=0.9; }
    f.y+=f.vy*dt;
    const floor=1-0.025-0.07*f.rest;
    if(f.y>floor){ f.y=floor; f.vy=-Math.abs(f.vy)*0.28; if(Math.abs(f.vy)<0.03) f.vy=0; }
    if(f.y<0){ f.y=0; f.vy=Math.abs(f.vy); }
    f.u=clamp(f.u,0.06,0.94);
  });
}
function drawFlecks(ctx,F,x0,w,y0,h,col){
  F.forEach(f=>{ if(!f.on) return; const X=x0+f.u*w, Y=y0+f.y*h; ctx.beginPath(); ctx.moveTo(X-f.r,Y); ctx.lineTo(X,Y-f.r*0.8); ctx.lineTo(X+f.r,Y+f.r*0.2); ctx.lineTo(X,Y+f.r*0.8); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=col||'#8195ab'; ctx.lineWidth=1.1; ctx.stroke(); });
}
/** test-tube outline path (open top at y0, round bottom) */
function tubePath(ctx,x,y0,w,h){ const r=w/2; ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y0+h-r); ctx.arc(x+r,y0+h-r,r,Math.PI,0,true); ctx.lineTo(x+w,y0); }

  const TGT=[
    [ [.34,0,0,0,0], [.50,0,.00,.55,0.0], [.62,0,0,0,0], [.74,0,0,.18,.75] ],
    [ [.34,0,0,0,0], [.50,0,0,.45,.45], [.62,0,0,.15,.7], [.74,0,0,.15,.7] ],
    [ [.34,0,0,0,0], [.50,.35,.28,0,0], [.62,.40,.10,0,0], [.74,0,0,0,0] ]];
  const S=TT.map((x,i)=>({lv:{x:.34,v:0},oT:0,oB:0,tb:0,pp:0,fl:mkFlecks(46,10+i)}));
  function go(k){ if(k!==step+1) return; step=k; tS=0; swirl=1.0; ['s1','s2','s3'].forEach((id,i)=>{ $('#'+id).disabled=(i+1)!==step+1; }); }
  $('#s1').onclick=()=>go(1); $('#s2').onclick=()=>go(2); $('#s3').onclick=()=>go(3);
  $('#shB').onclick=()=>{ swirl=1.2; };
  $('#rsB').onclick=()=>{ step=0; tS=9; swirl=0; ['s1','s2','s3'].forEach((id,i)=>{ $('#'+id).disabled=i!==0; }); };
  const RESULT=[
    ['—','—','—'],
    ['sulphonamide','sulphonamide','no reaction'],
    ['dissolves','insoluble','amine layer'],
    ['precipitates','insoluble','dissolves']];
  const RCOL=[ [COL.mid,COL.mid,COL.mid],[COL.blue,COL.green,COL.red],[COL.green,COL.red,COL.yellow],[COL.red,COL.red,COL.green] ];
  animLoop((dt)=>{
    t+=dt; tS+=dt; swirl=Math.max(0,swirl-dt*0.55);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const tw=Math.min(w*0.13,h*0.2), th=h*0.40, ty0=h*0.26, gap=w*0.27, x0=w*0.1;
    const stepName=['Three amines, in water','Reagent added','NaOH added','HCl added'][step];
    banner(ctx,w,"Hinsberg's test",stepName,COL.red);
    TT.forEach((T,i)=>{
      const st=S[i], tg=TGT[i][Math.max(0,step)];
      const delay=tS>0.9?1:0; if(delay){ springTo(st.lv,tg[0],26,7,dt); st.oT=approach(st.oT,tg[1],1.6,dt); st.oB=approach(st.oB,tg[2],1.4,dt); st.tb=approach(st.tb,tg[3],1.1,dt); st.pp=approach(st.pp,tg[4],0.9,dt); }
      const X=x0+i*gap, W=tw, top=ty0;
      // dropper above (squeezes when a step starts)
      const sq=tS<1.4?Math.sin(clamp(tS/1.4,0,1)*Math.PI):0, pcol=[COL.yellow,COL.blue,COL.red][Math.max(0,step-1)];
      if(step>0){ ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; rrect(ctx,X+W/2-9,top-h*0.16,18,h*0.1,6); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(X+W/2-5,top-h*0.06); ctx.lineTo(X+W/2,top-h*0.025); ctx.lineTo(X+W/2+5,top-h*0.06); ctx.stroke();
        ctx.fillStyle=pcol; ctx.globalAlpha=0.35; ctx.fillRect(X+W/2-7,top-h*0.145+sq*3,14,h*0.08); ctx.restore();
        if(tS<1.1){ for(let k=0;k<3;k++){ const tt=tS-0.1-k*0.22; if(tt>0&&tt<0.5){ const yy=lerp(top-h*0.025,top+th*(1-st.lv.x*0.85)-th*0.0,tt*2); bubble(ctx,X+W/2,yy,3.2,pcol,1-tt); } } } }
      // vessel
      const liqTopY=top+th*(1-clamp(st.lv.x,0.05,0.95)*0.92);
      ctx.save(); tubePath(ctx,X,top,W,th); ctx.clip();
      // body of liquid
      ctx.fillStyle='rgba(47,143,224,0.12)'; ctx.fillRect(X,liqTopY,W,top+th-liqTopY);
      // milky turbidity
      ctx.fillStyle='rgba(250,250,255,'+(st.tb*0.8).toFixed(3)+')'; ctx.fillRect(X,liqTopY,W,top+th-liqTopY);
      // layers
      const lh=top+th-liqTopY;
      if(st.oT>0.01){ const hh=lh*0.28*st.oT/0.4; ctx.fillStyle='rgba(217,160,23,0.38)'; ctx.fillRect(X,liqTopY,W,hh); line(ctx,X,liqTopY+hh,X+W,liqTopY+hh+Math.sin(t*2+i)*1.2,COL.yellow,1.6); }
      if(st.oB>0.01){ const hh=lh*0.4*st.oB/0.28; ctx.fillStyle='rgba(217,160,23,0.5)'; ctx.fillRect(X,top+th-hh,W,hh); }
      // swirling flecks
      stepFlecks(st.fl,Math.round(st.pp*46),dt,swirl);
      drawFlecks(ctx,st.fl,X,W,liqTopY,top+th-liqTopY);
      // swirl streaks when shaking
      if(swirl>0.05){ ctx.save(); ctx.globalAlpha=Math.min(1,swirl); for(let k=0;k<5;k++){ const a=t*5+k*1.3; ctx.strokeStyle='rgba(47,143,224,0.4)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(X+W/2,liqTopY+lh*(0.2+0.14*k),W*0.3,a,a+1.4); ctx.stroke(); } ctx.restore(); }
      // surface
      line(ctx,X,liqTopY+Math.sin(t*3+i)*swirl*3,X+W,liqTopY-Math.sin(t*3+i)*swirl*3,COL.blue,1.8);
      ctx.restore();
      ctx.save(); tubePath(ctx,X,top,W,th); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.stroke(); ctx.restore();
      line(ctx,X-5,top,X+W+5,top,COL.ink,3);
      // labels
      const cb=top+th+h*0.03; rrect(ctx,X+W/2-34,cb,68,24,8); ctx.save(); ctx.fillStyle=T.col+'22'; ctx.fill(); ctx.strokeStyle=T.col; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore();
      textAt(ctx,T.k+' amine',X+W/2,cb+17,{align:'center',size:12,weight:700,color:T.col});
      const msg=RESULT[step][i]; textAt(ctx,msg,X+W/2,cb+44,{align:'center',size:12.5,weight:700,color:RCOL[step][i]});
      // product structure inset
      if(step>=1){ const cx=X+W/2, cy=cb+Math.max(h*0.17,86), k=Math.min(18,w*0.021); ctx.save(); ctx.globalAlpha=clamp(tS*1.2,0,1);
        if(i<2){ benzRing(ctx,cx-k*3,cy,k*0.9,Math.PI/2,COL.ink,2,[0,2,4]); line(ctx,cx-k*2.1,cy,cx-k*1.3,cy,COL.ink,2); atomLbl(ctx,cx-k*1.0,cy,'S',COL.yellow,k*0.9);
          atomLbl(ctx,cx-k*1.0,cy-k*1.15,'O',COL.red,k*0.7); atomLbl(ctx,cx-k*1.0,cy+k*1.15,'O',COL.red,k*0.7);
          line(ctx,cx-k*0.6,cy,cx+k*0.3,cy,COL.ink,2); atomLbl(ctx,cx+k*0.6,cy,'N',COL.blue,k*0.9);
          if(i===0){ line(ctx,cx+k*0.95,cy,cx+k*1.7,cy,COL.ink,2); atomLbl(ctx,cx+k*2.0,cy,'R',COL.ink,k*0.85); line(ctx,cx+k*0.6,cy+k*0.6,cx+k*0.6,cy+k*1.2,COL.green,2.2); atomLbl(ctx,cx+k*0.6,cy+k*1.5,'H',COL.green,k*0.8); textAt(ctx,'acidic',cx+k*1.3,cy+k*1.7,{size:10.5,weight:700,color:COL.green}); }
          else { line(ctx,cx+k*0.95,cy,cx+k*1.7,cy,COL.ink,2); atomLbl(ctx,cx+k*2.0,cy,'R',COL.ink,k*0.85); line(ctx,cx+k*0.6,cy+k*0.6,cx+k*0.6,cy+k*1.2,COL.ink,2); atomLbl(ctx,cx+k*0.6,cy+k*1.5,'R',COL.ink,k*0.85); textAt(ctx,'no N–H',cx+k*1.3,cy+k*1.7,{size:10.5,weight:700,color:COL.red}); } }
        else { atomLbl(ctx,cx,cy,'R₃N',COL.yellow,k*0.95); textAt(ctx,'no N–H · does not react',cx,cy+k*1.3,{align:'center',size:10.5,weight:700,color:COL.red}); }
        ctx.restore(); }
    });
    // result chips
    const rc=$('#rc'); rc.innerHTML=TT.map((T,i)=>`<div class="rcard"><div class="rlabel">${T.k}</div><div class="rval" style="font-size:11px;color:${RCOL[step][i]===COL.mid?'#8195ab':RCOL[step][i]}">${RESULT[step][i]}</div></div>`).join('');
  });
  return wrap;
}

/* =====================================================================
   9.9 CARBYLAMINE (ISOCYANIDE) TEST — primary amines only
   R–NH₂ + CHCl₃ + 3KOH → R–N≡C + 3KCl + 3H₂O   (foul smell)
   ===================================================================== */
function buildA9(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Amine in the flask</label>
      <div class="toggle-group" id="aB" style="flex-direction:column;gap:4px;">
        <button class="toggle-btn sm active" data-i="0" style="text-align:left;padding:7px 9px;">C₂H₅NH₂ · primary</button>
        <button class="toggle-btn sm" data-i="1" style="text-align:left;padding:7px 9px;">C₆H₅NH₂ · primary (aniline)</button>
        <button class="toggle-btn sm" data-i="2" style="text-align:left;padding:7px 9px;">(C₂H₅)₂NH · secondary</button>
        <button class="toggle-btn sm" data-i="3" style="text-align:left;padding:7px 9px;">(C₂H₅)₃N · tertiary</button></div></div>
    <button class="toggle-btn red" id="addB" style="flex:0 0 auto;padding:10px;">＋ CHCl₃ + alc. KOH</button>
    <div class="control-group"><label>Heat <span class="val" id="hV"></span></label><input type="range" id="hR" min="295" max="370" value="300"></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Smell</div><div class="rval" id="sV">—</div></div>
      <div class="rcard"><div class="rlabel">Test</div><div class="rval" id="tV">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), hR=$('#hR');
  const AM=[{p:true,R:'C₂H₅'},{p:true,R:'C₆H₅'},{p:false,R:'(C₂H₅)₂NH',sec:true},{p:false,R:'(C₂H₅)₃N'}];
  let cur=0, added=0, prog=0, t=0, Tf=298; const AD={x:0,v:0}; const stink=[]; const bub=[]; let nextS=0;
  toggleWire(wrap.querySelectorAll('#aB button'),b=>{ cur=+b.dataset.i; added=0; prog=0; stink.length=0; });
  $('#addB').onclick=()=>{ if(!added){ added=1; AD.x=0; AD.v=0; } };
  animLoop((dt)=>{
    t+=dt; const T=+hR.value; $('#hV').textContent=T+' K';
    Tf=approach(Tf,T,0.5,dt);
    const A=AM[cur];
    const k=clamp((Tf-318)/36,0,1);
    if(added&&A.p&&prog<1) prog=Math.min(1,prog+dt*0.2*k);
    if(added) springTo(AD,1,18,7,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    banner(ctx,w,'Carbylamine test','R–NH₂ + CHCl₃ + 3KOH → R–N≡C + 3KCl + 3H₂O',COL.red);
    // ---- flask ----
    const fr=Math.min(w*0.13,h*0.17), fx=w*0.27, fy=h*0.66;
    ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.beginPath(); ctx.arc(fx,fy,fr,-Math.PI*0.37,Math.PI*1.37); ctx.stroke(); ctx.restore();
    const nx1=fx-fr*0.27, nx2=fx+fr*0.27, nTop=fy-fr*2.0;
    line(ctx,nx1,fy-fr*0.96,nx1,nTop,COL.ink,3); line(ctx,nx2,fy-fr*0.96,nx2,nTop,COL.ink,3); line(ctx,nx1-5,nTop,nx2+5,nTop,COL.ink,3);
    // liquid
    const lvl=fy+fr*0.06;
    ctx.save(); ctx.beginPath(); ctx.arc(fx,fy,fr-2,0,Math.PI*2); ctx.clip();
    const tint=added?(A.p&&prog>0.5?'rgba(217,160,23,0.28)':'rgba(47,143,224,0.14)'):'rgba(47,143,224,0.10)';
    ctx.fillStyle=tint; ctx.fillRect(fx-fr,lvl-Math.sin(t*3)*0.8,fr*2,fr);
    line(ctx,fx-fr,lvl,fx+fr,lvl,COL.blue,1.6);
    // boiling bubbles
    if(Tf>315){ if(Math.random()<dt*(Tf-315)*0.8) bub.push({x:fx+(Math.random()-0.5)*fr*1.2,y:fy+fr*0.9,r:2+Math.random()*3}); }
    for(let i=bub.length-1;i>=0;i--){ const b=bub[i]; b.y-=dt*(40+Tf-300); b.x+=Math.sin(t*5+i)*0.4; bubble(ctx,b.x,b.y,b.r,COL.blue,0.8); if(b.y<lvl) bub.splice(i,1); }
    ctx.restore();
    // reagent drops
    if(added&&AD.x<0.97){ const dropY=lerp(nTop-fr*0.6,lvl,clamp(AD.x*1.2,0,1)); bubble(ctx,fx,dropY,4,COL.red,1-AD.x); }
    // flame
    const heat=clamp((T-295)/70,0,1);
    for(let i=0;i<3;i++) flame(ctx,fx+(i-1)*fr*0.55,fy+fr*1.18,fr*0.4,heat+0.1,t+i);
    line(ctx,fx-fr*1.2,fy+fr*1.2,fx+fr*1.2,fy+fr*1.2,COL.ink,2.4);
    // smell
    const smell=A.p?prog:0;
    nextS-=dt; if(smell>0.02&&nextS<=0){ stink.push({x:fx+(Math.random()-0.5)*fr*0.3,y:nTop,ph:Math.random()*6,a:1,drift:(Math.random()-0.2)*18}); nextS=0.5-0.4*smell; }
    for(let i=stink.length-1;i>=0;i--){ const s=stink[i]; s.y-=dt*(28+30*smell); s.x+=s.drift*dt; s.a-=dt*0.28; if(s.a<=0||s.y<-20){ stink.splice(i,1); continue; } wavy(ctx,s.x,s.y,22,5,s.ph+t*4,COL.green,2.4,s.a*Math.min(1,smell*1.3)); }
    // smell meter
    const mx=fx+fr*1.7, my=h*0.2, mh=h*0.44;
    ctx.save(); rrect(ctx,mx,my,14,mh,7); ctx.fillStyle='#f6f9fc'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.8; ctx.stroke(); ctx.clip(); ctx.fillStyle=COL.green; ctx.fillRect(mx,my+mh*(1-smell),14,mh*smell+2); ctx.restore();
    textAt(ctx,'smell',mx+7,my-8,{align:'center',size:11,weight:700,color:COL.green});
    // ---- molecular panel ----
    const cx=w*0.66, cy=h*0.5, u=Math.min(w*0.06,h*0.1);
    const Nx=cx-u*1.6, Ny=cy;
    // R group
    const R=A.sec?null:A.R;
    const strike=A.p?prog:0;
    // N–C bond order grows with progress
    atomLbl(ctx,Nx,Ny,'N',COL.blue,u*0.75);
    if(A.p){
      if(cur===1){ benzRing(ctx,Nx-u*2.2,Ny,u*0.75,0,COL.ink,2.6,[0,2,4]); line(ctx,Nx-u*1.45,Ny,Nx-u*0.4,Ny,COL.ink,2.6); }
      else { polyline(ctx,[[Nx-u*0.45,Ny],[Nx-u*1.35,Ny+u*0.5],[Nx-u*2.2,Ny],[Nx-u*3.05,Ny+u*0.5]],COL.ink,2.6); }
      // the two N–H leave as the reaction proceeds
      [[-0.4,-1.0],[0.45,-0.95]].forEach((p,i)=>{ const out=seg(strike,0.1+i*0.15,0.45+i*0.15); const hx=Nx+p[0]*u+out*u*(i?3:-3), hy=Ny+p[1]*u-out*u*2.2; ctx.save(); ctx.globalAlpha=1-out; line(ctx,Nx,Ny,hx,hy,COL.ink,2.2); circ(ctx,hx,hy,u*0.2,COL.red,'#fdece7',2); ctx.restore(); });
      // CHCl3 comes from the right
      const come=seg(added?AD.x:0,0,1)*(1-seg(strike,0.35,0.5)*0);
      const c0=[cx+u*4.2,cy-u*1.8], cC=[Nx+u*1.5,Ny];
      const cc=[lerp(c0[0],cC[0],clamp(AD.x*1.1,0,1)*seg(strike,-0.01,0.05)+0*0), lerp(c0[1],cC[1],clamp(AD.x*1.1,0,1))];
      if(added){
        const px=lerp(c0[0],cC[0],clamp(AD.x*1.05,0,1)), py=lerp(c0[1],cC[1],clamp(AD.x*1.05,0,1));
        const cl=Math.max(0,3-Math.floor(strike*3.6));        // Cl atoms still attached
        ctx.save(); ctx.globalAlpha=1;
        // C
        circ(ctx,px,py,u*0.2,COL.yellow,COL.yellow,2);
        // bond to N grows 1 → 3
        const ord=strike<0.34?1:strike<0.67?2:3;
        if(AD.x>0.85) bondN(ctx,Nx,Ny,px,py,strike>0.1?COL.green:COL.ink,2.4,ord,u*0.42,u*0.2);
        for(let q=0;q<3;q++){ const gone=strike>(q+1)*0.27+0.0; const ang=-Math.PI*0.25-q*Math.PI*0.5/1.0*0.5+q*0.5; const ox=px+Math.cos(-0.3-q*1.05)*u*1.0*(gone?1+seg(strike,(q+1)*0.27,(q+1)*0.27+0.2)*3:1), oy=py+Math.sin(-0.3-q*1.05)*u*1.0*(gone?1+seg(strike,(q+1)*0.27,(q+1)*0.27+0.2)*3:1)-(gone?seg(strike,(q+1)*0.27,(q+1)*0.27+0.2)*u*1.4:0);
          ctx.save(); ctx.globalAlpha=gone?clamp(1-seg(strike,(q+1)*0.27+0.1,(q+1)*0.27+0.4),0,1):1;
          if(!gone) line(ctx,px,py,ox,oy,COL.ink,2); atomLbl(ctx,ox,oy,gone?'Cl⁻':'Cl',COL.red,u*0.42); ctx.restore(); }
        ctx.restore();
        textAt(ctx,'CHCl₃',px+u*0.9,py+u*0.9,{size:11,weight:700,color:COL.mid,alpha:1-strike});
      }
      textAt(ctx,strike>0.95?'R–N≡C   isocyanide':'R–NH₂',cx,cy+u*3.4,{align:'center',size:15,weight:700,color:strike>0.95?COL.green:COL.ink});
    } else {
      // secondary / tertiary: nothing to lose from N, the reagent just bounces off
      const grp=A.sec?[['Et',200],['Et',-20],['H',90]]:[['Et',200],['Et',-20],['Et',90]];
      grp.forEach(([g,a])=>{ const aa=a*Math.PI/180; const ex=Nx+Math.cos(aa)*u*1.4, ey=Ny+Math.sin(aa)*u*1.4; line(ctx,Nx,Ny,ex,ey,COL.ink,2.4); if(g==='H'){ circ(ctx,ex,ey,u*0.2,COL.mid,'#fff',2); } else { polyline(ctx,[[ex,ey],[ex+Math.cos(aa+0.5)*u*0.9,ey+Math.sin(aa+0.5)*u*0.9]],COL.ink,2.4); } });
      lobe(ctx,Nx,Ny,-Math.PI/2,u*1.0,COL.blue,0.18);
      if(added){ const c0=[cx+u*4.2,cy-u*1.8], bnc=Math.abs(Math.sin(t*1.6))*clamp(AD.x,0,1); const px=lerp(c0[0],Nx+u*2.2,bnc), py=lerp(c0[1],Ny-u*0.4,bnc);
        circ(ctx,px,py,u*0.2,COL.yellow,COL.yellow,2); for(let q=0;q<3;q++) { const ox=px+Math.cos(-0.3-q*1.05)*u*0.9, oy=py+Math.sin(-0.3-q*1.05)*u*0.9; line(ctx,px,py,ox,oy,COL.ink,2); atomLbl(ctx,ox,oy,'Cl',COL.red,u*0.4); }
        textAt(ctx,'CHCl₃ bounces off',cx+u*0.3,cy+u*3.4,{align:'center',size:13,weight:700,color:COL.red}); }
      textAt(ctx,A.sec?'R₂NH · only one N–H':'R₃N · no N–H',cx,cy+u*4.3,{align:'center',size:14,weight:700,color:COL.ink});
    }
    $('#sV').textContent=!added?'—':A.p?(prog>0.6?'foul':prog>0.1?'faint':'none yet'):'none';
    $('#tV').textContent=!added?'—':A.p?(prog>0.6?'positive':'running…'):'negative';
  });
  return wrap;
}

/* =====================================================================
   9.10 DIAZOTISATION — KEEP IT COLD
   C₆H₅NH₂ + NaNO₂ + 2HCl →(273–278 K)→ C₆H₅N₂⁺Cl⁻ + NaCl + 2H₂O
   Warmed to ≥ 283 K the salt is hydrolysed: C₆H₅N₂⁺ + H₂O → C₆H₅OH + N₂↑ + H⁺
   Aliphatic primary amines give alkyldiazonium ions that are unstable at any
   temperature: R–NH₂ + HNO₂ → R–OH + N₂↑ (quantitative — used to estimate amino acids).
   Decomposition follows Arrhenius:  k(T) = k₁·exp[(Ea/R)(1/283.15 − 1/T)],
   Ea ≈ 120 kJ/mol, k₁ = 0.012 s⁻¹ on the compressed animation clock.
   0.010 mol amine → 0.010 mol N₂ = 224 mL at STP.
   ===================================================================== */
function buildA10(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Amine</label>
      <div class="toggle-group" id="kB"><button class="toggle-btn active" data-k="ar">Aromatic · C₆H₅NH₂</button><button class="toggle-btn" data-k="al">Aliphatic · C₂H₅NH₂</button></div></div>
    <div class="control-group"><label>Ice bath <span class="val" id="tV"></span></label><input type="range" id="tR" min="263" max="303" step="0.5" value="275"></div>
    <button class="toggle-btn red" id="addB" style="flex:0 0 auto;padding:10px;">＋ NaNO₂ + HCl</button>
    <button class="toggle-btn" id="rsB" style="flex:0 0 auto;padding:9px;">↺ Fresh flask</button>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">N₂ collected</div><div class="rval" id="gV" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Diazonium left</div><div class="rval" id="dV" style="color:var(--f-green)">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
