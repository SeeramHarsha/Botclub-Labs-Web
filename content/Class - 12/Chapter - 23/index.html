    ctx.restore(); line(ctx,fx,surf,fx+fw,surf,COL.blue,1.8);
    textAt(ctx,tri>0.02?'white ppt':excess>0.1?'orange: Br₂ left over':'Br₂ used up at once',fx+fw/2,fy+fh+22,{align:'center',size:12,weight:700,color:tri>0.02?COL.mid:excess>0.1?'#d9642c':COL.green});
    banner(ctx,w,'Bromination of aniline',free?'C₆H₅NH₂ + 3Br₂(aq) → C₆H₂Br₃NH₂ + 3HBr':hyd?'–NHCOCH₃ + H₂O → –NH₂':'NHCOCH₃ tames the ring',free?COL.red:COL.green);
    $('#hyB').disabled=!(prot&&!hyd&&b>=1);
    $('#pV').textContent=free?(b<0.03?'—':'2,4,6-tribromoaniline · '+Math.round(tri*100)+'% of aniline'):hyd?(b>=0.08?'p-bromoaniline':'—'):(b<0.08?'—':'p-bromoacetanilide (major) · o- trace');
  });
  return wrap;
}

/* =====================================================================
   9.12 DIAZONIUM SALTS — ONE GOOD LEAVING GROUP, MANY PRODUCTS
   N₂ is such a good leaving group that Ar–N₂⁺ swaps it for many groups:
     CuCl/HCl → ArCl · CuBr/HBr → ArBr · CuCN/KCN → ArCN   (Sandmeyer, Cu(I))
     KI → ArI · HBF₄ then heat → ArF · H₃PO₂ or C₂H₅OH → ArH
     H₂O at 283 K → ArOH · NaNO₂/Cu (from the BF₄⁻ salt) → ArNO₂
   ===================================================================== */
const REP=[
  {id:'cl', rg:'CuCl / HCl',          g:'Cl',  nm:'Chlorobenzene',   cu:true,  note:'Sandmeyer'},
  {id:'br', rg:'CuBr / HBr',          g:'Br',  nm:'Bromobenzene',    cu:true,  note:'Sandmeyer'},
  {id:'cn', rg:'CuCN / KCN',          g:'CN',  nm:'Benzonitrile',    cu:true,  note:'Sandmeyer'},
  {id:'i',  rg:'KI',                  g:'I',   nm:'Iodobenzene',     cu:false, note:'no catalyst needed'},
  {id:'f',  rg:'HBF₄, then heat',     g:'F',   nm:'Fluorobenzene',   cu:false, note:'via ArN₂⁺BF₄⁻'},
  {id:'h',  rg:'H₃PO₂ / H₂O',         g:'H',   nm:'Benzene',         cu:false, note:'reduction (or C₂H₅OH)'},
  {id:'oh', rg:'H₂O, warm to 283 K',  g:'OH',  nm:'Phenol',          cu:false, note:'hydrolysis'},
  {id:'no2',rg:'NaNO₂ / Cu',          g:'NO₂', nm:'Nitrobenzene',    cu:true,  note:'from the BF₄⁻ salt'},
];
function buildA12(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Reagent</label>
      <div class="toggle-group" id="rB">${REP.map((r,i)=>`<button class="toggle-btn sm${i===0?' active':''}" data-i="${i}" style="flex:1 1 44%;">${r.rg}</button>`).join('')}</div></div>
    <button class="toggle-btn red" id="goB" style="flex:0 0 auto;padding:10px;">▶ Add reagent</button>
    <button class="toggle-btn" id="rsB" style="flex:0 0 auto;padding:9px;">↺ Reset</button>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Product</div><div class="rval" id="pV" style="color:var(--f-green);font-size:12.5px">—</div></div>
      <div class="rcard"><div class="rlabel">Gas lost</div><div class="rval" id="gV" style="color:var(--f-blue)">N₂ ↑</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let cur=0, run=false, t=0, tt=0; const U={x:0,v:0};
  toggleWire(wrap.querySelectorAll('#rB button'),b=>{ cur=+b.dataset.i; run=false; U.x=0; U.v=0; tt=0; });
  $('#goB').onclick=()=>{ if(!run&&U.x<0.05){ run=true; tt=0; } };
  $('#rsB').onclick=()=>{ run=false; U.x=0; U.v=0; tt=0; };
  const cloud=Array.from({length:9},(_,i)=>({a:i*0.7,r:0.4+0.6*((i*37)%10)/10}));
  animLoop((dt)=>{
    t+=dt; if(run){ tt=Math.min(1,tt+dt/4.2); if(tt>=1) run=false; }
    springTo(U,tt,18,10,dt); const u=clamp(U.x,0,1);
    const Rg=REP[cur];
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const R=Math.min(w*0.09,h*0.15), rx=w*0.3, ry=h*0.52;
    const Vp=hexV(rx,ry,R,0,0);
    const appr=seg(u,0.02,0.45), leave=seg(u,0.4,0.78), att=seg(u,0.5,0.9);
    banner(ctx,w,'Ar–N₂⁺  →  Ar–'+Rg.g+'  +  N₂↑',Rg.rg+'  ·  '+Rg.note,Rg.cu?COL.green:COL.blue);
    // ring
    benzRing(ctx,rx,ry,R,0,att>0.95?COL.green:COL.ink,2.8,[1,3,5]);
    // diazonium group (blue) — leaves
    const b1=[Vp[0]+R*0.85,Vp[1]], dN=leave*leave*R*7;      // N₂ accelerates away (x = ½at²)
    const N1=[b1[0]+dN,b1[1]-leave*R*2.4*leave], N2=[N1[0]+R*0.9,N1[1]];
    const nAl=1-clamp(leave*1.1-0.1,0,1);
    ctx.save(); ctx.globalAlpha=Math.max(0,nAl);
    if(leave<0.12) line(ctx,Vp[0],Vp[1],b1[0],b1[1],COL.ink,2.8);
    else { ctx.globalAlpha=Math.max(0,1-leave*1.6)*0.9; ctx.setLineDash([4,4]); line(ctx,Vp[0],Vp[1],b1[0]+dN*0.4,b1[1],COL.ink,2.2); ctx.setLineDash([]); ctx.globalAlpha=Math.max(0,nAl); }
    bondN(ctx,N1[0],N1[1],N2[0],N2[1],COL.blue,2.4,3,R*0.18,R*0.18); atomLbl(ctx,N1[0],N1[1],'N',COL.blue,R*0.34); atomLbl(ctx,N2[0],N2[1],'N',COL.blue,R*0.34);
    if(leave<0.5) plusSign(ctx,N2[0]+R*0.3,N2[1]-R*0.4,R*0.12,COL.green);
    ctx.restore();
    if(leave>0.15){ ctx.save(); ctx.globalAlpha=clamp(leave*2,0,1)*(1-clamp((leave-0.8)*5,0,1)); textAt(ctx,'N₂ ↑',N2[0]+R*0.6,N2[1]-R*0.25,{size:14,weight:800,color:COL.blue}); ctx.restore(); }
    // reagent cloud + incoming nucleophile
    const cc=[w*0.78,h*0.28];
    cloud.forEach((c,i)=>{ const a=c.a+t*0.9, rr=R*(0.5+c.r*1.1); circ(ctx,cc[0]+Math.cos(a)*rr*1.5,cc[1]+Math.sin(a*1.3)*rr*0.9,R*0.13,COL.yellow,'#fff6d6',1.8); });
    textAt(ctx,Rg.rg,cc[0],cc[1]+R*2.0,{align:'center',size:12,weight:700,color:COL.yellow});
    const target=[Vp[0]+R*0.95+(Rg.g==='NO₂'||Rg.g==='CN'?R*0.18:0),Vp[1]];
    const wp=[lerp(cc[0],target[0]+R*2.6,appr),lerp(cc[1],target[1]-R*1.7,appr)];
    const pos=[lerp(wp[0],target[0],att)+Math.sin(att*Math.PI)*R*0.35, lerp(wp[1],target[1],att)];
    if(u>0.01){
      if(Rg.cu&&att>0.02&&att<0.95){ for(let k=0;k<2;k++){ const a=t*5+k*Math.PI; circ(ctx,pos[0]+Math.cos(a)*R*0.55,pos[1]+Math.sin(a)*R*0.55,R*0.12,COL.yellow,COL.yellow,1.4); } textAt(ctx,'Cu⁺',pos[0]+R*0.7,pos[1]-R*0.6,{size:11,weight:700,color:COL.yellow,alpha:Math.sin(att*Math.PI)}); }
      if(att>0.5) line(ctx,Vp[0],Vp[1],pos[0],pos[1],COL.green,3.2*seg(att,0.5,0.9));
      atomLbl(ctx,pos[0],pos[1],Rg.g,att>0.9?COL.green:COL.yellow,R*(Rg.g.length>1?0.34:0.4));
    }
    // product caption
    textAt(ctx,att>0.95?Rg.nm:'Benzenediazonium ion',w*0.06,h*0.86,{size:Math.min(24,w*0.032),weight:700,color:att>0.95?COL.green:COL.ink});
    if(att>0.95) textAt(ctx,'C₆H₅–'+Rg.g,w*0.06,h*0.86+24,{size:15,weight:700,color:COL.mid});
    $('#pV').textContent=att>0.95?Rg.nm:'—';
  });
  return wrap;
}

/* =====================================================================
   9.13 AZO COUPLING — A DYE IS BORN
   C₆H₅N₂⁺Cl⁻ + C₆H₅OH → C₆H₅–N=N–C₆H₄–OH (p-hydroxyazobenzene, orange) + HCl
   C₆H₅N₂⁺Cl⁻ + C₆H₅NH₂ → C₆H₅–N=N–C₆H₄–NH₂ (p-aminoazobenzene, yellow)
   Electrophilic substitution at the para position; the new N=N bridge joins
   both rings into one long conjugated system, which absorbs visible light.
   ===================================================================== */
function buildA13(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Coupling partner</label>
      <div class="toggle-group" id="pB"><button class="toggle-btn active" data-p="ph">Phenol</button><button class="toggle-btn" data-p="an">Aniline</button></div></div>
    <div class="control-group"><label>Bring the rings together <span class="val" id="gV"></span></label><input type="range" id="gR" min="0" max="100" value="0"></div>
    <button class="toggle-btn play" id="dipB" style="flex:0 0 auto;padding:10px;">⇩ Dip a white cloth</button>
    <div class="control-group"><div class="result-cards">
      <div class="rcard wide"><div class="rlabel">Product</div><div class="rval" id="pV" style="font-size:12.5px;color:var(--f-green)">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), gR=$('#gR');
  let kind='ph', t=0, dip=0, upt=0, soak=0;
  const G={x:0,v:0}, C={x:0,v:0}, CL={x:0,v:0}; let hPuff=null;
  toggleWire(wrap.querySelectorAll('#pB button'),b=>{ kind=b.dataset.p; upt=0; soak=0; });
  $('#dipB').onclick=()=>{ dip=dip?0:1; $('#dipB').textContent=dip?'⇧ Lift the cloth':'⇩ Dip a white cloth'; };
  animLoop((dt)=>{
    t+=dt;
    const g=+gR.value/100; $('#gV').textContent=Math.round(g*100)+'%';
    springTo(G,g,26,9,dt); const gg=clamp(G.x,0,1.05);
    const c=seg(gg,0.82,1.0); C.x=approach(C.x,c,5,dt); const cp=C.x;
    const col=kind==='ph'?'#e8782a':'#e0b81a', name=kind==='ph'?'p-Hydroxyazobenzene · orange':'p-Aminoazobenzene · yellow';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    banner(ctx,w,'Coupling reaction',kind==='ph'?'ArN₂⁺ + C₆H₅OH → Ar–N=N–C₆H₄–OH + H⁺':'ArN₂⁺ + C₆H₅NH₂ → Ar–N=N–C₆H₄–NH₂ + H⁺',COL.red);
    const R=Math.min(w*0.075,h*0.12), ay=h*0.34, ax=w*0.14;
    const Cp=hexV(ax,ay,R,0,0), N1=[Cp[0]+R*0.75,ay], N2=[N1[0]+R*0.85,ay];
    const near=N2[0]+R*0.75+R, far=near+R*3.6, bx=lerp(far,near,clamp(gg,0,1));
    const bl=hexV(bx,ay,R,0,3), br=hexV(bx,ay,R,0,0);
    // conjugation glow (appears when the rings are joined)
    if(cp>0.02){ ctx.save(); ctx.lineCap='round'; ctx.lineWidth=R*0.9; ctx.strokeStyle=col; ctx.globalAlpha=0.25*cp; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx+R*1.1,ay); ctx.stroke();
      ctx.restore(); for(let k=0;k<5;k++){ const q=((t*0.35+k/5)%1), X=lerp(ax-R*0.6,bx+R*1.2,q); circ(ctx,X,ay+Math.sin(t*6+k)*R*0.18,3,col,col,1); } }
    benzRing(ctx,ax,ay,R,0,COL.ink,2.8,[1,3,5]);
    line(ctx,Cp[0],Cp[1],N1[0],N1[1],COL.ink,2.6);
    const ord=cp<0.5?3:2;
    bondN(ctx,N1[0],N1[1],N2[0],N2[1],cp>0.3?COL.green:COL.blue,2.4,ord,R*0.16,R*0.16);
    atomLbl(ctx,N1[0],N1[1],'N',COL.blue,R*0.34); atomLbl(ctx,N2[0],N2[1],'N',COL.blue,R*0.34);
    if(cp<0.5) plusSign(ctx,N2[0]+R*0.28,N2[1]-R*0.4,R*0.12,COL.green);
    // partner ring
    benzRing(ctx,bx,ay,R,0,cp>0.7?COL.green:COL.ink,2.8,[1,3,5]);
    line(ctx,br[0],br[1],br[0]+R*0.5,br[1],COL.ink,2.6); atomLbl(ctx,br[0]+R*1.0,br[1],kind==='ph'?'OH':'NH₂',kind==='ph'?COL.red:COL.blue,R*0.34);
    // bond N2–C(para) forms; the para H leaves as H⁺
    if(cp>0.02){ ctx.save(); ctx.globalAlpha=clamp(cp*1.5,0,1); line(ctx,N2[0],N2[1],bl[0],bl[1],COL.green,3); ctx.restore(); }
    const hk=1-clamp(cp*1.6,0,1);
    if(hk>0.01||cp<1){ const hx=lerp(bl[0]-R*1.2,bl[0]-R*0.45,hk), hy=lerp(bl[1]-R*1.8,bl[1]-R*0.0,hk)+0; if(cp<0.99){ if(hk>0.02){ line(ctx,bl[0],bl[1],bl[0]-R*0.4*hk,bl[1],COL.ink,2.2); circ(ctx,bl[0]-R*0.55*hk-R*0.15,bl[1],R*0.12,COL.red,'#fdece7',2); } else { protonDot(ctx,hx,hy,R*0.18,1-cp); } } }
    // ---- beaker + cloth ----
    const bxL=w*0.1, byT=h*0.68, bwL=w*0.28, bhL=h*0.24;
    springTo(CL,dip,14,6,dt);
    const cl=clamp(CL.x,-0.1,1.1);
    // liquid
    ctx.save(); ctx.beginPath(); ctx.rect(bxL+2,byT+bhL*0.2,bwL-4,bhL*0.8-2); ctx.clip();
    ctx.fillStyle='rgba(47,143,224,0.07)'; ctx.fillRect(bxL,byT,bwL,bhL); ctx.globalAlpha=0.1+0.4*cp; ctx.fillStyle=col; ctx.fillRect(bxL,byT+bhL*0.2,bwL,bhL); ctx.restore();
    line(ctx,bxL,byT+bhL*0.2,bxL+bwL,byT+bhL*0.2,cp>0.1?col:COL.blue,1.8);
    // cloth hanging from a rod, dips as CL→1
    const cw=bwL*0.34, cx=bxL+bwL*0.5-cw/2, rodY=byT-h*0.12, clothH=Math.max(30,h*0.12+0.2*bhL-14), y0=lerp(rodY+6,byT+bhL*0.88-clothH,cl);
    line(ctx,cx-14,rodY,cx+cw+14,rodY,COL.ink,3.4);
    const surfY2=byT+bhL*0.2, submerged=clamp((y0+clothH-surfY2)/clothH,0,1);
    soak=Math.max(soak,submerged);
    if(submerged>0.05) upt=Math.min(1,upt+dt*0.3*cp);
    ctx.save(); ctx.fillStyle="#fff"; ctx.fillRect(cx,y0,cw,clothH);
    ctx.globalAlpha=0.92*upt; ctx.fillStyle=col; ctx.fillRect(cx,y0+clothH*(1-soak),cw,clothH*soak); ctx.globalAlpha=1;
    ctx.beginPath(); for(let i=1;i<6;i++){ ctx.moveTo(cx,y0+clothH*i/6); ctx.lineTo(cx+cw,y0+clothH*i/6); } ctx.strokeStyle="rgba(19,42,68,0.22)"; ctx.lineWidth=1; ctx.stroke(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.strokeRect(cx,y0,cw,clothH); ctx.restore();
    const dye=upt;
    // liquid in front of the submerged part
    ctx.save(); ctx.beginPath(); ctx.rect(bxL+2,surfY2,bwL-4,bhL*0.8-2); ctx.clip(); ctx.globalAlpha=0.22+0.3*cp; ctx.fillStyle=cp>0.05?col:"#2f8fe0"; ctx.fillRect(bxL,surfY2,bwL,bhL); ctx.restore();
    // beaker glass (front wall)
    ctx.save(); ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.beginPath(); ctx.moveTo(bxL-3,byT-4); ctx.lineTo(bxL-3,byT+bhL+3); ctx.lineTo(bxL+bwL+3,byT+bhL+3); ctx.lineTo(bxL+bwL+3,byT-4); ctx.stroke(); ctx.restore();
    textAt(ctx,'dye bath',bxL+bwL/2,byT+bhL+24,{align:'center',size:12,weight:700,color:COL.muted});
    textAt(ctx,dye>0.3?'cloth takes up the dye':'white cloth',cx+cw+22,rodY+30,{size:12,weight:700,color:dye>0.3?col:COL.mid});
    // swatch + name
    const sx=w*0.52, sy=h*0.62;
    ctx.save(); rrect(ctx,sx,sy,w*0.4,h*0.24,14); ctx.fillStyle='#f6f9fc'; ctx.fill(); ctx.strokeStyle='#dbe4f0'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
    ctx.save(); ctx.globalAlpha=0.12+0.88*cp; rrect(ctx,sx+16,sy+16,w*0.08,h*0.24-32,10); ctx.fillStyle=col; ctx.fill(); ctx.restore();
    textAt(ctx,cp>0.9?name:'colourless — no dye yet',sx+w*0.08+32,sy+h*0.12,{size:Math.min(16,w*0.019),weight:700,color:cp>0.9?col:COL.mid});
    textAt(ctx,cp>0.9?'long conjugated system':'rings still apart',sx+w*0.08+32,sy+h*0.12+20,{size:12,weight:600,color:COL.muted});
    $('#pV').textContent=cp>0.9?name:'—';
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   1. ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const activities = [
  { num:'9.1', title:'Shape & Classes', desc:'Swap H for R · flip the pyramid', build: buildA1 },
  { num:'9.2', title:'Ammonolysis', desc:'Excess NH₃ rescues the primary amine', build: buildA2 },
  { num:'9.3', title:'Carbon Ladder', desc:'Nitrile up · Hoffmann down', build: buildA3 },
  { num:'9.4', title:'Boiling Points', desc:'Heat it · count the hydrogen bonds', build: buildA4 },
  { num:'9.5', title:'Solubility', desc:'Lengthen the tail · watch it leave the water', build: buildA5 },
  { num:'9.6', title:'Basic Strength', desc:'Lone pair vs H⁺ · pKb ranking', build: buildA6 },
  { num:'9.7', title:'Why Aniline Is Weak', desc:'Lone pair leaks into the ring', build: buildA7 },
  { num:'9.8', title:"Hinsberg's Test", desc:'1° · 2° · 3° in three tubes', build: buildA8 },
  { num:'9.9', title:'Carbylamine Test', desc:'Only primary amines stink', build: buildA9 },
  { num:'9.10', title:'Diazotisation', desc:'Keep it cold · or lose N₂', build: buildA10 },
  { num:'9.11', title:'Bromination', desc:'Free –NH₂ vs protected', build: buildA11 },
  { num:'9.12', title:'Diazonium Swaps', desc:'N₂ leaves · a new group lands', build: buildA12 },
  { num:'9.13', title:'Azo Coupling', desc:'Join two rings · make a dye', build: buildA13 },
];
let currentIndex = 0;
function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}
window.addEventListener('load',()=>{ const q=parseInt((location.hash||'').slice(1)); if(q>=0&&q<activities.length) currentIndex=q; render(); });
render();
