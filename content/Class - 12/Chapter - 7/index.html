<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}
.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{ flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px); display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5; }
.topbar .brand-badge{ width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center; font-size:clamp(15px,1.3vw,20px); flex:0 0 auto; }
.topbar .chip{ display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px; }
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center; flex-wrap:wrap;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}
.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{ flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border); overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px; }
.nav-item{ display:flex; align-items:center; gap:8px; text-align:left; width:100%; border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease; }
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:34px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}
.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}
.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn:hover{border-color:var(--navy-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.act{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
@media (max-width:1000px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:360px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}

<div class="app">
  <div class="topbar">
    <div class="brand-badge">⚡</div>
    <div>
      <div class="chip">Grade 12 · Physics Part 1 · Ch 7</div>
      <h1>Alternating Current</h1>
    </div>
    <div class="spacer"></div>
    <div class="legend">
      <span><i style="background:var(--f-yellow)"></i>Supply voltage v</span>
      <span><i style="background:var(--f-blue)"></i>Current i</span>
      <span><i style="background:var(--f-red)"></i>Resistor · power</span>
      <span><i style="background:var(--f-green)"></i>Inductor · field</span>
      <span><i style="background:#a9c4e4;border:1px solid #fff"></i>Capacitor</span>
    </div>

      <div class="panel-body" id="panelBody"></div>
    </main>

<script>
/* =========================================================================
   GRADE 12 — CHAPTER 7: ALTERNATING CURRENT
   Every scene runs a continuous loop. Sliders and buttons only set TARGETS;
   parameters ease toward them, springs settle, charges slosh back and forth
   as the real integral of i(t). Motion is slowed so a 50 Hz supply is
   watchable; reactances, phases and powers use the real frequency.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', navy:'#1a3a5c', muted:'#4c6178', mid:'#8195ab', grid:'#dbe4f0'};
const TAU = Math.PI*2;

/* ---------- canvas + drawing helpers ---------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width,head){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,head||8); }
function textAt(ctx,txt,x,y,o){
  o=o||{}; ctx.save(); ctx.font=(o.weight||600)+' '+(o.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=o.color||COL.ink; ctx.textAlign=o.align||'left'; ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!==undefined) ctx.globalAlpha=o.alpha; ctx.fillText(txt,x,y); ctx.restore();
}
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,TAU); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.stroke();} ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }

/* ---------- animation engine ---------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now(), raf;
  function frame(now){ const dt = Math.max(0, Math.min(0.04, (now-last)/1000)); last = now; tick(dt); raf = requestAnimationFrame(frame); }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf); activeStops.push(stop); return stop;
}
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
function springTo(s,target,k,damping,dt){ s.v += ((target-s.x)*k - s.v*damping)*dt; s.x += s.v*dt; return s.x; }
function toggleWire(btns,cb){ btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); }); }
/* visual rotation rate (cycles per second) — a slowed-down stand-in for f */
function rateOf(f){ return clamp(0.5*Math.sqrt(f/50),0.15,1.3); }

/* ---------- physics: series R-L-C driven by v = Vm sin(wt); i = Im sin(wt - phi) ---------- */
function solve(p){
  const w=TAU*p.f, XL=w*(p.L||0), XC=(p.C>0&&isFinite(p.C))?1/(w*p.C):0, X=XL-XC;
  const Z=Math.hypot(p.R,X), Vm=p.V*Math.SQRT2, Im=Vm/Z, Irms=p.V/Z;
  return {w,XL,XC,X,Z,Vm,Im,Irms,phi:Math.atan2(X,p.R),pf:p.R/Z,P:Irms*Irms*p.R};
}

/* ---------- UI builders ---------- */
const activities = [];
function labShell(){ const wrap=document.createElement('div'); wrap.className='lab-view'; wrap.innerHTML=`<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`; return wrap; }
function sl(id,label,min,max,step,val){ return `<div class="control-group"><label>${label}<span class="val" id="${id}V"></span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`; }
function seg(id,title,opts){ return `<div class="control-group"><label>${title}</label><div class="toggle-group" id="${id}">`+opts.map((o,i)=>`<button class="toggle-btn${i?'':' active'}" data-v="${o[0]}">${o[1]}</button>`).join('')+`</div></div>`; }
function btns(id,title,opts){ return `<div class="control-group">${title?`<label>${title}</label>`:''}<div class="toggle-group" id="${id}">`+opts.map(o=>`<button class="toggle-btn" data-v="${o[0]}">${o[1]}</button>`).join('')+`</div></div>`; }
function cards(list){ return `<div class="control-group"><div class="result-cards">`+list.map(c=>`<div class="rcard"><div class="rlabel">${c[1]}</div><div class="rval" id="${c[0]}" style="${c[2]?'color:'+c[2]:''}">—</div></div>`).join('')+`</div></div>`; }
function mkUI(wrap){
  const $=s=>wrap.querySelector(s);
  return {$, canvas:$('canvas'), val:id=>parseFloat($('#'+id).value), set:(id,v)=>{$('#'+id).value=v;}, txt:(id,s)=>{ const e=$('#'+id); if(e) e.textContent=s; }};
}

/* ---------- history scope (newest sample at the left edge, waves flow right) ---------- */
class Scope{
  constructor(span){this.span=span; this.s=[];}
  push(t,v){ this.s.push([t].concat(v)); while(this.s.length && t-this.s[0][0]>this.span+0.3) this.s.shift(); }
}
function drawScope(ctx,sc,tNow,x,y,w,h,defs,o){
  o=o||{}; const zf=o.zero===undefined?0.5:o.zero, cy=y+h*zf, Au=cy-y-9, Ad=y+h-cy-9;
  ctx.save(); rrect(ctx,x,y,w,h,8); ctx.fillStyle='#fbfcfe'; ctx.fill(); ctx.strokeStyle=COL.grid; ctx.lineWidth=1.2; ctx.stroke(); ctx.clip();
  line(ctx,x,cy,x+w,cy,COL.mid,1,[5,4]);
  const S=sc.s, PX=s=>x+(tNow-s[0])/sc.span*w;
  defs.forEach(d=>{
    if(S.length<2) return;
    const py=v=>cy-(v>0?Au:Ad)*clamp(v*(d.gain||1),-1.05,1.05);
    if(d.fill){
      ctx.beginPath(); S.forEach((s,i)=>i?ctx.lineTo(PX(s),py(s[d.i])):ctx.moveTo(PX(s),py(s[d.i])));
      ctx.lineTo(PX(S[S.length-1]),cy); ctx.lineTo(PX(S[0]),cy); ctx.closePath();
      ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,cy-y); ctx.clip(); ctx.beginPath(); S.forEach((s,i)=>i?ctx.lineTo(PX(s),py(s[d.i])):ctx.moveTo(PX(s),py(s[d.i]))); ctx.lineTo(PX(S[S.length-1]),cy); ctx.lineTo(PX(S[0]),cy); ctx.closePath(); ctx.fillStyle=d.fill[0]; ctx.fill(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.rect(x,cy,w,y+h-cy); ctx.clip(); ctx.beginPath(); S.forEach((s,i)=>i?ctx.lineTo(PX(s),py(s[d.i])):ctx.moveTo(PX(s),py(s[d.i]))); ctx.lineTo(PX(S[S.length-1]),cy); ctx.lineTo(PX(S[0]),cy); ctx.closePath(); ctx.fillStyle=d.fill[1]; ctx.fill(); ctx.restore();
    }
    ctx.beginPath(); S.forEach((s,i)=>i?ctx.lineTo(PX(s),py(s[d.i])):ctx.moveTo(PX(s),py(s[d.i])));
    ctx.strokeStyle=d.color; ctx.lineWidth=d.lw||2.6; ctx.lineJoin='round'; ctx.stroke();
    if(d.mean!==undefined){ const my=py(d.mean); line(ctx,x,my,x+w,my,d.meanColor||COL.yellow,2,[8,5]); textAt(ctx,d.meanLabel||'',x+w-8,my-5,{align:'right',size:11,weight:700,color:d.meanColor||COL.yellow}); }
  });
  line(ctx,x+1,y,x+1,y+h,COL.ink,2);
  let lx=x+12; defs.forEach(d=>{ if(!d.label) return; line(ctx,lx,y+13,lx+16,y+13,d.color,3); textAt(ctx,d.label,lx+21,y+17,{size:11,color:d.color,weight:700}); lx+=34+d.label.length*6.4; });
  ctx.restore();
}

/* ---------- phasor wheel ---------- */
function drawPhasors(ctx,cx,cy,R,th,list,projX,o){
  o=o||{}; ctx.save(); if(o.alpha!==undefined) ctx.globalAlpha=o.alpha;
  circ(ctx,cx,cy,R,COL.grid,'#fbfcfe',1.4);
  line(ctx,cx-R-6,cy,cx+R+6,cy,COL.mid,1); line(ctx,cx,cy-R-6,cx,cy+R+6,COL.mid,1);
  list.forEach(p=>{
    const a=th+p.off, tx=cx+p.len*R*Math.cos(a), ty=cy-p.len*R*Math.sin(a);
    if(p.proj && projX!==undefined){ line(ctx,tx,ty,projX,ty,p.color,1.3,[4,4]); line(ctx,tx,ty,tx,cy,p.color,1.1,[3,4]); circ(ctx,projX,ty,3.4,p.color,p.color,1); }
  });
  list.forEach(p=>{
    const a=th+p.off, tx=cx+p.len*R*Math.cos(a), ty=cy-p.len*R*Math.sin(a);
    if(p.dash) line(ctx,cx,cy,tx,ty,p.color,2,[5,4]); else vec(ctx,cx,cy,tx,ty,p.color,p.w||3,9);
    if(p.label) textAt(ctx,p.label,tx+Math.cos(a)*11,ty-Math.sin(a)*11+4,{size:12,color:p.color,align:'center',weight:700});
  });
  circ(ctx,cx,cy,3.4,COL.ink,COL.ink,1); ctx.restore();
}
function arcBetween(ctx,cx,cy,r,a1,a2,color,label){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
  for(let i=0;i<=24;i++){ const a=lerp(a1,a2,i/24); const x=cx+r*Math.cos(a), y=cy-r*Math.sin(a); i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke(); ctx.restore();
  if(label){ const m=(a1+a2)/2; textAt(ctx,label,cx+(r+12)*Math.cos(m),cy-(r+12)*Math.sin(m)+4,{size:12,color,align:'center',weight:700}); }
}
/* phasor wheel on the left + scope on the right, inside a band [yp, yp+Hp] */
function bottomBand(ctx,w,yp,Hp,th,phasors,sc,t,defs,o){
  o=o||{}; const R=Math.min(Hp/2-16,w*0.14), cx=16+R+8, cy=yp+Hp/2, sx=cx+R+34;
  drawPhasors(ctx,cx,cy,R,th,phasors,sx+1,o);
  textAt(ctx,'phasors',cx,yp+8,{align:'center',size:10.5,color:COL.mid});
  drawScope(ctx,sc,t,sx,yp,w-sx-12,Hp,defs,{zero:0.5});
  return {cx,cy,R,sx};
}

/* ---------- wire loop with sloshing charge carriers ---------- */
function mkLoop(x0,y0,x1,y1){
  const pts=[[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]], seg=[]; let T=0;
  for(let i=0;i<4;i++){ const L=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]); seg.push([T,L,pts[i],pts[i+1]]); T+=L; }
  return {x0,y0,x1,y1,total:T,at(s){ s=((s%T)+T)%T; for(const q of seg){ if(s<=q[0]+q[1]) { const u=(s-q[0])/q[1]; return [lerp(q[2][0],q[3][0],u),lerp(q[2][1],q[3][1],u)]; } } return pts[0]; }};
}
function drawWire(ctx,lp){ ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.strokeRect(lp.x0,lp.y0,lp.x1-lp.x0,lp.y1-lp.y0); ctx.restore(); }
function drawDots(ctx,lp,disp,spacing){
  const n=Math.max(6,Math.round(lp.total/(spacing||17)));
  ctx.save(); ctx.fillStyle=COL.blue; ctx.strokeStyle='#fff'; ctx.lineWidth=1;
  for(let j=0;j<n;j++){ const p=lp.at(j*lp.total/n+disp); ctx.beginPath(); ctx.arc(p[0],p[1],3.8,0,TAU); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}

/* ---------- components ---------- */
function drawSource(ctx,x,y,r,dc,th){
  circ(ctx,x,y,r,COL.yellow,'#fff',4);
  ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.beginPath();

function drawBulb(ctx,x,y,r,b,t,zig,heat){

/* =====================================================================
   7.2  AC VOLTAGE APPLIED TO A RESISTOR
   i = v/R in phase.  P = V²/R.  Textbook check (Example 7.1): 100 W, 220 V
   → R = 484 Ω, vm = 311 V, Irms = 0.454 A.
   ===================================================================== */
function buildResistor(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    seg('src','Supply',[['ac','AC'],['dc','DC']]) +
    sl('V','Voltage (rms)',20,250,1,220) + sl('R','Resistance R',50,1000,1,484) + sl('f','Frequency f',10,200,1,50) +
    btns('pre','',[['b','100 W bulb · 220 V']]) +
    cards([['cVm','Peak vm','var(--f-yellow)'],['cIm','Peak im','var(--f-blue)'],['cIr','Irms','var(--f-blue)'],['cP','Power P','var(--f-red)']]) +
    `<p class="hint">P = V²/R · motion slowed for viewing</p>`;
  const {$,canvas,val,set,txt}=mkUI(wrap);
  let dc=false, t=0, th=0, mix=0, drift=0, iScale=-1; const E={V:val('V'),R:val('R'),f:val('f')}; const sc=new Scope(3.6);
  toggleWire(wrap.querySelectorAll('#src button'),b=>{dc=b.dataset.v==='dc';});
  $('#pre button').onclick=()=>{ set('V',220); set('R',484); set('f',50); };
  animLoop(dt=>{
    t+=dt; ['V','R','f'].forEach(k=>{E[k]=approach(E[k],val(k),7,dt);}); mix=approach(mix,dc?1:0,5,dt);
    th+=TAU*rateOf(E.f)*dt*(1-mix);
    const Vm=E.V*Math.SQRT2, Irms=E.V/E.R, Im=Irms*Math.SQRT2, P=E.V*E.V/E.R;
    const vN=((1-mix)*Math.sin(th)*Vm+mix*E.V)/354, iInst=(vN*354)/E.R;
    iScale=iScale<0?Math.max(Im,0.05):approach(iScale,Math.max(Im,0.05),3,dt); sc.push(t,[vN,iInst/iScale*0.8]);
    txt('VV',fmt(val('V'),0)+' V'); txt('RV',fmt(val('R'),0)+' Ω'); txt('fV',fmt(val('f'),0)+' Hz');
    txt('cVm',fmt(Vm,0)+' V'); txt('cIm',fmt(Im,2)+' A'); txt('cIr',fmt(Irms,3)+' A'); txt('cP',fmt(P,0)+' W');
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const Hs=h*0.56, lp=mkLoop(w*0.1,Hs*0.2,w*0.84,Hs-14);
    drift+=mix*60*clamp(Irms/2.5,0.1,1)*dt;
    const A=10+42*clamp(Irms/2.5,0.06,1);
    drawWire(ctx,lp); drawDots(ctx,lp,(1-mix)*(-A*Math.cos(th))+drift);
    const ym=(lp.y0+lp.y1)/2, r=Math.min(Hs*0.2,52);
    drawSource(ctx,lp.x0,ym,r*0.55,mix,th); textAt(ctx,dc?'DC':'AC',lp.x0+r*0.8,ym+4,{size:12,color:COL.yellow});
    const flick=1+0.1*(1-mix)*Math.cos(2*th);
    drawBulb(ctx,lp.x1,ym,r,clamp(P/150,0,1)*flick,t,3+E.R/130,true);
    textAt(ctx,'R',lp.x1+r+10,ym+4,{size:13,color:COL.red});
    bottomBand(ctx,w,Hs+6,h-Hs-14,th,[{len:0.95*clamp(E.V/250,0.12,1),off:0,color:COL.yellow,label:'v',proj:true},{len:0.72*clamp(E.V/250,0.12,1)+0.06,off:0,color:COL.blue,label:'i',proj:true,w:2.6}],sc,t,
      [{i:1,color:COL.yellow,label:'v'},{i:2,color:COL.blue,label:'i'}],{alpha:1-0.7*mix});
  });

}

/* =====================================================================
   7.3  PHASORS — rotating vectors whose vertical component is v or i

    txt('cTx',phiT===0?'in phase with v':(phiT>0?'lags v by 90°':'leads v by 90°'));

/* =====================================================================
   7.4  AC VOLTAGE APPLIED TO AN INDUCTOR
   XL = ωL;  i lags v by π/2.  Example 7.5: an iron rod pushed into the coil
   raises L, raises XL, and the bulb in series dims.
   ===================================================================== */
function buildInductor(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    btns('core','Iron core',[['0','Pull out'],['100','Push in']]) +
    sl('ins','Core position',0,100,1,0) + sl('L','Coil L',20,200,1,100) + sl('f','Frequency f',10,200,1,50) + sl('V','Voltage (rms)',50,250,1,200) +
    cards([['cXL','Reactance XL','var(--f-green)'],['cZ','Impedance Z',null],['cIr','Irms','var(--f-blue)'],['cPh','i lags v by','var(--f-red)']]) +
    `<p class="hint">XL = ωL · bulb is 60 Ω</p>`;
  const {$,canvas,val,set,txt}=mkUI(wrap);
  $('#core button[data-v="0"]').onclick=()=>set('ins',0); $('#core button[data-v="100"]').onclick=()=>set('ins',100);
  let t=0, th=0, fOff=0, iScale=-1; const E={V:val('V'),f:val('f'),L:val('L')}; const K={x:0,v:0}; const sc=new Scope(3.6);
  animLoop(dt=>{
    t+=dt; ['V','f','L'].forEach(k=>{E[k]=approach(E[k],val(k),7,dt);}); springTo(K,val('ins')/100,34,8,dt);
    const Ke=clamp(K.x,0,1.04), Leff=E.L/1000*(1+7*Ke);
    const S=solve({R:60,L:Leff,C:0,f:E.f,V:E.V}); th+=TAU*rateOf(E.f)*dt;
    const iInst=S.Im*Math.sin(th-S.phi); iScale=iScale<0?S.Im:approach(iScale,S.Im,3,dt);
    sc.push(t,[S.Vm*Math.sin(th)/354,0.8*iInst/iScale]);
    txt('VV',fmt(val('V'),0)+' V'); txt('LV',fmt(val('L'),0)+' mH'); txt('fV',fmt(val('f'),0)+' Hz'); txt('insV',fmt(val('ins'),0)+' %');
    txt('cXL',fmt(S.XL,1)+' Ω'); txt('cZ',fmt(S.Z,1)+' Ω'); txt('cIr',fmt(S.Irms,2)+' A'); txt('cPh',fmt(S.phi*180/Math.PI,0)+'°');
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const Hs=h*0.58, lp=mkLoop(w*0.07,Hs*0.44,w*0.93,Hs-12), ym=(lp.y0+lp.y1)/2;
    const cL=w*0.44, cLen=w*0.34, cH=Hs*0.22, r=Math.min(Hs*0.16,46);
    // magnetic field around the coil (green): strength ∝ sin φ, direction follows i
    const Bn=S.X/S.Z*(0.4+0.6*E.V/250), Bt=Math.sin(th-S.phi)*Bn, sgn=Math.sign(iInst)||1;
    fOff+=sgn*Math.abs(Bt)*90*dt;
    for(let k=1;k<=2;k++){ const rx=cLen/2+14+k*28, ry=cH/2+6+k*15;
      ctx.save(); ctx.globalAlpha=clamp(Math.abs(Bt)*1.2,0,1)*(k===1?1:0.7); ctx.strokeStyle=COL.green; ctx.lineWidth=1.6+2*Math.abs(Bt); ctx.setLineDash([9,7]); ctx.lineDashOffset=-fOff*(k===1?1:0.8);
      ctx.beginPath(); ctx.ellipse(cL,lp.y0,rx,ry,0,0,TAU); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.globalAlpha=clamp(Math.abs(Bt)*1.4,0,1); for(const sy of [-1,1]) arrowHead(ctx,cL,lp.y0+sy*ry,sgn>0?Math.PI:0,COL.green,6+7*Math.abs(Bt)); ctx.restore(); }
    drawWire(ctx,lp);
    const A=10+36*clamp(S.Irms/4.5,0.05,1);
    drawDots(ctx,lp,-A*Math.cos(th-S.phi)*1);
    // coil + iron core (springs in with overshoot)
    const coreX=lerp(cL-cLen*0.98,cL,Ke), coreY=lerp(lp.y0-cH*1.7,lp.y0,Math.pow(Ke,0.8));

    drawSource(ctx,lp.x0,ym,r*0.6,0,th);
    const b=clamp(S.P/(230*230/60),0,1)*(1+0.08*Math.cos(2*th-2*S.phi));
    drawBulb(ctx,lp.x1,ym,r,b,t,4,false);
    bottomBand(ctx,w,Hs+6,h-Hs-14,th,[{len:0.95*clamp(S.Vm/354,0.15,1),off:0,color:COL.yellow,label:'V',proj:true},{len:0.75,off:-S.phi,color:COL.blue,label:'I',proj:true}],sc,t,
      [{i:1,color:COL.yellow,label:'v'},{i:2,color:COL.blue,label:'i'}]);
  });
  return wrap;
}

/* =====================================================================
   7.5  AC VOLTAGE APPLIED TO A CAPACITOR
   XC = 1/ωC;  i leads v by π/2.  Example 7.4: 15 µF, 220 V, 50 Hz →
   XC = 212 Ω, Irms = 1.04 A.  Example 7.3: lamp glows on ac, not on dc.
   ===================================================================== */
function buildCapacitor(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    seg('src','Supply',[['ac','AC'],['dc','DC']]) +
    sl('C','Capacitance C',5,60,0.5,15) + sl('f','Frequency f',10,200,1,50) + sl('V','Voltage (rms)',50,250,1,220) +
    btns('sl','Dielectric slab',[['0','Pull out'],['1','Slide in']]) +
    cards([['cXC','Reactance XC','#1a3a5c'],['cIr','Irms','var(--f-blue)'],['cIm','Peak im','var(--f-blue)'],['cPh','i leads v by','var(--f-red)']]) +
    `<p class="hint">XC = 1/ωC · lamp 5 Ω · slab K = 5</p>`;
  const {$,canvas,val,set,txt}=mkUI(wrap);
  let dc=false, t=0, th=0, mix=0, vcS=0, slabT=0, iScale=-1; const E={V:val('V'),f:val('f'),C:val('C')}; const SL={x:0,v:0}; const sc=new Scope(3.6);
  toggleWire(wrap.querySelectorAll('#src button'),b=>{dc=b.dataset.v==='dc';});
  wrap.querySelectorAll('#sl button').forEach(b=>b.onclick=()=>{slabT=+b.dataset.v;});
  let iDC=0, qAcc=0, drift=0;
  animLoop(dt=>{
    t+=dt; ['V','f','C'].forEach(k=>{E[k]=approach(E[k],val(k),7,dt);}); mix=approach(mix,dc?1:0,6,dt);
    springTo(SL,slabT,30,7,dt); const se=clamp(SL.x,0,1.05), Ceff=E.C*1e-6*(1+4*se);
    const S=solve({R:5,L:0,C:Ceff,f:E.f,V:E.V}); th+=TAU*rateOf(E.f)*dt*(1-mix*0.0);
    const vAC=S.Vm*Math.sin(th), iAC=S.Im*Math.sin(th-S.phi), vcAC=-S.Im*S.XC*Math.cos(th-S.phi);
    // dc branch: capacitor charges through the lamp, current dies away (RC compressed to ~0.4 s)
    const tau=0.12+0.6*Ceff/300e-6;
    if(dc){ vcS+=((E.V-vcS)/tau)*dt; iDC=(E.V-vcS)/5; } else { vcS=vcAC; iDC=iAC; }
    const vNow=dc?E.V:vAC, iNow=iDC, vc=dc?vcS:vcAC;
    iScale=iScale<0?S.Im:approach(iScale,S.Im,3,dt);
    sc.push(t,[vNow/354,0.8*iNow/iScale]);
    txt('VV',fmt(val('V'),0)+' V'); txt('CV',fmt(val('C'),1)+' µF'); txt('fV',fmt(val('f'),0)+' Hz');
    txt('cXC',dc?'∞':fmt(S.XC,0)+' Ω'); txt('cIr',dc?fmt(Math.abs(iNow),2)+' A':fmt(S.Irms,2)+' A'); txt('cIm',dc?'—':fmt(S.Im,2)+' A'); txt('cPh',dc?'—':'90°');
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const Hs=h*0.58, lp=mkLoop(w*0.07,Hs*0.3,w*0.93,Hs-12), ym=(lp.y0+lp.y1)/2, r=Math.min(Hs*0.16,46);
    drawWire(ctx,lp);
    const A=10+36*clamp(Math.abs(dc?iNow:S.Irms)/2.5,0.04,1);
    if(dc){ qAcc+=(iNow/5)*0.0; drift+=iNow*18*dt; drawDots(ctx,lp,drift); } else drawDots(ctx,lp,-A*Math.cos(th-S.phi));
    // capacitor plates with charge and field
    const cx=w*0.45, gap=Math.min(78,w*0.1), ph=Hs*0.34, y0=lp.y0-ph/2;
    ctx.save(); ctx.fillStyle='#fff'; ctx.fillRect(cx-gap/2-12,y0-4,gap+24,ph+8); ctx.restore();
    // slab slides in from above
    const slabY=lerp(y0-ph-34,y0,Math.min(se,1));
    if(se>0.02){ ctx.save(); rrect(ctx,cx-gap/2+5,slabY,gap-10,ph,3); ctx.fillStyle='rgba(47,143,224,0.13)'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.8; ctx.setLineDash([5,3]); ctx.stroke(); ctx.restore();
      const pol=clamp(Math.abs(vc)/300,0,1)*se; for(let k=0;k<5;k++){ const yy=slabY+ph*(k+0.5)/5, dx=Math.sign(vc)*pol*6; circ(ctx,cx-6+dx,yy,3,COL.red,'#fff',1.3); circ(ctx,cx+6+dx,yy,3,COL.blue,'#fff',1.3); } }
    const plateL=(x)=>{ ctx.save(); ctx.fillStyle=COL.navy; ctx.fillRect(x-4,y0,8,ph); ctx.restore(); };
    plateL(cx-gap/2); plateL(cx+gap/2);
    const qn=Math.sqrt(clamp(Math.abs(Ceff*vc)/0.02,0,1)), sgnq=Math.sign(vc)||1;
    for(let j=0;j<8;j++){ const al=clamp(qn*8.5-j,0,1); if(al<=0) continue; const yy=y0+ph*(j+0.5)/8;
      textAt(ctx,sgnq>0?'+':'−',cx-gap/2-15,yy+5,{size:15,align:'center',color:sgnq>0?COL.red:COL.blue,alpha:al,weight:700});
      textAt(ctx,sgnq>0?'−':'+',cx+gap/2+15,yy+5,{size:15,align:'center',color:sgnq>0?COL.blue:COL.red,alpha:al,weight:700}); }
    const fa=clamp(Math.abs(vc)/330,0,1);
    if(fa>0.04) for(let k=0;k<3;k++){ const yy=y0+ph*(k+1)/4, L=(gap-24)*fa; const a=cx-L/2*sgnq, b2=cx+L/2*sgnq; vec(ctx,a,yy,b2,yy,COL.green,2.2,7); }

/* ---------- series L-C-R loop shared by 7.6 and 7.6.2 ---------- */
function drawLCRLoop(ctx,w,Hs,S,th,t,E,sc,bulbMode){
  const lp=mkLoop(w*0.07,Hs*0.46,w*0.76,Hs-12), ym=(lp.y0+lp.y1)/2, r=Math.min(Hs*0.15,42);
  drawWire(ctx,lp);
  const A=10+38*clamp(Math.log10(1+S.Irms)/Math.log10(1+75),0.04,1);
  drawDots(ctx,lp,-A*Math.cos(th-S.phi));
  const cH=Hs*0.18, Lx=lp.x0+(lp.x1-lp.x0)*0.30, Cx=lp.x0+(lp.x1-lp.x0)*0.68, GH=Math.max(30,Math.min(Hs*0.3,lp.y0-cH/2-12-24));
  const iph=th-S.phi;
  drawCoil(ctx,Lx,lp.y0,(lp.x1-lp.x0)*0.22,cH,7,COL.green); textAt(ctx,'L',Lx,lp.y0+cH/2+20,{align:'center',size:13,color:COL.green});
  const gap=22, py=cH*1.05;
  ctx.save(); ctx.fillStyle='#fff'; ctx.fillRect(Cx-gap/2-8,lp.y0-py/2-3,gap+16,py+6); ctx.restore();
  ctx.save(); ctx.fillStyle=COL.navy; ctx.fillRect(Cx-gap/2-3,lp.y0-py/2,6,py); ctx.fillRect(Cx+gap/2-3,lp.y0-py/2,6,py); ctx.restore();
  textAt(ctx,'C',Cx,lp.y0+py/2+20,{align:'center',size:13,color:COL.navy});
  drawSource(ctx,lp.x0,ym,r*0.6,0,th);
  const sc2=Math.max(S.Vm,S.Im*S.R,S.Im*S.XL,S.Im*S.XC)*1.05;
  const vR=S.Im*S.R*Math.sin(iph), vL=S.Im*S.XL*Math.cos(iph), vC=-S.Im*S.XC*Math.cos(iph);
  const gt=lp.y0-cH/2-12-GH;
  gauge(ctx,Lx,gt,GH,vL/sc2,COL.green,'VL'); gauge(ctx,Cx,gt,GH,vC/sc2,COL.navy,'VC');
  const rx=lp.x1;
  if(bulbMode){ const b=clamp(S.pf*S.pf,0,1)*(1+0.06*Math.cos(2*iph)); drawBulb(ctx,rx,ym,r,b,t,4,true); }
  else { ctx.save(); ctx.fillStyle='#fff'; ctx.fillRect(rx-14,ym-r*1.1,28,r*2.2); ctx.restore(); ctx.save(); ctx.translate(rx,ym); ctx.rotate(Math.PI/2); drawZig(ctx,-r*1.1,0,r*1.1,9,COL.red,5,3); ctx.restore();
    const hb=clamp(S.P/9000,0,1); for(let k=0;k<3;k++){ ctx.save(); ctx.strokeStyle='rgba(217,67,43,'+(0.7*hb).toFixed(2)+')'; ctx.lineWidth=2; ctx.beginPath(); for(let j=0;j<=12;j++){ const u=j/12; const xx=rx+26+k*10+Math.sin(u*8+t*5+k)*3, yy=ym+r*0.9-u*r*1.8; j?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);} ctx.stroke(); ctx.restore(); } }
  textAt(ctx,'R',rx-r-10,ym+4,{align:'right',size:13,color:COL.red});
  gauge(ctx,w*0.9,ym-GH/2,GH,vR/sc2,COL.red,'VR',true);
  return {lp,sc2,vR,vL,vC,iph};
}

    drawSource(ctx,lp.x0,ym,r*0.7,0,th);

    const vs=E.V*E.Ns/E.Np; txt('cVs',fmt(vs,0)+' V'); txt('cTy',Math.abs(val('Ns')-val('Np'))<1?'1 : 1':(val('Ns')>val('Np')?'step-up':'step-down')); txt('cIp',fmt(Ip,1)+' A'); txt('cIs',fmt(Is,1)+' A');
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const Hs=h*0.66, cx=w*0.5, cw=Math.min(w*0.2,190), T=Math.min(Hs*0.13,44);
    const cy0=Hs*0.1, cy1=Hs*0.86, X0=cx-cw, X1=cx+cw;
    // core (double outline) + flux
    ctx.save(); ctx.beginPath(); ctx.rect(X0-T/2,cy0,2*cw+T,cy1-cy0); ctx.rect(X0+T/2,cy0+T,2*cw-T,cy1-cy0-2*T); ctx.fillStyle='rgba(205,214,226,0.9)'; ctx.fill('evenodd'); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
    ctx.strokeStyle='rgba(19,42,68,0.22)'; ctx.lineWidth=1; for(let k=1;k<4;k++){ ctx.strokeRect(X0-T/2+k*T/4,cy0+k*T/4,2*cw+T-k*T/2,cy1-cy0-k*T/2); } ctx.restore();
    const phiN=clamp((E.V/(E.Np*50))/(220/(100*50)),0,1.4), phiT=-Math.cos(th)*phiN, fs=Math.sign(phiT)||1;
    fOff+=phiT*55*dt;
    const fx0=X0, fx1=X1, fy0=cy0+T/2, fy1=cy1-T/2, per=2*(fx1-fx0)+2*(fy1-fy0);
    ctx.save(); ctx.strokeStyle=COL.red; ctx.globalAlpha=clamp(Math.abs(phiT)*0.9+0.08,0,1); ctx.lineWidth=2+3*Math.abs(phiT); ctx.setLineDash([12,9]); ctx.lineDashOffset=-fOff; ctx.strokeRect(fx0,fy0,fx1-fx0,fy1-fy0); ctx.restore();
    ctx.save(); ctx.globalAlpha=clamp(Math.abs(phiT)*1.2,0,1); const hs=7+9*Math.abs(phiT);
    arrowHead(ctx,cx,fy0,fs>0?0:Math.PI,COL.red,hs); arrowHead(ctx,cx,fy1,fs>0?Math.PI:0,COL.red,hs); arrowHead(ctx,fx1,(fy0+fy1)/2,fs>0?Math.PI/2:-Math.PI/2,COL.red,hs); arrowHead(ctx,fx0,(fy0+fy1)/2,fs>0?-Math.PI/2:Math.PI/2,COL.red,hs); ctx.restore();
    textAt(ctx,'flux Φ',cx,cy0+T+26,{align:'center',size:12,color:COL.red});
    // circuits
    const ctop=cy0+T*1.4, cbot=cy1-T*1.4, rxl=T/2+8;
    const pcx=X0, scx=X1;
    const lpP=mkLoop(w*0.09,ctop,pcx-rxl,cbot), lpS=mkLoop(scx+rxl,ctop,w*0.91,cbot);
    drawWire(ctx,lpP); drawWire(ctx,lpS);
    const AP=8+30*Math.pow(clamp(Ip/22,0,1),0.6), AS=8+30*Math.pow(clamp(Is/22,0,1),0.6);
    drawDots(ctx,lpP,-AP*Math.cos(th),16); drawDots(ctx,lpS,-AS*Math.cos(th),16);
    const nP=Math.round(clamp(E.Np/25,2,16)), nS=Math.round(clamp(E.Ns/25,1,16));
    const coilV=(x,n,col)=>{ const y0=ctop, y1=cbot, p=(y1-y0)/n; ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=3;
      for(let i=0;i<n;i++){ ctx.beginPath(); ctx.ellipse(x,y0+p*(i+0.5),rxl,Math.min(7,p*0.45),0,0,TAU); ctx.stroke(); } ctx.restore(); };
    coilV(pcx,nP,COL.yellow); coilV(scx,nS,COL.green);
    drawSource(ctx,lpP.x0,(ctop+cbot)/2,Math.min(26,Hs*0.07),0,th);
    const bm=1-Math.exp(-Vs*Is/700);
    drawBulb(ctx,lpS.x1,(ctop+cbot)/2,Math.min(Hs*0.12,40),bm,t,4,true);
    textAt(ctx,'Np = '+fmt(val('Np'),0),pcx,cy1+22,{align:'center',size:13,color:COL.yellow});
    textAt(ctx,'Ns = '+fmt(val('Ns'),0),scx,cy1+22,{align:'center',size:13,color:COL.green});
    textAt(ctx,fmt(E.V,0)+' V',lpP.x0+30,ctop-8,{size:12,color:COL.yellow}); textAt(ctx,fmt(Vs,0)+' V',lpS.x1-30,ctop-8,{align:'right',size:12,color:COL.green});
    drawScope(ctx,sc,t,12,Hs+22,w-24,h-Hs-34,[{i:1,color:COL.yellow,label:'vp (primary)'},{i:2,color:COL.green,label:'vs (secondary)'}]);
  });
  return wrap;
}
