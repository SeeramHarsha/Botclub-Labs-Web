<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 12 · Part 1 · Chapter 3 — Current Electricity | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}
.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}
.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}
.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}
.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.control-group label + .toggle-group{margin-top:7px;}
.toggle-group:first-child{margin-top:0;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn:hover{background:var(--surface-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.go{background:var(--f-yellow); border-color:var(--f-yellow); color:#fff;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px; white-space:nowrap;}
.rcard.wide{grid-column:1/-1;}
.rcard.wide .rval{white-space:normal;}
.fb{font-size:var(--fs-xs); font-weight:600; padding:5px 8px; border-radius:7px; min-height:26px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.fb.off{display:none;}
.hidden{display:none !important;}
@media (max-width:1000px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:360px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<div class="app">
  <div class="topbar">
    <div class="brand-badge">⚡</div>
    <div>
      <div class="chip">Grade 12 · Part 1 · Ch 3</div>
      <h1>Current Electricity</h1>
    </div>
    <div class="spacer"></div>
    <div class="legend">
      <span><i style="background:var(--f-yellow)"></i>What you change</span>
      <span><i style="background:var(--f-blue)"></i>Electrons · Measured</span>
      <span><i style="background:var(--f-green)"></i>Field · Voltage · Result</span>
      <span><i style="background:var(--f-red)"></i>Current · Heat</span>
    </div>
  </div>
  <div class="body-wrap">
    <nav class="sidenav" id="sideNav"></nav>
    <main class="content">
      <div class="panel-head">
        <div class="panel-badge" id="panelBadge">3.1</div>

        <p id="panelDesc"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </main>
  </div>
</div>
<script>
/* =========================================================================
   GRADE 12 · PART 1 · CHAPTER 3 — CURRENT ELECTRICITY
   Every activity runs a continuous animation loop. Sliders/buttons only set
   a TARGET; the drawn object eases, springs or integrates toward it every
   frame. Formulas (I = nAe·vd, R = ρl/A, ρT = ρ0[1+α(T−T0)], P = V²/R, V = ε − Ir …)
   drive the motion directly; textbook Examples 3.1, 3.3 and 3.7 are reproduced.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab', grid:'#e3eaf3'};
const KC = 9e9, EPS0 = 8.854e-12;

/* ---------- canvas + drawing helpers ---------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(240, r.width), h = Math.max(200, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash,off){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.lineCap='round';
  if(dash){ ctx.setLineDash(dash); ctx.lineDashOffset=off||0; } else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.45); ctx.lineTo(-size,-size*0.45); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){
  if(Math.hypot(x2-x1,y2-y1)<4) return;
  const a=Math.atan2(y2-y1,x2-x1), hs=7+(width||2.6)*0.8;
  line(ctx,x1,y1,x2-Math.cos(a)*hs*0.6,y2-Math.sin(a)*hs*0.6,color,width||2.6); arrowHead(ctx,x2,y2,a,color,hs);
}
function textAt(ctx,txt,x,y,o){
  o=o||{}; ctx.save();
  ctx.font=(o.weight||500)+' '+(o.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=o.color||COL.ink; ctx.textAlign=o.align||'left'; ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!==undefined) ctx.globalAlpha=o.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.stroke();} ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; const s=Number(x.toFixed(d)); return (Object.is(s,-0)?0:s).toString(); }
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sci(x,d){ if(!isFinite(x)) return '—'; if(x===0) return '0'; d=d===undefined?1:d; let e=Math.floor(Math.log10(Math.abs(x))); let m=x/Math.pow(10,e); if(Math.abs(Number(m.toFixed(d)))>=10){m/=10;e++;} return fmt(m,d)+'×10'+String(e).split('').map(c=>SUP[c]).join(''); }
function si(v,u,d){
  d=d===undefined?2:d; const a=Math.abs(v); if(!isFinite(v)) return '—'; if(a<1e-15) return '0 '+u;
  const P=[[1e-15,'f'],[1e-12,'p'],[1e-9,'n'],[1e-6,'µ'],[1e-3,'m'],[1,''],[1e3,'k'],[1e6,'M']];
  let p=P[0]; for(const q of P){ if(a>=q[0]*0.9995) p=q; }
  return fmt(v/p[0],d)+' '+p[1]+u;
}
function wrapAng(a){ while(a>Math.PI) a-=2*Math.PI; while(a<=-Math.PI) a+=2*Math.PI; return a; }

/* ---------- animation engine ---------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now(), raf, t=0;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000)); last = now; t+=dt;
    tick(dt,t);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
function springTo(s,target,k,damping,dt){ // s={x,v}
  const n=Math.max(1,Math.ceil(dt/0.008)), h=dt/n;
  for(let i=0;i<n;i++){ s.v += ((target-s.x)*k - s.v*damping)*h; s.x += s.v*h; }
  return s.x;
}

/* ---------- UI builders ---------- */
function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function group(side){ const g=el('div','control-group'); side.appendChild(g); return g; }
function slider(side,o){
  const g=group(side), lab=el('label','','<span>'+o.label+'</span><span class="val"></span>'), inp=el('input');
  inp.type='range'; inp.min=o.min; inp.max=o.max; inp.step=o.step||(o.max-o.min)/200; inp.value=o.value;
  g.append(lab,inp); const vEl=lab.querySelector('.val');
  const api={g,input:inp,get:()=>parseFloat(inp.value),set:(v)=>{ inp.value=v; show(); }};
  function show(){ vEl.textContent=fmt(api.get(),o.dec===undefined?1:o.dec)+(o.unit?' '+o.unit:''); }
  inp.addEventListener('input',()=>{ show(); if(o.on) o.on(api.get()); });
  show(); return api;
}
function buttons(side,defs){
  const g=group(side), row=el('div','toggle-group'); g.appendChild(row);
  const bs=defs.map(d=>{ const b=el('button','toggle-btn '+(d.cls||''),d.t); b.onclick=()=>d.on(b,bs); row.appendChild(b); return b; });
  return bs;
}
function toggle(side,label,opts,init,cb){
  const g=group(side); if(label) g.appendChild(el('label','','<span>'+label+'</span>'));
  const row=el('div','toggle-group'); g.appendChild(row);
  const bs=opts.map(([k,t])=>{ const b=el('button','toggle-btn'+(k===init?' active':''),t); b.onclick=()=>{ api.set(k); cb(k); }; row.appendChild(b); return b; });
  const api={g,set:(k)=>bs.forEach((b,i)=>b.classList.toggle('active',opts[i][0]===k))};
  return api;
}
function cards(side,defs){
  const g=el('div','result-cards'); side.appendChild(g); const m={};
  defs.forEach(d=>{ const c=el('div','rcard'+(d.wide?' wide':''),'<div class="rlabel">'+d.l+'</div><div class="rval">—</div>'); g.appendChild(c); m[d.id]=c.querySelector('.rval'); if(d.color) m[d.id].style.color=d.color; });
  return (id,txt)=>{ if(m[id].textContent!==txt) m[id].textContent=txt; };
}
function fbox(side){ const b=el('div','fb off'); side.appendChild(b); return (txt,cls)=>{ if(!txt){ b.className='fb off'; return; } b.className='fb '+(cls||'ok'); if(b.textContent!==txt) b.textContent=txt; }; }

/* ---------- plot + geometry helpers ---------- */
function graph(ctx,x,y,w,h,o){
  ctx.save(); rrect(ctx,x,y,w,h,8); ctx.fillStyle='#fbfdff'; ctx.fill(); ctx.strokeStyle=COL.grid; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
  const pl=o.pl===undefined?40:o.pl, pr=12, pt=22, pb=24;
  const X=v=>x+pl+(v-o.x0)/(o.x1-o.x0)*(w-pl-pr), Y=v=>y+pt+(1-(v-o.y0)/(o.y1-o.y0))*(h-pt-pb);
  const zy=Y(clamp(0,o.y0,o.y1)), zx=X(clamp(0,o.x0,o.x1));
  line(ctx,X(o.x0),zy,X(o.x1),zy,COL.mid,1.3); line(ctx,zx,Y(o.y0),zx,Y(o.y1),COL.mid,1.3);
  if(o.xt) o.xt.forEach(v=>{ line(ctx,X(v[0]),zy-3,X(v[0]),zy+3,COL.mid,1); textAt(ctx,v[1],X(v[0]),y+h-8,{size:10,color:COL.muted,align:'center'}); });
  if(o.yt) o.yt.forEach(v=>{ textAt(ctx,v[1],x+pl-5,Y(v[0])+3.5,{size:10,color:COL.muted,align:'right'}); line(ctx,X(o.x0)-3,Y(v[0]),X(o.x0)+3,Y(v[0]),COL.mid,1); });
  textAt(ctx,o.title||'',x+10,y+15,{size:11.5,weight:700,color:COL.ink});
  if(o.xl) textAt(ctx,o.xl,x+w-12,y+15,{size:10.5,weight:600,color:COL.muted,align:'right'});
  return {X,Y,x,y,w,h,begin(){ ctx.save(); ctx.beginPath(); ctx.rect(x+pl-2,y+pt-4,w-pl-pr+6,h-pt-pb+8); ctx.clip(); }, end(){ ctx.restore(); }};
}
function poly(ctx,pts,color,lw,dash){
  if(pts.length<2) return; ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lw||2; ctx.lineJoin='round'; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash); ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore();
}
function dot(ctx,x,y,r,fill){ circ(ctx,x,y,r,COL.ink,fill,2); }
function tagBox(ctx,txt,x,y,col,align){
  ctx.save(); ctx.font='700 12px Poppins, sans-serif'; const tw=ctx.measureText(txt).width; ctx.restore();
  const bx=align==='right'?x-tw-10:(align==='center'?x-tw/2-5:x);
  ctx.save(); rrect(ctx,bx,y-11,tw+10,22,6); ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
  textAt(ctx,txt,bx+5,y+4.5,{size:12,weight:700,color:col});
}
/* arrowheads travelling along a segment (field / current flow) */
function flow(ctx,x1,y1,x2,y2,off,spacing,col,size,alpha){
  const L=Math.hypot(x2-x1,y2-y1); if(L<4) return; const a=Math.atan2(y2-y1,x2-x1), ux=Math.cos(a), uy=Math.sin(a);
  ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha;
  let d=((off%spacing)+spacing)%spacing;
  for(;d<L;d+=spacing){ const f=Math.min(1,d/12,(L-d)/12); ctx.globalAlpha=(alpha===undefined?1:alpha)*f; arrowHead(ctx,x1+ux*d,y1+uy*d,a,col,size||6); }
  ctx.restore();
}
/* charge carriers drifting along a polyline */
function carriers(ctx,pts,phase,n,col,r){
  let tot=0; const seg=[]; for(let i=1;i<pts.length;i++){ const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); seg.push(l); tot+=l; }
  if(tot<2) return;
  for(let k=0;k<n;k++){
    let d=(((k/n+phase)%1)+1)%1*tot, i=0; while(i<seg.length-1 && d>seg[i]){ d-=seg[i]; i++; }
    const f=seg[i]?d/seg[i]:0, x=lerp(pts[i][0],pts[i+1][0],f), y=lerp(pts[i][1],pts[i+1][1],f);
    circ(ctx,x,y,r||3.2,null,col,0);
  }
}
function chargeBall(ctx,x,y,r,q,t,rings){
  const col=q>=0?COL.red:COL.blue;
  if(rings){ for(let i=0;i<3;i++){ const u=((t*0.55+i/3)%1), rr=r+(q>=0?u:(1-u))*r*3.4; ctx.save(); ctx.globalAlpha=(q>=0?(1-u):u)*0.5*rings; ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(x,y,rr,0,6.283); ctx.stroke(); ctx.restore(); } }
  circ(ctx,x,y,r,col,'#fff',2.6);
  line(ctx,x-r*0.5,y,x+r*0.5,y,col,2.4); if(q>=0) line(ctx,x,y-r*0.5,x,y+r*0.5,col,2.4);
}
/* parallel-plate symbol: o='h' wire horizontal (plates vertical) / 'v' wire vertical (plates horizontal).

    let ax,ay,bx,by; if(o==='h'){ ax=bx=cx+off; ay=cy-len/2; by=cy+len/2; } else { ay=by=cy+off; ax=cx-len/2; bx=cx+len/2; }

      const u=(i+0.5)/Math.max(n,1), px=lerp(ax,bx,u), py=lerp(ay,by,u), out=(p?1:-1)*11;

    for(let i=0;i<3;i++){ const u=(i+1)/4; if(o==='h') flow(ctx,cx-gap/2+3,lerp(cy-len/2,cy+len/2,u),cx+gap/2-3,lerp(cy-len/2,cy+len/2,u),0,99,COL.green,4,1); else flow(ctx,lerp(cx-len/2,cx+len/2,u),cy-gap/2+3,lerp(cx-len/2,cx+len/2,u),cy+gap/2-3,0,99,COL.green,4,1); }

/* marching-squares contour layer */
function contours(ctx,x0,y0,w,h,step,f,levels,colorOf,lwOf){
  const nx=Math.ceil(w/step), ny=Math.ceil(h/step), gx=nx+1, v=new Float32Array(gx*(ny+1));
  for(let j=0;j<=ny;j++) for(let i=0;i<=nx;i++) v[j*gx+i]=f(x0+i*step,y0+j*step);
  ctx.save(); ctx.beginPath(); ctx.rect(x0,y0,w,h); ctx.clip(); ctx.lineJoin='round'; ctx.lineCap='round';
  levels.forEach(L=>{
    ctx.strokeStyle=colorOf(L); ctx.lineWidth=lwOf?lwOf(L):1.7; ctx.beginPath();
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
      const tl=v[j*gx+i], tr=v[j*gx+i+1], br=v[(j+1)*gx+i+1], bl=v[(j+1)*gx+i];
      const idx=(tl>L?8:0)|(tr>L?4:0)|(br>L?2:0)|(bl>L?1:0); if(idx===0||idx===15) continue;
      const x=x0+i*step, y=y0+j*step;
      const T=[x+step*(L-tl)/(tr-tl),y], R=[x+step,y+step*(L-tr)/(br-tr)], B=[x+step*(L-bl)/(br-bl),y+step], Lf=[x,y+step*(L-tl)/(bl-tl)];
      const sg=(a,b)=>{ ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); };
      switch(idx){case 1:case 14:sg(Lf,B);break;case 2:case 13:sg(B,R);break;case 3:case 12:sg(Lf,R);break;case 4:case 11:sg(T,R);break;
        case 5:sg(T,Lf);sg(B,R);break;case 6:case 9:sg(T,B);break;case 7:case 8:sg(T,Lf);break;case 10:sg(T,R);sg(Lf,B);}
    }
    ctx.stroke();
  });
  ctx.restore();
}

/* ---------- microscopic conductor: ions on a lattice, electrons with random collisions ---------- */
function Micro(W,H,nMax,vth0){
  const cols=Math.round(W/46), rows=Math.max(1,Math.round(H/46)), sx=W/cols, sy=H/rows;
  const m={W,H,cols,rows,sx,sy,vth:vth0||240,ions:[],els:[],tau:0.4,vdx:0,trail:[],start:null,tag:0};
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++) m.ions.push({x:(i+0.5)*sx,y:(j+0.5)*sy,p1:Math.random()*6.28,p2:Math.random()*6.28});
  for(let k=0;k<nMax;k++){ const th=Math.random()*6.283; m.els.push({x:Math.random()*W,y:Math.random()*H,vx:m.vth*Math.cos(th),vy:m.vth*Math.sin(th),cool:0,since:Math.random()*0.3,a:1}); }
  m.ionPos=function(i,j,t,amp){ const o=m.ions[j*cols+i]; return [o.x+amp*Math.cos(9*t+o.p1), o.y+amp*Math.sin(8*t+o.p2)]; };
  m.step=function(dt,acc,amp,nAct,rc,t){
    const n=Math.max(1,Math.ceil(dt/0.008)), h=dt/n; let sum=0, cnt=0;
    m.els.forEach((e,k)=>{
      e.a=approach(e.a,k<nAct?1:0,6,dt); if(k>=nAct) return;
      for(let s=0;s<n;s++){
        e.vx+=acc*h; e.x+=e.vx*h; e.y+=e.vy*h; e.since+=h; if(e.cool>0) e.cool-=h;
        let wrapped=false;
        if(e.x<0){e.x+=W; wrapped=true;} if(e.x>=W){e.x-=W; wrapped=true;} if(e.y<0){e.y+=H; wrapped=true;} if(e.y>=H){e.y-=H; wrapped=true;}
        if(wrapped && k===m.tag) m.trail=[];
        if(e.cool<=0){
          const i0=Math.floor(e.x/sx), j0=Math.floor(e.y/sy); let hit=false;
          for(let dj=-1;dj<=1&&!hit;dj++) for(let di=-1;di<=1&&!hit;di++){
            const ii=(i0+di+cols)%cols, jj=(j0+dj+rows)%rows, p=m.ionPos(ii,jj,t,amp);
            let dx=((e.x-p[0]+W/2)%W+W)%W-W/2, dy=((e.y-p[1]+H/2)%H+H)%H-H/2;
            if(dx*dx+dy*dy<rc*rc){
              const th=Math.random()*6.283; e.vx=m.vth*Math.cos(th); e.vy=m.vth*Math.sin(th);
              e.x=p[0]+(rc+1.5)*Math.cos(th); e.y=p[1]+(rc+1.5)*Math.sin(th);
              if(e.x<0)e.x+=W; if(e.x>=W)e.x-=W; if(e.y<0)e.y+=H; if(e.y>=H)e.y-=H;
              e.cool=0.04; m.tau+=(e.since-m.tau)*0.03; e.since=0; hit=true;
              if(k===m.tag) m.trail.push([e.x,e.y,1]);
            }
          }
        }
      }
      sum+=e.vx; cnt++;
      if(k===m.tag){ m.trail.push([e.x,e.y,0]); if(m.trail.length>420) m.trail.shift(); }
    });
    if(cnt) m.vdx=approach(m.vdx,sum/cnt,3,dt);
  };
  m.draw=function(ctx,t,amp,rc){
    const ir=Math.max(3,rc-3.6);
    m.ions.forEach((o,idx)=>{ const p=m.ionPos(idx%cols,Math.floor(idx/cols),t,amp); circ(ctx,p[0],p[1],ir,COL.red,'rgba(217,67,43,0.12)',1.6); line(ctx,p[0]-ir*0.45,p[1],p[0]+ir*0.45,p[1],COL.red,1.4); line(ctx,p[0],p[1]-ir*0.45,p[0],p[1]+ir*0.45,COL.red,1.4); });
    const tr=m.trail; if(tr.length>2){ ctx.save(); ctx.strokeStyle='rgba(47,143,224,0.55)'; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.beginPath(); tr.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore();
      tr.forEach(p=>{ if(p[2]) circ(ctx,p[0],p[1],2.6,null,COL.yellow,0); }); }
    m.els.forEach((e,k)=>{ if(e.a<0.03) return; ctx.save(); ctx.globalAlpha=e.a; if(k===m.tag){ circ(ctx,e.x,e.y,9,COL.yellow,'rgba(217,160,23,0.16)',1.6); } circ(ctx,e.x,e.y,k===m.tag?4.6:3.6,null,COL.blue,0); ctx.restore(); });
  };
  return m;
}

}

/* =====================================================================

function actOhm(cv,side){
  const MATS=[['Nichrome',1.1e-6],['Constantan',4.9e-7],['Manganin',4.4e-7],['Copper',1.7e-8]];
  let V=6, l=4, A=0.5, mi=0, Vs=0, ph=0, rph=0; const sL={x:4,v:0}, sA={x:0.5,v:0}; let Iprev=0;

  slider(side,{label:'Length l',min:1,max:10,step:0.25,value:4,unit:'m',dec:2,on:v=>{l=v;}});
  slider(side,{label:'Cross-section A',min:0.1,max:1,step:0.02,value:0.5,unit:'mm²',dec:2,on:v=>{A=v;}});
  toggle(side,'Material (resistivity ρ)',MATS.map((m,i)=>[i,m[0]]),0,k=>{ mi=k; });
  const setC=cards(side,[{id:'R',l:'R = ρ l / A',color:COL.green},{id:'I',l:'I = V / R',color:COL.red},{id:'E',l:'E = V / l',color:COL.green},{id:'j',l:'j = I / A',color:COL.green}]);

    const {ctx,w,h}=fitCanvas(cv);

    const rho=MATS[mi][1], Ls=Math.max(sL.x,0.5), As=Math.max(sA.x,0.05), R=rho*Ls/(As*1e-6), I=Vs/R, Rt=rho*l/(A*1e-6);
    const sceneH=Math.round(h*0.62), cy=sceneH*0.5+14, bx=w*0.1, rx=w*0.9, ty=cy-sceneH*0.28, by=cy+sceneH*0.3;

    const loop=[[bx,by],[bx,ty],[rx0,ty],[rx1,ty],[rx,ty],[rx,by],[bx,by]];
    poly(ctx,[[bx,by],[bx,ty],[rx0,ty]],COL.ink,2.4); poly(ctx,[[rx1,ty],[rx,ty],[rx,by-0],[bx,by]],COL.ink,2.4);
    ph+=Math.tanh(I/6)*1.5*dt;
    carriers(ctx,loop,-ph,20,COL.blue,3.4);
    // battery on left wire
    ctx.fillStyle='#fff'; ctx.fillRect(bx-26,(ty+by)/2-26,52,52); battery(ctx,bx,(ty+by)/2,V,fmt(Vs,1)+' V');
    // ammeter on the bottom wire
    const ax=(bx+rx)/2; ctx.fillStyle='#fff'; ctx.fillRect(ax-24,by-24,48,48); dial(ctx,ax,by,22,Math.tanh(I/4),{label:'A',col:COL.red}); textAt(ctx,si(I,'A',2),ax,by+40,{size:12,weight:700,color:COL.red,align:'center'});
    // the wire (cylinder) under test
    ctx.save(); rrect(ctx,rx0,ty-rodH/2,rodL,rodH,rodH*0.35); ctx.fillStyle='#eef4fb'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); ctx.clip();
    const rows=Math.max(1,Math.round(rodH/13)), vdv=I/As; rph+=Math.tanh(vdv/8)*60*dt; // drift speed ∝ I/A
    for(let r=0;r<rows;r++){ const yy=ty-rodH/2+(r+0.5)*rodH/rows; for(let k=0;k<Math.ceil(rodL/22);k++){ let xx=rx0+(((k*22 - rph)%(rodL+22))+(rodL+22))%(rodL+22); circ(ctx,xx,yy,3.2,null,COL.blue,0); } }
    ctx.restore();
    // dimension marks

  });
}

    {k:'diode',n:'Diode',xr:0.9,y0:-1.5,y1:7,f:V=>0.003*(Math.exp(V/0.11)-1),msg:'Type (b): reversing V does not reverse I with the same size — the response depends on the sign of V.'},
    {k:'gaas',n:'GaAs-like',xr:6,y0:-3.4,y1:3.4,f:V=>Math.sign(V)*(Math.abs(V)*Math.exp(-V*V/8)*1.6+0.012*Math.pow(Math.abs(V),3)),msg:'Type (c): the same I occurs for more than one V — V against I is not unique.'}

  animLoop((dt,t)=>{
    const {ctx,w,h}=fitCanvas(cv); const d=DEV[di];
    if(sweep){ ph+=dt*0.8; Vt=d.xr*Math.sin(ph); sl.input.value=Vt; sl.set(Vt); }
    springTo(sV,Vt,90,14,dt); const V=sV.x, I=d.f(V), Im=I; // mA
    const sceneH=Math.round(h*0.46), cy=sceneH*0.5+6, bx=w*0.12, rx=w*0.88, ty=cy-sceneH*0.3, by=cy+sceneH*0.3, mid=(bx+rx)/2;

    carriers(ctx,loop,-flowPh,16,COL.blue,3.4);
    ctx.fillStyle='#fff'; ctx.fillRect(bx-26,(ty+by)/2-26,52,52); battery(ctx,bx,(ty+by)/2,0,fmt(V,2)+' V');
    // device on the top wire
    const dw=150, dx0=mid-dw/2, dx1=mid+dw/2; ctx.fillStyle='#fff'; ctx.fillRect(dx0-4,ty-34,dw+8,68);
    const glow=clamp(Math.abs(I*V)/6,0,1);
    if(glow>0.02){ ctx.save(); ctx.shadowColor='rgba(217,67,43,0.8)'; ctx.shadowBlur=26*glow; ctx.fillStyle='rgba(217,67,43,0.01)'; ctx.fillRect(dx0,ty-12,dw,24); ctx.restore(); }
    const dc=glow>0.05?`rgb(${Math.round(lerp(19,217,glow))},${Math.round(lerp(42,67,glow))},${Math.round(lerp(68,43,glow))})`:COL.ink;
    if(d.k==='res'||d.k==='cond'){ zig(ctx,dx0,ty,dx1,ty,dc,d.k==='cond'?4.4:3,d.k==='cond'?13:11,9,18); }
    else if(d.k==='diode'){ line(ctx,dx0,ty,mid-18,ty,COL.ink,2.6); line(ctx,mid+18,ty,dx1,ty,COL.ink,2.6); ctx.save(); ctx.fillStyle=dc; ctx.beginPath(); ctx.moveTo(mid-18,ty-20); ctx.lineTo(mid-18,ty+20); ctx.lineTo(mid+18,ty); ctx.closePath(); ctx.fill(); ctx.restore(); line(ctx,mid+18,ty-22,mid+18,ty+22,dc,4.4); }

    trace.push([g.X(V),g.Y(I)]); if(trace.length>70) trace.shift(); poly(ctx,trace,'rgba(47,143,224,0.55)',2.2);

    setC('V',fmt(V,2)+' V'); setC('I',fmt(I,2)+' mA'); setC('R',Math.abs(I)<0.003?'∞':fmt(V/I,2)+' kΩ'); setC('rev',Math.abs(V)<0.05?'—':fmt(d.f(-V),2)+' mA at −V');

/* =====================================================================
   3.6  THE TOASTER  (Section 3.8, Example 3.3 — R rises as the element heats)
   ===================================================================== */
function actToaster(cv,side){
  const R1=75.3, TR=27, HL=0.7517, CAP=3.0;
  let V=230, alpha=1.7e-4, on=false, T=TR, toast=0, tl=0, nh=0, hist=[]; const sT={x:TR,v:0};
  slider(side,{label:'Supply voltage',min:100,max:260,step:5,value:230,unit:'V',dec:0,on:v=>{V=v;}});
  toggle(side,'Element metal',[[1.7e-4,'Nichrome'],[3.9e-3,'Copper-like']],1.7e-4,k=>{ alpha=k; });
  const bt=buttons(side,[{t:'Switch ON',cls:'play',on:b=>{ on=!on; if(on&&T<TR+5){ hist=[]; tl=0; nh=0; toast=0; } b.textContent=on?'Switch OFF':'Switch ON'; b.classList.toggle('play',!on); }},
                         {t:'Cool & reset',on:()=>{ on=false; T=TR; sT.x=TR; toast=0; hist=[]; tl=0; nh=0; bt[0].textContent='Switch ON'; bt[0].classList.add('play'); }}]);
  const setC=cards(side,[{id:'T',l:'Element temperature',color:COL.red},{id:'R',l:'Resistance R(T)',color:COL.green},{id:'I',l:'Current I',color:COL.red},{id:'P',l:'Heat made I²R',color:COL.red}]);
  const setF=fbox(side);
  animLoop((dt,t)=>{
    const {ctx,w,h}=fitCanvas(cv);
    let R=R1*(1+alpha*(T-TR)), I=0, P=0;
    const n=Math.ceil(dt/0.004), hs=dt/n;
    for(let i=0;i<n;i++){ R=R1*(1+alpha*(T-TR)); I=on?V/R:0; P=I*I*R; T+=(P-HL*(T-TR))/CAP*hs; }
    R=R1*(1+alpha*(T-TR)); I=on?V/R:0; P=I*I*R;
    toast=clamp(toast+Math.max(0,T-140)/700*0.1*dt,0,1);
    springTo(sT,T,60,11,dt);
    // steady state: hR1α ΔT² + hR1 ΔT − V² = 0
    const a=HL*R1*alpha, b=HL*R1, dTss=(-b+Math.sqrt(b*b+4*a*V*V))/(2*a), Tss=TR+dTss, Iss=V/(R1*(1+alpha*dTss));
    const sceneH=Math.round(h*0.6), cx=w*0.4, cy=sceneH*0.52, k=Math.min(1,sceneH/360);
    const bL=cx-150*k, bR=cx+150*k, bT=cy-120*k, bB=cy+120*k;
    // toaster body + bread
    ctx.save(); rrect(ctx,bL,bT,bR-bL,bB-bT,26); ctx.fillStyle='#f3f6fa'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
    const br=Math.round(lerp(243,107,toast)), bg=Math.round(lerp(220,61,toast)), bb=Math.round(lerp(164,23,toast));
    [-1,1].forEach(sg=>{ ctx.save(); rrect(ctx,cx+sg*70*k-22*k,cy-84*k,44*k,168*k,14); ctx.fillStyle=`rgb(${br},${bg},${bb})`; ctx.fill(); ctx.strokeStyle='#b88a4a'; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore(); });
    // element (coil)

/* =====================================================================
   3.8  EMF AND INTERNAL RESISTANCE  (Section 3.10 — V = ε − Ir)
   ===================================================================== */
function actCell(cv,side){
  let eps=10, r=3, R=20, Vs=20, chg=false, Is=0, ph=0, sc=15; const sR={x:20,v:0};
  const s1=slider(side,{label:'Cell emf ε',min:1.5,max:12,step:0.5,value:10,unit:'V',dec:1,on:v=>{eps=v;}});
  const s2=slider(side,{label:'Internal resistance r',min:0.1,max:5,step:0.1,value:3,unit:'Ω',dec:1,on:v=>{r=v;}});
  const s3=slider(side,{label:'External resistance R',min:0.2,max:30,step:0.2,value:20,unit:'Ω',dec:1,on:v=>{R=v;}});
  const s4=slider(side,{label:'Charger voltage',min:14,max:30,step:0.5,value:20,unit:'V',dec:1,on:v=>{Vs=v;}}); s4.g.classList.add('hidden');
  toggle(side,'Mode',[[false,'Delivers current'],[true,'Being charged']],false,k=>{ chg=k; s4.g.classList.toggle('hidden',!k); });
  buttons(side,[{t:'Example 3.2 · 10 V, 3 Ω, 20 Ω',on:()=>{ setSlider(s1,10); setSlider(s2,3); setSlider(s3,20); }},{t:'Short-circuit (R→0.2 Ω)',cls:'go',on:()=>{ setSlider(s3,0.2); }}]);
  const setC=cards(side,[{id:'I',l:'Current I',color:COL.red},{id:'V',l:'Terminal voltage V',color:COL.green},{id:'L',l:'Volts lost in cell Ir',color:COL.blue},{id:'H',l:'Heat in cell I²r',color:COL.red}]);
  const setF=fbox(side);
  animLoop((dt,t)=>{
    const {ctx,w,h}=fitCanvas(cv);
    springTo(sR,R,70,12,dt);
    const Rr=Math.max(sR.x,0.2), It=chg?Math.max(0,(Vs-eps)/(Rr+r)):eps/(Rr+r); Is=approach(Is,It,9,dt);
    const Vt=chg?eps+Is*r:eps-Is*r; sc=approach(sc,chg?30:15,6,dt);
    const sceneH=Math.round(h*0.62), k=Math.min(1,sceneH/380), cy=sceneH*0.5, lx=w*0.34, rx=w*0.84, ty=cy-128*k, by=cy+128*k;
    // loop wires
    const sgn=chg?-1:1; ph+=Math.tanh(Is/3)*1.4*dt*sgn;
    const loop=[[lx,by],[lx,ty],[rx,ty],[rx,by],[lx,by]];
    poly(ctx,loop,COL.ink,2.4); carriers(ctx,loop,-ph,22,COL.blue,3.2);
    // cell box
    const bt=cy-100*k, bb=cy+100*k, hot=clamp(Is*Is*r/60,0,1);
    ctx.save(); rrect(ctx,lx-44,bt,88,bb-bt,12); ctx.fillStyle=hot>0.02?`rgba(217,67,43,${0.05+0.16*hot})`:'#fff'; ctx.fill(); ctx.strokeStyle=hot>0.3?COL.red:COL.mid; ctx.lineWidth=2; ctx.setLineDash([7,5]); ctx.stroke(); ctx.restore();
    ctx.fillStyle='#fff'; ctx.fillRect(lx-18,cy+22*k,36,80*k); battery(ctx,lx,cy+56*k); line(ctx,lx,cy+56*k-9,lx,cy+28*k,COL.ink,2.4);
    ctx.fillStyle='#fff'; ctx.fillRect(lx-20,bt+12*k,40,cy+20*k-bt-12*k); zig(ctx,lx,cy+30*k,lx,bt+6*k,hot>0.1?COL.red:COL.ink,3,10,7,6);
    textAt(ctx,'ε = '+fmt(eps,1)+' V',lx+52,cy+60*k,{size:12.5,weight:700,color:COL.green}); textAt(ctx,'r = '+fmt(r,1)+' Ω',lx+52,cy-20*k,{size:12.5,weight:700,color:COL.yellow});
    circ(ctx,lx,bt,4.5,COL.red,'#fff',2); circ(ctx,lx,bb,4.5,COL.blue,'#fff',2); textAt(ctx,'P',lx+10,bt-6,{size:12,weight:700,color:COL.red}); textAt(ctx,'N',lx+10,bb+16,{size:12,weight:700,color:COL.blue});
    // voltmeter across the terminals
    const vx=lx-125*Math.min(1,w/800)-10; poly(ctx,[[lx,bt],[vx,bt],[vx,cy-30]],COL.green,1.8,[5,4]); poly(ctx,[[lx,bb],[vx,bb],[vx,cy+30]],COL.green,1.8,[5,4]);
    dial(ctx,vx,cy,30,Vt/sc,{label:'V',col:COL.green}); textAt(ctx,fmt(Vt,2)+' V',vx,cy+52,{size:12.5,weight:700,color:COL.green,align:'center'});
    // charger
    const ca=chg?1:0; if(chg){ const mx=(lx+rx)/2; ctx.fillStyle='#fff'; ctx.fillRect(mx-30,ty-30,60,60); ctx.save(); ctx.translate(mx,ty); ctx.rotate(-Math.PI/2); battery(ctx,0,0); ctx.restore(); textAt(ctx,'charger '+fmt(Vs,0)+' V',mx,ty-34,{size:12,weight:700,color:COL.red,align:'center'}); }
    else { const mx=(lx+rx)/2; ctx.fillStyle='#fff'; ctx.fillRect(mx-26,ty-26,52,52); dial(ctx,mx,ty,23,Math.tanh(Is/3),{label:'A',col:COL.red}); }
    // rheostat
    const ry0=ty+24*k, ry1=by-24*k; ctx.fillStyle='#fff'; ctx.fillRect(rx-20,ry0-4,40,ry1-ry0+8); zig(ctx,rx,ry0,rx,ry1,COL.ink,3,11,12,6);
    const wy=lerp(ry1,ry0,(sR.x-0.2)/29.8); line(ctx,rx+30,wy,rx+8,wy,COL.yellow,3); arrowHead(ctx,rx+7,wy,Math.PI,COL.yellow,9); textAt(ctx,'R = '+fmt(sR.x,1)+' Ω',rx+36,wy+4,{size:12,weight:700,color:COL.yellow});
    // V–I graph
    const gy=sceneH+8, gh=h-gy-8, Ish=eps/r, x0=-0.5*Ish, x1=1.05*Ish, ymx=Math.max(eps*1.5,Vt*1.1);
    const g=graph(ctx,12,gy,w-24,gh,{pl:54,title:'Terminal voltage against current (V = ε − Ir)',xl:'I (A) ← charging | delivering →',x0,x1,y0:0,y1:ymx,xt:[[0,'0'],[Ish,fmt(Ish,1)+' A']],yt:[[eps,fmt(eps,1)+' V']]});
    g.begin(); poly(ctx,[[g.X(x0),g.Y(eps-x0*r)],[g.X(Ish),g.Y(0)]],COL.green,2.8); g.end();
    dot(ctx,g.X(clamp(sgn*Is,x0,x1)),g.Y(Vt),6.5,COL.yellow);
    textAt(ctx,'short-circuit current ε/r',g.X(Ish)-8,g.Y(0)-8,{size:10.5,weight:600,color:COL.muted,align:'right'});
    setC('I',fmt(Is,2)+' A'); setC('V',fmt(Vt,2)+' V'); setC('L',fmt(Is*r,2)+' V'); setC('H',fmt(Is*Is*r,1)+' W');
    if(chg) setF(Vs<=eps?'Charger below ε: no charging current flows.':'Being charged: V = ε + Ir — the terminal voltage is above the emf.','ok');
    else if(Rr<r*0.25) setF('Near short-circuit: V → 0, I → ε/r, and the cell heats up.','warn');
    else setF('Delivering current: V = ε − Ir — the terminal voltage sags below ε.','ok');
  });
}

    const {ctx,w,h}=fitCanvas(cv);
    let ee,re,I,I1,I2,V;
    if(mode==='par'){ re=r1*r2/(r1+r2); ee=(e1*r2+e2*r1)/(r1+r2); V=(e1/r1+e2/r2)/(1/r1+1/r2+1/R); I=V/R; I1=(e1-V)/r1; I2=(e2-V)/r2; }
    else { const s2=mode==='ser'?1:-1; ee=e1+s2*e2; re=r1+r2; I=ee/(R+re); I1=I; I2=s2*I; V=I*R; }
    sm.I=approach(sm.I,I,9,dt); sm.I1=approach(sm.I1,I1,9,dt); sm.I2=approach(sm.I2,I2,9,dt);
    const sceneH=Math.round(h*0.9), k=Math.min(1,sceneH/430), cy=sceneH*0.5, ty=cy-165*k, by=cy+165*k;
    const sp=(c)=>Math.tanh(c/2.5)*1.4*dt;
    const draw=(pts,cur,idx,n)=>{ poly(ctx,pts,COL.ink,2.4); ph[idx]+=sp(cur); carriers(ctx,pts,-ph[idx],n,COL.blue,3.2); };
    if(mode!=='par'){
      const lx=w*0.3, rx=w*0.7, loop=[[lx,by],[lx,ty],[rx,ty],[rx,by],[lx,by]];
      draw(loop,sm.I,0,26);
      const yA=cy+85*k, yB=cy-85*k, up2=mode==='ser';
      cellV(ctx,lx,yA+10*k,true); resV(ctx,lx,yA-34*k,yA-84*k+20*k); cellV(ctx,lx,yB+10*k,up2); resV(ctx,lx,yB-34*k,yB-84*k+20*k);
      textAt(ctx,'ε₁ '+fmt(e1,1)+' V · r₁ '+fmt(r1,1)+' Ω',lx-34,yA+12*k,{size:11.5,weight:700,color:COL.ink,align:'right'}); textAt(ctx,'ε₂ '+fmt(e2,1)+' V · r₂ '+fmt(r2,1)+' Ω',lx-34,yB+12*k,{size:11.5,weight:700,color:COL.ink,align:'right'});
      resV(ctx,rx,cy-70*k,cy+70*k,COL.yellow,4); textAt(ctx,'R = '+fmt(R,1)+' Ω',rx+30,cy+4,{size:12.5,weight:700,color:COL.yellow});
      const L=24+Math.min(Math.abs(sm.I),8)*8; vec(ctx,(lx+rx)/2-L/2*Math.sign(sm.I||1),ty-14,(lx+rx)/2+L/2*Math.sign(sm.I||1),ty-14,COL.red,3.2);
    } else {
      const xa=w*0.18, xb=w*0.4, xc=w*0.7, c1=sm.I1, c2=sm.I2, cr=sm.I;
      draw([[xa,by],[xa,ty]],c1,0,8); draw([[xb,by],[xb,ty]],c2,1,8); draw([[xc,ty],[xc,by]],cr,2,8);
      // buses
      poly(ctx,[[xa,ty],[xb,ty],[xc,ty]],COL.ink,2.4); poly(ctx,[[xa,by],[xb,by],[xc,by]],COL.ink,2.4);
      const busFlow=(x1,x2,y,cur,id)=>{ ph[id]=(ph[id]||0)+Math.tanh(cur/2.5)*0.9*dt; carriers(ctx,[[x1,y],[x2,y]],ph[id],4,COL.blue,3.2); };
      // electrons run opposite to conventional current: top bus carries I1 (→) then I1+I2 (→) ; bottom bus the reverse
      busFlow(xa,xb,ty,-c1,3); busFlow(xb,xc,ty,-(c1+c2),4); busFlow(xa,xb,by,c1,5); busFlow(xb,xc,by,c1+c2,6);
      cellV(ctx,xa,cy+8*k,true); resV(ctx,xa,cy-34*k,cy-100*k+10*k); cellV(ctx,xb,cy+8*k,true); resV(ctx,xb,cy-34*k,cy-100*k+10*k);
      textAt(ctx,'ε₁ '+fmt(e1,1)+' V',xa-30,cy+14*k,{size:11.5,weight:700,align:'right'}); textAt(ctx,'r₁ '+fmt(r1,1)+' Ω',xa-30,cy-70*k,{size:11.5,weight:700,align:'right',color:COL.yellow});
      textAt(ctx,'ε₂ '+fmt(e2,1)+' V',xb-30,cy+14*k,{size:11.5,weight:700,align:'right'}); textAt(ctx,'r₂ '+fmt(r2,1)+' Ω',xb-30,cy-70*k,{size:11.5,weight:700,align:'right',color:COL.yellow});
      resV(ctx,xc,cy-70*k,cy+70*k,COL.yellow,4); textAt(ctx,'R = '+fmt(R,1)+' Ω',xc+30,cy+4,{size:12.5,weight:700,color:COL.yellow});
      [[xa,c1],[xb,c2]].forEach(([x,c])=>{ if(Math.abs(c)>0.03){ const L=Math.min(Math.abs(c),5)*9+14; vec(ctx,x+36,cy+L/2*Math.sign(c),x+36,cy-L/2*Math.sign(c),c>0?COL.red:COL.blue,3); } });
    }
    textAt(ctx,mode==='ser'?'Series: ε adds, r adds':(mode==='opp'?'Opposed: ε subtracts, r still adds':'Parallel: r falls, ε is a weighted mean'),w/2,sceneH+26,{size:13,weight:700,color:COL.muted,align:'center'});
    setC('e',fmt(ee,2)+' V'); setC('r',fmt(re,2)+' Ω'); setC('I',fmt(I,2)+' A'); setC('V',fmt(V,2)+' V'); setC('I1',fmt(I1,2)+' A'); setC('I2',fmt(I2,2)+' A');
    if(mode==='par'&&(I1<-0.01||I2<-0.01)) setF('A cell with a smaller emf is being charged by the other — current flows backwards through it.','warn');
    else if(mode==='opp') setF(ee<0?'Cell 2 wins: net emf is reversed, so the current reverses.':'Opposed cells: the weaker emf cancels part of the stronger.','ok');
    else setF(mode==='ser'?'Series: the same current through both cells; emf and resistance add.':'Parallel: ε_eq = (ε₁r₂+ε₂r₁)/(r₁+r₂), 1/r_eq = 1/r₁ + 1/r₂.','ok');
  });
}

/* =====================================================================
   3.10  KIRCHHOFF'S RULES  (Section 3.12 — junction rule, loop rule)
   ===================================================================== */
function actKirchhoff(cv,side){
  let e1=10, e2=5, R1=2, R2=4, R3=3, loopSel=1; const ph=[0,0,0], sm={a:0,b:0,c:0};
  slider(side,{label:'Emf ε₁',min:0,max:12,step:0.5,value:10,unit:'V',dec:1,on:v=>{e1=v;}});
  slider(side,{label:'Emf ε₂ (negative = reversed)',min:-12,max:12,step:0.5,value:5,unit:'V',dec:1,on:v=>{e2=v;}});
  slider(side,{label:'R₁',min:1,max:20,step:0.5,value:2,unit:'Ω',dec:1,on:v=>{R1=v;}});
  slider(side,{label:'R₂',min:1,max:20,step:0.5,value:4,unit:'Ω',dec:1,on:v=>{R2=v;}});
  slider(side,{label:'R₃',min:1,max:20,step:0.5,value:3,unit:'Ω',dec:1,on:v=>{R3=v;}});
  toggle(side,'Walk around loop',[[1,'Left loop'],[2,'Right loop']],1,k=>{ loopSel=k; });
  const setC=cards(side,[{id:'I1',l:'I₁ (up, left)',color:COL.red},{id:'I2',l:'I₂ (down, middle)',color:COL.red},{id:'I3',l:'I₃ (up, right)',color:COL.red},{id:'sum',l:'Junction: I₁ + I₃ − I₂',color:COL.green}]);
  const setF=fbox(side);
  animLoop((dt,t)=>{
    const {ctx,w,h}=fitCanvas(cv);
    const Va=(e1/R1+e2/R3)/(1/R1+1/R2+1/R3), I1=(e1-Va)/R1, I2=Va/R2, I3=(e2-Va)/R3;
    sm.a=approach(sm.a,I1,9,dt); sm.b=approach(sm.b,I2,9,dt); sm.c=approach(sm.c,I3,9,dt);
    const sceneH=Math.round(h*0.64), k=Math.min(1,sceneH/380), cy=sceneH*0.5, ty=cy-130*k, by=cy+130*k, xa=w*0.14, xb=w*0.42, xc=w*0.7;
    // wires: branch currents (conventional): left up, middle down, right up. electrons opposite.
    const flowB=(pts,cur,id,n)=>{ poly(ctx,pts,COL.ink,2.4); ph[id]+=Math.tanh(cur/2)*1.3*dt; carriers(ctx,pts,-ph[id],n,COL.blue,3.2); };
    flowB([[xa,by],[xa,ty]],sm.a,0,9); flowB([[xb,ty],[xb,by]],sm.b,1,9); flowB([[xc,by],[xc,ty]],sm.c,2,9);
    poly(ctx,[[xa,ty],[xb,ty],[xc,ty]],COL.ink,2.4); poly(ctx,[[xa,by],[xb,by],[xc,by]],COL.ink,2.4);
    // bus carriers (top: electrons toward node where current leaves)
    const bf=(x1,x2,y,cur,id)=>{ ph[id]=(ph[id]||0)+Math.tanh(cur/2)*1.0*dt; carriers(ctx,[[x1,y],[x2,y]],ph[id],5,COL.blue,3.2); };
    bf(xa,xb,ty,-sm.a,3); bf(xb,xc,ty,sm.c,4); bf(xa,xb,by,sm.a,5); bf(xb,xc,by,-sm.c,6);
    // components
    cellV(ctx,xa,cy+70*k,true); resV(ctx,xa,cy+30*k,cy-90*k); cellV(ctx,xc,cy+70*k,e2>=0); resV(ctx,xc,cy+30*k,cy-90*k); resV(ctx,xb,cy-80*k,cy+80*k);
    textAt(ctx,'ε₁ = '+fmt(e1,1)+' V',xa-34,cy+76*k,{size:12,weight:700,align:'right',color:COL.green}); textAt(ctx,'R₁ = '+fmt(R1,1)+' Ω',xa-30,cy-30*k,{size:12,weight:700,align:'right',color:COL.yellow});
    textAt(ctx,'R₂ = '+fmt(R2,1)+' Ω',xb+30,cy+4,{size:12,weight:700,color:COL.yellow});
    textAt(ctx,'ε₂ = '+fmt(e2,1)+' V',xc+34,cy+76*k,{size:12,weight:700,color:COL.green}); textAt(ctx,'R₃ = '+fmt(R3,1)+' Ω',xc+30,cy-30*k,{size:12,weight:700,color:COL.yellow});
    circ(ctx,xb,ty,5,COL.ink,COL.ink,1); circ(ctx,xb,by,5,COL.ink,COL.ink,1); textAt(ctx,'a',xb+10,ty-8,{size:13,weight:700}); textAt(ctx,'b',xb+10,by+18,{size:13,weight:700});
    // current arrows
    [[xa,sm.a,true,-30],[xb,sm.b,false,-34],[xc,sm.c,true,34]].forEach(([x,c,up,off])=>{ const L=14+Math.min(Math.abs(c),6)*8, dy=(up?-1:1)*(c>=0?1:-1); vec(ctx,x+off,cy-dy*L/2+(x===xb?0:-30*k),x+off,cy+dy*L/2+(x===xb?0:-30*k),COL.red,3); textAt(ctx,'I'+(x===xa?'₁':(x===xb?'₂':'₃')),x+off+(off<0?-12:12),cy+(x===xb?0:-30*k)+4,{size:12.5,weight:700,color:COL.red,align:off<0?'right':'left'}); });
    // loop-rule staircase
    const gy=sceneH+8, gh=h-gy-8, gw=w-24;
    const steps=loopSel===1?[['+ε₁',e1,COL.red],['−I₁R₁',-I1*R1,COL.blue],['−I₂R₂',-I2*R2,COL.blue]]:[['+ε₂',e2,COL.red],['−I₃R₃',-I3*R3,COL.blue],['+I₂R₂',I2*R2,COL.red]];
    // loop 2 goes b→battery2→R3→a→down R2? (a→b through R2 drops I2R2) so use −I2R2
    if(loopSel===2) steps[2]=['−I₂R₂',-I2*R2,COL.blue];
    const levels=[0]; steps.forEach(s=>levels.push(levels[levels.length-1]+s[1]));
    const vmax=Math.max(1,...levels.map(Math.abs))*1.2, ymin=Math.min(0,...levels)*1.2-1, ymax=Math.max(0,...levels)*1.2+1;
    const g=graph(ctx,12,gy,gw,gh,{pl:50,title:'Loop rule: potential changes while walking once round the '+(loopSel===1?'left':'right')+' loop',xl:'start at b (0 V)',x0:0,x1:5,y0:ymin,y1:ymax,xt:[],yt:[[0,'0 V']]});
    const bw=0.62;
    steps.forEach((s,i)=>{ const x0=g.X(0.7+i*1.15), x1=g.X(0.7+i*1.15+bw), ya=g.Y(levels[i]), yb=g.Y(levels[i+1]); ctx.save(); ctx.globalAlpha=0.85; ctx.fillStyle=s[2]; ctx.fillRect(x0,Math.min(ya,yb),x1-x0,Math.max(2,Math.abs(yb-ya))); ctx.restore(); line(ctx,x0-12,yb,x1+16,yb,COL.mid,1,[3,3]); textAt(ctx,s[0]+' = '+(s[1]>=0?'+':'−')+fmt(Math.abs(s[1]),2),(x0+x1)/2,g.Y(ymax)+30+i*0,{size:11.5,weight:700,color:s[2],align:'center'}); });
    const tot=levels[levels.length-1]; textAt(ctx,'Σ ΔV = '+fmt(Math.abs(tot)<0.005?0:tot,2)+' V',g.X(4.6),g.Y(0)-8,{size:13,weight:700,color:COL.green,align:'right'});
    const sum=I1+I3-I2; setC('I1',fmt(I1,2)+' A'); setC('I2',fmt(I2,2)+' A'); setC('I3',fmt(I3,2)+' A'); setC('sum',fmt(Math.abs(sum)<0.005?0:sum,2)+' A');
    setF('Junction rule: current in = current out at a. Loop rule: the potential changes add up to zero. Negative I means the current really flows the other way.','ok');
  });
}

/* =====================================================================
   3.11  WHEATSTONE BRIDGE  (Section 3.13, Example 3.7)
   ===================================================================== */
function bridgeSolve(P,Q,Rr,S,G,V0){ // A=V0, C=0, arms: AB=P, BC=Q, AD=Rr, DC=S, galvanometer B–D
  const a11=1/P+1/Q+1/G, a12=-1/G, a21=-1/G, a22=1/Rr+1/S+1/G, b1=V0/P, b2=V0/Rr, det=a11*a22-a12*a21;
  const B=(b1*a22-a12*b2)/det, D=(a11*b2-a21*b1)/det;
  return {B,D,Ig:(B-D)/G,iAB:(V0-B)/P,iBC:B/Q,iAD:(V0-D)/Rr,iDC:D/S,Itot:(V0-B)/P+(V0-D)/Rr};
}
function actBridge(cv,side){
  let P=100,Q=10,Rr=60,S=5,V0=10; const G=15, sNeedle={x:0,v:0}, ph=[0,0,0,0,0]; let ig=0, sm={};
  const sp=slider(side,{label:'P  (arm AB)',min:1,max:200,step:1,value:100,unit:'Ω',dec:0,on:v=>{P=v;}});
  const sq=slider(side,{label:'Q  (arm BC)',min:1,max:200,step:1,value:10,unit:'Ω',dec:0,on:v=>{Q=v;}});
  const sr=slider(side,{label:'R  (arm AD)',min:1,max:200,step:1,value:60,unit:'Ω',dec:0,on:v=>{Rr=v;}});
  const ss=slider(side,{label:'S  (arm DC)',min:1,max:200,step:1,value:5,unit:'Ω',dec:0,on:v=>{S=v;}});
  slider(side,{label:'Battery voltage',min:2,max:20,step:1,value:10,unit:'V',dec:0,on:v=>{V0=v;}});
  buttons(side,[{t:'Example 3.7',cls:'go',on:()=>{ setSlider(sp,100); setSlider(sq,10); setSlider(sr,60); setSlider(ss,5); }},{t:'Balance it',cls:'play',on:()=>{ setSlider(sp,40); setSlider(sq,20); setSlider(sr,60); setSlider(ss,30); }}]);
  const setC=cards(side,[{id:'Ig',l:'Galvanometer current Ig',color:COL.red},{id:'p',l:'P / Q',color:COL.green},{id:'r',l:'R / S',color:COL.green},{id:'vd',l:'VB − VD',color:COL.blue}]);
  const setF=fbox(side);
  animLoop((dt,t)=>{
    const {ctx,w,h}=fitCanvas(cv);
    const s=bridgeSolve(P,Q,Rr,S,G,V0); ig=approach(ig,s.Ig,8,dt);
    const tgt=Math.tanh(s.Ig/(0.1*s.Itot))*0.95; springTo(sNeedle,tgt,70,5,dt);
    const sceneH=Math.round(h*0.86), k=Math.min(1,sceneH/430), cx=w*0.5, cy=sceneH*0.46, Wd=Math.min(w*0.3,250), Hd=Math.min(150*k,w*0.2);
    const A=[cx-Wd,cy], B=[cx,cy-Hd], C=[cx+Wd,cy], D=[cx,cy+Hd], yb=cy+Hd+54*k;
    const arm=(p,q,val,cur,id,lab,off)=>{
      poly(ctx,[p,q],COL.ink,2.4); ph[id]=(ph[id]||0)+Math.tanh(cur/(0.4*s.Itot||1))*1.1*dt; carriers(ctx,[p,q],-ph[id],5,COL.blue,3.2);
      const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2, ux=(q[0]-p[0])/Math.hypot(q[0]-p[0],q[1]-p[1]), uy=(q[1]-p[1])/Math.hypot(q[0]-p[0],q[1]-p[1]), L=100;
      const a=[mx-ux*L/2,my-uy*L/2], b=[mx+ux*L/2,my+uy*L/2]; ctx.save(); ctx.translate(mx,my); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,L/2+2,0,0); ctx.restore();
      ctx.save(); ctx.strokeStyle='#fff'; ctx.lineWidth=18; ctx.lineCap='butt'; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.restore();
      zig(ctx,a[0],a[1],b[0],b[1],COL.ink,3,9,8,8);
      textAt(ctx,lab+' = '+val+' Ω',mx+off[0],my+off[1],{size:12.5,weight:700,color:COL.yellow,align:off[0]<0?'right':'left'});
    };
    arm(A,B,P,s.iAB,0,'P',[-16,-10]); arm(B,C,Q,s.iBC,1,'Q',[16,-10]); arm(A,D,Rr,s.iAD,2,'R',[-16,22]); arm(D,C,S,s.iDC,3,'S',[16,22]);
    // battery arm along the bottom
    const bat=[[A[0],A[1]],[A[0]-46,A[1]],[A[0]-46,yb],[C[0]+46,yb],[C[0]+46,C[1]],[C[0],C[1]]];
    poly(ctx,bat,COL.ink,2.4); ph[4]=(ph[4]||0)+Math.tanh(s.Itot/(s.Itot||1))*0.9*dt; carriers(ctx,bat,ph[4],14,COL.blue,3.2);
    ctx.fillStyle='#fff'; ctx.fillRect(cx-26,yb-26,52,52); ctx.save(); ctx.translate(cx,yb); ctx.rotate(Math.PI/2); battery(ctx,0,0); ctx.restore(); textAt(ctx,fmt(V0,0)+' V',cx,yb+42,{size:12.5,weight:700,color:COL.green,align:'center'});
    // galvanometer branch B–D
    poly(ctx,[B,D],COL.ink,2.4); ph[4+1]=(ph[4+1]||0)+Math.tanh(s.Ig/(0.1*s.Itot||1))*1.0*dt; carriers(ctx,[B,[cx,cy-34]],-ph[5],2,COL.blue,3.2); carriers(ctx,[[cx,cy+34],D],-ph[5],2,COL.blue,3.2);
    ctx.fillStyle='#fff'; circ(ctx,cx,cy,34,COL.ink,'#fff',2.6);
    dial(ctx,cx,cy,34,sNeedle.x,{zero:true,label:'G',col:Math.abs(s.Ig)<1e-4*s.Itot?COL.green:COL.red});
    [[A,'A'],[B,'B'],[C,'C'],[D,'D']].forEach(([p,l])=>{ circ(ctx,p[0],p[1],5,COL.ink,COL.ink,1); textAt(ctx,l,p[0]+(l==='A'?-16:(l==='C'?12:10)),p[1]+(l==='B'?-10:(l==='D'?20:-8)),{size:14,weight:700}); });
    // potential bars
    const by2=sceneH+10, bh=h-by2-8, bw2=w-24; ctx.save(); rrect(ctx,12,by2,bw2,bh,8); ctx.fillStyle='#fbfdff'; ctx.fill(); ctx.strokeStyle=COL.grid; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
    textAt(ctx,'Potential (0 V at C, '+fmt(V0,0)+' V at A)',24,by2+16,{size:11.5,weight:700});
    const bl=bw2-190;
    [['B',s.B,COL.red],['D',s.D,COL.blue]].forEach(([n,v,c],i)=>{ const y=by2+26+i*Math.max(14,(bh-34)/2); textAt(ctx,'V'+n,24,y+11,{size:11.5,weight:700,color:c}); ctx.fillStyle=c; ctx.globalAlpha=0.85; ctx.fillRect(56,y,Math.max(1,bl*v/V0),Math.max(10,(bh-34)/2-6)); ctx.globalAlpha=1; textAt(ctx,fmt(v,2)+' V',56+bl*v/V0+8,y+11,{size:11.5,weight:700,color:c}); });
    const bal=Math.abs(s.Ig)<1e-4*s.Itot;
    setC('Ig',si(s.Ig,'A',2)); setC('p',fmt(P/Q,3)); setC('r',fmt(Rr/S,3)); setC('vd',fmt(s.B-s.D,3)+' V');
    setF(bal?'Balanced: P/Q = R/S → B and D are at the same potential → null deflection.':(Math.abs(P-100)<.5&&Math.abs(Q-10)<.5&&Math.abs(Rr-60)<.5&&Math.abs(S-5)<.5&&V0===10?'Example 3.7: Ig = '+fmt(s.Ig*1000,2)+' mA (textbook 4.87 mA).':'Unbalanced: B and D differ in potential, so current flows through G.'),bal?'ok':'warn');
  });
}
