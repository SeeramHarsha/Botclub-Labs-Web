<title>Grade 12 · Part 2 · Chapter 2 — Alcohols, Phenols and Ethers | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

<script>
/* =========================================================================
   GRADE 12 CHEMISTRY PART 2 — CHAPTER 2: ALCOHOLS, PHENOLS AND ETHERS
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn object eases, springs or physically integrates toward
   it every frame. Molecules are never still — they vibrate, collide, bond
   and break — never a static picture.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};
/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

/* ---------------------------------------------------------------------
   0c. CHAPTER HELPERS — seeded random, easing,
       lab glassware and molecules (all line diagrams, all animated)
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function lw(k,base){ return clamp(k*base,1,3); }
function hash01(a,b){ let h=Math.imul((a|0)+1,374761393)^Math.imul((b|0)+7,668265263); h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function sub(s){ return String(s).replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]); }

/* ---------------------------------------------------------------------
   CHEMISTRY DRAWING HELPERS (line diagrams)
   --------------------------------------------------------------------- */
/** atom symbol in a ring: O red, H blue, C ink, Br/halogen yellow, products green */
function atom(ctx,sym,x,y,col,r,fill){ r=r||9; circ(ctx,x,y,r,col,fill||'#fff',2); textAt(ctx,sym,x,y+r*0.38,{align:'center',size:r*1.15,weight:700,color:col}); }
function dbl(ctx,x1,y1,x2,y2,col,w,gap){ gap=gap||3.2; const a=Math.atan2(y2-y1,x2-x1), nx=-Math.sin(a)*gap, ny=Math.cos(a)*gap; line(ctx,x1+nx,y1+ny,x2+nx,y2+ny,col,w||2.4); line(ctx,x1-nx,y1-ny,x2-nx,y2-ny,col,w||2.4); }
/** zig-zag carbon chain in LOCAL coordinates. returns the node list. */
function chainPts(n,len){ const p=[]; for(let i=0;i<n;i++) p.push([i*len*0.87,(i%2?-1:1)*len*0.25]); return p; }
/** one small molecule centred on (x,y) heading angle a.
    kind: 'alc' (R–OH) · 'eth' (R–O–R) · 'alk' (hydrocarbon) · 'wat' (H–O–H)
    returns world position of the oxygen. */
function drawMol(ctx,x,y,a,kind,n,len,tint,alpha){
  ctx.save(); ctx.translate(x,y); ctx.rotate(a); if(alpha!==undefined) ctx.globalAlpha=alpha;
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(kind==='wat'){
    const L=len*0.62;
    line(ctx,0,0,-L*0.55,L*0.8,COL.blue,2); line(ctx,0,0,L*0.55,L*0.8,COL.blue,2);
    circ(ctx,-L*0.55,L*0.8,len*0.17,COL.blue,'#fff',1.8); circ(ctx,L*0.55,L*0.8,len*0.17,COL.blue,'#fff',1.8);

    ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();

/** open-top test-tube path (hw = half-width) */
function tubePath(ctx,cx,top,bot,hw){ ctx.beginPath(); ctx.moveTo(cx-hw,top); ctx.lineTo(cx-hw,bot-hw); ctx.arc(cx,bot-hw,hw,Math.PI,0,true); ctx.lineTo(cx+hw,top); }
function tubeDraw(ctx,cx,top,bot,hw,levelY,liquid,inner){
  ctx.save(); tubePath(ctx,cx,top,bot,hw); ctx.save(); ctx.clip();
  if(levelY<bot){ ctx.fillStyle=liquid; ctx.fillRect(cx-hw-2,levelY,hw*2+4,bot-levelY+2); }
  if(inner) inner(); ctx.restore();
  tubePath(ctx,cx,top,bot,hw); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.8; ctx.stroke();
  line(ctx,cx-hw-4,top,cx+hw+4,top,COL.ink,3); ctx.restore();
}
/** round-bottom flask: body radius R centred (cx,cy), neck half-width nw rising to neckTop */
function flaskDraw(ctx,cx,cy,R,neckTop,nw,levelY,liquid,inner){
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.rect(cx-nw,neckTop,nw*2,cy-neckTop); ctx.clip();
  if(levelY<cy+R){ ctx.fillStyle=liquid; ctx.fillRect(cx-R-2,levelY,R*2+4,cy+R-levelY+2); }
  if(inner) inner(); ctx.restore();
  ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.8; ctx.lineJoin='round';
  const ang=Math.asin(nw/R); ctx.beginPath(); ctx.moveTo(cx-nw,neckTop); ctx.lineTo(cx-nw,cy-Math.cos(ang)*R);
  ctx.arc(cx,cy,R,-Math.PI/2-ang,-Math.PI/2+ang,true); ctx.lineTo(cx+nw,neckTop); ctx.stroke();
  line(ctx,cx-nw-4,neckTop,cx+nw+4,neckTop,COL.ink,3); ctx.restore();
}
/** simple bubble field */
function bubbleStep(arr,ctx,dt,x0,x1,yTop,speed,col,spawnRate,spawnY,maxN){
  if(spawnRate>0 && Math.random()<dt*spawnRate && arr.length<(maxN||80)) arr.push({x:x0+Math.random()*(x1-x0),y:spawnY,r:1.5+Math.random()*3,ph:Math.random()*6});
  for(let i=arr.length-1;i>=0;i--){ const b=arr[i]; b.y-=dt*(speed+b.r*10); b.x+=Math.sin(b.y*0.12+b.ph)*0.35; if(b.y<yTop){ arr.splice(i,1); continue; } circ(ctx,b.x,b.y,b.r,col,'rgba(255,255,255,0.5)',1.3); }
}
function burner(ctx,cx,baseY,inten,t,w){
  w=w||34; rrect(ctx,cx-w/2,baseY-22,w,22,4); ctx.save(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();

function dropper(ctx,x,y,squeeze){ // line dropper, tip at y

}
function gauge(ctx,x,y,w,h,frac,col,label,val,mark){
  rrect(ctx,x,y,w,h,h/2); ctx.save(); ctx.fillStyle='#f1f5fa'; ctx.fill(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();

function wireChips(wrap,id,cb){ const el=wrap.querySelector('#'+id); const b=[...el.querySelectorAll('.chip-btn')]; b.forEach(x=>x.onclick=()=>{ b.forEach(y=>y.classList.remove('active')); x.classList.add('active'); cb(x.dataset.k); }); return b; }

/* =====================================================================
   2.1 HYDROGEN BONDING AND BOILING POINT   (NCERT §7.4.3, §7.6.2)
   Molecules of similar mass, very different boiling points: only the
   –OH compounds can hold each other with O–H···O hydrogen bonds.
   Vapour fraction  f = 1 / (1 + e^(−(T − Tb)/9))  — the liquid empties
   around Tb. Textbook check: ethanol 351 K, methoxymethane 248 K,
   propane 231 K; n-pentane 309 K, ethoxyethane 308 K, butan-1-ol 390 K.
   ===================================================================== */
const BP_SET={
  propane:{n:'Propane',f:'C₃H₈',kind:'alk',c:3,bp:231,M:44},
  dme:{n:'Methoxymethane',f:'CH₃OCH₃',kind:'eth',c:3,bp:248,M:46},
  ethanol:{n:'Ethanol',f:'C₂H₅OH',kind:'alc',c:2,bp:351,M:46},
  pentane:{n:'n-Pentane',f:'C₅H₁₂',kind:'alk',c:5,bp:309,M:72},
  deth:{n:'Ethoxyethane',f:'C₂H₅OC₂H₅',kind:'eth',c:5,bp:308,M:74},
  butanol:{n:'Butan-1-ol',f:'C₄H₉OH',kind:'alc',c:4,bp:390,M:74}
};
function buildA1(){
  const wrap=mkLab(
    chipsH('cmp','Compound',Object.keys(BP_SET).map(k=>[k,BP_SET[k].n]),'ethanol')+
    sliderH('tmp','Temperature',200,420,1,300,' K')+
    btnH('toBp','Heat to its boiling point','navy')+
    cardsH([['r1','Boiling point'],['r2','Temperature'],['r3','State'],['r4','H-bonds'],['r5','Molar mass'],['r6','Vapour']]));
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), tR=sliderVal(wrap,'tmp',v=>v+' K');
  let cmp='ethanol', t=0, Tcur=300, inited=false, lastW=0, lastH=0; const P=[], bub=[]; const N=26, ch={vals:[]};
  wireChips(wrap,'cmp',k=>{ cmp=k; });
  $('#toBp').onclick=()=>{ tR.value=BP_SET[cmp].bp+14; tR.dispatchEvent(new Event('input')); };
  animLoop(dt=>{
    t+=dt; const C=BP_SET[cmp], Tt=+tR.value; Tcur=approach(Tcur,Tt,1.1,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const sc=clamp(Math.min(w,h)/560,0.7,1.35), len=17*sc;
    const bx0=w*0.1,bx1=w*0.74,by0=h*0.08,by1=h*0.78, sy=by1-(by1-by0)*0.46;
    if(!inited||Math.abs(w-lastW)>2||Math.abs(h-lastH)>2){ inited=true; lastW=w; lastH=h; P.length=0; for(let i=0;i<N;i++) P.push({x:bx0+30+Math.random()*(bx1-bx0-60),y:sy+20+Math.random()*(by1-sy-40),vx:0,vy:0,a:Math.random()*6.28,vap:false}); }
    // flame + burner
    const heat=clamp((Tcur-200)/220,0,1); burner(ctx,(bx0+bx1)/2,h*0.93,0.15+heat*0.9,t,50*sc);
    // beaker
    ctx.save(); ctx.fillStyle=C.kind==='alc'?'rgba(47,143,224,0.07)':'rgba(217,160,23,0.07)'; ctx.fillRect(bx0,sy,bx1-bx0,by1-sy); ctx.restore();
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(bx0,by0); ctx.lineTo(bx0,by1); ctx.lineTo(bx1,by1); ctx.lineTo(bx1,by0); ctx.stroke(); ctx.restore();
    line(ctx,bx0,sy,bx1,sy,COL.mid,1.2,[6,5]);
    // phase targets
    const f=1/(1+Math.exp(-(Tcur-C.bp)/9)), Vt=Math.round(N*f);
    let vc=P.filter(p=>p.vap).length;
    if(vc<Vt){ const L=P.filter(p=>!p.vap).sort((a,b)=>a.y-b.y)[0]; if(L && Math.random()<dt*9){ L.vap=true; L.vy=-120; L.vx=(Math.random()-0.5)*80; } }

        p.vx+=gauss()*40*dt; p.vy+=gauss()*40*dt+30*dt; const s=Math.hypot(p.vx,p.vy)||1; if(s>spV){ p.vx*=spV/s; p.vy*=spV/s; } if(s<spV*0.5){ p.vx*=1.05; p.vy*=1.05; }
        p.x+=p.vx*dt; p.y+=p.vy*dt;

        if(p.y>sy-6 && p.vy>0){ if(vc>Vt){ p.vap=false; vc--; p.vy=20; } else { p.y=sy-6; p.vy=-Math.abs(p.vy); } }

        p.vx*=0.975; p.vy*=0.975; const s=Math.hypot(p.vx,p.vy)||1; if(s>spL){ p.vx*=spL/s; p.vy*=spL/s; }

      }
    }
    // thermometer with b.p. tick
    const tx=w*0.86, tt=h*0.12, tb=h*0.72; thermo(ctx,tx,tt,tb,(Tcur-200)/220,COL.ink,COL.red);
    const by=tb-(tb-tt-5)*clamp((C.bp-200)/220,0,1); line(ctx,tx-14,by,tx+14,by,COL.blue,2.6); textAt(ctx,'b.p. '+C.bp+' K',tx+18,by+4,{size:11.5,weight:700,color:COL.blue});
    textAt(ctx,Math.round(Tcur)+' K',tx,tb+36,{align:'center',size:13,weight:700,color:COL.red});
    textAt(ctx,C.n+'  '+C.f,bx0+8,by0+h*0.04,{size:15,weight:700,color:COL.ink});
    if(C.kind==='alc') textAt(ctx,'- - -  O–H···O hydrogen bond',bx0+8,by0+h*0.08,{size:12,weight:700,color:COL.blue});
    else textAt(ctx,'no O–H  →  no hydrogen bonds',bx0+8,by0+h*0.08,{size:12,weight:700,color:COL.muted});

  });

}

/* =====================================================================
   2.2 SOLUBILITY IN WATER   (NCERT §7.4.3, §7.6.2)
   –OH / ether O hydrogen-bond to water; the hydrophobic alkyl tail fights
   it. Solubility (g/100 mL): C1–C3 miscible, butan-1-ol 9, pentan-1-ol
   2.7, hexan-1-ol 0.6 … ethoxyethane 7.5, pentane ≈ 0.
   10 g added per 100 mL → dissolved fraction = min(1, S/10).
   Textbook check: ethoxyethane 7.5 → 12 of 16 molecules dissolve.
   ===================================================================== */
const ALC_NAMES=['Methanol','Ethanol','Propan-1-ol','Butan-1-ol','Pentan-1-ol','Hexan-1-ol','Heptan-1-ol','Octan-1-ol'];
const ALC_SOL=[Infinity,Infinity,Infinity,9,2.7,0.6,0.1,0.05];
function buildA2(){
  const wrap=mkLab(
    chipsH('typ','Compound class',[['alc','Alcohol'],['eth','Ether C₂H₅OC₂H₅'],['alk','Alkane C₅H₁₂']],'alc')+
    sliderH('cn','Carbon atoms in alcohol',1,8,1,4,'')+
    btnH('add','Add 10 g to 100 mL water','navy')+btnH('clr','Empty beaker','')+
    cardsH([['r1','Solubility'],['r2','Dissolved'],['r3','Verdict'],['r4','Tail length']]));
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), cnR=sliderVal(wrap,'cn');
  let typ='alc', t=0, S=[], tailAnim=4, spawn=0, queue=0, wlist=null, lw2=0, lh2=0;
  wireChips(wrap,'typ',k=>{ typ=k; S=[]; });
  $('#clr').onclick=()=>{ S=[]; queue=0; };
  const M=16;
  function nC(){ return typ==='alc'?+cnR.value:5; }
  function solu(){ return typ==='alc'?ALC_SOL[+cnR.value-1]:typ==='eth'?7.5:0.01; }
  let flags=[];
  $('#add').onclick=()=>{ S=[]; queue=M; spawn=0; const nd=Math.round(Math.min(1,solu()/10)*M); flags=[...Array(M)].map((_,i)=>i<nd).sort(()=>Math.random()-0.5); };
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const sc=clamp(Math.min(w,h)/560,0.7,1.3);
    const bx0=w*0.07,bx1=w*0.66,by0=h*0.3,by1=h*0.9,wy=h*0.42, bw=bx1-bx0;
    if(!wlist||Math.abs(w-lw2)>2||Math.abs(h-lh2)>2){ lw2=w; lh2=h; S=[]; wlist=[]; for(let i=0;i<66;i++) wlist.push({x:bx0+10+Math.random()*(bw-20),y:wy+10+Math.random()*(by1-wy-20),vx:0,vy:0,a:Math.random()*6.28}); }
    // water
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.09)'; ctx.fillRect(bx0,wy,bw,by1-wy); ctx.restore();
    line(ctx,bx0,wy,bx1,wy,COL.blue,2.2);
    wlist.forEach(p=>{ p.vx+=gauss()*90*dt; p.vy+=gauss()*90*dt; p.vx*=0.95; p.vy*=0.95; p.x+=p.vx*dt; p.y+=p.vy*dt; p.a+=gauss()*dt*2;
      if(p.x<bx0+8){p.x=bx0+8;p.vx=Math.abs(p.vx);} if(p.x>bx1-8){p.x=bx1-8;p.vx=-Math.abs(p.vx);} if(p.y<wy+8){p.y=wy+8;p.vy=Math.abs(p.vy);} if(p.y>by1-8){p.y=by1-8;p.vy=-Math.abs(p.vy);}
      drawMol(ctx,p.x,p.y,p.a,'wat',1,11*sc); });
    // spawn queue
    const n=nC(), sol=solu(), d=Math.min(1,sol/10), ndis=Math.round(d*M);
    const L=clamp(60*sc/(n*0.87),8,19*sc), kind=typ;
    if(queue>0){ spawn-=dt; if(spawn<=0){ spawn=0.16; const idx=M-queue; S.push({x:bx0+bw*(0.4+Math.random()*0.2),y:h*0.08,vy:0,vx:0,a:Math.PI/2+gauss()*0.4,st:'fall',dis:!!flags[idx],idx,tx:0}); queue--; } }
    // physics
    const fl=S.filter(s=>s.st==='float');
    S.forEach(s=>{
      if(s.st==='fall'){ s.vy+=700*dt; s.y+=s.vy*dt; s.a+=dt*2; if(s.y>=wy){ s.y=wy; s.vx=gauss()*40; s.vy*=0.2; s.st=s.dis?'dis':'float'; if(!s.dis){} } }
      else if(s.st==='dis'){ s.vx+=gauss()*70*dt; s.vy+=gauss()*70*dt+8*dt; s.vx*=0.97; s.vy*=0.97; s.x+=s.vx*dt; s.y+=s.vy*dt; s.a+=gauss()*dt*1.4;
        const m=n*L*0.4; if(s.x<bx0+m){s.x=bx0+m;s.vx=Math.abs(s.vx);} if(s.x>bx1-m){s.x=bx1-m;s.vx=-Math.abs(s.vx);} if(s.y<wy+14){s.y=wy+14;s.vy=Math.abs(s.vy);} if(s.y>by1-14){s.y=by1-14;s.vy=-Math.abs(s.vy);} }
      else { const k=fl.indexOf(s), F=Math.max(1,fl.length), slot=bx0+30+(k+0.5)*(bw-60)/F; s.x=approach(s.x,slot,3,dt); s.y=approach(s.y,wy-10-(k%2)*(10*sc)+Math.sin(t*2+k)*1.5,6,dt); s.a=approach(s.a,0,3,dt); }
    });
    // floating layer band
    if(fl.length>=3){ ctx.save(); ctx.fillStyle='rgba(31,157,85,0.10)'; ctx.fillRect(bx0,wy-30*sc,bw,30*sc); ctx.restore(); line(ctx,bx0,wy-30*sc,bx1,wy-30*sc,COL.green,1.4,[5,4]); textAt(ctx,'undissolved layer',bx0+8,wy-34*sc,{size:11.5,weight:700,color:COL.green}); }
    S.forEach(s=>{
      const o=drawMol(ctx,s.x,s.y,s.a,kind,n,L,COL.green);
      if(s.st==='dis' && kind!=='alk'){ let best=null,bd=48; wlist.forEach(p=>{ const dd=Math.hypot(p.x-o[0],p.y-o[1]); if(dd<bd){bd=dd;best=p;} }); if(best) line(ctx,o[0],o[1],best.x,best.y,COL.blue,2,[4,3]); }
    });

/* =====================================================================

function buildA3(){
  const wrap=mkLab(

  wireChips(wrap,'liq',k=>{ liq=k; reset(); });

    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); const sc=clamp(Math.min(w,h)/560,0.7,1.3), C=NA_SET[liq];

    // flask

    flaskDraw(ctx,cx,cy,R,neckTop,nw,ly,C.pk<12?'rgba(217,160,23,0.13)':'rgba(47,143,224,0.10)',()=>{});

        bead.vx+=((bead.tx-bead.x)*30-bead.vx*7)*dt*C.r*1.2; bead.x+=bead.vx*dt; }
      const by=state==='drop'?bead.y:ly-rr*0.5+Math.sin(t*9)*1.2*C.r;
      circ(ctx,bead.x||cx,by,Math.max(1,rr),COL.ink,'#e8eef6',2.2); line(ctx,(bead.x||cx)-rr*0.4,by-rr*0.4,(bead.x||cx)-rr*0.1,by-rr*0.55,COL.mid,1.4);
      if(state==='run') bubbleStep(bub,ctx,dt,(bead.x||cx)-rr,(bead.x||cx)+rr,ly-R*0.8,90,COL.blue,clamp(dmdt*900,0,60),by,60);
      textAt(ctx,'Na',(bead.x||cx),by-rr-8,{align:'center',size:11.5,weight:700,color:COL.ink});

    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.beginPath(); path.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore();

    for(let v=0;v<=160;v+=20){ const xx=sx0+6+v/Vmax*bl; line(ctx,xx,sy-hh,xx,sy-hh+(v%40?5:9),COL.ink,1.4); if(v%40===0) textAt(ctx,v+'',xx,sy-hh-6,{align:'center',size:10.5,weight:700,color:COL.muted}); }

/* =====================================================================
   2.4 WHY PHENOL IS ACIDIC   (NCERT §7.4.4 (a)(iii), Table 7.3)

   [H⁺] = x + 10⁻⁷,  pH = −log[H⁺].  Phenoxide is stabilised by charge

   Textbook check: phenol (10.0) vs ethanol (15.9) → 10^5.9 ≈ 8×10⁵,
   “a million times more acidic”.

const PK_SET={
  etoh:{n:'Ethanol',s:'EtOH',pk:15.9,ring:false,sub:[]},
  phenol:{n:'Phenol',s:'PhOH',pk:10.0,ring:true,sub:[]},
  pcres:{n:'p-Cresol',s:'p-Cr',pk:10.2,ring:true,sub:[[3,'CH₃']]},

  onp:{n:'o-Nitrophenol',s:'o-NP',pk:7.2,ring:true,sub:[[1,'NO₂']]},
  pnp:{n:'p-Nitrophenol',s:'p-NP',pk:7.1,ring:true,sub:[[3,'NO₂']]},

function buildA4(){

    chipsH('cpd','Compound',Object.keys(PK_SET).map(k=>[k,PK_SET[k].n]),'phenol')+
    sliderH('conc','Concentration',0.01,1,0.01,0.1,' M')+
    cardsH([['r1','pKa'],['r2','pH of solution'],['r3','Ionised'],['r4','vs ethanol'],['r5','Ka']]));
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), cR=sliderVal(wrap,'conc',v=>v.toFixed(2)+' M');
  let cpd='phenol', t=0, ptr={x:10,v:0}, phPtr={x:7,v:0}, vis=0;
  wireChips(wrap,'cpd',k=>{ cpd=k; });
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); const sc=clamp(Math.min(w,h)/560,0.7,1.35), C=PK_SET[cpd];
    const Ka=Math.pow(10,-C.pk), c=+cR.value, x=(-Ka+Math.sqrt(Ka*Ka+4*Ka*c))/2, H=x+1e-7, pH=-Math.log10(H), alpha=x/c*100;
    const stab=clamp((15.9-C.pk)/15.5,0,1);

    const cyc=5, k=Math.floor(t/cyc), ph=(t%cyc);
    const pEv=clamp(0.06+0.94*stab,0.06,1), ion=hash01(k,cpd.length*13+7)<pEv;
    let he=0; if(ion){ he=smooth01(0.4,1.6,ph)-smooth01(3.3,4.6,ph); } else he=0.05*Math.sin(t*20);
    vis=approach(vis,ion?clamp(he*1.4,0,1):0,10,dt);
    const R=Math.min(h*0.115,w*0.1), cx=w*0.4, cy=h*0.43;
    const vx=i=>cx+Math.cos(-Math.PI/2+i*Math.PI/3)*R, vy=i=>cy+Math.sin(-Math.PI/2+i*Math.PI/3)*R;
    const ox=cx, oy=cy-R*1.9;
    const sites=[]; // charge-bearing sites when ionised
    function glow(px,py,a,r){ if(a<0.02) return; const g=ctx.createRadialGradient(px,py,0,px,py,r); g.addColorStop(0,'rgba(217,67,43,'+(0.55*a).toFixed(3)+')'); g.addColorStop(1,'rgba(217,67,43,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.fill(); }
    if(C.ring){

      line(ctx,vx(0),vy(0),ox,oy+9*sc,COL.red,2.6);
      sites.push([ox,oy]); [1,5,3].forEach(i=>sites.push([vx(i),vy(i)]));

        } else { textAt(ctx,'CH₃',bx+Math.cos(ang)*4,by+Math.sin(ang)*4+4,{align:'center',size:13*sc,weight:700,color:COL.green});
          // electron-releasing push arrows drift toward the ring
          for(let q=0;q<3;q++){ const u=((t*0.6+q/3)%1); const px=lerp(bx,vx(v),u), py=lerp(by,vy(v),u); ctx.save(); ctx.globalAlpha=Math.sin(u*Math.PI)*0.9; arrowHead(ctx,px,py,Math.atan2(vy(v)-by,vx(v)-bx),COL.green,8); ctx.restore(); } }
      });
    } else {
      // ethanol: CH3–CH2–O–H  (charge stays on O)
      const L=R*0.95; const c1=[ox-L*0.2,oy+L*1.05], c2=[ox-L*1.1,oy+L*1.5];
      line(ctx,ox,oy+9*sc,c1[0],c1[1],COL.ink,2.6); line(ctx,c1[0],c1[1],c2[0],c2[1],COL.ink,2.6);
      textAt(ctx,'CH₂',c1[0]+16,c1[1]+16,{size:13*sc,weight:700,color:COL.green}); textAt(ctx,'CH₃',c2[0]-14,c2[1]+16,{align:'center',size:13*sc,weight:700,color:COL.green});
      [-1,1].forEach(s=>{ for(let q=0;q<2;q++){ const u=((t*0.5+q/2)%1); const px=lerp(c2[0]-26,c1[0]+8,u), py=lerp(c2[1]-10,c1[1]-4,u); ctx.save(); ctx.globalAlpha=Math.sin(u*Math.PI)*0.7; arrowHead(ctx,px,py,Math.atan2(-6,1)*0.5,COL.green,7); ctx.restore(); } });

      else { const a=vis; glow(ox,oy,a*1.4,22*sc); textAt(ctx,'−',ox,oy+4,{align:'center',size:20*sc,weight:700,color:COL.red,alpha:a}); }
    }

    const hd=Math.min(1,Math.max(0,he)); const hx=ox+20*sc+hd*Math.min(w*0.2,150), hy=oy-4*sc-hd*Math.min(w*0.06,40);
    line(ctx,ox+8*sc,oy-2*sc,hx-8*sc,hy,COL.blue,Math.max(0.8,2.2*(1-hd)),hd>0.15?[3,3]:undefined);
    atom(ctx,'H',hx,hy,COL.blue,8*sc,hd>0.5?'#e6f1fc':'#fff'); if(hd>0.5) textAt(ctx,'H⁺',hx,hy-14*sc,{align:'center',size:12.5*sc,weight:700,color:COL.blue});
    textAt(ctx,C.n,cx,h*0.07,{align:'center',size:15,weight:700,color:COL.ink});
    textAt(ctx,ion?(C.ring?'phenoxide ion — charge spread around the ring':'ethoxide ion — charge stuck on O'):'O–H intact',cx,h*0.07+20,{align:'center',size:12,weight:700,color:ion?COL.red:COL.muted});

    const sx0=w*0.08, sx1=w*0.92, sy1=h*0.82, sy2=h*0.93;
    springTo(ptr,C.pk,60,11,dt); springTo(phPtr,pH,60,11,dt);
    const X=v=>sx0+(sx1-sx0)*clamp(v/16,0,1), Y=v=>sx0+(sx1-sx0)*clamp(v/14,0,1);
    const grad=ctx.createLinearGradient(sx0,0,sx1,0); grad.addColorStop(0,'#d9432b'); grad.addColorStop(0.25,'#e6a21a'); grad.addColorStop(0.5,'#1f9d55'); grad.addColorStop(1,'#2f8fe0');
    ctx.save(); ctx.fillStyle=grad; ctx.globalAlpha=0.35; ctx.fillRect(sx0,sy2-5,sx1-sx0,10); ctx.restore(); textAt(ctx,'pH 0',sx0,sy2+22,{size:11,weight:700,color:COL.muted}); textAt(ctx,'14',sx1,sy2+22,{align:'right',size:11,weight:700,color:COL.muted});
    triangle(ctx,Y(phPtr.x),sy2-9,COL.yellow); textAt(ctx,'pH '+fmt(pH,1),clamp(Y(phPtr.x),sx0+30,sx1-30),sy2+22,{align:'center',size:12,weight:700,color:COL.yellow});
    line(ctx,sx0,sy1,sx1,sy1,COL.ink,2.2); textAt(ctx,'pKa  (smaller = stronger acid)',sx0,sy1-h*0.075,{size:11.5,weight:700,color:COL.muted});
    for(let v=0;v<=16;v+=2){ line(ctx,X(v),sy1-4,X(v),sy1+4,COL.ink,1.4); }
    Object.keys(PK_SET).forEach((q,i)=>{ const P=PK_SET[q], on=q===cpd; circ(ctx,X(P.pk),sy1,on?6:4,on?COL.red:COL.blue,on?COL.red:'#fff',2); textAt(ctx,P.s,X(P.pk),sy1-12-(i%2)*13,{align:'center',size:10.5,weight:700,color:on?COL.red:COL.muted}); });

/* =====================================================================

   Turbidity  τ(t) = 1 − e^(−t/τc),   τc(T) = τc(25 °C)·2^(−(T−25)/10)

/* =====================================================================

   dS/dday = −70·r(T)·S/(S+25)·act,  act = 1 − smooth(13 → 14.2 %)

   Textbook check: 200 g/L → 12.9 % ;  250 g/L stops at 14 % with ≈34 g left.

    btnH('go','▶ Ferment for 7 days','play')+
    cardsH([['r1','Day'],['r2','Sugar left'],['r3','Ethanol'],['r4','CO₂ released'],['r5','Ethanoic acid'],['r6','Taste']]));
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), sR=sliderVal(wrap,'su',v=>v+' g'), tR=sliderVal(wrap,'te',v=>v+' °C');
  let air='seal', t=0, day=0, run=false, S0=200, S=200, lost=0, bub=[], yeast=[], o2=[], gb=[], fb=[];
  wireChips(wrap,'air',k=>{ air=k; reset(); });
  function reset(){ S0=+sR.value; S=S0; day=0; run=false; lost=0; }
  sR.addEventListener('input',()=>{ if(!run) reset(); }); $('#go').onclick=()=>{ reset(); run=true; };

    const pctE=()=>2*(S0-S)/180*46.07/0.789/10-lost;
    let pct=pctE(); let rate=0;
    if(run){ const dd=dt*7/9; day+=dd; const act=1-smooth01(13,14.2,pct); rate=70*r*S/(S+25)*act; S=Math.max(0,S-rate*dd);
      if(air==='open'){ const lo=0.5*clamp(r*1.1,0,1.2)*dd*clamp(pct/1.5,0,1); lost=Math.min(lost+lo,pctE()+lost); }
      if(day>=7){ day=7; run=false; } }

    });

      if(Math.random()<dt*2.4) o2.push({x:cx+(Math.random()-0.5)*nw*2+30,y:neckTop-h*0.14,vx:-18,ph:Math.random()*6});
      for(let i=o2.length-1;i>=0;i--){ const o=o2[i]; o.y+=dt*38; o.x+=o.vx*dt*0.6+Math.sin(o.ph+t*2)*0.4; if(o.y>ly-10){ o2.splice(i,1); continue; } o.x=clamp(o.x,cx-nw+5,cx+nw-5)*(o.y>neckTop-20?1:0)+(o.y>neckTop-20?0:o.x); atom(ctx,'O₂',o.x,o.y,COL.red,8*sc); }
      textAt(ctx,'air enters — O₂ oxidises ethanol',cx,h*0.06,{align:'center',size:12,weight:700,color:COL.red});
    }
    textAt(ctx,'grape juice + yeast (zymase)',cx,cy+R+h*0.05,{align:'center',size:12,weight:700,color:COL.ink});
    // gauges on the right
    const gx=w*0.6, gw=w*0.34, gy=h*0.2;
    gauge(ctx,gx,gy,gw,14,S/300,COL.yellow,'sugar left',fmt(S,0)+' g');
    gauge(ctx,gx,gy+h*0.15,gw,14,pct/20,pct>=13.8?COL.red:COL.green,'ethanol  % v/v',fmt(pct,1)+' %',14/20); textAt(ctx,'14 % — zymase stops',gx+gw*0.7,gy+h*0.15+32,{align:'center',size:11,weight:700,color:COL.red});
    gauge(ctx,gx,gy+h*0.3,gw,14,acetic/60,COL.red,'ethanoic acid',fmt(acetic,1)+' g/L');
    const kx=gx+gw*0.5, ky=h*0.72, kr=Math.min(28,h*0.055); circ(ctx,kx,ky,kr,COL.ink,'#fff',2.4); ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(kx,ky,kr+5,-Math.PI/2,-Math.PI/2+Math.PI*2*day/7); ctx.stroke(); ctx.restore();
    const ha=-Math.PI/2+day/7*Math.PI*2; line(ctx,kx,ky,kx+Math.cos(ha)*kr*0.72,ky+Math.sin(ha)*kr*0.72,COL.ink,2.4); textAt(ctx,'day '+fmt(day,1),kx,ky+kr+22,{align:'center',size:12.5,weight:700});
    const taste=lost>0.8&&acetic>3?'sour (vinegar)':pct>1?'wine-like':'sweet juice';
    $('#r1').textContent=fmt(day,1)+' / 7'; $('#r2').textContent=fmt(S,0)+' g'; $('#r3').textContent=fmt(pct,1)+' % v/v'; $('#r4').textContent=fmt(co2L,0)+' L'; $('#r5').textContent=fmt(acetic,1)+' g/L'; $('#r6').textContent=taste;
    $('#go').disabled=run; $('#go').textContent=run?'⏳ day '+fmt(day,1):'▶ Ferment for 7 days';
  });
  return wrap;
}

/* =====================================================================
   2.10 WILLIAMSON ETHER SYNTHESIS   (NCERT §7.6.1, Example 7.6)
   R–X + R′O⁻ Na⁺ → R–O–R′ + NaX   (SN2: back-side attack, inversion)
   Elimination (E2) competes: alkoxide is also a strong base.
   Ether fraction: methyl 0.98 · 1° 0.90 · 2° 0.28 · 3° 0.
   Bulky alkoxide: ×0.88 (methyl, 1°) · ×0.40 (2°).
   Outcome per collision is stratified so the tally converges on the yield.
   Check (Ex 7.6): C₂H₅ONa + (CH₃)₃CBr → 2-methylpropene (0 % ether);
   (CH₃)₃CONa + C₂H₅Br → t-butyl ethyl ether (79 %).
   ===================================================================== */
const WS_HAL={
  me:{n:'CH₃Br',arms:['H','H','H'],p:0.98,beta:false,cls:'methyl',alk:null,R:'CH₃'},
  pri:{n:'CH₃CH₂Br',arms:['CH₃','H','H'],p:0.90,beta:true,cls:'1°',alk:'ethene',R:'C₂H₅'},
  sec:{n:'(CH₃)₂CHBr',arms:['CH₃','CH₃','H'],p:0.28,beta:true,cls:'2°',alk:'propene',R:'CH(CH₃)₂'},
  ter:{n:'(CH₃)₃CBr',arms:['CH₃','CH₃','CH₃'],p:0,beta:true,cls:'3°',alk:'2-methylpropene',R:'C(CH₃)₃'}
};
const WS_NU={me:{n:'CH₃O⁻Na⁺',g:'CH₃',bulky:false},tb:{n:'(CH₃)₃CO⁻Na⁺',g:'(CH₃)₃C',bulky:true}};
function wsYield(h,nu){ const H=WS_HAL[h], N=WS_NU[nu]; if(h==='me'||h==='pri') return H.p*(N.bulky?0.88:1)*(h==='me'&&!N.bulky?1.0:1); if(h==='sec') return H.p*(N.bulky?0.4:1); return 0; }
function buildA10(){
  const wrap=mkLab(
    chipsH('hl','Alkyl bromide',Object.keys(WS_HAL).map(k=>[k,WS_HAL[k].cls+' · '+WS_HAL[k].n]),'pri')+
    chipsH('nu','Sodium alkoxide',Object.keys(WS_NU).map(k=>[k,WS_NU[k].n]),'me')+
    btnH('rt','Reset tally','')+
    cardsH([['r1','Ether yield'],['r2','Alkene yield'],['r3','Tally ether : alkene'],['r4','Good route?'],['r5','Reaction',1]]));
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let hl='pri', nu='me', t=0, ph=0, nEv=0, nEth=0, nAlk=0, outcome='sn2', lastDone=-1;
  function resetT(){ nEv=0; nEth=0; nAlk=0; ph=0; lastDone=-1; pick(); }
  function pick(){ const p=wsYield(hl,nu); outcome=Math.floor((nEv+1)*p+0.5)>Math.floor(nEv*p+0.5)?'sn2':'e2'; if(hl==='me') outcome='sn2'; if(p===0&&hl!=='me') outcome='e2'; }
  wireChips(wrap,'hl',k=>{ hl=k; resetT(); }); wireChips(wrap,'nu',k=>{ nu=k; resetT(); }); $('#rt').onclick=resetT; pick();
  const CYC=5.6;
  animLoop(dt=>{
    t+=dt; ph+=dt; if(ph>=CYC){ ph=0; nEv++; if(outcome==='sn2') nEth++; else nAlk++; pick(); }
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h); const sc=clamp(h/430,0.8,1.5), H=WS_HAL[hl], N=WS_NU[nu];
    const L=58*sc, cx=w*0.5, cy=h*0.5, u=ph;
    const sn=outcome==='sn2';
    // timeline
    const ap=smooth01(0,1.7,u), ts=smooth01(1.7,3.0,u), dep=smooth01(3.0,4.7,u), fade=smooth01(4.9,5.5,u);
    const bounce=(!sn&&hl==='ter')?Math.sin(smooth01(1.0,1.7,u)*Math.PI)*0:0;
    // carbon, arms
    const nuHome=sn?[cx-L*2.1,cy]:[cx-L*1.5,cy-L*1.9];
    // nucleophile position
    let nx,ny;
    if(sn){ nx=lerp(cx-L*6,cx-L*1.35-(1-ts)*0.0,ap)+ts*L*0.25; ny=cy; }
    else {
      const blocked=hl==='ter'; if(blocked){ const a1=smooth01(0,1.0,u), back=smooth01(1.0,1.5,u), a2=smooth01(1.5,2.4,u); nx=lerp(cx-L*6,cx-L*2.15,a1); ny=cy; nx=lerp(nx,cx-L*3.4,back); nx=lerp(nx,cx-L*1.4,a2); ny=lerp(ny,cy-L*2.0,a2); }
      else { nx=lerp(cx-L*6,cx-L*1.4,ap); ny=lerp(cy-L*3,cy-L*2.0,ap); } }
    // umbrella flip (SN2)
    const flip=sn?ts:0, arm0=[Math.PI+0.95,Math.PI,Math.PI-0.95];
    const ang=k=>{ const a0=arm0[k], a1=k===1?0:(k===0?-0.95+Math.PI*2:0.95); return lerp(a0,a1,flip); };
    const brOff=L*(1+dep*3.2), brx=cx+brOff, bry=cy+dep*L*0.6*(sn?1:-1)*0.7-(sn?0:dep*L*0.5);
    const armPos=[]; for(let k=0;k<3;k++){ const a=ang(k); let len=L*(k===1?0.92*(0.35+0.65*Math.abs(Math.cos(flip*Math.PI))):1); const px=cx+Math.cos(a)*len, py=cy+Math.sin(a)*len; armPos.push([px,py,len]); }
    // E2: β-hydrogen on arm 0
    const hb=[armPos[0][0]+L*0.55,armPos[0][1]-L*0.62];
    let hbx=hb[0], hby=hb[1]; if(!sn){ const pull=smooth01(2.2,3.0,u); hbx=lerp(hb[0],nx+L*0.2,pull); hby=lerp(hb[1],ny+L*0.12,pull); }
    // draw arms
    armPos.forEach((p,k)=>{ const g=H.arms[k]; line(ctx,cx,cy,p[0],p[1],COL.ink,2.6);
      if(g==='H'){ atom(ctx,'H',p[0],p[1],COL.blue,8.5*sc); }
      else { circ(ctx,p[0],p[1],5*sc,COL.ink,COL.ink,1); textAt(ctx,'CH₃',p[0]-12*sc,p[1]+(k===0?-8:k===2?20:4)*sc,{align:'right',size:12*sc,weight:700,color:COL.green}); } });
    if(H.beta && H.arms[0]==='CH₃'){ // β-hydrogen hangs on arm 0
      if(!sn||true){ line(ctx,armPos[0][0],armPos[0][1],hbx,hby,COL.ink,sn?1.6:Math.max(0.6,1.8*(1-smooth01(2.2,3.0,u)))); atom(ctx,'H',hbx,hby,COL.blue,7.5*sc); } }
    // E2: new C=C
    if(!sn){ const dbA=smooth01(2.4,3.4,u); if(dbA>0.02){ ctx.save(); ctx.globalAlpha=dbA; const p=armPos[0]; dbl(ctx,cx,cy,p[0],p[1],COL.green,2.6,3.6); ctx.restore(); } }
    // C–Br bond
    const brCol=sn?COL.yellow:COL.yellow; const bondA=1-smooth01(2.6,3.4,u);
    ctx.save(); ctx.globalAlpha=0.35+0.65*bondA; line(ctx,cx,cy,brx-10*sc,bry,COL.ink,2.6,bondA<0.95?[5,4]:undefined); ctx.restore();
    atom(ctx,'C',cx,cy,COL.ink,11*sc);
    atom(ctx,'Br'+(dep>0.6?'⁻':''),brx,bry,COL.yellow,12*sc,'#fff9e4');
    // nucleophile
    const nr=(N.bulky?15:11)*sc; const bondN=sn?smooth01(1.9,2.9,u):0;
    if(sn && bondN>0.01){ ctx.save(); ctx.globalAlpha=0.35+0.65*bondN; line(ctx,cx,cy,nx+nr,ny,COL.red,2.6,bondN<0.95?[5,4]:undefined); ctx.restore(); }
    const keepOH=!sn&&smooth01(2.6,3.2,u)>0.5;
    ctx.save(); line(ctx,nx-nr,ny,nx-nr-L*0.8,ny,COL.green,2.6); ctx.restore();
    atom(ctx,'O'+(sn&&ts>0.5||keepOH?'':'⁻'),nx,ny,COL.red,nr);
    textAt(ctx,N.g,nx-nr-L*0.85,ny+(N.bulky?-14:20),{align:'center',size:12.5*sc,weight:700,color:COL.green});
    if(!sn && keepOH){ const hx2=hbx, hy2=hby; line(ctx,nx+nr*0.6,ny-nr*0.6,hx2,hy2,COL.blue,1.8); }
    // blocked marker for the tertiary halide
    if(!sn&&hl==='ter'&&u>0.9&&u<1.6){ ctx.save(); ctx.globalAlpha=Math.sin(smooth01(0.9,1.6,u)*Math.PI); textAt(ctx,'blocked — three CH₃ groups',cx-L*3.4,cy+L*1.5,{align:'center',size:12.5,weight:700,color:COL.red}); line(ctx,cx-L*2.6,cy-14,cx-L*2.6+0,cy+14,COL.red,3); ctx.restore(); }
    // phase captions
    const cap=sn?(u<1.7?'back-side attack':u<3?'transition state — umbrella flips':u<5?'ether formed · Br⁻ leaves (inversion)':''):(u<1.7?(hl==='ter'?'back-side blocked':'alkoxide acts as a base'):u<3?'base removes β-hydrogen':'alkene formed · Br⁻ leaves (elimination)');
    textAt(ctx,cap,w*0.5,h*0.09,{align:'center',size:15,weight:700,color:sn?COL.green:COL.red,alpha:1-fade*0.7});
    textAt(ctx,sn?'SN2':'E2',w*0.5,h*0.09+22,{align:'center',size:13,weight:700,color:COL.muted});
    // product label
    if(dep>0.4){ const keyN=H.R; const eth=N.g+'–O–'+H.R; const pname=sn?eth:H.alk; ctx.save(); ctx.globalAlpha=smooth01(0.4,1,dep)*(1-fade); textAt(ctx,pname,w*0.5,h*0.9,{align:'center',size:17,weight:700,color:COL.green}); textAt(ctx,sn?'ether':'alkene (no ether)',w*0.5,h*0.9+20,{align:'center',size:12,weight:700,color:COL.muted}); ctx.restore(); }
    // bars
    const y=wsYield(hl,nu), gx=w*0.08, gw=w*0.84;
    gauge(ctx,gx,h*0.8-h*0.02,gw*0.4,12,y,COL.green,'ether yield (theory)',Math.round(y*100)+' %'); gauge(ctx,gx+gw*0.55,h*0.8-h*0.02,gw*0.45,12,1-y,COL.red,'alkene yield (theory)',Math.round((1-y)*100)+' %');
    const good=y>0.7?'Good':y>0.2?'Poor':'Fails';
    $('#r1').textContent=Math.round(y*100)+' %'; $('#r2').textContent=Math.round((1-y)*100)+' %'; $('#r3').textContent=nEth+' : '+nAlk; $('#r4').textContent=good;
    $('#r5').textContent=hl==='ter'?'(CH₃)₃CBr + '+N.n+' → '+(y>0?'ether':'2-methylpropene'):H.n+' + '+N.n+' → '+N.g+'–O–'+H.R+' + NaBr';
  });
  return wrap;
}

  { num:'2.2', title:'Solubility in Water', desc:'Chain length vs –OH', build: buildA2 },
  { num:'2.3', title:'Sodium Test', desc:'Which –OH is the stronger acid?', build: buildA3 },

  { num:'2.7', title:'Oxidation of Alcohols', desc:'1° · 2° · 3° + oxidant', build: buildA7 },

  { num:'2.9', title:'Fermentation', desc:'Sugar → ethanol + CO₂', build: buildA9 },
  { num:'2.10', title:'Williamson Synthesis', desc:'SN2 or elimination?', build: buildA10 },

let currentIndex = 0;
function buildNav(){
  const nav = document.getElementById('sideNav'); nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops(); buildNav();
  const a = activities[currentIndex];

  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';

function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}
const hashIdx=parseInt((location.hash||'').replace('#',''),10); if(hashIdx>=1&&hashIdx<=activities.length) currentIndex=hashIdx-1;
