<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 11 · Chapter 2 — Relations and Functions | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

<script>
/* =========================================================================
   GRADE 11 — CHAPTER 2: RELATIONS AND FUNCTIONS
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn objects fly (true parabolic arcs), spring, bounce or
   ease toward it every frame — nothing ever jumps. Idle objects breathe,
   scanners sweep, gears turn: never a single static frame.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimH(ctx,x1,x2,y,color){ line(ctx,x1,y,x2,y,color,1.6); arrowHead(ctx,x1,y,Math.PI,color,6); arrowHead(ctx,x2,y,0,color,6); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; }
function isSquare(n){ const r=Math.round(Math.sqrt(n)); return r*r===n; }

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
let activeTicks = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; activeTicks=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  activeTicks.push(tick);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Fast-forward hook (used for automated checks): runs every live loop for <sec> seconds of simulated time. */
window.__sim={ advance(sec){ const n=Math.round(sec*60); for(let i=0;i<n;i++) activeTicks.slice().forEach(f=>f(1/60)); } };
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}
/** Chip row builder: items = [{id,label}], returns the buttons */
function chips(container,items,activeId,cb,cls){
  container.innerHTML='';
  const btns=items.map(it=>{
    const b=document.createElement('button'); b.className=(cls||'chip-btn')+(it.id===activeId?' active':''); b.textContent=it.label; b.dataset.id=it.id;
    container.appendChild(b); return b;
  });
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b.dataset.id,b); });
  return btns;
}

/* ---------------------------------------------------------------------
   0c. SET-THEORY DRAWING HELPERS
   --------------------------------------------------------------------- */
/** A set element: round token, or a pill when the label is long.
    o: r, fill, stroke, stroke2 (inner ring), text, alpha, sx, sy, rot, lw, size */
function tok(ctx,x,y,label,o){
  o=o||{}; const r=o.r||15; label=String(label);
  ctx.save(); ctx.translate(x,y);
  if(o.sx||o.sy) ctx.scale(o.sx||1,o.sy||1);
  if(o.alpha!==undefined) ctx.globalAlpha=clamp(o.alpha,0,1);
  const fs=o.size||Math.max(9,Math.round(r*0.9));
  ctx.font='700 '+fs+'px Poppins, sans-serif';
  const tw=ctx.measureText(label).width, W=Math.max(r*2, tw+r*0.9);
  const path=(ins)=>{ if(W>r*2+1) rrect(ctx,-W/2+ins,-r+ins,W-2*ins,2*(r-ins),r-ins); else { ctx.beginPath(); ctx.arc(0,0,r-ins,0,Math.PI*2); } };
  path(0); ctx.fillStyle=o.fill||'#fff'; ctx.fill(); ctx.lineWidth=o.lw||2.2; ctx.strokeStyle=o.stroke||COL.ink; ctx.stroke();
  if(o.stroke2){ path(3.4); ctx.lineWidth=(o.lw||2.2)*0.8; ctx.strokeStyle=o.stroke2; ctx.stroke(); }
  ctx.fillStyle=o.text||COL.ink; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label,0,1);
  if(o.rot!==undefined && W<=r*2+1){ ctx.beginPath(); ctx.arc(Math.cos(o.rot)*r*0.76,Math.sin(o.rot)*r*0.76,2.3,0,Math.PI*2); ctx.fillStyle=COL.mid; ctx.fill(); }
  ctx.restore();
  return W;
}
/** Parabolic flight: x moves uniformly, y follows a true parabola of apex height h. */
function startFlight(b,x1,y1,T,h,d){ b.fl={t:0,T:T,x0:b.x,y0:b.y,x1:x1,y1:y1,h:h,d:d||0}; }
function stepFlight(b,dt){
  const f=b.fl; if(!f) return false;
  if(f.d>0){ f.d-=dt; return false; }
  f.t+=dt; const s=clamp(f.t/f.T,0,1);
  b.x=lerp(f.x0,f.x1,s); b.y=lerp(f.y0,f.y1,s)-f.h*4*s*(1-s);
  if(s>=1){ b.fl=null; if(b.sq) b.sq.v=-7; return true; }
  return false;
}
/** squash-and-stretch from a landing spring */
function squash(b){ const q=b.sq?clamp(b.sq.x,-0.6,0.6):0; return {sx:1+0.28*q, sy:1-0.34*q}; }
function mkSq(){ return {x:0,v:0}; }
function stepSq(b,dt){ if(b.sq) springTo(b.sq,0,220,10,dt); }


/* ---------------------------------------------------------------------
   0c. RELATIONS-&-FUNCTIONS HELPERS  (plots, arrow diagrams, effects)
   --------------------------------------------------------------------- */
const setS = a => a.length ? '{ '+a.join(', ')+' }' : '∅';
const pairS = p => '('+p[0]+', '+p[1]+')';
const fnum = (v,d) => { if(!isFinite(v)) return '—'; const s=Number(v.toFixed(d===undefined?2:d)); return (Object.is(s,-0)?0:s).toString().replace('-','−'); };
function tokW(ctx,label,r,size){
  const fs=size||Math.max(9,Math.round(r*0.9)); ctx.save(); ctx.font='700 '+fs+'px Poppins, sans-serif';
  const tw=ctx.measureText(String(label)).width; ctx.restore(); return Math.max(r*2,tw+r*0.9);
}
/** expanding ring effect (a pulse where something lands / locks) */
function fxAdd(list,x,y,col,r1){ list.push({x:x,y:y,col:col,t:0,r1:r1||34}); }
function fxDraw(ctx,list,dt){
  for(let i=list.length-1;i>=0;i--){
    const f=list[i]; f.t+=dt/0.6; if(f.t>=1){ list.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=1-f.t; circ(ctx,f.x,f.y,6+f.r1*f.t,f.col,null,2.4); ctx.restore();
  }
}
function dot(ctx,x,y,r,stroke,fill,lw){ circ(ctx,x,y,r,stroke,fill===undefined?'#fff':fill,lw||2.2); }

/** Cartesian view. v = {x0,x1,y0,y1}; o.equal keeps 1 unit = 1 unit on both axes. */
function mkView(w,h,v,o){

    X:x=>pl+(x-x0)*sx, Y:y=>pt+ah-(y-y0)*sy, ix:px=>x0+(px-pl)/sx, iy:py=>y0+(pt+ah-py)/sy};
}

/** plot f over [x0,x1]; f may return null/NaN to leave a gap. Segments break on huge jumps (asymptotes). */
function plotFn(ctx,V,f,x0,x1,color,lw,o){
  o=o||{}; const n=o.n||360; ctx.save(); ctx.beginPath(); ctx.rect(V.L,V.T,V.R-V.L,V.B-V.T); ctx.clip();

/* ---- arrow diagrams ---- */
function bezPt(p0,c1,c2,p1,u){ const v=1-u, a=v*v*v, b=3*v*v*u, c=3*v*u*u, d=u*u*u; return {x:a*p0.x+b*c1.x+c*c2.x+d*p1.x, y:a*p0.y+b*c1.y+c*c2.y+d*p1.y}; }
function arrowTo(ctx,x0,y0,x1,y1,s,color,lw){
  s=clamp(s,0,1); if(s<0.03) return;
  const dx=(x1-x0)*0.45, p0={x:x0,y:y0}, c1={x:x0+dx,y:y0}, c2={x:x1-dx,y:y1}, p1={x:x1,y:y1};
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lw||2.4; ctx.lineCap='round'; ctx.beginPath();
  let last=null, prev=null; const N=28;
  for(let i=0;i<=N;i++){ const p=bezPt(p0,c1,c2,p1,s*i/N); if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); prev=last; last=p; }
  ctx.stroke(); ctx.restore();
  if(s>0.15&&prev) arrowHead(ctx,last.x,last.y,Math.atan2(last.y-prev.y,last.x-prev.x),color,8.5);
}
function setOval(ctx,cx,cy,rw,rh,color,label,lw,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lw||2.4; if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.ellipse(cx,cy,rw,rh,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
  if(label) textAt(ctx,label,cx,cy-rh-8,{align:'center',weight:700,size:13,color:color});
}
/** two vertical columns of elements (A left, B right). Returns positions + half-widths. */
function adLayout(ctx,w,h,A,B){
  const n=Math.max(A.length,B.length,1), sp=Math.min(60,(h*0.74)/n), r=Math.min(19,sp*0.4);
  const wA=A.map(a=>tokW(ctx,a,r)), wB=B.map(b=>tokW(ctx,b,r));
  const mA=Math.max(2*r,...wA), mB=Math.max(2*r,...wB);
  const ax=w*0.2+mA*0.1, bx=w*0.8-mB*0.1, cy=h*0.53;
  const pA=A.map((a,i)=>({x:ax,y:cy+(i-(A.length-1)/2)*sp,w:wA[i]}));
  const pB=B.map((b,i)=>({x:bx,y:cy+(i-(B.length-1)/2)*sp,w:wB[i]}));
  return {r:r,sp:sp,pA:pA,pB:pB,ax:ax,bx:bx,cy:cy,
    rwA:mA/2+26, rhA:A.length*sp/2+20, rwB:mB/2+26, rhB:B.length*sp/2+20};
}
/** live arrows: each (i,j) pair has a spring-driven extension s; wanted → grows (with overshoot), unwanted → retracts. */
function makeArrows(){
  const m=new Map();
  return {
    want(list){ const keep=new Set();
      list.forEach(p=>{ const k=p[0]+'|'+p[1]; keep.add(k); const a=m.get(k); if(!a) m.set(k,{i:p[0],j:p[1],s:{x:0,v:0},w:1}); else a.w=1; });
      m.forEach(a=>{ if(!keep.has(a.i+'|'+a.j)) a.w=0; }); },
    clear(){ m.forEach(a=>{ a.w=0; }); },
    replay(){ m.forEach(a=>{ a.s.x=0; a.s.v=0; }); },
    step(dt){ m.forEach((a,k)=>{ if(a.w) springTo(a.s,1,85,12,dt); else { a.s.x=approach(a.s.x,0,10,dt); a.s.v=0; if(a.s.x<0.01) m.delete(k); } }); },
    all(){ return Array.from(m.values()); },
    live(){ return Array.from(m.values()).filter(a=>a.w); }
  };
}

/* =====================================================================
   2.2a CARTESIAN PRODUCT  (§2.2 — Fig 2.1, 2.2, 2.3;  n(A×B) = pq)
   Each pair is built live: a copy of a leaves its row, a copy of b leaves
   its column, both fly in true parabolas and fuse into the ordered pair
   (a, b) with a landing squash. Swapping to B × A flips every pair about
   its vertical axis — (red, b) is not (b, red).
   ===================================================================== */
const CP_SETS=[
  {id:'col', label:'Colours × Items', A:['red','blue','green','black','pink'], B:['b','c','s','h','t'], nA:2, nB:3},
  {id:'lic', label:'Licence codes',   A:['DL','MP','KA','TN','UP'], B:['01','02','03','04','05'], nA:3, nB:3},
  {id:'ab',  label:'a₁… × b₁…',       A:['a1','a2','a3','a4','a5'], B:['b1','b2','b3','b4','b5'], nA:2, nB:4}
];
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label style="margin-bottom:4px;">Sets</label><div class="chip-wrap" id="preB"></div></div>
    <div class="control-group">
      <label>n(A) <span class="val" id="nAV" style="color:var(--f-blue)"></span></label><input type="range" id="nAR" min="1" max="5" step="1" value="2">
      <label style="margin-top:9px;">n(B) <span class="val" id="nBV" style="color:var(--f-red)"></span></label><input type="range" id="nBR" min="1" max="5" step="1" value="3"></div>
    <div class="control-group"><label style="margin-bottom:2px;">Pair order</label>
      <div class="toggle-group"><button class="toggle-btn active" id="oAB">A × B</button><button class="toggle-btn" id="oBA">B × A</button></div>
      <button class="toggle-btn navy" id="rebuildB">▶ Rebuild the pairs</button></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel">n(A)</div><div class="rval" id="rA" style="color:var(--f-blue)"></div></div>
      <div class="rcard"><div class="rlabel">n(B)</div><div class="rval" id="rB" style="color:var(--f-red)"></div></div>
      <div class="rcard"><div class="rlabel">Pairs</div><div class="rval" id="rP" style="color:var(--f-green)"></div></div></div>
      <div class="fb ok" id="vd"></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let pre=CP_SETS[0], nA=pre.nA, nB=pre.nB, swap=false, t=0, cells=[], fx=[], cur=0, curT=0;
  const rowEl=()=>swap?pre.B.slice(0,nB):pre.A.slice(0,nA), colEl=()=>swap?pre.A.slice(0,nA):pre.B.slice(0,nB);
  const label=(c,sw)=>sw?'('+pre.B[c.bj]+', '+pre.A[c.ai]+')':'('+pre.A[c.ai]+', '+pre.B[c.bj]+')';
  function build(){
    cells=[]; fx=[];
    for(let i=0;i<nA;i++) for(let j=0;j<nB;j++){
      const row=swap?j:i, col=swap?i:j, cols=swap?nA:nB;
      cells.push({ai:i,bj:j,state:'wait',d:0.3+(row*cols+col)*0.2,x:0,y:0,pa:null,pb:null,sq:mkSq(),ft:1,fromSwap:swap});
    }
    $('#nAV').textContent=nA; $('#nBV').textContent=nB; $('#rA').textContent=nA; $('#rB').textContent=nB;
  }
  function L(w,h){
    const rows=swap?nB:nA, cols=swap?nA:nB, cs=Math.max(40,Math.min(92,(w-130)/cols,(h-110)/rows));
    return {rows:rows,cols:cols,cs:cs,gx:(w-cols*cs)/2+36,gy:(h-rows*cs)/2+36};
  }
  const cellPos=(c,l)=>{ const row=swap?c.bj:c.ai, col=swap?c.ai:c.bj; return {x:l.gx+(col+0.5)*l.cs, y:l.gy+(row+0.5)*l.cs}; };
  chips($('#preB'),CP_SETS.map(s=>({id:s.id,label:s.label})),pre.id,id=>{ pre=CP_SETS.find(s=>s.id===id); nA=pre.nA; nB=pre.nB; $('#nAR').value=nA; $('#nBR').value=nB; build(); });
  $('#nAR').oninput=e=>{ nA=+e.target.value; build(); };
  $('#nBR').oninput=e=>{ nB=+e.target.value; build(); };
  $('#rebuildB').onclick=()=>build();
  function setOrder(sw){
    if(sw===swap) return; swap=sw;
    $('#oAB').classList.toggle('active',!swap); $('#oBA').classList.toggle('active',swap);
    cells.forEach(c=>{
      if(c.state==='placed'){ c.fromSwap=!swap; c.ft=0; }

  }

    const rc=swap?COL.red:COL.blue, cc=swap?COL.blue:COL.red;
    const hx=l.gx-cs*0.5-8, hy=l.gy-cs*0.5-8;
    // grid
    for(let r=0;r<l.rows;r++) for(let c=0;c<l.cols;c++){
      ctx.save(); rrect(ctx,l.gx+c*cs+3,l.gy+r*cs+3,cs-6,cs-6,9); ctx.strokeStyle='#dbe4f0'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
    }
    // headers
    rowEl().forEach((e,i)=>tok(ctx,hx,l.gy+(i+0.5)*cs+Math.sin(t*2+i)*2,e,{r:15,stroke:rc,text:rc,size:12}));
    colEl().forEach((e,j)=>tok(ctx,l.gx+(j+0.5)*cs,hy+Math.sin(t*2+j*1.3)*2,e,{r:15,stroke:cc,text:cc,size:12}));
    textAt(ctx,(swap?'B':'A')+' ↓',hx-4,hy-2,{align:'right',weight:700,size:13,color:rc});
    textAt(ctx,(swap?'A':'B')+' →',hx+4,hy-2,{align:'left',weight:700,size:13,color:cc});

          c.pb={x:l.gx+(col+0.5)*cs,y:hy,sq:mkSq(),lab:swap?pre.A[c.ai]:pre.B[c.bj]};

        c.x=approach(c.x,p.x,5,dt); c.y=approach(c.y,p.y,5,dt); stepSq(c,dt);
        const f=c.ft, sw=f<0.5?c.fromSwap:swap, q=squash(c);

        tok(ctx,c.x,c.y+Math.sin(t*1.8+c.ai*0.9+c.bj*1.3)*1.8-hop,label(c,sw),{r:rr,size:fs,stroke:COL.green,text:COL.ink,sx:sxf*q.sx,sy:q.sy,lw:2.4});
      }
    });

      textAt(ctx,label(c,swap)+'  ∈  '+(swap?'B × A':'A × B'),w-18,26,{align:'right',weight:700,size:15,color:COL.green});

  });

}

        <div class="rcard"><div class="rlabel">x + 1  vs  3</div><div class="rval" id="e1"></div></div>
        <div class="rcard"><div class="rlabel">y − 2  vs  1</div><div class="rval" id="e2"></div></div></div>
        <div class="fb" id="vd2"></div></div>
    </div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let mode='1', a=4, b=2, x=0, y=6, t=0, fx=[], locked=false;
  const P={x:{x:4,v:0},y:{x:2,v:0}}, Q={x:{x:2,v:0},y:{x:4,v:0}};
  const V1={x0:-6,x1:6,y0:-6,y1:6}, V2={x0:-4,x1:10,y0:-7,y1:8}, view={x0:-6,x1:6,y0:-6,y1:6};
  chips($('#modeB'),[{id:'1',label:'Order matters'},{id:'2',label:'Solve Example 1'}],'1',id=>{
    mode=id; $('#m1').classList.toggle('hidden',id!=='1'); $('#m2').classList.toggle('hidden',id!=='2'); locked=false; });
  $('#aR').oninput=e=>{ a=+e.target.value; }; $('#bR').oninput=e=>{ b=+e.target.value; };
  $('#xR').oninput=e=>{ x=+e.target.value; }; $('#yR').oninput=e=>{ y=+e.target.value; };
  $('#swapB').onclick=()=>{ const o=a; a=b; b=o; $('#aR').value=a; $('#bR').value=b; };

  animLoop(dt=>{
    t+=dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    viewTween(view,mode==='1'?V1:V2,4,dt);
    const V=mkView(w,h,view,{equal:true,pl:30,pb:26,pt:12,pr:12});
    drawAxes(ctx,V);
    const lx=mode==='1'?a:x+1, ly=mode==='1'?b:y-2;
    springTo(P.x,lx,70,8.5,dt); springTo(P.y,ly,70,8.5,dt);
    springTo(Q.x,b,70,8.5,dt); springTo(Q.y,a,70,8.5,dt);
    if(mode==='1'){
      $('#aV').textContent=a; $('#bV').textContent=b;
      // mirror line y = x
      ctx.save(); ctx.beginPath(); ctx.rect(V.L,V.T,V.R-V.L,V.B-V.T); ctx.clip();
      line(ctx,V.X(-30),V.Y(-30),V.X(30),V.Y(30),COL.yellow,2,[8,6]); ctx.restore();
      textAt(ctx,'y = x',V.X(5.2),V.Y(5.2)-8,{color:COL.yellow,weight:700,size:12});
      const same=a===b;
      // reflection arc between the two points
      if(!same){
        const x1=V.X(P.x.x), y1=V.Y(P.y.x), x2=V.X(Q.x.x), y2=V.Y(Q.y.x);
        ctx.save(); ctx.setLineDash([3,5]); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(x1,y1);
        ctx.quadraticCurveTo((x1+x2)/2+(y2-y1)*0.18,(y1+y2)/2-(x2-x1)*0.18,x2,y2); ctx.stroke(); ctx.restore();
      }
      project(ctx,V,Q.x.x,Q.y.x,0.55);
      dot(ctx,V.X(Q.x.x),V.Y(Q.y.x),8,COL.green,'#e4f7ec',2.6);
      project(ctx,V,P.x.x,P.y.x,1);
      dot(ctx,V.X(P.x.x),V.Y(P.y.x),9,COL.ink,'#fff',2.8);
      if(same) circ(ctx,V.X(P.x.x),V.Y(P.y.x),13+4*Math.sin(t*5),COL.green,null,2.4);
      textAt(ctx,'('+a+', '+b+')',V.X(P.x.x)+12,V.Y(P.y.x)-10,{weight:700,size:13,color:COL.ink});
      if(!same) textAt(ctx,'('+b+', '+a+')',V.X(Q.x.x)+12,V.Y(Q.y.x)+16,{weight:700,size:13,color:COL.green});
      $('#pab').textContent='('+fnum(a,0)+', '+fnum(b,0)+')'; $('#pba').textContent='('+fnum(b,0)+', '+fnum(a,0)+')';
      const vd=$('#vd1'); vd.className='fb '+(same?'ok':'bad'); vd.textContent=same?'Equal — both coordinates match':'(a, b) ≠ (b, a) — two different points';
    } else {
      $('#xV').textContent=x; $('#yV').textContent=y;
      const ok1=x+1===3, ok2=y-2===1, now=ok1&&ok2;
      if(now&&!locked){ fxAdd(fx,V.X(3),V.Y(1),COL.green,60); }
      locked=now;
      // target reticle (3, 1)
      const tx=V.X(3), ty=V.Y(1), pr=12+3*Math.sin(t*4);
      circ(ctx,tx,ty,pr,COL.green,null,2.4); line(ctx,tx-pr-6,ty,tx+pr+6,ty,COL.green,1.6); line(ctx,tx,ty-pr-6,tx,ty+pr+6,COL.green,1.6);
      textAt(ctx,'(3, 1)',tx+16,ty+22,{weight:700,size:13,color:COL.green});
      const px=V.X(P.x.x), py=V.Y(P.y.x);
      if(!now) line(ctx,px,py,tx,ty,COL.yellow,1.6,[4,5]);
      project(ctx,V,P.x.x,P.y.x,1);
      dot(ctx,px,py,9,now?COL.green:COL.ink,now?'#e4f7ec':'#fff',2.8);
      textAt(ctx,'(x+1, y−2) = ('+(x+1)+', '+(y-2)+')',px+12,py-12,{weight:700,size:13,color:now?COL.green:COL.ink});
      const e1=$('#e1'), e2=$('#e2');
      e1.textContent=(x+1)+(ok1?' = 3 ✓':' ≠ 3'); e1.style.color=ok1?'var(--f-green)':'var(--f-red)';
      e2.textContent=(y-2)+(ok2?' = 1 ✓':' ≠ 1'); e2.style.color=ok2?'var(--f-green)':'var(--f-red)';
      const vd=$('#vd2'); vd.className='fb '+(now?'ok':'warn');
      vd.textContent=now?'Pairs equal ⇒ x = 2 and y = 3':'Match BOTH coordinates to land on (3, 1)';
    }
    fxDraw(ctx,fx,dt);
  });
  return wrap;
}

/* =====================================================================
   2.2c R × R  AND  R × R × R  (Remark (iii)–(iv), Example 5)
   A × B is a rectangle of ordered pairs; A × B × C stacks such
   rectangles into a box of ordered triplets. Bounds are springs, so the
   box stretches and settles; stretched to all of R it fills the space.
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label style="margin-bottom:4px;">Product</label><div class="chip-wrap" id="dimB"></div>
      <label style="margin:9px 0 2px;">Sets are</label><div class="chip-wrap" id="kindB"></div></div>
    <div class="control-group">
      <label>A from <span class="val" id="a0V" style="color:var(--f-blue)"></span></label><input type="range" id="a0R" min="-4" max="4" step="1" value="-2">
      <label style="margin-top:7px;">A to <span class="val" id="a1V" style="color:var(--f-blue)"></span></label><input type="range" id="a1R" min="-4" max="4" step="1" value="3">
      <label style="margin-top:11px;">B from <span class="val" id="b0V" style="color:var(--f-red)"></span></label><input type="range" id="b0R" min="-4" max="4" step="1" value="-1">
      <label style="margin-top:7px;">B to <span class="val" id="b1V" style="color:var(--f-red)"></span></label><input type="range" id="b1R" min="-4" max="4" step="1" value="3">
      <div id="cBox"><label style="margin-top:11px;">C from <span class="val" id="c0V" style="color:var(--f-green)"></span></label><input type="range" id="c0R" min="-4" max="4" step="1" value="-1">
      <label style="margin-top:7px;">C to <span class="val" id="c1V" style="color:var(--f-green)"></span></label><input type="range" id="c1R" min="-4" max="4" step="1" value="2"></div>
      <button class="toggle-btn navy" id="allB">∞ Stretch to all of ℝ</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">n(A)</div><div class="rval" id="nA" style="color:var(--f-blue)"></div></div>
      <div class="rcard"><div class="rlabel">n(B)</div><div class="rval" id="nB" style="color:var(--f-red)"></div></div>
      <div class="rcard"><div class="rlabel">n(C)</div><div class="rval" id="nC" style="color:var(--f-green)"></div></div>
      <div class="rcard"><div class="rlabel" id="nPL">n(A × B)</div><div class="rval" id="nP"></div></div></div>
      <div class="fb ok" id="vd"></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let dim='2', kind='int', all=false, t=0;
  const tg={a0:-2,a1:3,b0:-1,b1:3,c0:-1,c1:2};
  const S={}; Object.keys(tg).forEach(k=>S[k]={x:tg[k],v:0});
  const H={x:0,y:0,x1:0,y1:0,tm:0,fl:null,gx:0,gy:0,gz:0}, R=rng(9);
  chips($('#dimB'),[{id:'2',label:'A × B  (plane)'},{id:'3',label:'A × B × C  (space)'}],dim,id=>{ dim=id; $('#cBox').classList.toggle('hidden',id!=='3'); });
  chips($('#kindB'),[{id:'int',label:'Whole numbers'},{id:'real',label:'Real intervals'}],kind,id=>{ kind=id; });
  $('#cBox').classList.add('hidden');
  ['a','b','c'].forEach(s=>{
    const lo=$('#'+s+'0R'), hi=$('#'+s+'1R');
    lo.oninput=()=>{ if(+lo.value>+hi.value) hi.value=lo.value; tg[s+'0']=+lo.value; tg[s+'1']=+hi.value; };
    hi.oninput=()=>{ if(+hi.value<+lo.value) lo.value=hi.value; tg[s+'0']=+lo.value; tg[s+'1']=+hi.value; };
  });
  $('#allB').onclick=()=>{ all=!all; $('#allB').textContent=all?'↩ Back to intervals':'∞ Stretch to all of ℝ'; };
  const bound=(k)=>all?(k.endsWith('0')?-16:16):tg[k];
  const wgt=(i,lo,hi)=>clamp(i-(lo-0.5),0,1)*clamp((hi+0.5)-i,0,1);

  function proj3(x,y,z,l){
    const cy=Math.cos(l.yaw), sy=Math.sin(l.yaw), X=x*cy+z*sy, Z=-x*sy+z*cy, cp=Math.cos(l.pit), sp=Math.sin(l.pit);
    return {x:l.cx+l.s*X, y:l.cy-l.s*(y*cp-Z*sp)};
  }
  animLoop(dt=>{
    t+=dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    Object.keys(tg).forEach(k=>springTo(S[k],bound(k),60,8.5,dt));
    ['a0','a1','b0','b1','c0','c1'].forEach(k=>{ $('#'+k+'V').textContent=tg[k]; });
    const nA=tg.a1-tg.a0+1, nB=tg.b1-tg.b0+1, nC=tg.c1-tg.c0+1;
    if(dim==='2'){
      const V=mkView(w,h,{x0:-5.2,x1:5.2,y0:-5,y1:5},{equal:true,pl:20,pb:20,pt:12,pr:12});
      drawAxes(ctx,V);
      const xa=V.X(S.a0.x), xb=V.X(S.a1.x), yb=V.Y(S.b1.x), ya=V.Y(S.b0.x);
      ctx.save(); ctx.beginPath(); ctx.rect(V.L,V.T,V.R-V.L,V.B-V.T); ctx.clip();
      if(kind==='real'){
        ctx.fillStyle='rgba(31,157,85,0.08)'; ctx.fillRect(xa,yb,xb-xa,ya-yb);
        ctx.save(); ctx.beginPath(); ctx.rect(xa,yb,xb-xa,ya-yb); ctx.clip();
        ctx.strokeStyle=COL.green; ctx.globalAlpha=0.55; ctx.lineWidth=1.4; ctx.beginPath();
        const off=(t*12)%14, span=(xb-xa)+(ya-yb);
        for(let d=-14;d<span+14;d+=14){ ctx.moveTo(xa+d+off,ya); ctx.lineTo(xa+d+off+(ya-yb),yb); }
        ctx.stroke(); ctx.restore();
      }
      line(ctx,xa,yb,xb,yb,COL.blue,3); line(ctx,xa,ya,xb,ya,COL.blue,3);
      line(ctx,xa,yb,xa,ya,COL.red,3); line(ctx,xb,yb,xb,ya,COL.red,3);
      if(kind==='int'){
        for(let i=Math.ceil(V.x0);i<=Math.floor(V.x1);i++) for(let j=Math.ceil(V.y0);j<=Math.floor(V.y1);j++){
          const q=wgt(i,S.a0.x,S.a1.x)*wgt(j,S.b0.x,S.b1.x); if(q<0.02) continue;
          circ(ctx,V.X(i),V.Y(j),4.8*q,COL.green,COL.green,1);
        }
      }
      ctx.restore();
      // the sample pair
      if(kind==='int'){
        H.tm-=dt;
        if(!H.fl && H.tm<=0){
          const lo1=all?-4:tg.a0, hi1=all?4:tg.a1, lo2=all?-4:tg.b0, hi2=all?4:tg.b1;
          const nx=lo1+Math.floor(R()*(hi1-lo1+1)), ny=lo2+Math.floor(R()*(hi2-lo2+1));
          H.x=Math.round(H.x); H.y=Math.round(H.y); startFlight(H,nx,ny,0.6,0.9); H.tm=0.35;
        }
        if(stepFlight(H,dt)){ H.x=H.x1=Math.round(H.x); H.y=Math.round(H.y); }
        if(!H.fl){ H.x=Math.round(H.x); H.y=Math.round(H.y); }
      } else {
        const cx=(S.a0.x+S.a1.x)/2, cy=(S.b0.x+S.b1.x)/2, hx=clamp((S.a1.x-S.a0.x)/2*0.92,0,4.8), hy=clamp((S.b1.x-S.b0.x)/2*0.92,0,4.6);
        H.fl=null; H.x=clamp(cx,-5,5)+hx*Math.sin(t*0.9); H.y=clamp(cy,-5,5)+hy*Math.sin(t*1.4+1);
      }
      project(ctx,V,H.x,H.y,1);
      dot(ctx,V.X(H.x),V.Y(H.y),7.5,COL.yellow,'#fff',3);
      const sh=kind==='int'?[Math.round(H.x),Math.round(H.y)].join(', '):fnum(H.x,1)+', '+fnum(H.y,1);
      textAt(ctx,'('+sh+')',V.X(H.x)+12,V.Y(H.y)-10,{weight:700,size:13});
      $('#nC').textContent='—'; $('#nPL').textContent='n(A × B)';
      if(all){ $('#nA').textContent='∞'; $('#nB').textContent='∞'; $('#nP').textContent='∞'; }
      else if(kind==='int'){ $('#nA').textContent=nA; $('#nB').textContent=nB; $('#nP').textContent=nA*nB; }
      else { $('#nA').textContent='∞'; $('#nB').textContent='∞'; $('#nP').textContent='∞'; }
      $('#vd').textContent=all?'ℝ × ℝ = every point (x, y) of the plane':(kind==='int'?nA+' × '+nB+' = '+(nA*nB)+' ordered pairs':'Infinite sets ⇒ infinite product');
    } else {
      const l={cx:w*0.5,cy:h*0.54,s:Math.min(w,h)/10.5,yaw:-0.62+0.32*Math.sin(t*0.45),pit:0.42};
      const A=[S.a0.x,S.a1.x], B=[S.b0.x,S.b1.x], C=[S.c0.x,S.c1.x];
      // axes
      const ax=[[1,0,0,COL.blue,'x'],[0,1,0,COL.red,'y'],[0,0,1,COL.green,'z']];
      ax.forEach(q=>{
        const p0=proj3(-5.2*q[0],-5.2*q[1],-5.2*q[2],l), p1=proj3(5.4*q[0],5.4*q[1],5.4*q[2],l);
        line(ctx,p0.x,p0.y,p1.x,p1.y,q[3],1.4,[2,5]);
        const an=Math.atan2(p1.y-p0.y,p1.x-p0.x); arrowHead(ctx,p1.x,p1.y,an,q[3],8);
        textAt(ctx,q[4],p1.x+Math.cos(an)*10,p1.y+Math.sin(an)*10,{color:q[3],weight:700,size:13,align:'center',baseline:'middle'});
      });
      if(kind==='int'){
        for(let i=-4;i<=4;i++) for(let j=-4;j<=4;j++) for(let k=-4;k<=4;k++){
          const q=wgt(i,A[0],A[1])*wgt(j,B[0],B[1])*wgt(k,C[0],C[1]); if(q<0.02) continue;
          const p=proj3(i,j,k,l); circ(ctx,p.x,p.y,2.8*q,COL.ink,COL.ink,0.5);
        }
      }
      // sweeping A × B slice
      const zs=lerp(C[0],C[1],0.5+0.5*Math.sin(t*0.9));
      const sc=[[A[0],B[0]],[A[1],B[0]],[A[1],B[1]],[A[0],B[1]]].map(p=>proj3(p[0],p[1],zs,l));
      ctx.save(); ctx.beginPath(); sc.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath();
      ctx.fillStyle='rgba(217,160,23,0.16)'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
      // box edges
      const E=(x0,y0,z0,x1,y1,z1,c)=>{ const p=proj3(x0,y0,z0,l), q=proj3(x1,y1,z1,l); line(ctx,p.x,p.y,q.x,q.y,c,3); };
      [B[0],B[1]].forEach(y=>[C[0],C[1]].forEach(z=>E(A[0],y,z,A[1],y,z,COL.blue)));
      [A[0],A[1]].forEach(x=>[C[0],C[1]].forEach(z=>E(x,B[0],z,x,B[1],z,COL.red)));
      [A[0],A[1]].forEach(x=>[B[0],B[1]].forEach(y=>E(x,y,C[0],x,y,C[1],COL.green)));
      // the travelling triplet
      const cx=(A[0]+A[1])/2, cy=(B[0]+B[1])/2, cz=(C[0]+C[1])/2;
      const hx=clamp((A[1]-A[0])/2,0,5), hy=clamp((B[1]-B[0])/2,0,5), hz=clamp((C[1]-C[0])/2,0,5);
      let tx=clamp(cx,-5,5)+hx*Math.sin(t*0.9), ty=clamp(cy,-5,5)+hy*Math.sin(t*1.3+1), tz=clamp(cz,-5,5)+hz*Math.sin(t*1.7+2);
      if(kind==='int'){ tx=Math.round(tx); ty=Math.round(ty); tz=Math.round(tz); }
      H.gx=approach(H.gx,tx,10,dt); H.gy=approach(H.gy,ty,10,dt); H.gz=approach(H.gz,tz,10,dt);
      const pp=proj3(H.gx,H.gy,H.gz,l);
      dot(ctx,pp.x,pp.y,7.5,COL.yellow,'#fff',3);
      textAt(ctx,'('+fnum(H.gx,kind==='int'?0:1)+', '+fnum(H.gy,kind==='int'?0:1)+', '+fnum(H.gz,kind==='int'?0:1)+')',pp.x+12,pp.y-10,{weight:700,size:13});
      $('#nPL').textContent='n(A × B × C)';
      if(all||kind==='real'){ ['nA','nB','nC','nP'].forEach(i=>$('#'+i).textContent='∞'); }
      else { $('#nA').textContent=nA; $('#nB').textContent=nB; $('#nC').textContent=nC; $('#nP').textContent=nA*nB*nC; }
      $('#vd').textContent=all?'ℝ × ℝ × ℝ = every point (x, y, z) of space':(kind==='int'?nA+' × '+nB+' × '+nC+' = '+(nA*nB*nC)+' ordered triplets':'Infinite sets ⇒ infinite product');
    }
  });
  return wrap;
}

/* =====================================================================
   2.3a RELATIONS & ARROW DIAGRAMS  (§2.3 — Fig 2.4–2.6, Examples 7–8)
   A relation is a subset of A × B. Each arrow shoots out with a spring
   overshoot; slide k and the whole bundle retracts and re-aims.
   ===================================================================== */
const REL4=[
  {id:'let', label:'First letter (Fig 2.4)', nA:'P', nB:'Q', A:['a','b','c'], B:['Ali','Bhanu','Binoy','Chandra','Divya'], test:(x,y)=>y[0].toLowerCase()===x},
  {id:'plus',label:'y = x + k  (Ex. 7)',     nA:'A', nB:'A', A:[1,2,3,4,5,6], B:[1,2,3,4,5,6], test:(x,y,k)=>y===x+k, k:true},
  {id:'sq',  label:'x = y²  (Ex. 8)',        nA:'P', nB:'Q', A:[1,4,9,25], B:[-5,-3,-2,2,3,5], test:(x,y)=>x===y*y},
  {id:'div', label:'y divisible by x',       nA:'A', nB:'A', A:[1,2,3,4,6], B:[1,2,3,4,6], test:(x,y)=>y%x===0},
  {id:'odd', label:'x − y is odd',           nA:'A', nB:'B', A:[1,2,3,5], B:[4,6,9], test:(x,y)=>Math.abs(x-y)%2===1}
];
const relLab=v=>typeof v==='number'?fnum(v,0):v;
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label style="margin-bottom:4px;">Relation</label><div class="chip-wrap" id="relB"></div>
      <div id="kBox" class="hidden"><label style="margin-top:9px;">k <span class="val" id="kV"></span></label><input type="range" id="kR" min="-3" max="3" step="1" value="1"></div></div>
    <div class="control-group"><label style="margin-bottom:4px;">Highlight</label><div class="chip-wrap" id="hlB"></div>
      <button class="toggle-btn navy" id="replayB">▶ Fire the arrows again</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard wide"><div class="rlabel">R (roster form)</div><div class="rval" id="rR" style="font-size:var(--fs-sm)"></div></div>
      <div class="rcard"><div class="rlabel">Domain</div><div class="rval" id="rD" style="color:var(--f-blue);font-size:var(--fs-sm)"></div></div>
      <div class="rcard"><div class="rlabel">Range</div><div class="rval" id="rG" style="color:var(--f-green);font-size:var(--fs-sm)"></div></div>
      <div class="rcard wide"><div class="rlabel">Codomain</div><div class="rval" id="rC" style="color:var(--f-red);font-size:var(--fs-sm)"></div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');

      return '<tr><td>'+relLab(x)+'</td><td>'+(J.length?J.map(j=>relLab(B[j])).join(', '):'—')+'</td><td class="'+(J.length===1?'r-ok':J.length>1?'r-bad':'r-warn')+'">'+(J.length===1?'1 ✓':J.length>1?'2+ ✗':'0 ✗')+'</td></tr>'; }).join('');

  });

}

/* =====================================================================
   2.4c LINEAR FUNCTION  f(x) = mx + c  (Remark after Ex 18; Example 20)

   hollow target lights green when the line passes through it; the red

const LIN9={
  e18:{label:'Example 18: x + 10', m:1, c:10, pts:[[-10,0],[-2,8],[-1,9],[0,10],[1,11],[2,12],[10,20]], v:{x0:-13,x1:13,y0:-4,y1:24}},
  e20:{label:'Example 20: 4 points', m:2, c:-1, pts:[[1,1],[2,3],[0,-1],[-1,-3]], v:{x0:-5,x1:5,y0:-5,y1:5}}
};
const linEq=(m,c)=>{ let s=''; if(m!==0) s+=m===1?'x':m===-1?'−x':fnum(m,1)+'x'; if(c!==0){ if(s) s+=(c>0?' + ':' − ')+fnum(Math.abs(c),0); else s+=fnum(c,0); } return 'f(x) = '+(s||'0'); };
function buildA9(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML=`
    <div class="control-group"><label style="margin-bottom:4px;">Task</label><div class="chip-wrap" id="mdB"></div></div>
    <div class="control-group">
      <label>Slope m <span class="val" id="mV" style="color:var(--f-blue)"></span></label><input type="range" id="mR" min="-4" max="4" step="0.5" value="0">
      <label style="margin-top:9px;">Intercept c <span class="val" id="cV" style="color:var(--f-red)"></span></label><input type="range" id="cR" min="-12" max="12" step="1" value="0"></div>
    <div class="control-group"><div class="result-cards">

      <div class="rcard wide"><div class="rlabel">Your line</div><div class="rval" id="rE"></div></div></div>
      <div class="fb warn" id="vd"></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let mode=LIN9.e18, m=0, c=0, t=0, fx=[], lit=[], locked=false;
  const M={x:0,v:0}, C={x:0,v:0}, view=Object.assign({},mode.v);

  animLoop(dt=>{
    t+=dt;

    viewTween(view,mode.v,4,dt);
    const V=mkView(w,h,view,{equal:true,pl:30,pb:24});
    drawAxes(ctx,V);

    mode.pts.forEach((p,i)=>{

      circ(ctx,px,py,ok?7:7+1.6*Math.sin(t*5+i),ok?COL.green:COL.yellow,ok?COL.green:'#fff',2.6);
      if(mode.pts.length<=5) textAt(ctx,pairS(p),px+10,py-10,{weight:700,size:12,color:ok?COL.green:COL.muted});
    });

  });

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    if(sweep){ ph+=dt*0.07; const m=ph%2, tri=m<1?m:2-m; $('#xR').value=(pr.lo+(pr.hi-pr.lo)*tri).toFixed(1); }
    let xT=+$('#xR').value; if(pr.id==='e16'&&Math.abs(xT+0.5)<0.07) xT=-0.5;
    springTo(xS,xT,120,15,dt);
    springTo(stack,(op==='add'||op==='sub')?1:0,70,12,dt);
    viewTween(view,pr.v,5,dt);
    const V=mkView(w,h,view,{pl:34,pb:26});
    drawAxes(ctx,V);
    plotFn(ctx,V,pr.f,V.x0,V.x1,COL.blue,2.2,{alpha:0.9});
    plotFn(ctx,V,pr.g,V.x0,V.x1,COL.red,2.2,{alpha:0.9});
    plotFn(ctx,V,x=>{ const f=pr.f(x); return isFinite(f)?res(x):NaN; },V.x0,V.x1,COL.green,3.6,{n:480});
    if(pr.id==='e16'&&op==='div') line(ctx,V.X(-0.5),V.T,V.X(-0.5),V.B,COL.red,1.4,[6,5]);
    // legend
    textAt(ctx,'f',V.L+10,V.T+16,{color:COL.blue,weight:700,size:14}); textAt(ctx,'g',V.L+28,V.T+16,{color:COL.red,weight:700,size:14}); textAt(ctx,'('+opSym[op]+')',V.L+46,V.T+16,{color:COL.green,weight:700,size:14});
    // bars at x
    const x=xS.x, f=pr.f(x), g=pr.g(x), r=res(x), okR=isFinite(r), s=clamp(stack.x,-0.2,1.2);
    const bw=Math.max(12,Math.min(26,(V.R-V.L)*0.032)), cx=V.X(x), y0=V.Y(0);
    line(ctx,cx,V.T,cx,V.B,COL.yellow,1.8,[6,5]);
    const bar=(bx,ya,yb,col,alpha)=>{ if(!isFinite(ya)||!isFinite(yb)) return; ctx.save(); ctx.beginPath(); ctx.rect(V.L,V.T,V.R-V.L,V.B-V.T); ctx.clip();
      ctx.globalAlpha=alpha||1; const top=Math.min(V.Y(ya),V.Y(yb)), hh=Math.abs(V.Y(ya)-V.Y(yb)); ctx.fillStyle=col+'33'; ctx.fillRect(bx-bw/2,top,bw,hh); ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.strokeRect(bx-bw/2,top,bw,hh); ctx.restore(); };
    const xf=cx-bw*1.4, xg=lerp(cx,xf,s), xr=cx+bw*1.4;
    bar(xf,0,f,COL.blue);
    const gb=op==='add'?s*f:op==='sub'?s*f:0, ge=op==='sub'?gb-g:gb+g;
    bar(xg,gb,ge,COL.red);
    if(okR) bar(xr,0,r,COL.green);
    if(okR&&(op==='add'||op==='sub')){ line(ctx,xf,V.Y(r),xr+bw/2,V.Y(r),COL.green,1.4,[3,4]); }
    dot(ctx,cx,okR?clamp(V.Y(r),V.T,V.B):y0,0.1,COL.green,COL.green,0);
    if(!okR) textAt(ctx,'undefined here',cx+10,V.T+38,{weight:700,size:13,color:COL.red});
    // readouts
    $('#xV').textContent=fnum(xT,1); $('#kV').textContent=fnum(k,1);
    $('#rf').textContent=fnum(f,2); $('#rg').textContent=fnum(g,2); $('#rrL').textContent=op==='sc'?'(kf)(x)':'('+opSym[op]+')(x)';
    $('#rr').textContent=okR?fnum(r,2):'undefined'; $('#rE').textContent='('+(op==='sc'?'kf':opSym[op])+')(x) = '+pr.txt[op];
    const vd=$('#vd'); vd.className='fb '+(okR?'ok':'bad');
    vd.textContent=okR?(op==='add'?fnum(f,2)+' + '+fnum(g,2)+' = '+fnum(r,2):op==='sub'?fnum(f,2)+' − '+fnum(g,2)+' = '+fnum(r,2):op==='mul'?fnum(f,2)+' × '+fnum(g,2)+' = '+fnum(r,2):op==='div'?fnum(f,2)+' ÷ '+fnum(g,2)+' = '+fnum(r,2):fnum(k,1)+' × '+fnum(f,2)+' = '+fnum(r,2)):'g(x) = 0 (or f undefined) — quotient does not exist';
  });
  return wrap;
}
