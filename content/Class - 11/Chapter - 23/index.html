const SETS6=[
  {id:'z', label:'∅',            els:[]},
  {id:'a', label:'{a}',          els:['a']},
  {id:'ab',label:'{a, b}',       els:['a','b']},
  {id:'n3',label:'{1, 2, 3}',    els:['1','2','3']},
  {id:'m1',label:'{−1, 0, 1}',   els:['−1','0','1']},
  {id:'a4',label:'{a, b, c, d}', els:['a','b','c','d']},
];
function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Parent set A</label><div class="chip-wrap" id="sB"></div></div>
    <div class="control-group"><label>Counter speed <span class="val" id="spV"></span></label><input type="range" id="spR" min="0.5" max="8" step="0.5" value="2.5">
      <div class="toggle-group"><button class="toggle-btn navy" id="rpB">↻ Replay</button></div></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel">n(A)</div><div class="rval" id="n1" style="color:var(--f-blue)"></div></div>
      <div class="rcard"><div class="rlabel">Subsets</div><div class="rval" id="n2" style="color:var(--f-green)"></div></div>
      <div class="rcard"><div class="rlabel">Proper</div><div class="rval" id="n3"></div></div></div>
      <p class="hint">Subsets = 2ⁿ · proper = 2ⁿ − 1</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let S=SETS6[3], rate=2.5, t=0, g, acc, cards, par, curMask, done, doneT, pop;
  const SZC=[COL.mid,COL.blue,COL.green,COL.yellow,COL.red];
  function restart(){ const n=S.els.length; g=0; acc=0.6; cards=[]; curMask=-1; done=false; doneT=0; pop={x:0,v:0};
    par=S.els.map(l=>({lab:l,lift:0,x:0,y:0})); }
  chips($('#sB'),SETS6.map(s=>({id:s.id,label:s.label})),S.id,id=>{ S=SETS6.find(s=>s.id===id); restart(); });
  $('#spR').oninput=e=>{ rate=+e.target.value; };
  $('#rpB').onclick=restart;
  restart();

  animLoop(dt=>{
    t+=dt; $('#spV').textContent=fmt(rate,1)+'/s';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const n=S.els.length, N=1<<n;
    // ---- layout ----
    const pr=Math.min(22,w*0.03), psp=pr*2+22, py=h*0.14;
    par.forEach((p,i)=>{ p.x=w/2+(i-(n-1)/2)*psp; p.y=py; });
    const cols=N<=4?N:4, rows=Math.ceil(N/cols);
    const gx0=w*0.04, gx1=w*0.96, gy0=h*0.3, gy1=h*0.97;
    const cw=Math.min(210,(gx1-gx0)/cols-12), ch=Math.min(116,(gy1-gy0)/rows-18);
    const cardPos=i=>({x:gx0+((gx1-gx0)/cols)*((i%cols)+0.5), y:gy0+((gy1-gy0)/rows)*(Math.floor(i/cols)+0.5)});
    const tr=Math.max(8,Math.min(17,ch*0.2,cw/(Math.max(n,1)*2.5)));
    const slot=(ci,j,sz)=>{ const c=cardPos(ci); return {x:c.x+(j-(sz-1)/2)*(tr*2+8), y:c.y+ch*0.1}; };
    // ---- generator ----
    if(!done){
      acc+=dt*rate;
      while(acc>=1 && g<N){
        acc-=1; const mask=g, bits=[]; for(let i=0;i<n;i++) if(mask>>i&1) bits.push(i);
        curMask=mask; const card={mask,sz:bits.length,pop:{x:0,v:5},clones:[]};
        bits.forEach((bi,j)=>{ const p=par[bi]; const cl={x:p.x,y:p.y,sq:mkSq(),j,landed:false};
          const tg=slot(cards.length,j,bits.length); startFlight(cl,tg.x,tg.y,0.75,50+Math.random()*40,j*0.07); card.clones.push(cl); });
        cards.push(card); g++;
      }
      if(g>=N && acc>=1){ done=true; doneT=0; pop.v=9; }
    } else { doneT+=dt; springTo(pop,1,170,9,dt); if(doneT>7) restart(); }
    // ---- parent set ----
    ctx.save(); rrect(ctx,w/2-(n*psp)/2-14,py-pr-12,n*psp+28,pr*2+24,14); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.4; ctx.setLineDash([8,6]); ctx.lineDashOffset=-t*14; ctx.stroke(); ctx.restore();
    if(n>0){ brace(ctx,w/2-(n*psp)/2-24,py-pr-8,py+pr+8,1,COL.blue,3); brace(ctx,w/2+(n*psp)/2+24,py-pr-8,py+pr+8,-1,COL.blue,3); }
    else textAt(ctx,'∅',w/2,py+14,{align:'center',size:40,weight:700,color:COL.blue});
    textAt(ctx,'A',w*0.04,py+6,{size:22,weight:700,color:COL.blue});
    par.forEach((p,i)=>{ const on=curMask>=0&&(curMask>>i&1); p.lift=approach(p.lift,on?1:0,14,dt);
      tok(ctx,p.x,p.y-p.lift*13,p.lab,{r:pr,stroke:on?COL.green:COL.blue,fill:on?'#e4f7ec':'#fff',lw:2.6});
      if(n<=4){ const bit=(curMask>=0?(curMask>>i&1):0); textAt(ctx,bit,p.x,py+pr+28,{align:'center',size:13,weight:700,color:on?COL.green:COL.mid}); } });
    if(n>0 && n<=4) textAt(ctx,'bits',w/2-(n*psp)/2-30,py+pr+28,{align:'right',size:11,weight:600,color:COL.mid});
    // ---- cards ----
    cards.forEach((c,ci)=>{
      springTo(c.pop,1,150,10,dt);
      const cp=cardPos(ci), sc=clamp(c.pop.x,0.2,1.15), col=SZC[Math.min(c.sz,4)];
      ctx.save(); ctx.translate(cp.x,cp.y); ctx.scale(sc,sc);
      rrect(ctx,-cw/2,-ch/2,cw,ch,12); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.stroke();
      const lab=c.sz===0?'∅':'{ '+S.els.filter((_,i)=>c.mask>>i&1).join(', ')+' }';
      ctx.restore();
      textAt(ctx,lab,cp.x,cp.y-ch/2*sc+16*sc,{align:'center',size:Math.max(10,Math.round(12*sc)),weight:700,color:col});
      if(c.sz===0) textAt(ctx,'∅',cp.x,cp.y+ch*0.16,{align:'center',size:Math.round(ch*0.42*sc),weight:700,color:COL.mid,alpha:clamp(c.pop.x,0,1)});
      c.clones.forEach(cl=>{ const tg=slot(ci,cl.j,c.sz); if(cl.fl){ cl.fl.x1=tg.x; cl.fl.y1=tg.y; if(stepFlight(cl,dt)) cl.landed=true; } else { cl.x=tg.x; cl.y=tg.y; } stepSq(cl,dt);
        const q=squash(cl); tok(ctx,cl.x,cl.y,S.els[bitIndex(c.mask,cl.j)],{r:tr,stroke:col,fill:'#fff',sx:q.sx,sy:q.sy,lw:2}); });
    });
    // ---- banner ----
    if(done){ ctx.save(); ctx.translate(w*0.86,py+2); const sc=clamp(pop.x,0,1.2); ctx.scale(sc,sc);
      textAt(ctx,'2'+['⁰','¹','²','³','⁴'][n]+' = '+N,0,0,{align:'center',size:Math.min(34,w*0.04),weight:700,color:COL.green}); ctx.restore(); }
    $('#n1').textContent=n; $('#n2').textContent=cards.length+' / '+N; $('#n3').textContent=Math.max(0,cards.length-(done?1:0));
  });
  function bitIndex(mask,j){ let k=-1,c=-1; for(let i=0;i<8;i++){ if(mask>>i&1){ c++; if(c===j) return i; } } return 0; }
  return wrap;
}

/* =====================================================================
   1.6c INTERVALS AS SUBSETS OF R  (§1.6.2, Fig 1.1)
   Endpoints slide on springs; closed ⇄ open end-dots fill and empty with
   a pop; a probe point glides along the line (or sweeps back and forth)
   and the interval decides ∈ / ∉ — including exactly at an endpoint.
   ===================================================================== */
const PRE7=[
  {id:'i1', label:'(−3, 5)',  a:-3, b:5,  lt:'open',   rt:'open'},
  {id:'i2', label:'[−7, 9]',  a:-7, b:9,  lt:'closed', rt:'closed'},
  {id:'i3', label:'(−5, 7]',  a:-5, b:7,  lt:'open',   rt:'closed'},
  {id:'i4', label:'[−3, 5)',  a:-3, b:5,  lt:'closed', rt:'open'},
  {id:'i5', label:'[0, ∞)',   a:0,  b:5,  lt:'closed', rt:'inf'},
  {id:'i6', label:'(−∞, 0)',  a:-5, b:0,  lt:'inf',    rt:'open'},
];
function buildA7(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Interval</label><div class="chip-wrap" id="pB"></div></div>
    <div class="control-group">
      <label><span style="color:var(--f-blue)">● a</span> (left end) <span class="val" id="aV"></span></label><input type="range" id="aR" min="-10" max="10" step="0.5" value="-3">
      <div class="toggle-group" id="ltB"><button class="toggle-btn small" data-m="closed">[ closed</button><button class="toggle-btn small active" data-m="open">( open</button><button class="toggle-btn small" data-m="inf">−∞</button></div>
      <label style="margin-top:9px;"><span style="color:var(--f-blue)">● b</span> (right end) <span class="val" id="bV"></span></label><input type="range" id="bR" min="-10" max="10" step="0.5" value="5">
      <div class="toggle-group" id="rtB"><button class="toggle-btn small" data-m="closed">] closed</button><button class="toggle-btn small active" data-m="open">) open</button><button class="toggle-btn small" data-m="inf">+∞</button></div></div>
    <div class="control-group"><label>Probe x <span class="val" id="xV"></span></label><input type="range" id="xR" min="-11" max="11" step="0.5" value="1">
      <div class="toggle-group"><button class="toggle-btn" id="swB">Sweep</button><button class="toggle-btn" id="paB">x = a</button><button class="toggle-btn" id="pbB">x = b</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Interval</div><div class="rval" id="inV" style="color:var(--f-blue)"></div></div>
      <div class="rcard"><div class="rlabel">Length b − a</div><div class="rval" id="lnV"></div></div>
      <div class="rcard wide"><div class="rlabel">Set-builder</div><div class="rval" id="sbV" style="font-size:var(--fs-sm)"></div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let a=-3,b=5,lt='open',rt='open',t=0,sweep=false,xT=1;
  const pa={x:-3,v:0}, pb={x:5,v:0}, fl={x:0,v:0}, fr={x:0,v:0}, ppL={x:0,v:0}, ppR={x:0,v:0}, px={x:1,v:0};
  function syncBtns(){ [['#ltB',lt],['#rtB',rt]].forEach(([id,m])=>$(id).querySelectorAll('button').forEach(bt=>bt.classList.toggle('active',bt.dataset.m===m))); $('#aR').value=a; $('#bR').value=b; }
  chips($('#pB'),PRE7.map(p=>({id:p.id,label:p.label})),'i1',id=>{ const p=PRE7.find(q=>q.id===id); a=p.a; b=p.b; if(lt!==p.lt) ppL.v=-6; if(rt!==p.rt) ppR.v=-6; lt=p.lt; rt=p.rt; syncBtns(); });
  $('#ltB').querySelectorAll('button').forEach(bt=>bt.onclick=()=>{ if(lt!==bt.dataset.m) ppL.v=-6; lt=bt.dataset.m; syncBtns(); });
  $('#rtB').querySelectorAll('button').forEach(bt=>bt.onclick=()=>{ if(rt!==bt.dataset.m) ppR.v=-6; rt=bt.dataset.m; syncBtns(); });
  $('#aR').oninput=e=>{ a=+e.target.value; if(a>=b){ b=a+0.5; $('#bR').value=b; } };
  $('#bR').oninput=e=>{ b=+e.target.value; if(b<=a){ a=b-0.5; $('#aR').value=a; } };
  $('#xR').oninput=e=>{ xT=+e.target.value; sweep=false; $('#swB').classList.remove('active'); };
  $('#swB').onclick=()=>{ sweep=!sweep; $('#swB').classList.toggle('active',sweep); };
  $('#paB').onclick=()=>{ sweep=false; $('#swB').classList.remove('active'); xT=a; $('#xR').value=clamp(a,-11,11); };
  $('#pbB').onclick=()=>{ sweep=false; $('#swB').classList.remove('active'); xT=b; $('#xR').value=clamp(b,-11,11); };
  const lbr=()=>lt==='closed'?'[':'(', rbr=()=>rt==='closed'?']':')';

  animLoop(dt=>{
    t+=dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const lineY=h*0.56, gx0=w*0.04, gw=w*0.92, X=v=>gx0+(v+12)/24*gw;
    // springs
    springTo(pa,lt==='inf'?-12.8:a,70,12,dt); springTo(pb,rt==='inf'?12.8:b,70,12,dt);
    fl.x=approach(fl.x,lt==='closed'?1:0,10,dt); fr.x=approach(fr.x,rt==='closed'?1:0,10,dt);
    springTo(ppL,0,200,9,dt); springTo(ppR,0,200,9,dt);
    if(sweep){ xT=9.8*Math.sin(t*0.5); $('#xR').value=fmt(xT,1); }
    springTo(px,xT,sweep?400:60,sweep?40:12,dt);
    $('#aV').textContent=lt==='inf'?'−∞':fmt(a,1); $('#bV').textContent=rt==='inf'?'+∞':fmt(b,1); $('#xV').textContent=fmt(xT,1);
    // axis
    line(ctx,gx0-10,lineY,w*0.985,lineY,COL.ink,2.6); arrowHead(ctx,w*0.985,lineY,0,COL.ink,10); arrowHead(ctx,gx0-10,lineY,Math.PI,COL.ink,10);
    for(let v=-12;v<=12;v++){ const x=X(v), big=v%2===0; line(ctx,x,lineY-(big?7:4),x,lineY+(big?7:4),COL.ink,big?1.8:1.1); if(big||gw/24>30) textAt(ctx,v,x,lineY+26,{align:'center',size:11,weight:600,color:COL.muted}); }
    textAt(ctx,'R',w*0.975,lineY-12,{size:14,weight:700,color:COL.muted});
    // interval band + bar
    const xa=X(pa.x), xb=X(pb.x);
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.08)'; ctx.fillRect(xa,lineY-40,xb-xa,40); ctx.restore();
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.2; ctx.beginPath(); for(let x=xa+((t*12)%10);x<xb;x+=10){ ctx.moveTo(x,lineY-38); ctx.lineTo(x-14>xa?x-14:xa,lineY-38+Math.min(38,x-xa)); } ctx.stroke(); ctx.restore();
    line(ctx,xa,lineY,xb,lineY,COL.blue,8);
    if(lt==='inf') arrowHead(ctx,gx0-6,lineY,Math.PI,COL.blue,16);
    if(rt==='inf') arrowHead(ctx,w*0.98,lineY,0,COL.blue,16);
    const ends=[[xa,fl.x,lt,ppL,'a'],[xb,fr.x,rt,ppR,'b']];
    ends.forEach(([x,f,m,pp,nm])=>{ if(m==='inf') return; const r=10*clamp(1+pp.x*0.045,0.6,1.6);
      circ(ctx,x,lineY,r,COL.blue,mixCol('#ffffff',COL.blue,f),3.2);
      textAt(ctx,nm,x,lineY+50,{align:'center',size:15,weight:700,color:COL.blue}); });
    // length dimension (yellow)
    const fin=lt!=='inf'&&rt!=='inf', dy=lineY+78;
    dimH(ctx,Math.max(xa,gx0),Math.min(xb,w*0.97),dy,COL.yellow);
    textAt(ctx,fin?'b − a = '+fmt(b-a,1):'length = ∞',(Math.max(xa,gx0)+Math.min(xb,w*0.97))/2,dy-8,{align:'center',size:13,weight:700,color:COL.yellow});
    // membership of the probe
    const xe=sweep?px.x:xT;
    const okL=lt==='inf'||(lt==='closed'?xe>=a:xe>a), okR=rt==='inf'||(rt==='closed'?xe<=b:xe<b), inside=okL&&okR;
    const bx=X(px.x), by=lineY-78+Math.sin(t*3)*3, bc=inside?COL.green:COL.red;
    line(ctx,bx,by+14,bx,lineY,bc,2,[5,4]);
    circ(ctx,bx,lineY,4,bc,bc,1);
    circ(ctx,bx,by,13,COL.yellow,'#fff8e6',3);
    textAt(ctx,'x',bx,by+5,{align:'center',size:13,weight:700,color:COL.ink});
    textAt(ctx,'x = '+fmt(px.x,1)+(inside?'  ∈  ':'  ∉  ')+'I',bx,by-24,{align:'center',size:14,weight:700,color:bc});
    // notation
    const nota=lbr()+(lt==='inf'?'−∞':fmt(a,1))+', '+(rt==='inf'?'∞':fmt(b,1))+rbr();
    const notaFix=(lt==='inf'?'(':lbr())+(lt==='inf'?'−∞':fmt(a,1))+', '+(rt==='inf'?'∞':fmt(b,1))+(rt==='inf'?')':rbr());
    textAt(ctx,'I = '+notaFix,w*0.04,h*0.1,{size:Math.max(20,Math.min(30,w*0.032)),weight:700,color:COL.blue});
    const lo=lt==='inf'?'':fmt(a,1)+(lt==='closed'?' ≤ ':' < '), hi=rt==='inf'?'':(rt==='closed'?' ≤ ':' < ')+fmt(b,1);
    const sb='{ x : '+(lt==='inf'&&rt==='inf'?'x ∈ R':lo+'x'+hi)+' }';
    textAt(ctx,sb,w*0.04,h*0.1+30,{size:Math.max(13,Math.min(17,w*0.018)),weight:600,color:COL.muted});
    $('#inV').textContent=notaFix; $('#lnV').textContent=fin?fmt(b-a,1):'∞'; $('#sbV').textContent=sb;
  });
  return wrap;
}
function mixCol(a,b,t){ const h=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)]; const A=h(a),B=h(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }

/* =====================================================================
   1.7–1.8 UNIVERSAL SET  (§1.7, §1.8, Ex 1.3 Q8)
   A = {1,3,5}, B = {2,4,6}, C = {0,2,4,6,8}. Slide the yellow frame U over
   the number strip: every element inside is thrown (parabola) into its
   place in the Venn diagram; anything left outside the frame stays behind,
   shakes and flags the set that sticks out of U.
   ===================================================================== */
const SET_A8={A:['1','3','5'],B:['2','4','6'],C:['0','2','4','6','8']};
const HOME8={ '1':[.24,.46],'3':[.40,.50],'5':[.30,.68], '2':[.93,.47],'4':[1.06,.50],'6':[1.0,.60], '0':[.78,.40],'8':[1.22,.66], '7':[.12,.15],'9':[.65,.90],'10':[1.40,.14] };
const OPT8=[
  {id:'o1', label:'(i) {0…6}',  lo:0, hi:6,  empty:false},
  {id:'o2', label:'(ii) ∅',     lo:0, hi:0,  empty:true},
  {id:'o3', label:'(iii) {0…10}', lo:0, hi:10, empty:false},
  {id:'o4', label:'(iv) {1…8}', lo:1, hi:8,  empty:false},
];
function buildA8(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Try this U</label><div class="chip-wrap" id="oB"></div></div>
    <div class="control-group"><label>U from <span class="val" id="loV"></span></label><input type="range" id="loR" min="0" max="10" step="1" value="0">
      <label style="margin-top:8px;">U to <span class="val" id="hiV"></span></label><input type="range" id="hiR" min="0" max="10" step="1" value="6"></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">A ⊆ U</div><div class="rval" id="v1"></div></div>
      <div class="rcard"><div class="rlabel">B ⊆ U</div><div class="rval" id="v2"></div></div>
      <div class="rcard"><div class="rlabel">C ⊆ U</div><div class="rval" id="v3"></div></div>
      <div class="rcard"><div class="rlabel">Universal?</div><div class="rval" id="v4"></div></div>
      <div class="rcard wide"><div class="rlabel">Missing from U</div><div class="rval" id="v5" style="font-size:var(--fs-sm)"></div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let lo=0, hi=6, empty=false, t=0;
  const FL={x:0,v:0}, FR={x:0,v:0}, FA={x:1,v:0};
  const toks=[]; for(let n=0;n<=10;n++) toks.push({lab:String(n), n, x:0, y:0, in:null, fl:null, sq:mkSq(), init:false});
  function syncSl(){ $('#loR').value=lo; $('#hiR').value=hi; }
  chips($('#oB'),OPT8.map(o=>({id:o.id,label:o.label})),'o1',id=>{ const o=OPT8.find(q=>q.id===id); lo=o.lo; hi=o.hi; empty=o.empty; syncSl(); });
  $('#loR').oninput=e=>{ lo=+e.target.value; empty=false; if(lo>hi){ hi=lo; syncSl(); } };
  $('#hiR').oninput=e=>{ hi=+e.target.value; empty=false; if(hi<lo){ lo=hi; syncSl(); } };
  const memOf=l=>['A','B','C'].filter(k=>SET_A8[k].includes(l));

  animLoop(dt=>{
    t+=dt;
    $('#loV').textContent=empty?'—':lo; $('#hiV').textContent=empty?'—':hi;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const dx=(w*0.9)/11, sx0=w*0.05+dx/2, sy=h*0.13, tr=Math.min(18,dx*0.38);
    const SX=n=>sx0+n*dx;
    const P=vennFit(w*0.06,h*0.36,w*0.88,h*0.58);
    // ---- U frame on the strip ----
    const tl=empty?SX(0)-dx*0.45:SX(lo)-dx*0.5, tr2=empty?SX(0)-dx*0.45:SX(hi)+dx*0.5;
    springTo(FL,tl,80,13,dt); springTo(FR,tr2,80,13,dt); FA.x=approach(FA.x,empty?0:1,8,dt);
    const inU=n=>!empty&&n>=lo&&n<=hi;
    // strip
    line(ctx,w*0.03,sy+tr+30,w*0.97,sy+tr+30,COL.mid,1.4);
    ctx.save(); ctx.globalAlpha=FA.x; rrect(ctx,FL.x+2,sy-tr-10,FR.x-FL.x-4,tr*2+48,10); ctx.fillStyle='rgba(217,160,23,0.09)'; ctx.fill(); ctx.setLineDash([9,6]); ctx.lineDashOffset=-t*18; ctx.strokeStyle=COL.yellow; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
    if(empty) textAt(ctx,'U = ∅',SX(5),sy-tr-36,{align:'center',size:16,weight:700,color:COL.yellow});
    else textAt(ctx,'U',(FL.x+FR.x)/2,sy-tr-14,{align:'center',size:16,weight:700,color:COL.yellow});
    // ---- Venn diagram ----
    const pxy=(hx,hy)=>({x:P.ox+hx*P.s, y:P.oy+hy*P.s});
    const missing=[]; ['A','B','C'].forEach(k=>SET_A8[k].forEach(l=>{ if(!inU(+l) && !missing.includes(l)) missing.push(l); }));
    const bad=k=>SET_A8[k].some(l=>!inU(+l));
    ctx.save(); rrect(ctx,P.ox,P.oy,VW*P.s,VH*P.s,10); ctx.fillStyle='#fbfdff'; ctx.fill(); ctx.globalAlpha=0.25+0.75*FA.x; ctx.strokeStyle=COL.yellow; ctx.lineWidth=3; ctx.setLineDash(empty?[8,6]:[]); ctx.stroke(); ctx.restore();
    textAt(ctx,'U',P.ox+10,P.oy+22,{size:16,weight:700,color:COL.yellow});
    [['A',COL.blue,.32,.56,.22],['C',COL.green,1.0,.52,.36],['B',COL.red,1.0,.52,.16]].forEach(([k,col,cx,cy,r])=>{
      const c=pxy(cx,cy), b=bad(k);
      ctx.save(); ctx.beginPath(); ctx.arc(c.x,c.y,r*P.s,0,Math.PI*2); ctx.fillStyle=b?'rgba(217,67,43,0.04)':'rgba(255,255,255,0)'; ctx.fill();
      ctx.strokeStyle=b?COL.red:col; ctx.lineWidth=2.8; if(b) ctx.setLineDash([8,6]); ctx.lineDashOffset=-t*18; ctx.stroke(); ctx.restore();
      const a=k==='A'?-2.4:(k==='C'?-0.7:2.3); textAt(ctx,k,c.x+Math.cos(a)*(r*P.s+13),c.y+Math.sin(a)*(r*P.s+13)+5,{align:'center',size:16,weight:700,color:b?COL.red:col});
    });
    // ---- tokens: strip home or venn home ----
    toks.forEach((k,i)=>{
      const home={x:SX(k.n),y:sy}, vh=HOME8[k.lab], vp=pxy(vh[0],vh[1]);
      const want=inU(k.n);
      if(!k.init){ k.x=home.x; k.y=home.y; k.init=true; k.in=false; }
      if(want!==k.in){ k.in=want; startFlight(k,want?vp.x:home.x,want?vp.y:home.y,0.8,want?110:70,(i%4)*0.06); }
      const tg=k.in?vp:home;
      stepSq(k,dt);
      if(k.fl){ k.fl.x1=tg.x; k.fl.y1=tg.y; stepFlight(k,dt); } else { k.x=approach(k.x,tg.x,10,dt); k.y=approach(k.y,tg.y+(k.in?Math.sin(t*2+i)*2:0),10,dt); }
    });
    toks.forEach(k=>{
      const ms=memOf(k.lab), q=squash(k), stranger=!k.in&&ms.length>0;
      const r=k.in?Math.max(10,.047*P.s):tr;
      let st=COL.mid, st2;
      if(ms.length===1) st=ms[0]==='A'?COL.blue:(ms[0]==='B'?COL.red:COL.green);
      else if(ms.length>1){ st=COL.green; st2=COL.red; }
      if(stranger) st=COL.red;
      const x=k.x+(stranger&&!k.fl?Math.sin(t*40+k.n)*2.2:0);
      tok(ctx,x,k.y,k.lab,{r,stroke:st,stroke2:k.in?st2:undefined,fill:k.in?'#fff':(stranger?'#fdece7':'#fff'),alpha:(!k.in&&ms.length===0)?0.55:1,sx:q.sx,sy:q.sy,lw:2.4});
      if(!k.in){ // membership dots under strip tokens
        ms.forEach((m,j)=>circ(ctx,x+(j-(ms.length-1)/2)*9,k.y+tr+13,3.4,m==='A'?COL.blue:(m==='B'?COL.red:COL.green),m==='A'?COL.blue:(m==='B'?COL.red:COL.green),1));
        if(stranger) textAt(ctx,'∉ U',x,k.y-tr-8,{align:'center',size:11,weight:700,color:COL.red});
      }
    });
    textAt(ctx,'A = {1, 3, 5}     B = {2, 4, 6}     C = {0, 2, 4, 6, 8}',w*0.03,sy+tr+56,{size:Math.max(12,Math.min(15,w*0.016)),weight:700,color:COL.ink});
    // ---- verdict ----
    const yes='<span style="color:var(--f-green)">✓</span>', no='<span style="color:var(--f-red)">✗</span>';
    $('#v1').innerHTML=bad('A')?no:yes; $('#v2').innerHTML=bad('B')?no:yes; $('#v3').innerHTML=bad('C')?no:yes;
    const ok=!missing.length;
    $('#v4').innerHTML=ok?'<span style="color:var(--f-green)">Yes</span>':'<span style="color:var(--f-red)">No</span>';
    $('#v5').textContent=ok?'nothing — U ⊇ A ∪ B ∪ C':missing.sort((a,b)=>a-b).join(', ');
  });
  return wrap;
}
