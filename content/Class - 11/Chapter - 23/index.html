<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 11 · Chapter 1 — Sets | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
</style>

<body>
<div class="app">
  <div class="topbar">
    <div class="brand-badge">∪</div>
    <div>
      <div class="chip">Grade 11 · Ch 1</div>
      <h1>Sets</h1>
    </div>
    <div class="spacer"></div>
    <div class="legend">
      <span><i style="background:var(--f-yellow)"></i>What you change</span>
      <span><i style="background:var(--f-blue)"></i>Set A</span>
      <span><i style="background:var(--f-red)"></i>Set B · ∉</span>
      <span><i style="background:var(--f-green)"></i>Result · ∈</span>
    </div>
  </div>
  <div class="body-wrap">
    <nav class="sidenav" id="sideNav"></nav>
    <main class="content">
      <div class="panel-head">
        <div class="panel-badge" id="panelBadge">1.2a</div>
        <h2 id="panelTitle">Select an activity</h2>
        <p id="panelDesc"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </main>
  </div>
</div>

<script>
/* =========================================================================
   GRADE 11 — CHAPTER 1: SETS
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn objects fly (true parabolic arcs), spring, bounce or
   ease toward it every frame — nothing ever jumps. Idle objects breathe,
   scanners sweep, belts roll: never a single static frame.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimH(ctx,x1,x2,y,color){ line(ctx,x1,y,x2,y,color,1.6); arrowHead(ctx,x1,y,Math.PI,color,6); arrowHead(ctx,x2,y,0,color,6); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; }
function isSquare(n){ const r=Math.round(Math.sqrt(n)); return r*r===n; }

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
let activeTicks = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; activeTicks=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  activeTicks.push(tick);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Fast-forward hook (used for automated checks): runs every live loop for <sec> seconds of simulated time. */
window.__sim={ advance(sec){ const n=Math.round(sec*60); for(let i=0;i<n;i++) activeTicks.slice().forEach(f=>f(1/60)); } };
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}
/** Chip row builder: items = [{id,label}], returns the buttons */
function chips(container,items,activeId,cb,cls){
  container.innerHTML='';
  const btns=items.map(it=>{
    const b=document.createElement('button'); b.className=(cls||'chip-btn')+(it.id===activeId?' active':''); b.textContent=it.label; b.dataset.id=it.id;
    container.appendChild(b); return b;
  });
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b.dataset.id,b); });
  return btns;
}

/* ---------------------------------------------------------------------
   0c. SET-THEORY DRAWING HELPERS
   --------------------------------------------------------------------- */
/** A set element: round token, or a pill when the label is long.
    o: r, fill, stroke, stroke2 (inner ring), text, alpha, sx, sy, rot, lw, size */
function tok(ctx,x,y,label,o){
  o=o||{}; const r=o.r||15; label=String(label);
  ctx.save(); ctx.translate(x,y);
  if(o.sx||o.sy) ctx.scale(o.sx||1,o.sy||1);
  if(o.alpha!==undefined) ctx.globalAlpha=clamp(o.alpha,0,1);
  const fs=o.size||Math.max(9,Math.round(r*0.9));
  ctx.font='700 '+fs+'px Poppins, sans-serif';
  const tw=ctx.measureText(label).width, W=Math.max(r*2, tw+r*0.9);
  const path=(ins)=>{ if(W>r*2+1) rrect(ctx,-W/2+ins,-r+ins,W-2*ins,2*(r-ins),r-ins); else { ctx.beginPath(); ctx.arc(0,0,r-ins,0,Math.PI*2); } };
  path(0); ctx.fillStyle=o.fill||'#fff'; ctx.fill(); ctx.lineWidth=o.lw||2.2; ctx.strokeStyle=o.stroke||COL.ink; ctx.stroke();
  if(o.stroke2){ path(3.4); ctx.lineWidth=(o.lw||2.2)*0.8; ctx.strokeStyle=o.stroke2; ctx.stroke(); }
  ctx.fillStyle=o.text||COL.ink; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label,0,1);
  if(o.rot!==undefined && W<=r*2+1){ ctx.beginPath(); ctx.arc(Math.cos(o.rot)*r*0.76,Math.sin(o.rot)*r*0.76,2.3,0,Math.PI*2); ctx.fillStyle=COL.mid; ctx.fill(); }
  ctx.restore();
  return W;
}
/** Parabolic flight: x moves uniformly, y follows a true parabola of apex height h. */
function startFlight(b,x1,y1,T,h,d){ b.fl={t:0,T:T,x0:b.x,y0:b.y,x1:x1,y1:y1,h:h,d:d||0}; }
function stepFlight(b,dt){
  const f=b.fl; if(!f) return false;
  if(f.d>0){ f.d-=dt; return false; }
  f.t+=dt; const s=clamp(f.t/f.T,0,1);
  b.x=lerp(f.x0,f.x1,s); b.y=lerp(f.y0,f.y1,s)-f.h*4*s*(1-s);
  if(s>=1){ b.fl=null; if(b.sq) b.sq.v=-7; return true; }
  return false;
}
/** squash-and-stretch from a landing spring */
function squash(b){ const q=b.sq?clamp(b.sq.x,-0.6,0.6):0; return {sx:1+0.28*q, sy:1-0.34*q}; }
function mkSq(){ return {x:0,v:0}; }
function stepSq(b,dt){ if(b.sq) springTo(b.sq,0,220,10,dt); }

/** Diagonal hatch of a region (a line-diagram "shading"). P: {ox,oy,s} maps world→px; test(x,y)→bool.
    World is 1.5 wide × 1 tall. Lines drift slowly so the region is alive. */
function hatchRegion(ctx,P,test,color,t,gap){
  gap=gap||0.042; const step=0.012, off=(t*0.018)%gap;
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=1.4; ctx.globalAlpha=0.9; ctx.beginPath();
  for(let c=-1.0-gap+off; c<1.5; c+=gap){
    let on=false, sx=0, sy=0;
    for(let y=0; y<=1.0001; y+=step){
      const x=c+y, inside = x>0 && x<1.5 && test(x,y);
      if(inside && !on){ on=true; sx=x; sy=y; }
      else if(on && !inside){ const yy=y-step; ctx.moveTo(P.ox+sx*P.s,P.oy+sy*P.s); ctx.lineTo(P.ox+(c+yy)*P.s,P.oy+yy*P.s); on=false; }
    }
    if(on){ const yy=Math.min(1,Math.floor(1.0001/step)*step); ctx.moveTo(P.ox+sx*P.s,P.oy+sy*P.s); ctx.lineTo(P.ox+(c+yy)*P.s,P.oy+yy*P.s); }
  }
  ctx.stroke(); ctx.restore();
}
/** Braces drawn as line art (for roster trays). */
function brace(ctx,x,y1,y2,dir,color,lw){
  const m=(y1+y2)/2, k=dir, w=12;
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lw||2.6; ctx.lineCap='round'; ctx.beginPath();
  ctx.moveTo(x+k*w,y1); ctx.quadraticCurveTo(x,y1,x,y1+w); ctx.lineTo(x,m-w); ctx.quadraticCurveTo(x,m,x-k*w,m);
  ctx.quadraticCurveTo(x,m,x,m+w); ctx.lineTo(x,y2-w); ctx.quadraticCurveTo(x,y2,x+k*w,y2); ctx.stroke(); ctx.restore();
}

/* =====================================================================
   1.2a BELONGS OR NOT  (§1.2 — well-defined collections, a ∈ A, b ∉ A)
   Elements ride a belt to a scanner gate. A member is thrown in a real
   parabola into the set and lands with a squash; a non-member is kicked
   off, bounces under gravity (e = 0.42) and rolls to rest. A collection
   that is not well-defined cannot be decided — the element stalls, shakes
   and is sent back.
   ===================================================================== */
const COLL1=[
  {id:'v', short:'Vowels', name:'Vowels in the English alphabet', sym:'V', wd:true, cands:['a','b','e','i','k','o','u','r'], inS:['a','e','i','o','u']},
  {id:'p', short:'Prime factors of 30', name:'Prime factors of 30', sym:'P', wd:true, cands:['2','3','5','15','6','10','1'], inS:['2','3','5']},
  {id:'o', short:'Odd numbers < 10', name:'Odd natural numbers < 10', sym:'O', wd:true, cands:['1','3','5','7','9','2','10','11'], inS:['1','3','5','7','9']},
  {id:'r', short:'Rivers of India', name:'Rivers of India', sym:'R', wd:true, wide:true, cands:['Ganga','Nile','Yamuna','Amazon','Kaveri','Thames'], inS:['Ganga','Yamuna','Kaveri']},
  {id:'j', short:'Months starting J', name:'Months beginning with J', sym:'J', wd:true, wide:true, cands:['Jan','Mar','Jun','Jul','Aug','Dec'], inS:['Jan','Jun','Jul']},
  {id:'w', short:'Most talented writers', name:'Ten most talented writers', sym:'W', wd:false, wide:true, cands:['Writer 1','Writer 2','Writer 3','Writer 4','Writer 5']},
  {id:'d', short:'Most dangerous animals', name:'Most dangerous animals', sym:'D', wd:false, wide:true, cands:['Lion','Snake','Shark','Mosquito','Bear']},
];

function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Collection</label><div class="chip-wrap" id="colB"></div></div>
    <div class="control-group"><label>Belt speed <span class="val" id="spV"></span></label><input type="range" id="spR" min="0.5" max="2.5" step="0.1" value="1"></div>
    <div class="control-group"><label style="margin-bottom:2px;">Send an element</label><div class="chip-wrap" id="sendB"></div>
      <div class="toggle-group"><button class="toggle-btn play" id="autoB">Auto stream · ON</button></div></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel">∈ Belongs</div><div class="rval" id="cI" style="color:var(--f-green)">0</div></div>
      <div class="rcard"><div class="rlabel">∉ Not</div><div class="rval" id="cO" style="color:var(--f-red)">0</div></div>
      <div class="rcard"><div class="rlabel">Undecided</div><div class="rval" id="cU" style="color:var(--f-yellow)">0</div></div></div>
      <div class="fb" id="vd"></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let coll=COLL1[0], auto=true, spd=1, t=0, spawnT=0.4, autoIdx=0, order=[];
  let toks=[], queue=[], members=[], cnt={i:0,o:0,u:0}, msg=null, flash=null;
  const R=rng(11);

  function reshuffle(){ order=coll.cands.map((c,i)=>[R(),c]).sort((a,b)=>a[0]-b[0]).map(p=>p[1]); autoIdx=0; }
  function reset(){ toks=[]; queue=[]; members=[]; cnt={i:0,o:0,u:0}; msg=null; flash=null; spawnT=0.3; reshuffle();
    const sb=$('#sendB'); sb.innerHTML=''; coll.cands.forEach(c=>{ const b=document.createElement('button'); b.className='chip-btn'; b.textContent=c; b.onclick=()=>queue.push(c); sb.appendChild(b); });
    const vd=$('#vd'); vd.className='fb '+(coll.wd?'ok':'bad'); vd.textContent=coll.wd?'Well-defined ✓ — every element can be decided':'Not well-defined ✗ — no fixed rule decides membership'; }
  chips($('#colB'),COLL1.map(c=>({id:c.id,label:c.short})),coll.id,id=>{ coll=COLL1.find(c=>c.id===id); reset(); });
  $('#spR').oninput=e=>{ spd=+e.target.value; };
  $('#autoB').onclick=()=>{ auto=!auto; $('#autoB').textContent='Auto stream · '+(auto?'ON':'OFF'); $('#autoB').classList.toggle('play',auto); $('#autoB').classList.toggle('navy',!auto); };
  reset();

  function L(w,h){
    return {x0:w*0.05, gx:w*0.47, beltY:h*0.7, gy:h*0.94, v:150*spd, ex:w*0.76, ey:h*0.33, rx:w*0.2, ry:h*0.27, binL:w*0.56, binR:w*0.97};
  }
  function slotPos(i,l){
    const cols=coll.wide?2:3, dx=coll.wide?132:78, dy=64, col=i%cols, row=Math.floor(i/cols);
    return {x:l.ex+(col-(cols-1)/2)*dx, y:l.ey-l.ry*0.32+row*dy};
  }
  function spawn(label){
    const wideTok=label.length>2, r=22;
    toks.push({label, x:-40, y:0, vx:0, vy:0, state:'belt', rot:0, sq:mkSq(), r, w: wideTok? 28+label.length*10 : 46, alpha:1, tm:0, spawned:false});
  }

  animLoop(dt=>{
    t+=dt;
    $('#spV').textContent='×'+fmt(spd,1);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const l=L(w,h), r=22;
    // ---------- spawn ----------
    spawnT-=dt;
    const beltToks=toks.filter(b=>b.state==='belt'||b.state==='unsure');
    const lastX=beltToks.length?Math.min(...beltToks.map(b=>b.x)):1e9;
    if(spawnT<=0 && lastX>l.x0+70 && beltToks.length<7){
      if(queue.length){ spawn(queue.shift()); spawnT=0.5/spd; }
      else if(auto){ spawn(order[autoIdx%order.length]); autoIdx++; spawnT=1.6/spd; }
    }
    toks.forEach(b=>{ if(!b.spawned){ b.x=l.x0; b.spawned=true; } });
    // ---------- queue spacing on the belt ----------
    const bt=toks.filter(b=>b.state==='belt'||b.state==='unsure').sort((a,b)=>b.x-a.x);
    for(let i=1;i<bt.length;i++){ const lim=bt[i-1].x-(bt[i-1].w+bt[i].w)/2-8; if(bt[i].x>lim) bt[i].x=lim; }
    // ---------- token physics ----------
    toks.forEach(b=>{
      stepSq(b,dt);
      if(b.state==='belt'){
        b.x+=l.v*dt; b.rot+=l.v*dt/b.r; b.y=l.beltY-b.r;
        if(!coll.wd && b.x>=l.gx-78){ b.state='unsure'; b.tm=0; cnt.u++; msg={txt:b.label+' ∈ '+coll.sym+' ?', col:COL.yellow, t:2}; flash={t:0.5,col:COL.yellow}; }
        else if(coll.wd && b.x>=l.gx){
          const inn=coll.inS.includes(b.label);
          flash={t:0.5,col:inn?COL.green:COL.red};
          if(inn){
            cnt.i++; msg={txt:b.label+' ∈ '+coll.sym, col:COL.green, t:1.6};
            let k=members.indexOf(b.label);
            if(k<0){ members.push(b.label); k=members.length-1; } else b.dup=true;
            b.slot=k; b.state='arc'; const sp=slotPos(k,l); startFlight(b,sp.x,sp.y,0.85,110);
          } else {
            cnt.o++; msg={txt:b.label+' ∉ '+coll.sym, col:COL.red, t:1.6};
            b.state='kick'; b.vx=l.v*0.8+90; b.vy=-300; b.tm=0;
          }
        }
      } else if(b.state==='unsure'){
        b.tm+=dt; b.x=approach(b.x,l.gx-78,6,dt); b.y=l.beltY-b.r; b.rot+=0;
        if(b.tm>1.9){ b.state='back'; b.tm=0; }
      } else if(b.state==='back'){
        b.tm+=dt; b.x-=110*dt; b.alpha=Math.max(0,1-b.tm/1.1); b.rot-=110*dt/b.r; b.y=l.beltY-b.r; if(b.alpha<=0) b.dead=true;
      } else if(b.state==='arc'){
        const sp=slotPos(b.slot,l); if(b.fl){ b.fl.x1=sp.x; b.fl.y1=sp.y; }
        if(stepFlight(b,dt)){ b.state=b.dup?'merge':'in'; b.tm=0; }
      } else if(b.state==='in'){
        const sp=slotPos(b.slot,l); b.x=approach(b.x,sp.x,10,dt); b.y=sp.y+Math.sin(t*2+b.slot*1.3)*2.5;
      } else if(b.state==='merge'){
        b.tm+=dt; b.alpha=Math.max(0,1-b.tm/0.5); if(b.alpha<=0) b.dead=true;
      } else if(b.state==='kick'){
        b.vy+=1300*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.vx*dt/b.r;
        if(b.y>l.gy-b.r){ b.y=l.gy-b.r; if(Math.abs(b.vy)>70){ b.vy*=-0.42; b.vx*=0.82; b.sq.v=-5; } else { b.vy=0; } }
        if(b.vy===0){ b.vx=approach(b.vx,0,2.4,dt); b.tm+=dt; if(b.tm>3.2) b.alpha=Math.max(0,1-(b.tm-3.2)/0.8); if(b.alpha<=0) b.dead=true; }
        if(b.x>l.binR){ b.x=l.binR; b.vx*=-0.4; }
      }
    });
    toks=toks.filter(b=>!b.dead);
    if(msg){ msg.t-=dt; if(msg.t<=0) msg=null; }
    if(flash){ flash.t-=dt; if(flash.t<=0) flash=null; }

    // ---------- belt ----------
    const bx2=l.gx+44, bh=14;
    ctx.save(); rrect(ctx,l.x0-26,l.beltY,bx2-l.x0+52,bh,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
    const pitch=26, off=(t*l.v)%pitch;
    ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.5; ctx.beginPath();
    for(let x=l.x0-20+off; x<bx2+20; x+=pitch){ ctx.moveTo(x,l.beltY+3); ctx.lineTo(x,l.beltY+bh-3); } ctx.stroke(); ctx.restore();
    [l.x0-26+7, bx2+26-7].forEach((cx,i)=>{ const cy=l.beltY+bh/2; circ(ctx,cx,cy,12,COL.ink,'#fff',2.2);
      for(let k=0;k<3;k++){ const a=t*l.v/12+k*Math.PI*2/3+i; line(ctx,cx,cy,cx+Math.cos(a)*10,cy+Math.sin(a)*10,COL.mid,1.4); } });
    [l.x0+30, l.gx-10].forEach(x=>{ line(ctx,x,l.beltY+bh,x-8,l.gy,COL.mid,2); line(ctx,x,l.beltY+bh,x+8,l.gy,COL.mid,2); });
    line(ctx,0,l.gy,w,l.gy,COL.mid,1.6);
    // bin zone
    ctx.save(); ctx.setLineDash([6,5]); ctx.strokeStyle=COL.red; ctx.lineWidth=1.6; ctx.strokeRect(l.binL,l.gy-96,l.binR-l.binL+14,96); ctx.restore();
    textAt(ctx,'∉ '+coll.sym,l.binL+8,l.gy-100,{size:13,weight:700,color:COL.red});

    // ---------- gate ----------
    const barY=l.beltY-160, gl=l.gx-44, gr2=l.gx+44;
    line(ctx,gl,l.beltY,gl,barY,COL.ink,3.2); line(ctx,gr2,l.beltY,gr2,barY,COL.ink,3.2); line(ctx,gl-8,barY,gr2+8,barY,COL.ink,4.2);
    const gc=flash?flash.col:COL.yellow;
    const sw=Math.sin(t*3.2)*26;
    line(ctx,l.gx,barY+2,l.gx+sw,l.beltY-1,gc,flash?3.2:1.8,flash?null:[7,5]);
    circ(ctx,l.gx,barY+2,5,gc,gc,1);
    if(flash){ const q=1-flash.t/0.5; ctx.save(); ctx.globalAlpha=1-q; circ(ctx,l.gx,l.beltY-r,20+q*50,flash.col,null,2.6); ctx.restore(); }
    if(msg){ const a=Math.min(1,msg.t*2); ctx.save(); ctx.font='700 15px Poppins, sans-serif'; const tw=ctx.measureText(msg.txt).width; ctx.globalAlpha=a;
      rrect(ctx,l.gx-tw/2-12,barY-46,tw+24,28,9); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=msg.col; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
      textAt(ctx,msg.txt,l.gx,barY-26,{align:'center',size:15,weight:700,color:msg.col,alpha:a}); }

    // ---------- the set ----------
    ctx.save(); ctx.beginPath(); ctx.ellipse(l.ex,l.ey,l.rx,l.ry,0,0,Math.PI*2);
    ctx.fillStyle=coll.wd?'rgba(47,143,224,0.06)':'rgba(217,67,43,0.05)'; ctx.fill();
    ctx.strokeStyle=coll.wd?COL.blue:COL.red; ctx.lineWidth=3; if(!coll.wd) ctx.setLineDash([9,7]); ctx.lineDashOffset=-t*20; ctx.stroke(); ctx.restore();
    textAt(ctx,coll.sym+' = { }',l.ex-l.rx+14,l.ey-l.ry-10,{size:15,weight:700,color:coll.wd?COL.blue:COL.red});
    if(!coll.wd) textAt(ctx,'?',l.ex,l.ey+l.ry*0.35,{align:'center',size:70,weight:700,color:'rgba(217,67,43,0.14)'});

    // ---------- tokens ----------
    toks.forEach(b=>{
      const sq=squash(b); let x=b.x, y=b.y, st=COL.ink, fl='#fff';
      if(b.state==='in'||b.state==='arc'||b.state==='merge'){ st=COL.green; fl='#e4f7ec'; }
      if(b.state==='kick'){ st=COL.red; fl='#fdece7'; }
      if(b.state==='unsure'||b.state==='back'){ st=COL.yellow; fl='#fff8e6'; x+=Math.sin(t*46)*(b.state==='unsure'?3:0); }
      tok(ctx,x,y,b.label,{r:b.r,stroke:st,fill:fl,alpha:b.alpha,sx:sq.sx,sy:sq.sy,rot:(b.state==='belt'||b.state==='kick')&&b.label.length<=2?b.rot:undefined});
      if(b.state==='unsure') textAt(ctx,'?',x,y-b.r-8-Math.abs(Math.sin(t*5))*5,{align:'center',size:18,weight:700,color:COL.yellow});
      if(b.state==='kick'&&b.vy===0) textAt(ctx,'✗',x,y-b.r-6,{align:'center',size:14,weight:700,color:COL.red,alpha:b.alpha});
    });
    $('#cI').textContent=cnt.i; $('#cO').textContent=cnt.o; $('#cU').textContent=cnt.u;
  });
  return wrap;
}

/* =====================================================================
   1.2b ROSTER ↔ SET-BUILDER  (§1.2 — {1,2,3,6,7,14,21,42} = {x : x∈N, x | 42})
   Pick the rule; every number that satisfies it is thrown from the shelf
   into the tray (and thrown back the instant it stops satisfying it).
   Shuffle the tray: the order changes, the set does not.
   ===================================================================== */
const RULES2=[
  {id:'div',  label:'Divisors of N',  f:(x,N)=>N%x===0, sb:N=>'x ∈ N, x divides '+N, usesN:true, N:42},
  {id:'prime',label:'Primes',         f:x=>isPrime(x),  sb:()=>'x is a prime number'},
  {id:'odd',  label:'Odd',            f:x=>x%2===1,     sb:()=>'x is an odd natural number'},
  {id:'even', label:'Even',           f:x=>x%2===0,     sb:()=>'x is an even natural number'},
  {id:'sq',   label:'Squares',        f:x=>isSquare(x), sb:()=>'x = n², n ∈ N'},
  {id:'lt',   label:'x² < N',         f:(x,N)=>x*x<N,   sb:N=>'x ∈ N, x² < '+N, usesN:true, N:40},
];
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Property</label><div class="chip-wrap" id="ruB"></div></div>
    <div class="control-group" id="nG"><label><span id="nL">N</span> <span class="val" id="nV"></span></label><input type="range" id="nR" min="2" max="42" step="1" value="42"></div>
    <div class="control-group"><label>From <span class="val" id="loV"></span></label><input type="range" id="loR" min="1" max="42" step="1" value="1">
      <label style="margin-top:8px;">To <span class="val" id="hiV"></span></label><input type="range" id="hiR" min="1" max="42" step="1" value="42"></div>
    <div class="control-group"><div class="toggle-group"><button class="toggle-btn navy" id="shB" style="margin-top:0;">⇄ Shuffle tray</button><button class="toggle-btn" id="soB">Sort</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard wide"><div class="rlabel">Roster form</div><div class="rval" id="rost" style="font-size:var(--fs-sm);color:var(--f-green);word-break:break-word"></div></div>
      <div class="rcard wide"><div class="rlabel">Set-builder form</div><div class="rval" id="sbf" style="font-size:var(--fs-sm);color:var(--f-blue)"></div></div>
      <div class="rcard"><div class="rlabel">n(A)</div><div class="rval" id="nA"></div></div>
      <div class="rcard"><div class="rlabel">Order</div><div class="rval" id="ordV" style="font-size:var(--fs-sm)"></div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let rule=RULES2[0], N=42, lo=1, hi=42, shuffled=false, t=0;
  const balls=[]; for(let n=1;n<=42;n++) balls.push({n, x:-100, y:-100, hx:0, hy:0, in:false, fl:null, sq:mkSq(), rk:Math.random(), alpha:1, init:false});
  chips($('#ruB'),RULES2.map(r=>({id:r.id,label:r.label})),rule.id,id=>{ rule=RULES2.find(r=>r.id===id); if(rule.usesN){ N=rule.N; $('#nR').value=N; } syncUi(); });
  function syncUi(){ $('#nG').style.opacity=rule.usesN?1:0.35; $('#nG').style.pointerEvents=rule.usesN?'auto':'none'; $('#nL').textContent=rule.id==='lt'?'x² < N → N =':'N ='; }
  $('#nR').oninput=e=>{ N=+e.target.value; };
  $('#loR').oninput=e=>{ lo=+e.target.value; if(lo>hi){ hi=lo; $('#hiR').value=hi; } };
  $('#hiR').oninput=e=>{ hi=+e.target.value; if(hi<lo){ lo=hi; $('#loR').value=lo; } };
  $('#shB').onclick=()=>{ shuffled=true; balls.forEach(b=>b.rk=Math.random()); };
  $('#soB').onclick=()=>{ shuffled=false; };
  syncUi();

  animLoop(dt=>{
    t+=dt;
    $('#nV').textContent=N; $('#loV').textContent=lo; $('#hiV').textContent=hi;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cols=14, dx=(w*0.9)/cols, rr=Math.min(21,dx*0.4), sx0=w*0.05+dx/2, sy0=h*0.085, dy=Math.min(52,h*0.085);
    const trayL=w*0.07, trayR=w*0.93, trayT=h*0.52, trayB=h*0.92;
    balls.forEach(b=>{ const i=b.n-1; b.hx=sx0+(i%cols)*dx; b.hy=sy0+Math.floor(i/cols)*dy; if(!b.init){ b.x=b.hx; b.y=b.hy; b.init=true; } });
    // membership + order
    const mem=balls.filter(b=>b.n>=lo&&b.n<=hi&&rule.f(b.n,N));
    const ordered=mem.slice().sort((a,b)=>shuffled?a.rk-b.rk:a.n-b.n);
    const sp=rr*2+18, scols=Math.max(4,Math.floor((trayR-trayL-70)/sp));
    const nrows=Math.max(1,Math.ceil(ordered.length/scols)), rowH=rr*2+18, y0=trayT+(trayB-trayT-nrows*rowH)/2+rowH/2;
    const slot=k=>({x:(trayL+trayR)/2+((k%scols)-(Math.min(ordered.length-Math.floor(k/scols)*scols,scols)-1)/2)*sp, y:y0+Math.floor(k/scols)*rowH});
    let out=0,inn=0;
    balls.forEach(b=>{
      const want=mem.includes(b);
      if(want!==b.in){ b.in=want; const d=(want?inn++:out++)*0.045; const tg=want?slot(ordered.indexOf(b)):{x:b.hx,y:b.hy}; startFlight(b,tg.x,tg.y,want?0.85:0.7,want?90+Math.random()*50:50,d); }
      const tg=b.in?slot(ordered.indexOf(b)):{x:b.hx,y:b.hy};
      stepSq(b,dt);
      if(b.fl){ b.fl.x1=tg.x; b.fl.y1=tg.y; stepFlight(b,dt); }
      else { b.x=approach(b.x,tg.x,9,dt); b.y=approach(b.y,tg.y+(b.in?Math.sin(t*2+b.n)*2:0),9,dt); }
    });
    // shelf
    line(ctx,w*0.04,sy0-rr-8,w*0.96,sy0-rr-8,COL.mid,1.4);
    for(let i=0;i<3;i++) line(ctx,w*0.04,sy0+i*dy+rr+7,w*0.96,sy0+i*dy+rr+7,COL.mid,1.4);
    textAt(ctx,'N',w*0.04,sy0-rr-14,{size:12,weight:700,color:COL.mid});
    // tray
    ctx.save(); rrect(ctx,trayL,trayT,trayR-trayL,trayB-trayT,16); ctx.fillStyle='rgba(31,157,85,0.04)'; ctx.fill(); ctx.setLineDash([8,6]); ctx.strokeStyle=COL.green; ctx.lineWidth=1.6; ctx.lineDashOffset=-t*14; ctx.stroke(); ctx.restore();
    brace(ctx,trayL-12,trayT,trayB,1,COL.green,3.2); brace(ctx,trayR+12,trayT,trayB,-1,COL.green,3.2);
    const sbTxt='A = { x : '+rule.sb(N)+((lo>1||hi<42)?',  '+lo+' ≤ x ≤ '+hi:'')+' }';
    textAt(ctx,sbTxt,trayL,trayT-12,{size:Math.max(12,Math.min(15,w*0.016)),weight:700,color:COL.blue});
    // balls: members first (under), then others
    balls.slice().sort((a,b)=>(a.in?1:0)-(b.in?1:0)).forEach(b=>{
      const inRange=b.n>=lo&&b.n<=hi, sq=squash(b);
      const col=b.in?COL.green:COL.ink;
      tok(ctx,b.x,b.y,b.n,{r:rr,stroke:col,fill:b.in?'#e4f7ec':'#fff',alpha:b.in?1:(inRange?0.95:0.28),sx:sq.sx,sy:sq.sy,lw:b.in?2.6:1.8});
    });
    // readouts
    const roster='{ '+ordered.map(b=>b.n).join(', ')+' }';
    $('#rost').textContent=ordered.length?roster:'{ }  =  ∅';
    $('#sbf').textContent=sbTxt.replace('A = ','');
    $('#nA').textContent=ordered.length; $('#ordV').textContent=shuffled?'shuffled · same set ✓':'ascending';
  });
  return wrap;
}

/* =====================================================================
   1.3–1.4 EMPTY · FINITE · INFINITE  (§1.3, §1.4)
   A yellow scanner sweeps the number line; every n that satisfies the
   rule pops up as a ball (spring overshoot). A finite or empty set meets
   a wall that drops under gravity and bounces; an infinite set never
   does — the scanner accelerates and the line keeps zooming out.
   ===================================================================== */
const SETS3=[
  {id:'e1', label:'1 < x < 2',        def:'x ∈ N, 1 < x < 2',          f:n=>n>1&&n<2,                      wall:11.5, kind:'empty'},
  {id:'e2', label:'x² = 4, x odd',    def:'x ∈ N, x² = 4, x is odd',   f:n=>n*n===4&&n%2===1,              wall:11.5, kind:'empty'},
  {id:'e3', label:'Even prime > 2',   def:'x is an even prime, x > 2', f:n=>n>2&&n%2===0&&isPrime(n),      wall:13.5, kind:'empty'},
  {id:'f1', label:'x² < 40',          def:'x ∈ N, x² < 40',            f:n=>n*n<40,                        wall:6.5,  kind:'finite'},
  {id:'f2', label:'(x−1)(x−2) = 0',   def:'x ∈ N, (x−1)(x−2) = 0',     f:n=>(n-1)*(n-2)===0,               wall:2.5,  kind:'finite'},
  {id:'f3', label:'x² − 16 = 0',      def:'x ∈ N, x² − 16 = 0',        f:n=>n*n===16,                      wall:4.5,  kind:'finite'},
  {id:'f4', label:'Divisors of 12',   def:'x ∈ N, x divides 12',       f:n=>12%n===0,                      wall:12.5, kind:'finite'},
  {id:'i1', label:'Odd numbers',      def:'x is an odd natural number',f:n=>n%2===1,                       wall:null, kind:'infinite'},
  {id:'i2', label:'Primes',           def:'x is a prime number',       f:n=>isPrime(n),                    wall:null, kind:'infinite'},
  {id:'i3', label:'Multiples of 5',   def:'x is a multiple of 5',      f:n=>n%5===0,                       wall:null, kind:'infinite'},
];
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Set S</label><div class="chip-wrap" id="stB"></div></div>
    <div class="control-group"><label>Scan speed <span class="val" id="spV"></span></label><input type="range" id="spR" min="1" max="12" step="0.5" value="3">
      <div class="toggle-group"><button class="toggle-btn navy" id="rsB">↻ Restart scan</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">n(S)</div><div class="rval" id="nS" style="color:var(--f-blue)">0</div></div>
      <div class="rcard"><div class="rlabel">Type</div><div class="rval" id="tyV">Scanning…</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let S=SETS3[3], base=3, t=0;
  let sc, balls, wall, ppu, done, doneT, pop;
  function restart(){ sc=0; balls=[]; wall={y:-420,v:0,on:false,landed:false,bounces:0}; done=false; doneT=0; pop={x:0,v:0}; ppu=ppu||50; }
  chips($('#stB'),SETS3.map(s=>({id:s.id,label:s.label})),S.id,id=>{ S=SETS3.find(s=>s.id===id); restart(); });
  $('#spR').oninput=e=>{ base=+e.target.value; };
  $('#rsB').onclick=restart;
  restart();

  animLoop(dt=>{
    t+=dt;
    $('#spV').textContent=fmt(base,1)+' n/s';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const x0=w*0.05, lineY=h*0.66;
    // ----- scanner motion -----
    const inf=S.wall===null;
    if(!done){
      let v=base*(inf?1+sc*0.045:1);
      if(!inf){ const stopAt=S.wall-0.12; v*=clamp((stopAt-sc)/1.2,0.12,1); sc=Math.min(stopAt,sc+v*dt); }
      else if(sc<4000) sc+=v*dt;
      if(!inf){
        if(sc>=S.wall-1.6 && !wall.on){ wall.on=true; wall.y=-300; }
        if(wall.landed && sc>=S.wall-0.13){ done=true; doneT=0; pop.v=9; }
      }
    } else { doneT+=dt; springTo(pop,1,170,9,dt); if(doneT>5.5) restart(); }
    // scanning must also continue to test integers when balls array is empty
    if(!balls.last) balls.last=0;
    while(balls.last<Math.floor(sc)){ balls.last++; const k=balls.last; if(S.f(k)) balls.push({n:k,p:{x:0,v:0}}); }
    const wantP=clamp(w*0.9/Math.max(sc+3,14),inf?1.0:3,60);
    ppu=approach(ppu,wantP,3.5,dt);
    const X=n=>x0+n*ppu;
    // ----- wall physics (gravity + bounce) -----
    if(wall.on && !wall.landed){
      wall.v+=2600*dt; wall.y+=wall.v*dt;
      if(wall.y>=lineY){ wall.y=lineY; if(wall.v>180){ wall.v*=-0.34; wall.bounces++; } else { wall.v=0; wall.landed=true; } }
    }
    // ----- number line -----
    line(ctx,x0-14,lineY,w*0.985,lineY,COL.ink,2.6); arrowHead(ctx,w*0.985,lineY,0,COL.ink,9);
    const steps=[1,2,5,10,20,50,100,200,500,1000,2000]; let st=1; for(const s of steps){ st=s; if(s*ppu>=34) break; }
    for(let n=0;n*ppu<w*0.95;n+=st){ if(n%st!==0) continue; const x=X(n); line(ctx,x,lineY-5,x,lineY+5,COL.ink,1.6); textAt(ctx,n,x,lineY+22,{align:'center',size:11,weight:600,color:COL.muted}); }
    if(ppu>12) for(let n=0;n*ppu<w*0.95;n++){ const x=X(n); line(ctx,x,lineY-3,x,lineY+3,COL.mid,1); }
    // ----- balls -----
    const br=clamp(ppu*0.42,2.2,23);
    balls.forEach(b=>{ springTo(b.p,1,130,9,dt); const y=lineY-br-4-80*b.p.x; line(ctx,X(b.n),lineY,X(b.n),y+br,COL.green,Math.max(1,br*0.12));
      circ(ctx,X(b.n),y,br,COL.green,'#e4f7ec',Math.max(1.2,br*0.17));
      if(br>7) textAt(ctx,b.n,X(b.n),y+br*0.36,{align:'center',size:Math.round(br*0.9),weight:700,color:COL.green}); });
    // ----- scanner (yellow) -----
    const sx=X(sc);
    for(let i=1;i<=8;i++) line(ctx,sx-i*5,lineY-70,sx-i*5,lineY+10,COL.yellow,1.2*(1-i/9));
    line(ctx,sx,lineY-96,sx,lineY+14,COL.yellow,3.2); arrowHead(ctx,sx,lineY+16,Math.PI/2,COL.yellow,10);
    circ(ctx,sx,lineY-100,5+Math.sin(t*8)*1.5,COL.yellow,'#fff8e6',2.2);
    // ----- wall -----
    if(wall.on){ const wx=X(S.wall), wh=150, wy=wall.y; ctx.save(); rrect(ctx,wx-8,wy-wh,16,wh,4); ctx.fillStyle='#fdece7'; ctx.fill(); ctx.strokeStyle=COL.red; ctx.lineWidth=2.6; ctx.stroke(); ctx.clip();
      for(let k=-wh;k<wh;k+=10) line(ctx,wx-10,wy-wh+k,wx+10,wy-wh+k+10,COL.red,1.1); ctx.restore();
      if(wall.landed) textAt(ctx,'none beyond',wx+14,lineY-wh+16,{size:11,weight:700,color:COL.red}); }
    // ----- text -----
    textAt(ctx,'S = { '+S.def+' }',x0,h*0.1,{size:Math.max(13,Math.min(17,w*0.018)),weight:700,color:COL.blue});
    const shown=balls.slice(0,10).map(b=>b.n).join(', ');
    const ros=balls.length===0?(done?'{ }  =  ∅':'{ …scanning }'):'{ '+shown+((balls.length>10||inf||!done)?', …':'')+' }';
    textAt(ctx,ros,x0,h*0.1+26,{size:Math.max(13,Math.min(16,w*0.017)),weight:600,color:COL.green});
    if(done){
      const kind=S.kind, col=kind==='empty'?COL.yellow:COL.green, word=kind==='empty'?'EMPTY SET':'FINITE';
      ctx.save(); ctx.translate(w*0.5,h*0.3); ctx.scale(clamp(pop.x,0,1.25),clamp(pop.x,0,1.25));
      textAt(ctx,kind==='empty'?'∅':'n(S) = '+balls.length,0,0,{align:'center',size:kind==='empty'?64:40,weight:700,color:col});
      textAt(ctx,word,0,34,{align:'center',size:15,weight:700,color:col}); ctx.restore();
    }
    if(inf && sc>20){ textAt(ctx,'… ∞',w*0.93,lineY-130,{align:'right',size:34,weight:700,color:COL.blue,alpha:clamp((sc-20)/40,0,1)});
      vec(ctx,w*0.86,lineY-104,w*0.965,lineY-104,COL.blue,3); }
    $('#nS').textContent=balls.length+((inf&&sc>30)?' …':'');
    $('#tyV').textContent=done?(S.kind==='empty'?'Empty ∅':'Finite'):(inf&&sc>30?'Infinite':'Scanning…');
    $('#tyV').style.color=done?(S.kind==='empty'?'var(--f-yellow)':'var(--f-green)'):(inf&&sc>30?'var(--f-blue)':'var(--text-3)');
  });
  return wrap;
}

/* =====================================================================
   1.5 EQUAL SETS  (§1.5, Examples 7–8, Ex 1.2)
   Two rows of tokens. "Merge repeats" slides duplicates into one (a set
   does not change when elements repeat). "Shuffle" re-orders (order is
   immaterial). "Match" lowers every B token under its partner in A:
   a pair that finds a partner turns green; a stranger shakes and is
   marked ✗.
   ===================================================================== */
const PAIRS4=[
  {id:'p1', label:'ALLOY · LOYAL',          an:'X', bn:'B', a:['A','L','L','O','Y'],       b:['L','O','Y','A','L']},
  {id:'p2', label:'{1,2,3,4} · {3,1,4,2}',  an:'A', bn:'B', a:['1','2','3','4'],           b:['3','1','4','2']},
  {id:'p3', label:'FOLLOW · WOLF',          an:'A', bn:'B', a:['F','O','L','L','O','W'],   b:['W','O','L','F']},
  {id:'p4', label:'{2,4,6,8,10} · even ≤ 10',an:'A',bn:'B', a:['2','4','6','8','10'],      b:['6','2','10','4','8']},
  {id:'p5', label:'{4,8,12,16} · {8,4,16,18}',an:'A',bn:'B',a:['4','8','12','16'],         b:['8','4','16','18']},
  {id:'p6', label:'{2,3} · x²+5x+6=0',      an:'A', bn:'B', a:['2','3'],                   b:['−2','−3']},
  {id:'p7', label:'{−2…2} · {1,2}',         an:'A', bn:'B', a:['−2','−1','0','1','2'],     b:['1','2']},
];
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Pair of sets</label><div class="chip-wrap" id="pB"></div></div>
    <div class="control-group"><label>Merge repeats <span class="val" id="mgV"></span></label><input type="range" id="mgR" min="0" max="1" step="0.01" value="0">
      <div class="toggle-group"><button class="toggle-btn navy" id="shB" style="margin-top:0;">⇄ Shuffle order</button><button class="toggle-btn" id="mtB">Match</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">A ⊆ B</div><div class="rval" id="v1"></div></div>
      <div class="rcard"><div class="rlabel">B ⊆ A</div><div class="rval" id="v2"></div></div>
      <div class="rcard wide"><div class="rlabel">Verdict</div><div class="rval" id="v3"></div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas');
  let P=PAIRS4[0], mTarget=0, m=0, matchOn=false, al=0, lp=0, t=0;
  let A=[],B=[];
  function mk(list){ const seen={}; return list.map((lab,i)=>{ const first=!(lab in seen); if(first) seen[lab]=i; return {lab, first, rk:i, x:0, y:0, init:false, sh:0, alpha:1, pop:{x:0,v:0}}; }); }
  function load(){ A=mk(P.a); B=mk(P.b); m=0; mTarget=0; $('#mgR').value=0; matchOn=false; al=0; lp=0; $('#mtB').classList.remove('active'); $('#mgR').disabled=false; }
  chips($('#pB'),PAIRS4.map(p=>({id:p.id,label:p.label})),P.id,id=>{ P=PAIRS4.find(p=>p.id===id); load(); });
  $('#mgR').oninput=e=>{ mTarget=+e.target.value; };
  $('#shB').onclick=()=>{ [A,B].forEach(r=>r.forEach(k=>k.rk=Math.random())); };
  $('#mtB').onclick=()=>{ matchOn=!matchOn; $('#mtB').classList.toggle('active',matchOn); $('#mgR').disabled=matchOn; if(matchOn){ mTarget=1; $('#mgR').value=1; } };
  load();

  function uniqOrder(row){ const u=[]; row.slice().sort((a,b)=>a.rk-b.rk).forEach(k=>{ if(!u.includes(k.lab)) u.push(k.lab); }); return u; }

  animLoop(dt=>{
    t+=dt;
    m=approach(m,mTarget,5,dt); al=approach(al,matchOn?1:0,4,dt); lp=approach(lp,matchOn?1:0,2.6,dt);
    $('#mgV').textContent=Math.round(m*100)+'%';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const ya=h*0.26, yb=h*0.7;
    const ua=uniqOrder(A), ub=uniqOrder(B);
    const matchedB=ub.filter(l=>ua.includes(l)), strangersB=ub.filter(l=>!ua.includes(l));
    const cols=Math.max(A.length,B.length,ua.length+strangersB.length);
    const sp=Math.min(76,(w*0.86)/Math.max(cols,6)), cx=w/2, rr=Math.min(24,sp*0.36);
    const colX=(i,n)=>cx+(i-(n-1)/2)*sp;
    const alignCols=ua.length+strangersB.length;
    // positions for one token
    function pos(row,k,isA){
      const sorted=row.slice().sort((a,b)=>a.rk-b.rk), own=colX(sorted.indexOf(k),row.length);
      const u=isA?ua:ub, firstIdx=u.indexOf(k.lab), merged=colX(firstIdx,u.length);
      let al2;
      if(isA) al2=colX(ua.indexOf(k.lab),alignCols);
      else { const ai=ua.indexOf(k.lab); al2=ai>=0?colX(ai,alignCols):colX(ua.length+strangersB.indexOf(k.lab),alignCols); }
      const mm=lerp(own,merged,m), mergedAl=isA?colX(ua.indexOf(k.lab),alignCols):al2;
      return lerp(mm,mergedAl,al);
    }
    const partner=(lab,isA)=> (isA?ub:ua).includes(lab);
    function step(row,isA,y){
      row.forEach(k=>{
        const tx=pos(row,k,isA); if(!k.init){ k.x=tx; k.y=y; k.init=true; k.pop.v=6; }
        k.x=approach(k.x,tx,10,dt); k.y=approach(k.y,y,10,dt); springTo(k.pop,0,200,10,dt);
        k.alpha=k.first?1:1-m;
        const ok=partner(k.lab,isA); k.stranger=matchOn&&!ok&&al>0.8;
        k.sh=k.stranger?Math.sin(t*40+k.x)*2.2:0;
      });
    }
    step(A,true,ya); step(B,false,yb);
    // ---- shelves / row labels ----
    [ya,yb].forEach((y,i)=>{ line(ctx,w*0.06,y+rr+10,w*0.94,y+rr+10,COL.mid,1.4); });
    const lab=(row,y,name,col,isA)=>{ const sh=uniqOrder(row); const txt=name+' = { '+(m>0.5?sh:row.slice().sort((a,b)=>a.rk-b.rk).map(k=>k.lab)).join(', ')+' }';
      textAt(ctx,txt,w*0.06,y-rr-26,{size:Math.max(13,Math.min(16,w*0.017)),weight:700,color:col}); };
    lab(A,ya,P.an,COL.blue,true); lab(B,yb,P.bn,COL.red,false);
    // ---- match lines ----
    if(lp>0.02) ua.forEach(l=>{ if(!ub.includes(l)) return; const ka=A.find(k=>k.lab===l&&k.first), kb=B.find(k=>k.lab===l&&k.first);
      const y1=ka.y+rr+2, y2=lerp(y1,kb.y-rr-2,lp); line(ctx,ka.x,y1,kb.x,y2,COL.green,2.6); if(lp>0.95) arrowHead(ctx,kb.x,kb.y-rr-2,Math.PI/2,COL.green,8); });
    // ---- empty slots under unmatched A tokens ----
    if(al>0.5) ua.forEach(l=>{ if(ub.includes(l)) return; const ka=A.find(k=>k.lab===l&&k.first); ctx.save(); ctx.globalAlpha=al; ctx.setLineDash([5,5]); circ(ctx,ka.x,yb,rr,COL.mid,null,1.6); ctx.restore(); textAt(ctx,'?',ka.x,yb+6,{align:'center',size:16,weight:700,color:COL.mid,alpha:al}); });
    // ---- tokens ----
    const draw=(row,isA)=>row.forEach(k=>{
      if(k.alpha<0.02) return;
      const ok=partner(k.lab,isA), good=matchOn&&ok&&al>0.8;
      const sc=1+0.35*k.pop.x;
      tok(ctx,k.x+k.sh,k.y,k.lab,{r:rr,stroke:good?COL.green:(isA?COL.blue:COL.red),fill:good?'#e4f7ec':(k.stranger?'#fdece7':'#fff'),alpha:k.alpha,sx:sc,sy:sc,lw:2.6});
      if(k.stranger&&k.first) textAt(ctx,'✗ '+(isA?'∉ '+P.bn:'∉ '+P.an),k.x,k.y+(isA?rr+30:-rr-12),{align:'center',size:12,weight:700,color:COL.red});
    });
    draw(A,true); draw(B,false);
    if(m>0.05&&m<0.98) textAt(ctx,'repeats merge',w*0.94,ya-rr-26,{align:'right',size:12,weight:700,color:COL.yellow,alpha:Math.sin(m*Math.PI)});
    // ---- verdict ----
    const aSubB=ua.every(l=>ub.includes(l)), bSubA=ub.every(l=>ua.includes(l));
    $('#v1').innerHTML=aSubB?'<span style="color:var(--f-green)">✓ Yes</span>':'<span style="color:var(--f-red)">✗ No</span>';
    $('#v2').innerHTML=bSubA?'<span style="color:var(--f-green)">✓ Yes</span>':'<span style="color:var(--f-red)">✗ No</span>';
    $('#v3').innerHTML=(aSubB&&bSubA)?'<span style="color:var(--f-green)">'+P.an+' = '+P.bn+'  (equal)</span>':'<span style="color:var(--f-red)">'+P.an+' ≠ '+P.bn+'</span>';
    if(!matchOn) textAt(ctx,'press Match to pair every element',w/2,h*0.485,{align:'center',size:12,weight:600,color:COL.mid,alpha:0.8+0.2*Math.sin(t*3)});
  });
  return wrap;
}

/* =====================================================================
   VENN ENGINE  (shared by 1.6a Subsets, 1.9 Operations, 1.10 Complement)
   World = a rectangle U of 1.5 × 1. Elements sit at fixed spots in U; the
   circles A and B are moved by springs toward the slider targets, and an
   element belongs to a circle exactly when it lies inside it. Region
   shading is a line hatch evaluated point by point, so it always follows
   the circles. When an element's status changes it hops and lands.
   ===================================================================== */
const VW=1.5, VH=1;
const GEO={
  overlap :{A:{x:.60,y:.5,r:.31},B:{x:.90,y:.5,r:.31}},
  nestBA  :{A:{x:.72,y:.5,r:.42},B:{x:.84,y:.5,r:.20}},
  nestAB  :{A:{x:.84,y:.5,r:.20},B:{x:.72,y:.5,r:.42}},
  disjoint:{A:{x:.42,y:.5,r:.27},B:{x:1.08,y:.5,r:.27}},
  equal   :{A:{x:.75,y:.5,r:.36},B:{x:.75,y:.5,r:.36}},
};
function vennGeo(ex){
  const g=typeof ex.geo==='string'?GEO[ex.geo]:ex.geo;
  const o={A:Object.assign({},g.A),B:Object.assign({},g.B)};
  if(!ex.A.length) o.A.r=0;
  if(!ex.B.length) o.B.r=0;
  return o;
}
function vennNew(){
  const mk=()=>({x:{x:.75,v:0},y:{x:.5,v:0},r:{x:0,v:0}});
  return {ex:null, c:{A:mk(),B:mk()}, tg:{A:{x:.6,y:.5,r:.3},B:{x:.9,y:.5,r:.3}}, tokens:[], sets:{A:[],B:[]}, t:0};
}
function vennIn(c,x,y){ const r=c.r.x; return r>0.018 && Math.hypot(x-c.x.x,y-c.y.x)<r; }
function vennPlace(ex,geo){
  const wrOf=l=>{ const n=String(l).length; return n<=2?0.047:Math.min(0.14,0.047+0.013*(n-2)); };
  const cand=[]; for(let x=0.04;x<1.46;x+=0.02) for(let y=0.04;y<0.96;y+=0.02) cand.push([x,y]);
  const keyOf=l=>(ex.A.includes(l)?'1':'0')+(ex.B.includes(l)?'1':'0');
  const stat=(c,x,y,m)=>{ if(c.r<=0) return 0; const d=Math.hypot(x-c.x,y-c.y); return d<c.r-m?1:(d>c.r+m?0:-1); };
  const placed=[], out=[];
  ['11','10','01','00'].forEach(key=>{
    const labs=ex.U.filter(l=>keyOf(l)===key); if(!labs.length) return;
    const ia=key[0]==='1'?1:0, ib=key[1]==='1'?1:0;
    const grpPts=[];
    labs.forEach(l=>{
      const wr=wrOf(l);
      let valid=[];
      for(const mf of [1,0.4,0]){
        const m=wr*mf+0.012;
        valid=cand.filter(([x,y])=>x>wr+0.02&&x<VW-wr-0.02&&y>wr+0.02&&y<VH-wr-0.02&&stat(geo.A,x,y,m)===ia&&stat(geo.B,x,y,m)===ib);
        if(valid.length) break;
      }
      if(!valid.length) valid=cand.filter(([x,y])=>x>wr+0.02&&x<VW-wr-0.02&&y>wr+0.02&&y<VH-wr-0.02);
      const cx=valid.reduce((s,p)=>s+p[0],0)/valid.length, cy=valid.reduce((s,p)=>s+p[1],0)/valid.length;
      let best=null,bs=-1e9;
      valid.forEach(p=>{
        let gap=1e9; placed.forEach(q=>{ gap=Math.min(gap,Math.hypot(p[0]-q.x,p[1]-q.y)-wr-q.wr-0.014); });
        const sc=(gap<0?gap*4:Math.min(gap,0.16))-0.22*Math.hypot(p[0]-cx,p[1]-cy);
        if(sc>bs){ bs=sc; best=p; }
      });
      const q={lab:l,wr,x:best[0],y:best[1]}; placed.push(q); out.push(q);
    });
  });

}
function vennLoad(V,ex){
  V.ex=ex; const g=vennGeo(ex);
  V.tg.A=Object.assign({},g.A); V.tg.B=Object.assign({},g.B);
  const pl=vennPlace(ex,g);
  V.tokens=pl.map(q=>({lab:q.lab,wr:q.wr,hx:q.x,hy:q.y,ph:Math.random()*6.28,a:false,b:false,sc:{x:0,v:7},pl:[]}));
}
function vennStep(V,dt){
  V.t+=dt;
  ['A','B'].forEach(k=>{ const c=V.c[k], g=V.tg[k]; springTo(c.x,g.x,95,14,dt); springTo(c.y,g.y,95,14,dt); springTo(c.r,g.r,95,13,dt); });
  V.tokens.forEach(tk=>{ tk.a=vennIn(V.c.A,tk.hx,tk.hy); tk.b=vennIn(V.c.B,tk.hx,tk.hy); springTo(tk.sc,1,170,11,dt); });
  V.sets.A=V.tokens.filter(k=>k.a).map(k=>k.lab); V.sets.B=V.tokens.filter(k=>k.b).map(k=>k.lab);
}
function vennSel(V,expr){ return V.tokens.filter(k=>expr(k.a,k.b)).map(k=>k.lab); }
function vennFit(rx,ry,rw,rh){ const s=Math.min(rw/VW,rh/VH); return {ox:rx+(rw-VW*s)/2, oy:ry+(rh-VH*s)/2, s}; }
function setStr(arr){ return arr.length?'{ '+arr.join(', ')+' }':'∅'; }

/** Draw one panel. o: {pi, expr (token highlight), hatch:[{expr,color}], dt, title, titleCol, after(ctx,V,P)} */
function vennPanel(ctx,V,P,o){
  const {ox,oy,s}=P, t=V.t, dt=o.dt||0.016, pi=o.pi||0;
  ctx.save(); rrect(ctx,ox,oy,VW*s,VH*s,10); ctx.fillStyle='#fbfdff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
  textAt(ctx,'U',ox+10,oy+20,{size:15,weight:700,color:COL.ink});
  (o.hatch||[]).forEach(hz=>hatchRegion(ctx,P,(x,y)=>hz.expr(vennIn(V.c.A,x,y),vennIn(V.c.B,x,y)),hz.color,t));
  // circles
  [['A',COL.blue,'rgba(47,143,224,0.06)'],['B',COL.red,'rgba(217,67,43,0.06)']].forEach(([k,col,fill])=>{
    const c=V.c[k]; const r=c.r.x; const cx=ox+c.x.x*s, cy=oy+c.y.x*s;
    if(r>0.018){ ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r*s,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2.8; ctx.stroke(); ctx.restore();
      const a=k==='A'?-2.35:-0.8; textAt(ctx,k,cx+Math.cos(a)*(r*s+14),cy+Math.sin(a)*(r*s+14)+5,{align:'center',size:16,weight:700,color:col}); }
    else textAt(ctx,k+' = ∅',ox+(k==='A'?0.1:1.1)*s,oy+VH*s-12,{size:13,weight:700,color:col});
  });
  // tokens
  V.tokens.forEach(tk=>{
    const st=tk.pl[pi]||(tk.pl[pi]={lift:0,hop:{x:0,v:0},prev:null});
    const res=o.expr?o.expr(tk.a,tk.b):false;
    if(st.prev!==null && st.prev!==res) st.hop.v=-1.15;
    st.prev=res; st.lift=approach(st.lift,res?1:0,9,dt); springTo(st.hop,0,320,13,dt);
    const jx=Math.sin(t*1.3+tk.ph)*0.005, jy=Math.cos(t*1.1+tk.ph*1.7)*0.005;
    const x=ox+(tk.hx+jx)*s, y=oy+(tk.hy+jy+st.hop.x-st.lift*0.018)*s;
    const r=Math.max(9,tk.wr*s*clamp(tk.sc.x,0,1.3));
    if(res){ ctx.save(); ctx.globalAlpha=0.35+0.2*Math.sin(t*3+tk.ph); circ(ctx,x,y,r+4,COL.green,null,2); ctx.restore(); }
    let stroke=COL.mid, stroke2;
    if(tk.a&&tk.b){ stroke=COL.blue; stroke2=COL.red; } else if(tk.a) stroke=COL.blue; else if(tk.b) stroke=COL.red;
    tok(ctx,x,y,tk.lab,{r,stroke,stroke2,fill:res?'#e4f7ec':'#fff',lw:2.4,alpha:o.expr&&!res?0.7:1});
  });
  if(o.after) o.after(ctx,V,P);
  if(o.title) textAt(ctx,o.title,ox+VW*s/2,oy-10,{align:'center',size:Math.max(12,Math.min(16,s*0.06)),weight:700,color:o.titleCol||COL.ink});
}
