<script>
/* =========================================================================
   GRADE 11 — CHAPTER 5: THERMODYNAMICS
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn object eases, springs or physically integrates toward
   it every frame. Where a formula exists (pV work, q = CΔT, ΔH = ΔU + ΔngRT,
   ΔG = ΔH − TΔS, ΔG° = −RT ln K) the animation is driven by that formula and
   was checked against the textbook's worked problems (see CHECK comments).
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};
const R_GAS = 8.314;

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.stroke();} ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function sgn(x,d){ return (x>0.0005?'+':x<-0.0005?'−':'')+fmt(Math.abs(x),d); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
function sciK(K){
  if(!isFinite(K)) return '∞'; if(K<=0) return '0';
  if(K>=0.01&&K<1000) return fmt(K,K<1?3:1);
  const e=Math.floor(Math.log10(K)), m=K/Math.pow(10,e);
  const es=String(e).split('').map(c=>c==='-'?'⁻':SUP[+c]).join('');
  return fmt(m,1)+'×10'+es;
}

/* thermometer: frac 0→1 fills the column */
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  if(inten<=0.01) return;
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}
/* travelling wavy arrow = heat flow (red). t animates the wave along the path */
function heatArrow(ctx,x1,y1,x2,y2,t,alpha,color){
  color=color||COL.red;
  const L=Math.hypot(x2-x1,y2-y1); if(L<12) return;
  const ux=(x2-x1)/L, uy=(y2-y1)/L, nx=-uy, ny=ux, amp=3.2, wl=15;
  const a=clamp(alpha===undefined?1:alpha,0,1);
  ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle=color; ctx.lineWidth=2.4; ctx.lineCap='round';
  ctx.beginPath();
  for(let s=0;s<=L-8;s+=2){ const o=Math.sin((s/wl-t*3)*Math.PI*2)*amp; const px=x1+ux*s+nx*o, py=y1+uy*s+ny*o; if(s) ctx.lineTo(px,py); else ctx.moveTo(px,py); }
  ctx.stroke(); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,9); ctx.restore();
}
function bar(ctx,x,y,w,h,frac,color,bg){ rect(ctx,x,y,w,h,COL.ink,bg||'#f6f9fc',1.6); if(frac>0) rect(ctx,x+1,y+1,(w-2)*clamp(frac,0,1),h-2,color,color,0); }
/* read-out chip drawn on the canvas */
function chip(ctx,x,y,txt,col,align){
  ctx.save(); ctx.font='700 12px Poppins, sans-serif'; const tw=ctx.measureText(txt).width+14; ctx.restore();
  const bx=align==='center'?x-tw/2:align==='right'?x-tw:x;
  ctx.save(); rrect(ctx,bx,y-15,tw,22,7); ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore();
  textAt(ctx,txt,bx+7,y+1,{size:12,weight:700,color:col});
  return tw;
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
let activeTicks = [];   // exposed as window.__sim so the physics can be stepped deterministically in tests
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; activeTicks=[]; }
window.__sim = (seconds,step)=>{ step=step||0.02; for(let t=0;t<seconds;t+=step) activeTicks.forEach(f=>f(step)); };
function animLoop(tick){
  let last = performance.now();
  let raf;
  activeTicks.push(tick);
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}

/* ---------------------------------------------------------------------
   0c. SHARED THERMODYNAMICS SCENERY
   --------------------------------------------------------------------- */
/* gas molecules bouncing in a box whose ceiling (H) can move.
   x∈[0,W] from the left wall, y∈[0,H] up from the floor. */
function makeGas(n,W,H){
  const a=[]; for(let i=0;i<n;i++){ a.push({x:Math.random()*W,y:Math.random()*H,a:Math.random()*6.283,vx:0,vy:0}); }
  return a;
}
function stepGas(gas,dt,speed,W,H,pistonV){
  gas.forEach(g=>{
    if(!g.vx && !g.vy){ g.vx=Math.cos(g.a)*speed; g.vy=Math.sin(g.a)*speed; }
    const sp=Math.hypot(g.vx,g.vy)||1, k=speed/sp; g.vx*=k; g.vy*=k;
    g.x+=g.vx*dt; g.y+=g.vy*dt;
    if(g.x<0){ g.x=-g.x; g.vx=Math.abs(g.vx); } if(g.x>W){ g.x=2*W-g.x; g.vx=-Math.abs(g.vx); }
    if(g.y<0){ g.y=-g.y; g.vy=Math.abs(g.vy); }
    if(g.y>H){ g.y=Math.max(0,2*H-g.y); g.vy=-Math.abs(g.vy)+(pistonV||0)*0.0; }
  });
}
function drawGas(gas,ctx,x0,yFloor,col,r){
  ctx.save(); ctx.fillStyle='#fff'; ctx.strokeStyle=col||COL.blue; ctx.lineWidth=1.6;
  gas.forEach(g=>{ ctx.beginPath(); ctx.arc(x0+g.x,yFloor-g.y,r||3.6,0,6.283); ctx.fill(); ctx.stroke(); });
  ctx.restore();
}
/* cylinder walls (open at top) */
function cylWalls(ctx,x,wd,yBot,yTop){
  ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,yTop); ctx.lineTo(x,yBot); ctx.lineTo(x+wd,yBot); ctx.lineTo(x+wd,yTop); ctx.stroke(); ctx.restore();
}
function pistonPlate(ctx,x,wd,y,th){
  rect(ctx,x+2,y-th,wd-4,th,COL.ink,'#dfe7f1',2.2);
  line(ctx,x+wd/2,y-th,x+wd/2,y-th-14,COL.ink,3);
}
/* coil spring (compact line drawing) */
function coil(ctx,x,y1,y2,w,color,turns){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(x,y1);
  const n=turns||8, len=y2-y1;
  for(let i=0;i<n;i++){ const ya=y1+len*(i+0.25)/n, yb=y1+len*(i+0.75)/n; ctx.lineTo(x-w,ya); ctx.lineTo(x+w,yb); }
  ctx.lineTo(x,y2); ctx.stroke(); ctx.restore();
}
/* axes for a p–V plot; returns mappers */
function pvAxes(ctx,x,y,wd,ht,Vmax,pmax,xl,yl,vticks,pticks){
  const X=v=>x+wd*v/Vmax, Y=p=>y+ht-ht*p/pmax;
  line(ctx,x,y+ht,x+wd+8,y+ht,COL.ink,2); arrowHead(ctx,x+wd+8,y+ht,0,COL.ink,7);
  line(ctx,x,y+ht,x,y-8,COL.ink,2); arrowHead(ctx,x,y-8,-Math.PI/2,COL.ink,7);
  (vticks||[]).forEach(v=>{ line(ctx,X(v),y+ht,X(v),y+ht+5,COL.ink,1.4); textAt(ctx,String(v),X(v),y+ht+18,{align:'center',size:11,weight:600,color:COL.muted}); });
  (pticks||[]).forEach(p=>{ line(ctx,x,Y(p),x-5,Y(p),COL.ink,1.4); textAt(ctx,String(p),x-8,Y(p)+4,{align:'right',size:11,weight:600,color:COL.muted}); });
  textAt(ctx,xl,x+wd,y+ht+34,{align:'right',size:12,weight:700,color:COL.ink});
  textAt(ctx,yl,x+4,y-12,{size:12,weight:700,color:COL.ink});
  return {X,Y};
}

/* =====================================================================
   5.1 SYSTEM, SURROUNDINGS AND THE BOUNDARY   (Fig. 5.1 – 5.4)
   Open: matter + energy cross · Closed: energy only · Isolated: neither.
   Newton cooling:  dT/dt = −k (T − T_surr)  (k = 0 for an adiabatic wall);
   an open vessel also loses its hottest molecules as vapour.
   ===================================================================== */
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Boundary</label>
      <div class="toggle-group" id="wallB">
        <button class="toggle-btn active" data-w="open">Open</button>
        <button class="toggle-btn" data-w="closed">Closed</button>
        <button class="toggle-btn" data-w="isolated">Isolated</button></div></div>
    <div class="control-group"><label>Surroundings <span class="val" id="tsV"></span></label>
      <input type="range" id="tsR" min="0" max="80" step="1" value="20"></div>
    <div class="control-group"><button class="toggle-btn navy" id="rst" style="margin-top:0">↺ Reheat the water</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Matter</div><div class="rval" id="mV"></div></div>
      <div class="rcard"><div class="rlabel">Energy</div><div class="rval" id="eV"></div></div>
      <div class="rcard wide"><div class="rlabel">System temperature</div><div class="rval" id="tV" style="color:var(--f-red)"></div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), tsR=$('#tsR');
  let wall='open', T=80, reheat=false, t=0, Ts=20, spawnAcc=0;
  const liquid=[]; for(let i=0;i<36;i++) liquid.push({u:Math.random(),v:Math.random(),a:Math.random()*6.283});
  let vap=[];
  toggleWire(wrap.querySelectorAll('#wallB button'),b=>{ wall=b.dataset.w; vap=[]; });
  $('#rst').onclick=()=>{ reheat=true; };

  animLoop((dt)=>{
    t+=dt;
    const TsT=parseFloat(tsR.value); $('#tsV').textContent=TsT+' °C';
    Ts=approach(Ts,TsT,6,dt);
    if(reheat){ T=approach(T,80,3,dt); if(Math.abs(T-80)<0.4){ T=80; reheat=false; } }
    else {
      const k={open:0.07,closed:0.06,isolated:0}[wall];
      const evap=wall==='open'?clamp((T-20)/60,0,1.3)*1.6:0;
      T+= (-k*(T-Ts) - (T>Ts?evap:0))*dt;
    }
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    /* ---- geometry ---- */
    const cx=w*0.40, vw=Math.min(w*0.30,280), vh=Math.min(h*0.56,340);
    const vx0=cx-vw/2, vx1=cx+vw/2, vy0=h*0.27, yb=vy0+vh, lh=vh*0.56, ysurf=yb-lh;
    const closedLid = wall!=='open';

    // surroundings
    ctx.save(); rrect(ctx,w*0.03,h*0.05,w*0.94,h*0.90,18); ctx.fillStyle='#f6f9fc'; ctx.fill(); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    textAt(ctx,'SURROUNDINGS',w*0.05,h*0.105,{size:12,weight:700,color:COL.mid});

    // liquid
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.12)'; ctx.fillRect(vx0+2,ysurf,vw-4,lh-2); ctx.restore();
    line(ctx,vx0+2,ysurf,vx1-2,ysurf+Math.sin(t*3)*0.0,COL.blue,1.6);
    // liquid molecules (faster when hotter)
    const spd=0.25+Math.max(T,0)/140;
    ctx.save(); ctx.lineWidth=1.6; ctx.strokeStyle=COL.blue; ctx.fillStyle='#fff';
    liquid.forEach(m=>{
      m.a+=gauss()*3*dt; m.u+=Math.cos(m.a)*spd*dt*0.6; m.v+=Math.sin(m.a)*spd*dt*1.4;
      if(m.u<0.04){m.u=0.04;m.a=Math.PI-m.a;} if(m.u>0.96){m.u=0.96;m.a=Math.PI-m.a;}
      if(m.v<0.05){m.v=0.05;m.a=-m.a;} if(m.v>0.95){m.v=0.95;m.a=-m.a;}
      ctx.beginPath(); ctx.arc(vx0+8+m.u*(vw-16),ysurf+6+m.v*(lh-16),4.2,0,6.283); ctx.fill(); ctx.stroke();
    });
    ctx.restore();

    // vapour molecules
    const vfrac=clamp((T-8)/72,0,1);
    const target=Math.round(vfrac*11);
    if(wall==='open'){ spawnAcc+=vfrac*6*dt; while(spawnAcc>1){ spawnAcc--; vap.push({x:vx0+14+Math.random()*(vw-28),y:ysurf-4,vx:(Math.random()-0.5)*30,vy:-(45+Math.random()*50)}); } }
    else { if(vap.length<target && Math.random()<3*dt) vap.push({x:vx0+14+Math.random()*(vw-28),y:ysurf-4,vx:(Math.random()-0.5)*50,vy:-(45+Math.random()*50)});
           if(vap.length>target && Math.random()<5*dt) vap.pop(); }
    const topY=vy0-h*0.30;
    vap=vap.filter(m=>{
      m.x+=m.vx*dt; m.y+=m.vy*dt;
      if(wall==='open'){ m.vx+=gauss()*40*dt; m.vy+=-12*dt;
        if(m.y>vy0 && (m.x<vx0+6 || m.x>vx1-6)){ m.vx=-m.vx; m.x=clamp(m.x,vx0+6,vx1-6); }
        if(m.y<topY-30) return false;
      } else {
        const lid=vy0+14; const sp=Math.hypot(m.vx,m.vy)||1, s0=55+T*0.7; m.vx*=s0/sp; m.vy*=s0/sp;
        if(m.x<vx0+8){m.x=vx0+8;m.vx=Math.abs(m.vx);} if(m.x>vx1-8){m.x=vx1-8;m.vx=-Math.abs(m.vx);}
        if(m.y<lid){m.y=lid;m.vy=Math.abs(m.vy);} if(m.y>ysurf-5){m.y=ysurf-5;m.vy=-Math.abs(m.vy);}
      }
      const a=wall==='open'?clamp((m.y-(topY-30))/60,0,1):1;
      ctx.save(); ctx.globalAlpha=a; circ(ctx,m.x,m.y,3.8,COL.blue,'#fff',1.6); ctx.restore();
      return true;
    });

    // vessel + boundary
    const wl=(x1,y1,x2,y2,wd)=>line(ctx,x1,y1,x2,y2,COL.ink,wd||3.4);
    if(wall==='isolated'){
      const g=8;
      wl(vx0-g,vy0,vx0-g,yb+g); wl(vx1+g,vy0,vx1+g,yb+g); wl(vx0-g,yb+g,vx1+g,yb+g);
      wl(vx0,vy0+4,vx0,yb); wl(vx1,vy0+4,vx1,yb); wl(vx0,yb,vx1,yb,3);
      ctx.save(); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=1.2; for(let y=vy0+10;y<yb+g;y+=10){ ctx.beginPath(); ctx.moveTo(vx0-g+1,y); ctx.lineTo(vx0-1,y+5); ctx.moveTo(vx1+1,y); ctx.lineTo(vx1+g-1,y+5); ctx.stroke(); }
      for(let x=vx0+6;x<vx1;x+=10){ ctx.beginPath(); ctx.moveTo(x,yb+1); ctx.lineTo(x+5,yb+g-1); ctx.stroke(); } ctx.restore();
    } else {
      wl(vx0,vy0,vx0,yb); wl(vx1,vy0,vx1,yb); wl(vx0,yb,vx1,yb);
    }
    if(closedLid){
      ctx.save(); ctx.beginPath(); ctx.moveTo(vx0-10,vy0-2); ctx.lineTo(vx1+10,vy0-2); ctx.lineTo(vx1-4,vy0+12); ctx.lineTo(vx0+4,vy0+12); ctx.closePath();
      ctx.fillStyle='#dfe7f1'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.stroke(); ctx.restore();
    } else {
      line(ctx,vx0-8,vy0,vx0,vy0,COL.ink,3.4); line(ctx,vx1,vy0,vx1+8,vy0,COL.ink,3.4);
      // the imaginary boundary
      ctx.save(); ctx.setLineDash([7,6]); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.2; ctx.lineDashOffset=-t*20; rrect(ctx,vx0-16,vy0-36,vw+32,vh+52,12); ctx.stroke(); ctx.restore();
    }
    const wallLab={open:'imaginary boundary',closed:'conducting wall',isolated:'adiabatic wall'}[wall];
    textAt(ctx,wallLab,cx,yb+(wall==='isolated'?66:58),{align:'center',size:12,weight:700,color:wall==='open'?COL.yellow:COL.ink});
    textAt(ctx,'SYSTEM',cx,ysurf+lh*0.5+4,{align:'center',size:13,weight:700,color:COL.blue,alpha:0.28});

    // heat across the boundary
    const dT=T-Ts, ha=clamp(Math.abs(dT)/22,0,1);
    if(Math.abs(dT)>1.2){
      const L=Math.min(48,w*0.05), sy=[0.25,0.5,0.75].map(f=>vy0+vh*f);
      const out=dT>0, off=wall==='isolated'?16:0;
      const arrows=[];
      sy.forEach(y=>{ arrows.push([vx0-off,y,-1,0]); arrows.push([vx1+off,y,1,0]); });
      arrows.push([cx-vw*0.2,yb+off,0,1]); arrows.push([cx+vw*0.2,yb+off,0,1]);
      arrows.forEach(([x,y,dx,dy])=>{
        if(wall==='isolated'){ const ex=x+dx*(L*0.9), ey=y+dy*(L*0.9);
          heatArrow(ctx,ex+dx*L*0.0,ey,x+dx*8,y+dy*8,t,0.35*ha);
          const bx=x+dx*10, by=y+dy*10; line(ctx,bx+dy*7,by+dx*7,bx-dy*7,by-dx*7,COL.red,3.4); return; }
        const x1=out?x-dx*6:x+dx*L, y1=out?y-dy*6:y+dy*L, x2=out?x+dx*L:x-dx*6, y2=out?y+dy*L:y-dy*6;
        heatArrow(ctx,x1,y1,x2,y2,t,ha);
      });
      textAt(ctx,wall==='isolated'?'q = 0 · blocked':(out?'heat q leaves':'heat q enters'),cx,vy0-58-(closedLid?4:0),{align:'center',size:12,weight:700,color:COL.red,alpha:0.4+0.6*ha});
    }
    if(wall==='open' && vap.length){ textAt(ctx,'matter leaves',cx,topY-4,{align:'center',size:12,weight:700,color:COL.blue}); }

    // thermometers
    const tx1=w*0.76, tx2=w*0.88, tt=h*0.2, tb=h*0.72;
    thermo(ctx,tx1,tt,tb,T/100,COL.ink,COL.red);
    thermo(ctx,tx2,tt,tb,Ts/100,COL.ink,COL.blue);
    textAt(ctx,'System',tx1,tb+36,{align:'center',size:12,weight:700,color:COL.red});
    textAt(ctx,fmt(T,1)+' °C',tx1,tb+52,{align:'center',size:13,weight:700,color:COL.red});
    textAt(ctx,'Surroundings',tx2,tb+36,{align:'center',size:12,weight:700,color:COL.blue});
    textAt(ctx,fmt(Ts,0)+' °C',tx2,tb+52,{align:'center',size:13,weight:700,color:COL.blue});

    $('#mV').textContent=wall==='open'?'Exchanged':'None';
    $('#eV').textContent=wall==='isolated'?'None':'Exchanged';
    $('#tV').textContent=fmt(T,1)+' °C';
  });
  return wrap;
}

/* =====================================================================
   5.2 JOULE'S EXPERIMENT: WORK OR HEAT — SAME ΔU   (Section 5.1.4)
   Adiabatic: ΔU = w_ad.  Conducting wall: ΔU = q.  Both:  ΔU = q + w.
   200 g of water, C = m·c = 0.2 kg × 4.184 kJ/kg·K = 0.837 kJ/K, so
   ΔT = E / C — it does not matter HOW the energy E arrives.
   CHECK: E = 1 kJ  →  ΔT = 1.19 K by all three routes (state function).
   ===================================================================== */
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Route</label>
      <div class="toggle-group" id="rtB">
        <button class="toggle-btn active" data-r="paddle">Paddle</button>
        <button class="toggle-btn" data-r="rod">Heater</button>
        <button class="toggle-btn" data-r="bath">Hot bath</button></div></div>
    <div class="control-group"><label>Energy supplied <span class="val" id="eV"></span></label>
      <input type="range" id="eR" min="1" max="8" step="0.5" value="3"></div>
    <div class="control-group"><div class="toggle-group">
      <button class="toggle-btn play" id="go" style="flex:2">▶ Supply energy</button>
      <button class="toggle-btn" id="rs">↺</button></div></div>
    <div class="control-group"><label style="margin-bottom:4px;">Result of each route</label>
      <div class="result-cards three">
        <div class="rcard"><div class="rlabel">Paddle</div><div class="rval" id="r0">—</div></div>
        <div class="rcard"><div class="rlabel">Heater</div><div class="rval" id="r1">—</div></div>
        <div class="rcard"><div class="rlabel">Bath</div><div class="rval" id="r2">—</div></div></div>
      <div class="fb ok hidden" id="same">Same ΔT — ΔU depends only on the states.</div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), eR=$('#eR');
  const C=0.2*4.184, T0=25;               // kJ/K, °C
  let route='paddle', running=false, tau=0, s=0, t=0, theta=0, omega=0, E=3;
  const Td={x:T0,v:0}; const done={paddle:null,rod:null,bath:null};
  const DUR=5.5;
  const names={paddle:0,rod:1,bath:2};

  function reset(){ running=false; tau=0; $('#go').textContent='▶ Supply energy'; }
  toggleWire(wrap.querySelectorAll('#rtB button'),b=>{ route=b.dataset.r; reset(); });
  eR.oninput=()=>{ reset(); done.paddle=done.rod=done.bath=null; refresh(); };
  $('#rs').onclick=()=>{ reset(); done.paddle=done.rod=done.bath=null; refresh(); };
  $('#go').onclick=()=>{ if(running) return; tau=0; s=0; running=true; $('#go').textContent='⏳ …'; };
  function refresh(){
    ['paddle','rod','bath'].forEach(k=>{ $('#r'+names[k]).textContent=done[k]===null?'—':fmt(done[k],2)+' K'; });
    const v=Object.values(done).filter(x=>x!==null);
    $('#same').classList.toggle('hidden',!(v.length===3));
  }

  /* progress law per route: paddle & heater deliver steady power (linear),
     the bath is Newton-law: fast at first, then easing off */
  function law(r,u){ return r==='bath'?(1-Math.exp(-4*u))/(1-Math.exp(-4)):u; }

  animLoop((dt)=>{
    t+=dt;
    E=parseFloat(eR.value); $('#eV').textContent=fmt(E,1)+' kJ';
    const dTf=E/C;
    if(running){ tau+=dt/DUR; if(tau>=1){ tau=1; running=false; done[route]=dTf; $('#go').textContent='▶ Supply energy'; refresh(); } s=law(route,tau); }
    else if(tau===0 || tau>=1) s=approach(s,tau>=1?1:0,tau>=1?30:5,dt);
    const Ttgt=T0+dTf*s;
    springTo(Td,Ttgt,60,12,dt);
    omega=approach(omega,(route==='paddle'&&running)?10:0,4,dt); theta+=omega*dt;

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cx=w*0.40, vw=Math.min(w*0.30,300), vh=Math.min(h*0.42,340), vx0=cx-vw/2, vx1=cx+vw/2, vy0=h*0.38, yb=vy0+vh;
    const lvl=vy0+vh*0.18;

    /* ---- hot bath around a conducting vessel ---- */
    const TB=T0+dTf;
    if(route==='bath'){
      ctx.save(); rrect(ctx,vx0-48,vy0-30,vw+96,vh+78,16); ctx.fillStyle='rgba(217,67,43,0.10)'; ctx.fill(); ctx.strokeStyle=COL.red; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
      textAt(ctx,'BATH  '+fmt(TB,1)+' °C',vx0-40,vy0-38,{size:12,weight:700,color:COL.red});
    }
    /* ---- vessel & water ---- */
    ctx.save(); ctx.fillStyle='#dcebfa'; ctx.fillRect(vx0+2,lvl,vw-4,yb-lvl-2); ctx.fillStyle='rgba(217,67,43,'+(0.16*clamp((Td.x-T0)/10,0,1)).toFixed(3)+')'; ctx.fillRect(vx0+2,lvl,vw-4,yb-lvl-2); ctx.restore();
    line(ctx,vx0+2,lvl,vx1-2,lvl,COL.blue,1.6);
    const wl=(x1,y1,x2,y2)=>line(ctx,x1,y1,x2,y2,COL.ink,3.4);
    if(route==='bath'){ wl(vx0,vy0,vx0,yb); wl(vx1,vy0,vx1,yb); wl(vx0,yb,vx1,yb); }
    else {
      const g=8;
      wl(vx0-g,vy0,vx0-g,yb+g); wl(vx1+g,vy0,vx1+g,yb+g); wl(vx0-g,yb+g,vx1+g,yb+g);
      wl(vx0,vy0+6,vx0,yb); wl(vx1,vy0+6,vx1,yb); wl(vx0,yb,vx1,yb);
      ctx.save(); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=1.2; for(let y=vy0+10;y<yb+g;y+=10){ ctx.beginPath(); ctx.moveTo(vx0-g+1,y); ctx.lineTo(vx0-1,y+5); ctx.moveTo(vx1+1,y); ctx.lineTo(vx1+g-1,y+5); ctx.stroke(); } ctx.restore();
      textAt(ctx,'adiabatic wall',cx,yb+g+22,{align:'center',size:12,weight:700,color:COL.mid});
    }
    if(route==='bath') textAt(ctx,'conducting wall',cx,yb+66,{align:'center',size:12,weight:700,color:COL.mid});

    /* ---- the three ways in ---- */
    const yc=lvl+(yb-lvl)*0.55;
    if(route==='paddle'){
      const topY=h*0.13, drumX=cx, pulX=vx1+vw*0.42, dropMax=Math.min(h*0.52,330);
      // shaft + blades
      line(ctx,cx,topY,cx,yc,COL.ink,4);
      const R=vw*0.36;
      for(const front of [false,true]){
        [0,Math.PI].forEach(ph=>{ const a=theta+ph, c=Math.cos(a), sg=Math.sin(a);
          if((sg>=0)===front) return;
          ctx.save(); ctx.globalAlpha=front?1:0.6; ctx.beginPath(); ctx.rect(Math.min(cx,cx+R*c),yc-16,Math.abs(R*c),32); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore(); });
      }
      // swirling water
      ctx.save(); ctx.strokeStyle=COL.blue; ctx.fillStyle='#fff'; ctx.lineWidth=1.5;
      for(let i=0;i<14;i++){ const a=theta*0.55+i*0.45+(i%3)*2, rr=R*(0.55+0.5*((i*0.37)%1)), yy=yc+((i%5)-2)*14+Math.sin(a)*4;
        if(omega>0.3){ ctx.beginPath(); ctx.arc(cx+Math.cos(a)*rr,yy,2.6,0,6.283); ctx.fill(); ctx.stroke(); } }
      ctx.restore();
      // drum, string, pulley, falling weight
      circ(ctx,drumX,topY-2,12,COL.ink,'#fff',2.4); for(let i=0;i<3;i++){ const a=theta+i*2.094; line(ctx,drumX,topY-2,drumX+Math.cos(a)*10,topY-2+Math.sin(a)*10,COL.mid,1.4); }
      line(ctx,drumX+12,topY-2,pulX,topY-2,COL.ink,1.8);
      circ(ctx,pulX,topY-2,10,COL.ink,'#fff',2.4);
      const wy=topY+24+dropMax*(E/8)*s;
      line(ctx,pulX+10,topY-2,pulX+10,wy,COL.ink,1.8);
      ctx.save(); ctx.fillStyle='#e3ecf7'; ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6; rrect(ctx,pulX-6,wy,32,38,5); ctx.fill(); ctx.stroke(); ctx.restore();
      textAt(ctx,'m g',pulX+10,wy+24,{align:'center',size:12,weight:700,color:COL.blue});
      // ruler
      line(ctx,pulX+54,topY+24,pulX+54,topY+24+dropMax+38,COL.mid,1.4);
      for(let i=0;i<=5;i++) line(ctx,pulX+50,topY+24+(dropMax+38)*i/5,pulX+58,topY+24+(dropMax+38)*i/5,COL.mid,1.4);
      textAt(ctx,'w = m g h',pulX+64,topY+36,{size:12,weight:700,color:COL.blue});
    } else if(route==='rod'){
      // immersion heater (coil) + circuit
            const col=mixCol('#132a44','#d9432b',clamp(s*1.2+(running?0.4:0),0,1));
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=3.4; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(cx-10,lvl-4); ctx.lineTo(cx-10,yb-44);
      for(let i=0;i<6;i++){ ctx.lineTo(cx-vw*0.2*(i%2?-1:1),yb-44+(i+1)*5); }
      ctx.lineTo(cx+10,yb-12); ctx.lineTo(cx+10,lvl-4); ctx.stroke(); ctx.restore();
      const y16=h*0.14, y24=h*0.23, bx=vw*0.95;
      const P=[[cx-10,lvl-4],[cx-10,y16],[cx+bx,y16],[cx+bx,y24],[cx+10,y24],[cx+10,lvl-4]];
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore();
      // battery
      const bmy=(y16+y24)/2; line(ctx,cx+bx-16,bmy-6,cx+bx+16,bmy-6,COL.ink,5); line(ctx,cx+bx-9,bmy+6,cx+bx+9,bmy+6,COL.ink,5);
      ctx.save(); ctx.fillStyle='#fff'; ctx.fillRect(cx+bx-20,y16+5,40,bmy-12-y16-0); ctx.restore();
      textAt(ctx,'+',cx+bx+22,bmy-8,{size:13,weight:700,color:COL.ink}); textAt(ctx,'−',cx+bx+22,bmy+12,{size:13,weight:700,color:COL.ink});
      // flowing current (yellow charges)
      if(running){ let Ltot=0; const seg=[]; for(let i=0;i<P.length-1;i++){ const d=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]); seg.push(d); Ltot+=d; }
        for(let k=0;k<26;k++){ let d=((k/26)+t*0.35)%1*Ltot, i=0; while(d>seg[i]&&i<seg.length-1){ d-=seg[i]; i++; } const f=d/seg[i]; circ(ctx,lerp(P[i][0],P[i+1][0],f),lerp(P[i][1],P[i+1][1],f),3,COL.yellow,COL.yellow,1); } }
      textAt(ctx,'w = V I t',cx-vw*0.2,y16-8,{size:12,weight:700,color:COL.blue});
    } else {
      // heat flowing in from the bath
      const a=clamp((TB-Td.x)/Math.max(0.5,dTf),0,1);
      if(a>0.02 && (running||tau>0)){
        [0.25,0.5,0.75].forEach(f=>{ const y=vy0+vh*f; heatArrow(ctx,vx0-44,y,vx0+8,y,t,a); heatArrow(ctx,vx1+44,y,vx1-8,y,t,a); });
        heatArrow(ctx,cx-vw*0.2,yb+44,cx-vw*0.2,yb+8,t,a); heatArrow(ctx,cx+vw*0.2,yb+44,cx+vw*0.2,yb+8,t,a);
      }
      textAt(ctx,'q = C ΔT',cx,vy0-48,{align:'center',size:12,weight:700,color:COL.red});
    }

    /* ---- thermometer ---- */
    const tx=w*0.84, tt=h*0.2, tb=h*0.74;
    thermo(ctx,tx,tt,tb,(Td.x-20)/20,COL.ink,COL.red);
    textAt(ctx,fmt(Td.x,2)+' °C',tx,tb+36,{align:'center',size:13,weight:700,color:COL.red});
    textAt(ctx,'ΔT = '+fmt(Td.x-T0,2)+' K',tx,tb+54,{align:'center',size:12,weight:700,color:COL.ink});
    { const yy=tb-(tb-tt-5)*clamp((T0+dTf-20)/20,0,1); line(ctx,tx+8,yy,tx+22,yy,COL.yellow,3); textAt(ctx,'target',tx+26,yy+4,{size:11,weight:700,color:COL.yellow}); }
    // ghost marks of earlier runs (all land on the same temperature)
    Object.keys(done).forEach(k=>{ if(done[k]===null) return; const yy=tb-(tb-tt-5)*clamp((T0+done[k]-20)/20,0,1);
      line(ctx,tx-14,yy,tx-8,yy,COL.green,2.6); });

    /* ---- energy ledger  ΔU = q + w ---- */
    const bw=Math.min(w*0.2,170), bx0=w*0.05, by0=h*0.09;
    const wv=route==='bath'?0:E*s, qv=route==='bath'?E*s:0;
    textAt(ctx,'ENERGY LEDGER (kJ)',bx0,by0-12,{size:11,weight:700,color:COL.mid});
    [['w',wv,COL.blue],['q',qv,COL.red],['ΔU',wv+qv,COL.green]].forEach(([n,v,c],i)=>{
      const yy=by0+i*26; textAt(ctx,n,bx0,yy+13,{size:12,weight:700,color:c});
      bar(ctx,bx0+28,yy,bw,16,v/8,c); textAt(ctx,fmt(v,2),bx0+34+bw,yy+13,{size:12,weight:700,color:c});
    });
  });
  return wrap;
}

/* =====================================================================
   5.3 COMPRESSING A GAS — PRESSURE–VOLUME WORK   (Fig. 5.5 a, b, c)
   w = −p_ex ΔV  (one step) · w = −Σ p_ex,k ΔV_k  (finite steps)
   w_rev = −nRT ln(Vf/Vi)  (infinitely many steps) — always the smallest.
   n = 1 mol, T = 298 K → nRT = 24.78 L·bar; Vi = 4 L.
   CHECK: Vf = 1 L, one step: w = 24.78 × 3 = 74.3 L·bar;
          reversible: w = 24.78 × ln 4 = 34.4 L·bar.
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Weights added</label>
      <div class="toggle-group" id="stB">
        <button class="toggle-btn active" data-n="1">1 step</button>
        <button class="toggle-btn" data-n="3">3 steps</button>
        <button class="toggle-btn" data-n="8">8 steps</button>
        <button class="toggle-btn" data-n="0">Sand</button></div></div>
    <div class="control-group"><label>Final volume <span class="val" id="vfV"></span></label>
      <input type="range" id="vfR" min="1" max="3" step="0.1" value="1"></div>
    <div class="control-group"><div class="toggle-group">
      <button class="toggle-btn play" id="go" style="flex:2">▶ Compress</button>
      <button class="toggle-btn" id="rs">↺</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Work on gas, w</div><div class="rval" id="wV" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Minimum (sand)</div><div class="rval" id="wmV" style="color:var(--f-green)">—</div></div>
      <div class="rcard"><div class="rlabel">Gas pressure</div><div class="rval" id="pV">—</div></div>
      <div class="rcard"><div class="rlabel">Heat given out</div><div class="rval" id="qV" style="color:var(--f-red)">—</div></div></div>
      <p class="hint">w = −p<sub>ex</sub>ΔV · units: L·bar</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), vfR=$('#vfR');
  const nRT=0.08314*298, Vi=4;
  let N=1, Vf=1, t=0, phase='idle', cur=0, pexNow=nRT/Vi, tau=0, settleT=0, mvu=0;
  const P={x:Vi,v:0};
  let blocks=[], grains=[], gas=makeGas(26,100,100);
  let sandH=0;

  function plan(){
    Vf=parseFloat(vfR.value); $('#vfV').textContent=fmt(Vf,1)+' L';
    const out={Vk:[Vi]}, n=N||1;
    for(let k=1;k<=n;k++) out.Vk.push(Vi-(Vi-Vf)*k/n);
    out.pex=out.Vk.map(v=>nRT/v);
    out.W=N?out.pex.slice(1).reduce((s,p,i)=>s+p*(out.Vk[i]-out.Vk[i+1]),0):nRT*Math.log(Vi/Vf);
    return out;
  }
  let pl=plan();
  function reset(){
    pl=plan(); phase='idle'; cur=0; tau=0; pexNow=nRT/Vi; grains=[]; sandH=0; mvu=0; $('#go').textContent='▶ Compress';
    blocks=[]; if(N){ for(let k=1;k<=N;k++){ const dp=pl.pex[k]-pl.pex[k-1]; blocks.push({k,dp,state:'wait',u:0}); } }
  }
  toggleWire(wrap.querySelectorAll('#stB button'),b=>{ N=+b.dataset.n; reset(); });
  vfR.oninput=()=>reset();
  $('#rs').onclick=()=>reset();
  $('#go').onclick=()=>{ if(phase!=='idle') return; reset(); phase=N?'move':'sand'; $('#go').textContent='⏳ …'; if(N){ cur=1; blocks[0].state='moving'; blocks[0].u=0; } };
  reset();

  animLoop((dt)=>{
    t+=dt;
    /* ---------- dynamics ---------- */
    let Vt=Vi;
    if(phase==='move'){
      const b=blocks[cur-1]; b.u+=dt/0.55; if(b.u>=1){ b.u=1; b.state='on'; pexNow=pl.pex[cur]; phase='settle'; settleT=0; }
      Vt=pl.Vk[cur-1];
    } else if(phase==='settle'){
      Vt=pl.Vk[cur];
      if(Math.abs(P.x-Vt)<0.02 && Math.abs(P.v)<0.25){ settleT+=dt; } else settleT=0;
      if(settleT>0.2){ if(cur<N){ cur++; blocks[cur-1].state='moving'; blocks[cur-1].u=0; phase='move'; } else { phase='done'; $('#go').textContent='▶ Compress'; } }
    } else if(phase==='sand'){
      tau+=dt/6.5; if(tau>=1){ tau=1; phase='done'; $('#go').textContent='▶ Compress'; }
      Vt=Vi*Math.pow(Vf/Vi,tau); pexNow=nRT/Vt; sandH=tau;
      if(tau<1) for(let i=0;i<Math.ceil(dt*70);i++) grains.push({x:(Math.random()-0.5)*14,y:0,vy:0,fresh:true});
    } else if(phase==='done'){ Vt=pl.Vk?pl.Vk[N||1]:Vf; if(!N) Vt=Vf; }
    else { Vt=Vi; }
    // piston: damped spring toward the equilibrium volume (visible overshoot → settle)
    springTo(P,Vt,N===0&&phase==='sand'?500:75,N===0&&phase==='sand'?44:7.2,dt);

    /* ---------- live work ---------- */
    let wLive=0;
    if(N){ for(let k=1;k<=N;k++){ const started=k<cur||(k===cur&&(phase==='settle'||phase==='done')); const done_=(phase==='done'); if(!(started||done_)) continue;
        const por=clamp(pl.Vk[k-1]-P.x,0,pl.Vk[k-1]-pl.Vk[k]); wLive+=pl.pex[k]*por; } }
    else wLive=nRT*Math.log(Vi/Math.max(0.5,P.x));

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    /* ---------- cylinder ---------- */
    const cw=Math.min(w*0.2,200), cx0=w*0.08, yB=h*0.90, ch=Math.min(h*0.66,440), pxL=ch/5.2;
    const yP=yB-P.x*pxL;                     // underside of piston plate
    const th=14;
    // gas
    const Wg=cw-8, Hg=Math.max(8,P.x*pxL-6);
    stepGas(gas,dt,150,Wg,Hg);
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.07)'; ctx.fillRect(cx0+2,yP,cw-4,yB-yP-2); ctx.restore();
    drawGas(gas,ctx,cx0+4,yB-4,COL.blue,3.8);
    cylWalls(ctx,cx0,cw,yB,yB-ch);
    pistonPlate(ctx,cx0,cw,yP,th);
    // pressure arrows on the piston (gas ↑ , external ↓)
    const pg=nRT/Math.max(0.5,P.x);
    const ex=cx0+cw/2;
    const gl=Math.min(pg*1.5,Math.max(10,yB-yP-24)); vec(ctx,cx0+cw*0.2,yP+12+gl,cx0+cw*0.2,yP+3,COL.mid,2.4); vec(ctx,cx0+cw*0.8,yP+12+gl,cx0+cw*0.8,yP+3,COL.mid,2.4);
    // where the piston will stop (yellow = what you change)
    { const yF=yB-Vf*pxL; line(ctx,cx0-8,yF,cx0+cw+8,yF,COL.yellow,2.2,[7,5]); textAt(ctx,'Vf',cx0+cw+14,yF+4,{size:12,weight:700,color:COL.yellow}); }
    // heat leaving (isothermal compression)
    const ha=clamp(Math.abs(P.v)/1.3,0,1);
    if(ha>0.05&&P.v<0){ [0.3,0.55,0.8].forEach(f=>{ const y=lerp(yP,yB,f); heatArrow(ctx,cx0-4,y,cx0-52,y,t,ha); }); }
    textAt(ctx,'298 K',cx0+cw/2,yB+22,{align:'center',size:12,weight:700,color:COL.mid});

    // blocks (external weights)
    const shelfX=cx0+cw+40, yShelf=yB-Vi*pxL-th, bwid=cw*0.84;
    if(N){
      let stackH=0;
      const bh=b=>8+68*(b.dp/(pl.pex[N]-pl.pex[0]));
      blocks.forEach(b=>{ if(b.state==='on') stackH+=bh(b); });
      let acc=0; const onBase=yP-th;
      ctx.save();
      // shelf
      if(blocks.some(b=>b.state==='wait')) line(ctx,shelfX-8,yShelf,shelfX+bwid*0.95,yShelf,COL.mid,2);
      let waitX=shelfX;
      blocks.forEach(b=>{
        const H_=bh(b);
        if(b.state==='on'){ const y=onBase-acc-H_; acc+=H_; rr(ctx,cx0+(cw-bwid)/2,y,bwid,H_,b.k); }
        else if(b.state==='moving'){
          const u=b.u, e=u*u*(3-2*u);
          const tx=cx0+(cw-bwid)/2, ty=onBase-acc-H_;
          const sx=waitX-0, sy=yShelf-H_;
          const x=lerp(sx,tx,e), y=lerp(sy,ty,u*u)-Math.sin(u*Math.PI)*34;
          rr(ctx,x,y,bwid,H_,b.k);
        } else { rr(ctx,waitX,yShelf-H_,Math.min(bwid,N>3?bwid*0.38:bwid*0.9),H_,b.k,true); waitX+= (N>3?bwid*0.34:bwid*0.0); }
      });
      ctx.restore();
    } else {
      // sand heap + hopper
      const hy=yB-ch-8, hx=ex;
      ctx.save(); ctx.beginPath(); ctx.moveTo(hx-26,hy-26); ctx.lineTo(hx+26,hy-26); ctx.lineTo(hx+6,hy+6); ctx.lineTo(hx-6,hy+6); ctx.closePath(); ctx.fillStyle='#fdf4dc'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
      const top=yP-th, hh=2+58*sandH;
      if(hh>3){ ctx.save(); ctx.beginPath(); ctx.moveTo(cx0+cw*0.1,top); ctx.quadraticCurveTo(ex,top-hh*1.7,cx0+cw*0.9,top); ctx.closePath(); ctx.fillStyle='#fdf4dc'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); }
      grains=grains.filter(g=>{ g.vy+=1500*dt; g.y+=g.vy*dt; const gy=hy+6+g.y; const land=top-hh*1.1; if(gy>=land) return false; circ(ctx,ex+g.x*(1-(gy-hy)/ (top-hy+1)*0.5),gy,2.2,COL.yellow,COL.yellow,1); return true; });
    }
    // pex arrow
    vec(ctx,ex,yB-ch-30,ex,yB-ch+4+Math.min(30,pexNow*0.5),COL.blue,3); textAt(ctx,'p_ex',ex+10,yB-ch-18,{size:12,weight:700,color:COL.blue});

    /* ---------- p–V graph ---------- */
    const gx=w*0.57, gy=h*0.14, gw=w*0.37, gh=h*0.62, Vmax=5, pmax=30;
    const {X,Y}=pvAxes(ctx,gx,gy,gw,gh,Vmax,pmax,'V (L)','p (bar)',[1,2,3,4,5],[0,10,20,30]);
    // target outline (dashed) for the chosen route
    ctx.save(); ctx.setLineDash([6,5]); ctx.strokeStyle=COL.red; ctx.lineWidth=1.6; ctx.globalAlpha=0.75; ctx.beginPath(); ctx.moveTo(X(Vi),Y(0));
    if(N){ for(let k=1;k<=N;k++){ ctx.lineTo(X(pl.Vk[k-1]),Y(pl.pex[k])); ctx.lineTo(X(pl.Vk[k]),Y(pl.pex[k])); } ctx.lineTo(X(Vf),Y(0)); }
    else { for(let v=Vi;v>=Vf-0.001;v-=0.04) ctx.lineTo(X(v),Y(nRT/v)); ctx.lineTo(X(Vf),Y(0)); }
    ctx.stroke(); ctx.restore();
    // filled work area
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.28)';
    if(N){ for(let k=1;k<=N;k++){ const started=k<cur||(k===cur&&(phase==='settle'||phase==='done'))||phase==='done'; if(!started) continue;
        const por=clamp(pl.Vk[k-1]-P.x,0,pl.Vk[k-1]-pl.Vk[k]); ctx.fillRect(X(pl.Vk[k-1]-por),Y(pl.pex[k]),X(pl.Vk[k-1])-X(pl.Vk[k-1]-por),Y(0)-Y(pl.pex[k])); }
      ctx.strokeStyle=COL.blue; ctx.lineWidth=1.4; for(let k=1;k<=N;k++){ if(k>cur&&phase!=='done') break; const por=clamp(pl.Vk[k-1]-P.x,0,pl.Vk[k-1]-pl.Vk[k]); if(por>0.001) ctx.strokeRect(X(pl.Vk[k-1]-por),Y(pl.pex[k]),X(pl.Vk[k-1])-X(pl.Vk[k-1]-por),Y(0)-Y(pl.pex[k])); }
    } else if(phase!=='idle'){
      ctx.beginPath(); ctx.moveTo(X(P.x),Y(0)); for(let v=P.x;v<=Vi+0.001;v+=0.04) ctx.lineTo(X(v),Y(nRT/v)); ctx.lineTo(X(Vi),Y(0)); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // isotherm
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6; ctx.beginPath(); for(let v=0.85;v<=4.9;v+=0.05){ const x=X(v),y=Y(nRT/v); if(v<0.86) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.stroke(); ctx.restore();
    textAt(ctx,'isotherm  pV = nRT',X(3.1),Y(nRT/3.1)-14,{size:11,weight:700,color:COL.blue});
    // Vi / Vf markers
    [[Vi,'Vi'],[Vf,'Vf']].forEach(([v,n])=>{ line(ctx,X(v),Y(0),X(v),Y(Math.min(pmax,nRT/v)),COL.mid,1.2,[4,4]); textAt(ctx,n,X(v)+(n==='Vf'?-4:4),Y(0)-8,{align:n==='Vf'?'right':'left',size:12,weight:700,color:COL.mid}); });
    // state dot
    const pdot=nRT/Math.max(0.6,P.x);
    circ(ctx,X(P.x),Y(Math.min(pdot,pmax)),6.5,COL.ink,COL.yellow,2.4);
    // external pressure staircase level
    if(phase!=='idle'&&N) line(ctx,gx,Y(pexNow),X(Vi)+14,Y(pexNow),COL.red,1.4,[3,4]);
    chip(ctx,gx+gw*0.55,gy+gh*0.12,'shaded area = work on gas',COL.blue,'left');

    $('#wV').textContent=phase==='idle'?'—':fmt(wLive,1)+' L·bar';
    $('#wmV').textContent=fmt(nRT*Math.log(Vi/Vf),1)+' L·bar';
    $('#pV').textContent=fmt(pg,1)+' bar';
    $('#qV').textContent=phase==='idle'?'—':fmt(wLive*0.1,2)+' kJ';
  });
  function rr(ctx,x,y,wd,ht,k,wait){
    ctx.save(); rrect(ctx,x,y,wd,ht,4); ctx.fillStyle=wait?'#eef2f8':'#e3ecf7'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
  }
  return wrap;
}

/* =====================================================================
   5.4 EXPANDING A GAS — ISOTHERMAL EXPANSION OF 1 mol   (Problems 5.2–5.4)
   Free expansion (p_ex = 0):  w = 0, q = 0
   Against constant p_ex:      q = −w = p_ex (Vf − Vi)
   Reversible:                 q = −w = 2.303 nRT log(Vf/Vi)
   Isothermal ideal gas → ΔU = 0 in every case, so q = −w.
   2 L → 10 L at 298 K, nRT = 0.08206 × 298 = 24.46 L·atm.
   CHECK: vacuum → 0 · 1 atm → 8 L·atm · reversible → 24.46 ln 5 = 39.4 L·atm
          (textbook: 0, 8, 39.366 L·atm).
   The piston is integrated as a real mass:  V'' = k (p_gas − p_ex) − c V'.
   ===================================================================== */
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Route</label>
      <div class="toggle-group" id="rtB">
        <button class="toggle-btn active" data-r="vac">Vacuum</button>
        <button class="toggle-btn" data-r="pex">Constant p<sub>ex</sub></button>
        <button class="toggle-btn" data-r="rev">Reversible</button></div></div>
    <div class="control-group"><label>External pressure <span class="val" id="peV"></span></label>
      <input type="range" id="peR" min="0.5" max="8" step="0.5" value="1"></div>
    <div class="control-group"><div class="toggle-group">
      <button class="toggle-btn play" id="go" style="flex:2">▶ Expand</button>
      <button class="toggle-btn" id="rs">↺</button></div></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel" style="text-transform:none">w</div><div class="rval" id="wV" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel" style="text-transform:none">q</div><div class="rval" id="qV" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel" style="text-transform:none">ΔU</div><div class="rval" id="uV" style="color:var(--f-green)">—</div></div></div>
      <p class="hint">units: L·atm · 1 mol · 298 K</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), peR=$('#peR');
  const RT=0.08206*298, Vi=2, Vmax=10;
  const KA=1.6, CD=1.2;
  let route='vac', phase='idle', t=0, tau=0, still=0, pex=0;
  const P={x:Vi,v:0};
  const res={vac:null,pex:null,rev:null};
  let gas=makeGas(26,100,100), grains=[];
  const peOf=()=>route==='vac'?0:route==='rev'?RT/Math.max(P.x,Vi):parseFloat(peR.value);

  function reset(){ phase='idle'; tau=0; still=0; grains=[]; $('#go').textContent='▶ Expand'; peR.disabled=(route!=='pex'); }
  toggleWire(wrap.querySelectorAll('#rtB button'),b=>{ route=b.dataset.r; reset(); });
  peR.oninput=()=>{ reset(); res.pex=null; };
  $('#rs').onclick=()=>{ reset(); res.vac=res.pex=res.rev=null; };
  $('#go').onclick=()=>{ if(phase==='run') return; reset(); P.x=Vi; P.v=0; phase='run'; $('#go').textContent='⏳ …'; };
  reset();

  animLoop((dt)=>{
    t+=dt;
    $('#peV').textContent=route==='pex'?fmt(parseFloat(peR.value),1)+' atm':route==='vac'?'0 (vacuum)':'tracks gas';
    /* ---------- dynamics ---------- */
    let Vv=0;
    if(phase==='run'){
      if(route==='rev'){
        tau+=dt/7; if(tau>=1){ tau=1; }
        const Vt=Vi*Math.pow(Vmax/Vi,tau); Vv=(Vt-P.x)/Math.max(dt,1e-3); P.v=Vv; P.x=Vt;
        if(tau>=1){ phase='done'; res.rev=RT*Math.log(P.x/Vi); $('#go').textContent='▶ Expand'; }
        if(tau<1 && Math.random()<dt*34){ grains.push({x:0.2,y:0,vx:70+Math.random()*50,vy:-30,on:true}); }
      } else {
        const pe=peOf(); const sub=5, h=dt/sub;
        for(let i=0;i<sub;i++){
          const a=KA*(RT/P.x-pe)-CD*P.v; P.v+=a*h; P.x+=P.v*h;
          if(P.x>=Vmax){ P.x=Vmax; if(P.v>0) P.v*=-0.28; }
          if(P.x<1.2){ P.x=1.2; if(P.v<0) P.v=0; }
        }
        if(Math.abs(P.v)<0.06 && Math.abs(KA*(RT/P.x-pe))<0.35 || (P.x>=Vmax-0.001&&Math.abs(P.v)<0.06)) still+=dt; else still=0;
        if(still>0.4){ phase='done'; res[route]=pe*(P.x-Vi); $('#go').textContent='▶ Expand'; }
      }
    } else if(phase==='idle'){ springTo(P,Vi,70,16,dt); }

    const pe=peOf();
    const wby=route==='rev'?RT*Math.log(Math.max(P.x,Vi)/Vi):pe*(P.x-Vi);   // work done BY the gas

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    /* ---------- cylinder ---------- */
    const cw=Math.min(w*0.2,200), cx0=w*0.11, yB=h*0.86, ch=Math.min(h*0.68,450), pxL=ch/10.4;
    const yP=yB-P.x*pxL, th=14, ex=cx0+cw/2;
    // thermostat plate with heat flowing in
    rect(ctx,cx0-14,yB,cw+28,16,COL.ink,'#fdece7',2.2);
    textAt(ctx,'thermostat 298 K',ex,yB+36,{align:'center',size:12,weight:700,color:COL.mid});
    const ha=clamp(Math.abs(P.v)/2.2,0,1);
    if(phase!=='idle' && route!=='vac' && (ha>0.04||phase==='run')) [0.25,0.5,0.75].forEach(f=>{ const x=cx0+cw*f; heatArrow(ctx,x,yB+14,x,yB-26,t,route==='rev'?0.9:Math.max(ha,0.25)); });
    // gas
    const Wg=cw-8, Hg=Math.max(8,P.x*pxL-6);
    stepGas(gas,dt,150,Wg,Hg);
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.07)'; ctx.fillRect(cx0+2,yP,cw-4,yB-yP-2); ctx.restore();
    drawGas(gas,ctx,cx0+4,yB-4,COL.blue,3.8);
    cylWalls(ctx,cx0,cw,yB,yB-Vmax*pxL-6);
    // stops (pins) at 10 L
    const yStop=yB-Vmax*pxL; [[cx0,1],[cx0+cw,-1]].forEach(([x,d])=>{ ctx.save(); ctx.fillStyle=COL.ink; ctx.beginPath(); ctx.moveTo(x,yStop-12); ctx.lineTo(x+d*14,yStop-12); ctx.lineTo(x,yStop-2); ctx.closePath(); ctx.fill(); ctx.restore(); });
    pistonPlate(ctx,cx0,cw,yP,th);
    // 'volume' ruler
    dimArrow(ctx,cx0-24,yB,yP); textAt(ctx,fmt(P.x,1)+' L',cx0-32,(yB+yP)/2+4,{align:'right',size:12,weight:700,color:COL.ink});

    // external load
    if(route==='pex'){
      const bh=6+11*pe, bwid=cw*0.84; const y=yP-th-bh;
      ctx.save(); rrect(ctx,cx0+(cw-bwid)/2,y,bwid,bh,5); ctx.fillStyle='#e3ecf7'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
      textAt(ctx,fmt(pe,1)+' atm',ex,y+bh/2+5,{align:'center',size:12,weight:700,color:COL.blue});
    } else if(route==='vac'){
      textAt(ctx,'nothing above the piston',ex,yP-th-26,{align:'center',size:12,weight:700,color:COL.mid});
      textAt(ctx,'p_ex = 0',ex,yP-th-10,{align:'center',size:12,weight:700,color:COL.blue});
    } else {
      // sand pile that is removed grain by grain
      const left=Math.max(0,1-(phase==='idle'?0:tau)), hh=2+66*left, top=yP-th;
      ctx.save(); ctx.beginPath(); ctx.moveTo(cx0+cw*0.08,top); ctx.quadraticCurveTo(ex,top-hh*1.7,cx0+cw*0.92,top); ctx.closePath(); ctx.fillStyle='#fdf4dc'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
      grains=grains.filter(g=>{ g.vy+=1300*dt; g.x+=g.vx*dt; g.y+=g.vy*dt; const gx=cx0+cw*0.9+g.x, gy=top-hh*0.3+g.y; if(gy>yB+20) return false; circ(ctx,gx,gy,2.4,COL.yellow,COL.yellow,1); return true; });
    }

    /* ---------- p–V graph ---------- */
    const gx=w*0.57, gy=h*0.09, gw=w*0.36, gh=h*0.46, pmax=14;
    const {X,Y}=pvAxes(ctx,gx,gy,gw,gh,Vmax,pmax,'V (L)','p (atm)',[2,4,6,8,10],[0,4,8,12]);
    // planned area (dashed)
    const Vend=route==='rev'?Vmax:Math.min(Vmax,pe>0?RT/pe:Vmax);
    ctx.save(); ctx.setLineDash([6,5]); ctx.strokeStyle=COL.red; ctx.lineWidth=1.6; ctx.globalAlpha=0.75; ctx.beginPath(); ctx.moveTo(X(Vi),Y(0));
    if(route==='rev'){ for(let v=Vi;v<=Vmax+0.001;v+=0.1) ctx.lineTo(X(v),Y(RT/v)); ctx.lineTo(X(Vmax),Y(0)); }
    else { ctx.lineTo(X(Vi),Y(pe)); ctx.lineTo(X(Vend),Y(pe)); ctx.lineTo(X(Vend),Y(0)); }
    ctx.stroke(); ctx.restore();
    // live area
    if(phase!=='idle'){ ctx.save(); ctx.fillStyle='rgba(47,143,224,0.28)'; ctx.beginPath(); ctx.moveTo(X(Vi),Y(0));
      if(route==='rev'){ for(let v=Vi;v<=P.x+0.001;v+=0.05) ctx.lineTo(X(v),Y(RT/v)); ctx.lineTo(X(P.x),Y(RT/P.x)); }
      else { ctx.lineTo(X(Vi),Y(pe)); ctx.lineTo(X(P.x),Y(pe)); }
      ctx.lineTo(X(P.x),Y(0)); ctx.closePath(); ctx.fill(); ctx.restore(); }
    // isotherm
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6; ctx.beginPath(); for(let v=1.7;v<=10.01;v+=0.05){ const x=X(v),y=Y(Math.min(pmax,RT/v)); if(v<1.72) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.stroke(); ctx.restore();
    textAt(ctx,'isotherm',X(5.4),Y(RT/5.4)-12,{size:11,weight:700,color:COL.blue});
    circ(ctx,X(P.x),Y(Math.min(pmax,RT/P.x)),6.5,COL.ink,COL.yellow,2.4);
    [[Vi,'Vi'],[Vmax,'Vf']].forEach(([v,n])=>textAt(ctx,n,X(v)+(n==='Vf'?-4:4),Y(0)-8,{align:n==='Vf'?'right':'left',size:12,weight:700,color:COL.mid}));

    /* ---------- what each route delivers: bars ---------- */
    const by=gy+gh+62, bwm=gw*0.62, bx=gx+gw*0.3;
    textAt(ctx,'WORK DONE BY THE GAS (L·atm)',gx,by-14,{size:11,weight:700,color:COL.mid});
    [['Vacuum','vac',0],['p_ex '+fmt(parseFloat(peR.value),1)+' atm','pex',1],['Reversible','rev',2]].forEach(([n,k,i])=>{
      const yy=by+i*28, v=res[k]; textAt(ctx,n,gx,yy+13,{size:12,weight:700,color:COL.ink});
      bar(ctx,bx,yy,bwm,17,v===null?0:v/42,COL.blue); textAt(ctx,v===null?'—':fmt(v,1),bx+bwm+8,yy+13,{size:12,weight:700,color:COL.blue});
    });

    const shown=phase==='idle'?null:wby;
    $('#wV').textContent=shown===null?'—':(shown<0.05?'0':'−'+fmt(shown,1));
    $('#qV').textContent=shown===null?'—':(shown<0.05?'0':'+'+fmt(shown,1));
    $('#uV').textContent=shown===null?'—':'0';
  });
  return wrap;
}

/* =====================================================================
   5.5 BOMB CALORIMETER — MEASURING ΔU AT CONSTANT VOLUME   (Fig. 5.7, Problem 5.6)
   q = −C_V ΔT  ·  sealed bomb → ΔV = 0 → w = 0 → ΔU = q_V
   C(graphite) + O2(g) → CO2(g): Δn_g = 0, so ΔH = ΔU.
   Textbook data: 1 g burns and releases 20.7 kJ  (C_V = 20.7 kJ/K).
   CHECK: m = 1 g, C_V = 20.7 kJ/K → ΔT = 1.0 K → q = −20.7 kJ
          → ΔU = −20.7 × 12.0 = −248 kJ/mol  (textbook: −2.48 × 10² kJ/mol).
   ===================================================================== */
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Graphite burned <span class="val" id="mV"></span></label>
      <input type="range" id="mR" min="0.25" max="2" step="0.25" value="1"></div>
    <div class="control-group"><label><span>Calorimeter C<sub>V</sub></span> <span class="val" id="cV"></span></label>
      <input type="range" id="cR" min="10" max="30" step="0.1" value="20.7"></div>
    <div class="control-group"><div class="toggle-group">
      <button class="toggle-btn play" id="go" style="flex:2">⚡ Ignite</button>
      <button class="toggle-btn" id="rs">↺</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">ΔT of water</div><div class="rval" id="dT" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel" style="text-transform:none">q = −C<sub>V</sub>ΔT</div><div class="rval" id="qV" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel" style="text-transform:none">ΔU (per mol)</div><div class="rval" id="uV" style="color:var(--f-green)">—</div></div>
      <div class="rcard"><div class="rlabel" style="text-transform:none">ΔH (per mol)</div><div class="rval" id="hV" style="color:var(--f-green)">—</div></div></div>
      <p class="hint">Sealed bomb: ΔV = 0 → w = 0 · Δn<sub>g</sub> = 0 → ΔH = ΔU</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), mR=$('#mR'), cR=$('#cR');
  const T0=25, QG=20.7, M=12.0;
  let ign=-1, t=0, Tw=T0, th=0, Tg=0;
  // molecules inside the bomb: 9 O2 → CO2 as the carbon burns
  const mols=[]; for(let i=0;i<9;i++) mols.push({x:Math.random(),y:Math.random(),a:Math.random()*6.283,rot:Math.random()*6.283,th:i/9});
  const sparks=[];
  function reset(){ ign=-1; $('#go').textContent='⚡ Ignite'; }
  $('#rs').onclick=reset; mR.oninput=reset; cR.oninput=reset;
  $('#go').onclick=()=>{ if(ign>=0 && ign<6) return; ign=0; Tw=T0; Tg=0; $('#go').textContent='🔥 burning…'; };

  animLoop((dt)=>{
    t+=dt; if(ign>=0) ign+=dt;
    const m=parseFloat(mR.value), CV=parseFloat(cR.value);
    $('#mV').textContent=fmt(m,2)+' g'; $('#cV').textContent=fmt(CV,1)+' kJ/K';
    const Q=m*QG, dTf=Q/CV;
    const burn=ign<0?0:clamp((ign-0.25)/1.6,0,1);                 // fraction of carbon burned
    // water warms by Newton's law once the bomb wall is hot
    const Ttgt=T0+dTf*(ign>0.6?1:0);
    Tw=approach(Tw,ign<0?T0:Ttgt,ign<0?4:0.9,dt);
    if(ign>=6 && Math.abs(Tw-Ttgt)<0.01*Math.max(dTf,0.3)){ $('#go').textContent='⚡ Ignite'; }
    // hot gas pulse inside the bomb (fast molecules, high p) that fades as heat leaves
    const pulse=ign<0.2?0:Math.exp(-(ign-0.9)*(ign-0.9)/(ign<0.9?0.18:2.4));
    Tg=approach(Tg,pulse,10,dt);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cx=w*0.40, jw=Math.min(w*0.52,430), jh=Math.min(h*0.66,430), jx0=cx-jw/2, jy0=h*0.2, jb=jy0+jh, wl=jy0+jh*(0.27-0.17*(parseFloat(cR.value)-10)/20);

    textAt(ctx,'C(graphite) + O₂(g)  →  CO₂(g)',w*0.05,h*0.075,{size:13,weight:700,color:COL.ink});
    // insulating jacket (double wall)
    ctx.save(); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=1.2; for(let y=jy0;y<jb+14;y+=10){ ctx.beginPath(); ctx.moveTo(jx0-14,y); ctx.lineTo(jx0-1,y+5); ctx.moveTo(jx0+jw+1,y); ctx.lineTo(jx0+jw+14,y+5); ctx.stroke(); } ctx.restore();
    line(ctx,jx0-14,jy0,jx0-14,jb+14,COL.ink,3.2); line(ctx,jx0+jw+14,jy0,jx0+jw+14,jb+14,COL.ink,3.2); line(ctx,jx0-14,jb+14,jx0+jw+14,jb+14,COL.ink,3.2);
    line(ctx,jx0,jy0,jx0,jb,COL.ink,3); line(ctx,jx0+jw,jy0,jx0+jw,jb,COL.ink,3); line(ctx,jx0,jb,jx0+jw,jb,COL.ink,3);
    // water (warms: red tint)
    const warm=clamp((Tw-T0)/4,0,1);
    ctx.save(); ctx.fillStyle='#dcebfa'; ctx.fillRect(jx0+2,wl,jw-4,jb-wl-2); ctx.fillStyle='rgba(217,67,43,'+(0.20*warm).toFixed(3)+')'; ctx.fillRect(jx0+2,wl,jw-4,jb-wl-2); ctx.restore();
    line(ctx,jx0+2,wl,jx0+jw-2,wl,COL.blue,1.6);
    textAt(ctx,'water bath',jx0+jw-10,jb-10,{align:'right',size:11,weight:700,color:COL.blue,alpha:0.7});

    /* ---- stirrer ---- */
    const sx=cx+jw*0.14, sy0=jy0-52, syb=jb-jh*0.22; th+=dt*7;
    rect(ctx,sx-14,sy0-14,28,22,COL.ink,'#dfe7f1',2.2); line(ctx,sx,sy0+8,sx,syb,COL.ink,3.4);
    [0,Math.PI].forEach(ph=>{ const c=Math.cos(th+ph); ctx.save(); ctx.beginPath(); ctx.rect(Math.min(sx,sx+26*c),syb-8,Math.abs(26*c),16); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); });
    textAt(ctx,'stirrer',sx,sy0-20,{align:'center',size:11,weight:700,color:COL.mid});

    /* ---- the bomb ---- */
    const bx=cx-jw*0.2, bw=jw*0.38, by0=jy0+jh*0.31, bh=jh*0.54, byb=by0+bh;
    // heat flowing out of the bomb into the water
    const ha=ign<0.5?0:clamp((Ttgt-Tw)/Math.max(0.2,dTf),0,1)*(ign>0.5?1:0);
    if(ha>0.03){ [0.25,0.55,0.85].forEach(f=>{ const y=by0+bh*f; heatArrow(ctx,bx-bw/2-4,y,bx-bw/2-46,y,t,ha); heatArrow(ctx,bx+bw/2+4,y,bx+bw/2+46,y,t,ha); }); heatArrow(ctx,bx,byb+4,bx,byb+44,t,ha); }
    // steel wall
    ctx.save(); rrect(ctx,bx-bw/2,by0,bw,bh,16); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=7; ctx.stroke(); ctx.strokeStyle='#dfe7f1'; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
    // lid, valve, wires
    rect(ctx,bx-bw/2-6,by0-12,bw+12,14,COL.ink,'#dfe7f1',2.6);
    rect(ctx,bx+bw*0.18,by0-26,16,16,COL.ink,'#dfe7f1',2.2);
    const wx1=bx-bw*0.18, wx2=bx+bw*0.0, wy=by0+bh*0.7;
    const glow=ign>=0&&ign<1.0;
    ctx.save(); ctx.strokeStyle=glow?COL.red:COL.ink; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(wx1,by0-12); ctx.lineTo(wx1,by0+bh*0.35); ctx.lineTo(bx-2,wy-14); ctx.moveTo(wx2+14,by0-12); ctx.lineTo(wx2+14,by0+bh*0.3); ctx.lineTo(bx+4,wy-14); ctx.stroke(); ctx.restore();
    line(ctx,wx1,by0-12,wx1,by0-52,COL.ink,2.4); line(ctx,wx2+14,by0-12,wx2+14,by0-52,COL.ink,2.4);
    textAt(ctx,'ignition',bx-bw*0.02,by0-58,{align:'center',size:11,weight:700,color:COL.mid});
    // crucible with graphite
    rect(ctx,bx-bw*0.2,wy-8,bw*0.4,10,COL.ink,'#fff',2.2); line(ctx,bx,wy+2,bx,byb-8,COL.ink,2.4); line(ctx,bx-bw*0.16,byb-8,bx+bw*0.16,byb-8,COL.ink,2.4);
    const gr=Math.max(0.05,m/2*(1-burn));
    ctx.save(); ctx.beginPath(); ctx.ellipse(bx,wy-10,bw*0.16*(0.4+0.6*gr),12*(0.3+0.7*gr),0,0,6.283); ctx.fillStyle='#5b6b7d'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    if(ign>=0.15 && ign<2.4){ const fi=Math.sin(clamp((ign-0.15)/2.2,0,1)*Math.PI); flame(ctx,bx,wy-14,bw*0.3,fi,t); }
    if(ign>=0.15 && ign<0.9){ for(let i=0;i<2;i++) sparks.push({x:bx+(Math.random()-0.5)*20,y:wy-18,vx:(Math.random()-0.5)*160,vy:-60-Math.random()*130,l:0.5}); }
    for(let i=sparks.length-1;i>=0;i--){ const p=sparks[i]; p.l-=dt; p.vy+=500*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.l<=0){ sparks.splice(i,1); continue; } circ(ctx,clamp(p.x,bx-bw/2+8,bx+bw/2-8),clamp(p.y,by0+8,byb-8),2,COL.yellow,COL.yellow,1); }
    // gas molecules: O2 (blue dumbbell) → CO2 (green line triplet)
    const sp=70+90*Tg;
    mols.forEach(g=>{
      g.a+=gauss()*2*dt; g.rot+=dt*(1+Tg*5);
      g.x+=Math.cos(g.a)*sp*dt/ (bw-30); g.y+=Math.sin(g.a)*sp*dt/(bh*0.5);
      if(g.x<0){g.x=0;g.a=Math.PI-g.a;} if(g.x>1){g.x=1;g.a=Math.PI-g.a;} if(g.y<0){g.y=0;g.a=-g.a;} if(g.y>1){g.y=1;g.a=-g.a;}
      const px=bx-bw/2+16+g.x*(bw-32), py=by0+16+g.y*(bh*0.46-4);
      const isCO2=burn>g.th*0.9+0.05;
      ctx.save(); ctx.translate(px,py); ctx.rotate(g.rot);
      if(isCO2){ line(ctx,-9,0,9,0,COL.green,2); circ(ctx,0,0,4.4,COL.green,'#e4f7ec',1.8); circ(ctx,-10,0,3.6,COL.green,'#fff',1.6); circ(ctx,10,0,3.6,COL.green,'#fff',1.6); }
      else { line(ctx,-4,0,4,0,COL.blue,2); circ(ctx,-5,0,3.6,COL.blue,'#fff',1.6); circ(ctx,5,0,3.6,COL.blue,'#fff',1.6); }
      ctx.restore();
    });
    textAt(ctx,'steel bomb · V constant',bx,byb+22,{align:'center',size:11,weight:700,color:COL.ink});
    // pressure gauge on the lid
    const gx=bx-bw*0.42, gy=by0-44; circ(ctx,gx,gy,16,COL.ink,'#fff',2.2);
    const ang=-2.4+ (0.25+0.55*Tg)*2.6; line(ctx,gx,gy,gx+Math.cos(ang)*12,gy+Math.sin(ang)*12,COL.red,2.4); circ(ctx,gx,gy,2,COL.ink,COL.ink,1);

    /* ---- thermometer ---- */
    const tx=cx+jw*0.34, tt=jy0-30, tb=jb-jh*0.12;
    thermo(ctx,tx,tt,tb,(Tw-T0+1)/6,COL.ink,COL.red);
    textAt(ctx,fmt(Tw,2)+' °C',tx+12,tb-10,{size:13,weight:700,color:COL.red});
    // right-hand ledger
    const lx=w*0.745, ly=h*0.2, lw=Math.min(w*0.14,130);
    textAt(ctx,'HEAT RELEASED (kJ)',lx,ly-12,{size:11,weight:700,color:COL.mid});
    const qnow=Math.max(0,(Tw-T0))*CV;
    bar(ctx,lx,ly,lw,18,qnow/42,COL.red); textAt(ctx,fmt(qnow,1)+' kJ',lx+lw+8,ly+14,{size:12,weight:700,color:COL.red});
    textAt(ctx,'TEMPERATURE RISE (K)',lx,ly+52,{size:11,weight:700,color:COL.mid});
    bar(ctx,lx,ly+64,lw,18,(Tw-T0)/4.2,COL.blue); textAt(ctx,fmt(Tw-T0,2)+' K',lx+lw+8,ly+78,{size:12,weight:700,color:COL.blue});

    const fin=ign>2.5 && Math.abs(Tw-Ttgt)<0.01*Math.max(dTf,0.3);
    const dnow=Tw-T0;
    $('#dT').textContent=ign<0?'—':fmt(dnow,2)+' K';
    $('#qV').textContent=ign<0?'—':'−'+fmt(CV*dnow,1)+' kJ';
    const um=fin?-(CV*dnow)*M/m:NaN;
    $('#uV').textContent=ign<0?'—':(isFinite(um)?fmt(um,0)+' kJ':'…');
    $('#hV').textContent=ign<0?'—':(isFinite(um)?fmt(um,0)+' kJ':'…');
  });
  return wrap;
}

/* =====================================================================
   5.6 HEATING WATER — PHASE CHANGES, ΔH AND ΔU   (Section 5.5, Problems 5.5, 5.7, 5.8)
   1 mol (18 g) of ice at 0 °C heated at constant pressure (1 bar):
     fusion       ΔfusH = 6.00 kJ        (T stays 0 °C)
     warming      q = m c ΔT = 18 × 4.2 × 100 = 7.56 kJ
     vaporisation ΔvapH = 40.79 kJ       (T stays 100 °C)
   The vapour pushes the piston: pΔV = Δn_g R T = 1 × 8.314 × 373 = 3.10 kJ
   so  ΔU = ΔH − Δn_g R T.
   CHECK (Problem 5.5, ΔvapH = 41.00): ΔU = 41.00 − 8.3 × 373 / 1000 = 37.904 kJ.
   ===================================================================== */
function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Burner <span class="val" id="pV"></span></label>
      <input type="range" id="pR" min="2" max="14" step="0.5" value="6"></div>
    <div class="control-group"><div class="toggle-group">
      <button class="toggle-btn play" id="go" style="flex:2">▶ Heat</button>
      <button class="toggle-btn" id="rs">↺</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Heat added</div><div class="rval" id="qV" style="color:var(--f-red)">0 kJ</div></div>
      <div class="rcard"><div class="rlabel">Now</div><div class="rval" id="phV">Ice</div></div>
      <div class="rcard"><div class="rlabel" style="text-transform:none">pΔV so far</div><div class="rval" id="wV" style="color:var(--f-blue)">0 kJ</div></div>
      <div class="rcard"><div class="rlabel" style="text-transform:none">ΔU of vaporising</div><div class="rval" id="uV" style="color:var(--f-green)">—</div></div></div>
      <p class="hint">ΔH = ΔU + Δn<sub>g</sub>RT</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), pR=$('#pR');
  const QF=6.00, QH=18*4.2*100/1000, QV=40.79, QT=QF+QH+QV, WV=1*R_GAS*373/1000, V_L=31.0;
  let Q=0, run=false, t=0;
  const N=36, COLS=6;
  const mols=[];
  for(let i=0;i<N;i++){ const c=i%COLS, r=Math.floor(i/COLS); mols.push({c,r,gas:false,x:0,y:0,vx:0,vy:0,ph:Math.random()*6.283,rot:Math.random()*6.283,rankM:0,rankV:0}); }
  // melting / vaporisation order: top rows first
  [...mols].sort((a,b)=>b.r-a.r||Math.sin(a.c*12.9)-Math.sin(b.c*12.9)).forEach((m,i)=>{ m.rankM=i; m.rankV=i; });

  function stateAt(q){
    if(q<QF) return {T:0,melt:q/QF,vap:0,ph:q<=0.01?'Ice':'Melting'};
    if(q<QF+QH) return {T:(q-QF)/QH*100,melt:1,vap:0,ph:'Water'};
    if(q<QT) return {T:100,melt:1,vap:(q-QF-QH)/QV,ph:'Boiling'};
    return {T:100,melt:1,vap:1,ph:'Steam'};
  }
  function reset(){ Q=0; run=false; mols.forEach(m=>{ m.gas=false; }); $('#go').textContent='▶ Heat'; }
  $('#rs').onclick=reset;
  $('#go').onclick=()=>{ if(Q>=QT) reset(); run=!run; $('#go').textContent=run?'⏸ Pause':'▶ Heat'; };

  function water(ctx,x,y,ang,s,col){
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    const hx=Math.cos(0.91)*6.8*s, hy=Math.sin(0.91)*6.8*s;
    line(ctx,0,0,hx,hy,col,1.4*s); line(ctx,0,0,hx,-hy,col,1.4*s);
    circ(ctx,hx,hy,2.5*s,col,'#fff',1.2*s); circ(ctx,hx,-hy,2.5*s,col,'#fff',1.2*s);
    circ(ctx,0,0,4.6*s,col,'#e6f1fc',1.6*s);
    ctx.restore();
  }

  animLoop((dt)=>{
    t+=dt;
    const P=parseFloat(pR.value); $('#pV').textContent=fmt(P,1)+' kJ/s';
    if(run){ Q=Math.min(QT,Q+P*dt); if(Q>=QT){ run=false; $('#go').textContent='▶ Heat'; } }
    const S=stateAt(Q);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    /* ---------- cylinder with piston (1 bar above) ---------- */
    const cw=Math.min(w*0.2,200), cx0=w*0.10, yB=h*0.70, ch=Math.min(h*0.62,420), sp0=Math.min(cw/7.2,26);
    const nGas=mols.filter(m=>m.gas).length;
    const rowsLeft=Math.ceil((N-nGas)/COLS);
    const spIce=sp0*1.0, spLiq=sp0*0.84;
    const bedTop=yB-6-rowsLeft*spLiq-8;
    const gasLen=18+S.vap*(ch-rowsLeft*spLiq-60);
    const yP=bedTop-gasLen, th=14;
    const sps=lerp(spIce,spLiq,smooth01(0,1,S.melt));
    // vapour trigger
    mols.forEach(m=>{
      const Tj=3.2+S.T*0.05;
      const mm=clamp(S.melt*N-m.rankM,0,1);
      const sp=lerp(spIce,spLiq,mm), jit=lerp(1.2,Tj,mm);
      const hx=cx0+cw/2+(m.c-(COLS-1)/2)*sp, hy=yB-10-m.r*sp;
      if(!m.gas && S.vap*N>m.rankV+0.0001 && S.vap>0){ m.gas=true; m.x=hx; m.y=hy; const a=-Math.PI/2+(Math.random()-0.5)*2.2, v=110+Math.random()*60; m.vx=Math.cos(a)*v; m.vy=Math.sin(a)*v; }
      if(m.gas && S.vap*N<=m.rankV-0.2) m.gas=false;
      if(!m.gas){
        const k=m.ph; m.ph+=dt*(1.5+mm*2.2+S.T*0.01);
        m.x=hx+Math.cos(m.ph*1.7+m.c)*jit; m.y=hy+Math.sin(m.ph*1.3+m.r)*jit; m.rot+=dt*mm*1.2;
        m._mm=mm;
      }
    });
    // gas molecules: free flight between bed and piston
    mols.forEach(m=>{ if(!m.gas) return;
      const sp=Math.hypot(m.vx,m.vy)||1, tgt=120; m.vx*=tgt/sp; m.vy*=tgt/sp;
      m.x+=m.vx*dt; m.y+=m.vy*dt; m.rot+=dt*3;
      const xl=cx0+8,xr=cx0+cw-8, yt=yP+8, yb=bedTop-2;
      if(m.x<xl){m.x=xl;m.vx=Math.abs(m.vx);} if(m.x>xr){m.x=xr;m.vx=-Math.abs(m.vx);}
      if(m.y<yt){m.y=yt;m.vy=Math.abs(m.vy);} if(m.y>yb){m.y=yb;m.vy=-Math.abs(m.vy);}
      m._mm=1;
    });
    // lattice (hydrogen bonds) in the ice
    ctx.save(); ctx.strokeStyle='rgba(47,143,224,0.45)'; ctx.lineWidth=1.3; ctx.setLineDash([3,3]);
    mols.forEach(m=>{ if(m.gas) return; const a=1-(m._mm||0); if(a<0.05) return;
      mols.forEach(n=>{ if(n===m||n.gas) return; if((n.c===m.c+1&&n.r===m.r)||(n.r===m.r+1&&n.c===m.c)){ ctx.globalAlpha=a*(1-(n._mm||0)); ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(n.x,n.y); ctx.stroke(); } }); });
    ctx.restore();
    // tint + molecules
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.08)'; ctx.fillRect(cx0+2,bedTop,cw-4,yB-bedTop-2); ctx.restore();
    mols.forEach(m=>water(ctx,m.x,m.y,m.rot,m.gas?0.85:1.0,m.gas?COL.blue:(m._mm>0.5?COL.blue:COL.ink)));
    cylWalls(ctx,cx0,cw,yB,yB-ch-4);
    rect(ctx,cx0-12,yB,cw+24,12,COL.ink,'#dfe7f1',2.4);
    pistonPlate(ctx,cx0,cw,yP,th);
    // 1 bar above (blue = work) + piston lift marker
    const ex=cx0+cw/2;
    vec(ctx,ex,yP-th-54,ex,yP-th-18,COL.blue,3); textAt(ctx,'1 bar',ex+10,yP-th-34,{size:12,weight:700,color:COL.blue});
    // burner + flame
    const bt=yB+58; rect(ctx,ex-30,bt,60,26,COL.ink,'#dfe7f1',2.4); line(ctx,ex-16,bt,ex-16,yB+14,COL.ink,2); line(ctx,ex+16,bt,ex+16,yB+14,COL.ink,2);
    if(Q<QT) flame(ctx,ex,bt,cw*0.62,(run?1:0.3)*P/14,t);
    // volume bracket for the vapour
    if(S.vap>0.02){ dimArrow(ctx,cx0+cw+22,bedTop,yP+th); textAt(ctx,'pΔV',cx0+cw+30,(bedTop+yP)/2+4,{size:12,weight:700,color:COL.blue}); }
    // phase caption
    textAt(ctx,S.ph,ex,yB+112,{align:'center',size:13,weight:700,color:S.ph==='Boiling'||S.ph==='Melting'?COL.red:COL.ink});
    // thermometer
    const tx=cx0+cw+84, tt=h*0.14, tb=yB-10;
    thermo(ctx,tx,tt,tb,S.T/110,COL.ink,COL.red);
    textAt(ctx,fmt(S.T,0)+' °C',tx,tb+36,{align:'center',size:13,weight:700,color:COL.red});

    /* ---------- heating curve ---------- */
    const gx=w*0.58, gy=h*0.12, gw=w*0.36, gh=h*0.44;
    const X=q=>gx+gw*q/60, Y=T=>gy+gh-gh*T/110;
    line(ctx,gx,gy+gh,gx+gw+8,gy+gh,COL.ink,2); arrowHead(ctx,gx+gw+8,gy+gh,0,COL.ink,7);
    line(ctx,gx,gy+gh,gx,gy-8,COL.ink,2); arrowHead(ctx,gx,gy-8,-Math.PI/2,COL.ink,7);
    [0,20,40,60].forEach(q=>{ line(ctx,X(q),gy+gh,X(q),gy+gh+5,COL.ink,1.4); textAt(ctx,String(q),X(q),gy+gh+18,{align:'center',size:11,weight:600,color:COL.muted}); });
    [0,50,100].forEach(T=>{ line(ctx,gx,Y(T),gx-5,Y(T),COL.ink,1.4); textAt(ctx,String(T),gx-8,Y(T)+4,{align:'right',size:11,weight:600,color:COL.muted}); });
    textAt(ctx,'heat added  Q (kJ)',gx+gw,gy+gh+34,{align:'right',size:12,weight:700});
    textAt(ctx,'T (°C)',gx+4,gy-12,{size:12,weight:700});
    const pts=[[0,0],[QF,0],[QF+QH,100],[QT,100]], cols=[COL.yellow,COL.blue,COL.red];
    for(let i=0;i<3;i++){ // faint full curve
      line(ctx,X(pts[i][0]),Y(pts[i][1]),X(pts[i+1][0]),Y(pts[i+1][1]),'#dbe4f0',4); }
    for(let i=0;i<3;i++){
      const a=pts[i][0], b=Math.min(pts[i+1][0],Q); if(Q<=a) break;
      const f=(b-a)/(pts[i+1][0]-a), ya=pts[i][1], yb2=lerp(pts[i][1],pts[i+1][1],f);
      line(ctx,X(a),Y(ya),X(b),Y(yb2),cols[i],4.2);
    }
    textAt(ctx,'ΔfusH 6.00',X(QF/2)+22,Y(0)-14,{align:'center',size:11,weight:700,color:COL.yellow});
    textAt(ctx,'ΔvapH 40.79',X(QF+QH+QV/2),Y(100)-10,{align:'center',size:11,weight:700,color:COL.red});
    textAt(ctx,'18 × 4.2 × 100 = 7.56',X(QF+QH/2)+14,Y(50)+8,{size:11,weight:700,color:COL.blue});
    circ(ctx,X(Q),Y(S.T),7,COL.ink,COL.yellow,2.4);

    /* ---------- ΔH = ΔU + pΔV bar ---------- */
    const by=gy+gh+78, bw=gw*0.96;
    textAt(ctx,'VAPORISING  ΔH = ΔU + pΔV  (kJ)',gx,by-12,{size:11,weight:700,color:COL.mid});
    rect(ctx,gx,by,bw,22,COL.ink,'#f6f9fc',1.6);
    const fu=(QV-WV)/QV, fill=S.vap;
    rect(ctx,gx+1,by+1,(bw-2)*fu*fill,20,COL.green,COL.green,0);
    rect(ctx,gx+1+(bw-2)*fu*fill,by+1,(bw-2)*(1-fu)*fill,20,COL.blue,COL.blue,0);
    textAt(ctx,'ΔU '+fmt((QV-WV),2),gx,by+42,{size:12,weight:700,color:COL.green});
    textAt(ctx,'pΔV '+fmt(WV,2),gx+bw,by+42,{align:'right',size:12,weight:700,color:COL.blue});
    textAt(ctx,'ΔH '+fmt(QV,2),gx+bw/2,by+42,{align:'center',size:12,weight:700,color:COL.ink});

    $('#qV').textContent=fmt(Q,1)+' kJ';
    $('#phV').textContent=S.ph;
    $('#wV').textContent=fmt(S.vap*WV,2)+' kJ';
    $('#uV').textContent=S.vap>=0.999?fmt(QV-WV,2)+' kJ':'—';
  });
  return wrap;
}

/* =====================================================================
   5.7 HESS'S LAW — ENTHALPY IS A STATE FUNCTION   (Section 5.4, Tables 5.2, Problem 5.9)
   ΔrH = ΣΔfH(products) − ΣΔfH(reactants) · the route does not matter.
   CHECK: C → CO:        −393.5 + (+283.0)            = −110.5 kJ/mol
          CaCO₃ → CaO+CO₂: +1206.9 + (−635.1 −393.5)  = +178.3 kJ/mol
          Fe₂O₃+3H₂ → 2Fe+3H₂O: +824.2 + 3(−285.83)   = −33.3  kJ/mol
   ===================================================================== */
const HESS=[
  { key:'CO',  btn:'C → CO',
    states:[{n:'C(graphite) + O₂',H:0},{n:'CO₂',H:-393.5},{n:'CO + ½O₂',H:-110.5}],
    steps:['(i)','(iii) = reverse of (ii)'], range:[70,-470],
    dirNote:'cannot be measured directly' },
  { key:'CaCO3', btn:'CaCO₃ → CaO',
    states:[{n:'CaCO₃',H:-1206.9},{n:'elements',H:0},{n:'CaO + CO₂',H:-635.1-393.5}],
    steps:['− ΔfH(CaCO₃)','ΔfH(CaO) + ΔfH(CO₂)'], range:[130,-1330],
    dirNote:'heat the limestone' },
  { key:'Fe2O3', btn:'Fe₂O₃ + H₂',
    states:[{n:'Fe₂O₃ + 3H₂',H:-824.2},{n:'elements',H:0},{n:'2Fe + 3H₂O',H:3*-285.83}],
    steps:['− ΔfH(Fe₂O₃)','3 ΔfH(H₂O)'], range:[110,-960],
    dirNote:'reduction with hydrogen' },
];
function buildA7(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Reaction</label>
      <div class="toggle-group" id="rxB">${HESS.map((r,i)=>`<button class="toggle-btn small${i?'':' active'}" data-i="${i}">${r.btn}</button>`).join('')}</div></div>
    <div class="control-group"><label style="margin-bottom:6px;">Route</label>
      <div class="toggle-group" id="rtB">
        <button class="toggle-btn" data-r="direct">Direct</button>
        <button class="toggle-btn" data-r="steps">In steps</button>
        <button class="toggle-btn active" data-r="both">Both</button></div></div>
    <div class="control-group"><label>Along the route <span class="val" id="pV"></span></label>
      <input type="range" id="pR" min="0" max="100" step="1" value="0"></div>
    <div class="control-group"><div class="toggle-group">
      <button class="toggle-btn play" id="go" style="flex:2">▶ Release</button>
      <button class="toggle-btn" id="rs">↺</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard wide"><div class="rlabel" style="text-transform:none">Direct  ΔrH</div><div class="rval" id="dV" style="color:var(--f-blue)"></div></div>
      <div class="rcard wide"><div class="rlabel" style="text-transform:none">Sum of the steps</div><div class="rval" id="sV" style="color:var(--f-green)"></div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), pR=$('#pR');
  let rx=0, route='both', t=0, playing=false, pT=0;
  const Pst={x:0,v:0}, Ax={lo:-470,hi:70};
  toggleWire(wrap.querySelectorAll('#rxB button'),b=>{ rx=+b.dataset.i; pT=0; playing=false; pR.value=0; $('#go').textContent='▶ Release'; });
  toggleWire(wrap.querySelectorAll('#rtB button'),b=>{ route=b.dataset.r; });
  pR.oninput=()=>{ playing=false; pT=parseFloat(pR.value)/100; $('#go').textContent='▶ Release'; };
  $('#rs').onclick=()=>{ playing=false; pT=0; pR.value=0; $('#go').textContent='▶ Release'; };
  $('#go').onclick=()=>{ if(pT>=0.999){ pT=0; Pst.x=0; Pst.v=0; } playing=!playing; $('#go').textContent=playing?'⏸ Pause':'▶ Release'; };

  animLoop((dt)=>{
    t+=dt;
    const R=HESS[rx], S=R.states;
    if(playing){ pT=Math.min(1,pT+dt/7); pR.value=Math.round(pT*100); if(pT>=1){ playing=false; $('#go').textContent='▶ Release'; } }
    springTo(Pst,pT,38,11,dt);
    const p=clamp(Pst.x,0,1.04);
    $('#pV').textContent=Math.round(pT*100)+' %';
    Ax.hi=approach(Ax.hi,R.range[0],5,dt); Ax.lo=approach(Ax.lo,R.range[1],5,dt);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const top=h*0.12, ht=h*0.72, ax=w*0.10, dw=w*0.86;
    const Y=H=>top+(Ax.hi-H)/(Ax.hi-Ax.lo)*ht;
    const cols=[ax+dw*0.17, ax+dw*0.5, ax+dw*0.83], bw=Math.min(dw*0.2,190);

    /* axis */
    line(ctx,ax,top-6,ax,top+ht+6,COL.ink,2); arrowHead(ctx,ax,top-8,-Math.PI/2,COL.ink,7);
    textAt(ctx,'H  (kJ/mol)',ax+8,top-12,{size:12,weight:700});
    const span=Ax.hi-Ax.lo, step=span>800?200:100;
    for(let v=Math.ceil(Ax.lo/step)*step; v<=Ax.hi; v+=step){ const y=Y(v); line(ctx,ax-5,y,ax,y,COL.ink,1.4); textAt(ctx,String(v),ax-9,y+4,{align:'right',size:11,weight:600,color:COL.muted}); if(v===0) line(ctx,ax,y,ax+dw,y,'#dbe4f0',1.2,[5,5]); }
    textAt(ctx,R.key==='CO'?'C(graphite) + ½O₂ → CO':R.key==='CaCO3'?'CaCO₃(s) → CaO(s) + CO₂(g)':'Fe₂O₃(s) + 3H₂(g) → 2Fe(s) + 3H₂O(l)',w*0.5,h*0.055,{align:'center',size:13,weight:700});

    /* levels */
    S.forEach((s,i)=>{
      const y=Y(s.H); line(ctx,cols[i]-bw/2,y,cols[i]+bw/2,y,COL.ink,4.2);
      const lab=s.n; const above=s.H>Math.min(S[0].H,S[1].H,S[2].H)+0.1;
      textAt(ctx,lab,cols[i],y+(above?-24:24),{align:'center',size:13,weight:700});
      textAt(ctx,fmt(s.H,1),cols[i],y+(above?-8:40),{align:'center',size:12,weight:700,color:COL.muted});
    });

    /* routes */
    const pts={
      direct:[[cols[0]+bw/2,Y(S[0].H)],[cols[2]-bw/2,Y(S[2].H)]],
      steps:[[cols[0]+bw/2,Y(S[0].H)],[cols[1]-bw/2,Y(S[1].H)],[cols[1]+bw/2,Y(S[1].H)],[cols[2]-bw/2,Y(S[2].H)]],
    };
    // segments of the stepped route (skip the flat run across the bar)
    const stepSegs=[[pts.steps[0],pts.steps[1]],[pts.steps[2],pts.steps[3]]];
    const showD=route!=='steps', showS=route!=='direct';
    const dTot=S[2].H-S[0].H, d1=S[1].H-S[0].H, d2=S[2].H-S[1].H;
    if(showD){
      const [a,b]=pts.direct; vec(ctx,a[0],a[1],b[0],b[1],COL.blue,3.2);
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      chip(ctx,mx,my,'ΔrH = '+sgn(dTot,1),COL.blue,'center');
      textAt(ctx,R.dirNote,mx,my+22,{align:'center',size:11,weight:600,color:COL.blue,alpha:0.85});
    }
    if(showS){
      stepSegs.forEach(([a,b],i)=>{ vec(ctx,a[0],a[1],b[0],b[1],COL.green,3.2);
        const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, d=i?d2:d1, right=b[1]>a[1];
        chip(ctx,mx,my,sgn(d,1),COL.green,'center');
        textAt(ctx,R.steps[i],mx+(right?18:-18),my+22,{align:right?'left':'right',size:11,weight:600,color:COL.green}); });
    }

    /* balls */
    function ballOn(poly,segsFlat,u,color){
      // poly: array of [a,b] segments, equal time each; returns {x,y,dir,e}
      const k=poly.length; const idx=Math.min(k-1,Math.floor(u*k-1e-9)); const f=clamp(u*k-idx,0,1);
      const [a,b]=poly[Math.max(0,idx)]; const down=b[1]>a[1];
      const e=down?f*f:1-(1-f)*(1-f);
      return {x:lerp(a[0],b[0],e),y:lerp(a[1],b[1],e),down,f,idx};
    }
    const balls=[];
    if(showD) balls.push({b:ballOn([pts.direct],0,p>1?1:p,COL.blue),col:COL.blue,H:S[0].H+dTot*clamp(p,0,1)});
    if(showS) balls.push({b:ballOn(stepSegs,0,p>1?1:p,COL.green),col:COL.green});
    balls.forEach(({b,col})=>{
      const vel=Math.abs(Pst.v); const ha=clamp(vel*2.2,0,1);
      if(ha>0.05){
        const sgnDown=b.down;  // exothermic: heat leaves; endothermic: heat enters
        [-0.7,-0.2,0.3,0.8].forEach(ang=>{ const a=ang*Math.PI, r1=18, r2=52;
          const ux=Math.cos(a+(sgnDown?0:Math.PI)), uy=Math.sin(a);
          const x1=b.x+(sgnDown?ux*r1:ux*r2), y1=b.y+(sgnDown?uy*r1:uy*r2), x2=b.x+(sgnDown?ux*r2:ux*r1), y2=b.y+(sgnDown?uy*r2:uy*r1);
          heatArrow(ctx,x1,y1,x2,y2,t,ha*0.9); });
      }
      circ(ctx,b.x,b.y-9,9,COL.ink,col,2.4);
    });
    // running total
    const Hnow=showD?S[0].H+dTot*clamp(p,0,1):(()=>{ const bb=ballOn(stepSegs,0,clamp(p,0,1),0); const i=bb.idx; const e=bb.down?bb.f*bb.f:1-(1-bb.f)*(1-bb.f); return S[0].H+(i===0?d1*e:d1+d2*e); })();
    chip(ctx,w*0.5,h*0.93,'ΔH so far  '+sgn(Hnow-S[0].H,1)+' kJ/mol',COL.ink,'center');

    const stepsTxt=(d1<0?'−':'')+fmt(Math.abs(d1),1)+(d2<0?' − ':' + ')+fmt(Math.abs(d2),1);
    $('#dV').textContent=sgn(dTot,1)+' kJ/mol';
    $('#sV').textContent=stepsTxt+' = '+sgn(d1+d2,1);
  });
  return wrap;
}

const BH_STEPS=[

];
const BH_DF=-411.2;
(function(){ const s=BH_STEPS.slice(0,4).reduce((a,x)=>a+x.dH,0); BH_STEPS[4].dH=BH_DF-s; })();

function buildA9(){
