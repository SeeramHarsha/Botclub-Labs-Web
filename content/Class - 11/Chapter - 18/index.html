      ctx.save(); ctx.globalAlpha=reached?1:0.28; vec(ctx,a[0],a[1],b[0],b[1],col,3); ctx.restore();
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      circ(ctx,mx,my+(up?-26:26),11,col,'#fff',2); textAt(ctx,String(i+1),mx,my+(up?-22:30),{align:'center',size:12,weight:700,color:col});
      ctx.save(); ctx.globalAlpha=reached?1:0.45; textAt(ctx,sgn(BH_STEPS[i].dH,1),mx+(up?-20:20),my+(up?-18:34),{align:up?'right':'left',size:12,weight:700,color:col}); ctx.restore();
    }
    textAt(ctx,'Na(s) + ½Cl₂(g)',X(0)-bwid/2,Y(0)+22,{size:11,weight:700,color:COL.muted});
    textAt(ctx,'NaCl(s)',X(5),Y(Hk[5])+24,{align:'center',size:12,weight:700,color:COL.ink});
    // the direct route
    const dx=X(5)+bwid/2+26;
    vec(ctx,dx,Y(0),dx,Y(BH_DF)-2,COL.blue,3.2);
    line(ctx,X(5)+bwid/2,Y(BH_DF),dx+10,Y(BH_DF),COL.blue,1.2,[4,4]);
    chip(ctx,dx-12,Y(BH_DF/2)-4,'ΔfH = '+sgn(BH_DF,1),COL.blue,'right');
    // ball on the staircase
    const a=[X(k)+bwid/2,Y(Hk[k])], b=[X(k+1)-bwid/2,Y(Hk[k+1])], up=Hk[k+1]>Hk[k];
    const e=up?1-(1-f)*(1-f):f*f; const bx=lerp(a[0],b[0],e), by=lerp(a[1],b[1],e);
    const heat=clamp(Math.abs(Pst.v)*0.9,0,1);
    if(heat>0.06){ [-0.6,0,0.6].forEach(ang=>{ const ux=Math.cos(ang-Math.PI/2), uy=Math.sin(ang-Math.PI/2);
      heatArrow(ctx,bx+(up?ux*50:ux*16),by+(up?uy*50:uy*16),bx+(up?ux*16:ux*50),by+(up?uy*16:uy*50),t,heat*0.9); }); }
    circ(ctx,bx,by-9,9,COL.ink,COL.yellow,2.4);

    /* ---------- particle window ---------- */
    const PX=w*0.625, PY=h*0.14, PW=w*0.345, PH=h*0.62;
    ctx.save(); rrect(ctx,PX,PY,PW,PH,14); ctx.fillStyle='#f6f9fc'; ctx.fill(); ctx.strokeStyle='#c2d1e5'; ctx.lineWidth=2; ctx.stroke(); ctx.clip();
    const U=Math.min(PW/9.2,PH/6.2), d=U*1.45, rNa=0.40*d, rCl=0.34*d;
    const PXy=(fx,fy)=>[PX+fx*PW,PY+fy*PH];
    const stg=(kk,delay)=>smooth01(delay,1,clamp(p-(kk-1),0,1));        // progress of step kk (1-based)
    const wob=(i,amp)=>[Math.sin(t*1.3+i*1.7)*amp,Math.cos(t*1.1+i*2.3)*amp];
    const lat0=[PX+PW/2-1.5*d, PY+PH*0.76];
    const slot=(s)=>[lat0[0]+s[0]*d, lat0[1]+s[1]*d*-1];
    const metal=(i)=>[PX+PW*0.14+(i%2)*d*0.95, PY+PH*0.80+Math.floor(i/2)*d*-0.95];
    const molCl=(j)=>{ const bc=[PX+PW*0.72, PY+PH*0.62+(j>>1)*PH*0.2]; return [bc[0]+(j%2?0.58:-0.58)*d, bc[1]]; };
    const posNa=[], posCl=[];
    for(let i=0;i<4;i++){
      const s1=stg(1,i*0.1), g=PXy(GN[i][0],GN[i][1]), w1=wob(i,PW*0.013*s1);
      let x=lerp(metal(i)[0],g[0]+w1[0],s1), y=lerp(metal(i)[1],g[1]+w1[1],s1);
      const s5=stg(5,i*0.05), tgt=slot(SN[i]), ee=s5>=1?1:outBack(s5);
      x=lerp(x,tgt[0],ee); y=lerp(y,tgt[1],ee); posNa.push([x,y]);
      const c=PXy(GC[i][0],GC[i][1]), s3=stg(3,i*0.08), w3=wob(i+7,PW*0.013*s3);
      let cx=lerp(molCl(i)[0],c[0]+w3[0],s3), cy=lerp(molCl(i)[1],c[1]+w3[1],s3);
      const tc=slot(SC[i]); cx=lerp(cx,tc[0],ee); cy=lerp(cy,tc[1],ee); posCl.push([cx,cy]);
    }
    // lattice bonds
    const bl=smooth01(0.55,1,p-4);
    if(bl>0){ ctx.save(); ctx.globalAlpha=bl; ctx.setLineDash([4,3]); ctx.strokeStyle=COL.green; ctx.lineWidth=1.6;
      for(let i=0;i<4;i++) for(let j=0;j<4;j++){ const A=SN[i], B=SC[j]; if(Math.abs(A[0]-B[0])+Math.abs(A[1]-B[1])===1){ ctx.beginPath(); ctx.moveTo(posNa[i][0],posNa[i][1]); ctx.lineTo(posCl[j][0],posCl[j][1]); ctx.stroke(); } }
      ctx.restore(); }
    // Cl–Cl bonds (break in step 3)
    for(let m=0;m<2;m++){ const al=1-smooth01(0.1,0.6,clamp(p-2,0,1)); if(al>0.02&&p<3.6){ const A=posCl[2*m],B=posCl[2*m+1]; line(ctx,A[0],A[1],B[0],B[1],mixCol('#132a44','#d9432b',1-al),2.4*al+0.4); } }
    // electrons
    for(let i=0;i<4;i++){
      const s2=stg(2,i*0.1), s4=stg(4,i*0.1);
      if(s2<=0||s4>=1) continue;
      const g=PXy(GN[i][0],GN[i][1]), home=[g[0]+wob(i,PW*0.013)[0]-0, g[1]-PH*0.12];
      const c=posCl[i];
      const x=lerp(lerp(posNa[i][0],home[0],s2),c[0],s4), y=lerp(lerp(posNa[i][1],home[1],s2),c[1],s4);
      circ(ctx,x,y,4.2,COL.yellow,COL.yellow,1); textAt(ctx,'e⁻',x+7,y-6,{size:10,weight:700,color:COL.yellow});
    }
    // atoms / ions
    for(let i=0;i<4;i++){
      const s2=stg(2,i*0.1), s4=stg(4,i*0.1), r1=rNa*(1-0.35*s2), r2=rCl*(1+0.47*s4);
      circ(ctx,posNa[i][0],posNa[i][1],r1,COL.blue,'#e6f1fc',2.4); textAt(ctx,s2>0.55?'Na⁺':'Na',posNa[i][0],posNa[i][1]+4,{align:'center',size:Math.max(9,d*0.27),weight:700,color:COL.blue});
      circ(ctx,posCl[i][0],posCl[i][1],r2,COL.green,'#e4f7ec',2.4); textAt(ctx,s4>0.55?'Cl⁻':'Cl',posCl[i][0],posCl[i][1]+4,{align:'center',size:Math.max(9,d*0.27),weight:700,color:COL.green});
    }
    // flash when the crystal closes
    const fl=clamp((p-4.75)/0.5,0,1); if(fl>0&&fl<1){ ctx.save(); ctx.globalAlpha=(1-fl)*0.8; ctx.strokeStyle=COL.green; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(lat0[0]+1.5*d,lat0[1]-0.5*d,10+fl*PW*0.5,0,6.283); ctx.stroke(); ctx.restore(); }
    ctx.restore();
    // energy flowing in (steps 1–3) or out (steps 4–5) of the window
    const hv=clamp(Math.abs(Pst.v)*0.9,0,1)*(p<5?1:0);
    if(hv>0.06){ const into=k<3; [0.3,0.5,0.7].forEach(fy=>{ const y=PY+PH*fy; if(into) heatArrow(ctx,PX-4,y,PX+34,y,t,hv); else heatArrow(ctx,PX+34,y,PX-4,y,t,hv); }); }
    const kk=p<0.02?-1:Math.min(4,Math.floor(Math.min(p,4.999)));
    const cap=kk<0?'Start:  Na(s) + ½Cl₂(g)':(kk+1)+'  '+BH_STEPS[kk].eq;
    textAt(ctx,cap,PX+PW/2,PY-14,{align:'center',size:13,weight:700,color:kk<0?COL.ink:(BH_STEPS[kk].dH>0?COL.red:COL.green)});
    if(p>=4.98) chip(ctx,PX+PW/2,PY+PH+34,'ΔlatticeH = +'+fmt(-BH_STEPS[4].dH,0)+' kJ/mol',COL.green,'center');

    /* ---------- readouts ---------- */
    const Hnow=(()=>{ const e2=up?1-(1-f)*(1-f):f*f; return lerp(Hk[k],Hk[k+1],e2); })();
    $('#tV').textContent=kk<0?'—':(kk+1)+'. '+BH_STEPS[kk].n+'  '+sgn(BH_STEPS[kk].dH,1);
    $('#hV').textContent=fmt(Hnow,1);
    $('#lV').textContent=p>=4.98?'+'+fmt(-BH_STEPS[4].dH,0)+' kJ':'—';
  });
  return wrap;
}

/* =====================================================================
   5.10 MIXING GASES — ENTROPY AND SPONTANEITY   (Fig. 5.11, Section 5.6 b)
   Two gases, A (black) and B (blue), isolated: ΔH = 0, yet mixing is spontaneous.
   Disorder is measured by the mixing entropy of each gas over the two halves:
        s = −[x ln x + (1−x) ln(1−x)]       x = fraction of the gas in the left half
   s = 0 when the gas is all on one side (ordered), s = ln 2 = 0.693 when it is spread
   evenly (S_max).  Each gas expanding into double the volume gains  nR ln 2.
   CHECK: all A left → x = 1 → s = 0 ; evenly mixed → x = ½ → s = ln 2.
   The probability that all N molecules of A wander back to the left half is 2^−N.
   ===================================================================== */
function buildA10(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="toggle-group">
      <button class="toggle-btn play" id="go" style="flex:2">⇥ Remove partition</button>
      <button class="toggle-btn" id="rs">↺</button></div></div>
    <div class="control-group"><label>Molecules of each gas <span class="val" id="nV"></span></label>
      <input type="range" id="nR" min="10" max="40" step="1" value="25"></div>
    <div class="control-group"><label>Temperature <span class="val" id="tV"></span></label>
      <input type="range" id="tR" min="100" max="600" step="10" value="300"></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel" style="text-transform:none">S / S<sub>max</sub></div><div class="rval" id="sV" style="color:var(--f-green)">0 %</div></div>
      <div class="rcard"><div class="rlabel">Left half</div><div class="rval" id="lV">100 % A</div></div>
      <div class="rcard wide"><div class="rlabel">Chance all A return to the left</div><div class="rval" id="cV" style="color:var(--f-red)"></div></div></div>
      <p class="hint">Isolated · ΔH = 0 · yet ΔS &gt; 0</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), nR=$('#nR'), tR=$('#tR');
  let N=25, t=0, open=false, part=1, parts=[], Sd=0, hist=[], hAcc=0, clock=0;
  const GEO={x0:0,y0:0,bw:1,bh:1};
  function init(){
    N=parseInt(nR.value); parts=[]; open=false; part=1; Sd=0; hist=[]; clock=0; $('#go').textContent='⇥ Remove partition';
    for(let i=0;i<N;i++){ parts.push({g:'A',u:Math.random()*0.46+0.02,v:Math.random()*0.94+0.03,a:Math.random()*6.283});
                          parts.push({g:'B',u:Math.random()*0.46+0.52,v:Math.random()*0.94+0.03,a:Math.random()*6.283}); }
  }
  nR.oninput=init; $('#rs').onclick=init;
  $('#go').onclick=()=>{ open=true; $('#go').textContent='partition removed'; };
  init();

  animLoop((dt)=>{
    t+=dt; clock+=dt;
    const T=parseFloat(tR.value); $('#tV').textContent=T+' K'; $('#nV').textContent=N;
    part=approach(part,open?0:1,open?1.6:6,dt); if(open&&part<0.01) part=0;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const x0=w*0.07, y0=h*0.12, bw=w*0.62, bh=h*0.46, v0=8*Math.sqrt(T);
    const sU=v0/bw, sV=v0/bh;      // unit speeds in box fractions per second
    const yPart=y0+bh*part;       // lower edge of the partition (it slides up and out)
    // physics (ideal gas: molecules bounce off the walls)
    const sub=2, hs=dt/sub;
    for(let s=0;s<sub;s++) parts.forEach(p=>{
      const ox=p.u;
      p.u+=Math.cos(p.a)*sU*hs; p.v+=Math.sin(p.a)*sV*hs;
      if(p.u<0.015){ p.u=0.015; p.a=Math.PI-p.a; } if(p.u>0.985){ p.u=0.985; p.a=Math.PI-p.a; }
      if(p.v<0.02){ p.v=0.02; p.a=-p.a; } if(p.v>0.98){ p.v=0.98; p.a=-p.a; }
      // the partition blocks the middle unless the molecule is below its lower edge
      if(part>0.003 && p.v*bh+y0<yPart){ if((ox<0.5&&p.u>=0.5-0.006)){ p.u=0.5-0.006; p.a=Math.PI-p.a; } else if(ox>=0.5&&p.u<0.5+0.006){ p.u=0.5+0.006; p.a=Math.PI-p.a; } }
      p.a+=0; });
    // entropy of mixing from half-box occupancy
    const cnt={A:[0,0],B:[0,0]}; parts.forEach(p=>{ cnt[p.g][p.u<0.5?0:1]++; });
    const sOf=(l,r)=>{ const n=l+r, xl=l/n, xr=r/n; return -((xl>0?xl*Math.log(xl):0)+(xr>0?xr*Math.log(xr):0)); };
    const Sraw=(sOf(...cnt.A)+sOf(...cnt.B))/2/Math.LN2;           // 0 … 1  (= S/Smax)
    Sd=approach(Sd,Sraw,5,dt);
    hAcc+=dt; if(hAcc>0.1){ hAcc=0; hist.push(Sd); if(hist.length>160) hist.shift(); }

    /* ---------- the box ---------- */
    rect(ctx,x0,y0,bw,bh,COL.ink,'#f6f9fc',3);
    // the partition slides up and out of the box; the gap opens at the bottom
    if(part>0.004){ const top=yPart-(bh+44); ctx.save(); ctx.beginPath(); ctx.rect(x0+bw/2-5,top,10,yPart-top); ctx.fillStyle='#dfe7f1'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore(); }
    ctx.save(); ctx.beginPath(); ctx.rect(x0+1.5,y0+1.5,bw-3,bh-3); ctx.clip();
    parts.forEach(p=>{ const x=x0+p.u*bw, y=y0+p.v*bh;
      if(p.g==='A') circ(ctx,x,y,6.4,COL.ink,COL.ink,1.6); else circ(ctx,x,y,6.4,COL.blue,'#fff',2.2); });
    ctx.restore();
    textAt(ctx,'gas A',x0+bw*0.25,y0-12,{align:'center',size:12,weight:700,color:COL.ink});
    textAt(ctx,'gas B',x0+bw*0.75,y0-12,{align:'center',size:12,weight:700,color:COL.blue});
    // purity of each half
    const aL=cnt.A[0], bL=cnt.B[0], aR=cnt.A[1], bR=cnt.B[1];
    const pl=(aL+bL)?aL/(aL+bL):0, pr=(aR+bR)?bR/(aR+bR):0;
    textAt(ctx,'pick one here: '+Math.round(pl*100)+' % A',x0+bw*0.25,y0+bh+22,{align:'center',size:12,weight:700,color:COL.ink});
    textAt(ctx,'pick one here: '+Math.round(pr*100)+' % B',x0+bw*0.75,y0+bh+22,{align:'center',size:12,weight:700,color:COL.blue});

    /* ---------- entropy bar ---------- */
    const bx=w*0.80, bt=y0, bb=y0+bh, bwid=34;
    rect(ctx,bx,bt,bwid,bb-bt,COL.ink,'#f6f9fc',2.4);
    const fh=(bb-bt-2)*clamp(Sd,0,1); rect(ctx,bx+1,bb-1-fh,bwid-2,fh,COL.green,COL.green,0);
    textAt(ctx,'S',bx+bwid/2,bt-12,{align:'center',size:14,weight:700,color:COL.green});
    textAt(ctx,'S max',bx+bwid+8,bt+5,{size:11,weight:700,color:COL.mid}); line(ctx,bx-5,bt+1,bx+bwid+5,bt+1,COL.mid,1.4,[3,3]);
    textAt(ctx,'ordered',bx+bwid+8,bb,{size:11,weight:700,color:COL.mid});

    /* ---------- entropy vs time ---------- */
    const cx0=x0, cy0=h*0.72, cw=bw, chh=h*0.18;
    line(ctx,cx0,cy0+chh,cx0+cw+8,cy0+chh,COL.ink,2); arrowHead(ctx,cx0+cw+8,cy0+chh,0,COL.ink,7);
    line(ctx,cx0,cy0+chh,cx0,cy0-6,COL.ink,2); arrowHead(ctx,cx0,cy0-6,-Math.PI/2,COL.ink,7);
    textAt(ctx,'S/S_max',cx0+6,cy0-8,{size:11,weight:700}); textAt(ctx,'time',cx0+cw,cy0+chh+18,{align:'right',size:11,weight:700});
    line(ctx,cx0,cy0,cx0+cw,cy0,COL.mid,1.2,[4,4]);
    if(hist.length>1){ ctx.save(); ctx.beginPath(); hist.forEach((v,i)=>{ const x=cx0+cw*i/160, y=cy0+chh-chh*clamp(v,0,1.02); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); });
      ctx.strokeStyle=COL.green; ctx.lineWidth=3; ctx.stroke();
      ctx.lineTo(cx0+cw*(hist.length-1)/160,cy0+chh); ctx.lineTo(cx0,cy0+chh); ctx.closePath(); ctx.fillStyle='rgba(31,157,85,0.12)'; ctx.fill(); ctx.restore();
      const li=hist.length-1; circ(ctx,cx0+cw*li/160,cy0+chh-chh*clamp(hist[li],0,1.02),5.5,COL.ink,COL.yellow,2); }
    chip(ctx,cx0+cw-4,cy0+chh*0.25,'ΔH = 0  ·  isolated',COL.mid,'right');

    $('#sV').textContent=Math.round(clamp(Sd,0,1)*100)+' %';
    $('#lV').textContent=Math.round(pl*100)+' % A';
    $('#cV').textContent='1 in '+sciK(Math.pow(2,N));
  });
  return wrap;
}

/* =====================================================================
   5.11 GIBBS ENERGY, SPONTANEITY AND K   (Section 5.6 c, 5.7, Table 5.4)
   ΔG = ΔH − TΔS        ΔG° = −RT ln K
   ΔG < 0 spontaneous · ΔG > 0 non-spontaneous · ΔG = 0 equilibrium.
   Marbles hop between the reactant and product bowls with rates that obey
   detailed balance:  k(R→P)/k(P→R) = K = e^(−ΔG/RT), so the populations settle at
   n(P)/n(R) = K — equilibrium is a dynamic balance, not a standstill.
   CHECK (Problem 5.13): ΔG° = −13.6 kJ/mol at 298 K  →  K = 2.4 × 10²
         (Problem 5.12):  ΔG° = +163 kJ/mol at 298 K  →  K ≈ 2.5 × 10⁻²⁹
   Table 5.4 is the four sign-combinations of ΔH and ΔS (presets below).
   ===================================================================== */
function buildA11(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>ΔH <span class="val" id="hV"></span></label>
      <input type="range" id="hR" min="-400" max="400" step="1" value="-100"></div>
    <div class="control-group"><label>ΔS <span class="val" id="sV"></span></label>
      <input type="range" id="sR" min="-400" max="400" step="1" value="150"></div>
    <div class="control-group"><label>Temperature <span class="val" id="tV"></span></label>
      <input type="range" id="tR" min="100" max="1000" step="1" value="298"></div>
    <div class="control-group"><label style="margin-bottom:5px;">Table 5.4  (ΔH, ΔS)</label>
      <div class="toggle-group" id="prB">
        <button class="toggle-btn small" data-h="-100" data-s="150">− +</button>
        <button class="toggle-btn small" data-h="-100" data-s="-200">− −</button>
        <button class="toggle-btn small" data-h="100" data-s="200">+ +</button>
        <button class="toggle-btn small" data-h="100" data-s="-150">+ −</button></div>
      <div class="toggle-group" id="pr2" style="margin-top:6px;">
        <button class="toggle-btn small" data-h="-13.6" data-s="0" data-t="298">Prob. 5.13</button>
        <button class="toggle-btn small" data-h="163" data-s="0" data-t="298">Prob. 5.12</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel" style="text-transform:none">ΔG</div><div class="rval" id="gV">—</div></div>
      <div class="rcard"><div class="rlabel" style="text-transform:none">K</div><div class="rval" id="kV" style="color:var(--f-blue)">—</div></div>
      <div class="rcard wide"><div class="rlabel">Verdict</div><div class="rval" id="vV" style="font-size:var(--fs-sm)">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), hR=$('#hR'), sR=$('#sR'), tR=$('#tR');
  const Hd={x:-100}, Sd={x:150}, Td={x:298}, Gd={x:0};
  let t=0;
  wrap.querySelectorAll('#prB button, #pr2 button').forEach(b=>b.onclick=()=>{
    hR.min=-400; hR.value=b.dataset.h; sR.value=b.dataset.s; if(b.dataset.t) tR.value=b.dataset.t; });
  hR.step=0.1; hR.value=-100;      // allow the textbook's −13.6 kJ

  /* marbles */
  const M=60, marbles=[]; const listR=[], listP=[];
  for(let i=0;i<M;i++){ marbles.push({id:i,loc:'R',x:0,y:0,fly:null,placed:false}); listR.push(marbles[i]); }
  const slot=(k,cx,floorY,fw)=>{ const rad=5.2, per=Math.max(6,Math.floor(fw/(rad*2.1))); let row=0,idx=k,cap=per; while(idx>=cap){ idx-=cap; row++; cap=Math.max(3,per-row); }
    return [cx+(idx-(cap-1)/2)*rad*2.1, floorY-rad-1-row*rad*1.8]; };

  animLoop((dt)=>{
    t+=dt;
    const Hs=parseFloat(hR.value), Ss=parseFloat(sR.value), Ts=parseFloat(tR.value);
    $('#hV').textContent=fmt(Hs,1)+' kJ/mol'; $('#sV').textContent=fmt(Ss,0)+' J/K·mol'; $('#tV').textContent=Ts+' K';
    Hd.x=approach(Hd.x,Hs,7,dt); Sd.x=approach(Sd.x,Ss,7,dt); Td.x=approach(Td.x,Ts,7,dt);
    const dH=Hd.x, dS=Sd.x, T=Td.x;
    const TdS=T*dS/1000, dG=dH-TdS;
    Gd.x=approach(Gd.x,dG,9,dt);
    const lnK=-dG*1000/(R_GAS*T), K=Math.exp(clamp(lnK,-700,700));

    /* ---------- marble hopping (detailed balance) ---------- */
    const r=2.6, pRP=r*K/(1+K), pPR=r/(1+K);
    marbles.forEach(m=>{ if(m.fly) return;
      if(m.loc==='R' && Math.random()<pRP*dt){ listR.splice(listR.indexOf(m),1); listP.push(m); m.loc='P'; m.fly={u:0,x0:m.x,y0:m.y}; }
      else if(m.loc==='P' && Math.random()<pPR*dt){ listP.splice(listP.indexOf(m),1); listR.push(m); m.loc='R'; m.fly={u:0,x0:m.x,y0:m.y}; } });

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    /* ---------- bowls ---------- */
    const bwid=Math.min(w*0.2,200), fw=bwid*0.8, cxR=w*0.15, cxP=w*0.38, yR=h*0.50;
    const off=70*Math.tanh(-Gd.x/45), yP=yR+off;
    const bowl=(cx,fy,col,lab)=>{
      const hh=104;
      ctx.save(); ctx.beginPath(); ctx.moveTo(cx-bwid/2,fy-hh); ctx.quadraticCurveTo(cx-bwid/2,fy,cx-fw/2,fy); ctx.lineTo(cx+fw/2,fy); ctx.quadraticCurveTo(cx+bwid/2,fy,cx+bwid/2,fy-hh);
      ctx.strokeStyle=col; ctx.lineWidth=4; ctx.lineCap='round'; ctx.stroke(); ctx.restore();
      textAt(ctx,lab,cx,fy+26,{align:'center',size:13,weight:700,color:col});
    };
    // level guides + ΔG dimension
    line(ctx,cxR,yR,cxP+bwid/2+22,yR,COL.mid,1.2,[5,5]); line(ctx,cxP,yP,cxP+bwid/2+22,yP,COL.mid,1.2,[5,5]);
    const gxA=cxP+bwid/2+16; if(Math.abs(yP-yR)>6){ dimArrow(ctx,gxA,yR,yP); }
    chip(ctx,gxA+10,(yR+yP)/2+4,'ΔG = '+sgn(Gd.x,1),Gd.x<-0.5?COL.green:(Gd.x>0.5?COL.red:COL.mid),'left');
    bowl(cxR,yR,COL.ink,'reactants'); bowl(cxP,yP,COL.green,'products');
    // marbles
    marbles.forEach(m=>{
      const list=m.loc==='R'?listR:listP, k=list.indexOf(m), cx=m.loc==='R'?cxR:cxP, fy=m.loc==='R'?yR:yP;
      const s=slot(k,cx,fy,fw);
      if(!m.placed){ m.x=s[0]; m.y=s[1]; m.placed=true; }
      if(m.fly){ m.fly.u+=dt/0.75; const u=Math.min(1,m.fly.u), e=u*u*(3-2*u);
        const apex=Math.min(yR,yP)-130; m.x=lerp(m.fly.x0,s[0],e); m.y=lerp(m.fly.y0,s[1],e)-Math.sin(u*Math.PI)*(Math.abs(apex-Math.min(m.fly.y0,s[1]))*0.8+16);
        if(u>=1) m.fly=null; }
      else { m.x=approach(m.x,s[0],14,dt); m.y=approach(m.y,s[1],14,dt); }
      circ(ctx,m.x,m.y,5.2,m.loc==='P'?COL.green:COL.ink,m.loc==='P'?'#e4f7ec':'#e3e8ef',2);
    });
    const nP=listP.length;
    textAt(ctx,Math.round(100*(M-nP)/M)+' %',cxR,yR+44,{align:'center',size:12,weight:600,color:COL.muted});
    textAt(ctx,Math.round(100*nP/M)+' %',cxP,yP+44,{align:'center',size:12,weight:600,color:COL.muted});
    textAt(ctx,'R ⇌ P',w*0.28,h*0.14,{align:'center',size:15,weight:700});

    /* ---------- ΔG = ΔH − TΔS bars ---------- */
    const gx=w*0.56, gw=w*0.38, zx=gx+gw/2, sc=gw/1700, by=h*0.10;
    textAt(ctx,'ΔG = ΔH − TΔS  (kJ/mol)',gx,by-6,{size:11,weight:700,color:COL.mid});
    line(ctx,zx,by+4,zx,by+130,COL.ink,2);
    const rows=[['ΔH',0,dH,COL.red],['−TΔS',dH,dH-TdS,COL.yellow],['ΔG',0,Gd.x,Gd.x<0?COL.green:COL.mid]];
    rows.forEach(([n,a,b,c],i)=>{ const y=by+14+i*40; textAt(ctx,n,gx-6,y+15,{align:'right',size:12,weight:700,color:c===COL.mid?COL.ink:c});
      const x1=zx+Math.min(a,b)*sc, x2=zx+Math.max(a,b)*sc; rect(ctx,x1,y,Math.max(1,x2-x1),22,c,c,0);
      textAt(ctx,sgn(b-a,1),b>=a?x2+6:x1-6,y+16,{align:b>=a?'left':'right',size:12,weight:700,color:c===COL.mid?COL.ink:c}); });
    line(ctx,zx+dH*sc,by+36,zx+dH*sc,by+54,COL.mid,1.2,[3,3]);

    /* ---------- ΔG against T ---------- */
    const px=w*0.60, py=h*0.58, pw=w*0.34, ph=h*0.30, Tmax=1000, Gmax=600;
    const X=T_=>px+pw*T_/Tmax, Y=G_=>py+ph/2-ph/2*clamp(G_/Gmax,-1.05,1.05);
    ctx.save(); ctx.fillStyle='rgba(31,157,85,0.07)'; ctx.fillRect(px,Y(0),pw,py+ph-Y(0)); ctx.fillStyle='rgba(217,67,43,0.05)'; ctx.fillRect(px,py,pw,Y(0)-py); ctx.restore();
    line(ctx,px,py+ph/2,px+pw+8,py+ph/2,COL.ink,2); arrowHead(ctx,px+pw+8,py+ph/2,0,COL.ink,7);
    line(ctx,px,py+ph,px,py-6,COL.ink,2); arrowHead(ctx,px,py-6,-Math.PI/2,COL.ink,7);
    textAt(ctx,'ΔG (kJ)',px+4,py-12,{size:11,weight:700}); textAt(ctx,'T (K)',px+pw,py+ph/2+30,{align:'right',size:11,weight:700});
    [250,500,750,1000].forEach(v=>{ line(ctx,X(v),py+ph/2,X(v),py+ph/2+5,COL.ink,1.4); textAt(ctx,String(v),X(v),py+ph/2+18,{align:'center',size:10,weight:600,color:COL.muted}); });
    textAt(ctx,'spontaneous',px+pw-4,py+ph-6,{align:'right',size:11,weight:700,color:COL.green}); textAt(ctx,'non-spontaneous',px+pw-4,py+14,{align:'right',size:11,weight:700,color:COL.red});
    ctx.save(); ctx.beginPath(); ctx.rect(px,py,pw,ph); ctx.clip(); ctx.strokeStyle=COL.blue; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(X(0),Y(dH)); ctx.lineTo(X(Tmax),Y(dH-Tmax*dS/1000)); ctx.stroke(); ctx.restore();
    if(Math.abs(dS)>5){ const Tx=dH*1000/dS; if(Tx>0&&Tx<Tmax){ line(ctx,X(Tx),py+ph/2-12,X(Tx),py+ph/2+12,COL.ink,2); textAt(ctx,'T = '+Math.round(Tx)+' K',X(Tx),py+ph/2-18,{align:'center',size:11,weight:700}); } }
    circ(ctx,X(T),Y(dG),7,COL.ink,COL.yellow,2.4);

    // verdict (Table 5.4)
    const tab0=dH<0&&dS>0?'spontaneous at all T':dH<0&&dS<0?'spontaneous at low T':dH>0&&dS>0?'spontaneous at high T':dH>0&&dS<0?'non-spontaneous at all T':'—';
    const tab2=Math.abs(dS)<0.5?(dH<0?'spontaneous at all T':dH>0?'non-spontaneous at all T':'equilibrium'):tab0;
    textAt(ctx,'ΔH '+(dH<0?'−':'+')+'  ΔS '+(Math.abs(dS)<0.5?'0':dS<0?'−':'+')+'  →  '+tab2,gx+gw/2,h*0.95,{align:'center',size:12,weight:700,color:COL.muted});

    const eq=Math.abs(dG)<0.5;
    $('#gV').textContent=sgn(dG,1)+' kJ'; $('#gV').style.color=dG<-0.5?'var(--f-green)':dG>0.5?'var(--f-red)':'var(--text-1)';
    $('#kV').textContent=sciK(K);
    $('#vV').textContent=eq?'Equilibrium  (ΔG ≈ 0)':dG<0?'Spontaneous — products favoured':'Non-spontaneous — reactants favoured';
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const activities = [
  { num:'5.1',  title:'System & Boundary',    desc:'Open · closed · isolated',                 build: buildA1 },
  { num:'5.2',  title:'Joule: Work or Heat',  desc:'Different routes · same ΔU',               build: buildA2 },
  { num:'5.3',  title:'Compressing a Gas',    desc:'Work = area under the pV curve',           build: buildA3 },
  { num:'5.4',  title:'Expanding a Gas',      desc:'Vacuum · constant pex · reversible',       build: buildA4 },
  { num:'5.5',  title:'Bomb Calorimeter',     desc:'Burn it · read ΔT · find ΔU',              build: buildA5 },
  { num:'5.6',  title:'Heating Water',        desc:'Fusion · vaporisation · ΔH vs ΔU',         build: buildA6 },
  { num:'5.7',  title:"Hess's Law",           desc:'Enthalpy is a state function',             build: buildA7 },
  { num:'5.8',  title:'Bond Enthalpy',        desc:'Break bonds · make bonds',                 build: buildA8 },
  { num:'5.9',  title:'Born–Haber Cycle',     desc:'Build NaCl, step by step',                 build: buildA9 },
  { num:'5.10', title:'Mixing Gases',         desc:'Entropy grows · it never un-mixes',        build: buildA10 },
  { num:'5.11', title:'Gibbs Energy',         desc:'ΔG = ΔH − TΔS · K',                        build: buildA11 },
];
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
</script>
