<!DOCTYPE html>

<head>

<title>Grade 11 · Physics Part 2 · Chapter 3 — Thermal Properties of Matter | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
/* compact side column so every control + result stays in view */
.lab-side{gap:8px;}
.control-group{padding:7px 11px;}
.control-group input[type=range]{margin-top:3px;}
.result-cards{gap:5px;}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.toggle-btn.red{background:var(--f-red); border-color:var(--f-red); color:#fff;}
.toggle-btn.row{flex:0 0 auto; width:100%; padding:10px; margin-top:0;}
.btn-row{display:flex; gap:6px;}
.btn-row .toggle-btn{flex:1;}
.rcard .rval.sm{font-size:var(--fs-sm);}
.nav-item .n-num{min-width:22px;}

<script>
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}
/* ---------------------------------------------------------------------
   0b. SMALL UTILITIES — seeded random, smoothing, angles
   --------------------------------------------------------------------- */
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function lw(k,base){ return clamp(k*base,1,3); }

/* ---------------------------------------------------------------------
   0c. THERMAL HELPERS — controls kit, thermometer, burner, graphs
   --------------------------------------------------------------------- */
const SIGMA = 5.67e-8, RGAS = 8.31, P0 = 1.013e5;
const FL_BLUE = 'rgba(47,143,224,0.17)';
const SQ = Math.sqrt;

function slider(id,label,min,max,step,val){
  return `<div class="control-group" id="g_${id}"><label>${label} <span class="val" id="${id}V"></span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}
function group(label,inner,id){ return `<div class="control-group"${id?` id="${id}"`:''}><label>${label}</label>${inner}</div>`; }
function seg(id,items,active){
  return `<div class="toggle-group" id="${id}">`+items.map((it,i)=>`<button class="toggle-btn small${i===active?' active':''}" data-v="${it[0]}">${it[1]}</button>`).join('')+`</div>`;
}
function cards(arr,cls){
  return `<div class="control-group"><div class="result-cards ${cls||''}">`+arr.map(c=>
    `<div class="rcard${c.wide?' wide':''}"><div class="rlabel">${c.l}</div><div class="rval" id="${c.id}" style="${c.col?'color:'+c.col:''}">—</div></div>`).join('')+`</div></div>`;
}
function hintBox(t){ return `<p class="hint" style="margin:0 2px;">${t}</p>`; }
function wireSeg(wrap,id,cb){
  const g=wrap.querySelector('#'+id), btns=[...g.querySelectorAll('button')];
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b.dataset.v); });
  return { set(v){ btns.forEach(x=>x.classList.toggle('active',x.dataset.v===String(v))); } };
}
function kit(wrap){
  const $=s=>wrap.querySelector(s);
  return {
    $,
    v:id=>+$('#'+id).value,
    put:(id,t)=>{ const e=$('#'+id); if(e) e.textContent=t; },
    setSlider:(id,val)=>{ $('#'+id).value=val; },
    show:(id,on)=>{ const e=$('#g_'+id)||$('#'+id); if(e) e.classList.toggle('hidden',!on); },
  };
}
function smoothstep(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }

/* liquid with a wavy surface, clipped to any container path */
function liquid(ctx,pathFn,x0,x1,yS,yB,t,amp,fill,stroke){
  ctx.save(); pathFn(); ctx.clip();
  const wav=x=>yS+Math.sin(x*0.045+t*2.6)*amp;
  ctx.beginPath(); ctx.moveTo(x0,yB); ctx.lineTo(x0,wav(x0));
  for(let x=x0;x<=x1;x+=5) ctx.lineTo(x,wav(x));
  ctx.lineTo(x1,wav(x1)); ctx.lineTo(x1,yB); ctx.closePath();
  ctx.fillStyle=fill||FL_BLUE; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x0,wav(x0)); for(let x=x0;x<=x1;x+=5) ctx.lineTo(x,wav(x)); ctx.lineTo(x1,wav(x1));
  ctx.strokeStyle=stroke||COL.blue; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}
/* 270° analogue dial; frac 0..1 */
function dial(ctx,cx,cy,r,frac,maxLab,unit,valTxt,nt){
  const a0=0.75*Math.PI, sw=1.5*Math.PI; nt=nt||5;
  circ(ctx,cx,cy,r,COL.ink,'#fff',2.6);
  circ(ctx,cx,cy,r-6,COL.mid,null,1);
  for(let i=0;i<=nt;i++){
    const a=a0+sw*i/nt, c=Math.cos(a), s=Math.sin(a);
    line(ctx,cx+c*(r-6),cy+s*(r-6),cx+c*(r-15),cy+s*(r-15),COL.ink,2);
    textAt(ctx,fmt(maxLab*i/nt,maxLab<10?1:0),cx+c*(r-28),cy+s*(r-28)+4,{size:10,align:'center',color:COL.muted,weight:600});
  }
  const a=a0+sw*clamp(frac,0,1.04);
  line(ctx,cx,cy,cx+Math.cos(a)*(r-12),cy+Math.sin(a)*(r-12),COL.red,3);
  circ(ctx,cx,cy,5,COL.ink,COL.ink,1);
  textAt(ctx,unit,cx,cy+r*0.42,{size:11,align:'center',color:COL.muted,weight:600});
  textAt(ctx,valTxt,cx,cy+r+17,{size:13,align:'center',weight:700,color:COL.ink});
}
function pill(ctx,x,y,txt,col,align){
  ctx.save(); ctx.font='700 12px Poppins, sans-serif'; const tw=ctx.measureText(txt).width; ctx.restore();
  const bx=align==='right'?x-tw-10:align==='center'?x-tw/2-5:x;
  ctx.save(); rrect(ctx,bx,y-11,tw+10,22,6); ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
  textAt(ctx,txt,bx+5,y+4,{size:12,weight:700,color:col});
}
function axes(ctx,x0,y0,gw,gh,xl,yl){
  line(ctx,x0,y0,x0,y0-gh,COL.ink,2); line(ctx,x0,y0,x0+gw,y0,COL.ink,2);
  arrowHead(ctx,x0,y0-gh,-Math.PI/2,COL.ink,7); arrowHead(ctx,x0+gw,y0,0,COL.ink,7);
  textAt(ctx,yl,x0-8,y0-gh+6,{size:12,weight:700,align:'right',color:COL.blue});

}
function polyline(ctx,pts,color,lwid,dash){
  if(pts.length<2) return;
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lwid||2.6; ctx.lineJoin='round'; ctx.setLineDash(dash||[]);
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore();
}

/* temperature colour: cold blue → pale → orange → red */
function hotCol(T,lo,hi){ return rampCol([[0,'#2f8fe0'],[0.3,'#a9d8f5'],[0.5,'#f4e7c4'],[0.75,'#ec9a52'],[1,'#d9432b']], clamp((T-lo)/(hi-lo),0,1)); }
/* heated metal: grey → dull red → orange → yellow-white (T in °C) */
function glowCol(T){ return rampCol([[0,'#cfd8e3'],[150,'#d8c9bd'],[400,'#d98a6a'],[600,'#d9532b'],[800,'#f0902c'],[1000,'#f6d468'],[1400,'#fff4cc']], T); }

function thermo(ctx,x,top,bot,frac,outline,liq){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liq; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liq,liq,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  if(inten<=0.02) return;
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}
/* Bunsen-style burner: base on floorY, flame on top */
function burner(ctx,cx,floorY,width,inten,t){
  const bw=width*0.5;
  ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.fillStyle='#fff';
  rrect(ctx,cx-bw/2,floorY-12,bw,12,4); ctx.fill(); ctx.stroke();
  rrect(ctx,cx-4,floorY-34,8,22,2); ctx.fill(); ctx.stroke(); ctx.restore();
  flame(ctx,cx,floorY-34,width*0.9,inten,t);
}
function ice(ctx,x,y,s,rot,alpha){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.globalAlpha=alpha===undefined?1:alpha;
  rect(ctx,-s/2,-s/2,s,s,COL.blue,'rgba(169,216,245,0.45)',2);
  line(ctx,-s/2+3,-s/2+3,-s/2+s*0.35,-s/2+3,'#fff',2); line(ctx,-s/2+3,-s/2+3,-s/2+3,-s/2+s*0.35,'#fff',2);
  ctx.restore();
}
/* beaker outline (open top) */
function beakerPath(ctx,x,top,bot,bw){
  ctx.beginPath(); ctx.moveTo(x-bw/2,top); ctx.lineTo(x-bw/2,bot-6); ctx.quadraticCurveTo(x-bw/2,bot,x-bw/2+6,bot); ctx.lineTo(x+bw/2-6,bot); ctx.quadraticCurveTo(x+bw/2,bot,x+bw/2,bot-6); ctx.lineTo(x+bw/2,top);
}
function beakerStroke(ctx,x,top,bot,bw,col){
  ctx.save(); ctx.strokeStyle=col||COL.ink; ctx.lineWidth=3; ctx.lineJoin='round'; beakerPath(ctx,x,top,bot,bw); ctx.stroke(); ctx.restore();
}
function steamWisps(ctx,x,y,w,n,t,alpha){
  for(let i=0;i<n;i++){
    const ph=(t*0.5+i/n)%1, xx=x+(i/(n-1||1)-0.5)*w+Math.sin(t*2+i*2)*6, yy=y-ph*60;
    ctx.save(); ctx.globalAlpha=alpha*(1-ph); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.8; ctx.beginPath();
    ctx.moveTo(xx,yy+14); ctx.bezierCurveTo(xx-8,yy+7,xx+8,yy+2,xx,yy-4); ctx.stroke(); ctx.restore();
  }
}
/* Planck spectral radiance shape (relative), λ in metres */
function planck(lam,T){ const c2=1.4388e-2; return 1/(Math.pow(lam,5)*(Math.exp(c2/(lam*T))-1)); }
/* Water: Tanaka density (kg/m³), T in °C */
function rhoWater(T){ return 999.97495*(1-((T-3.983035)*(T-3.983035)*(T+301.797))/(522528.9*(T+69.34881))); }
/* Water saturation: Antoine, T in °C ↔ P in atm */
function psatWater(T){ return Math.pow(10,8.07131-1730.63/(233.426+T))/760; }
function tbWater(P){ return 1730.63/(8.07131-Math.log10(Math.max(1e-4,P)*760))-233.426; }
/* =====================================================================
   1. TEMPERATURE SCALES                 (§10.3, eq. 10.1, 10.3; Fig 10.1)
   t_F = 9/5 t_C + 32 ,  T = t_C + 273.15
   Check: 100 °C → 212 °F → 373.15 K ;  0 °C → 32 °F → 273.15 K
   ===================================================================== */
function buildA1(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    slider('bt','Bath temperature',-20,120,1,25) +
    group('Quick set', seg('pre',[['0','Ice'],['25','Room'],['37','Body'],['100','Boiling']],1)) +
    cards([{l:'Celsius',id:'c1',col:'var(--f-red)'},{l:'Fahrenheit',id:'c2',col:'var(--f-blue)'},{l:'Kelvin',id:'c3',col:'var(--f-green)',wide:true}]) +
    hintBox('t<sub>F</sub> = 9/5 t<sub>C</sub> + 32 &nbsp;·&nbsp; T = t<sub>C</sub> + 273.15');
  const canvas=$('canvas'); let t=0, bath=25, Tm=25; const bub=[], trail=[];
  wireSeg(wrap,'pre',v=>K.setSlider('bt',v));
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const tgt=K.v('bt'); bath=approach(bath,tgt,0.9,dt); Tm=approach(Tm,bath,1.5,dt);
    K.put('btV',fmt(tgt,0)+' °C');
    const C=Tm, F=C*9/5+32;
    K.put('c1',fmt(C,1)+' °C'); K.put('c2',fmt(F,1)+' °F'); K.put('c3',fmt(C+273.15,2)+' K');
    const sc=Math.min(w/760,h/520,1.5);
    const bx=w*0.26, bw=Math.min(w*0.3,250*sc), top=h*0.60, bot=h*0.90, floor=bot+14*sc;
    // thermometer geometry
    const tTop=h*0.07, tBot=h*0.78, TMIN=-30, TMAX=130;
    const yOf=T=>tBot-(T-TMIN)/(TMAX-TMIN)*(tBot-tTop-6);
    // heating / cooling
    const dir=clamp((tgt-bath)/30,-1,1);
    line(ctx,bx-bw*0.9,floor,bx+bw*0.9,floor,COL.ink,3);
    burner(ctx,bx,floor,bw*0.6,Math.max(0,dir),t);
    // water
    const wlev=top+(bot-top)*0.18;
    liquid(ctx,()=>{ctx.beginPath();ctx.rect(bx-bw/2,top,bw,bot-top);},bx-bw/2,bx+bw/2,wlev,bot,t,1.4,mixCol('#cfe8fb','#f4cdc3',(bath-30)/90),COL.blue);
    beakerStroke(ctx,bx,top-10,bot,bw);
    // ice cubes
    if(bath<3) for(let i=0;i<4;i++){ ice(ctx,bx-bw*0.32+i*bw*0.21+Math.sin(t*1.2+i)*3,wlev+4+Math.sin(t*1.7+i*2)*2.5,bw*0.17,Math.sin(t+i)*0.12); }
    // bubbles / steam
    if(bath>88 && Math.random()<0.5) bub.push({x:bx+(Math.random()-0.5)*bw*0.8,y:bot-8,r:2+Math.random()*3});
    for(let i=bub.length-1;i>=0;i--){ const b=bub[i]; b.y-=(70+b.r*12)*dt; b.x+=Math.sin(t*6+i)*0.4; circ(ctx,b.x,b.y,b.r,COL.blue,'rgba(255,255,255,0.7)',1.4); if(b.y<wlev) bub.splice(i,1); }
    if(bath>78) steamWisps(ctx,bx,wlev-6,bw*0.7,4,t,smoothstep(78,100,bath));
    // cooling arrows
    if(dir<-0.1){ for(let i=0;i<3;i++){ const ax=bx-bw*0.3+i*bw*0.3, ay=top-70+((t*50+i*30)%50); vec(ctx,ax,ay,ax,ay+26,COL.blue,2.6); } }
    // thermometer in the bath
    const tx=bx+bw*0.18, tw=14*sc+6;
    ctx.save(); ctx.lineWidth=2.6; ctx.strokeStyle=COL.ink; ctx.fillStyle='rgba(255,255,255,0.92)';
    rrect(ctx,tx-tw/2,tTop,tw,tBot-tTop+4,tw/2); ctx.fill(); ctx.stroke(); ctx.restore();
    circ(ctx,tx,tBot+16*sc+8,13*sc+6,COL.ink,'#fff',2.6);
    ctx.save(); ctx.fillStyle=COL.red; ctx.fillRect(tx-2.6,yOf(C),5.2,tBot+10-yOf(C)+8*sc); ctx.restore();
    circ(ctx,tx,tBot+16*sc+8,9*sc+3,COL.red,COL.red,1);
    for(let T=TMIN;T<=TMAX;T+=10){ const yy=yOf(T), big=T%20===0; line(ctx,tx-tw/2,yy,tx-tw/2-(big?11:6),yy,COL.red,big?2:1.2); if(big) textAt(ctx,T+'',tx-tw/2-15,yy+4,{size:11,align:'right',weight:700,color:COL.red}); }
    for(let Fv=-20;Fv<=260;Fv+=20){ const yy=yOf((Fv-32)*5/9); if(yy<tTop||yy>tBot) continue; const big=Fv%40===0; line(ctx,tx+tw/2,yy,tx+tw/2+(big?11:6),yy,COL.blue,big?2:1.2); if(big) textAt(ctx,Fv+'',tx+tw/2+15,yy+4,{size:11,weight:700,color:COL.blue}); }
    textAt(ctx,'°C',tx-tw/2-15,tTop-8,{size:13,weight:700,align:'right',color:COL.red}); textAt(ctx,'°F',tx+tw/2+15,tTop-8,{size:13,weight:700,color:COL.blue});
    // fixed points
    [[0,'ice point'],[100,'steam point']].forEach(([T,n])=>{ line(ctx,tx-tw/2-44,yOf(T),tx+tw/2+44,yOf(T),COL.yellow,1.4,[5,4]); textAt(ctx,n,tx+tw/2+68,yOf(T)-5,{size:10.5,weight:600,color:COL.yellow}); });
    // graph t_F vs t_C
    const gx=w*0.60, gy=h*0.80, gw=w*0.34, gh=h*0.62;
    axes(ctx,gx,gy,gw,gh,'t꜀ (°C)','t_F (°F)');
    const GX=c=>gx+(c-TMIN)/(TMAX-TMIN)*gw, GY=f=>gy-(f+22)/(266+22)*gh;
    polyline(ctx,[[GX(TMIN),GY(TMIN*9/5+32)],[GX(TMAX),GY(TMAX*9/5+32)]],COL.blue,3);
    [[0,32],[100,212]].forEach(([c,f])=>{ line(ctx,GX(c),gy,GX(c),GY(f),COL.mid,1.2,[4,4]); line(ctx,gx,GY(f),GX(c),GY(f),COL.mid,1.2,[4,4]); circ(ctx,GX(c),GY(f),4,COL.yellow,COL.yellow,1); textAt(ctx,c+'°C = '+f+'°F',GX(c)+8,GY(f)+(c?-8:16),{size:11,weight:700,color:COL.muted}); });
    line(ctx,GX(C),gy,GX(C),GY(F),COL.red,1.8); line(ctx,gx,GY(F),GX(C),GY(F),COL.blue,1.8);
    circ(ctx,GX(C),GY(F),7,COL.red,COL.red,1);
  });
  return wrap;
}

/* =====================================================================
   2. GAS THERMOMETER & ABSOLUTE ZERO    (§10.4, eq. 10.2; Fig 10.2–10.4)
   PV = μRT ,  R = 8.31 J mol⁻¹ K⁻¹ ,  μ = 1 mol
   Check: T = 300 K , V = 24.6 L → P ≈ 1 atm ; P→0 at t_C = −273.15 °C
   ===================================================================== */
function buildA2(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Keep fixed', seg('md',[['V','Volume'],['P','Pressure'],['T','Temperature']],0)) +
    slider('T','Temperature',100,600,5,300) + slider('V','Volume',8,50,0.5,25) +
    cards([{l:'Pressure',id:'c1',col:'var(--f-red)'},{l:'Volume',id:'c2',col:'var(--f-blue)'},{l:'Temperature',id:'c3',col:'var(--f-yellow)'},{l:'PV ÷ T',id:'c4',col:'var(--f-green)'}]) +
    hintBox('PV = μRT &nbsp;·&nbsp; μ = 1 mol &nbsp;·&nbsp; R = 8.31 J mol⁻¹K⁻¹');
  const canvas=$('canvas'); let t=0, mode='V', Tc=300, Vc=25, Vprev=25, trail=[], lastPt=null;
  const N=44, P=[]; const rnd=rng(7);
  for(let i=0;i<N;i++){ const a=rnd()*6.28; P.push({x:rnd(),d:rnd()*200+10,vx:Math.cos(a),vy:Math.sin(a),hit:0}); }
  wireSeg(wrap,'md',v=>{ mode=v; trail=[]; lastPt=null; $('#V').disabled=(v==='P'); });
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const sc=Math.min(w/820,h/520,1.5);
    const Tset=K.v('T'), Vset=K.v('V');
    Tc=approach(Tc,Tset,2.5,dt);
    let Vtgt=Vset; if(mode==='P'){ Vtgt=clamp(RGAS*Tc/P0*1000,8,50); K.setSlider('V',Vtgt); }
    Vprev=Vc; Vc=approach(Vc,Vtgt,mode==='P'?3:5,dt);
    const pa=RGAS*Tc/(Vc/1000), patm=pa/P0;
    K.put('TV',fmt(Tset,0)+' K ('+fmt(Tset-273.15,0)+' °C)'); K.put('VV',fmt(mode==='P'?Vtgt:Vset,1)+' L');
    K.put('c1',fmt(patm,2)+' atm'); K.put('c2',fmt(Vc,1)+' L'); K.put('c3',fmt(Tc,0)+' K'); K.put('c4',fmt(pa*Vc/1000/Tc,2)+' J/K');
    // cylinder
    const cw=Math.min(w*0.26,230*sc), cx=w*0.22, yb=h*0.82, ytop=h*0.14, Hpx=yb-ytop;
    const hv=Hpx*Vc/50, yp=yb-hv, pv=(Vc-Vprev)/Math.max(dt,1e-3)/50*Hpx;
    const xl=cx-cw/2+6, xr=cx+cw/2-6;
    // burner
    line(ctx,cx-cw*0.8,yb+30*sc,cx+cw*0.8,yb+30*sc,COL.ink,3);
    burner(ctx,cx,yb+30*sc,cw*0.55,clamp((Tc-100)/500,0,1)*1.0,t);
    // gas particles
    const v0=(120+160*SQ(Tc/300))*sc;
    let hits=0;
    P.forEach(p=>{
      const sp=Math.hypot(p.vx,p.vy)||1; p.vx=p.vx/sp; p.vy=p.vy/sp;
      let x=xl+p.x*(xr-xl); x+=p.vx*v0*dt; p.d+=p.vy*v0*dt;
      if(x<xl+4){x=xl+4;p.vx=Math.abs(p.vx);} if(x>xr-4){x=xr-4;p.vx=-Math.abs(p.vx);}
      if(p.d<4){p.d=4;p.vy=Math.abs(p.vy);}
      if(p.d>hv-4){ p.d=hv-4; if(p.vy>0){ p.vy=-Math.abs(p.vy); p.hit=1; hits++; } }
      p.x=(x-xl)/(xr-xl); p.hit=Math.max(0,p.hit-dt*5);
    });
    // glass body
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3.2; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(cx-cw/2,ytop-10); ctx.lineTo(cx-cw/2,yb); ctx.lineTo(cx+cw/2,yb); ctx.lineTo(cx+cw/2,ytop-10); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.fillStyle=hotCol(Tc,100,600); ctx.globalAlpha=0.13; ctx.fillRect(cx-cw/2+2,yp,cw-4,hv); ctx.restore();
    P.forEach(p=>{ const px=xl+p.x*(xr-xl), py=yb-p.d; circ(ctx,px,py,5*sc+1.5,COL.ink,hotCol(Tc,100,600),1.6); if(p.hit>0) circ(ctx,px,yp,9*p.hit+5,COL.red,null,1.8); });
    // piston
    ctx.save(); rrect(ctx,cx-cw/2+3,yp-14,cw-6,14,3); ctx.fillStyle='#e3ecf7'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
    line(ctx,cx,yp-14,cx,Math.min(yp-14,ytop-20)-8,COL.ink,5);
    const hy=Math.min(yp-14,ytop-20)-8;
    if(mode==='P'){ for(let i=0;i<2;i++){ const wy=hy-(i+1)*20; rect(ctx,cx-34,wy,68,18,COL.ink,'#cfd8e3',2.4); if(!i) textAt(ctx,'1 atm',cx,wy+13,{size:11,align:'center',weight:700,color:COL.red}); } }
    else if(mode==='V'){ [-1,1].forEach(s=>{ rect(ctx,cx+s*(cw/2)-(s>0?0:8),yp-18,8,22,COL.red,COL.red,1.2); }); rect(ctx,cx-26,hy-8,52,10,COL.ink,'#cfd8e3',2.4); textAt(ctx,'locked',cx,hy-14,{size:11,align:'center',weight:700,color:COL.red}); }
    else { rect(ctx,cx-26,hy-8,52,10,COL.ink,'#cfd8e3',2.4); const mv=clamp(pv/40,-1,1); if(Math.abs(mv)>0.05) vec(ctx,cx+44,hy-3,cx+44,hy-3+mv*34,COL.blue,3.4); textAt(ctx,'push / pull',cx,hy-18,{size:11,align:'center',weight:700,color:COL.blue}); }
    // pressure arrows on piston
    const pl=clamp(patm/3,0.05,1)*46; vec(ctx,cx+cw/2+22,yp+4-pl,cx+cw/2+22,yp+4,COL.red,3.4);
    // dial
    dial(ctx,(cx+cw/2+w*0.58)/2,h*0.3,Math.min(52*sc+6,h*0.12),patm/3,3,'atm',fmt(patm,2)+' atm',6);
    // graph
    const gx=w*0.58, gy=h*0.80, gw=w*0.37, gh=h*0.62;
    let GX,GY,xl_,yl_;
    if(mode==='T'){
      const Pmax=RGAS*Tset/(8/1000)/P0*1.12;
      GX=v=>gx+gw*v/55; GY=p=>gy-gh*p/Pmax; xl_='V (L)'; yl_='P (atm)';
      axes(ctx,gx,gy,gw,gh,xl_,yl_);
      const pts=[]; for(let v=8;v<=50;v+=1) pts.push([GX(v),GY(RGAS*Tset/(v/1000)/P0)]);
      polyline(ctx,pts,COL.green,3);
      trail.forEach(q=>circ(ctx,GX(q[0]),GY(q[1]),2.6,COL.blue,COL.blue,1));
      circ(ctx,GX(Vc),GY(patm),7,COL.red,COL.red,1);
      pill(ctx,gx+gw,gy-gh+8,'PV = constant','#1f9d55','right');
      if(!lastPt||Math.hypot(lastPt[0]-Vc,lastPt[1]-patm)>0.6){ trail.push([Vc,patm]); lastPt=[Vc,patm]; if(trail.length>40) trail.shift(); }
    } else {
      const isP=mode==='V';
      const ymax=isP? RGAS*600/((Vset)/1000)/P0*1.1 : 60;
      GX=c=>gx+gw*(c+300)/650; GY=y=>gy-gh*y/ymax; xl_='t (°C)'; yl_=isP?'P (atm)':'V (L)';
      axes(ctx,gx,gy,gw,gh,xl_,yl_);
      const f=c=>isP? RGAS*(c+273.15)/(Vset/1000)/P0 : RGAS*(c+273.15)/P0*1000;
      line(ctx,GX(-273.15),gy,GX(-273.15),gy-gh,COL.mid,1.2,[4,5]);

/* =====================================================================

/* =====================================================================
   4. ANOMALOUS WATER — A LAKE FREEZES FROM THE TOP   (§10.5, Fig 10.7)
   Water is densest at 4 °C. Surface cools → sinks (convection) until the
   whole lake is at 4 °C; colder water is lighter, stays on top and freezes.
   Density: Tanaka formula (ρ = 999.97 kg m⁻³ at 3.98 °C).
   ===================================================================== */
function buildA4(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    slider('ta','Air temperature',-15,25,1,18) +
    group('Time speed', seg('sp',[['1','×1'],['3','×3'],['8','×8']],1)) +
    `<div class="btn-row"><button class="toggle-btn play" id="warm">☀ Warm lake 18 °C</button><button class="toggle-btn" id="cold">❄ Cold lake 8 °C</button></div>` +
    cards([{l:'Surface',id:'c1',col:'var(--f-red)'},{l:'Bottom',id:'c2',col:'var(--f-blue)'},{l:'Ice thickness',id:'c3',col:'var(--f-green)',wide:true}]) +
    hintBox('Densest at 4 °C · colder water floats');
  const canvas=$('canvas'); let t=0, speed=3, flow=0, ice=0;
  const N=10; let T=Array(N).fill(18), D=T.slice();
  const flakes=[]; for(let i=0;i<30;i++) flakes.push({x:Math.random(),y:Math.random(),s:0.4+Math.random()});
  const dots=[]; const rnd=rng(11); for(let i=0;i<46;i++) dots.push({x:rnd(),y:rnd(),ph:rnd()*6});
  wireSeg(wrap,'sp',v=>speed=+v);
  const reset=T0=>{ T=Array(N).fill(T0); D=T.slice(); ice=0; flow=0; };
  $('#warm').onclick=()=>reset(18); $('#cold').onclick=()=>reset(8);
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const ta=K.v('ta'); K.put('taV',fmt(ta,0)+' °C');
    const hs=dt*speed/5; let fl=0;
    for(let s=0;s<5;s++){
      if(ice<=0.05){ T[0]+=(ta-T[0])*0.16*hs*5; if(T[0]<0){ T[0]=0; if(ta<0) ice+=0.0; } }
      else { T[0]+=(0-T[0])*0.5*hs*5; }
      if(ta<0 && T[0]<=0.15) ice=Math.min(40,ice+0.03*(-ta)/(1+0.2*ice)*hs*5);
      if(ta>0 && ice>0) ice=Math.max(0,ice-0.05*ta*hs*5*0.2);
      for(let i=0;i<N-1;i++){ const f=0.05*(T[i+1]-T[i])*hs*5; T[i]+=f; T[i+1]-=f; }
      T[N-1]+=0;

    K.put('c1',fmt(T[0],1)+' °C'); K.put('c2',fmt(T[N-1],1)+' °C'); K.put('c3',ice>0.1?fmt(ice,1)+' cm':'no ice');
    const sc=Math.min(w/820,h/520,1.5);
    const lx=w*0.1, lw=w*0.42, ly=h*0.26, lh=h*0.56, lay=lh/N;
    // sky
    if(ta>=5){ circ(ctx,lx+lw*0.86,h*0.12,16*sc+4,COL.yellow,'rgba(217,160,23,0.25)',2.4); for(let i=0;i<8;i++){ const a=i*Math.PI/4+t*0.4; line(ctx,lx+lw*0.86+Math.cos(a)*(22*sc+6),h*0.12+Math.sin(a)*(22*sc+6),lx+lw*0.86+Math.cos(a)*(30*sc+8),h*0.12+Math.sin(a)*(30*sc+8),COL.yellow,2); } }
    if(ta<0){ flakes.forEach(f=>{ f.y+=dt*0.12*f.s; if(f.y>1) f.y=0; const fx=lx+f.x*lw+Math.sin(t*1.5+f.x*9)*6, fy=h*0.04+f.y*(ly-h*0.08); for(let k=0;k<3;k++){ const a=k*Math.PI/3; line(ctx,fx-Math.cos(a)*4,fy-Math.sin(a)*4,fx+Math.cos(a)*4,fy+Math.sin(a)*4,COL.blue,1.4); } }); }
    textAt(ctx,'Air  '+fmt(ta,0)+' °C',lx+lw*0.02,h*0.075,{size:14,weight:700,color:ta<0?COL.blue:COL.red});
    // lake layers
    for(let i=0;i<N;i++){ const y=ly+i*lay; ctx.save(); ctx.fillStyle=hotCol(D[i],-1,20); ctx.globalAlpha=0.55; ctx.fillRect(lx,y,lw,lay+0.6); ctx.restore(); textAt(ctx,fmt(D[i],1)+'°',lx-8,y+lay*0.62,{size:11,weight:700,align:'right',color:D[i]<4.2?COL.blue:COL.red}); line(ctx,lx,y,lx+lw,y,'rgba(19,42,68,0.12)',1); }
    // convection dots
    dots.forEach((d,i)=>{ const zoneTop=0, vy=flow*0.22*(d.x<0.5?1:-1); d.y+=vy*dt; if(d.y>1) d.y=0; if(d.y<0) d.y=1; const dx=lx+d.x*lw+Math.sin(t*2+d.ph)*3*flow, dy=ly+d.y*lh; ctx.save(); ctx.globalAlpha=0.25+0.6*flow; circ(ctx,dx,dy,2.6,d.x<0.5?COL.blue:COL.red,d.x<0.5?COL.blue:COL.red,1); ctx.restore(); });
    if(flow>0.12) { vec(ctx,lx+lw*0.25,ly+lh*0.18,lx+lw*0.25,ly+lh*0.7,COL.blue,3.4); vec(ctx,lx+lw*0.75,ly+lh*0.7,lx+lw*0.75,ly+lh*0.18,COL.red,3.4); }
    // basin walls
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(lx,ly-6); ctx.lineTo(lx,ly+lh); ctx.lineTo(lx+lw,ly+lh); ctx.lineTo(lx+lw,ly-6); ctx.stroke(); ctx.restore();
    // ice sheet

    ctx.save(); ctx.translate(fx,fy); ctx.scale(dir,1); ctx.strokeStyle=COL.green; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.beginPath(); ctx.ellipse(0,0,15*sc+3,7*sc+2,0,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-14*sc-3,0); ctx.lineTo(-24*sc-4,-8*sc-2+Math.sin(t*8)*3); ctx.lineTo(-24*sc-4,8*sc+2+Math.sin(t*8)*3); ctx.closePath(); ctx.stroke(); circ(ctx,8*sc+2,-1.5,1.8,COL.green,COL.green,1); ctx.restore();

    for(let v=0;v<=12;v+=4) { line(ctx,GX(v),gy,GX(v),gy+5,COL.ink,1.6); textAt(ctx,v+'',GX(v),gy+17,{size:10.5,align:'center',weight:600,color:COL.muted}); }
    for(let i=0;i<N;i++){ const v=clamp(D[i],0,12); circ(ctx,GX(v),GY(rhoWater(v)),4.5,COL.ink,hotCol(D[i],-1,20),1.6); }

  });
  return wrap;
}

/* =====================================================================
   5. SPECIFIC HEAT CAPACITY             (§10.6, eq. 10.10–10.11, Table 10.3)

   Beaker A is always water; beaker B can hold another liquid.
   ===================================================================== */
function buildA5(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Beaker B holds', seg('sb',[['4186|Water','Water'],['2118|Kerosene','Kerosene'],['1965|Edible oil','Edible oil'],['140|Mercury','Mercury']],2)) +
    slider('ma','Mass of water A',0.1,1,0.05,0.5) + slider('mb','Mass in B',0.1,1,0.05,0.5) + slider('pw','Burner power',200,1500,50,800) +
    `<div class="btn-row"><button class="toggle-btn play" id="go">▶ Heat</button><button class="toggle-btn" id="rs">⟲ Cool down</button></div>` +
    cards([{l:'ΔT  water A',id:'c1',col:'var(--f-blue)'},{l:'ΔT  beaker B',id:'c2',col:'var(--f-red)'},{l:'Heat given to each',id:'c3',col:'var(--f-yellow)'},{l:'Time',id:'c4'}]) +
    hintBox('Q = m s ΔT &nbsp;·&nbsp; s<sub>water</sub> = 4186 J kg⁻¹K⁻¹');
  const canvas=$('canvas'); let t=0, sB=2118, nameB='Edible oil', run=false, Q=0, tim=0;
  let TA=20, TB=20; const dispA={x:20}, dispB={x:20}, parts=[]; const rnd=rng(5);
  for(let i=0;i<14;i++) parts.push({x:rnd(),y:rnd(),ph:rnd()*6});
  const reset=()=>{ TA=20; TB=20; Q=0; tim=0; run=false; $('#go').textContent='▶ Heat'; };
  wireSeg(wrap,'sb',v=>{ const p=v.split('|'); sB=+p[0]; nameB=p[1]; reset(); });
  ['ma','mb','pw'].forEach(id=>$('#'+id).addEventListener('input',()=>{ if(id!=='pw') reset(); }));
  $('#go').onclick=()=>{ run=!run; $('#go').textContent=run?'⏸ Pause':'▶ Heat'; };
  $('#rs').onclick=reset;
  const cutA=()=>TA>=99.99, cutB=()=>TB>=99.99;
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const mA=K.v('ma'), mB=K.v('mb'), Pw=K.v('pw'); K.put('maV',fmt(mA,2)+' kg'); K.put('mbV',fmt(mB,2)+' kg'); K.put('pwV',Pw+' W');
    const sim=dt*10;
    if(run){ if(!cutA()){ TA=Math.min(100,TA+Pw*sim/(mA*4186)); } if(!cutB()){ TB=Math.min(100,TB+Pw*sim/(mB*sB)); } if(!(cutA()&&cutB())){ tim+=sim; } if(!cutA()||!cutB()) Q+=0; }
    Q=Pw*tim;
    if(run && cutA()&&cutB()){ run=false; $('#go').textContent='▶ Heat'; }
    dispA.x=approach(dispA.x,TA,10,dt); dispB.x=approach(dispB.x,TB,10,dt);
    K.put('c1','+'+fmt(TA-20,1)+' K'); K.put('c2','+'+fmt(TB-20,1)+' K'); K.put('c3',fmt(Q/1000,1)+' kJ'); K.put('c4',fmt(tim,0)+' s');
    const sc=Math.min(w/820,h/520,1.5);
    const floor=h*0.84; line(ctx,w*0.04,floor,w*0.96,floor,COL.ink,3);
    const bw=Math.min(w*0.24,200*sc), bot=floor-92*sc, top=bot-h*0.36;
    const cols=[w*0.2,w*0.8];
    [[0,mA,TA,dispA.x,'Water A','rgba(47,143,224,0.2)',COL.blue,cutA()],[1,mB,TB,dispB.x,nameB+' B',nameB==='Mercury'?'rgba(129,149,171,0.45)':nameB==='Water'?'rgba(47,143,224,0.2)':'rgba(217,160,23,0.22)',nameB==='Mercury'?COL.mid:nameB==='Water'?COL.blue:COL.yellow,cutB()]].forEach(([i,m,Tt,Td,nm,fill,strk,cut])=>{
      const cx=cols[i], lev=bot-(bot-top)*(0.2+0.7*m);
      burner(ctx,cx,floor,bw*0.7,run&&!cut?clamp(Pw/1200,0.25,1):0,t);
      line(ctx,cx-bw*0.62,bot+14,cx+bw*0.62,bot+14,COL.ink,3.2); line(ctx,cx-bw*0.5,bot+14,cx-bw*0.5,floor-34,COL.mid,1.6); line(ctx,cx+bw*0.5,bot+14,cx+bw*0.5,floor-34,COL.mid,1.6);
      liquid(ctx,()=>{ctx.beginPath();ctx.rect(cx-bw/2,top,bw,bot-top);},cx-bw/2,cx+bw/2,lev,bot,t+i,1.3,fill,strk);
      beakerStroke(ctx,cx,top-12,bot,bw);
      // convection motes
      const sp=clamp((Td-20)/60,0,1);
      parts.forEach((p,k)=>{ const ang=t*(0.8+sp*4)+p.ph; const px=cx+Math.cos(ang)*bw*0.32*(0.5+p.x*0.5), py=(lev+bot)/2+Math.sin(ang)*(bot-lev)*0.32*(0.4+p.y*0.6); if(i===0||nm!=='Mercury') circ(ctx,px,py,2.2,strk,'#fff',1.2); });
      if(Td>75) for(let k=0;k<4;k++){ const bx=cx-bw*0.3+k*bw*0.2, by=bot-6-((t*60+k*37+i*11)%(bot-lev)); circ(ctx,bx,by,2.8,strk,'rgba(255,255,255,0.8)',1.4); }
      // thermometer
      const tx=cx+bw*0.18; thermo(ctx,tx,top-60,bot-24,(Td-20)/80,COL.ink,mixCol('#2f8fe0','#d9432b',(Td-20)/80));
      textAt(ctx,fmt(Td,1)+' °C',tx,top-72,{size:13,weight:700,align:'center',color:COL.red});
      textAt(ctx,nm,cx,floor+24,{size:14,weight:700,align:'center',color:COL.ink});
      textAt(ctx,fmt(m,2)+' kg · s = '+(i?sB:4186),cx,floor+43,{size:12,weight:600,align:'center',color:COL.muted});
      if(cut) pill(ctx,cx,top-94,'cut-off at 100 °C','#d9a017','center');
      if(run&&!cut) for(let k=0;k<3;k++){ const ay=bot+12+((t*40+k*14)%40); ctx.save(); ctx.globalAlpha=0.7; vec(ctx,cx-bw*0.3+k*bw*0.3,ay+22,cx-bw*0.3+k*bw*0.3,ay,COL.red,2.4); ctx.restore(); }
    });
    // stopwatch
    const sx=w*0.5, sy=h*0.38, sr=Math.min(46*sc,h*0.1);
    circ(ctx,sx,sy,sr,COL.ink,'#fff',3); rect(ctx,sx-5,sy-sr-10,10,9,COL.ink,'#cfd8e3',2);
    for(let k=0;k<12;k++){ const a=k*Math.PI/6-Math.PI/2; line(ctx,sx+Math.cos(a)*(sr-4),sy+Math.sin(a)*(sr-4),sx+Math.cos(a)*(sr-10),sy+Math.sin(a)*(sr-10),COL.ink,1.6); }
    const ha=-Math.PI/2+(tim/60)*Math.PI*2; line(ctx,sx,sy,sx+Math.cos(ha)*(sr-8),sy+Math.sin(ha)*(sr-8),COL.red,3); circ(ctx,sx,sy,3.6,COL.ink,COL.ink,1);
    textAt(ctx,fmt(tim,0)+' s',sx,sy+sr+22,{size:15,weight:700,align:'center'});
    textAt(ctx,'sim. clock ×10',sx,sy+sr+40,{size:10.5,weight:600,align:'center',color:COL.mid});
    // equal-heat bar
    const bx0=w*0.37, bx1=w*0.63, byb=h*0.66; line(ctx,bx0,byb,bx1,byb,COL.ink,2);
    if(Q>0){ const L=(bx1-bx0)*clamp(Q/4.2e5,0,1); line(ctx,bx0,byb,bx0+L,byb,COL.red,7); }
    textAt(ctx,'same heat Q reaches both',w*0.5,byb+22,{size:12,weight:700,align:'center',color:COL.red});
  });
  return wrap;
}

/* =====================================================================
   6. CALORIMETRY — HEAT LOST = HEAT GAINED     (§10.7, Ex 10.3, Ex 10.4)
   T_f = (m₁s₁T₁ + (m₂s_w + m₃s_cu) T₂) / (m₁s₁ + m₂s_w + m₃s_cu)
   Check (Ex 10.3): 47 g Al at 100 °C → 0.25 kg water + 0.14 kg Cu at 20 °C → 23 °C
   Ice mode (Ex 10.4): 0.15 kg ice + 0.30 kg water at 50 °C → 6.7 °C (L_f = 3.34×10⁵)
   ===================================================================== */
function buildA6(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Drop in', seg('md',[['M','Hot metal ball'],['I','Ice cubes']],0)) +
    `<div id="g_met">`+group('Metal', seg('met',[['900|Aluminium','Al'],['386.4|Copper','Cu'],['450|Iron','Fe'],['127.7|Lead','Pb']],0))+`</div>` +
    slider('m1','Mass dropped',0.02,0.4,0.001,0.047) + slider('m2','Water in calorimeter',0.1,0.5,0.01,0.25) + slider('tw','Water temperature',20,80,1,20) +
    `<div class="btn-row"><button class="toggle-btn play" id="go">▶ Drop it in</button><button class="toggle-btn" id="rs">⟲ Reset</button></div>` +
    cards([{l:'Final temperature',id:'c1',col:'var(--f-green)'},{l:'Heat exchanged',id:'c2',col:'var(--f-red)'},{l:'Dropped body',id:'c3',col:'var(--f-red)'},{l:'Water + vessel',id:'c4',col:'var(--f-blue)'}]) +
    hintBox('Heat lost = heat gained');
  const canvas=$('canvas'); let t=0, mode='M', s1=900, nm1='Aluminium';
  const S={ph:0,u:0,te:0,hist:[],splash:[],sink:{x:0,v:0}};
  const Lf=3.34e5, sw=4186, scu=386;
  const reset=()=>{ S.ph=0; S.u=0; S.te=0; S.hist=[]; S.splash=[]; S.sink={x:0,v:0}; };
  function setMode(m){ mode=m; K.show('met',m==='M'); K.show('tw',m==='I'); if(m==='M'){ K.setSlider('m1',0.047); K.setSlider('m2',0.25); K.setSlider('tw',20); } else { K.setSlider('m1',0.15); K.setSlider('m2',0.30); K.setSlider('tw',50); } reset(); }
  wireSeg(wrap,'md',setMode); wireSeg(wrap,'met',v=>{ const p=v.split('|'); s1=+p[0]; nm1=p[1]; reset(); });
  ['m1','m2','tw'].forEach(id=>$('#'+id).addEventListener('input',reset));
  $('#go').onclick=()=>{ if(S.ph===0){ S.ph=1; S.u=0; } }; $('#rs').onclick=reset;
  K.show('tw',false);
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const m1=K.v('m1'), m2=K.v('m2'), Tw0=K.v('tw'); K.put('m1V',fmt(m1,3)+' kg'); K.put('m2V',fmt(m2,2)+' kg'); K.put('twV',fmt(Tw0,0)+' °C');
    const m3=mode==='M'?0.14:0, C2=m2*sw+m3*scu; let Tf, T1=100, frac=1, melt=1;
    if(mode==='M'){ Tf=(m1*s1*100+C2*20)/(m1*s1+C2); }
    else { const avail=m2*sw*Tw0; if(avail>=m1*Lf+0){ Tf=(m2*sw*Tw0-m1*Lf)/(m1*sw+m2*sw); if(Tf<0){ Tf=0; melt=(m2*sw*Tw0)/(m1*Lf); } } else { Tf=0; melt=avail/(m1*Lf); } T1=0; }
    const Tstart2=mode==='M'?20:Tw0, TS0=mode==='M'?100:0;
    // phases: 1 swing (1.7 s), 2 equilibrate
    if(S.ph===1){ S.u+=dt/1.7; if(S.u>=1){ S.u=1; S.ph=2; S.te=0; S.hist=[]; S.sink.v=140; for(let i=0;i<18;i++) S.splash.push({x:0,y:0,vx:(Math.random()-0.5)*220,vy:-120-Math.random()*200,live:1}); } }
    if(S.ph===2){ S.te+=dt; if(S.hist.length===0||S.te-S.hist[S.hist.length-1][0]>0.05) S.hist.push([S.te,TS0,Tstart2]); }
    const tau=2.4, e=S.ph===2?Math.exp(-S.te/tau):1;
    const u2=S.ph===2?1-e:0;
    let Tball, Twat;
    if(mode==='M'){ Tball=Tf+(TS0-Tf)*e; Twat=Tf+(Tstart2-Tf)*e; }
    else { const mm=m1*melt*u2; Twat=(m2*sw*Tw0-mm*Lf)/(mm*sw+m2*sw); if(S.ph<2) Twat=Tw0; Tball=0; }
    if(S.ph===2){ const last=S.hist[S.hist.length-1]; if(last){ last[1]=Tball; last[2]=Twat; } }
    K.put('c1',fmt(mode==='M'?Tf:(Tf),1)+' °C');
    if(mode==='M'){ K.put('c2',fmt(m1*s1*(100-Tf),0)+' J'); K.put('c3','−'+fmt(100-Tf,1)+' K (lost)'); K.put('c4','+'+fmt(Tf-20,1)+' K (gained)'); }
    else { K.put('c2',fmt(m1*Lf*melt+m1*sw*Tf,0)+' J'); K.put('c3',fmt(melt*100,0)+' % melted'); K.put('c4','−'+fmt(Tw0-Tf,1)+' K'); }
    const sc=Math.min(w/820,h/520,1.5);
    const floor=h*0.9; line(ctx,w*0.03,floor,w*0.62,floor,COL.ink,3);
    // ---- left object: boiling pot (metal) or ice bowl (ice) ----
    const px=w*0.13, pw=Math.min(w*0.17,150*sc), ptop=h*0.5, pbot=h*0.84;
    const cx=w*0.45, cw=Math.min(w*0.2,170*sc), ctop=h*0.42, cbot=h*0.84;
    const wlevC=cbot-(cbot-ctop)*(0.28+0.6*m2), wlevP=ptop+(pbot-ptop)*0.35;
    if(mode==='M'){
      burner(ctx,px,floor,pw*0.7,1,t); line(ctx,px-pw*0.6,pbot+12,px+pw*0.6,pbot+12,COL.ink,3);
      liquid(ctx,()=>{ctx.beginPath();ctx.rect(px-pw/2,ptop,pw,pbot-ptop);},px-pw/2,px+pw/2,wlevP,pbot,t,1.8,'rgba(47,143,224,0.2)',COL.blue);
      beakerStroke(ctx,px,ptop-10,pbot,pw);
      for(let k=0;k<4;k++){ const bx=px-pw*0.3+k*pw*0.2, by=pbot-8-((t*50+k*29)%(pbot-wlevP)); circ(ctx,bx,by,2.8,COL.blue,'rgba(255,255,255,0.85)',1.4); }
      steamWisps(ctx,px,wlevP-4,pw*0.7,4,t,0.9);
      textAt(ctx,'boiling water 100 °C',px,pbot+34,{size:12,weight:700,align:'center',color:COL.red});
    } else {
      line(ctx,px-pw*0.55,pbot+2,px+pw*0.55,pbot+2,COL.ink,3);
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(px-pw*0.5,pbot-pw*0.2); ctx.quadraticCurveTo(px-pw*0.45,pbot,px,pbot); ctx.quadraticCurveTo(px+pw*0.45,pbot,px+pw*0.5,pbot-pw*0.2); ctx.stroke(); ctx.restore();
      if(S.ph===0){ const n=5; for(let k=0;k<n;k++) ice(ctx,px-pw*0.3+(k%3)*pw*0.3+(k>2?pw*0.15:0),pbot-14-Math.floor(k/3)*pw*0.22,pw*0.22*Math.cbrt(m1/0.15),0.1*k,1); }
      textAt(ctx,'ice at 0 °C · '+fmt(m1,2)+' kg',px,pbot+34,{size:12,weight:700,align:'center',color:COL.blue});
    }
    // ---- calorimeter ----
    const jw=cw*1.28;
    rect(ctx,cx-jw/2,ctop-18,jw,cbot-ctop+36,COL.mid,'rgba(194,209,229,0.25)',2); for(let k=0;k<8;k++) line(ctx,cx-jw/2+2,ctop-14+k*((cbot-ctop+28)/7),cx-jw/2+9,ctop-6+k*((cbot-ctop+28)/7),COL.mid,1);
    textAt(ctx,'insulating jacket',cx,cbot+36,{size:10.5,weight:600,align:'center',color:COL.mid});
    const Tshow=S.ph===2?Twat:Tstart2;
    const wcol=mixCol('#bfe0fa','#f4cdc3',(Tshow-20)/70);
    const lv=wlevC-(mode==='I'&&S.ph===2?-0:0);
    liquid(ctx,()=>{ctx.beginPath();ctx.rect(cx-cw/2,ctop,cw,cbot-ctop);},cx-cw/2,cx+cw/2,lv,cbot,t,S.ph===2&&S.te<1.4?3:1.2,wcol,COL.blue);
    ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=3.4; ctx.lineJoin='round'; beakerPath(ctx,cx,ctop-10,cbot,cw); ctx.stroke(); ctx.restore();
    // stirrer
    const stx=cx-cw*0.22+Math.sin(t*3)*cw*0.12; line(ctx,stx,ctop-24,stx,cbot-24,COL.ink,2.4); ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.strokeRect(stx-9,cbot-44,18,14); ctx.restore();
    // thermometer
    const tx=cx+cw*0.22; thermo(ctx,tx,ctop-48,cbot-26,(Tshow-0)/100,COL.ink,mixCol('#2f8fe0','#d9432b',(Tshow)/100));
    textAt(ctx,fmt(Tshow,1)+' °C',tx,ctop-58,{size:13,weight:700,align:'center',color:COL.red});
    // ---- the dropped body ----
    const sx0=px, sy0=mode==='M'?wlevP+pw*0.12:pbot-26, sx1=cx-cw*0.05, sy1=lv+cw*0.12, apex=h*0.14;
    let bx, by;
    if(S.ph===0){ bx=sx0; by=sy0; if(mode==='M') bx+=Math.sin(t*2)*1.5; }
    else if(S.ph===1){ const u=S.u, s=u*u*(3-2*u); bx=lerp(sx0,sx1,s); by=lerp(sy0,sy1,s)-apex*Math.sin(Math.PI*s)*(mode==='M'?1:0.8); }
    else { springTo(S.sink,cw*0.18,40,7,dt); bx=sx1+Math.sin(S.te*3)*2; by=sy1+Math.max(0,S.sink.x)*0.0+(cbot-sy1-30)*Math.min(1,S.te*0.9)*0.0+S.sink.x; }
    const r=(mode==='M'?12+Math.cbrt(m1/0.047)*6:0)*sc;
    if(S.ph>=1&&S.ph<3||S.ph===0){
      if(mode==='M'){
        if(S.ph<2) line(ctx,bx,by,bx,by-(S.ph===0?60:80),COL.ink,1.6);
        circ(ctx,bx,by,r,COL.ink,mixCol('#d9432b','#9fd4f5',(100-Tball)/(100-Tf+1e-6)),3);
        circ(ctx,bx-r*0.3,by-r*0.3,r*0.25,'#fff',null,1.2);
      } else if(S.ph>0){
        // ice cubes dropped, melting
        const n=5, sizeF=Math.cbrt(Math.max(0.0001,1-melt*u2));
        for(let k=0;k<n;k++){
          const dly=k*0.12, uu=clamp((S.ph===1?S.u:1)-dly,0,1), ss=uu*uu*(3-2*uu);
          const ex=lerp(sx0+ (k%3)*8,cx-cw*0.3+k*cw*0.13,ss), ey=lerp(sy0,lv+2,ss)-apex*Math.sin(Math.PI*ss)*0.8;
          ice(ctx,ex,ey+(S.ph===2?Math.sin(t*1.5+k)*2:0),cw*0.2*Math.cbrt(m1/0.15)*(S.ph===2?sizeF:1),k*0.5+ss,1);
        }

    hintBox('P = 2mg ÷ (d·ℓ) &nbsp;·&nbsp; melting point falls as P rises');

/* =====================================================================
   12. RADIATION & BLACKBODY SPECTRUM    (§10.9.3–10.9.4, eq. 10.15–10.18)
   λ_m T = 2.9×10⁻³ m K ;  H = σ e A (T⁴ − T_s⁴) ,  σ = 5.67×10⁻⁸
   Checks: Sun 6000 K → λ_m = 483 nm ;  skin: A = 1.9 m², e = 0.97,
   T = 301 K, T_s = 295 K → 66.4 W ;  lamp 3000 K, e = 0.4, 0.3 cm² → 55 W
   (the textbook prints 60 W for the same numbers).
   ===================================================================== */
function specCol(nm){
  let r=0,g=0,b=0;
  if(nm<380||nm>750) return null;
  if(nm<440){ r=-(nm-440)/60; b=1; } else if(nm<490){ g=(nm-440)/50; b=1; } else if(nm<510){ g=1; b=-(nm-510)/20; } else if(nm<580){ r=(nm-510)/70; g=1; } else if(nm<645){ r=1; g=-(nm-645)/65; } else r=1;
  return 'rgb('+Math.round(r*230)+','+Math.round(g*200)+','+Math.round(b*235)+')';
}
function bbColor(T){ return rampCol([[500,'#cfd8e3'],[700,'#8c3a30'],[900,'#c0392b'],[1200,'#e8573a'],[1800,'#f08a3c'],[2800,'#f6c46a'],[4200,'#fde7b5'],[6000,'#fff8ec'],[9000,'#dbe8ff']],T); }
function buildA12(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Try', seg('pre',[['lamp','Lamp'],['iron','Hot iron'],['sun','Sun'],['skin','Skin'],['moon','Moon']],0)) +
    slider('T','Body temperature T',100,7000,10,3000) + slider('Ts','Surroundings T_s',0,500,5,300) + slider('e','Emissivity e',0.05,1,0.01,0.4) + slider('lA','Surface area A',-1,4.4,0.001,-0.523) +
    cards([{l:'Peak wavelength λm',id:'c1',col:'var(--f-green)'},{l:'Net power H',id:'c2',col:'var(--f-red)'},{l:'λm × T',id:'c3',col:'var(--f-blue)',wide:true}]) +
    hintBox('λ<sub>m</sub>T = 2.9×10⁻³ m K &nbsp;·&nbsp; H = σeA(T⁴ − T<sub>s</sub>⁴)');
  const canvas=$('canvas'); let t=0;
  const PRE={lamp:[3000,300,0.4,0.3],iron:[1100,300,0.8,50],sun:[6000,3,1,1],skin:[301,295,0.97,19000],moon:[200,3,0.9,100]};
  wireSeg(wrap,'pre',v=>{ const p=PRE[v]; K.setSlider('T',p[0]); K.setSlider('Ts',p[1]); K.setSlider('e',p[2]); K.setSlider('lA',Math.log10(p[3])); });
  const sm={T:3000,xmax:2.5e-6,ymax:1}, rings=[]; let ringT=0;
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const T=K.v('T'), Ts=K.v('Ts'), e=K.v('e'), Acm=Math.pow(10,K.v('lA')), A=Acm*1e-4;
    K.put('TV',fmt(T,0)+' K'); K.put('TsV',fmt(Ts,0)+' K'); K.put('eV',fmt(e,2)); K.put('lAV',Acm>=100?fmt(Acm/1e4,2)+' m²':fmt(Acm,Acm<10?2:0)+' cm²');
    sm.T=approach(sm.T,T,7,dt);
    const lm=2.9e-3/sm.T, H=SIGMA*e*A*(Math.pow(T,4)-Math.pow(Ts,4));
    K.put('c1',lm<1e-6?fmt(lm*1e9,0)+' nm':fmt(lm*1e6,2)+' µm'); K.put('c2',Math.abs(H)>=1000?fmt(H,0)+' W':fmt(H,H<1?4:1)+' W'); K.put('c3','2.9×10⁻³ m K ✓');
    const sc=Math.min(w/820,h/520,1.5);
    // ---- glowing body with radiated rings ----
    const cx=w*0.2, cy=h*0.42, rBody=clamp(24+Math.sqrt(Acm)*3.2,26,92)*sc;
    const spacing=(10+8*Math.log(Math.max(0.3,lm*1e6/0.4)))*sc;
    ringT+=dt*(70+60*Math.log10(Math.max(1,T)));
    const lmNm=lm*1e9, ringCol=specCol(lmNm)||(lmNm>750?COL.red:COL.blue);
    const Rmax=Math.min(w*0.2,h*0.4);
    const inten=clamp(Math.log10(Math.max(1e-3,Math.abs(H)))/9+0.35,0.1,1);
    for(let r=rBody+(ringT%spacing);r<Rmax;r+=spacing){ const fade=1-(r-rBody)/(Rmax-rBody); ctx.save(); ctx.globalAlpha=fade*(0.25+0.75*inten); ctx.strokeStyle=ringCol; ctx.lineWidth=2.2; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); ctx.restore(); }

    ctx.save(); const gr=ctx.createRadialGradient(cx,cy,rBody*0.5,cx,cy,rBody*(1+clamp((sm.T-700)/4000,0,1.2))); gr.addColorStop(0,bc); gr.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=gr; ctx.globalAlpha=clamp((sm.T-600)/900,0,0.8); ctx.beginPath(); ctx.arc(cx,cy,rBody*2.2,0,Math.PI*2); ctx.fill(); ctx.restore();
    circ(ctx,cx,cy,rBody,COL.ink,bc,3.2);
    textAt(ctx,fmt(T,0)+' K',cx,cy+4,{size:13,weight:700,align:'center',color:sm.T>2500?COL.ink:'#fff'});
    textAt(ctx,'radiates in vacuum too',cx,h*0.82,{size:12,weight:600,align:'center',color:COL.muted});
    // ---- spectrum graph ----
    const gx=w*0.47, gy=h*0.74, gw=w*0.49, gh=h*0.56;
    const xm=Math.max(2.0e-6,3.8*lm); sm.xmax=approach(sm.xmax,xm,6,dt);
    axes(ctx,gx,gy,gw,gh,'wavelength λ','energy per unit λ');
    const pk=planck(lm,sm.T), XG=l=>gx+gw*l/sm.xmax, YG=(l,TT)=>gy-gh*0.88*planck(l,TT)/pk;
    // visible band
    for(let nm=380;nm<750;nm+=6){ const l=nm*1e-9; if(l>sm.xmax) break; const c=specCol(nm); ctx.fillStyle=c; ctx.globalAlpha=0.5; ctx.fillRect(XG(l),gy-10,Math.max(1,XG((nm+6)*1e-9)-XG(l)),10); ctx.globalAlpha=1; }
    textAt(ctx,'visible',XG(565e-9),gy-14,{size:10.5,weight:700,align:'center',color:COL.muted});
    // ghost curves
    [0.78,1.28].forEach(f=>{ const pts=[]; for(let k=1;k<=140;k++){ const l=sm.xmax*k/140; pts.push([XG(l),clamp(YG(l,sm.T*f),gy-gh*1.1,gy)]); } polyline(ctx,pts,'rgba(129,149,171,0.6)',1.6,[5,5]); });
    textAt(ctx,'dashed: ±25 % in T',gx+gw,gy-gh-8,{size:11,weight:600,align:'right',color:COL.mid});
    // live curve (filled)
    const pts=[]; for(let k=1;k<=160;k++){ const l=sm.xmax*k/160; pts.push([XG(l),gy-gh*0.88*planck(l,sm.T)/pk]); }
    ctx.save(); ctx.beginPath(); ctx.moveTo(gx,gy); pts.forEach(p=>ctx.lineTo(p[0],p[1])); ctx.lineTo(gx+gw,gy); ctx.closePath(); ctx.fillStyle='rgba(217,67,43,0.14)'; ctx.fill(); ctx.restore();
    polyline(ctx,pts,COL.red,3.6);
    line(ctx,XG(lm),gy,XG(lm),gy-gh*0.88,COL.green,2,[6,5]); circ(ctx,XG(lm),gy-gh*0.88,6,COL.green,COL.green,1);
    pill(ctx,XG(lm)+(XG(lm)>gx+gw*0.7?-10:10),gy-gh*0.88-14,'λm = '+(lm<1e-6?fmt(lm*1e9,0)+' nm':fmt(lm*1e6,2)+' µm'),'#1f9d55',XG(lm)>gx+gw*0.7?'right':'left');
    // axis ticks
    const stepU=sm.xmax>6e-6?2e-6:sm.xmax>3e-6?1e-6:0.5e-6;
    for(let l=stepU;l<sm.xmax;l+=stepU){ line(ctx,XG(l),gy,XG(l),gy+5,COL.ink,1.6); textAt(ctx,fmt(l*1e6,1)+' µm',XG(l),gy+18,{size:10.5,align:'center',weight:600,color:COL.muted}); }
    // power bar (log)
    const bx0=w*0.47, bx1=w*0.96, by=h*0.93; line(ctx,bx0,by,bx1,by,COL.mid,2);
    const lg=clamp((Math.log10(Math.max(1e-4,Math.abs(H)))+4)/14,0,1); line(ctx,bx0,by,bx0+(bx1-bx0)*lg,by,COL.red,8);
    textAt(ctx,'power (log scale)',bx0,by-12,{size:11,weight:700,color:COL.red});
  });
  return wrap;
}

/* =====================================================================

   Check (Ex 10.8): K = 0.0572 min⁻¹ , T_s = 20 °C :  94 → 86 °C in 2 min
   and 71 → 69 °C in 0.70 min ≈ 42 s.

function buildA13(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Surface of the vessel', seg('kk',[['0.0572','Pan (Ex 10.8)'],['0.02','Polished'],['0.045','Dull'],['0.09','Black']],0)) +

    hintBox('Rate of cooling ∝ (T − T<sub>s</sub>)');

  const reset=()=>{ tm=0; run=false; $('#go').textContent='▶ Start cooling'; };
  $('#go').onclick=()=>{ run=!run; $('#go').textContent=run?'⏸ Pause':'▶ Start cooling'; }; $('#rs').onclick=reset;
  ['T0','Ts'].forEach(id=>$('#'+id).addEventListener('input',reset));
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const T0=K.v('T0'), Ts=K.v('Ts'), qa=K.v('qa'); let qb=K.v('qb'); qb=Math.min(qb,qa-1);
    K.put('T0V',T0+' °C'); K.put('TsV',Ts+' °C'); K.put('qaV',qa+' °C'); K.put('qbV',qb+' °C');
    if(run) tm+=dt*spd;
    const tmax=clamp(4.6/Kc,20,160);
    if(tm>tmax*1.0){ tm=tmax; run=false; $('#go').textContent='▶ Start cooling'; }
    const Tw=Ts+(T0-Ts)*Math.exp(-Kc*tm), rate=Kc*(Tw-Ts);
    const tq=(qa>Ts&&qb>Ts)?Math.log((qa-Ts)/(qb-Ts))/Kc:NaN;
    K.put('c1',fmt(Tw,1)+' °C  ('+fmt(tm,1)+' min)'); K.put('c2',fmt(rate,2)+' °C / min'); K.put('c3',isFinite(tq)?fmt(tq,2)+' min  =  '+fmt(tq*60,0)+' s':'—');
    const sc=Math.min(w/820,h/520,1.5);
    // ---- the cup ----
    const cx=w*0.18, cw=Math.min(w*0.16,140*sc), ctop=h*0.34, cbot=h*0.74, floor=h*0.8;
    line(ctx,w*0.03,floor,w*0.36,floor,COL.ink,3);
    ctx.save(); ctx.beginPath(); ctx.moveTo(cx-cw/2,ctop); ctx.lineTo(cx-cw*0.4,cbot); ctx.lineTo(cx+cw*0.4,cbot); ctx.lineTo(cx+cw/2,ctop); ctx.closePath(); ctx.fillStyle='rgba(255,255,255,0.0)'; ctx.fill(); ctx.restore();
    liquid(ctx,()=>{ctx.beginPath();ctx.moveTo(cx-cw/2,ctop);ctx.lineTo(cx-cw*0.4,cbot);ctx.lineTo(cx+cw*0.4,cbot);ctx.lineTo(cx+cw/2,ctop);ctx.closePath();},cx-cw/2,cx+cw/2,ctop+14,cbot,t,1.4,mixCol('#cfe8fb','#f3b9a8',(Tw-Ts)/(100-Ts+1)),hotCol(Tw,Ts,100));
    ctx.save(); ctx.strokeStyle=Kc>0.07?'#132a44':Kc<0.03?'#8195ab':'#4c6178'; ctx.lineWidth=Kc>0.07?6:3.4; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(cx-cw/2,ctop); ctx.lineTo(cx-cw*0.4,cbot); ctx.lineTo(cx+cw*0.4,cbot); ctx.lineTo(cx+cw/2,ctop); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx+cw/2+4,(ctop+cbot)/2-10,cw*0.2,-Math.PI/2,Math.PI/2); ctx.stroke(); ctx.restore();
    steamWisps(ctx,cx,ctop+6,cw*0.6,5,t,clamp((Tw-35)/60,0,1));
    // thermometer in cup
    thermo(ctx,cx+cw*0.15,ctop-40,cbot-30,(Tw-Ts)/(100-Ts+1)*0.9+0.05,COL.ink,mixCol('#2f8fe0','#d9432b',(Tw-Ts)/(100-Ts+1)));
    textAt(ctx,fmt(Tw,1)+' °C',cx,ctop-56,{size:14,weight:700,align:'center',color:COL.red});
    // heat leaving
    const nA=7, L=clamp((Tw-Ts)/(100-Ts+1),0,1)*52*sc;
    if(L>3) for(let i=0;i<nA;i++){ const a=-Math.PI*0.9+i*(Math.PI*0.8/(nA-1))+0.06; const ph=((t*0.9+i/nA)%1); const r0=cw*0.55+ph*24; ctx.save(); ctx.globalAlpha=1-ph*0.7; vec(ctx,cx+Math.cos(a)*r0*1.3,(ctop+cbot)/2+Math.sin(a)*r0*0.9-cw*0.1,cx+Math.cos(a)*(r0*1.3+L*0.55),(ctop+cbot)/2+Math.sin(a)*(r0*0.9+L*0.55)-cw*0.1,COL.red,2.6); ctx.restore(); }
    textAt(ctx,'heat lost ∝ (T − T_s)',cx,floor+24,{size:12,weight:700,align:'center',color:COL.red});
    // room thermometer
    thermo(ctx,w*0.33,h*0.32,h*0.7,(Ts-5)/60,COL.ink,COL.blue); textAt(ctx,'room '+Ts+' °C',w*0.33,h*0.28,{size:12,weight:700,align:'center',color:COL.blue});
    // ---- graph 1: T vs t ----
    const gx=w*0.47, gw=w*0.48, g1y=h*0.45, g1h=h*0.34;
    axes(ctx,gx,g1y,gw,g1h,'t (min)','T (°C)');
    const GX=m=>gx+gw*m/tmax, GY=T=>g1y-g1h*(T-(Ts-3))/((T0+4)-(Ts-3));
    const full=[]; for(let k=0;k<=80;k++){ const m=tmax*k/80; full.push([GX(m),GY(Ts+(T0-Ts)*Math.exp(-Kc*m))]); }
    polyline(ctx,full,'rgba(129,149,171,0.55)',2,[6,5]);
    line(ctx,gx,GY(Ts),gx+gw,GY(Ts),COL.blue,1.6,[4,4]); textAt(ctx,'T_s',gx+gw+6,GY(Ts)+4,{size:11,weight:700,color:COL.blue});
    [[qa,COL.yellow],[qb,COL.yellow]].forEach(([q,c])=>{ if(q<T0&&q>Ts){ line(ctx,gx,GY(q),gx+gw,GY(q),c,1.2,[3,5]); textAt(ctx,q+'',gx-6,GY(q)+4,{size:10.5,align:'right',weight:700,color:COL.yellow}); } });
    if(isFinite(tq)&&qa<T0){ const ma=Math.log((T0-Ts)/(qa-Ts))/Kc, mb=Math.log((T0-Ts)/(qb-Ts))/Kc; ctx.save(); ctx.fillStyle='rgba(217,160,23,0.22)'; ctx.fillRect(GX(ma),g1y-g1h,Math.max(2,GX(mb)-GX(ma)),g1h); ctx.restore(); }
    const live=[]; const steps=Math.max(2,Math.round(80*tm/tmax)); for(let k=0;k<=steps;k++){ const m=tm*k/steps; live.push([GX(m),GY(Ts+(T0-Ts)*Math.exp(-Kc*m))]); }
    polyline(ctx,live,COL.red,3.6);
    circ(ctx,GX(tm),GY(Tw),6,COL.red,COL.red,1);
    // tangent: slope = −K(T − T_s)
    { const sx=gw/tmax, sy=g1h/((T0+4)-(Ts-3)), tl=gw*0.13, dy=rate*sy*tl/sx; line(ctx,GX(tm)-tl,GY(Tw)-dy,GX(tm)+tl,GY(Tw)+dy,COL.yellow,2.6); }
    // ---- graph 2: ln(T-Ts) vs t ----
    const g2y=h*0.9, g2h=h*0.3;
    axes(ctx,gx,g2y,gw,g2h,'t (min)','ln(T − T_s)');
    const lnTop=Math.log(Math.max(1.2,T0-Ts))+0.25, lnBot=lnTop-4.9;
    const G2=v=>g2y-g2h*(v-lnBot)/(lnTop-lnBot);
    polyline(ctx,[[GX(0),G2(Math.log(T0-Ts))],[GX(tmax),G2(Math.log(T0-Ts)-Kc*tmax)]],'rgba(129,149,171,0.55)',2,[6,5]);
    polyline(ctx,[[GX(0),G2(Math.log(T0-Ts))],[GX(tm),G2(Math.log(T0-Ts)-Kc*tm)]],COL.green,3.6);
    circ(ctx,GX(tm),G2(Math.log(T0-Ts)-Kc*tm),6,COL.green,COL.green,1);
    pill(ctx,gx+gw,g2y-g2h+8,'straight line, slope −K = −'+fmt(Kc,4)+' min⁻¹','#1f9d55','right');
  });
  return wrap;
}

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();

  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}

  const wrap=document.createElement('div'); wrap.className='lab-view';
