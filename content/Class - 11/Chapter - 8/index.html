<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;

.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}

.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.toggle-btn.red{background:var(--f-red); border-color:var(--f-red); color:#fff;}
.toggle-btn.row{flex:0 0 auto; width:100%; padding:10px; margin-top:0;}
.btn-row{display:flex; gap:6px;}
.btn-row .toggle-btn{flex:1;}
.rcard .rval.sm{font-size:var(--fs-sm);}
.nav-item .n-num{min-width:22px;}

<script>
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    try{ tick(dt); }catch(e){ console.error(e); }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

/* ---------------------------------------------------------------------
   0c. CHAPTER-2 HELPERS — seeded random, eyepiece field, microscope,
       living organisms (all line diagrams, all animated)
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function lw(k,base){ return clamp(k*base,1,3); }

/* =====================================================================
   1. PRESSURE = FORCE ÷ AREA            (§9.2, eq. 9.1, Example 9.1)
   P = F/A.  Textbook check: F = 400 N on A = 20 cm² → P = 2×10⁵ Pa.
   Foam dents with P (saturating), and a sharp tip pierces above ~2 MPa.
   ===================================================================== */
function buildA1(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    slider('f','Force F',10,1000,10,400) +
    slider('a','Contact area A',0,100,1,89) +
    group('Try', seg('pre',[['needle','Needle'],['spoon','Spoon'],['femur','Femurs']],-1)) +
    cards([{l:'Pressure P = F/A',id:'rp',col:'var(--f-blue)',wide:true},{l:'Area A',id:'ra'},{l:'Foam',id:'rs'}]) +
    hintBox('P = F ÷ A &nbsp;·&nbsp; same force, smaller area → greater pressure');
  const canvas=$('canvas');
  const areaOf=s=>Math.pow(10,-2+3.7*s/100);              // cm²
  const seg1=wireSeg(wrap,'pre',k=>{
    const pr={needle:[20,0],spoon:[20,67],femur:[400,89]}[k]; K.setSlider('f',pr[0]); K.setSlider('a',pr[1]);
  });
  ['f','a'].forEach(id=>$('#'+id).addEventListener('input',()=>seg1.set('none')));
  const dep={x:-95,v:0}; let bar=3, t=0;
  animLoop(dt=>{
    t+=dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const F=K.v('f'), Acm=areaOf(K.v('a')), P=F/(Acm*1e-4);
    const pf=smoothstep(1.3e6,3.2e6,P);
    const bt=h*0.3, y0=h*0.58, bx0=w*0.08, bx1=w*0.8, cx=(bx0+bx1)/2;
    const Dmax=bt*0.42, dBlunt=Dmax*(1-Math.exp(-P/3.2e5));
    const target=lerp(dBlunt,bt*0.9,pf);
    springTo(dep,target,95,11,dt);
    const d=dep.x;
    const fw=2.5+15*Math.sqrt(Acm);                          // foot width, px
    K.put('fV',F+' N'); K.put('aV',fmt(Acm,Acm<1?2:1)+' cm²');
    K.put('rp',fmtP(P)); K.put('ra',fmt(Acm,Acm<1?2:1)+' cm²'); K.put('rs',pf>0.5?'Pierced':'Dents');
    $('#rs').style.color=pf>0.5?'var(--f-red)':'var(--text-1)';
    // dent profile: foam layers sag under the foot and recover with depth
    const dentAt=(x,j)=>{
      const u=Math.abs(x-cx), hw=fw/2, dec=Math.exp(-(j*bt/6)/(20+fw*0.9));
      const spr=12+hw*0.45+j*bt/6*0.7;
      const s=u<=hw?1:Math.exp(-Math.pow((u-hw)/spr,2));
      return Math.max(d,0)*s*dec;
    };
    const lines=[];
    for(let j=0;j<=6;j++){ const pts=[]; for(let x=bx0;x<=bx1;x+=4) pts.push([x,y0+bt*j/6+dentAt(x,j)]); lines.push(pts); }
    // foam body
    ctx.save(); ctx.beginPath();
    lines[0].forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.lineTo(bx1,y0+bt); ctx.lineTo(bx0,y0+bt); ctx.closePath();
    ctx.fillStyle='#eef6fe'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.stroke(); ctx.restore();
    for(let j=1;j<=5;j++){ ctx.save(); ctx.beginPath(); lines[j].forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.strokeStyle=COL.blue; ctx.globalAlpha=0.55; ctx.lineWidth=1.3; ctx.stroke(); ctx.restore(); }
    for(let k=1;k<9;k++){ const x=bx0+(bx1-bx0)*k/9; ctx.save(); ctx.beginPath();
      for(let j=0;j<=6;j++){ const yy=y0+bt*j/6+dentAt(x,j); j?ctx.lineTo(x,yy):ctx.moveTo(x,yy); }
      ctx.strokeStyle=COL.blue; ctx.globalAlpha=0.3; ctx.lineWidth=1; ctx.stroke(); ctx.restore(); }
    if(pf>0.25){ // cracks
      ctx.save(); ctx.strokeStyle=COL.red; ctx.lineWidth=2; ctx.globalAlpha=Math.min(1,pf*1.3);
      for(let k=-2;k<=2;k++){ ctx.beginPath(); ctx.moveTo(cx+k*3,y0+d*0.1); ctx.lineTo(cx+k*9,y0+d*0.35); ctx.lineTo(cx+k*13+4,y0+d*0.5); ctx.stroke(); }
      ctx.restore();
    }
    // plunger (yellow outline = the area you chose)
    const foot=y0+d, top=foot-h*0.36, rw=Math.min(15,fw);
    ctx.save(); ctx.lineJoin='round'; ctx.fillStyle='#fff'; ctx.strokeStyle=COL.yellow; ctx.lineWidth=3;
    ctx.beginPath();
    if(fw<=15){ ctx.moveTo(cx-7.5,top); ctx.lineTo(cx+7.5,top); ctx.lineTo(cx+fw/2,foot-18); ctx.lineTo(cx,foot); ctx.lineTo(cx-fw/2,foot-18); }
    else { ctx.moveTo(cx-7.5,top); ctx.lineTo(cx+7.5,top); ctx.lineTo(cx+7.5,foot-16); ctx.lineTo(cx+fw/2,foot-16); ctx.lineTo(cx+fw/2,foot); ctx.lineTo(cx-fw/2,foot); ctx.lineTo(cx-fw/2,foot-16); ctx.lineTo(cx-7.5,foot-16); }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    rrect(ctx,cx-26,top-12,52,12,5); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
    // force arrow (red) — length follows F, throbs while the foam is still sagging
    const al=26+h*0.17*(F/1000), thr=Math.abs(dep.v)*0.04;
    vec(ctx,cx,top-12-al-thr,cx,top-14,COL.red,4.2);
    textAt(ctx,'F = '+F+' N',cx+16,top-12-al*0.6,{size:13,weight:700,color:COL.red});
    // area label
    pill(ctx,cx+fw/2+12,foot-28-Math.max(0,Math.min(d,0)),'A = '+fmt(Acm,Acm<1?2:1)+' cm²',COL.yellow);
    // pressure bar (log scale 1 kPa … 100 MPa)
    const bx=w*0.86, by0=h*0.14, by1=h*0.82, fr=clamp((Math.log10(P)-3)/5,0,1);
    bar=approach(bar,fr,5,dt);
    rrect(ctx,bx-9,by0,18,by1-by0,6); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke();
    ctx.save(); rrect(ctx,bx-9,by0,18,by1-by0,6); ctx.clip(); ctx.fillStyle=COL.blue; ctx.fillRect(bx-9,by1-(by1-by0)*bar,18,(by1-by0)*bar+2); ctx.restore();
    const ty=by1-(by1-by0)*(Math.log10(2e6)-3)/5;
    line(ctx,bx-12,ty,bx+16,ty,COL.red,2.4,[4,3]); textAt(ctx,'pierces',bx+20,ty+4,{size:10,color:COL.red,weight:700});
    [['1 kPa',3],['1 MPa',6],['100 MPa',8]].forEach(([l,e])=>{ const yy=by1-(by1-by0)*(e-3)/5; line(ctx,bx-14,yy,bx-9,yy,COL.ink,1.4); textAt(ctx,l,bx-18,yy+4,{size:9.5,align:'right',color:COL.muted,weight:600}); });
    textAt(ctx,'P',bx,by0-10,{size:13,align:'center',weight:700,color:COL.blue});
  });
  return wrap;
}

/* =====================================================================
   2. PRESSURE WITH DEPTH               (§9.2.2, eq. 9.7, Example 9.2)
   P = Pₐ + ρgh.   Check: water, h = 10 m → ≈ 2 atm (textbook: 2.01×10⁵ Pa
   with g = 10; 1.99×10⁵ Pa with g = 9.8).
   ===================================================================== */
const LIQ = { water:{n:'Water',rho:1000}, sea:{n:'Sea water',rho:1030}, oil:{n:'Oil',rho:800}, hg:{n:'Mercury',rho:13600} };
function buildA2(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    slider('d','Depth h',0,10,0.1,3) +
    group('Liquid', seg('liq',[['water','Water'],['sea','Sea'],['oil','Oil'],['hg','Hg']],0)) +
    `<button class="toggle-btn row" id="spin">↻ Spin the probe</button>` +
    cards([{l:'Absolute P',id:'r1',col:'var(--f-blue)'},{l:'In atm',id:'r2'},{l:'Gauge ρgh',id:'r3',wide:true}]) +
    hintBox('P = Pₐ + ρ g h');
  let liq='water', spin=false, depth={x:0,v:0}, Pn={x:PATM,v:0}, rot=0, t=0, first=true;
  wireSeg(wrap,'liq',v=>liq=v);
  $('#spin').onclick=e=>{ spin=!spin; e.currentTarget.classList.toggle('play',spin); };
  const canvas=$('canvas');
  const bub=Array.from({length:7},()=>({x:Math.random(),y:Math.random(),s:0.05+Math.random()*0.08}));
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const rho=LIQ[liq].rho, hT=K.v('d');
    const tx0=w*0.1, tx1=w*0.5, ytop=h*0.1, ys=h*0.19, yb=h*0.94, sc=(yb-ys-34)/10, cx=(tx0+tx1)/2;
    if(first){ depth.x=0; first=false; }
    springTo(depth,hT,26,9.5,dt);
    const hd=Math.max(0,depth.x), P=PATM+rho*G*hd;
    springTo(Pn,P,90,16,dt);
    K.put('dV',fmt(hT,1)+' m'); K.put('r1',fmtP(P)); K.put('r2',fmt(P/PATM,2)+' atm'); K.put('r3',fmtP(rho*G*hd)+'  ('+fmt(rho*G*hd/PATM,2)+' atm)');
    // tank
    const wall=()=>{ ctx.beginPath(); ctx.rect(tx0,ys-8,tx1-tx0,yb-ys+8); };
    liquid(ctx,wall,tx0,tx1,ys,yb,t,1.6);
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(tx0,ytop+10); ctx.lineTo(tx0,yb); ctx.lineTo(tx1,yb); ctx.lineTo(tx1,ytop+10); ctx.stroke(); ctx.restore();
    // bubbles drifting up
    ctx.save(); ctx.beginPath(); ctx.rect(tx0,ys,tx1-tx0,yb-ys); ctx.clip();
    bub.forEach(b=>{ b.y-=b.s*dt; if(b.y<0) b.y=1; circ(ctx,tx0+8+b.x*(tx1-tx0-16),ys+b.y*(yb-ys),2.4,COL.blue,null,1.2); }); ctx.restore();
    // depth ruler
    for(let m=0;m<=10;m++){ const yy=ys+m*sc; line(ctx,tx0-12,yy,tx0,yy,COL.ink,m%5?1.2:2); if(m%2===0) textAt(ctx,m+' m',tx0-16,yy+4,{size:10.5,align:'right',color:COL.muted,weight:600}); }
    // crane + rope
    line(ctx,cx-90,ytop-2,cx+40,ytop-2,COL.ink,4); line(ctx,cx-90,ytop-2,cx-90,ytop+10,COL.ink,3);
    const py=ys+depth.x*sc, r=19;
    line(ctx,cx,ytop-2,cx,py-r,COL.ink,1.6);
    // probe capsule (Fig 9.1b) + arrows normal to its skin
    rot+=spin?dt*1.6:0;
    const L=16+44*clamp(SQ(Math.max(0,Pn.x-PATM)/2e6),0,1);
    for(let k=0;k<8;k++){ const a=rot+k*Math.PI/4, c=Math.cos(a), s=Math.sin(a);
      vec(ctx,cx+c*(r+4+L),py+s*(r+4+L),cx+c*(r+3),py+s*(r+3),COL.blue,2.6); }
    circ(ctx,cx,py,r,COL.ink,'#fff',2.6);
    ctx.save(); ctx.translate(cx,py); ctx.rotate(rot);
    line(ctx,-r+4,0,-5,0,COL.ink,1.8); rect(ctx,-5,-9,5,18,COL.yellow,'#fff',2.4);
    ctx.beginPath(); ctx.moveTo(-r+4,0); for(let i=0;i<6;i++) ctx.lineTo(-r+4+(i+0.5)*(r-9)/6,(i%2?-5:5)); ctx.lineTo(-5,0); ctx.strokeStyle=COL.ink; ctx.lineWidth=1.4; ctx.stroke();
    ctx.restore();
    // signal to dial
    const dr=Math.min(82,w*0.1), dx=w*0.76, dy=h*0.3;
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2; ctx.setLineDash([7,6]); ctx.lineDashOffset=-t*40;
    ctx.beginPath(); ctx.moveTo(cx+r,py); ctx.lineTo(tx1+16,py); ctx.lineTo(tx1+16,dy); ctx.lineTo(dx-dr,dy); ctx.stroke(); ctx.restore();
    dial(ctx,dx,dy,dr,(Pn.x/PATM)/15,15,'atm',fmt(Pn.x/PATM,2)+' atm',5);
    // inset graph P vs h
    const gx=w*0.6, gy=h*0.62, gw=w*0.34, gh=h*0.26;
    const Pmax=PATM+rho*G*10;
    line(ctx,gx,gy,gx,gy+gh,COL.ink,2); line(ctx,gx,gy+gh,gx+gw,gy+gh,COL.ink,2);
    textAt(ctx,'P',gx-8,gy+8,{size:12,align:'right',weight:700,color:COL.blue}); textAt(ctx,'h',gx+gw+4,gy+gh+4,{size:12,weight:700,color:COL.yellow});
    const gp=(hh,pp)=>[gx+gw*hh/10, gy+gh-gh*(pp-0)/ (Pmax*1.05)];
    const A=gp(0,PATM), B=gp(10,Pmax); line(ctx,A[0],A[1],B[0],B[1],COL.blue,2.6);
    line(ctx,gx,A[1],gx-5,A[1],COL.ink,1.6); textAt(ctx,'Pₐ',gx-8,A[1]+4,{size:10.5,align:'right',color:COL.muted,weight:600});
    const D=gp(Math.max(0,depth.x),Pn.x);
    line(ctx,D[0],D[1],D[0],gy+gh,COL.yellow,1.4,[4,3]); line(ctx,gx,D[1],D[0],D[1],COL.blue,1.4,[4,3]);
    circ(ctx,D[0],D[1],6,COL.red,COL.red,1);
  });
  return wrap;
}

/* =====================================================================
   3. HYDROSTATIC PARADOX               (§9.2.2, Fig 9.4)
   Three vessels joined at the base: the water finds ONE level.
   Flow between them: q = c·(L − mean L)  — pressure ρgL drives it.
   ===================================================================== */
function buildA3(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Pour into', seg('pv',[['0','A'],['1','B'],['2','C']],1)) +
    `<div class="btn-row"><button class="toggle-btn play" id="pour">💧 Pour</button><button class="toggle-btn" id="drain">Drain</button></div>` +
    `<button class="toggle-btn navy row" id="reset" style="margin-top:0">↺ Uneven start</button>` +
    cards([{l:'Level A',id:'la'},{l:'Level B',id:'lb'},{l:'Level C',id:'lc'},{l:'Bottom pressure',id:'pp',col:'var(--f-blue)',wide:true}],'three') +
    hintBox('P = Pₐ + ρ g h — depends on height only');
  $('.result-cards').classList.add('three');
  const canvas=$('canvas');
  const SH=[{w0:112,k:0},{w0:38,k:0},{w0:48,k:0.46}], HB=300;
  const Vof=(i,L)=>SH[i].w0*L+SH[i].k*L*L/2;
  const Lof=(i,V)=>SH[i].k? (-SH[i].w0+SQ(SH[i].w0*SH[i].w0+2*SH[i].k*V))/SH[i].k : V/SH[i].w0;
  let V=[0,1,2].map(i=>Vof(i,[55,235,115][i])), pv=1, pouring=false, draining=false, tilt=0, t=0;
  const dots=Array.from({length:22},(_,i)=>({u:i/22,j:Math.random()}));
  wireSeg(wrap,'pv',v=>pv=+v);
  $('#pour').onclick=()=>{ pouring=!pouring; draining=false; };
  $('#drain').onclick=()=>{ draining=!draining; pouring=false; };
  $('#reset').onclick=()=>{ V=[0,1,2].map(i=>Vof(i,[55,235,115][i])); pouring=draining=false; };
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const sc=Math.min(w/800,h/560,1.25), yb=h*0.8, pipeH=22*sc, xs=[w*0.2,w*0.5,w*0.8];
    // physics (a few sub-steps keeps the exchange smooth)
    let q=[0,0,0];
    for(let s=0;s<3;s++){
      const L=V.map((v,i)=>Lof(i,v)), M=(L[0]+L[1]+L[2])/3, d=dt/3;
      q=L.map(l=>120*(l-M));
      for(let i=0;i<3;i++) V[i]-=q[i]*d;
      if(pouring){ V[pv]+=3600*d; }
      if(draining){ const tot=V[0]+V[1]+V[2]; if(tot>400) for(let i=0;i<3;i++) V[i]-=3200*d*V[i]/tot; }
      V=V.map(v=>Math.max(30,v));
    }
    const L=V.map((v,i)=>Lof(i,v));
    if(pouring && L[pv]>=HB*0.95) pouring=false;
    $('#pour').textContent=pouring?'■ Stop':'💧 Pour'; $('#drain').classList.toggle('active',draining);
    // vessels
    const wAt=(i,Lb)=>(SH[i].w0+SH[i].k*Lb)*sc;
    const mean=(L[0]+L[1]+L[2])/3;
    for(let i=0;i<3;i++){
      const x=xs[i], Lpx=L[i]*sc, Hv=HB*sc;
      const poly=()=>{ ctx.beginPath(); ctx.moveTo(x-wAt(i,0)/2,yb+pipeH); ctx.lineTo(x-wAt(i,0)/2,yb); ctx.lineTo(x-wAt(i,HB)/2,yb-Hv); ctx.lineTo(x+wAt(i,HB)/2,yb-Hv); ctx.lineTo(x+wAt(i,0)/2,yb); ctx.lineTo(x+wAt(i,0)/2,yb+pipeH); ctx.closePath(); };
      liquid(ctx,poly,x-wAt(i,HB)/2-2,x+wAt(i,HB)/2+2,yb-Lpx,yb+pipeH,t+i,1.2+Math.min(3,Math.abs(q[i])*0.02));
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.beginPath();
      ctx.moveTo(x-wAt(i,0)/2,yb+pipeH); ctx.lineTo(x-wAt(i,0)/2,yb); ctx.lineTo(x-wAt(i,HB)/2,yb-Hv);
      ctx.moveTo(x+wAt(i,0)/2,yb+pipeH); ctx.lineTo(x+wAt(i,0)/2,yb); ctx.lineTo(x+wAt(i,HB)/2,yb-Hv); ctx.stroke(); ctx.restore();
      textAt(ctx,'ABC'[i],x,yb+pipeH+22,{size:14,align:'center',weight:700,color:COL.ink});
      const hcm=L[i]/HB*60;
      pill(ctx,x,yb+pipeH+50,'h = '+fmt(hcm,0)+' cm  ·  ρgh = '+fmt(1000*G*hcm/100/1000,1)+' kPa','#2f8fe0','center');
    }
    // common level
    line(ctx,xs[0]-wAt(0,0)/2-12,yb-mean*sc,xs[2]+wAt(2,mean)/2+12,yb-mean*sc,COL.yellow,1.8,[8,5]);
    // base pipe
    const pL=xs[0]-wAt(0,0)/2-14, pR=xs[2]+wAt(2,0)/2+14;
    ctx.save(); ctx.fillStyle=FL_BLUE; ctx.fillRect(pL,yb,pR-pL,pipeH); ctx.restore();
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.beginPath();
    ctx.moveTo(pL,yb+pipeH); ctx.lineTo(pR,yb+pipeH); ctx.moveTo(pL,yb); ctx.lineTo(pL,yb+pipeH); ctx.moveTo(pR,yb); ctx.lineTo(pR,yb+pipeH);
    ctx.moveTo(pL,yb); ctx.lineTo(xs[0]-wAt(0,0)/2,yb); ctx.moveTo(xs[0]+wAt(0,0)/2,yb); ctx.lineTo(xs[1]-wAt(1,0)/2,yb);
    ctx.moveTo(xs[1]+wAt(1,0)/2,yb); ctx.lineTo(xs[2]-wAt(2,0)/2,yb); ctx.moveTo(xs[2]+wAt(2,0)/2,yb); ctx.lineTo(pR,yb); ctx.stroke(); ctx.restore();
    // flow dots (green) — velocity follows the real q in each pipe section
    dots.forEach(d=>{
      let x=pL+8+d.u*(pR-pL-16); const qq=x<xs[1]?q[0]:-q[2];
      x+=qq*0.012*dt*(1+0.0)+gauss()*3*dt; d.u=clamp((x-pL-8)/(pR-pL-16),0,1);
      if(Math.abs(qq)>2 && (d.u>=1||d.u<=0)) d.u=qq>0?0:1;
      circ(ctx,x,yb+pipeH/2+(d.j-0.5)*8,2.8,COL.green,COL.green,1);
    });
    // tap
    const tx=w*0.35, ty=yb+pipeH;
    line(ctx,tx,ty,tx,ty+10,COL.ink,3); rect(ctx,tx-9,ty+8,18,7,draining?COL.yellow:COL.ink,'#fff',2.2);
    if(draining) for(let k=0;k<3;k++){ const p=((t*1.6+k/3)%1); circ(ctx,tx,ty+18+p*26,2.4,COL.blue,COL.blue,1); }
    // jug
    tilt=approach(tilt,pouring?0.95:0,5,dt);
    const jc=Math.cos(tilt), js=Math.sin(tilt), jx=xs[pv]+(30*jc+26*js)*sc, jy=yb-HB*sc-(70+0)*sc;
    ctx.save(); ctx.translate(jx,jy); ctx.rotate(-tilt); ctx.scale(sc,sc);
    ctx.beginPath(); ctx.moveTo(-30,-26); ctx.lineTo(30,-26); ctx.lineTo(24,26); ctx.lineTo(-24,26); ctx.closePath();
    ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30,-18); ctx.quadraticCurveTo(52,-14,44,12); ctx.stroke();
    ctx.beginPath(); ctx.rect(-26,-24+Math.max(0,28*(1-Math.min(1,tilt*0.4))),52,60); ctx.save(); ctx.clip(); ctx.fillStyle=FL_BLUE; ctx.fillRect(-28,-6,56,40); ctx.restore();
    ctx.restore();
    if(tilt>0.5){ const lx=jx+(-30*jc-26*js)*sc, ly=jy+(30*js-26*jc)*sc, ysurf=yb-L[pv]*sc;
      ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=3; ctx.setLineDash([9,5]); ctx.lineDashOffset=-t*90; ctx.beginPath(); ctx.moveTo(lx,ly+2); ctx.lineTo(lx,ysurf); ctx.stroke(); ctx.restore(); }
    K.put('la',fmt(L[0]/HB*60,0)+' cm'); K.put('lb',fmt(L[1]/HB*60,0)+' cm'); K.put('lc',fmt(L[2]/HB*60,0)+' cm');
    const spread=Math.max(...L)-Math.min(...L);
    K.put('pp',spread<4?'Equal at the base':'Settling…');
    $('#pp').style.color=spread<4?'var(--f-green)':'var(--f-blue)';
  });
  return wrap;
}

/* =====================================================================
   4. BAROMETER & MANOMETER             (§9.2.3, Fig 9.5, eq. 9.8)
   Barometer: Pₐ = ρ g h   (760 mm Hg ≈ 1.013×10⁵ Pa, column is vertical
   height — tilting the tube only lengthens the column: h/cos θ).
   Manometer: gauge pressure P − Pₐ = ρ g h.
   ===================================================================== */
function buildA4(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Instrument', seg('mode',[['bar','Barometer'],['man','Manometer']],0)) +
    `<div id="barCtl">` + slider('pa','Atmospheric pressure',680,790,1,760) + slider('tilt','Tilt the tube',0,60,1,0) +
      group('Liquid', seg('bl',[['hg','Mercury'],['wa','Water']],0)) + `</div>` +
    `<div id="manCtl" class="hidden">` + slider('pg','Gas pressure − Pₐ',-15,15,0.5,6) +
      group('Liquid', seg('ml',[['hg','Mercury'],['wa','Water'],['oil','Oil']],0)) + `</div>` +
    cards([{l:'Height h',id:'c1',col:'var(--f-yellow)'},{l:'Pressure',id:'c2',col:'var(--f-blue)'},{l:'Absolute',id:'c3',wide:true}]) +
    hintBox('Barometer: Pₐ = ρ g h &nbsp;·&nbsp; Manometer: P − Pₐ = ρ g h');
  let mode='bar', bl='hg', ml='hg', t=0;
  const RHO={hg:13600,wa:1000,oil:800};
  const lc={x:0.76,v:0}, dh={x:0,v:0}, piston={x:0.6,v:0}, tiltS={x:0,v:0};
  const parts=Array.from({length:64},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*160,vy:(Math.random()-0.5)*160}));
  let nAct=30;
  wireSeg(wrap,'mode',v=>{ mode=v; $('#barCtl').classList.toggle('hidden',v!=='bar'); $('#manCtl').classList.toggle('hidden',v!=='man'); });
  wireSeg(wrap,'bl',v=>bl=v); wireSeg(wrap,'ml',v=>ml=v);
  const canvas=$('canvas');
  const lab=(id,tx)=>{ const e=$('#'+id); e.previousElementSibling.textContent=tx; };
  function drawBar(ctx,w,h,dt){
    const mm=K.v('pa'), th=K.v('tilt')*Math.PI/180, rho=RHO[bl], Lreal=bl==='hg'?1.0:12;
    const Pa=mm*133.322, hm=Pa/(rho*G);
    springTo(tiltS,th,70,11,dt); const T=tiltS.x;
    const lcT=Math.min(Lreal, hm/Math.cos(th));
    springTo(lc,lcT,85,11,dt);
    const tr0=w*0.1, tr1=w*0.66, ys=h*0.84, yb=h*0.94, px=w*0.38, pxm=h*0.7/Lreal;
    const colFill=bl==='hg'?'rgba(129,149,171,0.55)':FL_BLUE, colLn=bl==='hg'?'#5b6f86':COL.blue;
    K.put('paV',mm+' mm Hg'); K.put('tiltV',Math.round(T*180/Math.PI)+'°');
    lab('c1','Column height (vertical)'); lab('c2','Pressure'); lab('c3','Length along tube');
    const hv=lc.x*Math.cos(T);
    K.put('c1',hv>=1?fmt(hv,2)+' m':fmt(hv*100,1)+' cm'); K.put('c2',fmt(Pa/1000,1)+' kPa · '+mm+' mm Hg'); K.put('c3',lc.x>=1?fmt(lc.x,2)+' m':fmt(lc.x*100,1)+' cm');
    // trough
    const trPath=()=>{ ctx.beginPath(); ctx.rect(tr0,ys,tr1-tr0,yb-ys); };
    liquid(ctx,trPath,tr0,tr1,ys,yb,t,1.2,colFill,colLn);

    // h marker (yellow): vertical from trough surface to column top
    const topX=px+Math.sin(T)*lcp, topY=ys-Math.cos(T)*lcp, mx=px+Math.max(60,Math.sin(T)*Lt+46);
    line(ctx,topX+12,topY,mx+8,topY,COL.yellow,1.6,[5,4]); line(ctx,px+14,ys,mx+8,ys,COL.yellow,1.6,[5,4]);

    pill(ctx,mx+10,(topY+ys)/2,'h = '+(hv>=1?fmt(hv,2)+' m':fmt(hv*100,1)+' cm'),COL.yellow);

    const step=bl==='hg'?0.1:1;
    for(let k=0;k*step<=Lreal+1e-6;k++){ const yy=ys-k*step*pxm; line(ctx,tr0-4,yy,tr0+8,yy,COL.ink,1.2); if(bl==='hg'?k%2===0:true) textAt(ctx,bl==='hg'?(k*10)+' cm':k+' m',tr0-8,yy+4,{size:9.5,align:'right',color:COL.muted,weight:600}); }
  }
  function drawMan(ctx,w,h,dt){
    const Pg=K.v('pg')*1000, rho=RHO[ml], hm=Pg/(rho*G);

    const Pabs=PATM+Pg, tgtP=0.82*PATM/Pabs; springTo(piston,tgtP,120,14,dt);
    K.put('pgV',fmt(Pg/1000,1)+' kPa');
    lab('c1','Height difference h'); lab('c2','Gauge pressure'); lab('c3','Absolute pressure');
    K.put('c1',Math.abs(hm)>=1?fmt(Math.abs(hm),2)+' m':fmt(Math.abs(hm)*100,1)+' cm'); K.put('c2',fmt(Pg/1000,1)+' kPa'); K.put('c3',fmt(Pabs/1000,1)+' kPa');

    line(ctx,xl-lw_/2+1,yl,xl+lw_/2-1,yl,colFill,3); line(ctx,xr-lw_/2+1,yr,xr+lw_/2-1,yr,colFill,3);
    // cylinder + piston
    ctx.save(); ctx.fillStyle='#fff'; ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(x0,cyT); ctx.lineTo(xe,cyT); ctx.lineTo(xe,cyB+4); ctx.moveTo(x0,cyB); ctx.lineTo(xl-lw_/2,cyB); ctx.stroke(); ctx.restore();
    const xp=xe-(xe-x0)*piston.x;
    rect(ctx,xp-8,cyT+2,8,cyB-cyT-4,COL.ink,'#fff',2.6);
    line(ctx,xp-8,(cyT+cyB)/2,x0-26,(cyT+cyB)/2,COL.ink,3); rect(ctx,x0-34,cyT+4,8,cyB-cyT-8,COL.ink,'#fff',2.4);
    const fa=Math.sign(Pg||1)*(14+Math.abs(Pg)/15000*50);
    if(Math.abs(Pg)>200) vec(ctx,fa>0?x0-34-fa-12:x0-34-12+0,(cyT+cyB)/2,fa>0?x0-36:x0-34-12-Math.abs(fa),(cyT+cyB)/2,COL.red,4);

    vec(ctx,xr,yr-aR-34,xr,yr-8,COL.blue,3); textAt(ctx,'Pₐ',xr+14,yr-aR-20,{size:14,weight:700,color:COL.blue});

    line(ctx,xl+lw_/2+4,yl,xr+lw_/2+44,yl,COL.yellow,1.6,[5,4]); line(ctx,xr+lw_/2+4,yr,xr+lw_/2+44,yr,COL.yellow,1.6,[5,4]);

  }
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    if(mode==='bar') drawBar(ctx,w,h,dt); else drawMan(ctx,w,h,dt);
  });
  return wrap;
}

/* =====================================================================
   5. HYDRAULIC LIFT                    (§9.2.4, Fig 9.6, Examples 9.5–9.6)
   P = F₁/A₁ everywhere → F₂ = F₁·A₂/A₁ ;  d₂ = d₁·A₁/A₂ (volume conserved)
   Check: r₁ = 5 cm, r₂ = 15 cm, car 1350 kg → F₁ = 1470 N.
   ===================================================================== */
function drawCar(ctx,cx,by,s,load){
  const L=load>2000;
  ctx.save(); ctx.translate(cx,by); ctx.scale(s,s); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff'; ctx.lineWidth=2.6/s;
  ctx.beginPath();
  if(!L){ ctx.moveTo(-70,-12); ctx.lineTo(-70,-34); ctx.lineTo(-44,-38); ctx.lineTo(-28,-62); ctx.lineTo(24,-62); ctx.lineTo(46,-38); ctx.lineTo(70,-34); ctx.lineTo(70,-12); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-22,-58); ctx.lineTo(-36,-38); ctx.lineTo(0,-38); ctx.lineTo(0,-58); ctx.closePath(); ctx.moveTo(6,-58); ctx.lineTo(6,-38); ctx.lineTo(40,-38); ctx.lineTo(22,-58); ctx.closePath(); ctx.stroke(); }
  else { ctx.rect(-90,-80,120,66); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(30,-14); ctx.lineTo(30,-60); ctx.lineTo(58,-60); ctx.lineTo(76,-36); ctx.lineTo(80,-14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(36,-54); ctx.lineTo(54,-54); ctx.lineTo(68,-36); ctx.lineTo(36,-36); ctx.closePath(); ctx.stroke(); }
  [L?[-60,-12]:[-40,-12],L?[-20,-12]:[0,-12],L?[54,-12]:[42,-12]].slice(0,L?3:2).forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.stroke(); });
  ctx.restore();
}
function buildA5(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    slider('f','Push on small piston F₁',0,3000,10,1600) +
    slider('r','Large piston radius r₂',5,30,0.5,15) +
    group('Load', seg('ld',[['1350','Car 1350 kg'],['4000','Truck 4000 kg']],0)) +
    `<div class="btn-row"><button class="toggle-btn play" id="pump">⟳ Pump</button><button class="toggle-btn" id="rel">Release</button></div>` +
    cards([{l:'F₁ needed',id:'c1',col:'var(--f-red)'},{l:'Lifting force F₂',id:'c2',col:'var(--f-red)'},{l:'Mechanical advantage',id:'c3'},{l:'Lift height',id:'c4',col:'var(--f-green)'}]) +
    hintBox('F₂ = F₁ × A₂/A₁ &nbsp;·&nbsp; small r₁ = 5 cm');
  let pumping=true, load=1350, rel=false, s=0, D2=0, phase='down', t=0, shake=0;
  wireSeg(wrap,'ld',v=>load=+v);
  $('#pump').onclick=()=>{ pumping=!pumping; };
  $('#rel').onclick=()=>{ rel=true; };
  const canvas=$('canvas');
  const S1=12, DMAX=14;
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const F1=K.v('f'), r2=K.v('r'), r1=5, ratio=r2/r1, A=ratio*ratio, need=load*G/A, can=F1>=need;
    // pump physics
    shake=approach(shake,0,6,dt);
    if(rel){ D2-=6*dt; if(D2<=0){ D2=0; rel=false; } }
    if(pumping && !rel){
      if(phase==='down'){
        if(can && D2<DMAX){ const ds=Math.min(26*dt,S1-s); s+=ds; D2=Math.min(DMAX,D2+ds/A); if(s>=S1-1e-6) phase='up'; }
        else if(!can) shake=1;
      } else { s-=45*dt; if(s<=0){ s=0; phase='down'; } }
    } else { s=Math.max(0,s-45*dt); phase='down'; }
    $('#pump').classList.toggle('red',pumping&&!can); $('#pump').textContent=pumping?'■ Stop pumping':'⟳ Pump';
    K.put('fV',F1+' N'); K.put('rV',fmt(r2,1)+' cm');
    K.put('c1',fmt(need,0)+' N'); K.put('c2',fmt(F1*A/1000,1)+' kN'); K.put('c3','× '+fmt(A,1)); K.put('c4',fmt(D2,1)+' cm');
    $('#c1').style.color=can?'var(--f-green)':'var(--f-red)';
    // geometry
    const sc=Math.min(w/800,h/560,1.3), ws=44*sc, wb=ws*ratio, xS=w*0.16, xB=w*0.64+ (wb>200?-20:0);
    const ycT=h*0.48, ycB=h*0.78, pH=24*sc, pxcm=6*sc;
    const pS=ycT+16*sc+s*pxcm, pB=ycB-14*sc-D2*pxcm, th=12*sc;
    // fluid
    ctx.save(); ctx.fillStyle=FL_BLUE;
    ctx.fillRect(xS-ws/2,pS+th,ws,ycB+pH-pS-th); ctx.fillRect(xS-ws/2,ycB,xB-xS+wb/2+ws/2,pH); ctx.fillRect(xB-wb/2,pB+th,wb,ycB+pH-pB-th); ctx.restore();
    // walls
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.beginPath();
    ctx.moveTo(xS-ws/2,ycT); ctx.lineTo(xS-ws/2,ycB+pH); ctx.lineTo(xB+wb/2,ycB+pH); ctx.lineTo(xB+wb/2,ycT);
    ctx.moveTo(xS+ws/2,ycT); ctx.lineTo(xS+ws/2,ycB); ctx.lineTo(xB-wb/2,ycB); ctx.lineTo(xB-wb/2,ycT); ctx.stroke(); ctx.restore();
    // small piston + handle
    const sh=(Math.random()-0.5)*5*shake;
    rect(ctx,xS-ws/2+2,pS,ws-4,th,COL.ink,'#fff',2.6);
    const hy=pS-h*0.2+sh; line(ctx,xS,pS,xS,hy,COL.ink,5); rect(ctx,xS-24*sc,hy-10,48*sc,10,COL.ink,'#fff',2.4);
    const al=22+78*F1/3000; if(F1>0) vec(ctx,xS,hy-10-al,xS,hy-12,COL.red,4.5);
    textAt(ctx,'F₁',xS+ws/2+14,hy-10-al*0.55,{size:15,weight:700,color:COL.red});
    // big piston + platform + load
    rect(ctx,xB-wb/2+2,pB,wb-4,th,COL.ink,'#fff',2.6);

    const pw=Math.max(wb,100*sc)+30*sc; rect(ctx,xB-pw/2,plat,pw,10,COL.ink,'#fff',2.6);
    drawCar(ctx,xB,plat,1.05*sc*(load>2000?1.0:1.15),load);
    const fl=14+Math.min(110,(F1*A/3000/6)*60+14); vec(ctx,xB-pw/2-14,pB+8,xB-pw/2-14,pB-fl,COL.red,4); textAt(ctx,'F₂',xB-pw/2-26,pB-fl*0.5,{size:15,weight:700,color:COL.red,align:'right'});
    // pressure arrows inside (blue)
    for(let k=0;k<3;k++){ const p=0.5+0.5*Math.sin(t*3+k); ctx.save(); ctx.globalAlpha=0.9; vec(ctx,xS-ws/2+6,ycB+pH/2,xB-wb/2-6+0*k, ycB+pH/2,COL.blue,1.8); ctx.restore(); break; }
    textAt(ctx,'P',(xS+xB)/2,ycB+pH+22,{size:14,weight:700,color:COL.blue,align:'center'});
    // strokes badge
    pill(ctx,xS+ws/2+16,pS+th+22,'d₁ = '+fmt(s,1)+' cm',COL.yellow);
    if(D2>0.05||s>0.05) pill(ctx,xB+pw/2-4,pB+th+22,'lifted '+fmt(D2,1)+' cm',COL.green,'right');
    if(pumping&&!can) pill(ctx,xS,ycT-h*0.3,'push harder — F₁ < '+fmt(need,0)+' N',COL.red,'center');
    // weight arrow (red) on the load
    const wl=40+20*load/4000*3; vec(ctx,xB+pw/2+16,plat-40,xB+pw/2+16,plat-40+wl,COL.red,3.4); textAt(ctx,'mg',xB+pw/2+26,plat-40+wl*0.55,{size:13,weight:700,color:COL.red});
  });
  return wrap;
}

/* =====================================================================
   6. STREAMLINE FLOW & CONTINUITY      (§9.3, eq. 9.10–9.11, Fig 9.7–9.8)
   A₁v₁ = A₂v₂ = constant  (A ∝ width in this line diagram).
   Narrow → streamlines crowd → speed rises.  Very fast flow turns turbulent.
   ===================================================================== */
function buildA6(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    slider('v','Inlet speed v₀',0.2,3,0.1,1) +
    slider('n','Narrow part: area ratio A_R / A_P',0.25,1,0.01,0.45) +
    `<button class="toggle-btn row" id="dye">💧 Inject dye</button>` +
    cards([{l:'Speed at P',id:'cp'},{l:'Speed at R',id:'cr',col:'var(--f-green)'},{l:'Speed at Q',id:'cq'},{l:'A × v (flow rate)',id:'cf',col:'var(--f-blue)'},{l:'Flow',id:'ct',wide:true}],'three') +
    hintBox('A<sub>P</sub>v<sub>P</sub> = A<sub>R</sub>v<sub>R</sub> = A<sub>Q</sub>v<sub>Q</sub>');
  $('.result-cards').classList.add('three');
  const canvas=$('canvas'), FR=[-0.84,-0.56,-0.28,0,0.28,0.56,0.84], NP=15;
  let dye=false, t=0, turbS=0;
  const P=[]; FR.forEach((f,li)=>{ for(let i=0;i<NP;i++) P.push({li,f,u:(i+Math.random()*0.5)/NP,o:0,dye:false}); });
  $('#dye').onclick=e=>{ dye=!dye; e.currentTarget.classList.toggle('play',dye); P.forEach(p=>p.dye=dye&&p.li>=2&&p.li<=4); };
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const v0=K.v('v'), rr=K.v('n'), px0=w*0.04, px1=w*0.96, yc=h*0.46, hw0=h*0.2, hwR=hw0*rr, Lx=px1-px0;
    const bump=u=>smoothstep(0.3,0.42,u)*(1-smoothstep(0.6,0.72,u));
    const hwAt=u=>hw0-(hw0-hwR)*bump(u);
    const vmax=v0/rr, turb=smoothstep(4,7,vmax); turbS=approach(turbS,turb,3,dt);
    K.put('vV',fmt(v0,1)+' m/s'); K.put('nV',fmt(rr,2));
    K.put('cp',fmt(v0,2)+' m/s'); K.put('cr',fmt(v0/rr,2)+' m/s'); K.put('cq',fmt(v0,2)+' m/s'); K.put('cf',fmt(v0,2)+' L/s');
    K.put('ct',turbS>0.5?'Turbulent — streamlines break up':'Steady · streamlines')+0; $('#ct').style.color=turbS>0.5?'var(--f-red)':'var(--f-green)';
    // pipe
    ctx.save(); ctx.beginPath(); for(let x=px0;x<=px1;x+=6){ const u=(x-px0)/Lx; x===px0?ctx.moveTo(x,yc-hwAt(u)):ctx.lineTo(x,yc-hwAt(u)); }
    for(let x=px1;x>=px0;x-=6){ const u=(x-px0)/Lx; ctx.lineTo(x,yc+hwAt(u)); } ctx.closePath(); ctx.fillStyle='rgba(47,143,224,0.07)'; ctx.fill(); ctx.restore();
    // streamlines
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.5; ctx.globalAlpha=0.55*(1-turbS*0.85);
    FR.forEach(f=>{ ctx.beginPath(); for(let x=px0;x<=px1;x+=6){ const u=(x-px0)/Lx, y=yc+f*hwAt(u); x===px0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); }); ctx.restore();
    // walls
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3.2; ctx.lineJoin='round';
    [-1,1].forEach(s=>{ ctx.beginPath(); for(let x=px0;x<=px1;x+=6){ const u=(x-px0)/Lx, y=yc+s*hwAt(u); x===px0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); }); ctx.restore();
    // eddies behind the constriction
    if(turbS>0.2){ [-1,1].forEach(s=>{ const u=0.78, x=px0+u*Lx, y=yc+s*hwAt(u)*0.62, r=8+14*turbS;
      ctx.save(); ctx.strokeStyle=COL.blue; ctx.globalAlpha=0.7*turbS; ctx.lineWidth=1.8; ctx.beginPath(); for(let a=0;a<Math.PI*3.4;a+=0.2){ const rr2=r*(a/(Math.PI*3.4)); const th=a*s*1.0+t*5*s; a?ctx.lineTo(x+Math.cos(th)*rr2,y+Math.sin(th)*rr2):ctx.moveTo(x,y); } ctx.stroke(); ctx.restore(); }); }
    // particles
    P.forEach(p=>{
      const u=p.u, x=px0+u*Lx, hwx=hwAt(u), sp=v0*92*hw0/hwx;
      p.u+=sp*dt/Lx; if(p.u>1){ p.u-=1; p.o=0; }
      const ramp=smoothstep(0.42,0.62,u);
      p.o+=(-p.o*1.6)*dt + turbS*ramp*gauss()*1.9*Math.sqrt(dt);
      const fy=clamp(p.f+p.o,-0.93,0.93);
      circ(ctx,x,yc+fy*hwx,3.2,p.dye?COL.red:COL.green,p.dye?COL.red:COL.green,1);
    });
    // cross-section planes P, R, Q (yellow) with speed arrows (green) + area bars (blue)
    [['P',0.14,v0],['R',0.51,v0/rr],['Q',0.86,v0]].forEach(([nm,u,v])=>{
      const x=px0+u*Lx, hh=hwAt(u);
      line(ctx,x,yc-hh-4,x,yc+hh+4,COL.yellow,2.4,[6,4]);
      pill(ctx,x,yc-hw0-26,nm,COL.yellow,'center');
      dimArrow(ctx,x+14,yc-hh,yc+hh,COL.blue);
      const ay=yc+hw0+36, al=8+9.5*v; vec(ctx,x-4,ay,x-4+al,ay,COL.green,3.4);
      textAt(ctx,fmt(v,1)+' m/s',x-4,ay+19,{size:12,weight:700,color:COL.green});
    });
    textAt(ctx,'flow →',px0+6,yc-hw0-12,{size:11,weight:600,color:COL.muted});
  });
  return wrap;
}

/* =====================================================================
   7. BERNOULLI'S PRINCIPLE             (§9.4, eq. 9.12–9.13, Fig 9.9)
   P + ½ρv² + ρgy = constant.   Open vertical tubes read the pressure.
   P₁ = 40 kPa gauge at the inlet; A₃ = A₁ so v₃ = v₁.
   ===================================================================== */
function buildA7(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    slider('v','Inlet speed v₁',0.5,3,0.1,1.5) +
    slider('r','Squeeze: A₁ / A₂',1,3,0.05,2) +
    slider('z','Raise the outlet',0,1.5,0.05,0.5) +
    cards([{l:'P₁ · v₁',id:'c1',col:'var(--f-blue)'},{l:'P₂ · v₂',id:'c2',col:'var(--f-blue)'},{l:'P₃ · v₃',id:'c3',col:'var(--f-blue)'},{l:'P + ½ρv² + ρgy',id:'c4',col:'var(--f-yellow)',wide:true}]) +
    hintBox('Faster water → lower pressure');
  const canvas=$('canvas'), RHO=1000, PIN=40e3, LN=[-0.55,0,0.55], NP=13;
  const hs=[0,0,0].map(()=>({x:6,v:0}));
  const P=[]; LN.forEach((f,li)=>{ for(let i=0;i<NP;i++) P.push({f,u:Math.random()}); });
  let t=0, first=true;
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const v1=K.v('v'), r=K.v('r'), dz=K.v('z');
    const px0=w*0.05, px1=w*0.95, Lx=px1-px0, yP=h*0.62, hwW=h*0.075, hwN=hwW/r, pxm=h*0.5/6;
    const bump=u=>smoothstep(0.3,0.38,u)*(1-smoothstep(0.48,0.56,u));
    const hwAt=u=>hwW-(hwW-hwN)*bump(u);
    const ycAt=u=>yP-dz*pxm*smoothstep(0.62,0.80,u);
    const st=[0.16,0.43,0.88], vv=[v1,v1*r,v1], zz=[0,0,dz];
    const E=PIN+0.5*RHO*v1*v1;
    const Ps=vv.map((v,i)=>PIN+0.5*RHO*(v1*v1-v*v)-RHO*G*zz[i]);
    const heads=Ps.map(p=>p/(RHO*G));
    if(first){ first=false; }
    hs.forEach((s,i)=>springTo(s,heads[i],110,12,dt));
    K.put('vV',fmt(v1,1)+' m/s'); K.put('rV',fmt(r,2)); K.put('zV',fmt(dz,2)+' m');
    [0,1,2].forEach(i=>K.put('c'+(i+1),fmt(Ps[i]/1000,1)+' kPa · '+fmt(vv[i],1)+' m/s'));
    K.put('c4',fmt(E/1000,1)+' kPa  (same at 1, 2, 3)');
    // pipe body
    ctx.save(); ctx.beginPath(); for(let x=px0;x<=px1;x+=6){ const u=(x-px0)/Lx; x===px0?ctx.moveTo(x,ycAt(u)-hwAt(u)):ctx.lineTo(x,ycAt(u)-hwAt(u)); }
    for(let x=px1;x>=px0;x-=6){ const u=(x-px0)/Lx; ctx.lineTo(x,ycAt(u)+hwAt(u)); } ctx.closePath(); ctx.fillStyle='rgba(47,143,224,0.14)'; ctx.fill(); ctx.restore();
    // piezometer tubes
    const tt=h*0.06;
    st.forEach((u,i)=>{
      const x=px0+u*Lx, yc=ycAt(u), topWall=yc-hwAt(u), surf=yc-hs[i].x*pxm;
      ctx.save(); ctx.fillStyle='rgba(47,143,224,0.30)'; ctx.fillRect(x-6,surf,12,topWall-surf+2); ctx.restore();
      line(ctx,x-6,surf,x+6,surf+Math.sin(t*3+i)*1.1,COL.blue,2.6);
      line(ctx,x-6,tt,x-6,topWall,COL.ink,2.6); line(ctx,x+6,tt,x+6,topWall,COL.ink,2.6);
      pill(ctx,x,Math.max(tt-12,12),(['P₁','P₂','P₃'][i])+' '+fmt(Ps[i]/1000,0)+' kPa',COL.blue,'center');
    });
    // total-head line (yellow) = what Bernoulli keeps constant
    const yE=yP-(E/(RHO*G))*pxm;
    line(ctx,px0,yE,px1,yE,COL.yellow,1.8,[8,6]); textAt(ctx,'total',px1-6,yE-6,{size:11,weight:700,color:COL.yellow,align:'right'});
    // walls
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3.2; ctx.lineJoin='round';
    [-1,1].forEach(s=>{ ctx.beginPath(); for(let x=px0;x<=px1;x+=6){ const u=(x-px0)/Lx, y=ycAt(u)+s*hwAt(u); x===px0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); }); ctx.restore();
    // particles
    P.forEach(p=>{ const u=p.u, x=px0+u*Lx, hwx=hwAt(u), sp=v1*58*hwW/hwx; p.u+=sp*dt/Lx; if(p.u>1) p.u-=1; circ(ctx,x,ycAt(u)+p.f*hwx,3,COL.green,COL.green,1); });
    // speed arrows (green) + height guide (red)
    st.forEach((u,i)=>{ const x=px0+u*Lx, yc=ycAt(u), ay=yc+hwW+20; vec(ctx,x-4,ay,x-4+6+8*vv[i],ay,COL.green,3.2); textAt(ctx,fmt(vv[i],1)+' m/s',x-4,ay+17,{size:11.5,weight:700,color:COL.green}); });
    if(dz>0.02){ const x=px0+0.9*Lx+hwW*0.0+30; const xx=px0+0.95*Lx-4; dimArrow(ctx,xx-6,yP,yP-dz*pxm,COL.red); pill(ctx,xx-14,yP-dz*pxm*0.5,'Δy '+fmt(dz,2)+' m',COL.red,'right'); }
    // energy bars: pressure (blue) + ½ρv² (green) + ρgy (red) always add to the same height
    const base=h*0.97, bh=h*0.2, k=bh/50e3;
    st.forEach((u,i)=>{
      const x=px0+u*Lx-18, pe=RHO*G*zz[i], ke=0.5*RHO*vv[i]*vv[i], pp=Ps[i];
      let y=base; [[pp,COL.blue],[ke,COL.green],[pe,COL.red]].forEach(([val,col])=>{ const bhh=Math.max(0,val*k); ctx.fillStyle=col; ctx.globalAlpha=0.85; ctx.fillRect(x,y-bhh,36,bhh); ctx.globalAlpha=1; y-=bhh; });
      rect(ctx,x,base-E*k,36,E*k,COL.ink,null,1.6);
    });
    line(ctx,px0+st[0]*Lx-30,base-E*k,px0+st[2]*Lx+30,base-E*k,COL.yellow,1.6,[6,5]);
  });
  return wrap;
}

/* =====================================================================
   8. SPEED OF EFFLUX — TORRICELLI      (§9.4.1, eq. 9.15, Fig 9.10)
   v = √(2 g h),  fall time = √(2y/g),  range R = v·√(2y/g) = 2√(h·y)
