function buildA8(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    slider('L','Water level L',0.2,1,0.01,0.8) +
    slider('y','Hole height y',0.05,0.95,0.01,0.4) +
    `<div class="btn-row"><button class="toggle-btn" id="best">Best hole</button><button class="toggle-btn" id="drain">Drain</button></div>` +
    group('Speed', seg('sm',[['1','Real time'],['0.4','Slow-mo']],1)) +
    cards([{l:'Hole depth h',id:'c1',col:'var(--f-yellow)'},{l:'Speed v',id:'c2',col:'var(--f-green)'},{l:'Range R',id:'c3',col:'var(--f-red)',wide:true}]) +
    hintBox('v = √(2gh) &nbsp;·&nbsp; R = 2√(h·y₀) — longest when the hole is halfway between the surface and the ground');
  const canvas=$('canvas'); let sm=0.4, Lc=0.8, draining=false, t=0, drops=[], acc=0, rings=[];
  wireSeg(wrap,'sm',v=>sm=+v);
  $('#best').onclick=()=>{ draining=false; $('#drain').classList.remove('active'); K.setSlider('y',Math.max(0.05,(K.v('L')-0.4)/2).toFixed(2)); };
  $('#drain').onclick=e=>{ draining=!draining; e.currentTarget.classList.toggle('active',draining); if(!draining) return; if(Lc<K.v('y')+0.1) K.setSlider('L',0.9); };
  $('#L').addEventListener('input',()=>{ draining=false; $('#drain').classList.remove('active'); });
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const yg=h*0.93, pxm=Math.min(h*0.55,(w*0.6)/2.5), Z0=0.4;
    const yt0=yg-Z0*pxm, x0=w*0.22, tw=0.5*pxm, x1=x0+tw;
    let yh=K.v('y');
    if(draining){ const h_=Math.max(0,Lc-yh); Lc-=0.075*SQ(2*G*h_)*dt; if(Lc<yh+0.02){ Lc=yh+0.02; draining=false; $('#drain').classList.remove('active'); } K.setSlider('L',Lc.toFixed(3)); }
    else Lc=approach(Lc,K.v('L'),6,dt);
    yh=Math.min(yh,Lc-0.03); if(+K.v('y')>Lc-0.03) K.setSlider('y',Math.max(0.05,Lc-0.03));
    const hd=Math.max(0.0001,Lc-yh), v=SQ(2*G*hd), yAbs=Z0+yh, R=v*SQ(2*yAbs/G);
    K.put('LV',fmt(Lc,2)+' m'); K.put('yV',fmt(yh,2)+' m'); K.put('c1',fmt(hd,2)+' m'); K.put('c2',fmt(v,2)+' m/s'); K.put('c3',fmt(R,2)+' m');
    // ground + stand
    line(ctx,0,yg,w,yg,COL.ink,3);
    line(ctx,x0-12,yt0,x1+12,yt0,COL.ink,4); line(ctx,x0+10,yt0,x0+10,yg,COL.ink,3); line(ctx,x1-10,yt0,x1-10,yg,COL.ink,3);
    // tank
    const Ht=1.05*pxm, tankPath=()=>{ ctx.beginPath(); ctx.rect(x0,yt0-Ht,tw,Ht); };
    liquid(ctx,tankPath,x0,x1,yt0-Lc*pxm,yt0,t,1.4);
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3.2; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(x0,yt0-Ht); ctx.lineTo(x0,yt0); ctx.lineTo(x1,yt0); ctx.lineTo(x1,yt0-Ht); ctx.stroke(); ctx.restore();
    const hy=yt0-yh*pxm; rect(ctx,x1-2,hy-5,10,10,COL.yellow,'#fff',2.4);
    // depth marker
    const dxm=x0-16; dimArrow(ctx,dxm,yt0-Lc*pxm,hy,COL.yellow); line(ctx,dxm,hy,x1,hy,COL.yellow,1.2,[4,4]); pill(ctx,dxm-6,(yt0-Lc*pxm+hy)/2,'h = '+fmt(hd,2)+' m',COL.yellow,'right');
    // jet: ideal path guide + real droplets that carry their own launch speed
    const sx=x1+8, ctr=[]; ctx.save(); ctx.strokeStyle=COL.blue; ctx.globalAlpha=0.28; ctx.lineWidth=2; ctx.beginPath();
    for(let tt=0;tt<=SQ(2*yAbs/G)+0.001;tt+=0.01){ const X=sx+v*tt*pxm, Y=hy+0.5*G*tt*tt*pxm; tt?ctx.lineTo(X,Y):ctx.moveTo(X,Y); } ctx.stroke(); ctx.restore();
    acc+=dt*110; while(acc>=1){ acc-=1; drops.push({a:0,v,y0:hy}); }
    drops=drops.filter(d=>{
      d.a+=dt*sm; const X=sx+d.v*d.a*pxm, Y=d.y0+0.5*G*d.a*d.a*pxm;
      if(Y>=yg){ if(Math.random()<0.1) rings.push({x:X,a:0}); return false; }
      circ(ctx,X,Y,2.7,COL.blue,COL.blue,1); return true; });
    rings=rings.filter(r=>{ r.a+=dt*sm*2.2; if(r.a>1) return false; ctx.save(); ctx.globalAlpha=1-r.a; ctx.strokeStyle=COL.blue; ctx.lineWidth=1.8; ctx.beginPath(); ctx.ellipse(r.x,yg,6+r.a*18,2+r.a*4,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); return true; });
    // velocity arrow at the hole (green) + range on the ground (red)
    vec(ctx,sx+2,hy-12,sx+2+Math.min(100,14*v),hy-12,COL.green,3.6); textAt(ctx,'v',sx+Math.min(100,14*v)*0.5,hy-20,{size:14,weight:700,color:COL.green,align:'center'});
    const rx=sx+R*pxm;
    line(ctx,sx,yg+14,rx,yg+14,COL.red,2.4); line(ctx,sx,yg+8,sx,yg+20,COL.red,2.4); line(ctx,rx,yg+8,rx,yg+20,COL.red,2.4);
    pill(ctx,(sx+rx)/2,yg-18,'R = '+fmt(R,2)+' m',COL.red,'center');
    textAt(ctx,'y',x1+22,(hy+yt0)/2+4,{size:13,weight:700,color:COL.yellow}); dimArrow2(ctx,x1+14,hy,yt0,COL.yellow);
  });
  function dimArrow2(ctx,x,y1,y2,c){ line(ctx,x,y1,x,y2,c,1.4); arrowHead(ctx,x,y1,-Math.PI/2,c,5); arrowHead(ctx,x,y2,Math.PI/2,c,5); }
  return wrap;
}

/* =====================================================================
   9. DYNAMIC LIFT                      (§9.4.2, Fig 9.11, Example 9.7)
   Aerofoil: potential flow past a Joukowski wing with the Kutta condition
   (Γ = 4πUR sin α).  Pressure difference ΔP = ½ρ(v₂² − v₁²) = ρ v_av (v₂ − v₁).
   Check (Ex 9.7): 960 km/h, wing 500 m², weight 3.3×10⁵ kg → ΔP ≈ 6.5 kPa
   (v₂−v₁ ≈ 8 % of v_av); here the preset α = 1.2° gives lift ≈ weight.
   Ball: Magnus push  a = κ·ω·v  perpendicular to the velocity.
   ===================================================================== */
const JK={mu:[-0.17,0], R:1.17, c:4.08};
function cx_mul(a,b){ return [a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]]; }
function cx_div(a,b){ const d=b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d]; }
function cx_sqrt(a){ const r=Math.hypot(a[0],a[1]); const re=Math.sqrt(Math.max(0,(r+a[0])/2)); let im=Math.sqrt(Math.max(0,(r-a[0])/2)); if(a[1]<0) im=-im; return [re,im]; }
/* velocity (u,v) at a point z of the wing plane for unit free-stream at angle al to the chord */
function joukV(x,y,al,Gam){
  const z2=cx_mul([x,y],[x,y]); const s=cx_sqrt([z2[0]-4,z2[1]]);
  const z1=[(x+s[0])/2,(y+s[1])/2], z3=[(x-s[0])/2,(y-s[1])/2];
  const zeta=Math.hypot(z1[0],z1[1])>=Math.hypot(z3[0],z3[1])?z1:z3;
  const d=[zeta[0]-JK.mu[0],zeta[1]-JK.mu[1]], dd=Math.hypot(d[0],d[1]);
  if(dd<JK.R*1.002) return null;
  const R2=JK.R*JK.R, ea=[Math.cos(al),-Math.sin(al)], eb=[Math.cos(al),Math.sin(al)];
  const d2=cx_mul(d,d), t2=cx_div(eb,d2);
  let dw=[ea[0]-R2*t2[0], ea[1]-R2*t2[1]];
  const g=cx_div([0,Gam/(2*Math.PI)],d); dw=[dw[0]+g[0],dw[1]+g[1]];
  const zz=cx_mul(zeta,zeta), dz=[1-cx_div([1,0],zz)[0], -cx_div([1,0],zz)[1]];
  const cv=cx_div(dw,dz);
  const m=Math.hypot(cv[0],cv[1]); const lim=3.2, f=m>lim?lim/m:1;
  return [cv[0]*f,-cv[1]*f];
}
function rot2(x,y,th){ const c=Math.cos(th), s=Math.sin(th); return [x*c-y*s, x*s+y*c]; }

function buildA9(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Show', seg('md',[['wing','Aerofoil'],['ball','Spinning ball']],0)) +
    `<div id="wingCtl">` + slider('sp','Air speed',200,1100,10,960) + slider('al','Angle of attack α',0,12,0.1,1.2) +
      `<button class="toggle-btn navy row" id="cruise" style="margin-top:0">✈ Cruise (Ex 9.7)</button></div>` +
    `<div id="ballCtl" class="hidden">` + slider('bv','Throw speed',10,30,1,25) + slider('bw','Spin ω (+ back · − top)',-3000,3000,100,2000) +
      group('Speed', seg('bsm',[['1','Real time'],['0.35','Slow-mo']],1)) + `</div>` +
    cards([{l:'—',id:'c1',col:'var(--f-green)'},{l:'—',id:'c2',col:'var(--f-blue)'},{l:'—',id:'c3',wide:true}]) +
    hintBox('Faster air → lower pressure → net push');
  const canvas=$('canvas');
  let mode='wing', t=0, cacheKey='', lines=[], bsm=0.35, wingY={x:0,v:0}, Gdraw=0;
  const NL=12, PTS=[]; for(let i=0;i<NL;i++) for(let j=0;j<11;j++) PTS.push({i,s:Math.random()*0.99,x:0,y:0,init:false});
  const seeds=Array.from({length:NL},(_,i)=>(i-(NL-1)/2)*0.36);
  // ball
  const B={x:1.2,y:2,vx:25,vy:0,alive:false,wait:0,trail:[],ang:0,t:0}; let relaunch=true;
  wireSeg(wrap,'md',v=>{ mode=v; $('#wingCtl').classList.toggle('hidden',v!=='wing'); $('#ballCtl').classList.toggle('hidden',v!=='ball'); relaunch=true; });
  wireSeg(wrap,'bsm',v=>bsm=+v);
  ['bv','bw'].forEach(id=>$('#'+id).addEventListener('input',()=>relaunch=true));
  $('#cruise').onclick=()=>{ K.setSlider('sp',960); K.setSlider('al',1.2); };
  const lab=(id,tx)=>{ $('#'+id).previousElementSibling.textContent=tx; };
  const WT=3.3e5*G, AW=500, RHOA=1.2;

  function drawWing(ctx,w,h,dt){
    const vk=K.v('sp'), al=K.v('al')*Math.PI/180, vms=vk/3.6;
    const sinA=Math.sin(al), Gam=4*Math.PI*JK.R*sinA;
    const Cl=2*Gam/JK.c, dP=0.5*RHOA*vms*vms*Cl, LW=dP*AW/WT;
    const vav=vms, dv=dP/(RHOA*vav);
    K.put('spV',vk+' km/h'); K.put('alV',fmt(K.v('al'),1)+'°');
    lab('c1','Lift ÷ weight'); lab('c2','Pressure difference ΔP'); lab('c3','Speed over top · under bottom');
    K.put('c1',fmt(LW,2)+(LW>1.03?'  ▲ climbs':LW<0.97?'  ▼ sinks':'  = level')); K.put('c2',fmtP(dP)); K.put('c3',fmt((vav+dv/2)*3.6,0)+' · '+fmt((vav-dv/2)*3.6,0)+' km/h');
    // tunnel
    const wl=18, wr=w-18, wt=h*0.1, wb=h*0.9;
    line(ctx,wl,wt,wr,wt,COL.ink,3); line(ctx,wl,wb,wr,wb,COL.ink,3);
    const k=w*0.42/JK.c, cx0=w*0.5, cy0=h*0.52;
    springTo(wingY,clamp(-(LW-1)*52,-120,120),70,10,dt);
    const cx=cx0, cy=cy0+wingY.x;
    // streamlines (cached on α)
    const key=al.toFixed(4);
    if(key!==cacheKey){ cacheKey=key; lines=[];
      const xL=-(cx-wl)/k, xR=(wr-cx)/k;
      seeds.forEach(y0=>{ let p=[xL,y0], pts=[[p[0],p[1]]]; for(let n=0;n<700;n++){
          const zp=rot2(p[0],p[1],al), V=joukV(zp[0],zp[1],al,Gam); if(!V) break;
          const Vd=rot2(V[0],V[1],-al), m=Math.hypot(Vd[0],Vd[1]); if(m<1e-3) break;
          const ds=0.07, mid=[p[0]+Vd[0]/m*ds*0.5,p[1]+Vd[1]/m*ds*0.5];
          const zm=rot2(mid[0],mid[1],al), V2=joukV(zm[0],zm[1],al,Gam); if(!V2) break;
          const V2d=rot2(V2[0],V2[1],-al), m2=Math.hypot(V2d[0],V2d[1]); p=[p[0]+V2d[0]/m2*ds,p[1]+V2d[1]/m2*ds]; pts.push([p[0],p[1]]);
          if(p[0]>xR||Math.abs(p[1])>6) break; }
        lines.push(pts); });
    }
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.globalAlpha=0.5; ctx.lineWidth=1.5;
    lines.forEach(pts=>{ ctx.beginPath(); pts.forEach((q,i)=>{ const X=cx+q[0]*k, Y=cy-q[1]*k; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.stroke(); }); ctx.restore();
    // wing outline: circle → z = ζ + 1/ζ, then rotate by −α into the display frame
    ctx.beginPath(); for(let i=0;i<=120;i++){ const th=i/120*Math.PI*2, zr=JK.mu[0]+JK.R*Math.cos(th), zi=JK.mu[1]+JK.R*Math.sin(th), dd=zr*zr+zi*zi;
      const zx=zr+zr/dd, zy=zi-zi/dd, q=rot2(zx,zy,-al); const X=cx+q[0]*k, Y=cy-q[1]*k; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
    ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.stroke();
    // chord (yellow) + angle
    const le=rot2(-(JK.c-2),0,-al), te=rot2(2,0,-al), tx0=cx+te[0]*k, ty0=cy-te[1]*k;
    line(ctx,cx+le[0]*k-24,cy-le[1]*k+24*Math.tan(al),tx0+24,ty0-24*Math.tan(al),COL.yellow,1.6,[6,4]);
    line(ctx,tx0,ty0,tx0+70,ty0,COL.yellow,1.2,[3,3]);
    if(al>0.01){ ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(tx0,ty0,52,Math.PI-al,Math.PI); ctx.restore(); }
    if(al>0.01) textAt(ctx,'α = '+fmt(K.v('al'),1)+'°',tx0+80,ty0+4,{size:12,weight:700,color:COL.yellow});
    // particles advected through the same field
    const Upx=70+vk/1100*260;
    const xLeft=-(cx-wl)/k, xRight=(wr-cx)/k;
    PTS.forEach(p=>{
      if(!p.init){ p.x=xLeft+p.s*(xRight-xLeft); p.y=seeds[p.i]; p.init=true; }
      else if(p.x>xRight||Math.abs(p.y)>6){ p.x=xLeft; p.y=seeds[p.i]; }
      const zp=rot2(p.x,p.y,al), V=joukV(zp[0],zp[1],al,Gam); if(!V){ p.init=false; return; }
      const Vd=rot2(V[0],V[1],-al); p.x+=Vd[0]*Upx/k*dt; p.y+=Vd[1]*Upx/k*dt;
      circ(ctx,cx+p.x*k,cy-p.y*k,2.8,COL.green,COL.green,1);
    });
    // spring balance + force arrows
    const topY=wt+4, wy=cy-0.2*k*1.0;
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(cx,topY); const n=12, len=wy-topY-70;
    for(let i=0;i<=n;i++){ const yy=topY+14+(len-14)*i/n; ctx.lineTo(cx+(i%2?9:-9)*(i>0&&i<n?1:0),yy); } ctx.lineTo(cx,wy-56); ctx.stroke(); ctx.restore();
    line(ctx,cx,wy-56,cx,wy-18,COL.ink,2);
    const ll=Math.min(150,60*LW), wl2=60;
    vec(ctx,cx+110,cy,cx+110,cy-ll,COL.green,4.5); textAt(ctx,'Lift',cx+122,cy-ll*0.55,{size:13,weight:700,color:COL.green});
    vec(ctx,cx+110,cy,cx+110,cy+wl2,COL.red,4.5); textAt(ctx,'Weight',cx+122,cy+wl2*0.7,{size:13,weight:700,color:COL.red});
    // low / high pressure tags
    textAt(ctx,'faster · lower P',cx-0.9*k,cy-0.78*k,{size:11.5,weight:700,color:COL.blue,align:'center'});
    textAt(ctx,'slower · higher P',cx-0.9*k,cy+0.78*k+10,{size:11.5,weight:700,color:COL.blue,align:'center'});
    textAt(ctx,'wind →',wl+8,wt+18,{size:11,weight:600,color:COL.muted});
  }

  function drawBall(ctx,w,h,dt){
    const v0=K.v('bv'), om=K.v('bw')*Math.PI/30, KAP=1.1e-3;
    K.put('bvV',v0+' m/s'); K.put('bwV',(K.v('bw')>0?'back ':K.v('bw')<0?'top ':'')+Math.abs(K.v('bw'))+' rpm');
    lab('c1','Spin push a = κωv'); lab('c2','Falls to ground in'); lab('c3','Lands at (no spin dashed)');
    const x0=1.2, yTop=3.0, WORLD=28, pxm=(w*0.92)/WORLD, yg=h*0.86, X=m=>w*0.04+m*pxm, Y=m=>yg-m*pxm;
    const aM=KAP*om*v0;
    // launch
    if(relaunch){ relaunch=false; B.x=x0; B.y=yTop; B.vx=v0; B.vy=0; B.alive=true; B.trail=[]; B.t=0; B.wait=0; }
    // physics (real equations, played at the chosen time scale)
    if(B.alive){ let rem=dt*bsm; while(rem>0){ const d=Math.min(0.004,rem); rem-=d;
        const sp=Math.hypot(B.vx,B.vy), nx=-B.vy/sp, ny=B.vx/sp, a=KAP*om*sp;
        B.vx+=a*nx*d; B.vy+=(a*ny-G)*d; B.x+=B.vx*d; B.y+=B.vy*d; B.t+=d;
        if(B.y<=0||B.x>WORLD-1){ B.alive=false; B.y=Math.max(0,B.y); B.wait=0; break; } }
      if(Math.floor(B.t*60)!==B.lastK){ B.lastK=Math.floor(B.t*60); if(B.lastK%2===0) B.trail.push([B.x,B.y]); }
    } else { B.wait+=dt; if(B.wait>1.1) relaunch=true; }
    B.ang+=-(om/ (2*Math.PI) )*0.9*dt*Math.sign(1); // visual only: 1 turn ≈ 1.1 s at 3000 rpm ×…
    // no-spin reference
    const tg=SQ(2*yTop/G), Rn=x0+v0*tg;
    ctx.save(); ctx.strokeStyle=COL.mid; ctx.lineWidth=2; ctx.setLineDash([6,6]); ctx.beginPath();
    for(let tt=0;tt<=tg+0.001;tt+=0.01){ const xx=x0+v0*tt, yy=yTop-0.5*G*tt*tt; tt?ctx.lineTo(X(xx),Y(yy)):ctx.moveTo(X(xx),Y(yy)); } ctx.stroke(); ctx.restore();
    line(ctx,0,yg,w,yg,COL.ink,3);
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.4; ctx.beginPath(); B.trail.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1]))); ctx.lineTo(X(B.x),Y(B.y)); ctx.stroke(); ctx.restore();
    // thrower
    const hx=X(0.5); line(ctx,hx,yg,hx,Y(1.3),COL.ink,3); circ(ctx,hx,Y(1.65),9,COL.ink,'#fff',2.6); line(ctx,hx,Y(1.3),hx-14,yg,COL.ink,3); line(ctx,hx,Y(1.3),hx+10,yg,COL.ink,3); line(ctx,hx,Y(1.15),hx+22,Y(yTop-0.05),COL.ink,3);
    // ball
    const bx=X(B.x), by=Y(B.y), br=13; circ(ctx,bx,by,br,COL.ink,'#fff',2.8);
    ctx.save(); ctx.translate(bx,by); ctx.rotate(B.ang); ctx.strokeStyle=COL.red; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(-br*1.0,0,br*0.9,-0.9,0.9); ctx.moveTo(br*1.0+br*0.9*0,0); ctx.arc(br*1.0,0,br*0.9,Math.PI-0.9,Math.PI+0.9); ctx.stroke(); ctx.restore();
    // spin arrow (yellow) + vectors
    if(Math.abs(om)>1){ const dir=om>0?-1:1; ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.6; ctx.beginPath(); ctx.arc(bx,by,br+8,-2.4,0.6,dir<0); ctx.stroke(); ctx.restore();
      const ea=dir<0?-2.4:0.6; arrowHead(ctx,bx+Math.cos(ea)*(br+8),by+Math.sin(ea)*(br+8),ea+(dir<0?-Math.PI/2:Math.PI/2),COL.yellow,8); }
    const sp=Math.hypot(B.vx,B.vy), vl=Math.min(80,sp*2.2);
    if(B.alive){ vec(ctx,bx+br+10,by,bx+br+10+vl*B.vx/sp,by-vl*B.vy/sp,COL.blue,3);
      const a=KAP*om*sp, nx=-B.vy/sp, ny=B.vx/sp; if(Math.abs(a)>0.2) vec(ctx,bx,by-br-10,bx+a*nx*-0+0,by-br-10-a*ny*6,COL.green,3.6);
      vec(ctx,bx,by+br+8,bx,by+br+8+G*3.2,COL.red,3); }
    // air faster over the top (backspin) or under (topspin)
    textAt(ctx,om>50?'air faster on top → lift ↑':om<-50?'air faster below → push ↓':'no spin · plain arc',w*0.5,h*0.12,{size:13,weight:700,color:COL.blue,align:'center'});
    // landing marker
    const Rl=(B.alive?null:B.x);
    if(Rl!==null){ line(ctx,X(Rl),yg-10,X(Rl),yg+10,COL.red,3); }
    line(ctx,X(Rn),yg-6,X(Rn),yg+6,COL.mid,3);
    // readouts
    const tfall=B.alive?'…':fmt(B.t,2)+' s';
    K.put('c1',fmt(Math.abs(aM),1)+' m/s²'+(om>0?' ↑':om<0?' ↓':'')); K.put('c2',tfall); K.put('c3',B.alive?'…':fmt(B.x,1)+' m   (plain: '+fmt(Rn,1)+' m)');
  }
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    if(mode==='wing') drawWing(ctx,w,h,dt); else drawBall(ctx,w,h,dt);
  });
  return wrap;
}

/* =====================================================================
   10. VISCOSITY                        (§9.5, Fig 9.12–9.13, Example 9.8)
   η = (F/A)/(v/l).  Block pulled by a hanging mass:  (M+m)dv/dt = mg − (ηA/l)v
   → v(t) = v_t(1 − e^{−t/τ}),  v_t = mgl/(ηA).
   Check: A = 0.10 m², m = 10 g, l = 0.30 mm, η = 3.46×10⁻³ Pa s → v_t = 0.085 m/s.
   ===================================================================== */
function buildA10(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Liquid film', seg('lq',[['0.001','Water'],['0.113','Oil'],['0.83','Glycerine'],['0.00346','Ex 9.8']],3)) +
    slider('l','Film thickness l',0.1,1,0.05,0.3) + slider('m','Pulling mass m',5,100,1,10) + slider('A','Block area A',0.02,0.2,0.01,0.1) +
    group('Time', seg('tl',[['1','×1'],['10','×10'],['100','×100']],0)) +
    cards([{l:'Speed v',id:'c1',col:'var(--f-green)'},{l:'Shear stress F/A',id:'c2',col:'var(--f-red)'},{l:'Strain rate v/l',id:'c3'},{l:'η = (F/A) ÷ (v/l)',id:'c4',col:'var(--f-blue)'}]) +
    hintBox('Thicker liquid → more drag → slower');
  const canvas=$('canvas'); let eta=0.00346, TL=1, el=0, wait=0, t=0;
  const dots=[]; for(let j=0;j<5;j++) for(let i=0;i<7;i++) dots.push({j,u:Math.random()});
  const restart=()=>{ el=0; wait=0; };
  wireSeg(wrap,'lq',v=>{ eta=parseFloat(v); restart(); }); wireSeg(wrap,'tl',v=>{ TL=+v; restart(); });
  ['l','m','A'].forEach(id=>$('#'+id).addEventListener('input',restart));
  const MB=0.4;
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const lm=K.v('l')*1e-3, m=K.v('m')*1e-3, A=K.v('A');
    K.put('lV',fmt(K.v('l'),2)+' mm'); K.put('mV',K.v('m')+' g'); K.put('AV',fmt(A,2)+' m²');
    const Fw=m*G, cc=eta*A/lm, vt=Fw/cc, tau=(MB+m)/cc;
    const D=Math.min(w*0.34,h*0.3), pxm=1500;
    // time → closed-form motion
    if(wait>0){ wait-=dt; if(wait<=0) el=0; }
    else el+=dt;
    const ts=el*TL, vNow=vt*(1-Math.exp(-ts/tau)), xm=vt*(ts-tau*(1-Math.exp(-ts/tau)));
    let xpx=Math.min(D,xm*pxm); if(xm*pxm>=D && wait<=0) wait=0.8;
    K.put('c1',(vNow<0.01?fmt(vNow*1000,2):fmt(vNow*1000,1))+' mm/s'); K.put('c2',fmt(Fw/A,2)+' Pa'); K.put('c3',fmt(vNow/lm,1)+' s⁻¹'); K.put('c4',fmt(vNow>1e-9?(Fw/A)/(vNow/lm):eta,5)+' Pa·s');
    // layout
    const s=Math.min(w/640,h/420,1.5), bw=clamp(60+700*A,70,210)*s, bh=56*s, lpx=(12+56*K.v('l'))*s, ty=h*0.56, ox=Math.max(18,(w-(D+bw+110*s))/2), bx0=ox+16, bx=bx0+xpx, xp=bx0+D+bw+34*s, by=ty-lpx-bh;
    // table
    rect(ctx,ox,ty,xp-ox-14,14,COL.ink,'#fff',2.8); line(ctx,ox+20,ty+14,ox+20,h*0.9,COL.ink,3); line(ctx,xp-40,ty+14,xp-40,h*0.9,COL.ink,3);
    // film (blue) with a yellow outline (the thickness you set)
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.22)'; ctx.fillRect(ox+4,ty-lpx,xp-ox-22,lpx); ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6; ctx.setLineDash([5,4]); ctx.strokeRect(ox+4,ty-lpx,xp-ox-22,lpx); ctx.restore();
    dimArrow(ctx,ox-4,ty-lpx,ty,COL.yellow); textAt(ctx,'l',ox-14,ty-lpx/2+4,{size:13,weight:700,color:COL.yellow,align:'right'});
    // shear layers: layer j moves at (j/4)·v, bottom layer sticks to the table
    const rel=k=>k*vNow*pxm*TL*dt;
    dots.forEach(d=>{ const yy=ty-lpx*(d.j+0.5)/5; const sp=((d.j+0.5)/5)*vNow*pxm*TL;
      d.u+=sp*dt/bw; const xmin=bx, xx=xmin+((d.u%1)+1)%1*bw; circ(ctx,xx,yy,2.5,COL.blue,COL.blue,1); });
    // velocity profile arrows (green) inside the film
    const vlTop=clamp(8+360*vNow,8,110);
    for(let j=1;j<=4;j++){ const yy=ty-lpx*j/4+0*0, L=vlTop*j/4; vec(ctx,bx+bw*0.5,yy+ (j===4?2:0)-0,bx+bw*0.5+L,yy+(j===4?2:0),COL.green,2.2); }
    line(ctx,bx+bw*0.5,ty-lpx,bx+bw*0.5,ty,COL.green,1.2,[3,3]); line(ctx,bx+bw*0.5,ty,bx+bw*0.5+vlTop,ty-lpx,COL.green,1.2,[3,3]);
    // block
    rect(ctx,bx,by,bw,bh,COL.ink,'#fff',3); textAt(ctx,'M',bx+bw/2,by+bh/2+5,{size:15,weight:700,color:COL.ink,align:'center'});
    dimArrow2h(ctx,bx,bx+bw,by-12,COL.yellow); textAt(ctx,'A = '+fmt(A,2)+' m²',bx+bw/2,by-20,{size:12,weight:700,color:COL.yellow,align:'center'});
    // string, pulley, hanging mass
    const ym=by+bh/2, pr=17*s, py=ym+pr, drop=xpx;
    line(ctx,bx+bw,ym,xp,ym,COL.ink,2); circ(ctx,xp,py,pr,COL.ink,'#fff',2.8); circ(ctx,xp,py,3,COL.ink,COL.ink,1);
    for(let k=0;k<4;k++){ const a=t*0+drop*0.06+k*Math.PI/2; line(ctx,xp,py,xp+Math.cos(a)*(pr-3),py+Math.sin(a)*(pr-3),COL.mid,1.4); }
    const mt=py+34*s+drop, mh=(22+K.v('m')*0.3)*s;
    line(ctx,xp+pr,py,xp+pr,mt,COL.ink,2); rect(ctx,xp+pr-16,mt,32,mh,COL.red,'#fff',3); textAt(ctx,'m',xp+pr,mt+mh/2+5,{size:14,weight:700,color:COL.red,align:'center'});
    vec(ctx,xp+pr+30,mt+mh/2-6,xp+pr+30,mt+mh/2+34,COL.red,3.4); textAt(ctx,'mg',xp+pr+38,mt+mh/2+22,{size:12,weight:700,color:COL.red});
    // F on block (red)
    vec(ctx,bx+bw+4,ym-bh*0.22,bx+bw+4+36,ym-bh*0.22,COL.red,3.4); textAt(ctx,'F',bx+bw+14,ym-bh*0.22-8,{size:13,weight:700,color:COL.red});
    // table ticks
    for(let x=ox+10;x<xp-30;x+=24) line(ctx,x,ty+14,x,ty+19,COL.mid,1.2);
  });
  function dimArrow2h(ctx,x1,x2,y,c){ line(ctx,x1,y,x2,y,c,1.6); arrowHead(ctx,x1,y,Math.PI,c,5); arrowHead(ctx,x2,y,0,c,5); }
  return wrap;
}

/* =====================================================================
   11. STOKES' LAW — TERMINAL VELOCITY  (§9.5.1, eq. 9.17–9.18, Example 9.9)
   m dv/dt = (ρ − σ)Vg − 6πηa v  →  v(t) = v_t(1 − e^{−t/τ}),
   v_t = 2a²(ρ − σ)g / 9η ,  τ = 2a²ρ / 9η   (exact exponential step per frame)
   Check: a = 2 mm, ρ = 8.9×10³, σ = 1.5×10³, η = 0.99 → v_t = 6.5×10⁻² m/s.
   ===================================================================== */
function buildA11(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Liquid', seg('fl',[['0.113|900','Oil'],['0.83|1260','Glycerine'],['0.2|1420','Honey'],['0.99|1500','Ex 9.9']],3)) +
    slider('a','Ball radius a',0.5,4,0.1,2) + slider('r','Ball density ρ',1600,9000,100,8900) +
    `<div class="btn-row"><button class="toggle-btn play" id="drop">▼ Drop</button></div>` +
    group('Speed', seg('sm',[['1','Real time'],['0.3','Slow-mo']],0)) +
    cards([{l:'Terminal speed vₜ',id:'c1',col:'var(--f-green)'},{l:'Settling time τ',id:'c2'},{l:'Speed now',id:'c3',col:'var(--f-blue)',wide:true}]) +
    hintBox('vₜ = 2a²(ρ − σ)g ÷ 9η');
  const canvas=$('canvas'); let eta=0.99, sig=1500, sm=1, t=0;
  const S={y:0.02,v:0,t:0,done:false,hist:[],bounce:{x:0,v:0},wait:0};
  const HC=0.4;
  const reset=()=>{ S.y=0.02; S.v=0; S.t=0; S.done=false; S.hist=[[0,0]]; S.bounce={x:0,v:0}; S.wait=0; };
  reset();
  wireSeg(wrap,'fl',v=>{ const p=v.split('|'); eta=+p[0]; sig=+p[1]; reset(); }); wireSeg(wrap,'sm',v=>sm=+v);
  ['a','r'].forEach(id=>$('#'+id).addEventListener('input',reset)); $('#drop').onclick=reset;
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const a=K.v('a')*1e-3, rho=K.v('r'), vt=2*a*a*(rho-sig)*G/(9*eta), tau=2*a*a*rho/(9*eta);
    K.put('aV',fmt(K.v('a'),1)+' mm'); K.put('rV',rho+' kg/m³');
    K.put('c1',fmt(vt,3)+' m/s'); K.put('c2',tau<0.1?fmt(tau*1000,1)+' ms':fmt(tau,2)+' s'); K.put('c3',fmt(S.v,3)+' m/s'+(S.done?'  (landed)':''));
    if(!S.done){ let rem=dt*sm; const e=Math.exp(-rem/tau);
      S.y+=vt*rem+(S.v-vt)*tau*(1-e); S.v=vt+(S.v-vt)*e; S.t+=rem;
      if(S.hist.length===0||S.t-S.hist[S.hist.length-1][0]>0.01*Math.max(0.2,Math.min(8,HC/vt))) S.hist.push([S.t,S.v]);
      if(S.y>=HC-0.02){ S.y=HC-0.02; S.done=true; S.bounce.v=-Math.min(60,S.v*160); S.hist.push([S.t,S.v]); S.wait=0; S.vEnd=S.v; S.v=0; } }
    else { springTo(S.bounce,0,300,14,dt); S.wait+=dt; if(S.wait>1.8) reset(); }
    // tank
    const sc=Math.min(w/760,1.3), tx=w*0.2, tw=84*sc, ytop=h*0.07, ybot=h*0.93, pxm=(ybot-ytop-10)/HC;
    liquid(ctx,()=>{ ctx.beginPath(); ctx.rect(tx-tw/2,ytop+10,tw,ybot-ytop-10); },tx-tw/2,tx+tw/2,ytop+14,ybot,t,1.2,'rgba(217,160,23,0.16)',COL.yellow);
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(tx-tw/2,ytop); ctx.lineTo(tx-tw/2,ybot); ctx.lineTo(tx+tw/2,ybot); ctx.lineTo(tx+tw/2,ytop); ctx.stroke(); ctx.restore();
    for(let k=0;k<=8;k++){ const yy=ytop+10+k*(ybot-ytop-10)/8; line(ctx,tx-tw/2-8,yy,tx-tw/2,yy,COL.ink,1.4); if(k%2===0) textAt(ctx,fmt(HC*k/8*100,0)+' cm',tx-tw/2-12,yy+4,{size:10,align:'right',color:COL.muted,weight:600}); }
    // ball
    const br=7+4.2*K.v('a'), by=ytop+10+S.y*pxm+(S.done?S.bounce.x:0);
    circ(ctx,tx,by,br,COL.ink,mixCol('#ffffff','#8195ab',clamp((rho-1600)/7400,0,1)),2.8);
    // wake lines show the drag layer
    const vf=S.done?0:S.v/Math.max(vt,1e-9);
    for(let k=0;k<3;k++){ const yy=by-br-8-k*10-(t*60*vf)%10; ctx.save(); ctx.globalAlpha=0.5*vf*(1-k*0.25); line(ctx,tx-6-k*3,yy,tx+6+k*3,yy,COL.blue,1.6); ctx.restore(); }
    // force arrows: weight − buoyancy (red ↓), drag (blue ↑), velocity (green)
    const fx=tx+tw/2+26, fl=46;
    vec(ctx,fx,by,fx,by+fl,COL.red,3.8); textAt(ctx,'W − B',fx+8,by+fl*0.7,{size:12,weight:700,color:COL.red});
    vec(ctx,fx,by,fx,by-Math.max(2,fl*vf),COL.blue,3.8); textAt(ctx,'drag',fx+8,by-fl*vf*0.5-2,{size:12,weight:700,color:COL.blue});
    const gx=tx-tw/2-84; vec(ctx,gx,by-24,gx,by-24+Math.max(4,Math.min(90,S.v/Math.max(vt,1e-9)*60)),COL.green,3.8); textAt(ctx,'v',gx+8,by-8,{size:13,weight:700,color:COL.green});
    // v–t graph
    const gx0=w*0.5, gy0=h*0.12, gw=w*0.44, gh=h*0.62;
    line(ctx,gx0,gy0,gx0,gy0+gh,COL.ink,2); line(ctx,gx0,gy0+gh,gx0+gw,gy0+gh,COL.ink,2);
    textAt(ctx,'v',gx0-6,gy0+6,{size:13,weight:700,color:COL.green,align:'right'}); textAt(ctx,'t',gx0+gw+6,gy0+gh+4,{size:13,weight:700,color:COL.muted});
    const Tmax=6*tau, Vmax=Math.max(vt*1.2,1e-6);
    const GX=tt=>gx0+gw*clamp(tt/Tmax,0,1), GY=vv=>gy0+gh-gh*vv/Vmax;
    line(ctx,gx0,GY(vt),gx0+gw,GY(vt),COL.yellow,1.8,[7,5]); pill(ctx,gx0+gw,GY(vt)-14,'vₜ = '+fmt(vt,3)+' m/s',COL.yellow,'right');
    ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=3; ctx.beginPath(); for(let k=0;k<=60;k++){ const tt=Tmax*k/60, X=GX(tt), Y=GY(vt*(1-Math.exp(-tt/tau))); k?ctx.lineTo(X,Y):ctx.moveTo(X,Y); } ctx.stroke(); ctx.restore();
    { const tn=S.done?S.t:S.t, vn=S.done?S.vEnd:S.v; circ(ctx,GX(tn),GY(vn),6,COL.red,COL.red,1); }
    line(ctx,GX(tau),gy0+gh,GX(tau),gy0+gh+8,COL.ink,2); textAt(ctx,'τ',GX(tau),gy0+gh+22,{size:12,weight:700,color:COL.muted,align:'center'});
  });
  return wrap;
}

/* =====================================================================
   12. SURFACE TENSION — SOAP FILM ON A FRAME   (§9.6.1–9.6.2, eq. 9.19–9.21)
   A film has two surfaces → pull F = 2Sl, independent of how far it is stretched.
   Net force F − mg moves the bar; speed settles with drag (exact exponential step).
   Check: S = F/2l (eq. 9.20); soap S ≈ 0.025 N/m, water 0.0727 N/m (Table 9.3).
   ===================================================================== */
function buildA12(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Liquid film', seg('lq',[['0.025','Soap'],['0.0227','Ethanol'],['0.0727','Water']],0)) +
    slider('l','Bar length l',1,8,0.5,5) + slider('m','Hanging mass m',0,1.5,0.01,0.2) +
    `<button class="toggle-btn navy row" id="bal" style="margin-top:0">⚖ Balance it</button>` +
    cards([{l:'Film pulls 2Sl',id:'c1',col:'var(--f-blue)'},{l:'Weight mg',id:'c2',col:'var(--f-red)'},{l:'Result',id:'c3',wide:true},{l:'Surface energy F·d',id:'c4',wide:true}]) +
    hintBox('S = F ÷ 2l');
  const canvas=$('canvas'); let S=0.025, t=0;
  const st={d:0.06,u:0}; const HTOT=0.12, MB=0.0003;
  wireSeg(wrap,'lq',v=>S=parseFloat(v));
  $('#bal').onclick=()=>{ const F=2*S*K.v('l')*0.01; K.setSlider('m',clamp(F/G*1000,0,1.5).toFixed(2)); };
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const lm=K.v('l')*0.01, m=K.v('m')*1e-3, F=2*S*lm, Wt=m*G, Fn=F-Wt;
    // exact exponential relaxation to the drag-limited speed (up positive)
    const CD=8*F+0.005, uInf=Fn/CD, tau=(m+MB)/CD, e=Math.exp(-dt/tau);
    st.d-= uInf*dt+(st.u-uInf)*tau*(1-e); st.u=uInf+(st.u-uInf)*e;
    if(st.d<0.004){ st.d=0.004; st.u=Math.max(0,st.u*-0.0); } if(st.d>HTOT){ st.d=HTOT; st.u=Math.min(0,st.u*-0.0); }
    K.put('lV',fmt(K.v('l'),1)+' cm'); K.put('mV',fmt(K.v('m'),2)+' g');
    K.put('c1',fmt(F*1000,2)+' mN'); K.put('c2',fmt(Wt*1000,2)+' mN');
    const bal=Math.abs(Fn)<0.015*F;
    K.put('c3',bal?'Balanced — bar stays':Fn>0?'Film wins → bar rises':'Weight wins → film stretches'); $('#c3').style.color=bal?'var(--f-green)':Fn>0?'var(--f-blue)':'var(--f-red)';
    K.put('c4',fmt(F*st.d*1e6,0)+' µJ  (S × area)');
    // geometry
    const pxcm=h*0.062, lpx=lm*100*pxcm, cx=w*0.42, ytop=h*0.1, yb=ytop+st.d*100*pxcm;
    // film
    ctx.save(); ctx.beginPath(); ctx.rect(cx-lpx/2,ytop,lpx,yb-ytop); ctx.clip();
    ctx.fillStyle='rgba(47,143,224,0.14)'; ctx.fillRect(cx-lpx/2,ytop,lpx,yb-ytop);
    for(let k=0;k<7;k++){ const yy=ytop+((k/7+t*0.05)%1)*(yb-ytop); ctx.strokeStyle=['rgba(47,143,224,.35)','rgba(31,157,85,.30)','rgba(217,160,23,.30)'][k%3]; ctx.lineWidth=2; ctx.beginPath(); for(let x=cx-lpx/2;x<=cx+lpx/2;x+=6) ctx.lineTo(x,yy+Math.sin(x*0.05+t*2+k)*3); ctx.stroke(); }
    ctx.restore();
    // frame (rails go down to the limit)
    const yEnd=ytop+HTOT*100*pxcm+14;
    line(ctx,cx-lpx/2,ytop,cx-lpx/2,yEnd,COL.ink,3.4); line(ctx,cx+lpx/2,ytop,cx+lpx/2,yEnd,COL.ink,3.4);
    rect(ctx,cx-lpx/2-8,ytop-10,lpx+16,10,COL.ink,'#fff',2.8);
    // sliding bar
    rect(ctx,cx-lpx/2-10,yb-3,lpx+20,7,COL.ink,'#fff',2.8);
    // film pull (blue ↑ at both ends) and weight (red ↓)
    const fl=14+Math.min(80,F*1000*7);
    [-1,1].forEach(s=>vec(ctx,cx+s*(lpx/2+22),yb,cx+s*(lpx/2+22),yb-fl,COL.blue,3.6)); textAt(ctx,'S',cx+lpx/2+34,yb-fl*0.6,{size:14,weight:700,color:COL.blue});
    // pan + mass
    const py=yb+34; line(ctx,cx,yb+4,cx,py,COL.ink,2); const pw=34+m*1000*0.022;
    rect(ctx,cx-pw/2,py,pw,12+Math.min(34,m*1000*0.05),COL.red,'#fff',2.8); textAt(ctx,'m',cx,py+(12+Math.min(34,m*1000*0.05))/2+5,{size:13,weight:700,color:COL.red,align:'center'});
    const wl=14+Math.min(80,Wt*1000*7); vec(ctx,cx+pw/2+16,py,cx+pw/2+16,py+wl,COL.red,3.6); textAt(ctx,'mg',cx+pw/2+26,py+wl*0.6,{size:13,weight:700,color:COL.red});
    // l label and film depth
    dimArrow2c(ctx,cx-lpx/2,cx+lpx/2,ytop-22,COL.yellow); textAt(ctx,'l = '+fmt(K.v('l'),1)+' cm',cx,ytop-30,{size:12,weight:700,color:COL.yellow,align:'center'});
    pill(ctx,cx-lpx/2-46,(ytop+yb)/2,'d = '+fmt(st.d*100,1)+' cm',COL.yellow,'right');
    // cross-section inset: two surfaces → factor 2
    const ix=w*0.8, iy=h*0.3; ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ix-50,iy-7); ctx.lineTo(ix+50,iy-7); ctx.moveTo(ix-50,iy+7); ctx.lineTo(ix+50,iy+7); ctx.stroke(); ctx.restore();
    [-1,1].forEach(s=>vec(ctx,ix+22,iy+s*7,ix-14,iy+s*7,COL.blue,2.4)); textAt(ctx,'2 surfaces',ix,iy+34,{size:11.5,weight:700,color:COL.blue,align:'center'});
  });
  function dimArrow2c(ctx,x1,x2,y,c){ line(ctx,x1,y,x2,y,c,1.6); arrowHead(ctx,x1,y,Math.PI,c,5); arrowHead(ctx,x2,y,0,c,5); }
  return wrap;
}

/* =====================================================================
   13. DROPS & BUBBLES                  (§9.6.4, eq. 9.25–9.26, Example 9.10)
   Drop / bubble in a liquid: ΔP = 2S/r.  Soap bubble (two faces): ΔP = 4S/r.
   Check: air bubble r = 1 mm, 8 cm deep in water: Pₒ = 1.01784×10⁵ Pa, ΔP = 146 Pa.
   ===================================================================== */
function buildA13(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Bubble type', seg('ty',[['soap','Soap bubble'],['air','Air in water'],['drop','Water drop']],0)) +
    slider('r','Radius r',0.2,5,0.1,1.5) +
    cards([{l:'Excess pressure ΔP',id:'c1',col:'var(--f-red)'},{l:'Pressure inside',id:'c2',col:'var(--f-blue)'},{l:'Pressure outside',id:'c3'},{l:'S',id:'c4'}]) +
    hintBox('Smaller bubble → bigger ΔP &nbsp;·&nbsp; ΔP = 2S/r or 4S/r');
  const canvas=$('canvas'); let ty='soap', t=0; const rs={x:20,v:0}, wob={x:0,v:0}; let lastR=1.5;
  wireSeg(wrap,'ty',v=>ty=v);
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const rmm=K.v('r'), S={soap:0.025,air:0.0727,drop:0.0727}[ty], f=ty==='soap'?4:2;
    const dP=f*S/(rmm*1e-3), Po=PATM+(ty==='air'?1000*G*0.08:0), Pi=Po+dP;
    K.put('rV',fmt(rmm,1)+' mm'); K.put('c1',fmt(dP,0)+' Pa'); K.put('c2',fmt(Pi/1000,3)+' kPa'); K.put('c3',fmt(Po/1000,3)+' kPa'+(ty==='air'?'  (8 cm deep)':'')); K.put('c4',S+' N/m');
    const rt=20+28*rmm; springTo(rs,rt,46,5.2,dt); const rp=Math.max(6,rs.x);
    const eps=clamp(rs.v*0.0009,-0.14,0.14)+0.012*Math.sin(t*6.2);
    const cx=w*0.42, cy=h*(ty==='drop'?0.45:0.46);
    // environment
    if(ty==='air'){ const ys=h*0.1; ctx.save(); ctx.fillStyle=FL_BLUE; ctx.fillRect(w*0.06,ys,w*0.72,h*0.86); ctx.restore(); line(ctx,w*0.06,ys,w*0.78,ys,COL.blue,2.4);
      dimArrow(ctx,w*0.09,ys,cy,COL.yellow); pill(ctx,w*0.095,(ys+cy)/2,'8 cm',COL.yellow); textAt(ctx,'Pₐ',w*0.7,ys-8,{size:13,weight:700,color:COL.blue}); for(let k=0;k<4;k++) vec(ctx,w*0.62+k*18,ys-30,w*0.62+k*18,ys-4,COL.blue,2); }
    // supply tube
    const tubeW=14; ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3;
    if(ty==='drop'){ line(ctx,cx-tubeW/2,h*0.04,cx-tubeW/2,cy-rp*(1-eps)-4,COL.ink,3); line(ctx,cx+tubeW/2,h*0.04,cx+tubeW/2,cy-rp*(1-eps)-4,COL.ink,3); }
    else { line(ctx,cx-tubeW/2,h*0.96,cx-tubeW/2,cy+rp*(1-eps)-2,COL.ink,3); line(ctx,cx+tubeW/2,h*0.96,cx+tubeW/2,cy+rp*(1-eps)-2,COL.ink,3);
      for(let k=0;k<3;k++){ const yy=h*0.9-((t*60+k*30)%100); vec(ctx,cx,yy+10,cx,yy-6,COL.blue,2.2); } }
    ctx.restore();
    // the bubble / drop (slightly squashed while it grows or shrinks)
    ctx.save(); ctx.translate(cx,cy); ctx.beginPath(); ctx.ellipse(0,0,rp*(1+eps),rp*(1-eps),0,0,Math.PI*2);
    ctx.fillStyle=ty==='air'?'#fff':ty==='drop'?'rgba(47,143,224,0.2)':'rgba(255,255,255,0.6)'; ctx.fill(); ctx.strokeStyle=ty==='drop'?COL.blue:COL.ink; ctx.lineWidth=ty==='soap'?2:3; ctx.stroke();
    if(ty==='soap'){ ctx.beginPath(); ctx.ellipse(0,0,rp*(1+eps)-3.5,rp*(1-eps)-3.5,0,0,Math.PI*2); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.4; ctx.stroke(); }
    ctx.restore();
    // skin contracts (red ←) and the inside pushes back (blue →)
    const na=10, al=14+Math.min(60,dP/700*80);
    for(let k=0;k<na;k++){ const a=k/na*Math.PI*2+0.3, c=Math.cos(a), s=Math.sin(a);
      vec(ctx,cx+c*(rp+30),cy+s*(rp+30),cx+c*(rp+3),cy+s*(rp+3),COL.red,2.6); }
    for(let k=0;k<na;k++){ const a=k/na*Math.PI*2+0.3+Math.PI/na, c=Math.cos(a), s=Math.sin(a); if(rp>al+14) vec(ctx,cx+c*(rp-al-6),cy+s*(rp-al-6),cx+c*(rp-6),cy+s*(rp-6),COL.blue,2.6); }
    textAt(ctx,'S',cx+rp+36,cy-rp*0.7,{size:13,weight:700,color:COL.red}); textAt(ctx,'Pᵢ',cx,cy+5,{size:15,weight:700,color:COL.blue,align:'center'});
    // radius marker
    line(ctx,cx,cy,cx+rp*0.7,cy+rp*0.7,COL.yellow,2); pill(ctx,cx+rp*0.7+6,cy+rp*0.7+10,'r = '+fmt(rmm,1)+' mm',COL.yellow);
    // ΔP–r graph
    const gx=w*0.8, gy=h*0.2, gw=w*0.17, gh=h*0.5; line(ctx,gx,gy,gx,gy+gh,COL.ink,2); line(ctx,gx,gy+gh,gx+gw,gy+gh,COL.ink,2);
    textAt(ctx,'ΔP',gx-5,gy+8,{size:12,weight:700,color:COL.red,align:'right'}); textAt(ctx,'r',gx+gw+4,gy+gh+4,{size:12,weight:700,color:COL.yellow});
    const dmax=f*S/0.2e-3; ctx.save(); ctx.strokeStyle=COL.red; ctx.lineWidth=2.6; ctx.beginPath();
    for(let r=0.2;r<=5.001;r+=0.1){ const X=gx+gw*(r-0.2)/4.8, Y=gy+gh-gh*(f*S/(r*1e-3))/dmax*0.92; r===0.2?ctx.moveTo(X,Y):ctx.lineTo(X,Y); } ctx.stroke(); ctx.restore();
    circ(ctx,gx+gw*(rmm-0.2)/4.8,gy+gh-gh*dP/dmax*0.92,6,COL.red,COL.red,1);
  });
  return wrap;
}

/* =====================================================================
   14. CAPILLARY RISE                   (§9.6.5, eq. 9.29, Fig 9.19)
   h = 2S cos θ / (ρ g a).   Check: water, a = 0.5 mm → h ≈ 2.98 cm
   (2.97 cm with S = 0.0727 N/m; the textbook rounds S to 0.073).
   Mercury (θ ≈ 140°) is pushed DOWN: cos θ < 0.

function buildA14(){
  const wrap=labShell(), K=kit(wrap), $=K.$;
  $('.lab-side').innerHTML =
    group('Liquid', seg('lq',[['wa','Water'],['et','Ethanol'],['hg','Mercury']],0)) +
    slider('a','Narrow tube radius a',0.1,1,0.05,0.5) +
    cards([{l:'h in a',id:'c1',col:'var(--f-blue)'},{l:'h in 2a',id:'c2',col:'var(--f-blue)'},{l:'h in 4a',id:'c3',col:'var(--f-blue)'},{l:'Contact angle θ',id:'c4',wide:true}],'three') +
    hintBox('h = 2S cosθ ÷ (ρ g a)');
  $('.result-cards').classList.add('three');
  const LQ={wa:{S:0.0727,rho:1000,th:0,col:COL.blue,fill:'rgba(47,143,224,0.30)'},et:{S:0.0227,rho:789,th:0,col:COL.green,fill:'rgba(31,157,85,0.22)'},hg:{S:0.465,rho:13600,th:140,col:'#5b6f86',fill:'rgba(129,149,171,0.55)'}};
  const canvas=$('canvas'); let lq='wa', t=0; const hs=[{x:0,v:0},{x:0,v:0},{x:0,v:0}];
  wireSeg(wrap,'lq',v=>lq=v);
  animLoop(dt=>{
    t+=dt; const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const L=LQ[lq], th=L.th*Math.PI/180, a0=K.v('a')*1e-3, rad=[a0,2*a0,4*a0];
    const hcm=rad.map(a=>2*L.S*Math.cos(th)/(L.rho*G*a)*100);
    hs.forEach((s,i)=>springTo(s,hcm[i],46,5.4,dt));
    K.put('aV',fmt(K.v('a'),2)+' mm'); hcm.forEach((v,i)=>K.put('c'+(i+1),fmt(v,2)+' cm')); K.put('c4',L.th+'°  ('+(L.th>90?'convex · liquid pushed down':'concave · liquid climbs')+')');
    const L0=h*0.62, pxcm=h*0.5/16, bx0=w*0.2, bx1=w*0.86, bb=L0+128, tb=L0+112, tt=h*0.12;
    // beaker + liquid
    ctx.save(); ctx.fillStyle=L.fill; ctx.fillRect(bx0,L0,bx1-bx0,bb-L0); ctx.restore();
    line(ctx,bx0,L0+Math.sin(t*2.5)*1.2,bx1,L0+Math.sin(t*2.5+1)*1.2,L.col,2.4);
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(bx0,L0-26); ctx.lineTo(bx0,bb); ctx.lineTo(bx1,bb); ctx.lineTo(bx1,L0-26); ctx.stroke(); ctx.restore();
    // ruler
    for(let c=0;c<=16;c++){ const yy=L0-c*pxcm; line(ctx,bx0-10,yy,bx0,yy,COL.ink,c%5?1:2); if(c%5===0) textAt(ctx,c+' cm',bx0-14,yy+4,{size:10.5,align:'right',color:COL.muted,weight:600}); }
    // tubes
    const xs=[w*0.34,w*0.54,w*0.74], wpx=[12,22,38];
    xs.forEach((x,i)=>{
      const hw_=wpx[i]/2, yL=L0-hs[i].x*pxcm;
      ctx.save(); ctx.fillStyle=L.fill; ctx.fillRect(x-hw_,yL,wpx[i],tb-yL); ctx.restore();
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.8; ctx.beginPath(); ctx.moveTo(x-hw_,tt); ctx.lineTo(x-hw_,tb); ctx.moveTo(x+hw_,tt); ctx.lineTo(x+hw_,tb); ctx.stroke(); ctx.restore();
      // meniscus
      const conc=Math.cos(th)>0, sag=Math.min(wpx[i]*0.55,hw_*(1-Math.sin(th))/Math.max(0.2,Math.abs(Math.cos(th)))*1);
      ctx.save(); ctx.strokeStyle=L.col; ctx.lineWidth=2.8; ctx.beginPath();
      for(let k=0;k<=16;k++){ const u=-1+k/8, xx=x+u*hw_, yy=conc?yL+sag*(1-u*u):yL-sag*(1-u*u)*0.9; k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); } ctx.stroke(); ctx.restore();
      textAt(ctx,['a','2a','4a'][i]+' = '+fmt(rad[i]*1000,2)+' mm',x,tt-12,{size:11.5,weight:700,color:COL.muted,align:'center'});
      if(i===0){ // h marker + contact angle
        const dxm=x+hw_+16; line(ctx,x+hw_,yL,dxm+14,yL,COL.yellow,1.4,[4,3]); line(ctx,x+hw_,L0,dxm+14,L0,COL.yellow,1.4,[4,3]); if(Math.abs(yL-L0)>2) dimArrow(ctx,dxm,yL,L0,COL.yellow);
        pill(ctx,dxm+10,(yL+L0)/2-(Math.abs(yL-L0)<24?24:0),'h = '+fmt(hs[0].x,2)+' cm',COL.yellow);
        const wx=x-hw_, wy=yL, ang=th, r_=20;
        line(ctx,wx,wy,wx,wy+28,COL.yellow,2); line(ctx,wx,wy,wx+Math.sin(ang)*28,wy+Math.cos(ang)*28,COL.yellow,2);
        ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.8; ctx.beginPath(); ctx.arc(wx,wy,r_,Math.PI/2-ang,Math.PI/2); ctx.stroke(); ctx.restore();
        textAt(ctx,'θ = '+L.th+'°',wx-8,wy+30,{size:12,weight:700,color:COL.yellow,align:'right'});
      }

/* ---------------------------------------------------------------------
   0c. FLUIDS HELPERS — controls kit, liquids, dials, router
   --------------------------------------------------------------------- */
const G = 9.8, PATM = 1.013e5;
const FL_BLUE = 'rgba(47,143,224,0.17)';
const SQ = Math.sqrt;

function slider(id,label,min,max,step,val){
  return `<div class="control-group"><label>${label} <span class="val" id="${id}V"></span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}
function group(label,inner){ return `<div class="control-group"><label>${label}</label>${inner}</div>`; }
function seg(id,items,active){
  return `<div class="toggle-group" id="${id}">`+items.map((it,i)=>`<button class="toggle-btn small${i===active?' active':''}" data-v="${it[0]}">${it[1]}</button>`).join('')+`</div>`;
}
function cards(arr,cls){
  return `<div class="control-group"><div class="result-cards ${cls||''}">`+arr.map(c=>
    `<div class="rcard${c.wide?' wide':''}"><div class="rlabel">${c.l}</div><div class="rval" id="${c.id}" style="${c.col?'color:'+c.col:''}">—</div></div>`).join('')+`</div></div>`;
}
function hintBox(t){ return `<p class="hint" style="margin:0 2px;">${t}</p>`; }
function wireSeg(wrap,id,cb){
  const g=wrap.querySelector('#'+id), btns=[...g.querySelectorAll('button')];
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b.dataset.v); });
  return { set(v){ btns.forEach(x=>x.classList.toggle('active',x.dataset.v===String(v))); } };
}
function kit(wrap){
  const $=s=>wrap.querySelector(s);
  return {
    $,
    v:id=>+$('#'+id).value,
    put:(id,t)=>{ const e=$('#'+id); if(e) e.textContent=t; },
    setSlider:(id,val)=>{ $('#'+id).value=val; },
  };
}

/* liquid with a wavy surface, clipped to any container path */
function liquid(ctx,pathFn,x0,x1,yS,yB,t,amp,fill,stroke){
  ctx.save(); pathFn(); ctx.clip();
  const wav=x=>yS+Math.sin(x*0.045+t*2.6)*amp;
  ctx.beginPath(); ctx.moveTo(x0,yB); ctx.lineTo(x0,wav(x0));
  for(let x=x0;x<=x1;x+=5) ctx.lineTo(x,wav(x));
  ctx.lineTo(x1,wav(x1)); ctx.lineTo(x1,yB); ctx.closePath();
  ctx.fillStyle=fill||FL_BLUE; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x0,wav(x0)); for(let x=x0;x<=x1;x+=5) ctx.lineTo(x,wav(x)); ctx.lineTo(x1,wav(x1));
  ctx.strokeStyle=stroke||COL.blue; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}
/* 270° analogue dial; frac 0..1 */
function dial(ctx,cx,cy,r,frac,maxLab,unit,valTxt,nt){
  const a0=0.75*Math.PI, sw=1.5*Math.PI; nt=nt||5;
  circ(ctx,cx,cy,r,COL.ink,'#fff',2.6);
  circ(ctx,cx,cy,r-6,COL.mid,null,1);
  for(let i=0;i<=nt;i++){
    const a=a0+sw*i/nt, c=Math.cos(a), s=Math.sin(a);
    line(ctx,cx+c*(r-6),cy+s*(r-6),cx+c*(r-15),cy+s*(r-15),COL.ink,2);
    textAt(ctx,fmt(maxLab*i/nt,maxLab<10?1:0),cx+c*(r-28),cy+s*(r-28)+4,{size:10,align:'center',color:COL.muted,weight:600});
  }
  const a=a0+sw*clamp(frac,0,1.04);
  line(ctx,cx,cy,cx+Math.cos(a)*(r-12),cy+Math.sin(a)*(r-12),COL.red,3);
  circ(ctx,cx,cy,5,COL.ink,COL.ink,1);
  textAt(ctx,unit,cx,cy+r*0.42,{size:11,align:'center',color:COL.muted,weight:600});
  textAt(ctx,valTxt,cx,cy+r+17,{size:13,align:'center',weight:700,color:COL.ink});
}
function bobAmp(t,k){ return Math.sin(t*k); }
function pill(ctx,x,y,txt,col,align){
  ctx.save(); ctx.font='700 12px Poppins, sans-serif'; const tw=ctx.measureText(txt).width; ctx.restore();
  const bx=align==='right'?x-tw-10:align==='center'?x-tw/2-5:x;
  ctx.save(); rrect(ctx,bx,y-11,tw+10,22,6); ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
  textAt(ctx,txt,bx+5,y+4,{size:12,weight:700,color:col});
}
function fmtP(p){ // pascal → readable
  const a=Math.abs(p);
  if(a>=1e6) return fmt(p/1e6,2)+' MPa';
  if(a>=1e4) return fmt(p/1e3,1)+' kPa';
  if(a>=1e3) return fmt(p/1e3,2)+' kPa';
  return fmt(p,0)+' Pa';
}
function smoothstep(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
