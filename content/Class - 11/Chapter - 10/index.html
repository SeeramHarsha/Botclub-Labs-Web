    ctx.save(); ctx.strokeStyle=pc; ctx.lineWidth=3.6; ctx.lineJoin='round'; ctx.beginPath(); S.trace.forEach((a,i)=>i?ctx.lineTo(F.X(a[0]),F.Y(a[1])):ctx.moveTo(F.X(a[0]),F.Y(a[1]))); ctx.lineTo(F.X(V),F.Y(Pr)); ctx.stroke(); ctx.restore();
    // states A, B and the moving state
    [[10,2,'A'],[25,1,'B']].forEach(([v,p,l])=>{ circ(ctx,F.X(v),F.Y(p),7,COL.ink,'#fff',2.6); textAt(ctx,l,F.X(v)+(l==='A'?-20:10),F.Y(p)-(l==='A'?4:10),{size:16,weight:700}); });
    circ(ctx,F.X(V),F.Y(Pr),6,pc,pc,2); circ(ctx,F.X(V),F.Y(Pr),11+Math.sin(t*6)*2,pc,null,1.4);
    textAt(ctx,'Work W = area under the path',F.x+F.w*0.5,F.y+F.h*0.9,{size:12,weight:700,color:COL.green,align:'center'});
    // ---- three live energy bars under the diagram
    const bx=px, bw=pw, by=h*0.97;
    hbar(ctx,bx,by-20,bw*0.31,13,S.Q,4000,COL.red,'Q',fmt(S.Q,0)+' J');
    hbar(ctx,bx+bw*0.345,by-20,bw*0.31,13,S.W,4000,COL.green,'W',fmt(S.W,0)+' J');
    hbar(ctx,bx+bw*0.69,by-20,bw*0.31,13,dUtot,4000,COL.blue,'ΔU',fmt(dUtot,0)+' J');
    textAt(ctx,'T = '+fmt(T,0)+' K',bx+bw,py-6,{size:12,weight:700,color:tempCol(T),align:'right'});
    $('#r1').textContent=fmt(S.Q,0)+' J'; $('#r2').textContent=fmt(S.W,0)+' J'; $('#r3').textContent=fmt(dUtot,0)+' J'; $('#r4').textContent=fmt(S.Q-S.W,0)+' J';
  });
  return wrap;
}

/* =====================================================================
   11.7 SLOW vs SUDDEN  (§11.7–11.8.1, Fig 11.6, 11.7)
   Isothermal gas, 2000 J = nRT:   P_gas = 2000 / V   (kPa, L)
   Piston obeys  M V̈ = P_gas − P_ext − c V̇   — underdamped when the load is
   lifted at once, so the gas is NOT in equilibrium while it rings.
   W_by_gas = ∫ P_ext dV :  slow ⇒ nRT ln(V₂/V₁),  sudden ⇒ P_f ΔV  (smaller)
   Free expansion: W = 0, Q = 0, ΔT = 0 for an ideal gas.
   ===================================================================== */
function buildA7(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">How the load is removed</label>
      <div class="toggle-group" id="mB"><button class="toggle-btn active" data-m="qs">Slowly · grain by grain</button><button class="toggle-btn" data-m="sd">Suddenly · all at once</button><button class="toggle-btn" data-m="fx">Free expansion</button></div></div>
    <div class="control-group" id="sandCtl"><label>Sand left on piston <span class="val" id="gV"></span></label><input type="range" id="gR" min="25" max="100" step="1" value="100">
      <button class="toggle-btn navy" id="rs">↺ Reset</button></div>
    <div class="control-group hidden" id="fxCtl"><button class="toggle-btn play" id="pull" style="width:100%">🔓 Pull the partition out</button><button class="toggle-btn navy" id="rs2">↺ Put it back</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Work by gas</div><div class="rval" id="r1" style="color:var(--f-green)">0 J</div></div>
      <div class="rcard"><div class="rlabel">Slow-limit W</div><div class="rval" id="r2" style="color:var(--f-green)">—</div></div>
      <div class="rcard wide"><div class="rlabel">State of the gas</div><div class="rval" id="r3">Equilibrium ✓</div></div></div>
      <p class="hint" id="hn">Work done by gas = ∫ P_ext dV</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), gR=$('#gR');
  const KT=2000, VMIN=8, VMAX=48, NB=200;
  let mode='qs', t=0;
  const S={V:10,Vv:0, Ng:100, acc:0, pe:200, W:0, V0:10, bins:new Array(NB).fill(null), fly:[], reset:false, vsm:0};
  const gas=makeGas(34);
  // free-expansion state
  const FX={out:false, lift:{x:0,v:0}, g:[], wall:0.5};
  function fxInit(){ FX.out=false; FX.lift.x=0; FX.lift.v=0; FX.wall=0.5; FX.g=[]; for(let i=0;i<40;i++){ const th=Math.random()*6.28; FX.g.push({x:Math.random()*0.48+0.01,y:Math.random(),vx:Math.cos(th),vy:Math.sin(th)}); } FX.t=0; }
  fxInit();
  toggleWire(wrap.querySelectorAll('#mB button'),b=>{ mode=b.dataset.m; $('#sandCtl').classList.toggle('hidden',mode==='fx'); $('#fxCtl').classList.toggle('hidden',mode!=='fx');
    $('#hn').textContent=mode==='fx'?'Free expansion: no work, no heat, no ΔT':'Work done by gas = ∫ P_ext dV'; if(mode==='fx') fxInit(); });
  $('#rs').onclick=()=>{ gR.value=100; S.reset=true; };
  $('#rs2').onclick=fxInit; $('#pull').onclick=()=>{ FX.out=true; };
  [gR].forEach(el=>el.addEventListener('input',()=>{ S.reset=false; }));
  function spawnFly(n,cx,topY,wd,from){
    for(let k=0;k<n;k++){ const [x,y]=sandPos(Math.max(0,from-1-k),cx,topY,wd); S.fly.push({x,y,vx:(Math.random()<0.5?-1:1)*(70+Math.random()*130),vy:-(140+Math.random()*200),down:false}); }
  }
  animLoop((dt)=>{
    t+=dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cx=w*0.2, wd=Math.min(w*0.17,135);
    const px=w*0.43, py=h*0.1, pw=w*0.5, ph=h*0.68;
    const F=pvFrame(ctx,px,py,pw,ph,0,50,0,230,{tx:[[10,'10'],[20,'20'],[30,'30'],[40,'40']],ty:[[50,'50'],[100,'100'],[150,'150'],[200,'200']],xl:'V (L)',yl:'P (kPa)'});
    // isotherm (blue): P V = const
    ctx.save(); clipRect(ctx,F.x,F.y,F.w,F.h); ctx.strokeStyle=COL.blue; ctx.lineWidth=2.6; ctx.beginPath();
    for(let v=VMIN;v<=VMAX;v+=0.5){ const X=F.X(v),Y=F.Y(KT/v); v===VMIN?ctx.moveTo(X,Y):ctx.lineTo(X,Y); } ctx.stroke(); ctx.restore();
    textAt(ctx,'isotherm  PV = const',F.X(30),F.Y(KT/30)-12,{size:11.5,weight:700,color:COL.blue});

    if(mode!=='fx'){
      const Ngt=+gR.value; $('#gV').textContent=Ngt+' %';
      // ---- load: grains leave one by one (slow) or all together (sudden)
      const baseY=h*0.74, topY=h*0.12, Hc=baseY-topY-20;
      const pistonY=baseY-Hc*S.V/50;
      const diff=Ngt-S.Ng;
      if(diff<0){
        if(mode==='sd'){ spawnFly(-diff,cx,pistonY-14,wd,S.Ng); S.Ng=Ngt; }
        else { S.acc+=dt*9; let k=Math.min(Math.floor(S.acc),-diff); if(k>0){ S.acc-=k; spawnFly(k,cx,pistonY-14,wd,S.Ng); S.Ng-=k; } }
      } else if(diff>0){
        if(mode==='sd'){ for(let k=0;k<Math.min(diff,40);k++) S.fly.push({x:cx+(Math.random()-0.5)*wd*0.7,y:-20-Math.random()*60,vx:0,vy:60,down:true}); S.Ng=Ngt; }
        else { S.acc+=dt*9; let k=Math.min(Math.floor(S.acc),diff); if(k>0){ S.acc-=k; for(let q=0;q<k;q++) S.fly.push({x:cx+(Math.random()-0.5)*wd*0.5,y:-10,vx:0,vy:60,down:true}); S.Ng+=k; } }
      }
      const peT=S.Ng*2;
      S.pe = mode==='qs' ? approach(S.pe,peT,2.2,dt) : peT;
      // ---- piston dynamics (sub-stepped semi-implicit Euler)
      const M=0.18, c=mode==='qs'?1.5:0.28, n=8;
      for(let k=0;k<n;k++){ const hd=dt/n, Pg=KT/S.V, acc=(Pg-S.pe-c*S.Vv)/M; const Vold=S.V; S.Vv+=acc*hd; S.V=clamp(S.V+S.Vv*hd,VMIN,VMAX); if(S.V===VMIN||S.V===VMAX) S.Vv*=-0.2; S.W+=S.pe*(S.V-Vold); }
      const Pg=KT/S.V, V=S.V;
      S.vsm=approach(S.vsm,S.Vv,10,dt);
      // work-area bins: set when the piston passes forward through a bin, cleared when it retreats
      const bi=Math.floor((V-VMIN)/(VMAX-VMIN)*NB), b0=Math.floor((S.V0-VMIN)/(VMAX-VMIN)*NB);
      for(let j=0;j<NB;j++){ if(j>bi) S.bins[j]=null; else if(j>=b0 && S.bins[j]===null) S.bins[j]=S.pe; }
      if(S.reset && Math.abs(V-10)<0.12 && Math.abs(S.Vv)<0.6 && S.Ng===100){ S.reset=false; S.W=0; S.V0=V; S.bins.fill(null); }
      // ---- shaded work area under P_ext
      ctx.save(); ctx.fillStyle='rgba(31,157,85,0.26)'; const bw=F.w*((VMAX-VMIN)/NB)/50;
      S.bins.forEach((pe,j)=>{ if(pe===null) return; const X=F.X(VMIN+(j)*(VMAX-VMIN)/NB); ctx.fillRect(X,F.Y(pe),bw+0.6,F.Y(0)-F.Y(pe)); }); ctx.restore();
      // external-pressure line (red) and equilibrium target
      line(ctx,F.X(S.V0),F.Y(S.pe),F.X(Math.max(V,S.V0)),F.Y(S.pe),COL.red,2.4);
      textAt(ctx,'P_ext',F.X(S.V0)+4,F.Y(S.pe)-6,{size:11,weight:700,color:COL.red});
      circ(ctx,F.X(KT/(peT)),F.Y(peT),6,COL.ink,null,2); textAt(ctx,'goal',F.X(KT/peT)+8,F.Y(peT)-8,{size:11,weight:600,color:COL.muted});
      const eq=Math.abs(S.Vv)<1.2 && Math.abs(Pg-S.pe)<4;
      ctx.save(); ctx.globalAlpha=eq?1:0.55; circ(ctx,F.X(V),F.Y(Pg),6.5,COL.blue,eq?COL.blue:'#fff',2.4); ctx.restore();
      if(!eq) { ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(F.X(S.V0),F.Y(200)); ctx.lineTo(F.X(V),F.Y(Pg)); ctx.stroke(); ctx.restore(); }
      // ---- heat bath + cylinder + gas
      rect(ctx,cx-wd/2-22,baseY+4,wd+44,46,COL.blue,'#e6f2fd',2.2);
      ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.beginPath(); for(let x=cx-wd/2-20;x<=cx+wd/2+20;x+=4){ const yy=baseY+14+Math.sin(x*0.15+t*3)*1.6; x===cx-wd/2-20?ctx.moveTo(x,yy):ctx.lineTo(x,yy); } ctx.stroke(); ctx.restore();
      textAt(ctx,'Heat bath · 300 K',cx,baseY+38,{size:11,weight:700,align:'center',color:COL.blue});
      const cyl=drawCylinder(ctx,{cx,baseY,wd,topY,pistonY});
      const u=clamp(S.vsm/9,-1,1);
      if(Math.abs(u)>0.03){ const gd=ctx.createLinearGradient(0,cyl.y,0,baseY); const a=0.34*Math.abs(u);
        const lo='rgba(47,143,224,'+a.toFixed(3)+')', hi='rgba(217,67,43,'+a.toFixed(3)+')';
        gd.addColorStop(0,u>0?lo:hi); gd.addColorStop(1,u>0?hi:lo); ctx.save(); ctx.fillStyle=gd; ctx.fillRect(cyl.x+3,cyl.y,cyl.w-6,cyl.h-2); ctx.restore(); }
      stepGas(gas,dt,gasSpeed(300,h)*1.1,cyl.w-8,cyl.h-8,5); drawGas(ctx,gas,cyl.x+4,cyl.y+4,cyl.w-8,cyl.h-8,300,5);
      drawSand(ctx,S.Ng,cx,pistonY-14,wd);
      S.fly=S.fly.filter(g=>{ g.vy+=(g.down?200:700)*dt; g.x+=g.vx*dt; g.y+=g.vy*dt;
        if(g.down&&g.y>=sandTopY(S.Ng,cx,pistonY-14,wd)) return false; if(g.y>h+20) return false;
        circ(ctx,g.x,g.y,3,COL.yellow,'#fff6d9',1.3); return true; });
      if(!eq) textAt(ctx,'pressure not uniform — no single P, T',cx,topY-6,{size:11.5,weight:700,color:COL.red,align:'center'});
      // ---- numbers
      const Wqs=KT*Math.log(Math.max(KT/Math.max(peT,1),0.01)/S.V0);
      $('#r1').textContent=fmt(S.W,0)+' J'; $('#r2').textContent=fmt(Math.max(Wqs,0),0)+' J';
      const msg=eq?'Equilibrium ✓':'Not in equilibrium ✗'; if($('#r3').textContent!==msg){ $('#r3').textContent=msg; $('#r3').style.color=eq?'var(--f-green)':'var(--f-red)'; }
    } else {
      // ---- FREE EXPANSION (Fig 11.6a): vacuum on the right, partition pulled out
      const bw=Math.min(w*0.28,300), bh=Math.min(h*0.4,230), bx=w*0.12, by=h*0.24;
      FX.t+=dt;
      if(FX.out) springTo(FX.lift,1,14,6,dt); else FX.lift.x=0;
      if(FX.lift.x>0.8) FX.wall=1; else FX.wall=0.5;
      const sp=gasSpeed(300,h)*1.6;
      FX.g.forEach(p=>{ p.x+=p.vx*sp*dt/(bw-14); p.y+=p.vy*sp*dt/(bh-14);
        const wl=FX.wall; if(p.x<0.02){p.x=0.02;p.vx=Math.abs(p.vx);} if(p.x>wl-0.02){p.x=wl-0.02;p.vx=-Math.abs(p.vx);}
        if(p.y<0.02){p.y=0.02;p.vy=Math.abs(p.vy);} if(p.y>0.98){p.y=0.98;p.vy=-Math.abs(p.vy);}
        if(Math.random()<dt*1.4){ const th=Math.atan2(p.vy,p.vx)+gauss()*0.7; p.vx=Math.cos(th); p.vy=Math.sin(th); } });
      ctx.save(); ctx.fillStyle='#fbfdff'; ctx.fillRect(bx,by,bw,bh); ctx.restore();
      textAt(ctx,'vacuum',bx+bw*0.75,by+bh/2+4,{size:13,weight:600,color:COL.mid,align:'center',alpha:FX.wall<1?1:0});
      rect(ctx,bx,by,bw,bh,COL.ink,null,3.6);
      drawGas(ctx,FX.g,bx+7,by+7,bw-14,bh-14,300,5);
      // partition lifts out through the roof
      const lift=FX.lift.x*(bh+30);
      line(ctx,bx+bw/2,by-lift,bx+bw/2,by+bh-lift,COL.yellow,5);
      line(ctx,bx+bw/2-8,by-lift-2,bx+bw/2+8,by-lift-2,COL.yellow,5);
      // density in each half → pressure
      const nl=FX.g.filter(p=>p.x<0.5).length, nr=FX.g.length-nl;
      const Pf=KT/20, Pi=KT/10;
      const mixed=FX.wall>=1 && Math.abs(nl-nr)<=6;
      // P–V: initial (10,200) → final (20,100) on the same isotherm; no path in between
      circ(ctx,F.X(10),F.Y(Pi),7,COL.ink,'#fff',2.6); textAt(ctx,'initial',F.X(10)+10,F.Y(Pi)-8,{size:12,weight:700});
      circ(ctx,F.X(20),F.Y(Pf),7,COL.ink,mixed?COL.ink:'#fff',2.6); textAt(ctx,'final',F.X(20)+10,F.Y(Pf)-10,{size:12,weight:700});
      if(FX.out){ ctx.save(); ctx.setLineDash([5,5]); ctx.strokeStyle=COL.mid; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(F.X(10),F.Y(Pi)); ctx.lineTo(F.X(20),F.Y(Pf)); ctx.stroke(); ctx.restore();
        if(!mixed) textAt(ctx,'in between: no P, no T',F.X(15),F.Y(Pi*0.8)-14,{size:11.5,weight:700,color:COL.red,align:'center'}); }
      thermo(ctx,bx-30,by+4,by+bh-20,0.5,COL.ink,tempCol(300));
      textAt(ctx,'300 K',bx-30,by+bh+22,{size:12,weight:700,color:COL.yellow,align:'center'});
      textAt(ctx,'ΔT = 0',bx-30,by-6,{size:12,weight:700,color:COL.blue,align:'center'});
      textAt(ctx,'Gas rushes into vacuum',bx,by-30,{size:12.5,weight:700,color:COL.muted}); textAt(ctx,'there is nothing to push',bx,by-14,{size:12,weight:600,color:COL.mid});
      textAt(ctx,'W = 0     Q = 0     ΔU = 0',bx+bw/2,by+bh+44,{size:15,weight:700,align:'center'});
      textAt(ctx,'left '+nl+' : right '+nr,bx+bw/2,by+bh+66,{size:12,weight:600,color:COL.muted,align:'center'});
      $('#r1').textContent='0 J'; $('#r2').textContent='0 J';
      const msg=!FX.out?'Equilibrium ✓':mixed?'Equilibrium ✓ (new)':'Not in equilibrium ✗'; if($('#r3').textContent!==msg){ $('#r3').textContent=msg; $('#r3').style.color=msg.includes('✓')?'var(--f-green)':'var(--f-red)'; }
    }
  });
  return wrap;
}

/* =====================================================================
   11.8 GAS PROCESSES  (§11.8.2–11.8.5, Fig 11.8)    n = 0.8 mol, start 300 K, 20 L, ≈100 kPa
   Isothermal  PV = const              W = nRT ln(V/V₀)        ΔU = 0   Q = W
   Adiabatic   PV^γ = const            W = (P₀V₀ − PV)/(γ−1)   Q = 0    ΔU = −W
   Isobaric    P = const               W = P(V−V₀)             Q = ΔU + W
   Isochoric   V = const               W = 0                   Q = ΔU = (PV−P₀V₀)/(γ−1)
   Readings are counted from where you last switched process (nothing jumps).
   ===================================================================== */
function buildA8(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Process</label>
      <div class="toggle-group" id="pB"><button class="toggle-btn active" data-p="iso">Isothermal</button><button class="toggle-btn" data-p="adi">Adiabatic</button><button class="toggle-btn" data-p="isb">Isobaric</button><button class="toggle-btn" data-p="ich">Isochoric</button></div></div>
    <div class="control-group"><label style="margin-bottom:6px;">Gas</label>
      <div class="toggle-group" id="gB"><button class="toggle-btn active" data-g="1.667">Monatomic γ=1.67</button><button class="toggle-btn" data-g="1.4">Diatomic γ=1.40</button></div></div>
    <div class="control-group" id="vCtl"><label>Volume <span class="val" id="vV"></span></label><input type="range" id="vR" min="7" max="45" step="0.1" value="20"></div>
    <div class="control-group hidden" id="tCtl"><label>Heater / ice → temperature <span class="val" id="tV"></span></label><input type="range" id="tR" min="150" max="900" step="1" value="300"></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel">Pressure</div><div class="rval" id="r1" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Volume</div><div class="rval" id="r2">—</div></div>
      <div class="rcard"><div class="rlabel">Temp</div><div class="rval" id="r3" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">Heat Q</div><div class="rval" id="r4" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">Work W</div><div class="rval" id="r5" style="color:var(--f-green)">—</div></div>
      <div class="rcard"><div class="rlabel">ΔU</div><div class="rval" id="r6" style="color:var(--f-blue)">—</div></div></div>
      <p class="hint" id="hn"></p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), vR=$('#vR'), tR=$('#tR');
  const nR=0.8*R_GAS;
  let proc='iso', g=1.667, t=0;
  const A={P:nR*300/20,V:20,T:300};                       // anchor = state at the last process switch
  const S={V:{x:20,v:0}, T:300, Q:0, dQ:0, lastQ:0};
  const gas=makeGas(34);
  const NOTE={iso:'T fixed · P ∝ 1/V · all heat becomes work',adi:'No heat in or out · compressing heats the gas',isb:'P fixed · heat → ΔU and work',ich:'V fixed · no work · all heat raises U'};
  const PCOL={iso:COL.blue,adi:COL.red,isb:COL.green,ich:COL.yellow};
  function anchor(){ const V=S.V.x, T=S.T; A.V=V; A.T=T; A.P=nR*T/V; S.Q=0; S.lastQ=0; S.dQ=0; }
  function paintCtl(){ $('#vCtl').classList.toggle('hidden',proc==='ich'); $('#tCtl').classList.toggle('hidden',proc!=='ich'); $('#hn').textContent=NOTE[proc]; }
  toggleWire(wrap.querySelectorAll('#pB button'),b=>{ proc=b.dataset.p; anchor(); vR.value=clamp(S.V.x,7,45); tR.value=clamp(Math.round(S.T),150,900); paintCtl(); });
  toggleWire(wrap.querySelectorAll('#gB button'),b=>{ g=+b.dataset.g; anchor(); });
  paintCtl();
  function stateAt(p,V,Tt){            // returns {P,T,W,dU,Q}
    const P0=A.P,V0=A.V,T0=A.T;
    if(p==='iso'){ const W=nR*T0*Math.log(V/V0); return {P:P0*V0/V,T:T0,W,dU:0,Q:W}; }
    if(p==='adi'){ const P=P0*Math.pow(V0/V,g), T=P*V/nR, W=(P0*V0-P*V)/(g-1); return {P,T,W,dU:-W,Q:0}; }
    if(p==='isb'){ const T=P0*V/nR, W=P0*(V-V0), dU=(P0*V-P0*V0)/(g-1); return {P:P0,T,W,dU,Q:dU+W}; }
    const P=P0*Tt/T0, dU=(P-P0)*V0/(g-1); return {P,T:Tt,W:0,dU,Q:dU};
  }
  animLoop((dt)=>{
    t+=dt;
    const Vt=proc==='ich'?A.V:+vR.value, Tt=+tR.value;
    $('#vV').textContent=fmt(+vR.value,1)+' L'; $('#tV').textContent=Tt+' K';
    springTo(S.V,Vt,55,13,dt);
    if(proc==='ich') S.T=approach(S.T,Tt,3,dt);
    const st=stateAt(proc,S.V.x,S.T);
    S.T=proc==='ich'?S.T:st.T;
    S.dQ=approach(S.dQ,(st.Q-S.lastQ)/Math.max(dt,1e-3),8,dt); S.lastQ=st.Q;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cx=w*0.19, wd=Math.min(w*0.17,135), baseY=h*0.72, topY=h*0.1, Hc=baseY-topY-20, V=S.V.x, pistonY=baseY-Hc*V/50;
    // ---- environment of the cylinder depends on the process
    const jacket=proc==='adi'?true:proc==='iso'?false:'sides';
    if(proc==='iso'){
      rect(ctx,cx-wd/2-24,baseY+4,wd+48,52,COL.blue,'#e6f2fd',2.2);
      ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; ctx.beginPath(); for(let x=cx-wd/2-22;x<=cx+wd/2+22;x+=4){ const yy=baseY+15+Math.sin(x*0.15+t*3)*1.6; x===cx-wd/2-22?ctx.moveTo(x,yy):ctx.lineTo(x,yy); } ctx.stroke(); ctx.restore();
      textAt(ctx,'Heat bath · T fixed',cx,baseY+42,{size:11,weight:700,align:'center',color:COL.blue});
      const hf=clamp(S.dQ/1800,-1,1); if(Math.abs(hf)>0.04){ const L=8+Math.abs(hf)*30; for(let i=-1;i<=1;i++){ if(hf>0) vec(ctx,cx+i*wd*0.28,baseY+44,cx+i*wd*0.28,baseY+44-L,COL.red,3); else vec(ctx,cx+i*wd*0.28,baseY+8,cx+i*wd*0.28,baseY+8+L,COL.blue,3); } }
    } else if(proc==='isb'||proc==='ich'){
      const hf=clamp(S.dQ/1800,-1,1);
      if(hf>0.03){ rect(ctx,cx-wd*0.3,baseY+52,wd*0.6,9,COL.ink,'#fff',2.2); drawFlame2(ctx,cx,baseY+52,wd*0.9,hf,t); }
      if(hf<-0.03) drawIce(ctx,cx,baseY+10,wd*0.9,-hf,t);
    } else textAt(ctx,'Fully insulated',cx,baseY+34,{size:11,weight:700,align:'center',color:COL.mid});
    const cyl=drawCylinder(ctx,{cx,baseY,wd,topY,pistonY,jacket,pins:proc==='ich'?[pistonY-14-4]:undefined,rodTop:proc==='isb'||proc==='ich'?undefined:pistonY-14-50});
    if(proc==='isb'||proc==='ich'){ rect(ctx,cx-wd*0.32,pistonY-14-30,wd*0.64,30,COL.green,'#e4f7ec',2.4); textAt(ctx,proc==='isb'?'P const':'weight',cx,pistonY-14-10,{size:10.5,weight:700,align:'center',color:COL.green}); }
    stepGas(gas,dt,gasSpeed(S.T,h)*1.1,cyl.w-8,cyl.h-8,5); drawGas(ctx,gas,cyl.x+4,cyl.y+4,cyl.w-8,cyl.h-8,S.T,5);
    thermo(ctx,cx-wd/2-34,topY+20,baseY-30,clamp((S.T-150)/750,0,1),COL.ink,tempCol(S.T));
    textAt(ctx,fmt(S.T,0)+' K',cx-wd/2-34,baseY+14,{size:11.5,weight:700,align:'center',color:tempCol(S.T)});
    // ---- P–V diagram with all four curves through the anchor
    const px=w*0.43, py=h*0.1, pw=w*0.5, ph=h*0.74;
    const F=pvFrame(ctx,px,py,pw,ph,0,50,0,700,{tx:[[10,'10'],[20,'20'],[30,'30'],[40,'40']],ty:[[100,'100'],[200,'200'],[300,'300'],[400,'400'],[500,'500'],[600,'600']],xl:'V (L)',yl:'P (kPa)'});
    ctx.save(); clipRect(ctx,F.x,F.y,F.w,F.h);
    const curve=(fn,col,lw,al)=>{ ctx.save(); ctx.globalAlpha=al; ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.beginPath(); let first=true; for(let v=6;v<=48;v+=0.4){ const p=fn(v); const X=F.X(v),Y=F.Y(p); first?ctx.moveTo(X,Y):ctx.lineTo(X,Y); first=false; } ctx.stroke(); ctx.restore(); };
    const fns={iso:v=>A.P*A.V/v, adi:v=>A.P*Math.pow(A.V/v,g), isb:v=>A.P};
    ['iso','adi','isb'].forEach(k=>curve(fns[k],PCOL[k],proc===k?3.6:1.8,proc===k?1:0.35));
    line(ctx,F.X(A.V),F.Y(0),F.X(A.V),F.Y(700),PCOL.ich,proc==='ich'?3.6:1.8);
    // work area under the active path
    if(proc!=='ich'){ ctx.save(); ctx.fillStyle='rgba(31,157,85,0.24)'; ctx.beginPath(); ctx.moveTo(F.X(A.V),F.Y(0)); const n=40; for(let i=0;i<=n;i++){ const v=lerp(A.V,V,i/n); ctx.lineTo(F.X(v),F.Y(fns[proc](v))); } ctx.lineTo(F.X(V),F.Y(0)); ctx.closePath(); ctx.fill(); ctx.restore(); }
    ctx.restore();
    circ(ctx,F.X(A.V),F.Y(A.P),5.5,COL.ink,'#fff',2.4); textAt(ctx,'start',F.X(A.V)+8,F.Y(A.P)+16,{size:11,weight:700,color:COL.muted});
    const dp=PCOL[proc]; circ(ctx,F.X(V),F.Y(st.P),6.5,dp,dp,2); circ(ctx,F.X(V),F.Y(st.P),11+Math.sin(t*6)*2,dp,null,1.4);
    // curve labels
    const lab=[['isothermal',COL.blue,'iso'],['adiabatic',COL.red,'adi'],['isobaric',COL.green,'isb'],['isochoric',COL.yellow,'ich']];
    lab.forEach(([n,c,k],i)=>{ const yy=py+14+i*16; line(ctx,px+pw-112,yy-4,px+pw-92,yy-4,c,proc===k?4:2); textAt(ctx,n,px+pw-86,yy,{size:11.5,weight:proc===k?700:500,color:proc===k?COL.ink:COL.mid}); });
    $('#r1').textContent=fmt(st.P,0)+' kPa'; $('#r2').textContent=fmt(V,1)+' L'; $('#r3').textContent=fmt(S.T,0)+' K';
    $('#r4').textContent=fmt(st.Q,0)+' J'; $('#r5').textContent=fmt(st.W,0)+' J'; $('#r6').textContent=fmt(st.dU,0)+' J';
  });
  return wrap;
}


function niceTicks(max,approx){
  const raw=max/approx, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p, st=(m<1.5?1:m<3.5?2:m<7.5?5:10)*p, out=[];
  for(let v=st;v<max*0.98;v+=st) out.push([v,fmt(v,v<1?2:0)]);
  return out;
}

/* =====================================================================
   11.9 SECOND LAW  (§11.9–11.10)
   Clausius: heat never flows cold → hot by itself.  A refrigerator moves it
   only if work is supplied:   Q_hot = Q_cold + W ,  COP = Q_cold / W = T₂/(T₁−T₂)
   (best-possible, reversible fridge).  Rod conduction: real 1-D heat chain.
   Blocks 3000 J/K each, rod 20 cells, 12 W/K end-to-end · 1 s ≙ 40 s.
   ===================================================================== */
function buildA9(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Copper rod between the blocks</label>
      <div class="toggle-group" id="rB"><button class="toggle-btn active" data-r="1">Connected</button><button class="toggle-btn" data-r="0">Cut</button></div></div>
    <div class="control-group"><label style="margin-bottom:6px;">Refrigerator</label>
      <div class="toggle-group" id="fB"><button class="toggle-btn active" data-f="0">Off</button><button class="toggle-btn" data-f="1">On</button></div>
      <label style="margin-top:10px;">Electrical work supplied <span class="val" id="pV"></span></label><input type="range" id="pR" min="0" max="200" step="1" value="80">
      <button class="toggle-btn navy" id="rs">↺ Reset temperatures</button></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel">Hot block</div><div class="rval" id="r1" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">Cold block</div><div class="rval" id="r2" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Ideal COP</div><div class="rval" id="r3">—</div></div></div>
      <div id="fb"></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), pR=$('#pR');
  const C=3000, N=20, cc=40, G=12, gl=G*(N+1), TS=40;
  let conn=1, fr=0, t=0;
  const S={Th:360, Tc:300, rod:new Array(N).fill(330), gap:{x:0,v:0}, flux:0, Qc:0, ph:0, hold:0};
  for(let i=0;i<N;i++) S.rod[i]=360-60*(i+1)/(N+1);
  toggleWire(wrap.querySelectorAll('#rB button'),b=>conn=+b.dataset.r);
  toggleWire(wrap.querySelectorAll('#fB button'),b=>fr=+b.dataset.f);
  $('#rs').onclick=()=>{ S.hold=1.2; };
  animLoop((dt)=>{
    t+=dt;
    const Pw=fr?+pR.value:0; $('#pV').textContent=pR.value+' W';
    if(S.hold>0){ S.hold-=dt; S.Th=approach(S.Th,360,6,dt); S.Tc=approach(S.Tc,300,6,dt); for(let i=0;i<N;i++) S.rod[i]=approach(S.rod[i],360-60*(i+1)/(N+1),6,dt); }
    else {
      let sim=dt*TS; const nsub=Math.ceil(sim/0.05), h=sim/nsub;
      const mid=N/2, T=new Array(N+2);
      for(let k=0;k<nsub;k++){
        T[0]=S.Th; for(let i=0;i<N;i++) T[i+1]=S.rod[i]; T[N+1]=S.Tc;
        const fl=[]; for(let i=0;i<=N;i++) fl.push((conn||i!==mid)?gl*(T[i]-T[i+1]):0);
        const cop=S.Th-S.Tc>2?Math.min(30,S.Tc/(S.Th-S.Tc)):30;
        const Qc=(Pw>0&&S.Tc>100)?cop*Pw:0, Qh=Qc+Pw;
        S.Qc=Qc;
        S.Th+=(-fl[0]+Qh)*h/C; S.Tc+=(fl[N]-Qc)*h/C;
        for(let i=0;i<N;i++) S.rod[i]+=(fl[i]-fl[i+1])*h/cc;
        S.flux=fl[mid];
      }
    }
    springTo(S.gap,conn?0:1,40,9,dt);
    S.ph+=dt*(Pw/200)*8;
    const cop=S.Th-S.Tc>2?Math.min(30,S.Tc/(S.Th-S.Tc)):30, Qc=(Pw>0&&S.Tc>100)?cop*Pw:0;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const bw=w*0.17, by0=h*0.14, bh=h*0.3, hx=w*0.13, cx2=w*0.87, rodY=h*0.29;
    // ---- blocks with vibrating atoms
    [[hx,S.Th,'HOT'],[cx2,S.Tc,'COLD']].forEach(([x,T,lab],bi)=>{
      ctx.save(); ctx.fillStyle=mixCol('#e6f2fd','#fde3da',clamp((T-250)/150,0,1)); ctx.fillRect(x-bw/2,by0,bw,bh); ctx.restore();
      rect(ctx,x-bw/2,by0,bw,bh,bi?COL.blue:COL.red,null,3.4);
      const amp=0.5+clamp((T-150)/300,0,1.6)*2.4;
      for(let r=0;r<4;r++) for(let c=0;c<4;c++){ const ax=x-bw/2+bw*(c+0.5)/4+Math.sin(t*14+r*3+c*5)*amp, ay=by0+bh*0.12+bh*0.72*(r+0.5)/4+Math.cos(t*13+r*2+c*7)*amp; circ(ctx,ax,ay,4.5,tempCol(T),'#fff',1.6); }
      textAt(ctx,lab+'  ·  '+fmt(T,0)+' K',x,by0-9,{size:13,weight:700,align:'center',color:bi?COL.blue:COL.red});
    });
    // ---- rod (cells coloured by temperature) with a gap when cut
    const x0=hx+bw/2, x1=cx2-bw/2, L=x1-x0, cw=L/N, rh=Math.min(h*0.05,22);
    const gp=S.gap.x*Math.min(26,L*0.06);
    for(let i=0;i<N;i++){ const off=i<N/2?-gp/2:gp/2; const X=x0+i*cw+off; ctx.save(); ctx.fillStyle=tempCol(S.rod[i]); ctx.globalAlpha=0.85; ctx.fillRect(X,rodY-rh/2,cw+0.6,rh); ctx.restore(); }
    line(ctx,x0-gp/2,rodY-rh/2,x1+gp/2,rodY-rh/2,COL.ink,2.2); line(ctx,x0-gp/2,rodY+rh/2,x1+gp/2,rodY+rh/2,COL.ink,2.2);
    if(S.gap.x>0.5){ textAt(ctx,'✕',(x0+x1)/2,rodY+5,{size:20,weight:700,color:COL.red,align:'center'}); }
    // heat flowing through the rod: hot → cold (red chevrons)
    const fm=clamp(Math.abs(S.flux)/900,0,1);
    if(conn && fm>0.01) for(let i=0;i<7;i++){ const p=(t*(0.25+fm*0.9)+i/7)%1, x=x0+p*L, d=Math.sign(S.flux)||1; ctx.save(); ctx.globalAlpha=Math.sin(p*Math.PI)*Math.min(1,0.2+fm*1.4); arrowHead(ctx,d>0?x:x1-(x-x0),rodY-rh-8,d>0?0:Math.PI,COL.red,8+fm*8); ctx.restore(); }
    textAt(ctx,conn?(Math.abs(S.flux)>8?fmt(Math.abs(S.flux),0)+' W  '+(S.flux>0?'hot → cold':'cold → hot'):'no net flow'):'rod cut — no conduction',(x0+x1)/2,rodY-rh-26,{size:12.5,weight:700,align:'center',color:conn&&Math.abs(S.flux)>8?COL.red:COL.mid});
    // ---- refrigerator between the blocks, pipes to each block
    const fx0=w*0.36, fx1=w*0.64, fy0=h*0.62, fy1=h*0.8, pyy=(fy0+fy1)/2;
    const act=Pw>0, pa=clamp(Qc/1500,0,1);
    const pipe=(ax,ay,bx,by,col,flow,rev)=>{ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=9; ctx.globalAlpha=0.18; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); ctx.restore(); line(ctx,ax,ay,bx,by,col,2.2,[7,5]);
      if(flow>0.02) for(let i=0;i<5;i++){ const p=(t*0.5+i/5)%1; const q=rev?1-p:p; const X=lerp(ax,bx,q), Y=lerp(ay,by,q); ctx.save(); ctx.globalAlpha=Math.sin(p*Math.PI); arrowHead(ctx,X,Y,Math.atan2((by-ay)*(rev?-1:1),(bx-ax)*(rev?-1:1)),col,8+flow*7); ctx.restore(); } };
    // cold block → fridge  (blue) ; fridge → hot block (red)
    ctx.save(); ctx.lineJoin='round';
    const cPath=[[cx2,by0+bh],[cx2,pyy],[fx1,pyy]], hPath=[[fx0,pyy],[hx,pyy],[hx,by0+bh]];
    [[cPath,COL.blue,pa,false],[hPath,COL.red,clamp((Qc+Pw)/1500,0,1),false]].forEach(([pp,col,fl])=>{ for(let i=1;i<pp.length;i++) pipe(pp[i-1][0],pp[i-1][1],pp[i][0],pp[i][1],col,act?fl:0,i===0); });
    ctx.restore();
    rrect(ctx,fx0,fy0,fx1-fx0,fy1-fy0,12); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.stroke();
    // compressor
    const cr=Math.min((fy1-fy0)*0.32,26), ccx=(fx0+fx1)/2, ccy=(fy0+fy1)/2;
    circ(ctx,ccx,ccy,cr,COL.green,'#e4f7ec',3); for(let i=0;i<4;i++){ const a=S.ph+i*Math.PI/2; line(ctx,ccx,ccy,ccx+Math.cos(a)*cr*0.85,ccy+Math.sin(a)*cr*0.85,COL.green,2.4); }
    textAt(ctx,'Refrigerator',ccx,fy0-8,{size:12.5,weight:700,align:'center'});
    // work in (green)
    if(act){ vec(ctx,ccx,fy1+h*0.13,ccx,fy1+3,COL.green,3+Pw/60); textAt(ctx,'W = '+Pw+' W',ccx+10,fy1+h*0.1,{size:12,weight:700,color:COL.green}); }
    if(act){ textAt(ctx,'Qc = '+fmt(Qc,0)+' W',(cx2+fx1)/2,pyy-10,{size:12,weight:700,color:COL.blue,align:'center'}); textAt(ctx,'Qh = Qc + W = '+fmt(Qc+Pw,0)+' W',(hx+fx0)/2,pyy-10,{size:12,weight:700,color:COL.red,align:'center'}); }
    $('#r1').textContent=fmt(S.Th,0)+' K'; $('#r2').textContent=fmt(S.Tc,0)+' K'; $('#r3').textContent=fmt(cop,1);
    let msg;
    if(act) msg='<div class="fb ok">Work W pumps heat cold → hot: Q<sub>h</sub> = Q<sub>c</sub> + W</div>';
    else if(fr&&!act) msg='<div class="fb warn">Fridge on but W = 0 — nothing is pumped</div>';
    else if(conn&&Math.abs(S.Th-S.Tc)<1) msg='<div class="fb ok">Equal temperatures — flow stops, never reverses by itself</div>';
    else if(conn) msg='<div class="fb warn">Heat flows hot → cold, never the other way</div>';
    else msg='<div class="fb warn">Rod cut — blocks keep their temperatures</div>';
    if($('#fb')._m!==msg){ $('#fb').innerHTML=msg; $('#fb')._m=msg; }
  });
  return wrap;
}

/* =====================================================================
   11.10 CARNOT ENGINE  (§11.11, Fig 11.9, Eq. 11.18–11.22)    n = 0.5 mol
   1→2 isothermal at T₁ :  Q₁ = nRT₁ ln(V₂/V₁)
   2→3 adiabatic        :  W = nR(T₁−T₂)/(γ−1) ,  T V^(γ−1) = const
   3→4 isothermal at T₂ :  Q₂ = nRT₂ ln(V₃/V₄)
   4→1 adiabatic        :  V₃/V₄ = V₂/V₁  ⇒  W = Q₁ − Q₂ ,  η = 1 − T₂/T₁
   ===================================================================== */
function buildA10(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><div class="toggle-group" style="margin-top:0"><button class="toggle-btn play" id="go">⏸ Pause</button></div>
      <div class="step-row" id="stp" style="margin-top:8px"><button class="step-pill" data-s="0">① hot</button><button class="step-pill" data-s="1">② expand</button><button class="step-pill" data-s="2">③ cold</button><button class="step-pill" data-s="3">④ squeeze</button></div>
      <label style="margin-top:10px;">Speed <span class="val" id="spV"></span></label><input type="range" id="spR" min="1" max="10" step="1" value="4"></div>
    <div class="control-group"><label>Hot reservoir  T₁ <span class="val" id="t1V"></span></label><input type="range" id="t1R" min="400" max="900" step="5" value="600"></div>
    <div class="control-group"><label>Cold reservoir  T₂ <span class="val" id="t2V"></span></label><input type="range" id="t2R" min="200" max="400" step="5" value="300">
      <label style="margin-top:10px;">Expansion ratio  V₂/V₁ <span class="val" id="rV"></span></label><input type="range" id="rR" min="1.5" max="3" step="0.05" value="2"></div>
    <div class="control-group"><label style="margin-bottom:6px;">Gas</label>
      <div class="toggle-group" id="gB"><button class="toggle-btn active" data-g="1.667">Monatomic</button><button class="toggle-btn" data-g="1.4">Diatomic</button></div></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel">Heat in Q₁</div><div class="rval" id="r1" style="color:var(--f-red)">—</div></div>
      <div class="rcard"><div class="rlabel">Heat out Q₂</div><div class="rval" id="r2" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel">Work W</div><div class="rval" id="r3" style="color:var(--f-green)">—</div></div>
      <div class="rcard wide"><div class="rlabel">Efficiency  η = W / Q₁ = 1 − T₂/T₁</div><div class="rval" id="r4">—</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), n=0.5, nR=n*R_GAS;
  const sl={t1:$('#t1R'),t2:$('#t2R'),r:$('#rR'),sp:$('#spR')};
  let g=1.667, playing=true, seek=null, t=0;
  const P={T1:600,T2:300,r:2,g:1.667};            // eased copies of the sliders — nothing jumps
  const S={phi:0, cx:{x:0,v:0}, vsc:60, psc:300, init:false};
  const gas=makeGas(36);
  toggleWire(wrap.querySelectorAll('#gB button'),b=>g=+b.dataset.g);
  const pills=[...wrap.querySelectorAll('#stp .step-pill')];
  pills.forEach(p=>p.onclick=()=>{ seek=+p.dataset.s; playing=false; $('#go').textContent='▶ Run'; });
  $('#go').onclick=()=>{ playing=!playing; seek=null; $('#go').textContent=playing?'⏸ Pause':'▶ Run'; };
  function geom(){ const V1=10, V2=V1*P.r, k=Math.pow(P.T1/P.T2,1/(P.g-1)), V3=V2*k, V4=V1*k;
    return {V1,V2,V3,V4,P1:nR*P.T1/V1,P2:nR*P.T1/V2,P3:nR*P.T2/V3,P4:nR*P.T2/V4}; }
  function at(phi,G){                         // state at playhead phi ∈ [0,4)
    const s=Math.floor(phi)%4, e=smooth01(0,1,phi-Math.floor(phi)), g_=P.g, T1=P.T1, T2=P.T2;
    let V,T,W=0,Q1=0,Q2=0;
    const W1=nR*T1*Math.log(G.V2/G.V1), W2=nR*(T1-T2)/(g_-1), W3=nR*T2*Math.log(G.V3/G.V4);   // W3 positive magnitude of work done ON gas
    if(s===0){ V=lerp(G.V1,G.V2,e); T=T1; W=nR*T1*Math.log(V/G.V1); Q1=W; }
    else if(s===1){ V=lerp(G.V2,G.V3,e); T=T1*Math.pow(G.V2/V,g_-1); W=W1+nR*(T1-T)/(g_-1); Q1=W1; }
    else if(s===2){ V=lerp(G.V3,G.V4,e); T=T2; W=W1+W2+nR*T2*Math.log(V/G.V3); Q1=W1; Q2=-nR*T2*Math.log(V/G.V3); }
    else { V=lerp(G.V4,G.V1,e); T=T2*Math.pow(G.V4/V,g_-1); W=W1+W2-W3-nR*(T-T2)/(g_-1)*1; Q1=W1; Q2=W3; }
    return {s,V,T,Pr:nR*T/V,W,Q1,Q2,e};
  }
  animLoop((dt)=>{
    t+=dt;
    const T1t=+sl.t1.value; let T2t=+sl.t2.value; T2t=Math.min(T2t,T1t-100);
    $('#t1V').textContent=T1t+' K'; $('#t2V').textContent=T2t+' K'; $('#rV').textContent='× '+fmt(+sl.r.value,2); $('#spV').textContent=sl.sp.value;
    P.T1=approach(P.T1,T1t,6,dt); P.T2=approach(P.T2,T2t,6,dt); P.r=approach(P.r,+sl.r.value,6,dt); P.g=approach(P.g,g,6,dt);
    if(seek!==null){ const d=(((seek-S.phi+2)%4)+4)%4-2; S.phi+=d*(1-Math.exp(-3*dt)); if(Math.abs(d)<0.01){ S.phi=seek; seek=null; } }
    else if(playing) S.phi+=dt*(+sl.sp.value)*0.05;
    S.phi=((S.phi%4)+4)%4;
    const G=geom(), st=at(S.phi,G), V=st.V, T=st.T;
    const Wc=G.V2>0?nR*P.T1*Math.log(G.V2/G.V1)-nR*P.T2*Math.log(G.V3/G.V4):0, Q1f=nR*P.T1*Math.log(G.V2/G.V1), Q2f=nR*P.T2*Math.log(G.V3/G.V4);
    pills.forEach((p,i)=>p.classList.toggle('active',i===st.s));

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    const u=S.phi-Math.floor(S.phi), nxt=(st.s+1)%4, slotOf=s=>s===0?0:s===2?2:1;
    springTo(S.cx,slotX[slotOf(u>0.9?nxt:st.s)],20,8.5,dt);
    const baseY=h*0.6, topY=h*0.07, Hc=baseY-topY-20;
    S.vsc=approach(S.vsc,G.V3*1.06,5,dt);
    const pistonY=baseY-Hc*V/S.vsc, cx=S.cx.x;
    const blkTop=baseY+4, blkH=h*0.12;
    // hot block
    rect(ctx,slotX[0]-bw/2,blkTop,bw,blkH,COL.red,'#fde3da',3);
    for(let i=0;i<3;i++){ const ph=(t*0.6+i/3)%1; ctx.save(); ctx.globalAlpha=(1-ph)*0.8; ctx.strokeStyle=COL.red; ctx.lineWidth=1.8; ctx.beginPath(); for(let q=0;q<=8;q++){ const yy=blkTop+blkH-8-q*2.6-ph*8, xx=slotX[0]-bw*0.3+i*bw*0.3+Math.sin(q*0.9+t*5)*3; q?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);} ctx.stroke(); ctx.restore(); }
    textAt(ctx,'T₁ = '+fmt(P.T1,0)+' K',slotX[0],blkTop+blkH+h*0.05,{size:12.5,weight:700,align:'center',color:COL.red});
    // insulating stand
    ctx.save(); ctx.beginPath(); ctx.rect(slotX[1]-bw/2,blkTop,bw,blkH); ctx.clip(); ctx.fillStyle='#f6f9fc'; ctx.fillRect(slotX[1]-bw/2,blkTop,bw,blkH); ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; ctx.beginPath(); for(let x=slotX[1]-bw/2-blkH;x<slotX[1]+bw/2;x+=9){ ctx.moveTo(x,blkTop+blkH); ctx.lineTo(x+blkH,blkTop); } ctx.stroke(); ctx.restore();
    rect(ctx,slotX[1]-bw/2,blkTop,bw,blkH,COL.ink,null,2.2);
    textAt(ctx,'insulator',slotX[1],blkTop+blkH+h*0.045,{size:12,weight:700,align:'center',color:COL.mid});
    // cold block
    rect(ctx,slotX[2]-bw/2,blkTop,bw,blkH,COL.blue,'#e6f2fd',3);
    ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=1.6; for(let i=0;i<3;i++){ const ph=(t*0.5+i/3)%1; ctx.globalAlpha=Math.sin(ph*Math.PI); line(ctx,slotX[2]-bw*0.3+i*bw*0.3,blkTop+6+ph*(blkH-20),slotX[2]-bw*0.3+i*bw*0.3,blkTop+14+ph*(blkH-20),COL.blue,1.8); } ctx.restore();
    textAt(ctx,'T₂ = '+fmt(P.T2,0)+' K',slotX[2],blkTop+blkH+h*0.05,{size:12.5,weight:700,align:'center',color:COL.blue});
    // cylinder
    const cyl=drawCylinder(ctx,{cx,baseY,wd,topY,pistonY,jacket:'sides',rodTop:pistonY-14-Hc*0.2});
    stepGas(gas,dt,gasSpeed(T,h)*1.1,cyl.w-8,cyl.h-8,4.5); drawGas(ctx,gas,cyl.x+4,cyl.y+4,cyl.w-8,cyl.h-8,T,4.5);
    // heat flow arrows at the contact (only when the cylinder has settled on a reservoir)
    const settled=Math.abs(S.cx.x-slotX[slotOf(st.s)])<4&&Math.abs(S.cx.v)<30;
    if(settled&&st.s===0&&u>0.04&&u<0.96) for(let i=-1;i<=1;i++) vec(ctx,cx+i*wd*0.28,baseY+36,cx+i*wd*0.28,baseY+8,COL.red,3.2);
    if(settled&&st.s===2&&u>0.04&&u<0.96) for(let i=-1;i<=1;i++) vec(ctx,cx+i*wd*0.28,baseY+8,cx+i*wd*0.28,baseY+36,COL.blue,3.2);
    textAt(ctx,['① isothermal · absorbs Q₁','② adiabatic · cools','③ isothermal · rejects Q₂','④ adiabatic · warms'][st.s],w*0.225,h*0.035,{size:13,weight:700,align:'center',color:[COL.red,COL.ink,COL.blue,COL.ink][st.s]});
    thermo(ctx,w*0.03,topY+30,baseY-40,clamp((T-150)/800,0,1),COL.ink,tempCol(T));
    textAt(ctx,fmt(T,0)+' K',w*0.03,baseY-8,{size:11.5,weight:700,align:'center',color:tempCol(T)});
    // ---- P–V diagram
    const px=w*0.5, py=h*0.1, pw=w*0.46, ph=h*0.58;
    S.psc=approach(S.psc,G.P1*1.12,5,dt);
    const F=pvFrame(ctx,px,py,pw,ph,0,S.vsc,0,S.psc,{tx:niceTicks(S.vsc,5),ty:niceTicks(S.psc,5),xl:'V (L)',yl:'P (kPa)'});
    const br=(fn,va,vb,col,lw,al,dash)=>{ ctx.save(); ctx.globalAlpha=al; ctx.strokeStyle=col; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash); ctx.beginPath(); const nn=50; for(let i=0;i<=nn;i++){ const v=lerp(va,vb,i/nn); i?ctx.lineTo(F.X(v),F.Y(fn(v))):ctx.moveTo(F.X(v),F.Y(fn(v))); } ctx.stroke(); ctx.restore(); };
    const f1=v=>nR*P.T1/v, f2=v=>G.P2*Math.pow(G.V2/v,P.g), f3=v=>nR*P.T2/v, f4=v=>G.P1*Math.pow(G.V1/v,P.g);

    ctx.save(); ctx.fillStyle='rgba(31,157,85,0.17)'; ctx.beginPath(); const NN=40;
    for(let i=0;i<=NN;i++){ const v=lerp(G.V1,G.V2,i/NN); i?ctx.lineTo(F.X(v),F.Y(f1(v))):ctx.moveTo(F.X(v),F.Y(f1(v))); }
    for(let i=0;i<=NN;i++){ const v=lerp(G.V2,G.V3,i/NN); ctx.lineTo(F.X(v),F.Y(f2(v))); }
    for(let i=0;i<=NN;i++){ const v=lerp(G.V3,G.V4,i/NN); ctx.lineTo(F.X(v),F.Y(f3(v))); }
    for(let i=0;i<=NN;i++){ const v=lerp(G.V4,G.V1,i/NN); ctx.lineTo(F.X(v),F.Y(f4(v))); }
    ctx.closePath(); ctx.fill(); ctx.restore();
    const act=s=>st.s===s?4:2.2, alp=s=>st.s===s?1:0.6;
    br(f1,G.V1,G.V2,COL.red,act(0),alp(0)); br(f2,G.V2,G.V3,COL.ink,act(1),alp(1),[7,5]); br(f3,G.V4,G.V3,COL.blue,act(2),alp(2)); br(f4,G.V1,G.V4,COL.ink,act(3),alp(3),[7,5]);
    [[G.V1,G.P1,'1'],[G.V2,G.P2,'2'],[G.V3,G.P3,'3'],[G.V4,G.P4,'4']].forEach(([v,p,l])=>{ circ(ctx,F.X(v),F.Y(p),5.5,COL.ink,'#fff',2.2); textAt(ctx,l,F.X(v)+(l==='1'||l==='4'?-18:9),F.Y(p)+(l==='1'||l==='2'?-7:16),{size:15,weight:700}); });
    const dc=[COL.red,COL.ink,COL.blue,COL.ink][st.s];
    circ(ctx,F.X(V),F.Y(st.Pr),6.5,dc,dc,2); circ(ctx,F.X(V),F.Y(st.Pr),11+Math.sin(t*6)*2,dc,null,1.4);
    textAt(ctx,'Work = enclosed area',F.x+F.w*0.62,F.y+F.h*0.42,{size:12,weight:700,color:COL.green,align:'center'});
    // legend
    [['isothermal T₁',COL.red,0],['adiabatic',COL.ink,1],['isothermal T₂',COL.blue,2]].forEach(([n_,c,i])=>{ const yy=py+10+i*16; line(ctx,px+pw-124,yy-4,px+pw-102,yy-4,c,3,i===1?[5,3]:null); textAt(ctx,n_,px+pw-96,yy,{size:11,weight:600,color:COL.muted}); });
    // ---- running tallies (this cycle)
    const bx=px, bwid=pw, by=h*0.82, M=Q1f*1.05;
    hbar(ctx,bx,by,bwid*0.31,14,st.Q1,M,COL.red,'Q₁ in',fmt(st.Q1,0)+' J');
    hbar(ctx,bx+bwid*0.345,by,bwid*0.31,14,st.Q2,M,COL.blue,'Q₂ out',fmt(st.Q2,0)+' J');
    hbar(ctx,bx+bwid*0.69,by,bwid*0.31,14,st.W,M,COL.green,'W so far',fmt(st.W,0)+' J');
    textAt(ctx,'η = 1 − T₂/T₁ = 1 − '+fmt(P.T2,0)+'/'+fmt(P.T1,0)+' = '+fmt((1-P.T2/P.T1)*100,1)+' %',bx+bwid/2,h*0.94,{size:14,weight:700,align:'center'});
    $('#r1').textContent=fmt(Q1f,0)+' J'; $('#r2').textContent=fmt(Q2f,0)+' J'; $('#r3').textContent=fmt(Wc,0)+' J'; $('#r4').textContent=fmt(Wc/Q1f*100,1)+' %';
  });
  return wrap;
}

  { num:'11.2',  title:'Thermal Equilibrium', desc:'Open the walls · temperatures meet',            build:'buildA2' },
  { num:'11.3',  title:'Heat and Work',       desc:'Two ways to warm a gas',                        build:'buildA3' },
  { num:'11.4',  title:'First Law · Cv, Cp',  desc:'Same heat · locked vs free piston',             build:'buildA4' },
  { num:'11.5',  title:'Water to Steam',      desc:'Where does 2256 J go?',                         build:'buildA5' },
  { num:'11.6',  title:'Path Dependence',     desc:'Same two states · different paths',             build:'buildA6' },
  { num:'11.7',  title:'Slow vs Sudden',      desc:'Sand grains · lifted weight · free expansion',  build:'buildA7' },
  { num:'11.8',  title:'Gas Processes',       desc:'Isothermal · adiabatic · isobaric · isochoric', build:'buildA8' },
  { num:'11.9',  title:'Second Law',          desc:'Heat runs downhill · a fridge needs work',      build:'buildA9' },
  { num:'11.10', title:'Carnot Engine',       desc:'Run the four-step cycle',                       build:'buildA10' },
].filter(a=>typeof window[a.build]==='function');
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(window[a.build]());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}
const _q=new URLSearchParams(location.search).get('a'); if(_q){ const i=activities.findIndex(a=>a.num===_q); if(i>=0) currentIndex=i; }
render();
