<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.play.on{background:var(--f-red); border-color:var(--f-red);}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn:hover{border-color:var(--navy-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}
.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.fb{font-size:var(--fs-xs); font-weight:600; padding:5px 8px; border-radius:7px; background:#fdf4dc; color:#8a6410;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

<div class="app">

<script>
/* GRADE 11 — CHAPTER 5: LINEAR INEQUALITIES
   Every activity runs a continuous animation loop. Sliders and buttons only set a TARGET;
   the drawn object follows it on a spring-damper or real physics (falling and bouncing sacks,
   a swinging balance beam, a ball rolling down a plank, rising mercury, a filling tank).
   Colour code: yellow = the value you test · red = left side / limit · blue = right side / result · green = solution / true. */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab', grid:'#e3eaf3'};
const PI=Math.PI, TAU=2*Math.PI, D2R=PI/180;

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.lineCap='round';
  ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width,head){
  const L=Math.hypot(x2-x1,y2-y1); if(L<1.5) return;
  line(ctx,x1,y1,x2,y2,color,width||2.8);
  if(L>(head||9)*1.2) arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,head||9);
}
function textAt(ctx,txt,x,y,o){
  o=o||{}; ctx.save();
  ctx.font=(o.weight||500)+' '+(o.size||12)+'px Poppins, sans-serif';
  ctx.textAlign=o.align||'left'; ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!==undefined) ctx.globalAlpha=o.alpha;
  if(o.halo){ ctx.lineJoin='round'; ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.strokeText(txt,x,y); }
  ctx.fillStyle=o.color||COL.ink; ctx.fillText(txt,x,y); ctx.restore();
}
function lab(ctx,txt,x,y,color,o){ o=o||{}; o.halo=true; o.color=color; o.weight=o.weight||700; o.size=o.size||13; textAt(ctx,txt,x,y,o); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,TAU); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.stroke();} ctx.restore(); }
function dot(ctx,x,y,r,col){ circ(ctx,x,y,r,'#fff',col,1.8); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function poly(ctx,pts,stroke,fill,lw,dash){ ctx.save(); ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw||2; ctx.setLineDash(dash||[]); ctx.lineJoin='round'; ctx.stroke();} ctx.restore(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function sg(v,d){ if(!isFinite(v)) return 'not defined'; d=d===undefined?2:d; const s=Number(v.toFixed(d)); return (Object.is(s,-0)||s===0?'0':String(s)).replace('-','−'); }
function fmt(x,d){ return sg(x,d); }
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'; }
function normAng(a){ return ((a%TAU)+TAU)%TAU; }
function gcd(a,b){ return b?gcd(b,a%b):a; }

/* angle (radians) as a multiple of π, e.g. 7π/3 */
function piStr(x){
  if(Math.abs(x)<1e-9) return '0';
  const r=x/PI;
  for(const d of [1,2,3,4,6,8,12]){
    const n=Math.round(r*d);
    if(n!==0 && Math.abs(r*d-n)<0.004){
      const num=Math.abs(n)===1?'π':Math.abs(n)+'π';
      return (n<0?'−':'')+num+(d>1?'/'+d:'');
    }
  }
  return sg(x,2);
}
/* exact fraction if one exists with a small denominator, else a decimal */
function frac(v){
  if(!isFinite(v)) return 'not defined';
  if(Math.abs(v)<1e-9) return '0';
  for(let q=1;q<=100;q++){ const p=Math.round(v*q);
    if(Math.abs(v-p/q)<1e-6) return (p<0?'−':'')+Math.abs(p)+(q>1?'/'+q:''); }
  return sg(v,3);
}
/* point on a circle: maths angle a (anticlockwise), canvas y runs down */
function pt(cx,cy,R,a){ return [cx+R*Math.cos(a), cy-R*Math.sin(a)]; }
/* arc between two maths angles */
function arcA(ctx,cx,cy,r,a0,a1,col,lw,dash){
  if(Math.abs(a1-a0)<1e-4) return;
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||2.4; ctx.lineCap='round'; ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.arc(cx,cy,r,-a0,-a1,a1>a0); ctx.stroke(); ctx.restore();
}
function sector(ctx,cx,cy,r,a0,a1,fill){
  if(Math.abs(a1-a0)<1e-4) return;
  ctx.save(); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,-a0,-a1,a1>a0); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); ctx.restore();
}
/* the unit circle with axes and radian ticks */
function unitFrame(ctx,cx,cy,R,o){
  o=o||{};
  const E=R*(o.ext||1.3);
  line(ctx,cx-E,cy,cx+E,cy,COL.mid,1.4); line(ctx,cx,cy-E,cx,cy+E,COL.mid,1.4);
  arrowHead(ctx,cx+E,cy,0,COL.mid,6); arrowHead(ctx,cx,cy-E,-PI/2,COL.mid,6);
  if(o.fill) circ(ctx,cx,cy,R,null,o.fill,1);
  circ(ctx,cx,cy,R,COL.ink,null,2.4);
  if(o.ticks!==false){
    [[0,'0'],[PI/2,'π/2'],[PI,'π'],[1.5*PI,'3π/2']].forEach(([a,s])=>{
      const [x,y]=pt(cx,cy,R,a), [lx,ly]=pt(cx,cy,R+17,a);
      circ(ctx,x,y,3,COL.ink,'#fff',1.4);
      textAt(ctx,s,lx,ly+4,{align:'center',size:10.5,weight:600,color:COL.muted});
    });
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now(); let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000)); last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — natural overshoot and settle. */
function springTo(st,target,k,damping,dt){
  const acc = (target-st.x)*k - st.v*damping;
  st.v += acc*dt; st.x += st.v*dt; return st.x;
}
const SK=70, SD=12;                         // the house spring: ω≈8.4 rad/s, ζ≈0.72
function follow(st,target,dt){ return springTo(st,target,SK,SD,dt); }
function S(v){ return {x:v,v:0}; }

/* ---------------------------------------------------------------------
   0c. UI BUILDERS
   --------------------------------------------------------------------- */
function slider(id,label,min,max,step,val){
  return `<div class="control-group"><label>${label}<span class="val" id="${id}V"></span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}
function chipRow(id,label,items){
  return `<div class="control-group"><label>${label}</label><div class="chip-wrap" id="${id}">${items.map((it,i)=>`<button class="chip-btn" data-i="${i}">${it}</button>`).join('')}</div></div>`;
}
function cards(list,cls){
  return `<div class="control-group"><div class="result-cards ${cls||''}">${list.map(([id,l,c,wide])=>`<div class="rcard${wide?' wide':''}"><div class="rlabel">${l}</div><div class="rval" id="${id}"${c?` style="color:var(${c})"`:''}>—</div></div>`).join('')}</div></div>`;
}
function wireChips(wrap,id,fn){ wrap.querySelectorAll('#'+id+' .chip-btn').forEach(b=>b.onclick=()=>fn(+b.dataset.i,b)); }
function setActive(wrap,id,i){ wrap.querySelectorAll('#'+id+' .chip-btn').forEach((b,k)=>b.classList.toggle('active',k===i)); }
function playBtn(id,txt){ return `<button class="toggle-btn play" id="${id}" style="padding:10px;">${txt||'▶ Spin'}</button>`; }
function setPlay(btn,on,txtOn,txtOff){ btn.textContent=on?(txtOn||'❚❚ Pause'):(txtOff||'▶ Spin'); btn.classList.toggle('on',on); }

/* ---------------------------------------------------------------------
   INEQUALITY TOOLKIT
   --------------------------------------------------------------------- */
const flipS = s => ({'<':'>','>':'<','≤':'≥','≥':'≤'})[s];
const holds = (l,s,r)=>{ const e=1e-9; return s==='<'?l<r-e : s==='≤'?l<=r+e : s==='>'?l>r+e : l>=r-e; };
const cmpS  = (l,r)=> Math.abs(l-r)<1e-9 ? '=' : (l<r?'<':'>');
const ease=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
function val(wrap,id,txt){ wrap.querySelector('#'+id+'V').textContent=txt; }
function showGroup(wrap,id,on){ wrap.querySelector('#'+id).closest('.control-group').classList.toggle('hidden',!on); }
function lbl(wrap,id,txt){ wrap.querySelector('#'+id).closest('.control-group').querySelector('label').firstChild.nodeValue=txt; }
function bounceSpring(st,target,dt){ return springTo(st,target,55,7,dt); }   // livelier: ζ≈0.47

/* coloured text runs on one baseline */
function runs(ctx,x,y,arr,size,align){
  ctx.save(); ctx.font='700 '+size+'px Poppins, sans-serif'; ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  const ws=arr.map(a=>ctx.measureText(a[0]).width), tot=ws.reduce((p,c)=>p+c,0);
  let cx = align==='center'?x-tot/2 : align==='right'?x-tot : x;
  arr.forEach((a,i)=>{ ctx.lineJoin='round'; ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.strokeText(a[0],cx,y); ctx.fillStyle=a[1]; ctx.fillText(a[0],cx,y); cx+=ws[i]; });
  ctx.restore();
}
function pill(ctx,txt,x,y,col,size){
  size=size||12; ctx.save(); ctx.font='700 '+size+'px Poppins, sans-serif';
  const w=ctx.measureText(txt).width+20, h=size+13; rrect(ctx,x-w/2,y-h/2,w,h,h/2);
  ctx.fillStyle=rgba(col,.13); ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke();
  ctx.fillStyle=col; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,x,y+1); ctx.restore();
}
/* number line; returns value→pixel mapper */
function axis(ctx,x0,x1,y,lo,hi,step,o){
  o=o||{}; const X=v=>x0+(v-lo)/(hi-lo)*(x1-x0);
  line(ctx,x0+5,y,x1-5,y,COL.mid,2); arrowHead(ctx,x1,y,0,COL.mid,8); arrowHead(ctx,x0,y,PI,COL.mid,8);
  const a=Math.ceil(lo/step-1e-9)*step, n=Math.floor((hi-a)/step+1e-9);
  for(let i=0;i<=n;i++){ const v=a+i*step, x=X(v); line(ctx,x,y-5,x,y+5,COL.mid,1.4);
    if(!o.noLabels) textAt(ctx,sg(v,2),x,y+21,{align:'center',size:o.size||11,weight:600,color:COL.mid}); }
  return X;
}
/* thick interval / ray on a number line with open or closed end circles */
function ivl(ctx,X,y,a,b,aOpen,bOpen,col,infA,infB,lw){
  lw=lw||7; if(b<a-1e-9) return; const xa=X(a), xb=X(b);
  line(ctx,xa,y,xb,y,col,lw);
  if(infA) arrowHead(ctx,xa-3,y,PI,col,15); else circ(ctx,xa,y,9,col,aOpen?'#fff':col,3.4);
  if(infB) arrowHead(ctx,xb+3,y,0,col,15);  else circ(ctx,xb,y,9,col,bOpen?'#fff':col,3.4);
}
/* a spring-balance style scene object: stand + swinging beam + two hanging trays */
function balance(ctx,cx,by,S,ang,drawL,drawR){
  const pv=by-1.35*S;
  poly(ctx,[[cx-.5*S,by],[cx+.5*S,by],[cx+.36*S,by-.09*S],[cx-.36*S,by-.09*S]],COL.ink,'#eef2f8',2.2);
  line(ctx,cx,by-.09*S,cx,pv,COL.ink,4.5);
  const c=Math.cos(ang), s=Math.sin(ang), L=[cx-S*c,pv+S*s], R=[cx+S*c,pv-S*s];
  line(ctx,L[0],L[1],R[0],R[1],COL.ink,5.5);
  const hang=S, pw=.36*S;
  [[L,drawL,COL.red],[R,drawR,COL.blue]].forEach(([e,fn,col])=>{
    const py=e[1]+hang;
    line(ctx,e[0],e[1],e[0]-pw,py,COL.mid,1.8); line(ctx,e[0],e[1],e[0]+pw,py,COL.mid,1.8);
    if(fn) fn(e[0],py+.07*S,pw);
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(e[0]-pw-4,py); ctx.quadraticCurveTo(e[0],py+.17*S,e[0]+pw+4,py); ctx.stroke(); ctx.restore();
    dot(ctx,e[0],e[1],5,col);
  });
  circ(ctx,cx,pv,7,COL.ink,'#fff',3.2);
}
/* items that fall into place, bounce and settle (units of S; gravity 16 S/s²) */
function mkDrops(n){ return Array.from({length:n},()=>({y:6,v:0,in:false})); }
function stepDrops(ds,cnt,dt){
  let landed=0, impact=0;
  ds.forEach((s,i)=>{
    const want=i<cnt;
    if(want&&!s.in){ s.in=true; s.y=Math.max(s.y,3); s.v=0; }
    if(!want&&s.in) s.in=false;
    if(s.in){
      s.v-=16*dt; s.y+=s.v*dt;
      if(s.y<=0){ s.y=0; if(s.v<-1.4) impact+=-s.v; s.v=-s.v*0.36; if(Math.abs(s.v)<0.9) s.v=0; }
      if(s.y<0.04&&s.v===0) landed++;
    } else s.y+=(6-s.y)*(1-Math.exp(-4*dt));
  });
  return {landed,impact};
}
const dAlpha = s => s.in?1:clamp((4.6-s.y)/2.6,0,1);
/* a pyramid slot: rows hold rn[0], rn[1], … items */
function pyr(i,rn){ let r=0; while(i>=rn[r]){ i-=rn[r]; r++; } return {row:r,col:i,n:rn[r]}; }

/* piston posts + plank + a ball rolling downhill on it; values in "units", u = px per unit */
function plank(ctx,R,va,vb,u,zeroY,bs,dt,o){
  o=o||{}; const cx=R.x+R.w/2, half=Math.min(R.w*.34,260), xl=cx-half, xr=cx+half, ground=R.y+R.h-4;
  line(ctx,R.x+6,zeroY,R.x+R.w-6,zeroY,COL.mid,1.3,[5,5]); textAt(ctx,'0',R.x+10,zeroY-5,{size:11,weight:700,color:COL.mid});
  line(ctx,R.x+6,ground,R.x+R.w-6,ground,COL.ink,2.4);
  const yl=zeroY-va*u, yr=zeroY-vb*u;
  if(o.ghost){ line(ctx,xl,zeroY-o.ghost[0]*u,xr,zeroY-o.ghost[1]*u,COL.mid,3,[7,6]); dot(ctx,xl,zeroY-o.ghost[0]*u,4,COL.mid); dot(ctx,xr,zeroY-o.ghost[1]*u,4,COL.mid); }
  [[xl,yl,COL.red,va],[xr,yr,COL.blue,vb]].forEach(([x,y,col,v],i)=>{
    ctx.save(); rrect(ctx,x-11,Math.min(y,ground-6),22,Math.max(6,ground-Math.min(y,ground-6)),5); ctx.fillStyle=rgba(col,.12); ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
    line(ctx,x,y,x,y+Math.min(26,ground-y),col,6);
    lab(ctx,sg(v,1),x,y-(i?22:22),col,{align:'center',size:15});
  });
  line(ctx,xl,yl,xr,yr,COL.ink,6.5); dot(ctx,xl,yl,6,COL.ink); dot(ctx,xr,yr,6,COL.ink);
  // rolling ball (real incline physics, rolling resistance)
  const len=Math.hypot(xr-xl,yr-yl), sl=(yr-yl)/len, dx=(xr-xl)/len, dy=(yr-yl)/len, r=13;
  bs.v+= (1500*sl - 1.6*bs.v)*dt; bs.s+=bs.v*dt/len;
  const lo=(r+8)/len, hi=1-lo; if(bs.s<lo){ bs.s=lo; bs.v=Math.abs(bs.v)*.35; } if(bs.s>hi){ bs.s=hi; bs.v=-Math.abs(bs.v)*.35; }
  bs.rot=(bs.rot||0)+bs.v*dt/r;
  const bx=xl+(xr-xl)*bs.s + dy*(r+3), by=yl+(yr-yl)*bs.s - dx*(r+3);
  circ(ctx,bx,by,r,COL.yellow,'#fff',3.2);
  for(let k=0;k<3;k++){ const a=bs.rot+k*TAU/3; line(ctx,bx,by,bx+r*Math.cos(a),by+r*Math.sin(a),k?COL.mid:COL.yellow,k?1.4:3); }
  return {xl,xr,yl,yr};
}

const tickStep = E => E<=12?1 : E<=26?2 : E<=60?5 : 10;

/* =====================================================================

          const al=dAlpha(s); if(al<=0.01) return; const q=pyr(i,rn);

/* =====================================================================

function buildA2(){
  const wrap=labShell();

  const $=s=>wrap.querySelector(s), canvas=$('canvas'), xs=$('#x'), ys=$('#y');
  const sets=[[1,2],[1,4],[3,0],[2,3]];
  wireChips(wrap,'pre',i=>{ xs.value=sets[i][0]; ys.value=sets[i][1]; setActive(wrap,'pre',i); });
  [xs,ys].forEach(e=>e.addEventListener('input',()=>setActive(wrap,'pre',-1)));

    springTo(spent,40*a.landed+20*b.landed,60,6.5,dt); follow(ring[0],x,dt); follow(ring[1],y,dt);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // ---- left: the shop table

    const ty=h*.58;                                   // table top
    line(ctx,L.x,ty,L.x+L.w,ty,COL.ink,4); line(ctx,L.x+14,ty,L.x+14,h*.9,COL.ink,3); line(ctx,L.x+L.w-14,ty,L.x+L.w-14,h*.9,COL.ink,3);
    // purse
    const px0=L.x+L.w*.5, py0=h*.07;

    textAt(ctx,'₹120',px0,py0+U*.82,{align:'center',size:U*.55,weight:700,color:COL.blue});
    // notebooks
    regs.forEach((s,i)=>{ const al=dAlpha(s); if(al<.01) return; const bw=U*.9, bh=U*1.15, bx=L.x+L.w*.1+i*(bw+U*.14), byb=ty-s.y*U*3;
      ctx.save(); ctx.globalAlpha=al; rrect(ctx,bx,byb-bh,bw,bh,5); ctx.fillStyle=rgba(COL.red,.13); ctx.fill(); ctx.strokeStyle=COL.red; ctx.lineWidth=2.6; ctx.stroke();

      poly(ctx,[[pl*.3,-4],[pl*.5,0],[pl*.3,4]],COL.blue,COL.blue,1.5); ctx.restore(); });
    // money bar
    const mx0=L.x+14, mx1=L.x+L.w-14, my=h*.8, mh=h*.075, M=v=>mx0+(mx1-mx0)*v/200;

/* =====================================================================

   Two posts hold a plank; a ball rolls down it. Lifting both posts by k
   moves the whole plank rigidly — the slope, and the ball, do not change.
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    chipRow('pre','Try',['3 < 5','−4 < 2','7 > 1','−6 < −2']) +
    slider('a','Left side,  a',-10,10,1,3) + slider('b','Right side,  b',-10,10,1,5) +
    slider('k','Add k to both sides  (− = subtract)',-10,10,1,0) +
    cards([['r1','Before'],['r2','After adding k','--f-blue'],['r3','Sign of the inequality','--f-green',true]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), as=$('#a'), bs=$('#b'), ks=$('#k');
  const sets=[[3,5],[-4,2],[7,1],[-6,-2]];
  wireChips(wrap,'pre',i=>{ as.value=sets[i][0]; bs.value=sets[i][1]; setActive(wrap,'pre',i); });
  [as,bs].forEach(e=>e.addEventListener('input',()=>setActive(wrap,'pre',-1)));
  setActive(wrap,'pre',0);
  const A=S(3), B=S(5), E=S(12), ball={s:.5,v:0};
  animLoop(dt=>{
    const a=+as.value, b=+bs.value, k=+ks.value; val(wrap,'a',a); val(wrap,'b',b); val(wrap,'k',(k>0?'+':'')+k);
    bounceSpring(A,a+k,dt); bounceSpring(B,b+k,dt);
    E.x=approach(E.x,Math.max(10,Math.abs(a+k),Math.abs(b+k),Math.abs(a),Math.abs(b))*1.15,4,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const R={x:0,y:h*.2,w:w,h:h*.78}, u=(R.h*.5-34)/E.x, zeroY=R.y+R.h*.5;
    plank(ctx,R,A.x,B.x,u,zeroY,ball,dt,{ghost:[a,b]});
    // yellow lift arrows
    const cx=w/2, half=Math.min(R.w*.34,260);
    if(k!==0) [cx-half,cx+half].forEach((x,i)=>{ const y0=zeroY-(i?b:a)*u, y1=zeroY-(i?B.x:A.x)*u; vec(ctx,x+26,y0,x+26,y1,COL.yellow,4.4,10); });
    const sa=cmpS(a,b), sb=cmpS(a+k,b+k), kk=(k<0?'− '+(-k):'+ '+k);
    runs(ctx,w/2,h*.07,[[String(a),COL.red],['  '+sa+'  ',COL.ink],[String(b),COL.blue]],Math.min(24,w*.035),'center');
    if(k!==0) runs(ctx,w/2,h*.15,[[a+' '+kk+' = ',COL.muted],[String(a+k),COL.red],['  '+sb+'  ',COL.ink],[b+' '+kk+' = ',COL.muted],[String(b+k),COL.blue]],Math.min(20,w*.03),'center');
    if(k!==0) pill(ctx,sa===sb?'same sign — Rule 1':'?',w*.88,h*.07,COL.green,12);

  });
  return wrap;
}

/* =====================================================================

   Two lines (left side red, right side blue). A yellow probe slides along
   x; the gap between the lines is the inequality. The green region and the
   number-line ray grow out of the crossing point on springs.
   ===================================================================== */
function solveLin(a,b,c,d,s){
  const A=a-c, B=d-b;
  if(Math.abs(A)<1e-9) return {kind:holds(0,s,B)?'all':'none'};
  const s2=A>0?s:flipS(s);
  return {kind:'ray',x:B/A,s2,dirL:(s2==='<'||s2==='≤'),closed:(s2==='≤'||s2==='≥')};
}
function linStr(a,b){
  let t=''; if(a!==0) t=(a===1?'':a===-1?'−':String(a).replace('-','−'))+'x';
  if(b!==0||a===0) t+= a===0?String(b).replace('-','−') : (b>0?' + '+b:' − '+(-b));
  return t;
}

  const $=s=>wrap.querySelector(s), canvas=$('canvas'), ids=['a','b','c','d'].map(k=>$('#'+k)), ts=$('#t');
  const pre=[[5,-3,3,1,'<'],[4,3,6,7,'<'],[-4,10,1,-30,'≤'],[7,3,5,9,'<'],[6,-8,1,-3,'≥']], tags=['5x − 3 < 3x + 1','4x + 3 < 6x + 7','(5−2x)/3 ≤ x/6 − 5  ×6','7x + 3 < 5x + 9','(3x−4)/2 ≥ (x−3)/4  ×4'];
  let sym='<';
  const apply=i=>{ const p=pre[i]; ids.forEach((e,k)=>e.value=p[k]); sym=p[4]; setActive(wrap,'pre',i); setActive(wrap,'sy',SYMS.indexOf(sym)); };

/* =====================================================================

  const $=s=>wrap.querySelector(s), canvas=$('canvas'), xs=$('#x');
  const P=[{V:600,c0:12,ca:30,lo:15,hi:18,xm:400,nm:'30% acid'},{V:640,c0:8,ca:2,lo:4,hi:6,xm:1500,nm:'2% acid'},{V:1125,c0:45,ca:0,lo:25,hi:30,xm:1200,nm:'water (0%)'}];

    const c=(c0*V+ca*x)/(V+x), xa=V*(lo-c0)/(ca-lo), xb=V*(hi-c0)/(ca-hi), b1=Math.min(xa,xb), b2=Math.max(xa,xb), inside=c>lo&&c<hi;
    const target=(V+x)/(V+xm*1.0), prev=lvl.x; springTo(lvl,target,34,4.4,dt);
    const rising=lvl.v>.02, falling=lvl.v<-.02; follow(tilt,rising?1:0,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    const T={x:w*.07,y:h*.3,w:w*.3,h:h*.58}, LV=f=>T.y+T.h-f*T.h*.94, tcol=inside?COL.green:COL.blue;
    const cs=clamp(c/Math.max(c0,ca,hi,1)/1.15,0,1);
    ctx.save(); ctx.beginPath(); ctx.rect(T.x,T.y,T.w,T.h); ctx.clip();
    const ly=LV(lvl.x); ctx.beginPath(); ctx.moveTo(T.x,T.y+T.h); ctx.lineTo(T.x,ly);

    ctx.lineTo(T.x+T.w,T.y+T.h); ctx.closePath(); ctx.fillStyle=rgba(COL.red,.08+.5*cs); ctx.fill();
    // acid window on the wall

    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(T.x,T.y); ctx.lineTo(T.x,T.y+T.h); ctx.lineTo(T.x+T.w,T.y+T.h); ctx.lineTo(T.x+T.w,T.y); ctx.stroke(); ctx.restore();
    lab(ctx,'V = '+sg(V+x,0)+' L',T.x+T.w/2,T.y+T.h+24,COL.muted,{align:'center',size:14});
    // the jug and its stream

/* =====================================================================
   5.11 CUTTING THE BOARD   (Misc. exercise 26)
   A 91 cm board gives x, x + 3 and 2x.  Two conditions:
   x + (x+3) + 2x ≤ 91   and   2x ≥ (x+3) + 5.
   ===================================================================== */
function buildA11(){
  const wrap=labShell();

    slider('x','Shortest piece,  x  (cm)',0,30,0.5,12) +
    `<div class="control-group"><div class="toggle-group"><button class="toggle-btn play" id="cut">✂ Cut the board</button></div></div>` +
    cards([['r1','Pieces  x,  x + 3,  2x'],['r2','Total used  ≤ 91 ?','--f-blue'],['r3','Third  ≥  second + 5 ?','--f-red'],['r4','x that works','--f-green',true]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), xs=$('#x'), cutB=$('#cut');
  let cutOn=false, cutP=0; cutB.onclick=()=>{ cutOn=!cutOn; setPlay(cutB,cutOn,'↺ Join the pieces','✂ Cut the board'); };
  const X1=S(12), X2=S(27), X3=S(51);
  animLoop(dt=>{
    const x=+xs.value; val(wrap,'x',sg(x,1)+' cm');
    const tot=4*x+3, fit=tot<=91+1e-9, long=2*x>=x+8-1e-9, ok=fit&&long;
    springTo(X1,x,60,7,dt); springTo(X2,x+3,60,7,dt); springTo(X3,2*x,60,7,dt);
    cutP=clamp(cutP+(cutOn?1:-1)*dt*1.1,0,2);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const bx0=w*.05, sc=(w*.9)/91, BX=v=>bx0+v*sc, by=h*.26, bh=Math.min(h*.14,64);
    // ruler
    for(let v=0;v<=91;v+=1){ const big=v%10===0; line(ctx,BX(v),by-bh/2-(big?14:6),BX(v),by-bh/2-2,COL.mid,big?1.8:1); if(big&&v<90) textAt(ctx,String(v),BX(v),by-bh/2-20,{align:'center',size:11,weight:600,color:COL.mid}); }
    textAt(ctx,'91',BX(91),by-bh/2-20,{align:'center',size:11,weight:700,color:COL.ink});
    // board outline
    rrect(ctx,BX(0),by-bh/2,91*sc,bh,4); ctx.save(); ctx.fillStyle='#f6f9fc'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3.2; ctx.stroke(); ctx.restore();
    for(let k=0;k<7;k++){ ctx.save(); ctx.strokeStyle=rgba(COL.mid,.5); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(BX(2),by-bh/2+8+k*(bh-16)/6); ctx.bezierCurveTo(BX(30),by-bh/2+4+k*(bh-16)/6,BX(60),by-bh/2+14+k*(bh-16)/6,BX(89),by-bh/2+8+k*(bh-16)/6); ctx.stroke(); ctx.restore(); }
    // pieces
    const g1=ease(clamp(cutP-0,0,1))*16, g2=ease(clamp(cutP-1,0,1))*16;
    const segs=[[0,X1.x,COL.yellow,'x',0],[X1.x,X1.x+X2.x,COL.red,'x + 3',g1],[X1.x+X2.x,X1.x+X2.x+X3.x,COL.blue,'2x',g1+g2]];
    segs.forEach(([a,b,col,nm,gap])=>{ const xa=BX(a)+gap, xb=BX(b)+gap, ww=xb-xa; if(ww<1) return;
      ctx.save(); const over=b>91; rrect(ctx,xa,by-bh/2+4,ww,bh-8,3); ctx.fillStyle=rgba(col,over?.12:.28); ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=3; if(over) ctx.setLineDash([7,5]); ctx.stroke(); ctx.restore();
      if(ww>40) textAt(ctx,nm,xa+ww/2,by+5,{align:'center',size:15,weight:700,color:col===COL.yellow?'#8a6410':col}); });
    const used=X1.x+X2.x+X3.x;
    if(used<91){ const xa=BX(used)+g1+g2; ctx.save(); ctx.beginPath(); ctx.rect(xa,by-bh/2+4,BX(91)-BX(used),bh-8); ctx.clip(); for(let q=-bh;q<(BX(91)-BX(used))+bh;q+=10) line(ctx,xa+q,by+bh/2,xa+q+bh,by-bh/2,COL.mid,1.3); ctx.restore(); textAt(ctx,'left over '+sg(91-tot,1),(xa+BX(91))/2,by+bh/2+20,{align:'center',size:12,weight:700,color:COL.mid}); }
    if(used>91.05) lab(ctx,'needs '+sg(tot-91,1)+' cm more board',BX(91),by+bh/2+22,COL.red,{align:'right',size:14});
    // the saw
    if(cutP>0.02&&cutP<1.98){ const idx=cutP<1?0:1, cutAt=BX(idx?X1.x+X2.x:X1.x)+(idx?g1:0)-6, t=performance.now()/1000;
      ctx.save(); ctx.translate(cutAt+8,by-bh/2-24+Math.sin(t*26)*6); ctx.rotate(-.5);
      rrect(ctx,-16,-8,90,16,2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke();
      ctx.beginPath(); for(let i=0;i<9;i++){ ctx.moveTo(-14+i*9,8); ctx.lineTo(-10+i*9,15); ctx.lineTo(-6+i*9,8); } ctx.stroke(); rrect(ctx,70,-12,34,26,8); ctx.stroke(); ctx.restore(); }
    // ---- second condition: bars
    const r1=h*.58, r2=h*.76, rh=Math.min(34,h*.07);
    textAt(ctx,'second piece  +  5 cm',bx0,r1-rh/2-10,{size:12.5,weight:700,color:COL.red}); textAt(ctx,'third piece',bx0,r2-rh/2-10,{size:12.5,weight:700,color:COL.blue});
    ctx.save(); rrect(ctx,BX(0),r1-rh/2,X2.x*sc,rh,4); ctx.fillStyle=rgba(COL.red,.25); ctx.fill(); ctx.strokeStyle=COL.red; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
    ctx.save(); ctx.setLineDash([6,5]); rrect(ctx,BX(X2.x),r1-rh/2,5*sc,rh,4); ctx.strokeStyle=COL.red; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
    ctx.save(); rrect(ctx,BX(0),r2-rh/2,Math.max(2,X3.x*sc),rh,4); ctx.fillStyle=rgba(COL.blue,.25); ctx.fill(); ctx.strokeStyle=COL.blue; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
    const thr=BX(X2.x+5); line(ctx,thr,r1-rh/2-4,thr,r2+rh/2+4,long?COL.green:COL.yellow,3,[6,4]);
    pill(ctx,long?'third piece is long enough':'third piece too short',BX(46),(r1+r2)/2,long?COL.green:COL.red,12.5);
    pill(ctx,ok?'x = '+sg(x,1)+' cm works':(!fit?'board too short':'third piece too short'),w/2,h*.93,ok?COL.green:COL.red,14);
    $('#r1').textContent=sg(x,1)+',  '+sg(x+3,1)+',  '+sg(2*x,1);
    $('#r2').textContent=sg(tot,1)+(fit?' ≤ ':' > ')+'91'; $('#r2').style.color=fit?'var(--f-green)':'var(--f-red)';
    $('#r3').textContent=sg(2*x,1)+(long?' ≥ ':' < ')+sg(x+8,1); $('#r3').style.color=long?'var(--f-green)':'var(--f-red)';
    $('#r4').textContent='8 ≤ x ≤ 22';
  });
  return wrap;
}

];
let currentIndex = 0;
function buildNav(){
  const nav = document.getElementById('sideNav'); nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops(); buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody'); body.innerHTML='';
  body.appendChild(a.build());
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side"></div>`;
  return wrap;
}
render();
