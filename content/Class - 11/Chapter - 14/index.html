<!DOCTYPE html>
<html lang="en">
<head>

<title>Grade 11 · Chemistry · Chapter 1 — Some Basic Concepts of Chemistry | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.ctr{display:flex; align-items:center; gap:6px; margin-top:7px;}
.ctr .cn{flex:1; font-size:var(--fs-sm); font-weight:600; display:flex; align-items:center; gap:6px;}
.ctr .cn i{width:18px; height:4px; border-radius:2px; display:inline-block;}
.ctr button{width:30px; height:30px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:16px; font-weight:700; cursor:pointer; color:var(--navy-2);}
.ctr button:hover{background:var(--navy-2); color:#fff;}
.ctr .cv{min-width:26px; text-align:center; font-weight:700; color:var(--accent); font-size:var(--fs-md);}
.rcard .rval.sm{font-size:var(--fs-sm);}

<script>
/* =========================================================================
   GRADE 11 — CHEMISTRY — CHAPTER 1: SOME BASIC CONCEPTS OF CHEMISTRY
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn object eases, springs or physically integrates toward
   it every frame. Particles always jiggle, flasks always slosh — never a
   static picture with a changed label.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function lw(k,base){ return clamp(k*base,1,3); }


/* ---------------------------------------------------------------------
   CHEMISTRY HELPERS — elements, atoms, molecules, balance, gas boxes
   --------------------------------------------------------------------- */
const EL = {
  H:{col:COL.blue,  r:7,  m:1.008,  name:'Hydrogen'},
  C:{col:COL.ink,   r:11, m:12.011, name:'Carbon'},
  O:{col:COL.red,   r:10, m:16.00,  name:'Oxygen'},
  N:{col:COL.green, r:10, m:14.007, name:'Nitrogen'},
  Cl:{col:COL.green,r:13, m:35.453, name:'Chlorine'},
  Na:{col:COL.yellow,r:11,m:22.99,  name:'Sodium'},
  Cu:{col:COL.yellow,r:12,m:63.55,  name:'Copper'},
  P:{col:COL.yellow, r:12,m:30.974, name:'Phosphorus'},
  Fe:{col:COL.mid,  r:12, m:55.845, name:'Iron'},
  Mg:{col:COL.yellow,r:12,m:24.305, name:'Magnesium'}
};
/* molecule library: atoms [element, x, y] in bond-length units */
const MOL = {
  H2:{atoms:[['H',-.55,0],['H',.55,0]], bonds:[[0,1]]},
  O2:{atoms:[['O',-.7,0],['O',.7,0]], bonds:[[0,1,2]]},
  N2:{atoms:[['N',-.7,0],['N',.7,0]], bonds:[[0,1,3]]},
  H2O:{atoms:[['O',0,-.25],['H',-.9,.45],['H',.9,.45]], bonds:[[0,1],[0,2]]},
  H2O2:{atoms:[['H',-1.3,-.45],['O',-.55,.1],['O',.55,.1],['H',1.3,.65]], bonds:[[0,1],[1,2],[2,3]]},

/** Glides a range input toward a target with float precision (range steps would round tiny moves away). */
function Glider(sl){ this.sl=sl; this.t=null; this.v=0; sl.addEventListener('input',()=>{ this.t=null; }); }
Glider.prototype.go=function(t){ this.t=t; this.v=+this.sl.value; };
Glider.prototype.step=function(rate,dt){

function ljMap(Tc){
  const pts=[[-50,0.07],[-5,0.19],[5,0.3],[95,0.43],[105,0.6],[150,1.1]];
  if(Tc<=pts[0][0]) return pts[0][1];
  for(let i=1;i<pts.length;i++) if(Tc<=pts[i][0]) return lerp(pts[i-1][1],pts[i][1],(Tc-pts[i-1][0])/(pts[i][0]-pts[i-1][0]));
  return pts[pts.length-1][1];
}

      const dx=a.x-b.x, dy=a.y-b.y; let r2=dx*dx+dy*dy; if(r2>6.25) continue; if(r2<0.64) r2=0.64;

const SAMPLES={

    else if(key==='HO'){ const h=parts.filter(p=>p.t==='H2'), o=parts.filter(p=>p.t==='O2'); for(let i=0;i<o.length&&2*i+1<h.length;i++){ const d=0.3+Math.random()*1.2; h[2*i].delay=d; h[2*i].to='H2O'; h[2*i+1].delay=d; h[2*i+1].to='H2O'; o[i].delay=d; o[i].to='gone'; }
      say('Spark: 2 H₂ + O₂ → 2 H₂O. Two substances joined — a new compound.'); }

      p.x+=p.vx*dt; p.y+=p.vy*dt; p.a+=p.w*dt;
      if(p.x<0.03){p.x=0.03;p.vx=Math.abs(p.vx);} if(p.x>0.97){p.x=0.97;p.vx=-Math.abs(p.vx);}
      if(p.y<0.05){p.y=0.05;p.vy=Math.abs(p.vy);} if(p.y>0.95){p.y=0.95;p.vy=-Math.abs(p.vy);}
      const sp=Math.hypot(p.vx,p.vy); if(sp>0.45){ p.vx*=0.98; p.vy*=0.98; } if(sp<0.2){ p.vx*=1.03; p.vy*=1.03; }
    });
    for(let i=parts.length-1;i>=0;i--) if(parts[i].dead) parts.splice(i,1);
    /* jar */
    ctx.save(); ctx.lineJoin='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=3.2; ctx.beginPath(); ctx.moveTo(jx+12,jy-18); ctx.lineTo(jx+jw-12,jy-18); ctx.lineTo(jx+jw-12,jy); ctx.lineTo(jx+jw,jy+10); ctx.lineTo(jx+jw,jy+jh); ctx.lineTo(jx,jy+jh); ctx.lineTo(jx,jy+10); ctx.lineTo(jx+12,jy); ctx.closePath(); ctx.fillStyle='rgba(47,143,224,0.04)'; ctx.fill(); ctx.stroke(); ctx.restore();
    if(sep>0.4){ types.forEach((ty,i)=>{ if(i>0){ const dx=jx+jw*(0.04+0.92*(i/types.length)*0.92); line(ctx,dx,jy+4,dx,jy+jh,COL.yellow,2.4,[7,5]); } }); }
    /* particles */
    const s=Math.max(11,jw/26);
    parts.forEach(p=>drawMol(ctx,p.t,jx+jw*0.04+p.x*jw*0.92,jy+jh*0.04+p.y*jh*0.92,s,p.a));
    /* labels per zone */
    if(sep>0.5) types.forEach((ty,i)=>{ const cx=jx+jw*(0.04+0.92*((i+0.5)/types.length)*0.92); textAt(ctx,subText(ty),cx,jy+jh+22,{align:'center',size:13,weight:700,color:EL[ty[0]].col}); });
    /* spark electrodes */
    line(ctx,jx+jw*0.35,jy-18,jx+jw*0.35,jy+jh*0.14,COL.ink,3); line(ctx,jx+jw*0.65,jy-18,jx+jw*0.65,jy+jh*0.14,COL.ink,3);
    if(spark>0.02){ ctx.save(); ctx.globalAlpha=Math.min(1,spark*2); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(jx+jw*0.35,jy+jh*0.14); for(let i=1;i<=6;i++) ctx.lineTo(lerp(jx+jw*0.35,jx+jw*0.65,i/6),jy+jh*0.14+(Math.random()-0.5)*22); ctx.stroke(); ctx.restore(); }
    fx.forEach(f=>{ f.t+=dt; if(f.k==='ring'){ circ(ctx,jx+jw*0.04+f.x*jw*0.92,jy+jh*0.04+f.y*jh*0.92,10+f.t*60,COL.yellow,null,2.4); } else { ctx.save(); ctx.globalAlpha=Math.max(0,1-f.t*1.2); textAt(ctx,'✕',jx+jw/2,jy+jh/2,{align:'center',size:70+f.t*30,weight:700,color:COL.red}); ctx.restore(); } });
    fx=fx.filter(f=>f.t<(f.k==='ring'?0.5:0.9));
    /* live tally */
    const tally={}; parts.forEach(p=>tally[p.t]=(tally[p.t]||0)+1);
    $('#nV').textContent=Object.keys(tally).map(k=>subText(k)+' ×'+tally[k]).join('  ');
    const kinds=new Set(); parts.forEach(p=>{ for(const e in parseFormula(p.t)) kinds.add(e); });
    const nowType=types.length>1?'Mixture':(kinds.size>1?'Compound':'Element');
    $('#kV').textContent=nowType;
    $('#cV').textContent=nowType==='Mixture'?'Different substances, not bonded':(nowType==='Compound'?'H and O bonded in a fixed 2 : 1 ratio':'One kind of atom only');
  });
  return wrap;
}

/* =====================================================================
   1.4  SCIENTIFIC NOTATION
   Slide the decimal point; the exponent counts the hops.
   Textbook: 602,200,000,000,000,000,000,000 and 0.00000000000000000000000166 g
   ===================================================================== */
const SCI_SETS=[
  {name:'Molecules in 2 g of H₂', unit:'',    chars:'6022'+'0'.repeat(20), d0:24},
  {name:'Mass of one H atom',     unit:' g',  chars:'0'+'0'.repeat(23)+'166', d0:1},
  {name:'Speed of light',         unit:' m/s',chars:'299792458', d0:9}
];
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    `<div class="control-group"><label style="margin-bottom:6px;">Number</label><div class="toggle-group" id="nB" style="flex-direction:column">${SCI_SETS.map((s,i)=>`<button class="toggle-btn small${i?'':' active'}" data-v="${i}">${s.name}</button>`).join('')}</div></div>` +
    `<div class="control-group"><label>Decimal point <span class="val" id="dV"></span></label><input type="range" id="dR" min="0" max="30" step="1" value="30"></div>` +
    btnHTML('autoB','✓ Slide to scientific form','play') +
    rcardsHTML([{l:'Coefficient a',id:'aV',c:COL.blue},{l:'Exponent n',id:'nV',c:COL.red},{l:'Form',id:'fV',wide:true,sm:true}]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), dR=$('#dR');
  let set=SCI_SETS[0], d0=set.d0, L=set.chars.length, dd={x:d0,v:0}, t=0; const G=new Glider(dR);
  function pick(i){ set=SCI_SETS[i]; L=set.chars.length; d0=set.d0; dR.max=L; dR.value=d0; dd.x=d0; dd.v=0; G.t=null; }
  toggleWire(wrap.querySelectorAll('#nB button'),b=>pick(+b.dataset.v));
  function sciD(){ let i=0; while(i<L&&set.chars[i]==='0') i++; return i+1; }
  $('#autoB').onclick=()=>{ G.go(sciD()); };
  pick(0);
  animLoop(dt=>{
    t+=dt;
    const dT=Math.round(G.step(3,dt)); springTo(dd,dT,70,13,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const n=d0-dT, tw=Math.min(34,(w*0.92)/(L+1)), x0=w/2-L*tw/2, ty=h*0.34, th=tw*1.35;
    /* coefficient string */
    let a=set.chars.slice(0,dT)+'.'+set.chars.slice(dT); a=a.replace(/^0+(?=\d)/,''); if(a.indexOf('.')>=0) a=a.replace(/0+$/,'').replace(/\.$/,'.0'); if(a.startsWith('.')) a='0'+a;
    const val=parseFloat(a); const std=val>=1&&val<10;
    /* hop bands: tiles passed over by the decimal point */
    const lo=Math.min(d0,dd.x), hi=Math.max(d0,dd.x);
    ctx.save(); ctx.fillStyle='rgba(217,160,23,0.16)'; ctx.fillRect(x0+lo*tw,ty-th*0.75,(hi-lo)*tw,th*1.5); ctx.restore();
    for(let i=0;i<L;i++){ const cx=x0+i*tw+tw/2, within=(i>=Math.min(dT,d0)&&i<Math.max(dT,d0)); rect(ctx,x0+i*tw+1.5,ty-th/2,tw-3,th,within?COL.yellow:COL.mid,'#fff',within?2:1.2); textAt(ctx,set.chars[i],cx,ty+th*0.22,{align:'center',size:tw*0.62,weight:700,color:set.chars[i]==='0'?COL.mid:COL.ink}); }
    /* hop arcs */
    const dir=dT<d0?-1:1;
    for(let i=Math.min(dT,d0);i<Math.max(dT,d0);i++){ const cx=x0+i*tw+tw/2; ctx.save(); ctx.strokeStyle=COL.red; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(cx,ty-th/2-2,tw/2,Math.PI,2*Math.PI); ctx.stroke(); ctx.restore(); }
    /* original point (grey) and moving point (yellow) */
    const ox=x0+d0*tw; circ(ctx,ox,ty+th/2+10,4,COL.mid,COL.mid,1); textAt(ctx,'start',ox,ty+th/2+30,{align:'center',size:11,weight:600,color:COL.mid});
    const px=x0+dd.x*tw; line(ctx,px,ty-th/2-16,px,ty+th/2+4,COL.yellow,3.4); circ(ctx,px,ty+th/2+10,7,COL.yellow,COL.yellow,1); textAt(ctx,'decimal point',px,ty-th/2-24,{align:'center',size:12,weight:700,color:COL.yellow});
    /* big result */
    const fs=Math.min(64,w*0.075); const ey=h*0.7;
    ctx.save(); ctx.font='700 '+fs+'px Poppins, sans-serif'; const aw=ctx.measureText(a).width; ctx.restore();
    const shown=a.length>14?val.toPrecision(6):a;
    const colr=std?COL.green:COL.ink;
    ctx.save(); ctx.font='700 '+fs+'px Poppins, sans-serif'; ctx.fillStyle=colr; ctx.textAlign='center';
    const aw2=ctx.measureText(shown+' × 10').width; const sw=Math.max(40,ctx.measureText(String(n)).width*0.6);
    const left=w/2-(aw2+sw)/2; ctx.textAlign='left'; ctx.fillText(shown+' × 10',left,ey);
    ctx.fillStyle=COL.red; ctx.font='700 '+(fs*0.6)+'px Poppins, sans-serif'; ctx.fillText(String(n),left+aw2+3,ey-fs*0.45); ctx.restore();
    textAt(ctx,std?'✓  1 ≤ a < 10  —  scientific form':'move the point until a is between 1 and 10',w/2,ey+36,{align:'center',size:14,weight:700,color:std?COL.green:COL.muted});
    $('#dV').textContent=n>0?'← '+n:(n<0?'→ '+(-n):'—');
    $('#aV').textContent=shown; $('#nV').textContent=String(n); $('#fV').textContent=std?'Scientific notation ✓':'Not yet standard';
  });
  return wrap;
}


/* =====================================================================

    const fx=cx-W*0.2, fw=W*0.3, fh=W*0.34, ftop=base-W*0.46-fh*0.2;
    const lipY=0;
    /* balance — sample flask on left pan, weights on right */
    const unitTot=80/NU;
    let massLeft=0;
    const ang0=0;
    const parts=[];
    U.forEach((u,ui)=>{
      const s=clamp(pr*NU*1.0-ui*0.9,0,1)*1; /* staggered progress 0..1 per unit */
      const sp=clamp((s-0)/1,0,1);
      u.s=sp;
      /* escape of gaseous products in open flask */
      const prod=sp>0.55; const k=clamp((sp-0.55)/0.45,0,1);
      if(open&&prod){ u.co2.esc=Math.min(1,u.co2.esc+dt*0.4); u.w1.esc=Math.min(1,u.w1.esc+dt*0.5); u.w2.esc=Math.min(1,u.w2.esc+dt*0.45); }
      if(!open||!prod){ u.co2.esc=Math.max(0,u.co2.esc-dt*2); u.w1.esc=Math.max(0,u.w1.esc-dt*2); u.w2.esc=Math.max(0,u.w2.esc-dt*2); }
    });
    U.forEach(u=>{
      const sp=u.s; const product=smooth01(0.5,0.58,sp), reactant=1-product;
      massLeft+= reactant*80/NU + product*( (1-u.co2.esc)*44/NU + (1-u.w1.esc)*18/NU + (1-u.w2.esc)*18/NU );
      /* atoms present (rounded by fractions) */
      atomsC+= reactant*1 + product*(1-u.co2.esc);
      atomsH+= reactant*4 + product*((1-u.w1.esc)*2+(1-u.w2.esc)*2);
      atomsO+= reactant*4 + product*((1-u.co2.esc)*2+(1-u.w1.esc)+(1-u.w2.esc));
    });
    /* the beam */
    const diff=(80-massLeft); /* weights heavier -> right pan down => ang>0 */
    const target=clamp(diff/80*0.34,-0.4,0.4);
    springTo(beam,target,70,6,dt);
    const bw=W*0.9, bcx=cx, bbase=base;
    const leftDraw=(px,py,pw)=>{
      /* the flask on the pan */
      const fW=pw*1.5, fH=W*0.23, topy=py-fH, neckW=fW*0.3;
      ctx.save(); ctx.lineJoin='round'; ctx.strokeStyle=COL.ink; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(px-neckW/2,topy); ctx.lineTo(px-neckW/2,topy+fH*0.3); ctx.lineTo(px-fW/2,py-2); ctx.lineTo(px+fW/2,py-2); ctx.lineTo(px+neckW/2,topy+fH*0.3); ctx.lineTo(px+neckW/2,topy);
      ctx.fillStyle='rgba(47,143,224,0.05)'; ctx.fill(); ctx.stroke(); ctx.restore();
      /* cork */
      if(!open){ ctx.save(); ctx.fillStyle='#fff'; ctx.strokeStyle=COL.yellow; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(px-neckW/2-3,topy-12); ctx.lineTo(px+neckW/2+3,topy-12); ctx.lineTo(px+neckW/2-2,topy+4); ctx.lineTo(px-neckW/2+2,topy+4); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
      else { textAt(ctx,'open',px+neckW/2+12,topy+8,{size:11,weight:700,color:COL.red}); }
      /* molecules */
      const ms=fW/9;
      U.forEach((u,ui)=>{
        const sp=u.s;

        const meet={x:px-fW*0.3+ui*fW*0.3, y:py-fH*0.34};
        const jig=(o,a)=>({x:Math.sin(t*1.7+o.ph)*ms*0.35, y:Math.cos(t*1.3+o.ph*1.3)*ms*0.3});
        function reactPos(o,dx,dy){ const j=jig(o); return {x:meet.x+dx*fW*0.05+(o.x-0.5)*fW*0.3*(1-smooth01(0.2,0.45,sp))+j.x*(1-smooth01(0.3,0.45,sp)), y:meet.y+dy*fW*0.04+(o.y-0.5)*fH*0.24*(1-smooth01(0.2,0.45,sp))+j.y}; }
        if(sp<0.55){

          const al=1-smooth01(0.45,0.55,sp);

        }
        if(sp>0.45&&sp<0.7){ const f=1-Math.abs(sp-0.57)/0.12; if(f>0){ circ(ctx,meet.x,meet.y,ms*(1+f*4),COL.yellow,null,2.6); circ(ctx,meet.x,meet.y,ms*(1+f*2.4),COL.red,null,2); } }
        if(sp>0.5){

          [['CO2',u.co2,-1.6,-0.7,0],['H2O',u.w1,1.6,-0.5,1],['H2O',u.w2,0.1,1.9,2]].forEach(([nm,o,dx,dy,k])=>{
            const j=jig(o);
            let X=meet.x+dx*fW*0.07*ap+(o.x-0.5)*fW*0.34*ap+j.x, Y=meet.y+dy*fW*0.07*ap+(o.y-0.5)*fH*0.26*ap+j.y, al=ap;
            if(o.esc>0){ const e=o.esc; X=lerp(X,px+Math.sin(t*2+k)*fW*0.1,smooth01(0,0.5,e)); Y=lerp(Y,topy-14-e*fH*1.6,e); al=ap*(1-smooth01(0.6,1,e)); }
            if(al>0.02) drawMol(ctx,nm,X,Y,ms,o.a+t*o.w,al);
          });
        }
      });
    };
    const rightDraw=(px,py,pw)=>{
      /* reference weights stack: 80 g total (50 + 20 + 10) */
      let y=py-2; [[50,pw*1.4],[20,pw*1.1],[10,pw*0.8]].forEach(([g,ww],i)=>{ const hh=ww*0.46; rect(ctx,px-ww/2,y-hh,ww,hh,COL.ink,'#fff',2.4); line(ctx,px-ww*0.2,y-hh,px-ww*0.2,y-hh-5,COL.ink,2); textAt(ctx,g+' g',px,y-hh*0.3,{align:'center',size:Math.max(10,ww*0.15),weight:700,color:COL.ink}); y-=hh; });
    };

    $('#mV').textContent=fmt(massLeft,1)+' g'; $('#wV').textContent='80 g';

    textAt(ctx,'16 g + 64 g  =  44 g + 36 g',w/2,52,{align:'center',size:13,weight:700,color:COL.blue});
  });
  return wrap;
}

/* =====================================================================

  const wrap=labShell();

    togglesHTML('mdB','Law',[['def','Definite proportions'],['mul','Multiple proportions']],0) +
    `<div id="dS">${sliderHTML('nR','Natural sample',20,200,1,100)}${sliderHTML('sR','Synthetic sample',20,200,1,60)}
       ${rcardsHTML([{l:'% Copper',id:'cuV',c:COL.yellow},{l:'% Carbon',id:'cV',c:COL.ink},{l:'% Oxygen',id:'oV',c:COL.red}],true)}</div>
     <div id="mS" class="hidden">${sliderHTML('hR','Hydrogen (fixed)',1,3,0.5,2)}
       ${rcardsHTML([{l:'O in water',id:'wV',c:COL.red},{l:'O in peroxide',id:'pV',c:COL.red},{l:'Ratio O : O',id:'rV',c:COL.green,wide:true}])}</div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let mode='def', t=0;

  const CU=51.35,CC=9.74,CO=38.91;
  function column(ctx,x,bot,hMax,mass,maxMass,cols,vals,lab,labCol){
    const bw=Math.min(120,hMax*0.34); const hh=hMax*mass/maxMass;
    let y=bot; vals.forEach((v,i)=>{ const seg=hh*v; rect(ctx,x-bw/2,y-seg,bw,seg,cols[i],'#fff',2.4); ctx.save(); ctx.strokeStyle=cols[i]; ctx.globalAlpha=0.35; ctx.lineWidth=1; for(let q=0;q<seg;q+=7){ ctx.beginPath(); ctx.moveTo(x-bw/2,y-q); ctx.lineTo(x+bw/2,y-q-6<y-seg?y-seg:y-q-6); ctx.stroke(); } ctx.restore(); if(seg>16) textAt(ctx,fmt(mass*v,1)+' g',x,y-seg/2+4,{align:'center',size:12,weight:700,color:cols[i]}); y-=seg; });
    return bw;
  }
  animLoop(dt=>{
    t+=dt;

      springTo(A.nat,+$('#nR').value,40,7,dt); springTo(A.syn,+$('#sR').value,40,7,dt);

      const bot=h*0.84, hMax=h*0.64, cols=[COL.yellow,COL.ink,COL.red], vals=[CU/100,CC/100,CO/100];
      [[w*0.28,A.nat.x,'Natural sample','mine'],[w*0.72,A.syn.x,'Synthetic sample','flask']].forEach(([cx,m,lab,ic])=>{
        column(ctx,cx,bot,hMax,m,200,cols,vals,lab);
        line(ctx,cx-80,bot,cx+80,bot,COL.ink,3);
        textAt(ctx,lab+'  ·  '+fmt(m,0)+' g',cx,bot+24,{align:'center',size:14,weight:700,color:COL.ink});
        /* origin icon */
        const iy=h*0.1;
        if(ic==='mine'){ ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(cx-40,iy+30); ctx.lineTo(cx-12,iy-4); ctx.lineTo(cx+4,iy+14); ctx.lineTo(cx+20,iy-12); ctx.lineTo(cx+44,iy+30); ctx.closePath(); ctx.stroke(); ctx.restore(); }
        else { ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(cx-8,iy-12); ctx.lineTo(cx-8,iy+6); ctx.lineTo(cx-26,iy+30); ctx.lineTo(cx+26,iy+30); ctx.lineTo(cx+8,iy+6); ctx.lineTo(cx+8,iy-12); ctx.stroke(); ctx.restore(); line(ctx,cx-20,iy+22,cx+20,iy+22,COL.blue,3); circ(ctx,cx+Math.sin(t*3)*6,iy+16-Math.abs(Math.sin(t*4))*6,3,COL.blue,null,1.5); }
      });
      /* percent callouts between the columns */
      const mx=w*0.5; let yy=bot-hMax*0.06; const lines=[['Copper',CU,COL.yellow],['Carbon',CC,COL.ink],['Oxygen',CO,COL.red]];
      lines.forEach((q,i)=>{ textAt(ctx,q[0],mx,h*0.34+i*58,{align:'center',size:13,weight:700,color:q[2]}); textAt(ctx,q[1].toFixed(2)+' %',mx,h*0.34+i*58+26,{align:'center',size:24,weight:700,color:q[2]}); });
      textAt(ctx,'= same, whatever the source or size',mx,h*0.34+3*58+6,{align:'center',size:12,weight:700,color:COL.green});
      $('#cuV').textContent=CU.toFixed(2); $('#cV').textContent=CC.toFixed(2); $('#oV').textContent=CO.toFixed(2);
    } else {
      springTo(A.h,+$('#hR').value,45,7,dt); const hg=A.h.x; $('#hRV').textContent=fmt(+$('#hR').value,1)+' g';
      const ratio=(+$('#hR').value)/2, o1=16*ratio, o2=32*ratio;
      const bot=h*0.86, unit=Math.min(h*0.5/ (32*3.1/ 2),9);
      const u=h*0.6/54; /* px per gram: H 3 g ×3 + O 48 g ×0.9 fits */
      const colX=[w*0.3,w*0.7], names=['H2O','H2O2'], labels=['Water','Hydrogen peroxide'], oM=[16*hg/2,32*hg/2];
      colX.forEach((cx,i)=>{

/* =====================================================================
   1.9  GAY-LUSSAC'S LAW & AVOGADRO'S LAW
   2 H₂ + O₂ → 2 H₂O(g) : 100 mL + 50 mL → 100 mL (same T and P)
   Avogadro: equal volumes, equal numbers of molecules → 10 mL ≙ 1 molecule here.
   The piston height is driven by the number of molecules inside.
   ===================================================================== */
function buildA9(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    sliderHTML('hR','Hydrogen added',20,200,10,100) + sliderHTML('oR','Oxygen added',20,200,10,50) +
    `<div class="control-group"><button class="toggle-btn play" id="spB" style="width:100%">⚡ Spark</button><button class="toggle-btn" id="rsB" style="width:100%;margin-top:7px">↺ Reset</button></div>` +
    rcardsHTML([{l:'H₂ : O₂ used',id:'rV',c:COL.green},{l:'H₂O formed',id:'wV',c:COL.red},{l:'Left over',id:'lV',wide:true,sm:true}]) +
    `<p class="hint">Same T and P · 10 mL = 1 molecule</p>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let parts=[], groups=[], fx=[], t=0, phase=0, spark=0;
  const PL={x:150,v:0};
  const R=rng(9);
  function build(){
    const nH=Math.round(+$('#hR').value/10), nO=Math.round(+$('#oR').value/10);
    parts=[]; groups=[]; fx=[]; phase=0; spark=0;
    for(let i=0;i<nH;i++) parts.push({t:'H2',x:R(),y:R(),vx:(R()-0.5)*0.9,vy:(R()-0.5)*0.9,a:R()*6.28,w:(R()-0.5)*3});
    for(let i=0;i<nO;i++) parts.push({t:'O2',x:R(),y:R(),vx:(R()-0.5)*0.9,vy:(R()-0.5)*0.9,a:R()*6.28,w:(R()-0.5)*3});
  }
  ['#hR','#oR'].forEach(i=>$(i).addEventListener('input',build)); $('#rsB').onclick=build;
  $('#spB').onclick=()=>{
    if(phase!==0) return; phase=1; spark=1.2;
    const H=parts.filter(p=>p.t==='H2'), O=parts.filter(p=>p.t==='O2'); const u=Math.min(Math.floor(H.length/2),O.length);
    for(let i=0;i<u;i++) groups.push({ps:[H[2*i],H[2*i+1],O[i]],t:0.5+R()*1.6});
  };
  build();
  animLoop(dt=>{
    t+=dt; spark=Math.max(0,spark-dt);
    $('#hRV').textContent=$('#hR').value+' mL'; $('#oRV').textContent=$('#oR').value+' mL';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cw=Math.min(w*0.3,260), cx=w*0.3, base=h-40, maxH=h-90, pxml=maxH/420;
    /* groups react: approach, flash, merge */
    groups.forEach(g=>{ g.t-=dt; const cxg=g.ps.reduce((a,p)=>a+p.x,0)/3, cyg=g.ps.reduce((a,p)=>a+p.y,0)/3;
      g.ps.forEach(p=>{ p.vx+=(cxg-p.x)*6*dt; p.vy+=(cyg-p.y)*6*dt; p.vx*=0.985; p.vy*=0.985; });
      if(g.t<=0){ g.ps[0].t='H2O'; g.ps[1].t='H2O'; g.ps[2].dead=true; fx.push({x:cxg,y:cyg,t:0}); g.done=true; } });
    groups=groups.filter(g=>!g.done); parts=parts.filter(p=>!p.dead);
    if(phase===1&&!groups.length) phase=2;
    const count=parts.length; springTo(PL,count*10,70,9,dt);
    const V=Math.max(10,PL.x), topY=base-V*pxml;
    /* particle motion inside the moving piston */
    parts.forEach(p=>{
      p.x+=p.vx*dt*0.5; p.y+=p.vy*dt*0.5; p.a+=p.w*dt;
      if(p.x<0.08){p.x=0.08;p.vx=Math.abs(p.vx);} if(p.x>0.92){p.x=0.92;p.vx=-Math.abs(p.vx);}
      if(p.y<0.06){p.y=0.06;p.vy=Math.abs(p.vy);} if(p.y>0.94){p.y=0.94;p.vy=-Math.abs(p.vy);}
      const sp=Math.hypot(p.vx,p.vy); if(sp<0.4&&!groups.length){ p.vx*=1.04; p.vy*=1.04; } if(sp>1.1){ p.vx*=0.97; p.vy*=0.97; }
    });
    /* cylinder */
    line(ctx,cx-cw/2,base-maxH-6,cx-cw/2,base,COL.ink,3.4); line(ctx,cx+cw/2,base-maxH-6,cx+cw/2,base,COL.ink,3.4); line(ctx,cx-cw/2-8,base,cx+cw/2+8,base,COL.ink,5);
    for(let v=0;v<=400;v+=50){ const yy=base-v*pxml; line(ctx,cx-cw/2-12,yy,cx-cw/2,yy,COL.yellow,2); textAt(ctx,v+' mL',cx-cw/2-16,yy+4,{align:'right',size:11,weight:700,color:COL.yellow}); }
    /* gas shading + piston */
    ctx.save(); ctx.fillStyle='rgba(47,143,224,0.06)'; ctx.fillRect(cx-cw/2,topY,cw,base-topY); ctx.restore();
    rect(ctx,cx-cw/2+2,topY-12,cw-4,12,COL.ink,'#fff',3); line(ctx,cx,topY-12,cx,Math.max(8,topY-60),COL.ink,5); line(ctx,cx-26,Math.max(8,topY-60),cx+26,Math.max(8,topY-60),COL.ink,6);
    dimArrowH(ctx,cx+cw/2+22,topY,base,COL.yellow); textAt(ctx,Math.round(V)+' mL',cx+cw/2+34,(topY+base)/2+4,{size:15,weight:700,color:COL.yellow});
    /* electrodes + spark */
    line(ctx,cx-cw*0.3,base,cx-cw*0.3,base-22,COL.ink,3); line(ctx,cx+cw*0.3,base,cx+cw*0.3,base-22,COL.ink,3);
    if(spark>0.01){ ctx.save(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.8; ctx.beginPath(); ctx.moveTo(cx-cw*0.3,base-22); for(let i=1;i<=6;i++) ctx.lineTo(lerp(cx-cw*0.3,cx+cw*0.3,i/6),base-22+(Math.random()-0.5)*14); ctx.stroke(); ctx.restore(); }
    /* molecules */
    const ms=Math.min(cw/7,24);
    parts.forEach(p=>drawMol(ctx,p.t,cx-cw/2+p.x*cw,topY+p.y*(base-topY),ms,p.a));
    fx.forEach(f=>{ f.t+=dt; circ(ctx,cx-cw/2+f.x*cw,topY+f.y*(base-topY),8+f.t*70,COL.yellow,null,2.4); }); fx=fx.filter(f=>f.t<0.45);
    /* comparison columns: volume of each gas, drawn on the same mL scale */
    const nH=Math.round(+$('#hR').value/10), nO=Math.round(+$('#oR').value/10);
    const used=Math.min(Math.floor(nH/2),nO), nW=2*used, lH=nH-2*used, lO=nO-used;
    const bx0=w*0.64, bw=Math.min(90,w*0.1);
    const colBox=(x,items,title)=>{ let y=base; items.forEach(([n,col,label])=>{ if(n<=0) return; const hh=n*10*pxml; rect(ctx,x-bw/2,y-hh,bw,hh,col,'#fff',2.6); textAt(ctx,label+' '+n*10+' mL',x,y-hh/2+4,{align:'center',size:12,weight:700,color:col}); y-=hh; }); textAt(ctx,title,x,base+22,{align:'center',size:13,weight:700,color:COL.ink}); };
    colBox(bx0,[[nH,COL.blue,'H₂'],[nO,COL.red,'O₂']],'Before');
    const done=phase===2;
    colBox(bx0+bw*1.9,done?[[lH,COL.blue,'H₂'],[lO,COL.red,'O₂'],[nW,COL.green,'H₂O']]:[],'After');
    if(!done){ textAt(ctx,'?',bx0+bw*1.9,base-60,{align:'center',size:40,weight:700,color:COL.mid}); }
    line(ctx,bx0+bw*0.62,base-70,bx0+bw*1.28,base-70,COL.green,2.4); arrowHead(ctx,bx0+bw*1.28,base-70,0,COL.green,9);
    textAt(ctx,'2 H₂ + O₂ → 2 H₂O',w*0.66+bw*0.5,h*0.07,{align:'center',size:Math.min(22,w*0.027),weight:700,color:COL.ink});

/* =====================================================================
   1.10  AVERAGE ATOMIC MASS
   C: 98.892 % ¹²C (12) · 1.108 % ¹³C (13.00335) → 12.011 u
   Cl: 75.77 % ³⁵Cl (34.9689) · 24.23 % ³⁷Cl (36.9659) → 35.453 u
   The average is the balance point of the isotopes.
   ===================================================================== */
const ISO={
  C:{name:'Carbon',a:{sym:'¹²C',m:12,ab:98.892},b:{sym:'¹³C',m:13.00335,ab:1.108},lo:11.5,hi:13.5,real:12.011},
  Cl:{name:'Chlorine',a:{sym:'³⁵Cl',m:34.9689,ab:75.77},b:{sym:'³⁷Cl',m:36.9659,ab:24.23},lo:34.5,hi:37.5,real:35.453}
};
function buildA10(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    togglesHTML('elB','Element',[['Cl','Chlorine'],['C','Carbon']],0) +
    sliderHTML('abR','Heavier isotope abundance',0,100,0.01,24.23) +
    `<div class="control-group"><button class="toggle-btn play" id="rlB" style="width:100%">↺ Natural abundance</button></div>` +
    rcardsHTML([{l:'Average mass',id:'avV',c:COL.blue},{l:'Periodic table',id:'pdV'},{l:'Light isotope',id:'lV',sm:true,c:COL.red},{l:'Heavy isotope',id:'hV',sm:true,c:COL.yellow}]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), abR=$('#abR');
  let el='Cl', t=0; const GL=new Glider(abR);
  const FUL={x:0,v:0}; let first=true;
  const R=rng(3), rnd=[]; for(let i=0;i<150;i++) rnd.push(R());
  toggleWire(wrap.querySelectorAll('#elB button'),b=>{ el=b.dataset.v; abR.value=ISO[el].b.ab; first=true; });
  $('#rlB').onclick=()=>GL.go(ISO[el].b.ab);
  animLoop(dt=>{
    t+=dt; const I=ISO[el], ab=GL.step(2.5,dt)/100; $('#abRV').textContent=fmt(ab*100,2)+' %';
    const mA=I.a.m, mB=I.b.m, avg=mA*(1-ab)+mB*ab;
    if(first){ FUL.x=avg; FUL.v=0; first=false; }
    springTo(FUL,avg,34,5.5,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    /* mass axis + lever */
    const ax0=w*0.1, ax1=w*0.9, X=m=>lerp(ax0,ax1,(m-I.lo)/(I.hi-I.lo)), ly=h*0.52;
    const torque=(avg-FUL.x), ang=clamp(torque*0.55/((I.hi-I.lo)/3),-0.3,0.3);
    /* fulcrum triangle */
    const fx=X(FUL.x); ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(fx,ly+4); ctx.lineTo(fx-26,ly+70); ctx.lineTo(fx+26,ly+70); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke(); ctx.restore();
    /* beam rotates about fulcrum */
    ctx.save(); ctx.translate(fx,ly); ctx.rotate(ang);
    line(ctx,ax0-fx,0,ax1-fx,0,COL.ink,6);
    for(let m=Math.ceil(I.lo*2)/2;m<=I.hi;m+=0.5){ const xx=X(m)-fx; line(ctx,xx,0,xx,12,COL.mid,1.6); textAt(ctx,String(m),xx,26,{align:'center',size:11,weight:600,color:COL.muted}); }
    /* isotope blocks: area ∝ abundance, sitting on the beam at their masses */
    [[mA,1-ab,COL.red,I.a.sym],[mB,ab,COL.yellow,I.b.sym]].forEach(([m,f,col,sym])=>{
      const r=8+Math.sqrt(f)*Math.min(70,w*0.07), xx=X(m)-fx;
      circ(ctx,xx,-3-r,r,col,'#fff',3.2); circ(ctx,xx,-3-r,r*0.82,col,col,1); ctx.save(); ctx.globalAlpha=0.0; ctx.restore();
      textAt(ctx,sym,xx,-3-r+5,{align:'center',size:Math.max(11,Math.min(22,r*0.6)),weight:700,color:'#fff'});
      textAt(ctx,fmt(f*100,2)+' %',xx,-3-2*r-10,{align:'center',size:13,weight:700,color:col});
    });
    ctx.restore();
    /* average marker */
    const ax=X(avg); line(ctx,ax,ly+84,ax,ly+104,COL.blue,3); arrowHead(ctx,ax,ly+84,-Math.PI/2,COL.blue,9);
    textAt(ctx,'average = '+fmt(avg,3)+' u',ax,ly+126,{align:'center',size:Math.min(24,w*0.028),weight:700,color:COL.blue});

    for(let i=0;i<100;i++){ const col=i%10, row=Math.floor(i/10); const heavy=rnd[i]<ab; const jx=Math.sin(t*2+i)*1.2, jy=Math.cos(t*1.7+i*1.3)*1.2;
      circ(ctx,gx+col*s+s/2+jx,gy+row*s*0.62+jy,s*0.36,heavy?COL.yellow:COL.red,heavy?'rgba(217,160,23,0.25)':'rgba(217,67,43,0.14)',2); }
    textAt(ctx,'100 atoms',w*0.5,gy+10*s*0.62+16,{align:'center',size:11,weight:600,color:COL.muted});
    /* the sum, always visible */
    textAt(ctx,'('+fmt(1-ab,4)+') × '+fmt(mA,4)+'  +  ('+fmt(ab,4)+') × '+fmt(mB,4)+'  =  '+fmt(avg,3)+' u',w/2,h-26,{align:'center',size:Math.min(16,w*0.019),weight:700,color:COL.ink});

  const $=s=>wrap.querySelector(s), canvas=$('canvas');

/* =====================================================================

const MOLES={
  C:{name:'Carbon (¹²C)',M:12,kind:'pile',col:COL.ink,unit:'atoms'},
  H2O:{name:'Water',M:18.02,kind:'liquid',col:COL.blue,unit:'molecules'},

/* ---------------------------------------------------------------------
   Species drawing for 1.13 – 1.15: molecules from MOL, others as clusters
   --------------------------------------------------------------------- */
function clusterPos(n){
  if(n===1) return [[0,0]]; if(n===2) return [[-0.6,0],[0.6,0]];
  const p=[[0,0]]; const r1=Math.min(6,n-1); for(let i=0;i<r1;i++){ const a=i*Math.PI*2/r1+0.4; p.push([Math.cos(a)*1.15,Math.sin(a)*1.15]); }
  for(let i=0;i<n-1-r1;i++){ const a=(i+0.5)*Math.PI*2/Math.max(1,n-1-r1); p.push([Math.cos(a)*2.15,Math.sin(a)*2.15]); }
  return p;
}
function speciesRadius(f){
  if(MOL[f]) return Math.max(...MOL[f].atoms.map(q=>Math.hypot(q[1],q[2])))+0.55;
  const n=Object.values(parseFormula(f)).reduce((a,b)=>a+b,0); return Math.max(...clusterPos(n).map(q=>Math.hypot(q[0],q[1])))+0.55;

function sup(n){ const d={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'}; return String(n).replace(/./g,c=>d[c]||c); }

/* =====================================================================
   1.13  PERCENTAGE COMPOSITION → EMPIRICAL → MOLECULAR FORMULA
   Textbook Problem 1.2: 4.07 % H, 24.27 % C, 71.65 % Cl, molar mass 98.96 g
   → ratio 2 : 1 : 1 → CH₂Cl → n = 2 → C₂H₄Cl₂
   ===================================================================== */
const EMP=[
  {name:'Problem 1.2',els:[['C',24.27],['H',4.07],['Cl',71.65]],M:98.96},
  {name:'Glucose',els:[['C',40.00],['H',6.71],['O',53.29]],M:180.16},
  {name:'Iron oxide',els:[['Fe',69.9],['O',30.1]],M:159.69},
  {name:'Ethanol',els:[['C',52.14],['H',13.13],['O',34.73]],M:46.07}
];
function empCalc(P,Mm){
  const els=P.els.map(([e,p])=>({e,g:p,mol:p/EL[e].m})); const mn=Math.min(...els.map(x=>x.mol)); els.forEach(x=>x.r=x.mol/mn);
  let k=1; for(const kk of [1,2,3,4,5]){ if(els.every(x=>Math.abs(x.r*kk-Math.round(x.r*kk))<0.09)){ k=kk; break; } }
  els.forEach(x=>{ x.w=Math.round(x.r*k); });
  const efm=els.reduce((a,x)=>a+x.w*EL[x.e].m,0), n=Math.max(1,Math.round(Mm/efm));
  return {els,k,efm,n};
}
function buildA13(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =

    `<div class="control-group"><div class="step-row" id="stR">${['% → g','→ mol','÷ min','empirical','molecular'].map((s,i)=>`<button class="step-pill${i?'':' active'}" data-s="${i}">${i+1} ${s}</button>`).join('')}</div>
      <button class="toggle-btn play" id="wkB" style="width:100%;margin-top:9px">▶ Walk me through</button></div>` +
    sliderHTML('mR','Molar mass (g/mol)',20,400,0.01,98.96) +
    rcardsHTML([{l:'Empirical',id:'eV',c:COL.blue},{l:'Molecular',id:'fV',c:COL.green},{l:'n',id:'nV'}],true);
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let P=EMP[0], stage=0, t=0, walk=false, wt=0; const H={}; const pops=[];
  function setStage(i){ stage=i; wrap.querySelectorAll('.step-pill').forEach((b,j)=>{ b.classList.toggle('active',j===i); b.classList.toggle('done',j<i); }); }
  wrap.querySelectorAll('.step-pill').forEach(b=>b.onclick=()=>{ walk=false; setStage(+b.dataset.s); });
  toggleWire(wrap.querySelectorAll('#cpB button'),b=>{ P=EMP[+b.dataset.v]; $('#mR').value=P.M; setStage(0); });

  animLoop(dt=>{

    const Mm=+$('#mR').value; $('#mRV').textContent=fmt(Mm,2)+' g';

    /* ----- bars ----- */

      rect(ctx,cx-bw/2,base-hh,bw,hh,col,'#fff',3); ctx.save(); ctx.strokeStyle=col; ctx.globalAlpha=0.3; ctx.lineWidth=1; for(let q=6;q<hh;q+=8){ ctx.beginPath(); ctx.moveTo(cx-bw/2,base-q); ctx.lineTo(cx+bw/2,base-q); ctx.stroke(); } ctx.restore();

    /* ----- arithmetic column ----- */

        const key='u'+c; pops[c]=pops[c]===undefined?0:pops[c]; pops[c]=approach(pops[c],1,5,dt);
        list.forEach((e,i)=>{ const x=px0+col*(per*unitS*2.1+16)+i*unitS*2.1+unitS, y=py0-row*unitS*2.8; if(i) line(ctx,x-unitS*2.1,y,x,y,COL.ink,2); atom(ctx,e,x,y,unitS/10*pops[c]*(c===0?1:1),1,unitS>11); });
      }

/* =====================================================================
   1.15  STOICHIOMETRY & LIMITING REAGENT
   N₂ + 3 H₂ → 2 NH₃ ; Problem 1.5: 50.0 kg N₂ + 10.0 kg H₂ → H₂ limits
   ===================================================================== */
function buildA15(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    sliderHTML('nR','N₂ available',0,100,0.5,50) + sliderHTML('hR','H₂ available',0,20,0.1,10) +
    `<div class="control-group"><button class="toggle-btn play" id="goB" style="width:100%">⚗ React</button><button class="toggle-btn" id="rsB" style="width:100%;margin-top:7px">↺ Reset</button></div>` +
    rcardsHTML([{l:'Limiting reagent',id:'lV',c:COL.red,wide:true},{l:'NH₃ formed',id:'pV',c:COL.green},{l:'NH₃ mass',id:'mV'},{l:'Left over',id:'oV',wide:true,sm:true}]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  const MN=28.0, MH=2.016, MA=17.0; let t=0, prog=0, run=false, flow=0;
  const G1=newGas(40,0,0,1,1,0.5,2);
  ['#nR','#hR'].forEach(i=>$(i).addEventListener('input',()=>{ prog=0; run=false; }));
  $('#goB').onclick=()=>{ run=true; };
  $('#rsB').onclick=()=>{ run=false; prog=0; };
  animLoop(dt=>{
    t+=dt;
    const kgN=+$('#nR').value, kgH=+$('#hR').value; $('#nRV').textContent=fmt(kgN,1)+' kg'; $('#hRV').textContent=fmt(kgH,1)+' kg';
    const nN=kgN*1000/MN, nH=kgH*1000/MH, xmax=Math.min(nN,nH/3);
    if(run){ prog=Math.min(1,prog+dt/4.5); flow=approach(flow,1,6,dt); if(prog>=1) run=false; } else flow=approach(flow,0,5,dt);
    const e=prog*prog*(3-2*prog), xi=xmax*e;
    const lN=nN-xi, lH=nH-3*xi, pA=2*xi;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const tw=Math.min(110,w*0.13), base=h*0.84, th=h*0.56, ty=base-th;
    const maxN=100*1000/MN, maxH=3*maxN, maxA=2*maxN;
    const tanks=[{x:w*0.14,l:lN,max:maxN,col:COL.green,name:'N₂',need:Math.min(nH/3,maxN),mol:'N2',have:nN},
                 {x:w*0.33,l:lH,max:maxH,col:COL.blue,name:'H₂',need:Math.min(3*nN,maxH),mol:'H2',have:nH},
                 {x:w*0.88,l:pA,max:maxA,col:COL.green,name:'NH₃',need:0,mol:'NH3',have:0}];
    const limN=nN<=nH/3+1e-9&&nN>0, limH=nH/3<nN-1e-9;
    /* reactor in the middle */
    const rx=w*0.59, ry=base-th*0.5, rw=Math.min(130,w*0.15), rh=th*0.5;
    rect(ctx,rx-rw/2,ry-rh/2,rw,rh,COL.ink,'#fff',3.4); textAt(ctx,'reactor',rx,ry-rh/2-10,{align:'center',size:12,weight:700,color:COL.muted});
    if(flow>0.05) flame(ctx,rx,ry+rh/2+2,rw*0.8,flow*0.9,t);
    /* pipes with moving packets */
    const pipe=(path,col)=>{ const segs=[]; let L=0; for(let i=1;i<path.length;i++){ const d=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]); segs.push(d); L+=d; }
      ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=COL.mid; ctx.lineWidth=5; ctx.beginPath(); path.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore();
      if(flow>0.05){ for(let i=0;i<6;i++){ let d=((t*0.35+i/6)%1)*L, k=0; while(k<segs.length-1&&d>segs[k]){ d-=segs[k]; k++; } const u=d/(segs[k]||1); circ(ctx,lerp(path[k][0],path[k+1][0],u),lerp(path[k][1],path[k+1][1],u),4,col,col,1); } } };
    pipe([[tanks[0].x,ty],[tanks[0].x,ty-62],[rx-22,ty-62],[rx-22,ry-rh/2]],COL.green);
    pipe([[tanks[1].x,ty],[tanks[1].x,ty-34],[rx+22,ty-34],[rx+22,ry-rh/2]],COL.blue);
    pipe([[rx+rw/2,ry],[tanks[2].x-tw/2,ry]],COL.green);
    /* tanks */
    tanks.forEach((T,ti)=>{
      const f=clamp(T.l/T.max,0,1), fy=base-th*f;
      ctx.save(); ctx.beginPath(); ctx.rect(T.x-tw/2+1,ty,tw-2,th-1); ctx.clip(); ctx.fillStyle=T.col==COL.blue?'rgba(47,143,224,0.2)':'rgba(31,157,85,0.2)';
      ctx.beginPath(); ctx.moveTo(T.x-tw/2,fy); for(let q=0;q<=tw;q+=4) ctx.lineTo(T.x-tw/2+q,fy+Math.sin(t*3+q*0.12+ti)*1.5); ctx.lineTo(T.x+tw/2,base); ctx.lineTo(T.x-tw/2,base); ctx.closePath(); ctx.fill(); ctx.restore();
      const nd=Math.round(f*26); for(let i=0;i<nd;i++){ const g=G1[i]; g.x+=g.vx*dt*0.5; g.y+=g.vy*dt*0.5; if(g.x<0.12||g.x>0.88) g.vx*=-1; if(g.y<0.05||g.y>0.95) g.vy*=-1; g.x=clamp(g.x,0.1,0.9); g.y=clamp(g.y,0.04,0.96);
        drawMol(ctx,T.mol,T.x-tw/2+g.x*tw,base-g.y*th*f,Math.max(5,tw/12),t+i); }
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3.2; ctx.beginPath(); ctx.moveTo(T.x-tw/2,ty); ctx.lineTo(T.x-tw/2,base-8); ctx.quadraticCurveTo(T.x-tw/2,base,T.x-tw/2+8,base); ctx.lineTo(T.x+tw/2-8,base); ctx.quadraticCurveTo(T.x+tw/2,base,T.x+tw/2,base-8); ctx.lineTo(T.x+tw/2,ty); ctx.stroke(); ctx.restore();
      textAt(ctx,T.name,T.x,base+24,{align:'center',size:16,weight:700,color:T.col});
      const kg=T.l*(ti===0?MN:ti===1?MH:MA)/1000; textAt(ctx,fmt(kg,1)+' kg',T.x,base+44,{align:'center',size:14,weight:700,color:T.col});
      /* "needed" marker */
      if(ti<2&&T.need>0){ const yy=base-th*clamp(T.need/T.max,0,1); line(ctx,T.x-tw/2-8,yy,T.x+tw/2+8,yy,COL.yellow,2.4,[6,4]); textAt(ctx,'needed',T.x-tw/2+5,yy-6,{size:11,weight:700,color:COL.yellow}); }
      const lim=(ti===0&&limN)||(ti===1&&limH);
      if(lim){ ctx.save(); ctx.strokeStyle=COL.red; ctx.lineWidth=3; ctx.setLineDash([8,5]); ctx.strokeRect(T.x-tw/2-14,ty-20,tw+28,th+78); ctx.restore(); textAt(ctx,'limiting',T.x,base+66,{align:'center',size:13,weight:700,color:COL.red}); }
    });
    textAt(ctx,'N₂ + 3 H₂ → 2 NH₃',w/2,30,{align:'center',size:Math.min(26,w*0.03),weight:700,color:COL.ink});
    const lim=nN<=0||nH<=0?'—':(limH?'H₂':(limN?'N₂':'neither — exact ratio'));
    const left=lN>1e-6&&lH>1e-6?'both':(!limH&&!limN?'none':(limH?'N₂ '+fmt(Math.max(0,nN-nH/3)*MN/1000,1)+' kg':'H₂ '+fmt(Math.max(0,nH-3*nN)*MH/1000,1)+' kg'));
    const fin=2*xmax; const done=prog>=1;
    $('#lV').textContent=lim; $('#pV').textContent=fmt(done?fin:pA,0)+' mol'; $('#mV').textContent=fmt((done?fin:pA)*MA/1000,1)+' kg';
    $('#oV').textContent=!done?'(press React)':(lim==='—'?'—':(limH?'N₂ '+fmt((nN-nH/3)*MN/1000,1)+' kg':limN?'H₂ '+fmt((nH-3*nN)*MH/1000,1)+' kg':'nothing'));
  });
  return wrap;
}


/* ---------------------------------------------------------------------
   Dissolved-particle field shared by 1.16 and 1.17.
   Dots live in normalised liquid coordinates, so when the level rises the
   same dots spread out (dilution) ; new dots fall in from above (dissolving).
   --------------------------------------------------------------------- */
function SoluteField(seed){ this.d=[]; this.R=rng(seed||5); }
SoluteField.prototype.setCount=function(n){
  while(this.d.length<n) this.d.push({x:0.1+this.R()*0.8,y:1.5+this.R()*0.8,vx:(this.R()-0.5)*0.3,vy:0,ph:this.R()*6.28,a:1});
  while(this.d.length>n){ const i=Math.floor(this.R()*this.d.length); this.d.splice(i,1); }
};
SoluteField.prototype.step=function(dt,t){
  this.d.forEach(p=>{
    if(p.y>1){ p.vy-=1.6*dt; p.y+=p.vy*dt; if(p.y<=0.96){ p.y=0.96; p.vy=0; } }
    else { p.x+=(Math.sin(t*1.3+p.ph)*0.12+p.vx)*dt; p.y+=Math.cos(t*1.1+p.ph*1.7)*0.1*dt; if(p.x<0.07||p.x>0.93) p.vx*=-1; p.x=clamp(p.x,0.06,0.94); p.y=clamp(p.y,0.05,0.97); }
  });
};

/* =====================================================================
   1.16  MOLARITY & DILUTION
   Make: 4 g NaOH in 250 mL → 0.4 M (textbook Problem 1.7)
   Dilute: 200 mL of 1 M NaOH made up to 1000 mL → 0.2 M ; M₁V₁ = M₂V₂
   ===================================================================== */
function buildA16(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    togglesHTML('mdB','Task',[['mk','Make a solution'],['dl','Dilute a stock']],0) +
    `<div id="mkS">${sliderHTML('gR','NaOH dissolved',0,20,0.1,4)}${sliderHTML('vR','Final volume',100,1000,10,250)}</div>
     <div id="dlS" class="hidden">${sliderHTML('m1R','Stock molarity',0.5,3,0.1,1)}${sliderHTML('v1R','Stock taken',50,500,10,200)}${sliderHTML('v2R','Make up to',100,1000,10,1000)}</div>` +
    rcardsHTML([{l:'Moles',id:'nV'},{l:'Volume',id:'vV'},{l:'Molarity',id:'mV',c:COL.blue,wide:true}]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let mode='mk', t=0; const LV={x:250,v:0}, F=new SoluteField(7);
  toggleWire(wrap.querySelectorAll('#mdB button'),b=>{ mode=b.dataset.v; $('#mkS').classList.toggle('hidden',mode!=='mk'); $('#dlS').classList.toggle('hidden',mode!=='dl'); });
  animLoop(dt=>{
    t+=dt;
    let n,V,M1;
    if(mode==='mk'){ const g=+$('#gR').value; V=+$('#vR').value; n=g/40.0; $('#gRV').textContent=fmt(g,1)+' g'; $('#vRV').textContent=V+' mL'; }
    else { M1=+$('#m1R').value; const V1=+$('#v1R').value; V=Math.max(V1,+$('#v2R').value); n=M1*V1/1000; $('#m1RV').textContent=fmt(M1,1)+' M'; $('#v1RV').textContent=V1+' mL'; $('#v2RV').textContent=V+' mL'; }
    F.setCount(Math.min(110,Math.round(n*60))); F.step(dt,t);
    springTo(LV,V,38,6.5,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cw=Math.min(w*0.24,190), cx=w*0.42, base=h*0.88, maxH=h*0.74, pxml=maxH/1000, lvl=Math.max(5,LV.x)*pxml;
    const M=n/(V/1000), Mshow=n/(Math.max(10,LV.x)/1000);
    /* cylinder */
    const tint='rgba(47,143,224,'+(0.07+0.45*Math.min(1,Mshow/2)).toFixed(3)+')';
    ctx.save(); ctx.beginPath(); ctx.rect(cx-cw/2+1,base-lvl,cw-2,lvl); ctx.clip(); ctx.fillStyle=tint; ctx.beginPath(); ctx.moveTo(cx-cw/2,base-lvl);
    const sl=(V-LV.x)/300; for(let q=0;q<=cw;q+=4) ctx.lineTo(cx-cw/2+q,base-lvl+Math.sin(t*3+q*0.1)*(1.2+Math.abs(sl)*4)+sl*(q/cw-0.5)*10); ctx.lineTo(cx+cw/2,base); ctx.lineTo(cx-cw/2,base); ctx.closePath(); ctx.fill(); ctx.restore();
    line(ctx,cx-cw/2,base-maxH-8,cx-cw/2,base,COL.ink,3.4); line(ctx,cx+cw/2,base-maxH-8,cx+cw/2,base,COL.ink,3.4); line(ctx,cx-cw/2-14,base,cx+cw/2+14,base,COL.ink,5);
    for(let v=0;v<=1000;v+=100){ const yy=base-v*pxml; line(ctx,cx+cw/2,yy,cx+cw/2+(v%500===0?16:9),yy,COL.yellow,2); if(v%200===0||v===1000) textAt(ctx,v+' mL',cx+cw/2+20,yy+4,{size:11,weight:700,color:COL.yellow}); }
    /* dissolved particles : each dot = NaOH formula unit shown as Na⁺ / OH⁻ pair */
    F.d.forEach(p=>{ const px=cx-cw/2+p.x*cw, py=p.y>1?base-lvl-(p.y-1)*maxH*0.4:base-p.y*lvl; circ(ctx,px,py,5.2,COL.yellow,'rgba(217,160,23,0.3)',2); circ(ctx,px+7,py+3,3.4,COL.red,'rgba(217,67,43,0.25)',1.6); });
    /* left prop */
    if(mode==='mk'){
      const gx=w*0.13, gy=base-18, gm=+$('#gR').value; ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(gx,gy-4,50,0.15*Math.PI,0.85*Math.PI); ctx.stroke(); ctx.restore();
      const pel=Math.round(gm*3); for(let i=0;i<pel;i++){ const a=(i*2.4)%6.28, r=Math.sqrt(i/Math.max(1,pel))*38; circ(ctx,gx+Math.cos(a)*r,gy-20+Math.sin(a)*r*0.35-Math.floor(i/14)*3,4,COL.yellow,'#fff',1.8); }
      textAt(ctx,fmt(gm,1)+' g NaOH',gx,gy+68,{align:'center',size:13,weight:700,color:COL.yellow});
    } else {
      const bx=w*0.13, by=base; ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(bx-14,by-170); ctx.lineTo(bx-14,by-132); ctx.quadraticCurveTo(bx-46,by-120,bx-46,by-96); ctx.lineTo(bx-46,by-4); ctx.lineTo(bx+46,by-4); ctx.lineTo(bx+46,by-96); ctx.quadraticCurveTo(bx+46,by-120,bx+14,by-132); ctx.lineTo(bx+14,by-170); ctx.closePath(); ctx.fillStyle='rgba(217,160,23,0.18)'; ctx.fill(); ctx.stroke(); ctx.restore();
      textAt(ctx,fmt(M1,1)+' M',bx,by-52,{align:'center',size:20,weight:700,color:COL.yellow}); textAt(ctx,'stock NaOH',bx,by-30,{align:'center',size:11,weight:700,color:COL.muted});
      line(ctx,bx+50,by-90,cx-cw/2-12,by-lvl+10,COL.yellow,2.4,[6,5]); arrowHead(ctx,cx-cw/2-12,by-lvl+10,Math.atan2(-lvl+100,cx-cw/2-bx-60),COL.yellow,9);
    }
    /* maths */
    const px=w*0.78, fs=Math.min(22,w*0.026);
    if(mode==='mk'){
      textAt(ctx,'n  =  '+fmt(+$('#gR').value,1)+' g ÷ 40 g/mol',px,h*0.2,{align:'center',size:fs,weight:700,color:COL.ink});
      textAt(ctx,'=  '+fmt(n,3)+' mol',px,h*0.2+32,{align:'center',size:fs,weight:700,color:COL.yellow});
      textAt(ctx,'M  =  n ÷ V(L)',px,h*0.42,{align:'center',size:fs,weight:700,color:COL.ink});
      textAt(ctx,fmt(n,3)+' ÷ '+fmt(V/1000,3),px,h*0.42+32,{align:'center',size:fs,weight:700,color:COL.ink});
    } else {
      textAt(ctx,'M₁V₁  =  M₂V₂',px,h*0.2,{align:'center',size:fs*1.1,weight:700,color:COL.ink});
      textAt(ctx,fmt(M1,1)+' × '+(+$('#v1R').value)+'  =  M₂ × '+V,px,h*0.2+34,{align:'center',size:fs*0.95,weight:700,color:COL.yellow});
    }
    textAt(ctx,'= '+fmt(M,mode==='mk'?2:2)+' M',px,h*0.66,{align:'center',size:Math.min(52,w*0.06),weight:700,color:COL.blue});
    textAt(ctx,mode==='mk'?'moles of solute per litre of solution':'same moles, more volume → lower M',px,h*0.66+30,{align:'center',size:12,weight:600,color:COL.muted});
    $('#nV').textContent=fmt(n,3)+' mol'; $('#vV').textContent=V+' mL'; $('#mV').textContent=fmt(M,2)+' mol/L';
  });
  return wrap;
}

/* =====================================================================
   1.17  CONCENTRATION UNITS — mass %, mole fraction, molality
   Problem 1.6: 2 g of A in 18 g water → 10 % w/w
   ===================================================================== */
const SOLUTES={NaCl:{M:58.44,name:'NaCl'},NaOH:{M:40.0,name:'NaOH'},GLU:{M:180.16,name:'Glucose'}};
function buildA17(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    togglesHTML('slB','Solute',[['NaCl','NaCl'],['NaOH','NaOH'],['GLU','Glucose']],0) +
    sliderHTML('sR','Solute',0.5,60,0.5,2) + sliderHTML('wR','Water',10,200,1,18) +
    rcardsHTML([{l:'Mass %',id:'pV',c:COL.red},{l:'Mole fraction',id:'xV',c:COL.blue},{l:'Molality',id:'mV',c:COL.green,wide:true}]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let key='NaCl', t=0; const LV={x:20,v:0}, F=new SoluteField(11); const Rg=rng(4), cells=[]; for(let i=0;i<100;i++) cells.push(Rg());
  toggleWire(wrap.querySelectorAll('#slB button'),b=>{ key=b.dataset.v; });
  animLoop(dt=>{
    t+=dt; const S=SOLUTES[key], ms=+$('#sR').value, mw=+$('#wR').value; $('#sRV').textContent=fmt(ms,1)+' g'; $('#wRV').textContent=mw+' g';
    const ns=ms/S.M, nw=mw/18.02, pct=ms/(ms+mw)*100, xs=ns/(ns+nw), mol=ns/(mw/1000);
    F.setCount(Math.min(100,Math.max(2,Math.round(ns*120)))); F.step(dt,t);
    springTo(LV,ms+mw,40,6.5,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    /* beaker */
    const bw=Math.min(w*0.32,250), bh=h*0.55, cx=w*0.27, base=h*0.86, lvl=clamp(0.07+0.85*LV.x/260,0.07,0.96);
    liquidBeaker(ctx,cx,base,bw,bh,lvl,'rgba(47,143,224,0.2)',t,0);
    F.d.forEach(p=>{ const px=cx-bw/2+p.x*bw, py=p.y>1?base-bh*lvl-(p.y-1)*bh*0.35:base-p.y*bh*lvl; circ(ctx,px,py,4.8,COL.red,'rgba(217,67,43,0.3)',2); });
    textAt(ctx,fmt(ms,1)+' g '+S.name+' + '+mw+' g water',cx,base+26,{align:'center',size:13,weight:700,color:COL.ink});
    /* mass-% bar */
    const bx=w*0.52, bwid=w*0.4, by=h*0.14;
    textAt(ctx,'Mass %  =  mass of solute ÷ mass of solution × 100',bx,by-14,{size:13,weight:700,color:COL.muted});
    const sw=bwid*ms/(ms+mw); rect(ctx,bx,by,sw,30,COL.red,'rgba(217,67,43,0.15)',2.6); rect(ctx,bx+sw,by,bwid-sw,30,COL.blue,'rgba(47,143,224,0.12)',2.6);
    textAt(ctx,fmt(ms,1)+' g',bx+sw/2,by+21,{align:'center',size:13,weight:700,color:COL.red}); textAt(ctx,mw+' g water',bx+sw+(bwid-sw)/2,by+21,{align:'center',size:13,weight:700,color:COL.blue});
    textAt(ctx,fmt(ms,1)+' ÷ '+fmt(ms+mw,1)+' × 100  =  '+fmt(pct,2)+' %',bx,by+62,{size:Math.min(24,w*0.028),weight:700,color:COL.red});
    /* mole-fraction grid */
    const gy=h*0.4; textAt(ctx,'Mole fraction  =  n(solute) ÷ n(total)   ·   100 particles',bx,gy-12,{size:13,weight:700,color:COL.muted});
    const nS=Math.min(100,Math.max(ns>0?1:0,Math.round(xs*100))); const order=cells.map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]); const sol=new Set(order.slice(0,nS).map(q=>q[1]));
    const cs=Math.min(22,bwid/22);
    for(let i=0;i<100;i++){ const c=i%20, r=Math.floor(i/20), x=bx+c*cs+cs/2+Math.sin(t*1.6+i)*1.2, y=gy+r*cs*0.95+cs/2+Math.cos(t*1.3+i*1.7)*1.2; if(sol.has(i)) circ(ctx,x,y,cs*0.4,COL.red,'rgba(217,67,43,0.45)',2.2); else circ(ctx,x,y,cs*0.28,COL.blue,null,1.6); }
    textAt(ctx,fmt(ns,4)+' ÷ ('+fmt(ns,4)+' + '+fmt(nw,3)+')  =  '+fmt(xs,4),bx,gy+5*cs*0.95+cs+26,{size:Math.min(20,w*0.024),weight:700,color:COL.blue});
    /* molality */
    const my=h*0.78; textAt(ctx,'Molality  =  mol of solute ÷ kg of solvent',bx,my-12,{size:13,weight:700,color:COL.muted});
    textAt(ctx,fmt(ns,4)+' mol ÷ '+fmt(mw/1000,3)+' kg  =  '+fmt(mol,3)+' m',bx,my+22,{size:Math.min(24,w*0.028),weight:700,color:COL.green});
    $('#pV').textContent=fmt(pct,2)+' %'; $('#xV').textContent=fmt(xs,4); $('#mV').textContent=fmt(mol,3)+' mol/kg';
  });
  return wrap;
}

let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');

    btn.className = 'nav-item'+(i===currentIndex?' active':'');
