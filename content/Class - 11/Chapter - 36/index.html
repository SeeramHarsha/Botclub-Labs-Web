      <div class="fb bad hidden" id="fb"></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">P(E ∪ F)</div><div class="rval" id="uV"></div></div>
      <div class="rcard"><div class="rlabel">Darts</div><div class="rval" id="nV">0</div></div></div></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let t=0, one=0, many=false, darts=[], fly=null, cnt=[0,0,0,0], N=0; // cnt: neither,E only,F only,both
  const sm={e:{x:0.05,v:0},f:{x:0.10,v:0},i:{x:0.02,v:0}};
  const vals=()=>({e:parseFloat($('#eR').value),f:parseFloat($('#fR').value),i:parseFloat($('#iR').value)});
  function setV(p){ $('#eR').value=p.e; $('#fR').value=p.f; $('#iR').value=p.i; clear(); }
  function clear(){ darts=[]; cnt=[0,0,0,0]; N=0; fly=null; }
  toggleWire(wrap.querySelectorAll('#pre button'),b=>setV(PRE9[+b.dataset.i]));
  ['e','f','i'].forEach(k=>$('#'+k+'R').addEventListener('input',()=>{ wrap.querySelectorAll('#pre button').forEach(x=>x.classList.remove('active')); clear(); }));
  $('#throw').onclick=()=>{ one++; }; $('#many').onclick=()=>{ many=true; }; $('#rst').onclick=clear;
  function zone(x,v){ const fx0=v.e-v.i, inE=x<v.e, inF=x>=fx0&&x<fx0+v.f; return inE&&inF?3:inE?1:inF?2:0; }

  animLoop(dt=>{
    t+=dt;
    const v=vals();
    ['e','f','i'].forEach(k=>{ springTo(sm[k],v[k],70,11,dt); $('#'+k+'V').textContent=fmt(v[k],2); });
    const consistent = v.i<=Math.min(v.e,v.f)+1e-9 && (v.e+v.f-v.i)<=1+1e-9;
    const fb=$('#fb'); fb.classList.toggle('hidden',consistent);
    if(!consistent) fb.textContent = v.i>Math.min(v.e,v.f)+1e-9 ? 'Inconsistent: P(E∩F) cannot exceed P(E) or P(F).' : 'Inconsistent: P(E∪F) would exceed 1.';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const L=Math.min(w*0.58,h*0.8), bx=w*0.05, by=h*0.1;
    // board
    ctx.save(); ctx.fillStyle='#fff'; ctx.fillRect(bx,by,L,L); ctx.restore();
    const e=sm.e.x, f=sm.f.x, i=sm.i.x, fx0=e-i;
    const strip=(x0,wd,col,al)=>{ ctx.save(); ctx.fillStyle=rgba(col,al); ctx.fillRect(bx+x0*L,by,wd*L,L); ctx.restore(); };
    strip(0,e,'#2f8fe0',0.26); strip(fx0,f,'#d9432b',0.26);
    if(consistent&&i>0.0005) strip(fx0,i,'#1f9d55',0.55);
    // outlines
    ctx.save(); ctx.lineWidth=2.6; ctx.strokeStyle=COL.blue; ctx.strokeRect(bx,by,e*L,L); ctx.strokeStyle=COL.red; ctx.setLineDash(consistent?[]:[6,5]); ctx.strokeRect(bx+fx0*L,by,f*L,L); ctx.restore();
    rect(ctx,bx,by,L,L,COL.ink,null,3);
    textAt(ctx,'S  (area = 1)',bx+L,by-10,{align:'right',size:12,weight:700});
    textAt(ctx,'E',bx+e*L/2,by-10,{align:'center',size:13,weight:700,color:COL.blue});
    textAt(ctx,'F',bx+(fx0+f/2)*L,by+L+18,{align:'center',size:13,weight:700,color:COL.red});
    if(i>0.0005&&consistent) textAt(ctx,'E∩F',bx+(fx0+i/2)*L,by+L/2,{align:'center',size:11,weight:700,color:COL.green});


    // darts stuck in the board
    darts.forEach(d=>{ const col=[COL.mid,COL.blue,COL.red,COL.green][d.z]; circ(ctx,bx+d.x*L,by+d.y*L,3.2,col,col,1); });
    // throw
    const mkDart=()=>({x:Math.random(),y:Math.random()});
    function land(d){ d.z=zone(d.x,v); cnt[d.z]++; N++; darts.push(d); if(darts.length>3000) darts.shift(); }
    if(consistent){
      if(one>0&&!fly){ one--; fly={d:mkDart(),u:0}; }
      if(many){ many=false; for(let k=0;k<200;k++) land(mkDart()); }
    } else { one=0; many=false; }
    if(fly){
      fly.u=Math.min(1,fly.u+dt/0.55); const u=fly.u, d=fly.d, tx=bx+d.x*L, ty=by+d.y*L;
      const sx=w*0.97, sy=by+L+40, x=lerp(sx,tx,u), y=lerp(sy,ty,u)-Math.sin(Math.PI*u)*L*0.25;
      const ang=Math.atan2((lerp(sy,ty,u+0.02)-Math.sin(Math.PI*(u+0.02))*L*0.25)-y, lerp(sx,tx,u+0.02)-x);
      ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.strokeStyle=COL.yellow; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(6,0); ctx.stroke(); ctx.fillStyle=COL.ink; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(4,-3.4); ctx.lineTo(4,3.4); ctx.fill();
      ctx.strokeStyle=COL.yellow; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(-21,-5); ctx.moveTo(-16,0); ctx.lineTo(-21,5); ctx.stroke(); ctx.restore();
      if(fly.u>=1){ land(fly.d); fly=null; }
    }
    if(darts.length){ const d=darts[darts.length-1]; if(!fly) circ(ctx,bx+d.x*L,by+d.y*L,8+Math.sin(t*6)*2,COL.yellow,null,2.2); }

    // answers (right)
    const rx=bx+L+w*0.045, rw=Math.max(120,w-rx-w*0.04);
    const pU=e+f-i, pN=1-pU, pAny=1-i, pOne=e+f-2*i;
    const exp=[N?cnt[0]/N:0, N?(N-cnt[3])/N:0, N?(cnt[1]+cnt[2])/N:0];
    textAt(ctx,'P(E ∪ F) = '+fmt(e,2)+' + '+fmt(f,2)+' − '+fmt(i,2)+' = '+fmt(pU,2),rx,by+8,{size:12.5,weight:700,color:COL.ink});
    const rows=[
      {k:'(a) neither   1 − P(E∪F)',th:pN,ex:exp[0],c:'#234a73'},
      {k:'(b) at least one fails   1 − P(E∩F)',th:pAny,ex:exp[1],c:COL.red},
      {k:'(c) exactly one   P(E)+P(F)−2P(E∩F)',th:pOne,ex:exp[2],c:COL.green},
    ];
    rows.forEach((r,k)=>{
      const y=by+L*0.2+k*(L*0.2);
      bar(ctx,rx,y+14,rw,15,clamp(r.th,0,1),r.c,r.k,''); textAt(ctx,consistent?fmt(r.th,2):'—',rx+rw,y+44,{align:'right',size:13,weight:700,color:COL.ink});
      if(N&&consistent){ line(ctx,rx+rw*exp[k],y+8,rx+rw*exp[k],y+36,COL.ink,2.6); }
    });
    textAt(ctx,'▎ black tick = share of darts so far ('+N+')',rx,by+L*0.2+3*(L*0.2)+6,{size:11.5,weight:600,color:COL.mid});
    // legend
    [[COL.mid,'none'],[COL.blue,'E only'],[COL.red,'F only'],[COL.green,'both']].forEach(([c,n],k)=>{ circ(ctx,rx+6+k*Math.min(86,rw/4),by+L+6,4,c,c,1); textAt(ctx,n,rx+16+k*Math.min(86,rw/4),by+L+10,{size:11,weight:600,color:COL.mid}); });
    $('#uV').textContent=consistent?fmt(pU,2):'—'; $('#nV').textContent=N;
  });
  return wrap;
}

/* =====================================================================
   14.10 CHOOSING A COMMITTEE  (Example 8)
   Men (blue) and women (red) stand in a line. Two are chosen at random:
   they step forward and wave while their pair-tile lights up in the
   sample space of C(n,2) equally likely pairs.
   Textbook check: 2 men + 2 women → C(4,2)=6 pairs;
   P(no man)=1/6, P(one man)=2/3, P(two men)=1/6.
   ===================================================================== */
function drawPerson(ctx,x,y,s,col,walk,arms,alpha,skirt){
  ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=col; ctx.fillStyle='#fff'; ctx.lineWidth=Math.max(2,s*0.07);
  const hr=s*0.13, hy=y-s*0.78, sw=Math.sin(walk)*s*0.14;
  ctx.beginPath(); ctx.arc(x,hy,hr,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,hy+hr); ctx.lineTo(x,y-s*0.34); ctx.stroke();                      // torso
  if(skirt){ ctx.beginPath(); ctx.moveTo(x,y-s*0.5); ctx.lineTo(x-s*0.16,y-s*0.3); ctx.lineTo(x+s*0.16,y-s*0.3); ctx.closePath(); ctx.fillStyle=rgba(col,0.18); ctx.fill(); ctx.stroke(); ctx.fillStyle='#fff'; }
  ctx.beginPath(); ctx.moveTo(x,y-s*0.34); ctx.lineTo(x-sw,y); ctx.moveTo(x,y-s*0.34); ctx.lineTo(x+sw,y); ctx.stroke(); // legs
  const up=arms; // 0 = down, 1 = raised & waving
  const wv=Math.sin(walk*1.3)*s*0.06*up;
  ctx.beginPath(); ctx.moveTo(x,y-s*0.6); ctx.lineTo(x-s*0.17-wv,lerp(y-s*0.36,y-s*0.9,up)); ctx.moveTo(x,y-s*0.6); ctx.lineTo(x+s*0.17+wv,lerp(y-s*0.36,y-s*0.9,up)); ctx.stroke();
  ctx.restore();
}
function buildA10(){
  const wrap=labShell();
  const sl=(id,name,col,v)=>`<div class="control-group"><label style="color:${col}">${name} <span class="val" id="${id}V"></span></label><input type="range" id="${id}R" min="0" max="6" step="1" value="${v}"></div>`;
  wrap.querySelector('.lab-side').innerHTML = sl('m','Men','var(--f-blue)',2)+sl('w','Women','var(--f-red)',2)+`
    <div class="control-group"><button class="toggle-btn navy" id="pick" style="margin-top:0">👥 Select a committee of 2</button>
      <div class="toggle-group"><button class="toggle-btn" id="many">Select 30 fast</button><button class="toggle-btn" id="rst">Reset tally</button></div></div>
    <div class="control-group"><div class="result-cards three">
      <div class="rcard"><div class="rlabel">No man</div><div class="rval" id="p0" style="color:var(--f-red)"></div></div>
      <div class="rcard"><div class="rlabel">One man</div><div class="rval" id="p1" style="color:var(--f-green)"></div></div>
      <div class="rcard"><div class="rlabel">Two men</div><div class="rval" id="p2" style="color:var(--f-blue)"></div></div></div>
      <p class="hint" id="hint"></p></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let t=0, one=0, many=false, sel=null, tally=[0,0,0], total=0, selKey='';
  const off=Array.from({length:12},()=>({x:0,v:0})), walkPh=Array(12).fill(0);
  $('#pick').onclick=()=>{ one++; }; $('#many').onclick=()=>{ many=true; }; $('#rst').onclick=()=>{ tally=[0,0,0]; total=0; sel=null; };
  animLoop(dt=>{
    t+=dt;
    const M=parseInt($('#mR').value), W=parseInt($('#wR').value); $('#mV').textContent=M; $('#wV').textContent=W;
    const n=M+W, pairs=comb(n,2);
    const key=M+','+W; if(key!==selKey){ selKey=key; sel=null; tally=[0,0,0]; total=0; }
    // interleave men and women so the line looks mixed
    const cols=[]; { let m=M, wm=W; for(let i=0;i<n;i++){ if((m>=wm&&m>0)||wm===0){ cols.push('m'); m--; } else { cols.push('w'); wm--; } } }
    const cnt=[comb(W,2),M*W,comb(M,2)];
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // choose
    const choose=()=>{ const a=randInt(0,n-1); let b=randInt(0,n-2); if(b>=a) b++; const k=(cols[a]==='m')+(cols[b]==='m'); return {a,b,k}; };
    if(n>=2){
      if(many){ many=false; for(let q=0;q<30;q++){ const c=choose(); tally[c.k]++; total++; } }
      if(one>0&&(!sel||sel.age>1.6)){ one--; sel=choose(); sel.age=0; tally[sel.k]++; total++; }
      else if(n<2) one=0;
    } else { one=0; many=false; sel=null; }
    if(sel) sel.age+=dt;

    // people
    const gy=h*0.3, step=Math.min(w*0.8/Math.max(n,1),w*0.1), s=Math.min(h*0.24,step*1.3), x0=w*0.5-step*(n-1)/2;
    line(ctx,w*0.04,gy+4,w*0.96,gy+4,COL.mid,1.4);
    for(let i=0;i<n;i++){
      const chosen=sel&&(sel.a===i||sel.b===i)&&sel.age<1.6;
      springTo(off[i],chosen?1:0,45,8,dt);
      const mv=Math.abs(off[i].v); walkPh[i]+=dt*(6+mv*22);
      const col=cols[i]==='m'?COL.blue:COL.red, yy=gy+off[i].x*h*0.07, sc=1+off[i].x*0.12;
      if(chosen) { ctx.save(); ctx.fillStyle=rgba('#d9a017',0.18); ctx.beginPath(); ctx.ellipse(x0+i*step,gy+off[i].x*h*0.07+6,s*0.35,s*0.09,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
      drawPerson(ctx,x0+i*step,yy,s*sc,col,mv>0.04?walkPh[i]:t*1.0*0+0,chosen?clamp((off[i].x-0.5)/0.5,0,1):0,1,cols[i]==='w');
    }
    if(n<2) textAt(ctx,'Need at least 2 people',w*0.5,h*0.2,{align:'center',size:14,weight:700,color:COL.mid});

    // sample space of pairs
    const gx=w*0.04, gw=w*0.92, colW=gw/3, ty=h*0.5;
    const names=['No man','One man','Two men'], ccol=[COL.red,COL.green,COL.blue];
    // build pair list per group
    const groups=[[],[],[]];
    for(let a=0;a<n;a++) for(let b=a+1;b<n;b++) groups[(cols[a]==='m')+(cols[b]==='m')].push([a,b]);
    groups.forEach((G,k)=>{
      const cx=gx+k*colW;
      textAt(ctx,names[k],cx+6,ty-12,{size:12.5,weight:700,color:ccol[k]});
      textAt(ctx,pairs?fracStr(cnt[k],pairs):'—',cx+colW-10,ty-12,{align:'right',size:14,weight:700,color:ccol[k]});
      const tw=Math.min(colW/7.4,34), th=tw*0.62, perRow=6;
      G.forEach((pr,j)=>{
        const x=cx+6+(j%perRow)*(tw+5), y=ty+Math.floor(j/perRow)*(th+5);
        const isSel=sel&&((sel.a===pr[0]&&sel.b===pr[1])||(sel.a===pr[1]&&sel.b===pr[0]));
        const lift=isSel?3+Math.sin(t*7)*1.5:0;
        tileBox(ctx,x,y,tw,th,isSel?COL.yellow:ccol[k],isSel?'#fdf4dc':'#f6f9fc',isSel?3:1.4,lift);
        circ(ctx,x+tw*0.3,y-lift+th/2,th*0.22,cols[pr[0]]==='m'?COL.blue:COL.red,cols[pr[0]]==='m'?COL.blue:COL.red,1);
        circ(ctx,x+tw*0.7,y-lift+th/2,th*0.22,cols[pr[1]]==='m'?COL.blue:COL.red,cols[pr[1]]==='m'?COL.blue:COL.red,1);
      });
    });
    // tally bars (below the grid)
    const by=h*0.88;
    cnt.forEach((c,k)=>{
      const cx=gx+k*colW, bw=colW-18, th=pairs?c/pairs:0, ex=total?tally[k]/total:0;
      bar(ctx,cx+6,by,bw,12,th,ccol[k],'',fmt(th,3)+'  theory');
      if(total){ line(ctx,cx+6+bw*ex,by-6,cx+6+bw*ex,by+18,COL.ink,2.6); }
    });
    textAt(ctx,'bars = theory   ·   black tick = share of '+total+' committees chosen',gx+6,by+34,{size:11.5,weight:600,color:COL.mid});
    $('#p0').textContent=pairs?fracStr(cnt[0],pairs):'—'; $('#p1').textContent=pairs?fracStr(cnt[1],pairs):'—'; $('#p2').textContent=pairs?fracStr(cnt[2],pairs):'—';
    $('#hint').textContent=n>=2?('C('+n+', 2) = '+pairs+' equally likely pairs'):'';
  });
  return wrap;
}

   INIT
   --------------------------------------------------------------------- */
render();
</script>
