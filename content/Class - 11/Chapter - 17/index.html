<html lang="en">
<head>

<title>Grade 11 · Chapter 4 — Chemical Bonding and Molecular Structure | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

<script>
/* =========================================================================
   GRADE 11 — CHAPTER 4: CHEMICAL BONDING AND MOLECULAR STRUCTURE
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn object eases, springs or physically integrates toward
   it every frame. Nothing jumps. Electrons shuttle, ions vibrate, dipoles
   swing in a field, lone pairs push bond pairs apart — all in motion.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab', faint:'#dbe4f0'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.lineCap='round';
  ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width,hs){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,hs||7); }
function dimArrow(ctx,x1,y1,x2,y2,color){ const a=Math.atan2(y2-y1,x2-x1); line(ctx,x1,y1,x2,y2,color,1.6); arrowHead(ctx,x2,y2,a,color,6); arrowHead(ctx,x1,y1,a+Math.PI,color,6); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw,dash){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.setLineDash(dash||[]); ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.stroke();} ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rgba(h,a){ const c=hexRgb(h); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function sgn(x){ return x<0?'−':'+'; }
function sup(n){ const s={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(c=>s[c]||c).join(''); }

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now();
  let raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — natural overshoot and settle. state = {x,v}. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

/* ---------------------------------------------------------------------
   0c. CHAPTER-4 HELPERS — 3D projection, iso-contours, atoms, electrons
   --------------------------------------------------------------------- */
/** rotate (x,y,z) by yaw about y-axis then pitch about x-axis; returns [x,y,z] */
function rot3(x,y,z,yaw,pitch){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  let X=x*cy+z*sy, Z=-x*sy+z*cy, Y=y;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  const Y2=Y*cp-Z*sp, Z2=Y*sp+Z*cp;
  return [X,Y2,Z2];
}
/** Marching-squares line at a given level. F is nx*ny row-major, cell size cs, origin x0,y0. */
function contourPath(ctx,F,nx,ny,x0,y0,cs,lev){
  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    const a=F[j*nx+i]-lev, b=F[j*nx+i+1]-lev, c=F[(j+1)*nx+i+1]-lev, d=F[(j+1)*nx+i]-lev;
    const idx=(a>0?1:0)|(b>0?2:0)|(c>0?4:0)|(d>0?8:0);
    if(idx===0||idx===15) continue;
    const xi=x0+i*cs, yj=y0+j*cs;
    const T=[xi+cs*a/(a-b), yj], R=[xi+cs, yj+cs*b/(b-c)], B=[xi+cs*d/(d-c), yj+cs], L=[xi, yj+cs*a/(a-d)];
    const seg=(p,q)=>{ ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); };
    switch(idx){
      case 1: case 14: seg(L,T); break;
      case 2: case 13: seg(T,R); break;
      case 3: case 12: seg(L,R); break;
      case 4: case 11: seg(R,B); break;
      case 5: seg(L,T); seg(R,B); break;
      case 10: seg(T,R); seg(L,B); break;
      case 6: case 9: seg(T,B); break;
      case 7: case 8: seg(L,B); break;
    }
  }
}
/** Draw a signed field as blue (+) and red (−) iso-lines with a faint fill. */
function drawPhaseField(ctx,F,nx,ny,x0,y0,cs,lev,lw){
  ctx.save();
  // faint fills (cell tint) so lobes read as solid shapes
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const v=F[j*nx+i];
    if(v>lev){ ctx.fillStyle=rgba(COL.blue,0.10+0.10*Math.min(1,v)); ctx.fillRect(x0+i*cs-cs/2,y0+j*cs-cs/2,cs,cs); }
    else if(v<-lev){ ctx.fillStyle=rgba(COL.red,0.10+0.10*Math.min(1,-v)); ctx.fillRect(x0+i*cs-cs/2,y0+j*cs-cs/2,cs,cs); }
  }
  ctx.lineWidth=lw||2; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle=COL.blue; ctx.beginPath(); contourPath(ctx,F,nx,ny,x0,y0,cs,lev); ctx.stroke();
  const G=F.map(v=>-v);
  ctx.strokeStyle=COL.red; ctx.beginPath(); contourPath(ctx,G,nx,ny,x0,y0,cs,lev); ctx.stroke();
  ctx.restore();
}
/** Element look: light tint fill + ink outline */
const ELEM = {H:'#eaf3fd', C:'#eef1f5', N:'#fdf5dc', O:'#fdebe6', F:'#e4f5ea', Cl:'#e4f5ea', Na:'#eaf3fd', Mg:'#eaf3fd', Ca:'#eaf3fd', B:'#fdf5dc', S:'#fdf5dc', Be:'#eaf3fd', P:'#fdf5dc', Xe:'#eef1f5', Br:'#fdebe6', A:'#fdf5dc', X:'#eaf3fd'};
function atomDisc(ctx,x,y,r,sym,opts){
  opts=opts||{};
  circ(ctx,x,y,r,opts.stroke||COL.ink,opts.fill||ELEM[sym]||'#fff',opts.lw||2.2);
  if(sym) textAt(ctx,sym,x,y,{align:'center',baseline:'middle',size:opts.size||Math.max(10,r*0.72),weight:700,color:opts.color||COL.ink});
}
function eDot(ctx,x,y,r,col){ circ(ctx,x,y,r,'#ffffff',col,1.2); }
function badge(ctx,x,y,txt,col,alpha){
  ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha; ctx.font='700 11px Poppins, sans-serif';
  const w=ctx.measureText(txt).width+12; rrect(ctx,x-w/2,y-10,w,20,10); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke();
  ctx.fillStyle=col; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,x,y+0.5); ctx.restore();
}
function caption(ctx,txt,x,y,col){ textAt(ctx,txt,x,y,{size:12,weight:600,color:col||COL.muted}); }

/* =====================================================================
   4.1a  OCTET RULE — ELECTRON TRANSFER vs SHARING  (Kössel–Lewis)
   Ionic: Na → Cl gives Na⁺ + Cl⁻.  Covalent: Cl–Cl shares a pair.
   Each atom's outer ring is drawn with 8 slots (4 sides × 2 dots).
   ===================================================================== */
const A1_SETS = {
  NaCl:{kind:'ion', atoms:[{s:'Na',v:1,d:1},{s:'Cl',v:7}], tr:[[0,1]], name:'NaCl', type:'Ionic (electrovalent)'},
  MgO :{kind:'ion', atoms:[{s:'Mg',v:2,d:1},{s:'O',v:6}], tr:[[0,1],[0,1]], name:'MgO', type:'Ionic (electrovalent)'},
  CaF2:{kind:'ion', atoms:[{s:'F',v:7},{s:'Ca',v:2,d:1},{s:'F',v:7}], tr:[[1,0],[1,2]], name:'CaF₂', type:'Ionic (electrovalent)'},
  Cl2 :{kind:'cov', atoms:[{s:'Cl',v:7},{s:'Cl',v:7}], order:1, name:'Cl₂', type:'Single covalent bond'},
  O2  :{kind:'cov', atoms:[{s:'O',v:6},{s:'O',v:6}], order:2, name:'O₂', type:'Double covalent bond'},
  N2  :{kind:'cov', atoms:[{s:'N',v:5},{s:'N',v:5}], order:3, name:'N₂', type:'Triple covalent bond'}
};
const SIDE_ANG=[0,Math.PI/2,Math.PI,Math.PI*1.5]; // right, bottom, left, top
function slotAng(side,k){ return SIDE_ANG[side]+(k?0.21:-0.21); }
const CHG={Na:'⁺',Mg:'²⁺',Ca:'²⁺',Cl:'⁻',O:'²⁻',F:'⁻'};

function a1Build(key){
  const def=A1_SETS[key], n=def.atoms.length, E=[];
  // which side each atom faces its partner(s)
  const faceR=i=>i<n-1, faceL=i=>i>0;
  if(def.kind==='ion'){
    const used={}; // donor side counters
    const vac={};  // acceptor vacancy counters
    def.atoms.forEach((a,i)=>{ a._vac=[]; });
    def.tr.forEach(([d,a],q)=>{
      const sd=a>d?0:2, sa=a>d?2:0;
      const kd=(used[d+'_'+sd]||0); used[d+'_'+sd]=kd+1;
      const ka=(vac[a+'_'+sa]||0); vac[a+'_'+sa]=ka+1;
      def.atoms[a]._vac.push([sa,ka]);
      E.push({atom:d,from:[sd,kd],mode:'tr',to:a,toSlot:[sa,ka],col:COL.blue,stag:q*0.12});
    });
    // acceptors keep all slots except vacancies
    def.atoms.forEach((a,i)=>{
      if(a.d) return;
      for(let s=0;s<4;s++)for(let k=0;k<2;k++){
        if(a._vac.some(v=>v[0]===s&&v[1]===k)) continue;
        E.push({atom:i,from:[s,k],mode:'stay',col:COL.red});
      }
    });
  } else {
    const k=def.order, lensIdx={};
    def.atoms.forEach((a,i)=>{
      const f=i===0?0:2, opp=i===0?2:0;
      const bond=[[f,0],[f,1],[3,0],[1,0]].slice(0,k);
      const nonb=[[opp,0],[opp,1],[3,0],[3,1],[1,0],[1,1],[f,0],[f,1]].filter(s=>!bond.some(b=>b[0]===s[0]&&b[1]===s[1])).slice(0,a.v-k);
      bond.forEach((s,j)=>E.push({atom:i,from:s,mode:'lens',j,col:i===0?COL.blue:COL.red,stag:j*0.08}));
      nonb.forEach(s=>E.push({atom:i,from:s,mode:'stay',col:i===0?COL.blue:COL.red}));
    });
  }
  return {def,E};
}

function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Compound</label>
      <div class="chip-wrap" id="cB">
        <button class="chip-btn active" data-k="NaCl">NaCl</button><button class="chip-btn" data-k="MgO">MgO</button><button class="chip-btn" data-k="CaF2">CaF₂</button>
        <button class="chip-btn" data-k="Cl2">Cl₂</button><button class="chip-btn" data-k="O2">O₂</button><button class="chip-btn" data-k="N2">N₂</button></div></div>
    <div class="control-group"><label>Bond formation <span class="val" id="pV">0%</span></label>
      <input type="range" id="pR" min="0" max="100" step="1" value="0">
      <div class="toggle-group"><button class="toggle-btn play" id="goB">Form bond</button><button class="toggle-btn" id="rsB">Reset</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard wide"><div class="rlabel">Bond</div><div class="rval" id="tV" style="color:var(--f-blue)">—</div></div>
      <div class="rcard"><div class="rlabel" id="eL">e⁻ moved</div><div class="rval" id="eV">0</div></div>
      <div class="rcard"><div class="rlabel">Octets</div><div class="rval" id="oV">—</div></div></div>
      <p class="hint">Blue = metal / first atom's electrons · Red = non-metal's. Count of 8 turns green.</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), pR=$('#pR');
  let key='NaCl', M=a1Build(key), P=0, T=0, t=0;
  const SP={x:3,v:0};
  function setKey(k){ key=k; M=a1Build(k); P=0; T=0; pR.value=0; SP.x=3; SP.v=0; }
  toggleWire(wrap.querySelectorAll('#cB button'),b=>setKey(b.dataset.k));
  pR.oninput=()=>{ T=pR.value/100; };
  $('#goB').onclick=()=>{ T=1; pR.value=100; };
  $('#rsB').onclick=()=>{ T=0; pR.value=0; };

  animLoop((dt)=>{
    t+=dt; P=approach(P,T,2.6,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const def=M.def, n=def.atoms.length, ion=def.kind==='ion';
    const R=clamp(Math.min(h*0.24,w/(n*2.9+1.2)),34,84), cy=h*0.46;
    const farS=3.05*R, nearS=ion?1.82*R:1.48*R;
    const approachT = ion? smooth01(0.55,1,P) : smooth01(0,0.55,P);
    const targetS=lerp(farS,nearS,approachT);
    springTo(SP,targetS/R,48,8,dt); const S=SP.x*R;
    const cx=w/2, X=i=>cx+(i-(n-1)/2)*S, mid=cx;
    // ring radius per atom (donors shrink once they have given electrons)
    const donEs=i=>M.E.filter(e=>e.atom===i&&e.mode==='tr');
    const ringR=def.atoms.map((a,i)=>{ if(!a.d) return R; const f=donEs(i).reduce((s,e)=>s+smooth01(0.0+e.stag,0.55+e.stag,P),0)/donEs(i).length; return R*lerp(1,0.62,f); });
    // ------ rings + nuclei
    def.atoms.forEach((a,i)=>{
      const x=X(i);
      circ(ctx,x,cy,ringR[i],a.d&&ringR[i]<R*0.98?COL.blue:COL.mid,a.d&&ringR[i]<R*0.7?rgba(COL.blue,0.07):null,1.6,[5,5]);
      atomDisc(ctx,x,cy,R*0.34,a.s,{size:R*0.3});
    });
    // ------ electrons
    const own=def.atoms.map(()=>0), gone=def.atoms.map(()=>0), recv=def.atoms.map(()=>0);
    let lensDone=0;
    const slotXY=(i,s,k,rr)=>[X(i)+Math.cos(slotAng(s,k))*rr, cy+Math.sin(slotAng(s,k))*rr];
    M.E.forEach((e,idx)=>{
      const rr=ringR[e.atom];
      let p;
      const bob=Math.sin(t*3+idx*1.7)*1.6;
      if(e.mode==='stay'){ own[e.atom]++; p=slotXY(e.atom,e.from[0],e.from[1],R); p=[p[0]+bob*0.4,p[1]+bob]; }
      else if(e.mode==='tr'){
        const u=smooth01(e.stag,0.55+e.stag,P);
        const a=slotXY(e.atom,e.from[0],e.from[1],R), b=slotXY(e.to,e.toSlot[0],e.toSlot[1],R);
        const lift=Math.sin(Math.PI*u)*R*0.55;
        p=[lerp(a[0],b[0],u), lerp(a[1],b[1],u)-lift+bob*(1-u)];
        if(u<0.995) own[e.atom]++; else { gone[e.atom]++; recv[e.to]++; }
        if(u>0.02&&u<0.98){ circ(ctx,lerp(a[0],b[0],u-0.08),lerp(a[1],b[1],u-0.08)-Math.sin(Math.PI*(u-0.08))*R*0.55,3,null,rgba(e.col,0.25),0); }
      } else {
        const u=smooth01(0.4+(e.stag||0),1,P);
        const a=slotXY(e.atom,e.from[0],e.from[1],R);
        const k=def.order, side=e.atom===0?-1:1;
        const dest=[mid+side*0.1*R+Math.cos(t*2.6+idx)*3, cy+(e.j-(k-1)/2)*0.42*R+Math.sin(t*3.1+idx*2)*3.4];
        const lift=Math.sin(Math.PI*u)*R*0.2;
        p=[lerp(a[0],dest[0],u), lerp(a[1],dest[1],u)-lift];
        if(u<0.995) own[e.atom]++; else lensDone++;
      }
      eDot(ctx,p[0],p[1],4.6,e.col);
    });
    // ------ ions attract / shared pair labels
    const done=smooth01(0.9,1,P);
    if(ion){
      def.atoms.forEach((a,i)=>{
        const x=X(i), isDon=!!a.d;
        const cnt = isDon ? (gone[i]===donEs(i).length?8:own[i]) : own[i]+recv[i];
        a._cnt=cnt;
        const ok=cnt===8;
        badge(ctx,x,cy+R+26,cnt+' e⁻ '+(ok?'✓':''),ok?COL.green:COL.red);
        const chg=(isDon?gone[i]===donEs(i).length:recv[i]>0&&recv[i]===(a._vac.length))?1:0;
        if(chg) textAt(ctx,a.s+CHG[a.s],x,cy-R-12,{align:'center',size:15,weight:700,color:isDon?COL.blue:COL.red,alpha:1});
        else textAt(ctx,a.s,x,cy-R-12,{align:'center',size:15,weight:700,color:COL.muted});
      });
      if(done>0.2){
        const yy=cy+R+40, la=(def.tr.length>1&&key==='CaF2')?[[0,1],[1,2]]:[[0,1]];
        la.forEach(([i,j])=>{ const xa=X(i)+(i<j?1:-1)*R*0.3, xb=X(j)-(i<j?1:-1)*R*0.3; vec(ctx,xa,yy,xb,yy,COL.green,2,6); vec(ctx,xb,yy,xa,yy,COL.green,2,6); });
        textAt(ctx,'electrostatic attraction',cx,cy+R+60,{align:'center',size:12,weight:600,color:COL.green,alpha:done});
      }
    } else {
      def.atoms.forEach((a,i)=>{
        const x=X(i), cnt=own[i]+(lensDone>=def.order*2?def.order*2:0);
        const ok=cnt===8; badge(ctx,x,cy+R+26,cnt+' e⁻ '+(ok?'✓':''),ok?COL.green:COL.red);
        textAt(ctx,a.s,x,cy-R-12,{align:'center',size:15,weight:700,color:COL.muted});
      });
      if(done>0.3) textAt(ctx,'shared pair'+(def.order>1?'s':'')+' counted by both atoms',cx,cy+R+60,{align:'center',size:12,weight:600,color:COL.blue,alpha:done});
      // bond sign
      if(done>0.3){ const lbl=def.atoms[0].s+({1:'–',2:'=',3:'≡'}[def.order])+def.atoms[1].s; textAt(ctx,lbl,cx,cy-R-42,{align:'center',size:18,weight:700,color:COL.ink,alpha:done}); }
    }
    // ------ readouts
    $('#pV').textContent=Math.round(P*100)+'%';
    $('#tV').textContent=def.type;
    if(ion){ $('#eL').textContent='e⁻ transferred'; $('#eV').textContent=def.tr.length+(P>0.55?' ✓':''); }
    else { $('#eL').textContent='e⁻ shared'; $('#eV').textContent=(def.order*2)+' ('+def.order+' pair'+(def.order>1?'s':'')+')'; }
    const allOk=def.atoms.every(a=>ion?(a._cnt===8):true);
    $('#oV').textContent=ion?(allOk?'8 / 8 ✓':'incomplete'):(P>0.97?'8 / 8 ✓':'incomplete');
    $('#oV').style.color=(ion?allOk:P>0.97)?'var(--f-green)':'var(--f-red)';
  });
  return wrap;
}

/* =====================================================================
   4.1b  LEWIS STRUCTURE BUILDER + FORMAL CHARGE
   Textbook steps: count valence e⁻ → skeleton → single bonds → octets on
   terminal atoms → remaining pairs → multiple bonds.
   Formal charge = V − L − ½B   (V valence e⁻, L lone-pair e⁻, B bonding e⁻)
   Checked against Problem 4.1 (CO) and 4.2 (NO₂⁻).
   ===================================================================== */
const LEW = {
  H2O:{f:'H₂O', ch:0, atoms:[['O',0,-0.25,6],['H',-1.2,0.8,1],['H',1.2,0.8,1]], bonds:[[0,1],[0,2]], lp3:{}, lp4:{0:2}, conv:[]},
  NH3:{f:'NH₃', ch:0, atoms:[['N',0,-0.35,5],['H',-1.3,0.6,1],['H',1.3,0.6,1],['H',0,1.3,1]], bonds:[[0,1],[0,2],[0,3]], lp3:{}, lp4:{0:1}, conv:[]},
  CO2:{f:'CO₂', ch:0, atoms:[['O',-2.1,0,6],['C',0,0,4],['O',2.1,0,6]], bonds:[[1,0],[1,2]], lp3:{0:3,2:3}, lp4:{}, conv:[[0,1],[2,1]]},
  CO :{f:'CO',  ch:0, atoms:[['C',-1.2,0,4],['O',1.2,0,6]], bonds:[[0,1]], lp3:{1:3}, lp4:{0:1}, conv:[[1,0],[1,0]]},
  NO2:{f:'NO₂⁻',ch:-1,atoms:[['O',-1.8,0.7,6],['N',0,-0.35,5],['O',1.8,0.7,6]], bonds:[[1,0],[1,2]], lp3:{0:3,2:3}, lp4:{1:1}, conv:[[0,1]]},
  O3 :{f:'O₃',  ch:0, atoms:[['O',-1.8,0.7,6],['O',0,-0.35,6],['O',1.8,0.7,6]], bonds:[[1,0],[1,2]], lp3:{0:3,2:3}, lp4:{1:1}, conv:[[0,1]]}
};
const STEP_NAMES=['Count valence electrons','Draw the skeleton','Single bonds (shared pairs)','Octets on terminal atoms','Remaining pairs on central atom','Multiple bonds → octet for all'];

/** Turn a LEW definition into pair objects with keyframes + formal charges. */
function lewCompile(def){
  const A=def.atoms.map(a=>({s:a[0],x:a[1],y:a[2],V:a[3],lp:0,B:0}));
  const pairs=[];
  const bondN={}; def.bonds.forEach(b=>{ bondN[b.join('-')]=1; });
  def.conv.forEach(c=>{ const k=def.bonds.find(b=>(b[0]===c[0]&&b[1]===c[1])||(b[0]===c[1]&&b[1]===c[0])).join('-'); bondN[k]++; });
  // lone-pair directions (greedy, maximise separation from bonds and each other)
  const dirsBlocked=A.map(()=>[]);
  def.bonds.forEach(([i,j])=>{ const a=Math.atan2(A[j].y-A[i].y,A[j].x-A[i].x); dirsBlocked[i].push(a); dirsBlocked[j].push(a+Math.PI); });
  const lpAng=A.map(()=>[]);
  A.forEach((a,i)=>{
    const L=(def.lp3[i]||0)+(def.lp4[i]||0);
    for(let q=0;q<L;q++){
      let best=0,bs=-1;
      for(let c=0;c<24;c++){ const ang=c/24*Math.PI*2; let m=9; dirsBlocked[i].concat(lpAng[i]).forEach(b=>{ m=Math.min(m,Math.abs(angDiff(ang,b))); }); if(m>bs+1e-6){bs=m;best=ang;} }
      lpAng[i].push(best);
    }
  });
  const lpPos=(i,ang)=>({x:A[i].x+Math.cos(ang)*0.82, y:A[i].y+Math.sin(ang)*0.82, rot:ang+Math.PI/2});
  const bpPos=(i,j,m,n)=>{
    const dx=A[j].x-A[i].x, dy=A[j].y-A[i].y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, off=(m-(n-1)/2)*0.34;
    return {x:(A[i].x+A[j].x)/2-uy*off, y:(A[i].y+A[j].y)/2+ux*off, rot:Math.atan2(dy,dx), len:L, i, j};
  };
  def.bonds.forEach(([i,j])=>{ const N=bondN[i+'-'+j]; pairs.push({kind:'bp',kf:[[2,bpPos(i,j,0,1)],[5,bpPos(i,j,0,N)]], i, j}); });
  const used={};
  A.forEach((a,i)=>{
    let q=0;
    [[def.lp3[i]||0,3],[def.lp4[i]||0,4]].forEach(([cnt,st])=>{
      for(let c=0;c<cnt;c++){ pairs.push({kind:'lp',kf:[[st,lpPos(i,lpAng[i][q])]],atom:i,ang:lpAng[i][q],q}); q++; }
    });
  });
  // conversions: lone pair on atom a slides into a bond a–b
  const cnt={};
  def.conv.forEach(([a,b])=>{
    const bond=def.bonds.find(x=>(x[0]===a&&x[1]===b)||(x[0]===b&&x[1]===a)), key=bond.join('-');
    cnt[key]=(cnt[key]||0)+1; const N=bondN[key];
    const dirAB=Math.atan2(A[b].y-A[a].y,A[b].x-A[a].x);
    // nearest remaining lone pair of atom a (not already converted)
    let best=null,bd=9;
    pairs.forEach(p=>{ if(p.kind==='lp'&&p.atom===a&&!p.conv){ const d=Math.abs(angDiff(p.ang,dirAB)); if(d<bd){bd=d;best=p;} } });
    best.conv=true; best.kf.push([5,bpPos(bond[0],bond[1],cnt[key],N)]);
    // tell geometry of the converted pair's final orientation
    A[a].lp-=0;
  });
  // final formal-charge bookkeeping
  pairs.forEach(p=>{
    const last=p.kf[p.kf.length-1];
    if(p.kind==='bp'||p.conv){ const bi=p.kind==='bp'?[p.i,p.j]:[last[1].i,last[1].j]; A[bi[0]].B++; A[bi[1]].B++; }
    else A[p.atom].lp++;
  });
  A.forEach(a=>{ a.fc=a.V-2*a.lp-a.B; });
  return {A,pairs,tot:A.reduce((s,a)=>s+a.V,0)-def.ch};
}

function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Molecule / ion</label>
      <div class="chip-wrap" id="mB"><button class="chip-btn active" data-k="H2O">H₂O</button><button class="chip-btn" data-k="NH3">NH₃</button><button class="chip-btn" data-k="CO2">CO₂</button>
      <button class="chip-btn" data-k="CO">CO</button><button class="chip-btn" data-k="NO2">NO₂⁻</button><button class="chip-btn" data-k="O3">O₃</button></div></div>
    <div class="control-group"><label>Step <span class="val" id="sV">0</span></label><input type="range" id="sR" min="0" max="5" step="1" value="0">
      <div class="hint" id="sT" style="font-weight:600;color:var(--text-1)"></div>
      <div class="toggle-group"><button class="toggle-btn play" id="nxB">Next step ▸</button><button class="toggle-btn" id="rsB">Reset</button></div></div>
    <div class="control-group"><label style="margin-bottom:6px;">Show bonds as</label>
      <div class="toggle-group" id="dB"><button class="toggle-btn active" data-m="0">Electron pairs</button><button class="toggle-btn" data-m="1">Lines</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Valence e⁻</div><div class="rval" id="tV">—</div></div>
      <div class="rcard"><div class="rlabel">Pairs placed</div><div class="rval" id="pV">—</div></div>
      <div class="rcard wide"><div class="rlabel">Formal charge = V − L − ½B</div><div id="fcR" style="font-size:var(--fs-sm);font-weight:600;line-height:1.55"></div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), sR=$('#sR');
  let key='H2O', M, step=0, T=0, mode=0, mA=0, t=0;
  const rotAng=(a,b,u)=>a+angDiff(b,a)*u;
  function load(k){
    key=k; M=lewCompile(LEW[k]); step=0; T=0; sR.value=0;
    $('#tV').textContent=M.tot+' e⁻';
    $('#fcR').innerHTML=M.A.map(a=>`<span style="display:flex;justify-content:space-between"><span>${a.s}</span><span>${a.V} − ${2*a.lp} − ${a.B} = <b style="color:${a.fc===0?'var(--f-green)':a.fc<0?'var(--f-red)':'var(--f-blue)'}">${a.fc>0?'+':a.fc<0?'−':''}${Math.abs(a.fc)}</b></span></span>`).join('');
    const sum=M.A.reduce((s,a)=>s+a.fc,0); if(sum!==LEW[k].ch) console.warn('formal charge sum mismatch',k,sum);
    if(M.pairs.length*2!==M.tot) console.warn('electron count mismatch',k,M.pairs.length*2,M.tot);
  }
  load('H2O');
  toggleWire(wrap.querySelectorAll('#mB button'),b=>load(b.dataset.k));
  toggleWire(wrap.querySelectorAll('#dB button'),b=>{ mode=+b.dataset.m; });
  sR.oninput=()=>{ T=+sR.value; };
  $('#nxB').onclick=()=>{ T=Math.min(5,Math.round(T)+1); sR.value=T; };
  $('#rsB').onclick=()=>{ T=0; sR.value=0; };

  animLoop((dt)=>{
    t+=dt; step=approach(step,T,3.4,dt); mA=approach(mA,mode,6,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const u=clamp(Math.min(h*0.17,w*0.085),30,72), cx=w/2, cy=h*0.6;
    const X=x=>cx+x*u, Y=y=>cy+y*u;
    // tray of electron pairs
    const nP=M.pairs.length;
    const trayPos=i=>({x:(w*0.5-(nP-1)*0.3*u/1)/u*0+ (w*0.5+(i-(nP-1)/2)*0.58*u), y:h*0.1, rot:0});
    textAt(ctx,'Electron-pair pool',w*0.5,h*0.1-24,{align:'center',size:11,weight:600,color:COL.mid});
    rrect(ctx,w*0.5-(nP*0.58*u)/2-12,h*0.1-18,nP*0.58*u+24,36,10); ctx.strokeStyle=COL.faint; ctx.lineWidth=1.4; ctx.stroke();
    // bonds as lines (behind)
    // atoms
    const aAlpha=smooth01(0.5,1,step);
    M.A.forEach((a,i)=>{
      ctx.save(); ctx.globalAlpha=aAlpha; atomDisc(ctx,X(a.x),Y(a.y),u*0.42,a.s,{size:u*0.42}); ctx.restore();
    });
    // pairs
    M.pairs.forEach((p,idx)=>{
      const first=p.kf[0][0];
      const tp=trayPos(idx);
      let pos;
      if(step<=first-1) pos={x:(tp.x-cx)/u,y:(tp.y-cy)/u,rot:0,tray:1};
      else if(step<first){ const f=smooth01(first-1,first,step), k=p.kf[0][1]; pos={x:lerp((tp.x-cx)/u,k.x,f),y:lerp((tp.y-cy)/u,k.y,f)-Math.sin(Math.PI*f)*0.8,rot:rotAng(0,k.rot,f)}; }
      else {
        pos=p.kf[0][1];
        for(let q=1;q<p.kf.length;q++){ const a=p.kf[q-1], b=p.kf[q], f=smooth01(a[0],b[0],step); if(step>=a[0]){ pos={x:lerp(a[1].x,b[1].x,f),y:lerp(a[1].y,b[1].y,f)-Math.sin(Math.PI*f)*0.25,rot:rotAng(a[1].rot,b[1].rot,f),len:b[1].len}; } }
      }
      const px=X(pos.x), py=Y(pos.y), col=(p.kind==='bp'||(p.conv&&step>4.5))?COL.blue:COL.red;
      const isBond=(p.kind==='bp'||(p.conv&&step>4.55))&&!pos.tray;
      const cr=Math.cos(pos.rot), sr=Math.sin(pos.rot);
      const jig=pos.tray?Math.sin(t*3+idx)*1.5:Math.sin(t*5+idx*1.3)*0.8;
      if(isBond&&mA>0.02){
        const L=(pos.len||1.8)*u*0.5-u*0.5;
        ctx.save(); ctx.globalAlpha=mA; line(ctx,px-cr*L,py-sr*L,px+cr*L,py+sr*L,COL.blue,3.4); ctx.restore();
      }
      ctx.save(); ctx.globalAlpha=(isBond?1-mA:1);
      const d=isBond?0.17*u:0.1*u; // dot separation: along bond, or across lone-pair direction
      eDot(ctx,px-cr*d,py-sr*d+jig,4.6,col); eDot(ctx,px+cr*d,py+sr*d+jig,4.6,col);
      ctx.restore();
    });
    // formal charges
    const fa=smooth01(4.4,5,step);
    if(fa>0.01) M.A.forEach(a=>{
      const txt=a.fc===0?'0':(a.fc>0?'+':'−')+Math.abs(a.fc);
      badge(ctx,X(a.x)+u*0.62,Y(a.y)-u*0.62,txt,a.fc===0?COL.green:a.fc<0?COL.red:COL.blue,fa);
    });
    if(LEW[key].ch!==0&&step>=1) textAt(ctx,'['+LEW[key].f+']',cx,h-14,{align:'center',size:15,weight:700,color:COL.ink});
    else textAt(ctx,LEW[key].f,cx,h-14,{align:'center',size:15,weight:700,color:COL.ink});
    // readouts
    const placed=M.pairs.filter(p=>step>=p.kf[0][0]).length;
    $('#sV').textContent=Math.round(T); $('#sT').textContent=STEP_NAMES[Math.round(T)];
    $('#pV').textContent=placed+' / '+nP;
  });
  return wrap;
}

/* =====================================================================
   4.2  IONIC BOND — LATTICE ENTHALPY OF NaCl
   Textbook numbers (kJ mol⁻¹):  Na(g)→Na⁺(g)+e⁻   ΔᵢH = +495.8
                                 Cl(g)+e⁻→Cl⁻(g)    ΔegH = −348.7
                                 sum = +147.1  →  lattice formation −788
                                 net: 495.8 − 348.7 − 788 = −640.9
   Each ion is a damped Langevin oscillator on its lattice site; heat E
   raises the noise, and at E = 788 the springs let go (sublimation).
   ===================================================================== */
const NACL={IE:495.8, EGE:-348.7, LAT:788};
NACL.ions=NACL.IE+NACL.EGE;            // +147.1
NACL.net=NACL.ions-NACL.LAT;           // −640.9

function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Mode</label>
      <div class="toggle-group" id="mB"><button class="toggle-btn active" data-m="break">Break the crystal</button><button class="toggle-btn" data-m="build">Build the crystal</button></div></div>
    <div class="control-group" id="gBreak"><label>Energy supplied <span class="val" id="eV"></span></label>
      <input type="range" id="eR" min="0" max="900" step="1" value="0">
      <p class="hint">Lattice enthalpy of NaCl = 788 kJ mol⁻¹: the energy to pull 1 mol of crystal into gaseous ions.</p></div>
    <div class="control-group hidden" id="gBuild"><label>Step <span class="val" id="sV">0</span></label>
      <input type="range" id="sR" min="0" max="3" step="1" value="0">
      <div class="hint" id="sT" style="font-weight:600;color:var(--text-1)"></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">State</div><div class="rval" id="stV">Crystal</div></div>
      <div class="rcard"><div class="rlabel">Level (kJ/mol)</div><div class="rval" id="lvV" style="color:var(--f-red)"></div></div>
      <div class="rcard wide"><div class="rlabel">Net energy released on forming NaCl(s)</div><div class="rval" style="color:var(--f-green)">+495.8 − 348.7 − 788 = −640.9 kJ/mol</div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), eR=$('#eR'), sR=$('#sR');
  let mode='break', t=0, yaw=0.5, Et=0, Eeff=0, step=0, stepT=0;
  const N=4, ions=[];
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)for(let k=0;k<N;k++){
    const x=i-1.5, y=j-1.5, z=k-1.5, par=(i+j+k)%2;
    ions.push({r0:[x,y,z], d:[0,0,0], v:[0,0,0], cat:par===0, depth:Math.hypot(x,y,z)/2.6, free:false});
  }
  const ball={x:0,v:0}, lvl=NACL.net;
  ball.x=NACL.net;
  const stepText=['Na(g) and Cl(g): separate neutral atoms','Na → Na⁺ + e⁻   (+495.8, energy absorbed)','Cl + e⁻ → Cl⁻   (−348.7, energy released)','Ions pack into a lattice   (−788, energy released)'];
  toggleWire(wrap.querySelectorAll('#mB button'),b=>{ mode=b.dataset.m; $('#gBreak').classList.toggle('hidden',mode!=='break'); $('#gBuild').classList.toggle('hidden',mode!=='build'); });
  eR.oninput=()=>{ Et=+eR.value; };
  sR.oninput=()=>{ stepT=+sR.value; };

  animLoop((dt)=>{
    t+=dt; yaw+=dt*0.38; step=approach(step,stepT,4,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // effective energy driving the crystal
    const Etarget = mode==='break' ? Et : (stepT>=3?0:900);
    Eeff=approach(Eeff,Etarget,3,dt);
    const f=Eeff/NACL.LAT;
    const Tn = 0.03 + 1.5*Math.min(f,1)*Math.min(f,1) + (f>1?(f-1)*18:0);
    const sub=3, h2=dt/sub;
    ions.forEach(io=>{
      const thr=0.985+0.015*io.depth; const wantFree = f>=thr;
      if(wantFree&&!io.free){ io.free=true; for(let q=0;q<3;q++) io.v[q]+=gauss()*2.4; }
      if(!wantFree&&io.free&&f<thr-0.02){ io.free=false; }
      const k=io.free?0:46, g=io.free?0.04:3.2, s=Math.sqrt(2*g*Tn);
      for(let n=0;n<sub;n++)for(let q=0;q<3;q++){
        const a=-k*io.d[q]-g*io.v[q];
        io.v[q]+=a*h2+(io.free?0:s*Math.sqrt(h2)*gauss());
        io.d[q]+=io.v[q]*h2;
        const p=io.r0[q]+io.d[q];
        if(Math.abs(p)>4.4){ io.d[q]=Math.sign(p)*4.4-io.r0[q]; io.v[q]*=-0.9; }
      }
    });
    // ---- layout: crystal left (58%), energy ladder right
    const cw=w*0.58, cx=cw*0.5, cy=h*0.5, a=Math.min(cw/7.4,h/6.4);
    const pr=[]; ions.forEach(io=>{
      const x=io.r0[0]+io.d[0], y=io.r0[1]+io.d[1], z=io.r0[2]+io.d[2];
      const p=rot3(x,y,z,yaw,0.5), sc=1/(1-p[2]*0.045);
      pr.push({X:cx+p[0]*a*sc, Y:cy+p[1]*a*sc, Z:p[2], sc, io});
    });
    // bonds (nearest-neighbour lattice lines)
    const idx=(i,j,k)=>(i*N+j)*N+k;
    ctx.save(); ctx.lineWidth=1.8;
    for(let i=0;i<N;i++)for(let j=0;j<N;j++)for(let k=0;k<N;k++){
      const A=pr[idx(i,j,k)];
      [[1,0,0],[0,1,0],[0,0,1]].forEach(([di,dj,dk])=>{
        const ii=i+di,jj=j+dj,kk=k+dk; if(ii>=N||jj>=N||kk>=N) return;
        const B=pr[idx(ii,jj,kk)]; const al=(A.io.free||B.io.free)?0:0.8;
        if(al>0){ ctx.strokeStyle=rgba(COL.mid,al*0.9); ctx.beginPath(); ctx.moveTo(A.X,A.Y); ctx.lineTo(B.X,B.Y); ctx.stroke(); }
      });
    }
    ctx.restore();
    pr.sort((p,q)=>p.Z-q.Z);
    const stage = mode==='build'?step:3;
    pr.forEach(p=>{
      const io=p.io, rr=(io.cat?0.15:0.23)*a*p.sc;
      let col, fill;
      if(io.cat){ const on=stage>=0.9; col=on?COL.blue:COL.mid; fill=on?'#e6f1fc':'#f3f6fa'; }
      else { const on=stage>=1.9; col=on?COL.red:COL.mid; fill=on?'#fdece7':'#f3f6fa'; }
      circ(ctx,p.X,p.Y,rr,col,fill,1.8);
      if(rr>7) textAt(ctx,io.cat?(stage>=0.9?'+':'Na'):(stage>=1.9?'−':'Cl'),p.X,p.Y,{align:'center',baseline:'middle',size:Math.max(8,rr*(stage>=1?1.1:0.8)),weight:700,color:col});
    });
    // freed electron(s) when Na ionises (build step 1)
    if(mode==='build'&&step>0.7&&step<2.2){
      for(let q=0;q<6;q++){ const u=(t*0.6+q/6)%1; const ex=cx+Math.cos(q*1.9)*a*(1.6+u*2.2), ey=cy-a*(0.8+u*2.4)+Math.sin(q*2.7)*a*0.4; circ(ctx,ex,ey,3.6,'#fff',COL.yellow,1.2); }
    }
    textAt(ctx,'Rock-salt lattice',cx,h-16,{align:'center',size:12,weight:600,color:COL.muted});
    // ---- energy ladder
    const lx0=cw+14, lx1=w-18, top=h*0.1, bot=h*0.9;
    const Emax=640, Emin=-780, Y=e=>lerp(bot,top,(e-Emin)/(Emax-Emin));
    line(ctx,lx0+28,Y(Emin+60),lx0+28,Y(Emax-40),COL.mid,1.4); arrowHead(ctx,lx0+28,Y(Emax-40),-Math.PI/2,COL.mid,6);
    textAt(ctx,'Energy',lx0+8,top-6,{size:11,weight:700,color:COL.muted});
    const lv=[[0,'Na(g) + Cl(g)','0',COL.ink],[NACL.ions,'Na⁺(g) + Cl⁻(g)','+147.1',COL.ink],[NACL.net,'NaCl(s)','−640.9',COL.ink]];
    lv.forEach(([e,lab,val])=>{ line(ctx,lx0+28,Y(e),lx1,Y(e),COL.ink,2.2); textAt(ctx,lab,lx1,Y(e)-6,{align:'right',size:12,weight:700,color:COL.ink}); textAt(ctx,val,lx0+34,Y(e)-6,{size:11,weight:700,color:COL.muted}); });
    const arrAlpha = mode==='build'?[smooth01(0.3,1,step),smooth01(1.3,2,step),smooth01(2.3,3,step)]:[1,1,1];
    const ax=[lx0+70,lx0+110,lx0+150].map(x=>Math.min(x,lx1-30));
    ctx.save(); ctx.globalAlpha=arrAlpha[0]; vec(ctx,ax[0],Y(0),ax[0],Y(NACL.IE),COL.red,2.8); textAt(ctx,'+495.8',ax[0]-6,Y(NACL.IE*0.5),{align:'right',size:11,weight:700,color:COL.red}); ctx.restore();
    ctx.save(); ctx.globalAlpha=arrAlpha[1]; vec(ctx,ax[1],Y(NACL.IE),ax[1],Y(NACL.ions),COL.green,2.8); textAt(ctx,'−348.7',ax[1]-6,Y((NACL.IE+NACL.ions)/2),{align:'right',size:11,weight:700,color:COL.green}); ctx.restore();
    ctx.save(); ctx.globalAlpha=arrAlpha[2]; vec(ctx,ax[2],Y(NACL.ions),ax[2],Y(NACL.net),COL.blue,3.2); textAt(ctx,'−788',ax[2]-6,Y((NACL.ions+NACL.net)/2),{align:'right',size:12,weight:700,color:COL.blue}); ctx.restore();
    textAt(ctx,'lattice enthalpy',ax[2]-6,Y((NACL.ions+NACL.net)/2)+14,{align:'right',size:10,weight:600,color:COL.blue,alpha:arrAlpha[2]});
    // marker ball (spring-damped)
    let target;
    if(mode==='break') target=NACL.net+Et;
    else target=[0,NACL.IE,NACL.ions,NACL.net][Math.round(stepT)];
    springTo(ball,target,34,5.5,dt);
    const bx=lx0+28; circ(ctx,bx,Y(ball.x),9,COL.yellow,'#fff6d6',2.6);
    if(mode==='break'){ line(ctx,bx,Y(NACL.net),bx,Y(ball.x),COL.yellow,3); }
    // ---- readouts
    $('#eV').textContent=fmt(Et,0)+' kJ/mol';
    const free=ions.filter(i=>i.free).length;
    $('#stV').textContent = mode==='build'?(stepT>=3?'Crystal':stepT>=1?'Ions (gas)':'Atoms (gas)') : (free>ions.length*0.9?'Gaseous ions':free>0?'Subliming…':f>0.75?'Melting-hot':'Crystal');
    $('#lvV').textContent=fmt(ball.x,1);
    $('#sV').textContent=Math.round(stepT); $('#sT').textContent=stepText[Math.round(stepT)];
  });
  return wrap;
}

/* =====================================================================
   4.3a  BOND LENGTH AND BOND ENTHALPY — the potential-energy well
   Morse potential  U(r) = D[(1 − e^{−a(r−re)})² − 1]   (zero = separated atoms)
   re and D are the textbook values (H–H 74 pm, 435.8 kJ/mol; O=O 121, 498;
   N≡N 109, 946; H–Cl 127, 431.0). a = ω√(μ/2D) from the spectroscopic ωe,
   and the atoms move by Newton's law  μ r'' = −dU/dr  (units: amu·pm²/fs² = kJ/mol).
   Time is slowed ~14 fs per second so the vibration is watchable.
   ===================================================================== */
const MORSE={
  HH :{lab:'H–H', a:'H',b:'H', m:[1.008,1.008], re:74,  D:435.8, wn:4401, rc:[37,37],  vdw:[120,120], bo:1, ord:'single'},
  ClCl:{lab:'Cl–Cl',a:'Cl',b:'Cl',m:[35.45,35.45],re:199, D:242,   wn:560,  rc:[99,99],  vdw:[180,180], bo:1, ord:'single'},
  OO :{lab:'O=O', a:'O',b:'O', m:[15.999,15.999],re:121, D:498,   wn:1580, rc:[66,66],  vdw:[152,152], bo:2, ord:'double'},
  NN :{lab:'N≡N', a:'N',b:'N', m:[14.007,14.007],re:109, D:946,   wn:2359, rc:[74,74],  vdw:[155,155], bo:3, ord:'triple'},
  HCl:{lab:'H–Cl',a:'H',b:'Cl', m:[1.008,35.45], re:127, D:431.0, wn:2991, rc:[37,99],  vdw:[120,180], bo:1, ord:'single'}
};
Object.values(MORSE).forEach(s=>{
  s.mu=s.m[0]*s.m[1]/(s.m[0]+s.m[1]);
  const om=2*Math.PI*2.99792458e-5*s.wn;            // rad/fs
  s.al=om*Math.sqrt(s.mu/(2*s.D));                   // pm⁻¹
  s.T=2*Math.PI/om;                                  // fs (real period)
});
function morseU(s,r){ const e=Math.exp(-s.al*(r-s.re)); return s.D*((1-e)*(1-e)-1); }
function morseF(s,r){ const e=Math.exp(-s.al*(r-s.re)); return -2*s.D*s.al*(1-e)*e; }   // −dU/dr (kJ/mol/pm)

function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Bond</label>
      <div class="chip-wrap" id="bB"><button class="chip-btn active" data-k="HH">H–H</button><button class="chip-btn" data-k="ClCl">Cl–Cl</button><button class="chip-btn" data-k="OO">O=O</button><button class="chip-btn" data-k="NN">N≡N</button><button class="chip-btn" data-k="HCl">H–Cl</button></div></div>
    <div class="control-group"><label>Hold the atoms at <span class="val" id="rV"></span></label>
      <input type="range" id="rR" min="40" max="460" step="1" value="74">
      <div class="toggle-group"><button class="toggle-btn play" id="reB">Release</button><button class="toggle-btn" id="rsB">Hold at re</button></div></div>
    <div class="control-group"><label>Energy given <span class="val" id="kV"></span></label>
      <input type="range" id="kR" min="0" max="1000" step="1" value="200">
      <button class="toggle-btn navy" id="hitB">Hit the bond</button></div>
    <div class="control-group"><label style="margin-bottom:4px;">Radii</label>
      <div class="toggle-group" id="vB"><button class="toggle-btn active" data-v="0">Covalent</button><button class="toggle-btn" data-v="1">+ van der Waals</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Bond length re</div><div class="rval" id="reV" style="color:var(--f-green)"></div></div>
      <div class="rcard"><div class="rlabel">Bond enthalpy</div><div class="rval" id="dV" style="color:var(--f-blue)"></div></div>
      <div class="rcard"><div class="rlabel">Separation r</div><div class="rval" id="rrV"></div></div>
      <div class="rcard"><div class="rlabel">Bond order</div><div class="rval" id="boV"></div></div></div>
      <p class="hint" id="msg">Higher bond order → shorter bond, larger enthalpy.</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), rR=$('#rR'), kR=$('#kR');
  let key='HH', S=MORSE[key], r=S.re, v=0, mode='hold', target=S.re, vdw=0, t=0, Eblink=0;
  function setKey(k){ key=k; S=MORSE[k]; r=S.re; v=0; mode='hold'; target=S.re; rR.value=S.re; }
  toggleWire(wrap.querySelectorAll('#bB button'),b=>setKey(b.dataset.k));
  toggleWire(wrap.querySelectorAll('#vB button'),b=>{ vdw=+b.dataset.v; });
  rR.oninput=()=>{ target=+rR.value; if(mode!=='hold'||r>1500){ r=Math.min(r,1200); } mode='hold'; };
  $('#reB').onclick=()=>{ mode='free'; v=0; };
  $('#rsB').onclick=()=>{ mode='hold'; target=S.re; rR.value=S.re; if(r>1000) r=S.re+300; };
  $('#hitB').onclick=()=>{ mode='free'; r=S.re; v=Math.sqrt(2*(+kR.value)/S.mu); Eblink=1; };
  kR.oninput=()=>{};

  animLoop((dt)=>{
    t+=dt;
    // ---- physics
    if(mode==='hold'){ r=approach(r,target,9,dt); v=0; }
    else {
      const dtf=dt*14, nsub=8, hh=dtf/nsub;
      for(let i=0;i<nsub;i++){
        const a0=morseF(S,r)/S.mu;
        r+=v*hh+0.5*a0*hh*hh;
        const a1=morseF(S,r)/S.mu;
        v+=0.5*(a0+a1)*hh;
        if(r<22){ r=22; v=Math.abs(v); }
      }
      if(r>2600){ mode='hold'; r=S.re+380; target=r; rR.value=clamp(r,40,460); }
    }
    const U=morseU(S,r), KE=0.5*S.mu*v*v, Etot=U+KE;
    $('#kV').textContent=fmt(+kR.value,0)+' kJ/mol';
    $('#rV').textContent=fmt(target,0)+' pm';
    // ---- layout
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const topH=h*0.5, cy=topH*0.5+8, s1=(w*0.8)/520;
    const M=S.m[0]+S.m[1], xa=w/2-(S.m[1]/M)*r*s1, xb=w/2+(S.m[0]/M)*r*s1;
    // bond line
    const bondA=clamp(1-(r-S.re*1.1)/(S.re*1.6),0,1);
    for(let q=0;q<S.bo;q++){ const o=(q-(S.bo-1)/2)*6; ctx.save(); ctx.globalAlpha=bondA; line(ctx,xa,cy+o,xb,cy+o,COL.blue,3); ctx.restore(); }
    // atoms (covalent radii) + optional vdW
    [[xa,S.a,S.rc[0],S.vdw[0]],[xb,S.b,S.rc[1],S.vdw[1]]].forEach(([x,s,rc,rv])=>{
      if(vdw) circ(ctx,x,cy,rv*s1,COL.yellow,rgba(COL.yellow,0.05),1.8,[6,5]);
      circ(ctx,x,cy,rc*s1,COL.ink,ELEM[s],2.2);
      circ(ctx,x,cy,3.2,COL.ink,COL.ink,1);
      textAt(ctx,s,x,cy-Math.max(8,rc*s1*0.35),{align:'center',baseline:'middle',size:Math.max(12,rc*s1*0.3),weight:700});
    });
    // separation arrow
    const ay=cy+Math.max(S.rc[0],S.rc[1])*s1+(vdw?(Math.max(S.vdw[0],S.vdw[1])-Math.max(S.rc[0],S.rc[1]))*s1:0)+18;
    if(r<640){ dimArrow(ctx,xa,ay,xb,ay,COL.red); textAt(ctx,'r = '+fmt(r,0)+' pm',(xa+xb)/2,ay+16,{align:'center',size:13,weight:700,color:COL.red}); }
    else textAt(ctx,'atoms separated — bond broken',w/2,ay+16,{align:'center',size:13,weight:700,color:COL.red});
    // bond-length bracket (covalent radii sum)
    const chk = S.rc[0]+S.rc[1];
    textAt(ctx,'r(cov) '+S.rc[0]+' + '+S.rc[1]+' = '+chk+' pm',16,22,{size:11.5,weight:600,color:COL.muted});
    if(vdw) textAt(ctx,'van der Waals radii (dashed)',16,38,{size:11.5,weight:600,color:COL.yellow});
    // ---- PE curve
    const px0=64, px1=w-24, py0=topH+34, py1=h-30;
    const rmin=40, rmax=460, ymin=-S.D*1.18, ymax=S.D*0.55;
    const PX=rr=>lerp(px0,px1,(rr-rmin)/(rmax-rmin)), PY=e=>lerp(py1,py0,(e-ymin)/(ymax-ymin));
    line(ctx,px0,py0-8,px0,py1,COL.mid,1.4); line(ctx,px0,PY(0),px1,PY(0),COL.mid,1.4,[6,5]);
    textAt(ctx,'Energy (kJ/mol)',px0+6,py0-14,{size:11,weight:700,color:COL.muted});
    textAt(ctx,'separated atoms  0',px1,PY(0)-6,{align:'right',size:11,weight:600,color:COL.muted});
    textAt(ctx,'r (pm) →',px1,py1+22,{align:'right',size:11,weight:600,color:COL.muted});
    ctx.save(); ctx.beginPath(); ctx.rect(px0,py0-10,px1-px0,py1-py0+14); ctx.clip();
    ctx.beginPath(); for(let i=0;i<=140;i++){ const rr=rmin+(rmax-rmin)*i/140, x=PX(rr), y=PY(clamp(morseU(S,rr),ymin*1.5,ymax*3)); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
    // re marker + well depth
    line(ctx,PX(S.re),PY(-S.D),PX(S.re),py1,COL.green,1.6,[5,4]); textAt(ctx,'re = '+S.re+' pm',PX(S.re),py1+22,{align:'center',size:11.5,weight:700,color:COL.green});
    dimArrow(ctx,PX(rmax-30),PY(0)+2,PX(rmax-30),PY(-S.D),COL.blue); textAt(ctx,'D = '+S.D+' kJ/mol',PX(rmax-36),PY(-S.D*0.5),{align:'right',size:12,weight:700,color:COL.blue});
    textAt(ctx,'repulsion',px0+10,py0+14,{size:11,weight:600,color:COL.red}); textAt(ctx,'attraction',PX(S.re+60),PY(-S.D*0.5)+26,{size:11,weight:600,color:COL.blue,alpha:0.8});
    // total energy line + moving dot
    if(mode==='free'){ ctx.save(); ctx.beginPath(); ctx.rect(px0,py0-10,px1-px0,py1-py0+14); ctx.clip(); line(ctx,px0,PY(Etot),px1,PY(Etot),COL.red,1.8,[7,5]); ctx.restore(); textAt(ctx,'total energy',px0+8,PY(Etot)-5,{size:10.5,weight:600,color:COL.red}); }
    const dx=clamp(PX(r),px0,px1), dy=clamp(PY(U),py0-8,py1);
    circ(ctx,dx,dy,8,COL.yellow,'#fff6d6',2.6);
    // readouts
    $('#reV').textContent=S.re+' pm'; $('#dV').textContent=S.D+' kJ/mol'; $('#boV').textContent=S.bo;
    $('#rrV').textContent=r<640?fmt(r,0)+' pm':'∞';
    const msg=$('#msg');
    if(mode==='free'&&Etot>0.5) msg.textContent='Energy > D: the bond breaks and the atoms fly apart.';
    else if(mode==='free') msg.textContent='Energy < D: the atoms vibrate about re but stay bonded.';
    else msg.textContent='Higher bond order → shorter bond, larger enthalpy.';
  });
  return wrap;
}

/* =====================================================================
   4.3b  RESONANCE — one real structure, many drawings
   The hybrid is NOT flickering between canonical forms (textbook warns
   against that). The slider blends the canonical forms into one averaged
   structure: bond orders, lengths and formal charges all converge.
   O–O single 148 pm, O=O 121 pm (O₃ hybrid observed 128 pm);
   C–O single 143, C=O 121 (CO₃²⁻ hybrid ≈ 128); N–O 136, N=O 121.
   ===================================================================== */
const RES={
  O3 :{f:'O₃',   syms:['O','O','O'], ctr:1, lig:[0,2], geo:117, Ls:148, Ld:121, obs:128,
       forms:[{ord:[2,1],fc:[0,1,-1],lp:[2,1,3]},{ord:[1,2],fc:[-1,1,0],lp:[3,1,2]}], names:['I','II'], ch:0},
  CO3:{f:'CO₃²⁻',syms:['C','O','O','O'], ctr:0, lig:[1,2,3], geo:'tri', Ls:143, Ld:121, obs:129,
       forms:[{ord:[2,1,1],fc:[0,0,-1,-1],lp:[0,2,3,3]},{ord:[1,2,1],fc:[0,-1,0,-1],lp:[0,3,2,3]},{ord:[1,1,2],fc:[0,-1,-1,0],lp:[0,3,3,2]}], names:['I','II','III'], ch:-2},
  NO2:{f:'NO₂⁻', syms:['O','N','O'], ctr:1, lig:[0,2], geo:115, Ls:136, Ld:121, obs:124,
       forms:[{ord:[2,1],fc:[0,0,-1],lp:[2,1,3]},{ord:[1,2],fc:[-1,0,0],lp:[3,1,2]}], names:['I','II'], ch:-1}
};

Object.values(RES).forEach(S=>{ const wh=S.forms.reduce((s,f)=>s+(f.ord[0]-1),0)/S.forms.length; S.pw=Math.log((S.Ls-S.obs)/(S.Ls-S.Ld))/Math.log(wh); });
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Species</label>
      <div class="toggle-group" id="sB"><button class="toggle-btn active" data-k="O3">O₃</button><button class="toggle-btn" data-k="CO3">CO₃²⁻</button><button class="toggle-btn" data-k="NO2">NO₂⁻</button></div></div>
    <div class="control-group"><label style="margin-bottom:6px;">Canonical form drawn</label>
      <div class="toggle-group" id="fB"></div></div>
    <div class="control-group"><label>Delocalisation <span class="val" id="hV"></span></label>
      <input type="range" id="hR" min="0" max="100" step="1" value="0">
      <div class="toggle-group"><button class="toggle-btn play" id="goB">Show the hybrid</button><button class="toggle-btn" id="rsB">Back to one form</button></div></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard wide"><div class="rlabel">Bond order of each bond</div><div class="rval" id="boV" style="color:var(--f-blue)"></div></div>
      <div class="rcard wide"><div class="rlabel">Bond length of each bond</div><div class="rval" id="blV" style="color:var(--f-green)"></div></div></div>
      <p class="hint" id="note"></p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), hR=$('#hR');
  let key='O3', S=RES[key], form=0, Ht=0, H=0, t=0;
  const W=[]; // smoothed per-form weights
  const L=[];  // smoothed per-bond lengths (pm)
  function load(k){
    key=k; S=RES[k]; form=0; Ht=0; hR.value=0; H=0;
    W.length=0; S.forms.forEach((f,i)=>W.push(i===0?1:0));
    L.length=0; S.lig.forEach((_,j)=>L.push(NaN));
    $('#fB').innerHTML=S.names.map((n,i)=>`<button class="toggle-btn ${i===0?'active':''}" data-f="${i}">${n}</button>`).join('');
    toggleWire(wrap.querySelectorAll('#fB button'),b=>{ form=+b.dataset.f; });
    $('#note').textContent = k==='O3' ? 'Observed O–O length in O₃: 128 pm, between 148 (single) and 121 (double).' : k==='CO3' ? 'All three C–O bonds are equal (≈129 pm), bond order 4/3.' : 'Both N–O bonds are equal (≈124 pm), bond order 1.5.';
  }
  load('O3');
  toggleWire(wrap.querySelectorAll('#sB button'),b=>load(b.dataset.k));
  hR.oninput=()=>{ Ht=hR.value/100; };
  $('#goB').onclick=()=>{ Ht=1; hR.value=100; };
  $('#rsB').onclick=()=>{ Ht=0; hR.value=0; };

  animLoop((dt)=>{
    t+=dt; H=approach(H,Ht,3.2,dt);
    const nF=S.forms.length;
    for(let i=0;i<nF;i++){ const tg=(1-H)*(i===form?1:0)+H/nF; W[i]=approach(W[i],tg,12,dt); }
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // weighted bond orders, lone pairs and formal charges
    const nB=S.lig.length;
    const ord=Array(nB).fill(0), lpA=S.syms.map(()=>S.forms.map(()=>0)), fc=S.syms.map(()=>0);
    S.forms.forEach((f,i)=>{ for(let j=0;j<nB;j++) ord[j]+=W[i]*f.ord[j]; for(let a=0;a<S.syms.length;a++) fc[a]+=W[i]*f.fc[a]; });
    // geometry: centre + ligands
    const pm=Math.min(w,h)*0.0027;
    const cx=w/2, cy=h*(S.geo==='tri'?0.56:0.46);
    const angs=[-Math.PI/2,Math.PI/6,Math.PI*5/6];          // trigonal planar; bent species put the centre on top
    const pos=[]; pos[S.ctr]=[cx,cy-(S.geo==='tri'?0:h*0.1)];
    const lens=[];
    S.lig.forEach((a,j)=>{
      const fw=(ord[j]-1)/1;                                   // 0 = single, 1 = double
      const Lp=S.Ls-(S.Ls-S.Ld)*Math.pow(clamp(fw,0,1),S.pw);
      L[j]=isNaN(L[j])?Lp:approach(L[j],Lp,14,dt); lens.push(L[j]);
      const ang=S.geo==='tri'?angs[j]:(j===0?Math.PI/2+S.geo/2*Math.PI/180:Math.PI/2-S.geo/2*Math.PI/180);
      pos[a]=[pos[S.ctr][0]+Math.cos(ang)*L[j]*pm, pos[S.ctr][1]+Math.sin(ang)*L[j]*pm];
    });
    // delocalised cloud
    if(H>0.02){
      ctx.save(); ctx.globalAlpha=H*0.9; ctx.setLineDash([2,6]); ctx.strokeStyle=COL.blue; ctx.lineWidth=7; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.globalAlpha=H*0.14; ctx.beginPath(); S.lig.forEach((a,j)=>{ ctx.moveTo(pos[S.ctr][0],pos[S.ctr][1]); ctx.lineTo(pos[a][0],pos[a][1]); }); ctx.setLineDash([]); ctx.lineWidth=30; ctx.stroke();
      ctx.restore();
    }
    // bonds
    const ar=Math.max(22,Math.min(w,h)*0.065);
    S.lig.forEach((a,j)=>{
      const A=pos[S.ctr], B=pos[a], dx=B[0]-A[0], dy=B[1]-A[1], Ld=Math.hypot(dx,dy), ux=dx/Ld, uy=dy/Ld, nx=-uy, ny=ux;
      const x1=A[0]+ux*ar, y1=A[1]+uy*ar, x2=B[0]-ux*ar, y2=B[1]-uy*ar;
      const o=ord[j], n=Math.floor(o+1e-6), fr=o-n;
      const lanes=n+(fr>0.02?1:0), spacing=9;
      for(let q=0;q<lanes;q++){
        const off=(q-(lanes-1)/2)*spacing, isFr=(q===n&&fr>0.02);
        // keep single-form triple/double lanes straight; partial lane is dashed with alpha = fraction
        ctx.save(); ctx.globalAlpha=isFr?clamp(fr*1.1,0.25,1):1;
        line(ctx,x1+nx*off,y1+ny*off,x2+nx*off,y2+ny*off,isFr?COL.blue:COL.ink,isFr?3:3,isFr?[7,6]:null);
        ctx.restore();
      }
      // electrons of the pi pair: localised dots → flowing dots
      const nd=Math.round(o*2.0), speed=0.22*H;
      for(let q=0;q<nd;q++){
        const u=((q/nd)+t*speed)%1, off=((q%2)?1:-1)*5;
        eDot(ctx,lerp(x1,x2,u)+nx*off+Math.sin(t*5+q)*1.2,lerp(y1,y2,u)+ny*off,3.2,COL.blue);
      }
      // length label
      textAt(ctx,fmt(lens[j],0)+' pm',(A[0]+B[0])/2+nx*34,(A[1]+B[1])/2+ny*34,{align:'center',baseline:'middle',size:11.5,weight:700,color:COL.green});
    });
    // atoms
    S.syms.forEach((s,a)=>{
      const p=pos[a]; atomDisc(ctx,p[0],p[1],ar*0.8,s,{size:ar*0.78});
      // lone pairs (alpha-weighted by the forms that carry them)
      const maxLp=3;
      for(let q=0;q<maxLp;q++){
        let al=0; S.forms.forEach((f,i)=>{ if(f.lp[a]>q) al+=W[i]; });
        if(al<0.02) continue;
        // directions away from bonds
        let base=Math.atan2(p[1]-pos[S.ctr][1],p[0]-pos[S.ctr][0]); if(a===S.ctr) base=-Math.PI/2*(S.geo==='tri'?0:1)+(S.geo==='tri'?0:0);
        const dirs=a===S.ctr?[Math.PI*1.5]:[base-1.1,base+1.1,base];
        const ang=dirs[q]!==undefined?dirs[q]:base;
        const cxp=p[0]+Math.cos(ang)*ar*1.25, cyp=p[1]+Math.sin(ang)*ar*1.25;
        ctx.save(); ctx.globalAlpha=al; eDot(ctx,cxp-Math.sin(ang)*5,cyp+Math.cos(ang)*5,3.4,COL.red); eDot(ctx,cxp+Math.sin(ang)*5,cyp-Math.cos(ang)*5,3.4,COL.red); ctx.restore();
      }
      // formal charge
      const f=fc[a]; const txt=Math.abs(f)<0.04?'0':(f>0?'+':'−')+(Math.abs(Math.abs(f)-Math.round(Math.abs(f)))<0.04?Math.round(Math.abs(f)):fmt(Math.abs(f),2));
      badge(ctx,p[0]+ar*0.95,p[1]-ar*0.95,txt,Math.abs(f)<0.04?COL.green:f<0?COL.red:COL.blue);
    });
    // title / form label
    const lbl=H<0.02?'Canonical form '+S.names[form]:H>0.98?'Resonance hybrid':'Blending the canonical forms…';
    textAt(ctx,S.f+'  —  '+lbl,16,24,{size:14,weight:700,color:COL.ink});
    if(S.ch!==0) textAt(ctx,'charge '+(S.ch<0?'−':'+')+Math.abs(S.ch)+' on the whole ion',16,42,{size:11,weight:600,color:COL.muted});
    // readouts
    $('#hV').textContent=Math.round(H*100)+'%';
    $('#boV').textContent=ord.map(o=>{ const f=o-Math.floor(o); return Math.abs(f-1/3)<0.02?fmt(o,2)+' (≈'+Math.floor(o)+'⅓)':fmt(o,2); }).join('   ·   ');
    $('#blV').textContent=lens.map(l=>fmt(l,0)+' pm').join('   ·   ');
  });
  return wrap;
}

/* =====================================================================
   4.4  VSEPR — electron pairs repel and settle
   Every pair is a point on a sphere around the central atom. They repel
   with U = Σ wᵢwⱼ / dᵢⱼ and the simulation relaxes them (damped dynamics).
   Bond pairs w = 1; lone pairs w = 1.25 (lp–lp > lp–bp > bp–bp), which makes
   H₂O ≈ 104.4° and NH₃ ≈ 106.8° (textbook 104.5° and 107°) all by itself.
   ===================================================================== */
const VS_WL=1.25;
const VS_TABLE=[
  [2,0,'BeCl₂','Linear','180°'],[3,0,'BF₃','Trigonal planar','120°'],[4,0,'CH₄','Tetrahedral','109.5°'],[5,0,'PCl₅','Trigonal bipyramidal','90° and 120°'],[6,0,'SF₆','Octahedral','90°'],
  [2,1,'SO₂','Bent','119°'],[3,1,'NH₃','Trigonal pyramidal','107°'],[2,2,'H₂O','Bent','104.5°'],[4,1,'SF₄','See-saw','≈ 89° and 177°'],
  [3,2,'ClF₃','T-shaped','≈ 87.5°'],[2,3,'XeF₂','Linear','180°'],[5,1,'BrF₅','Square pyramidal','≈ 84.8°'],[4,2,'XeF₄','Square planar','90°']
];
const VS_GEO={2:'Linear',3:'Trigonal planar',4:'Tetrahedral',5:'Trigonal bipyramidal',6:'Octahedral'};
function vsTemplate(S){
  if(S===2) return [[0,0,1],[0,0,-1]];
  if(S===3) return [0,1,2].map(i=>[Math.cos(i*2.0944),Math.sin(i*2.0944),0]);
  if(S===4){ const s=1/Math.sqrt(3); return [[s,s,s],[s,-s,-s],[-s,s,-s],[-s,-s,s]]; }
  if(S===5) return [[0,0,1],[0,0,-1],[1,0,0],[Math.cos(2.0944),Math.sin(2.0944),0],[Math.cos(4.1888),Math.sin(4.1888),0]];
  return [[0,0,1],[0,0,-1],[1,0,0],[-1,0,0],[0,1,0],[0,-1,0]];
}
function vsLoneSlots(bp,lp){ const S=bp+lp; return S===5?[2,3,4].slice(0,lp):S===6?[0,1,2].slice(0,lp):Array.from({length:lp},(_,i)=>S-1-i); }

function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Bond pairs <span class="val" id="bV"></span></label><input type="range" id="bR" min="2" max="6" step="1" value="4"></div>
    <div class="control-group"><label>Lone pairs <span class="val" id="lV"></span></label><input type="range" id="lR" min="0" max="3" step="1" value="0">
      <button class="toggle-btn navy" id="shB">Shake the pairs</button></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard wide"><div class="rlabel">Molecule shape</div><div class="rval" id="shV" style="color:var(--f-blue)"></div></div>
      <div class="rcard"><div class="rlabel">Example</div><div class="rval" id="exV"></div></div>
      <div class="rcard"><div class="rlabel">Pairs around centre</div><div class="rval" id="spV"></div></div>
      <div class="rcard"><div class="rlabel">Simulated angles</div><div class="rval" id="anV" style="color:var(--f-yellow)"></div></div>
      <div class="rcard"><div class="rlabel">Textbook</div><div class="rval" id="tbV" style="color:var(--f-green)"></div></div></div>
      <p class="hint" id="note">lp–lp repulsion &gt; lp–bp &gt; bp–bp</p></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), bR=$('#bR'), lR=$('#lR');
  let bp=4, lp=0, P=[], V=[], Wt=[], isLp=[], yaw=0.4, t=0, Fmag=[];
  function setup(shake){
    bp=+bR.value; lp=+lR.value;
    if(bp+lp>6){ lp=6-bp; lR.value=lp; }
    lR.max=Math.min(3,6-bp);
    const S=bp+lp, T=vsTemplate(S), ls=vsLoneSlots(bp,lp);
    isLp=T.map((_,i)=>ls.includes(i)); Wt=isLp.map(x=>x?VS_WL:1);
    P=T.map(v=>{ const q=v.map(x=>x+(Math.random()-0.5)*(shake?1.1:1.0)); const n=Math.hypot(...q); return q.map(x=>x/n); });
    V=P.map(()=>[0,0,0]); Fmag=P.map(()=>0);
  }
  setup(true);
  bR.oninput=()=>setup(true); lR.oninput=()=>setup(true); $('#shB').onclick=()=>setup(true);

  function step(dt){
    const S=P.length;
    for(let i=0;i<S;i++){
      const F=[0,0,0];
      for(let j=0;j<S;j++){ if(i===j) continue;
        const d=[P[i][0]-P[j][0],P[i][1]-P[j][1],P[i][2]-P[j][2]], r=Math.max(0.15,Math.hypot(...d)), f=Wt[i]*Wt[j]/(r*r*r);
        F[0]+=f*d[0]; F[1]+=f*d[1]; F[2]+=f*d[2]; }
      const dot=F[0]*P[i][0]+F[1]*P[i][1]+F[2]*P[i][2]; for(let q=0;q<3;q++) F[q]-=dot*P[i][q];
      Fmag[i]=Math.hypot(...F);
      for(let q=0;q<3;q++){ V[i][q]=V[i][q]*Math.exp(-9*dt)+F[q]*dt*9; }
    }
    for(let i=0;i<S;i++){ for(let q=0;q<3;q++) P[i][q]+=V[i][q]*dt*6; const n=Math.hypot(...P[i]); P[i]=P[i].map(x=>x/n); }
  }
  const angle=(a,b)=>Math.acos(clamp(P[a][0]*P[b][0]+P[a][1]*P[b][1]+P[a][2]*P[b][2],-1,1))*180/Math.PI;

  animLoop((dt)=>{
    t+=dt; yaw+=dt*0.45;
    for(let n=0;n<4;n++) step(dt/4);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cx=w/2, cy=h*0.5, R=Math.min(w*0.3,h*0.36), S=P.length;
    // translucent sphere guide
    circ(ctx,cx,cy,R*1.0,COL.faint,null,1.6,[5,6]);
    ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy,R,R*0.28,0,0,Math.PI*2); ctx.strokeStyle=COL.faint; ctx.lineWidth=1.4; ctx.setLineDash([3,6]); ctx.stroke(); ctx.restore();
    // project pairs
    const pr=P.map((p,i)=>{ const q=rot3(p[0],p[1],p[2],yaw,0.45), sc=1/(1-q[2]*0.18); return {i,q,sc,X:cx+q[0]*R*sc,Y:cy+q[1]*R*sc}; });
    pr.sort((a,b)=>a.q[2]-b.q[2]);
    let drewCenter=false;
    const drawCenter=()=>{ atomDisc(ctx,cx,cy,Math.max(18,R*0.14),'A',{size:Math.max(14,R*0.13)}); drewCenter=true; };
    pr.forEach(o=>{
      if(!drewCenter&&o.q[2]>0) drawCenter();
      const i=o.i, depth=0.55+0.45*(o.q[2]+1)/2;
      ctx.save(); ctx.globalAlpha=depth;
      const dx=o.X-cx, dy=o.Y-cy, L=Math.hypot(dx,dy)||1, ang=Math.atan2(dy,dx);
      if(!isLp[i]){
        line(ctx,cx,cy,o.X,o.Y,COL.blue,3.2);
        atomDisc(ctx,o.X,o.Y,Math.max(11,R*0.1)*o.sc,'X',{size:Math.max(11,R*0.1)*o.sc*0.85,stroke:COL.blue});
      } else {
        // lone pair: red lobe pointing along the projected direction
        ctx.translate(cx,cy); ctx.rotate(ang);
        const lobeL=Math.max(L,R*0.3)*0.98, lw=R*0.2*o.sc;
        ctx.beginPath(); ctx.moveTo(R*0.1,0); ctx.bezierCurveTo(lobeL*0.35,-lw*1.15,lobeL*0.82,-lw*1.2,lobeL,0); ctx.bezierCurveTo(lobeL*0.82,lw*1.2,lobeL*0.35,lw*1.15,R*0.1,0);
        ctx.fillStyle=rgba(COL.red,0.12); ctx.fill(); ctx.strokeStyle=COL.red; ctx.lineWidth=2.4; ctx.stroke();
        ctx.restore(); ctx.save(); ctx.globalAlpha=depth;
        const mx=cx+dx*0.68, my=cy+dy*0.68, nx=-Math.sin(ang)*6, ny=Math.cos(ang)*6;
        eDot(ctx,mx+nx,my+ny,4,COL.red); eDot(ctx,mx-nx,my-ny,4,COL.red);
      }

      const mid=a1+dd/2; textAt(ctx,fmt(simAng,1)+'°',cx+Math.cos(mid)*R*0.5,cy+Math.sin(mid)*R*0.5,{align:'center',baseline:'middle',size:13,weight:700,color:COL.yellow});
    }

    $('#tbV').textContent=row?row[4]:'—';
    $('#anV').textContent=angTxt;
    $('#note').textContent=lp===0?'No lone pairs: the electron-pair geometry is the molecular shape.':'Lone pairs take more room: bond angles squeeze below the ideal.';
  });

/* =====================================================================
   4.3c  DIPOLE MOMENT — geometry decides, and a field shows it
   Each bond has a bond moment (vector, drawn + → −, crossed arrow as in the
   textbook). The molecule's moment is their VECTOR SUM (computed here from
   3-D coordinates). In an electric field a polar molecule feels a torque
       I θ'' = −μ E sin θ − γ θ' + thermal kicks
   so it swings, overshoots and settles; μ = 0 molecules just tumble.
   Bond moments are scaled so the sum equals the textbook value (Table 4.5).
   ===================================================================== */
function dpTetra(){ const s=1/Math.sqrt(3); return [[s,s,s],[s,-s,-s],[-s,s,-s],[-s,-s,s]]; }
function dpPyr(L,cosA,sinA,sign){ // 3 ligands below a central atom at origin (axis −y)
  return [0,1,2].map(k=>{ const p=k*2.0944+0.5; return [L*sinA*Math.cos(p), sign*L*cosA, L*sinA*Math.sin(p)]; });
}
const DIP={
  HF :{f:'HF',  mu:1.78, geom:'Linear', atoms:[['F',-0.5,0,0],['H',0.42,0,0]], bonds:[[1,0,1.78]]},
  HCl:{f:'HCl', mu:1.03, geom:'Linear', atoms:[['Cl',-0.64,0,0],['H',0.63,0,0]], bonds:[[1,0,1.03]]},
  CO2:{f:'CO₂', mu:0,    geom:'Linear', atoms:[['O',-1.16,0,0],['C',0,0,0],['O',1.16,0,0]], bonds:[[1,0,1.5],[1,2,1.5]]},
  H2O:{f:'H₂O', mu:1.85, geom:'Bent', atoms:[['O',0,-0.1,0],['H',0.76,0.5,0],['H',-0.76,0.5,0]], bonds:[[1,0,1.51],[2,0,1.51]]},
  BF3:{f:'BF₃', mu:0,    geom:'Trigonal planar', atoms:[['B',0,0,0]].concat([0,1,2].map(k=>['F',1.3*Math.cos(k*2.0944),1.3*Math.sin(k*2.0944),0])), bonds:[[0,1,1.5],[0,2,1.5],[0,3,1.5]]},
  NH3:{f:'NH₃', mu:1.47, geom:'Trigonal pyramidal', lp:[0,1,0,1.0], atoms:[['N',0,-0.35,0]].concat(dpPyr(1.01,0.378,0.926,1).map(p=>['H',p[0],p[1]-0.35,p[2]])), bonds:[[1,0,0.414],[2,0,0.414],[3,0,0.414]]},
  NF3:{f:'NF₃', mu:0.23, geom:'Trigonal pyramidal', lp:[0,1,0,1.0], atoms:[['N',0,-0.35,0]].concat(dpPyr(1.37,0.378,0.926,1).map(p=>['F',p[0],p[1]-0.35,p[2]])), bonds:[[0,1,0.679],[0,2,0.679],[0,3,0.679]]},
  CH4:{f:'CH₄', mu:0,    geom:'Tetrahedral', atoms:[['C',0,0,0]].concat(dpTetra().map(p=>['H',p[0]*1.09,p[1]*1.09,p[2]*1.09])), bonds:[[4,0,0.3],[1,0,0.3],[2,0,0.3],[3,0,0.3]].map((b,i)=>[i+1,0,0.3])},
  CCl4:{f:'CCl₄',mu:0,    geom:'Tetrahedral', atoms:[['C',0,0,0]].concat(dpTetra().map(p=>['Cl',p[0]*1.77,p[1]*1.77,p[2]*1.77])), bonds:[[0,1,1.5],[0,2,1.5],[0,3,1.5],[0,4,1.5]]},
  CHCl3:{f:'CHCl₃',mu:1.04,geom:'Tetrahedral', atoms:[['C',0,0,0],['H',1.09,0,0]].concat([0,1,2].map(k=>['Cl',-0.3333*1.77,0.943*1.77*Math.cos(k*2.0944),0.943*1.77*Math.sin(k*2.0944)])), bonds:[[1,0,0.3],[0,2,0.74],[0,3,0.74],[0,4,0.74]]}
};
// bond moments are vectors from the δ− atom to the δ+ atom: bonds[k]=[δ+ index, δ− index, magnitude]
// (CH₄: C is δ−, so [H,C]). Each molecule's dipole axis is rotated onto +x automatically.
Object.values(DIP).forEach(m=>{
  let sx=0,sy=0,sz=0;
  m.vecs=m.bonds.map(([p,q,mag])=>{ const A=m.atoms[p], B=m.atoms[q]; const d=[A[1]-B[1],A[2]-B[2],A[3]-B[3]], l=Math.hypot(...d); return {p,q,v:d.map(x=>x/l*mag)}; });
  m.vecs.forEach(b=>{ sx+=b.v[0]; sy+=b.v[1]; sz+=b.v[2]; });
  if(m.lp){ sx+=m.lp[0]*m.lp[3]; sy+=m.lp[1]*m.lp[3]; sz+=m.lp[2]*m.lp[3]; }
  m.net=[sx,sy,sz]; m.netMag=Math.hypot(sx,sy,sz);
  // rotate about z so the in-plane net moment points along +x
  const phi=m.netMag>0.05?-Math.atan2(sy,sx):0, c=Math.cos(phi), s=Math.sin(phi);
  const rz=(x,y,z)=>[x*c-y*s,x*s+y*c,z];
  m.atoms=m.atoms.map(a=>{ const r=rz(a[1],a[2],a[3]); return [a[0],r[0],r[1],r[2]]; });
  m.vecs.forEach(b=>{ b.v=rz(...b.v); });
  if(m.lp) m.lpv=rz(m.lp[0],m.lp[1],m.lp[2]).map(x=>x*m.lp[3]);
  m.net=rz(sx,sy,sz);
});

/* =====================================================================
   4.5  VALENCE BOND THEORY — ORBITAL OVERLAP, σ AND π
   s orbital  ψ = e^(−α r²);  p orbital  ψ = (n·r) e^(−α r²)  (lobes + / −).
   The overlap S = ΣψAψB·dA / √(ΣψA²·ΣψB²) is integrated on a grid every
   frame, so the shaded overlap and the number are the same thing.
   Yellow = in-phase (bonding) overlap, red = out-of-phase (cancelling).
   Check: s–s at r = 0 gives S = 1; head-on p–p peaks near αR² = 3.
   ===================================================================== */
function buildA8(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:6px;">Orbitals</label>
      <div class="chip-wrap" id="tB"><button class="chip-btn active" data-t="ss">s – s</button><button class="chip-btn" data-t="sp">s – p</button><button class="chip-btn" data-t="pp">p – p head-on</button><button class="chip-btn" data-t="pi">p – p sideways</button></div></div>
    <div class="control-group"><label>Nuclei approach <span class="val" id="dV"></span></label><input type="range" id="dR" min="0" max="100" step="1" value="12"></div>
    <div class="control-group"><label>Tilt right-hand p orbital <span class="val" id="aV"></span></label><input type="range" id="aR" min="-90" max="90" step="1" value="0">
      <p class="hint">Bonds are directional: tilt the orbital off the axis and the overlap falls.</p></div>
    <div class="control-group"><div class="result-cards">
      <div class="rcard"><div class="rlabel">Overlap S</div><div class="rval" id="sV" style="color:var(--f-yellow)"></div></div>
      <div class="rcard"><div class="rlabel">Bond type</div><div class="rval" id="bV" style="color:var(--f-blue)"></div></div>
      <div class="rcard wide"><div class="rlabel">Best overlap along the axis</div><div class="rval" id="mV" style="color:var(--f-green)"></div></div></div></div>`;
  const $=s=>wrap.querySelector(s);
  const canvas=$('canvas'), dR=$('#dR'), aR=$('#aR');
  let type='ss', Dt=0.12, D={x:0.12,v:0}, tiltT=0, tilt={x:0,v:0}, curve=null, curveKey='', t=0;
  toggleWire(wrap.querySelectorAll('#tB button'),b=>{ type=b.dataset.t; });
  dR.oninput=()=>{ Dt=dR.value/100; };
  aR.oninput=()=>{ tiltT=aR.value*Math.PI/180; };

  /* orbital amplitude (peak-normalised so the same iso-level works for s and p) */
  function psi(kind,dirx,diry,dx,dy,al,sign){
    const g=Math.exp(-al*(dx*dx+dy*dy));
    if(kind==='s') return g;
    return sign*(dx*dirx+dy*diry)*Math.sqrt(2*al)*1.6487*g;   // e^(1/2) → peak ≈ 1
  }
  function setup(type,tl){
    // returns descriptors for A (left) and B (right)
    if(type==='ss') return [{k:'s'},{k:'s'}];
    if(type==='sp') return [{k:'s'},{k:'p',dx:-Math.cos(tl),dy:-Math.sin(tl),sg:1}];            // lobe facing the s orbital is +
    if(type==='pp') return [{k:'p',dx:1,dy:0,sg:1},{k:'p',dx:-Math.cos(tl),dy:-Math.sin(tl),sg:1}];
    return [{k:'p',dx:0,dy:-1,sg:1},{k:'p',dx:Math.sin(tl)*-1,dy:-Math.cos(tl),sg:1}];          // sideways: both + up
  }
  function overlap(type,tl,Rpx,al,cs,half){
    const [A,B]=setup(type,tl); const xa=-Rpx/2, xb=Rpx/2;
    let sab=0, saa=0, sbb=0;
    for(let y=-half;y<=half;y+=cs)for(let x=-half*1.6-Rpx/2;x<=half*1.6+Rpx/2;x+=cs){
      const a=psi(A.k,A.dx,A.dy,x-xa,y,al,A.sg), b=psi(B.k,B.dx,B.dy,x-xb,y,al,B.sg);
      sab+=a*b; saa+=a*a; sbb+=b*b;
    }
    return sab/Math.sqrt(saa*sbb);
  }

  animLoop((dt)=>{
    t+=dt;
    springTo(D,Dt,46,10,dt); springTo(tilt,tiltT,46,10,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const topH=h*0.64, cy=topH*0.5+6, U=Math.min(topH*0.38,w*0.11), al=1.204/(0.85*U)**2*1.0;
    const cs=Math.max(4,U/13);
    // nuclei separation: far (4.2U) → touching (0)
    const Rpx=lerp(4.2*U,0.0,clamp(D.x,0,1)), cx=w/2, xa=cx-Rpx/2, xb=cx+Rpx/2;
    const tl = type==='ss' ? 0 : tilt.x;
    const [A,B]=setup(type,tl);
    // grid for display
    const gx0=Math.max(8,cx-2.6*U-2.1*U), gx1=Math.min(w-8,cx+2.6*U+2.1*U), nx=Math.ceil((gx1-gx0)/cs)+1, ny=Math.ceil((2.3*U*2)/cs)+1, gy0=cy-2.3*U;
    const FA=new Float32Array(nx*ny), FB=new Float32Array(nx*ny);
    let sab=0,saa=0,sbb=0;
    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
      const x=gx0+i*cs, y=gy0+j*cs;
      const a=psi(A.k,A.dx,A.dy,x-xa,y-cy,al,A.sg), b=psi(B.k,B.dx,B.dy,x-xb,y-cy,al,B.sg);
      FA[j*nx+i]=a; FB[j*nx+i]=b; sab+=a*b; saa+=a*a; sbb+=b*b;
    }
    const S=sab/Math.sqrt(saa*sbb);
    // overlap shading (product of the two amplitudes)
    ctx.save();

    // bond-type label
    const bt = type==='pi'?'π bond (sideways overlap)':'σ bond (overlap along the axis)';
    textAt(ctx,bt,16,24,{size:14,weight:700,color:type==='pi'?COL.red:COL.blue});
    // ---- overlap-vs-distance curve (recomputed only when the setup changes)

    if(key!==curveKey){ curveKey=key; curve=[]; for(let q=0;q<=30;q++){ const R=lerp(4.2*U,0,q/30); curve.push([q/30,overlap(type,tl,R,al,Math.max(cs,7),2.4*U)]); } }

    ctx.beginPath(); curve.forEach(([d,s],i)=>{ const x=PX(d), y=PY(s); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.4; ctx.stroke();
    // maximum marker (drawn only on the bonding side, S > 0 and below full coincidence)
    let best=curve[0]; curve.forEach(c=>{ if(c[0]<0.97&&c[1]>best[1]) best=c; });
