/* =====================================================================
   6.13 SOLUBILITY PRODUCT AND THE COMMON-ION EFFECT   (Section 6.13, Problems 6.26–6.28)
   MxXy(s) ⇌ x Mᵖ⁺ + y Xᵠ⁻       Ksp = [M]ˣ [X]ʸ        Qsp = same, with whatever is present
   Pure water:  S = (Ksp / xˣ yʸ)^(1/(x+y))
   With an ion already present (c added):  Ksp = (xS + cM)ˣ (yS + cX)ʸ  — solved exactly.
   Adding a common ion makes Qsp > Ksp → solid precipitates until Qsp = Ksp again.
   CHECK (Problem 6.26): A₂X₃, Ksp = 1.1×10⁻²³ → S = 1.0×10⁻⁵ M.
         (Problem 6.28): Ni(OH)₂ in 0.10 M NaOH, Ksp = 2.0×10⁻¹⁵ → S = 2.0×10⁻¹³ M.
   The number of ions drawn follows log₁₀ S — real solubilities span ten orders of magnitude.
   ===================================================================== */
const SALTS={
  agcl :{n:'AgCl',     x:1,y:1,Ksp:1.8e-10, M:'Ag⁺', X:'Cl⁻'},
  baso4:{n:'BaSO₄',    x:1,y:1,Ksp:1.1e-10, M:'Ba²⁺',X:'SO₄²⁻'},
  agcn :{n:'AgCN',     x:1,y:1,Ksp:6e-17,   M:'Ag⁺', X:'CN⁻'},
  nioh :{n:'Ni(OH)₂',  x:1,y:2,Ksp:2.0e-15, M:'Ni²⁺',X:'OH⁻'},
  a2x3 :{n:'A₂X₃',     x:2,y:3,Ksp:1.1e-23, M:'A³⁺', X:'X²⁻'},
};
function solveS(s,cM,cX){                 // exact molar solubility with c of an ion already in solution
  let lo=-30, hi=1;
  for(let i=0;i<80;i++){ const m=(lo+hi)/2, S=Math.pow(10,m), f=s.x*Math.log(s.x*S+cM)+s.y*Math.log(s.y*S+cX)-Math.log(s.Ksp); if(f>0) hi=m; else lo=m; }
  return Math.pow(10,(lo+hi)/2);
}
function buildA13(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    CG(TG('sa',[['agcl','AgCl'],['baso4','BaSO₄'],['agcn','AgCN'],['nioh','Ni(OH)₂'],['a2x3','A₂X₃']],'small'),'Sparingly soluble salt')+
    CG(TG('ci',[['none','none'],['M','add cation'],['X','add anion']],'small'),'Common ion present')+
    SL('cR','Added concentration',-6,0,0.05,-1)+
    CG(`<div class="toggle-group"><button class="toggle-btn small" id="p26">Problem 6.26</button><button class="toggle-btn small" id="p28">Problem 6.28</button></div>`)+
    RC([['sV','Solubility S',null],['s0V','S in pure water',null],['qV','Qsp ÷ Ksp',null],['vV','Verdict',null,true]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), cR=$('#cR');
  let S=SALTS.agcl, mode='none', Sc=0, parts=[[],[],[],[]], flakes=[], bed=16, prevU=0, t=0;
  const dotQ={x:0,v:0};
  const cOf=()=>mode==='none'?0:Math.pow(10,+cR.value);
  function ions(){ const c=cOf(); return [mode==='M'?c:0, mode==='X'?c:0]; }
  function pure(){ return solveS(S,0,0); }
  function init(){ Sc=pure(); parts=[[],[],[],[]]; flakes=[]; bed=16; prevU=-1; }
  toggleWire([...wrap.querySelectorAll('#sa button')],b=>{ S=SALTS[b.dataset.k]; init(); });
  const setMode=k=>{ mode=k; wrap.querySelectorAll('#ci button').forEach(x=>x.classList.toggle('active',x.dataset.k===k)); };
  toggleWire([...wrap.querySelectorAll('#ci button')],b=>{ mode=b.dataset.k; });
  $('#p26').onclick=()=>{ wrap.querySelector('#sa button[data-k=a2x3]').click(); setMode('none'); };
  $('#p28').onclick=()=>{ wrap.querySelector('#sa button[data-k=nioh]').click(); setMode('X'); cR.value=-1; };
  init();
  animLoop(dt=>{
    t+=dt;
    const [cM,cX]=ions(), St=solveS(S,cM,cX), S0=pure();
    // first-order approach in log space is too slow at the extremes; use linear in S with a log-time step
    const lg=Math.log10(Sc), lt=Math.log10(St); const nl=lg+(lt-lg)*(1-Math.exp(-dt/0.9)); Sc=Math.pow(10,nl);
    const Mc=S.x*Sc+cM, Xc=S.y*Sc+cX, Q=Math.pow(Mc,S.x)*Math.pow(Xc,S.y), qr=Q/S.Ksp, lq=Math.log10(Math.max(qr,1e-30));
    // before the solid has responded, a freshly added ion gives Qsp > Ksp (instantaneous jump)
    const lqShow=Math.log10(Math.max(Math.pow(S.x*Sc+cM,S.x)*Math.pow(S.y*Sc+cX,S.y)/S.Ksp,1e-30));
    springTo(dotQ,clamp(lqShow,-1.5,6),60,8,dt);
    $('#cRV').textContent=mode==='none'?'—':sci(cOf(),2)+' M';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    /* ---- beaker ---- */
    const bx=w*0.07, bw=w*0.38, top=h*0.20, bot=h*0.80, lvl=top+(bot-top)*0.18;
    ctx.save(); ctx.beginPath(); ctx.rect(bx+1,lvl-4,bw-2,bot-lvl+4); ctx.clip(); liquidFill(ctx,bx,bx+bw,lvl,bot,'rgba(47,143,224,0.16)',t,1.8,COL.blue); ctx.restore();
    const u=clamp(Math.round(1.6*(Math.log10(Sc)+13.2)),0,14), extra=mode==='none'?0:clamp(Math.round(2.2*(Math.log10(cOf())+7)),0,18);
    const nC=u*S.x+(mode==='M'?extra:0), nA=u*S.y+(mode==='X'?extra:0);
    const ix0=bx+10, iw=bw-20, iy0=lvl+12, ih=Math.max(40,bot-lvl-50);
    if(prevU>=0 && u<prevU){ for(let k=0;k<Math.min(4,prevU-u);k++) flakes.push({x:ix0+Math.random()*iw,y:iy0+Math.random()*ih*0.5,v:0}); }
    prevU=u;
    parts[0]=syncPop(parts[0],'Cat',nC,dt,ih/iw,0.08); parts[1]=syncPop(parts[1],'Ani',nA,dt,ih/iw,0.08);
    // crystal bed grows when the solid precipitates, shrinks when it dissolves
    const bedT=16+clamp(Math.round(3*Math.log10(Math.max(S0/Sc,1))),0,16); if(Math.random()<dt*6) bed+=Math.sign(bedT-bed);
    for(let k=0;k<bed;k++){ const cols=11, row=Math.floor(k/cols), c=k%cols, sx=bx+14+c*((bw-28)/cols)+(row%2)*5, sy=bot-12-row*12; rect(ctx,sx,sy-5,(bw-28)/cols-2.4,10.5,COL.ink,'#e3e8ef',1.5); }
    flakes.forEach(f=>{ f.v+=dt*180; f.y+=f.v*dt; }); flakes=flakes.filter(f=>f.y<bot-34);
    flakes.forEach(f=>rect(ctx,f.x-3,f.y-3,6,6,COL.ink,'#fff',1.4));
    parts.forEach(arr=>arr.forEach(p=>{ const px=ix0+p.u*iw, py=iy0+p.v*ih; drawMol(ctx,p.type,px,py,0,0.9,p.al); }));
    glass(ctx,bx,top,bw,bot,COL.ink,3.2);
    // added ions are the ones with a yellow ring (drawn on the tail of each list)
    const addType=mode==='M'?0:mode==='X'?1:-1;
    if(addType>=0){ const arr=parts[addType].filter(p=>!p.dying); for(let k=Math.max(0,arr.length-extra);k<arr.length;k++){ const p=arr[k]; circ(ctx,ix0+p.u*iw,iy0+p.v*ih,10,COL.yellow,null,2); } }
    textAt(ctx,S.n+'(s)  ⇌  '+(S.x>1?S.x:'')+S.M+'  +  '+(S.y>1?S.y:'')+S.X,bx+bw/2,bot+26,{align:'center',size:13,weight:700});
    [['Cat',S.M,COL.red],['Ani',S.X,COL.blue]].forEach(([ty,lab,col],i)=>{ const lx=bx+bw*(0.12+i*0.36); drawMol(ctx,ty,lx,top-22,0,0.9); textAt(ctx,lab,lx+14,top-17,{size:11.5,weight:700,color:col}); });
    if(mode!=='none'){ circ(ctx,bx+bw*0.84,top-22,8,COL.yellow,null,2); textAt(ctx,'added',bx+bw*0.84+12,top-17,{size:11,weight:700,color:'#8a6410'}); }
    textAt(ctx,'ions drawn on a log scale',bx+bw/2,bot+44,{align:'center',size:10.5,weight:600,color:COL.mid});

    /* ---- S on a log axis ---- */
    const ax=w*0.57, aw=w*0.37, ay=h*0.20, LX=v=>ax+aw*(clamp(v,-14,-1)+14)/13;
    textAt(ctx,'molar solubility  S  (log scale)',ax,ay-18,{size:11,weight:700,color:COL.mid});
    rect(ctx,ax,ay,aw,26,COL.ink,'#f6f9fc',2);
    rect(ctx,ax+1,ay+1,LX(Math.log10(Sc))-ax-1,24,COL.green,COL.green,0);
    line(ctx,LX(Math.log10(S0)),ay-6,LX(Math.log10(S0)),ay+32,COL.mid,2.4,[4,3]); textAt(ctx,'pure water',LX(Math.log10(S0)),ay+46,{align:'center',size:10.5,weight:700,color:COL.mid});
    [-14,-12,-10,-8,-6,-4,-2].forEach(e=>{ line(ctx,LX(e),ay+26,LX(e),ay+31,COL.ink,1.2); textAt(ctx,'10'+supNum(e),LX(e),ay+64,{align:'center',size:9.5,weight:600,color:COL.muted}); });
    chip(ctx,ax+aw/2,ay+92,'S = '+sci(Sc,2)+' M',COL.green,'center');

    /* ---- Qsp against Ksp ---- */
    const qy=h*0.58, QX=v=>ax+aw*(clamp(v,-1.5,6)+1.5)/7.5;
    textAt(ctx,'Qsp ÷ Ksp  (log scale)',ax,qy-32,{size:11,weight:700,color:COL.mid});
    rect(ctx,QX(-1.5),qy,QX(0)-QX(-1.5),18,COL.ink,'rgba(31,157,85,0.20)',1.6); rect(ctx,QX(0),qy,QX(6)-QX(0),18,COL.ink,'rgba(217,67,43,0.20)',1.6);
    line(ctx,QX(0),qy-8,QX(0),qy+26,COL.blue,3); textAt(ctx,'Qsp = Ksp',QX(0),qy-12,{align:'center',size:11,weight:700,color:COL.blue});
    circ(ctx,QX(dotQ.x),qy+9,8,COL.ink,COL.yellow,2.4);
    textAt(ctx,'dissolves more',QX(-1.5),qy+44,{size:11,weight:700,color:COL.green}); textAt(ctx,'precipitates',QX(6),qy+44,{align:'right',size:11,weight:700,color:COL.red});
    const sett=Math.abs(lqShow)<0.012;
    set(wrap,'#sV',sci(Sc,2)+' M'); set(wrap,'#s0V',sci(S0,2)+' M'); set(wrap,'#qV',sci(Math.pow(10,lqShow),2));
    set(wrap,'#vV',sett?(mode==='none'?'Saturated · Qsp = Ksp':'Saturated again · Qsp = Ksp · S cut ×'+fmt(S0/Sc,0)):lqShow>0?'Qsp > Ksp → precipitates':'Qsp < Ksp → dissolves',sett?'var(--f-blue)':lqShow>0?'var(--f-red)':'var(--f-green)');
  });
  return wrap;
}

/* =====================================================================
   6.2 SOLIDS AND GASES DISSOLVING   (Section 6.1.4)
   Sugar:  sugar(solid) ⇌ sugar(solution). Dissolving is steady while crystals
           last; crystallising ∝ what is dissolved, so  d → n_sat(T).  Cool a
           syrup and crystals separate; drop in "radioactive" (tagged) sugar and
           the tag turns up in both phases — a dynamic equilibrium.
           Sucrose solubility (g/100 g water): 179, 204, 238, 287, 362, 487
           at 0, 20, 40, 60, 80, 100 °C.
   Soda:   CO2(g) ⇌ CO2(aq), Henry's law  C = kH·p ,  kH = 0.034 M/atm at 25 °C
           and falling with T.  Open the bottle: p drops to 0.0004 atm, the
           dissolved gas is suddenly supersaturated and fizzes out.
   ===================================================================== */
const SUG=[[0,179],[20,204],[40,238],[60,287],[80,362],[100,487]];
const sugS=T=>{ for(let i=1;i<SUG.length;i++) if(T<=SUG[i][0]){ const a=SUG[i-1],b=SUG[i]; return lerp(a[1],b[1],(T-a[0])/(b[0]-a[0])); } return 487; };
const kHco2=T=>0.034*Math.exp(2400*(1/(T+273.15)-1/298.15));
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    CG(TG('mode',[['sugar','Sugar in water'],['soda','CO₂ in soda']],'small'),'System')+
    `<div id="pSug">`+SL('gR','Sugar added (per 100 g water)',0,400,10,250)+
      CG('<button class="toggle-btn navy" id="tag" style="margin-top:0">☢ Drop in tagged sugar</button>')+`</div>`+
    `<div id="pSoda" class="hidden">`+SL('pR','CO₂ pressure charged',1,5,0.1,3)+
      CG('<button class="toggle-btn navy" id="cap" style="margin-top:0">Open the cap</button>')+`</div>`+
    SL('tR','Temperature',0,100,1,25)+
    RC([['aV','',null],['bV','',null],['cV','',null,true]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), tR=$('#tR'), gR=$('#gR'), pR=$('#pR');
  let mode='sugar', t=0, hT=0, hAcc=0, hist=[];
  const Td={x:25}, spoon={x:0}, capS={x:0}, flash=[];
  /* ---- sugar state ---- */
  let solids=[], diss=[], fall=[], settle=[], pending=0, rate={d:0,c:0};
  const COLS=14, SZ=11;
  const slotXY=(k,x0,bw,bot)=>{ const cols=Math.max(4,Math.floor((bw-30)/(SZ+2))), row=Math.floor(k/cols), c=k%cols; return [x0+(bw-cols*(SZ+2))/2+c*(SZ+2)+(row%2)*5+SZ/2, bot-10-row*(SZ+1)]; };
  const total=()=>solids.length+diss.length+fall.length+settle.length;
  function initSugar(){ solids=[]; diss=[]; fall=[]; settle=[]; hist=[]; hT=0; pending=Math.round(+gR.value/10); }
  /* ---- soda state ---- */
  const so={C:0,p:3}; let bubbles=[], gas=[], puffs=[], capOpen=false;
  const VL=0.5, VG=0.15, KX=0.22, PATM=0.0004;
  function charge(){ const T=+tR.value, p=+pR.value; so.p=p; so.C=kHco2(T)*p; gas=[]; hist=[]; hT=0; }
  toggleWire([...wrap.querySelectorAll('#mode button')],b=>{
    mode=b.dataset.k; $('#pSug').classList.toggle('hidden',mode!=='sugar'); $('#pSoda').classList.toggle('hidden',mode!=='soda');
    if(mode==='sugar'){ tR.min=0; tR.max=100; tR.value=25; initSugar(); } else { tR.min=0; tR.max=40; tR.value=25; capOpen=false; $('#cap').textContent='Open the cap'; charge(); } });
  gR.oninput=()=>{ const tgt=Math.round(+gR.value/10); pending+=tgt-(total()+pending); };
  $('#tag').onclick=()=>{ for(let i=0;i<8;i++) fall.push({x:0,y:0,tag:true,u:Math.random(),delay:i*0.12}); };
  pR.oninput=()=>{ if(!capOpen) charge(); };
  $('#cap').onclick=()=>{ capOpen=!capOpen; $('#cap').textContent=capOpen?'Close the cap':'Open the cap'; if(!capOpen){ so.p=Math.max(so.p,PATM); } };
  initSugar(); charge(); so.p=3;

  animLoop(dt=>{
    t+=dt; hT+=dt;
    const Ts=parseFloat(tR.value); Td.x=approach(Td.x,Ts,3,dt); $('#tRV').textContent=Ts+' °C';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cx0=w*0.60, cw=w*0.34;
    if(mode==='sugar'){
      /* ===================== SUGAR ===================== */
      const bx=w*0.07, bw=w*0.43, top=h*0.20, bot=h*0.78, wtop=h*0.30;
      const nsat=sugS(Td.x)/10;
      // slider changes: pour in or lift out
      if(pending>0 && Math.random()<dt*14){ pending--; fall.push({x:bx+bw/2+(Math.random()-0.5)*bw*0.5,y:top-50,tag:false,u:Math.random(),delay:0}); }
      else if(pending<0){ pending++; if(diss.length) diss.splice(Math.floor(Math.random()*diss.length),1); else solids.pop(); }
      // spoon pours while crystals are falling
      spoon.x=approach(spoon.x,(fall.length||pending>0)?1:0,6,dt);
      // exchange events
      const s=solids.length, d=diss.length;
      let Rd=0,Rc=0;
      if(s>0){ Rd=6; Rc=6*d/Math.max(nsat,0.5); } else if(d>nsat*1.04+0.5){ Rc=3*(d/nsat-1)*4; }
      rate.d=approach(rate.d,Rd,6,dt); rate.c=approach(rate.c,Rc,6,dt);
      if(Math.random()<Rd*dt && s>0){ const m=solids.pop(); const p=slotXY(solids.length,bx,bw,bot); diss.push({x:p[0],y:p[1],tag:m.tag,a:-Math.PI/2,rot:0,w:(Math.random()-0.5)*3,life:0}); flash.push({x:p[0],y:p[1],u:0,col:COL.red}); }
      if(Math.random()<Rc*dt && diss.length>1-1 && diss.length>0){ const i=Math.floor(Math.random()*diss.length), m=diss.splice(i,1)[0]; settle.push({x:m.x,y:m.y,tag:m.tag}); }
      // motion
      const rows=Math.ceil((solids.length+settle.length+fall.length)/Math.max(4,Math.floor((bw-30)/(SZ+2))));
      const floorY=bot-14-rows*(SZ+1)-6;
      stepP(diss,dt,34+Td.x*0.6,bx+10,wtop+8,bx+bw-10,Math.max(wtop+20,floorY));
      fall.forEach(f=>{ if(f.delay>0){ f.delay-=dt; return; } if(!f.x){ f.x=bx+bw/2+(Math.random()-0.5)*bw*0.5; f.y=top-50; } f.y+=dt*230; });
      for(let i=fall.length-1;i>=0;i--){ const f=fall[i]; if(f.delay>0) continue; const sl=slotXY(solids.length+settle.length,bx,bw,bot); if(f.y>=sl[1]){ solids.push({tag:f.tag}); fall.splice(i,1); } }
      for(let i=settle.length-1;i>=0;i--){ const m=settle[i], sl=slotXY(solids.length,bx,bw,bot); m.x=approach(m.x,sl[0],9,dt); m.y=approach(m.y,sl[1],9,dt);
        if(Math.hypot(m.x-sl[0],m.y-sl[1])<2.5){ solids.push({tag:m.tag}); settle.splice(i,1); flash.push({x:sl[0],y:sl[1],u:0,col:COL.blue}); } }
      flash.forEach(f=>f.u+=dt*2.5); for(let i=flash.length-1;i>=0;i--) if(flash[i].u>1) flash.splice(i,1);

      /* ---- draw beaker ---- */
      const dn=diss.length, tint=clamp(dn/45,0,1);
      liquidFill(ctx,bx+2,bx+bw-2,wtop,bot-2,'rgba('+Math.round(lerp(47,217,tint))+','+Math.round(lerp(143,160,tint))+','+Math.round(lerp(224,23,tint))+','+(0.16+0.22*tint)+')',t,1.6,COL.blue);
      glass(ctx,bx,top,bw,bot,COL.ink,3.2);
      // pouring spoon
      ctx.save(); ctx.translate(bx+bw*0.55,top-62); ctx.rotate(-0.15-spoon.x*0.9); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(60,-10); ctx.lineTo(0,0); ctx.stroke(); ctx.beginPath(); ctx.ellipse(-8,2,15,8,0,0,6.283); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke(); ctx.restore();
      // crystals (solid, lattice squares)
      solids.forEach((m,k)=>{ const p=slotXY(k,bx,bw,bot); rect(ctx,p[0]-SZ/2,p[1]-SZ/2,SZ,SZ,COL.ink,m.tag?COL.yellow:'#e3e8ef',1.7); });
      fall.forEach(f=>{ if(f.delay>0) return; rect(ctx,f.x-SZ/2,f.y-SZ/2,SZ,SZ,COL.ink,f.tag?COL.yellow:'#e3e8ef',1.7); });
      settle.forEach(m=>rect(ctx,m.x-SZ/2,m.y-SZ/2,SZ,SZ,COL.ink,m.tag?COL.yellow:'#e3e8ef',1.7));
      diss.forEach(m=>{ circ(ctx,m.x,m.y,5.6,COL.ink,m.tag?COL.yellow:'#fff',1.8); });
      flash.forEach(f=>{ ctx.save(); ctx.globalAlpha=1-f.u; ctx.strokeStyle=f.col; ctx.lineWidth=1.8; ctx.beginPath(); ctx.arc(f.x,f.y,6+f.u*14,0,6.283); ctx.stroke(); ctx.restore(); });
      textAt(ctx,'sugar (solid)  ⇌  sugar (solution)',bx+bw/2,bot+26,{align:'center',size:12,weight:700,color:COL.muted});
      thermo(ctx,bx+bw+22,top+10,bot-16,clamp(Td.x/100,0,1),COL.ink,COL.red);
      // tagged census
      const tS=solids.filter(m=>m.tag).length+settle.filter(m=>m.tag).length, tD=diss.filter(m=>m.tag).length;
      if(tS+tD>0) chip(ctx,bx+bw/2,bot+50,'tagged  in solution '+tD+'  ·  in crystals '+tS,COL.yellow,'center');
      /* ---- solubility curve ---- */
      const Tdisp=Td.x, cur=diss.length*10, sat=sugS(Tdisp);
      const pts=[]; for(let T=0;T<=100;T+=4) pts.push([T,sugS(T)]);
      const gy=h*0.12, gh=h*0.34;
      const m=chart(ctx,cx0,gy,cw,gh,100,500,'T (°C)','g / 100 g water',[{pts,col:COL.blue,w:3}],{xticks:[0,20,40,60,80,100],yticks:[0,200,400]});
      textAt(ctx,'saturated',cx0+cw*0.55,m.Y(sugS(55))-14,{size:11,weight:700,color:COL.blue,align:'center'});
      line(ctx,m.X(Tdisp),m.Y(0),m.X(Tdisp),m.Y(sat),COL.mid,1.2,[4,4]);
      circ(ctx,m.X(Tdisp),m.Y(sat),5,COL.blue,'#fff',2.4);
      circ(ctx,m.X(Tdisp),m.Y(Math.min(cur,500)),7,COL.ink,COL.yellow,2.4);
      /* ---- rates ---- */
      rateBars(ctx,cx0,h*0.62,cw,rate.d,rate.c,12,'dissolving','crystallising');
      const sat0=s>0&&Math.abs(d-nsat)<=Math.max(1.5,nsat*0.12);
      set(wrap,'#aV',fmt(cur,0)+' g / 100 g'); set(wrap,'#bV','max '+fmt(sat,0)+' g / 100 g');
      set(wrap,'#cV',s>0?(sat0?'Saturated · dissolving = crystallising':(d>nsat?'Crystals growing':'Crystals dissolving')):(d>nsat*1.04+0.5?'Supersaturated':'Unsaturated · all dissolved'));
      wrap.querySelector('#aV').previousElementSibling.textContent='Dissolved'; wrap.querySelector('#bV').previousElementSibling.textContent='Saturation at this T'; wrap.querySelector('#cV').previousElementSibling.textContent='State';
    } else {
      /* ===================== SODA BOTTLE ===================== */
      const T=Td.x, kh=kHco2(T), RT=0.08206*(T+273.15);
      if(capOpen){ so.p=Math.max(PATM,so.p+(-(so.p-PATM)*3.2)*dt); const ex=KX*(so.C-kh*so.p); so.C=Math.max(0,so.C-ex*dt); }
      else { const ex=KX*(so.C-kh*so.p); so.C=Math.max(0,so.C-ex*dt); so.p=Math.max(0,so.p+ex*VL*RT/VG*dt); }
      const exRate=KX*(so.C-kh*so.p);              // + : gas leaving the liquid
      capS.x=approach(capS.x,capOpen?1:0,6,dt);
      const bx=w*0.10, bw=w*0.26, bTop=h*0.36, bBot=h*0.90, nw=w*0.06, nTop=h*0.13, surf=h*0.53;
      const nx=bx+bw/2;
      // bubbles
      if(exRate>0 && Math.random()<exRate*VL*dt*900){ bubbles.push({x:bx+10+Math.random()*(bw-20),y:bBot-14-Math.random()*40,r:1.8+Math.random()*2.4,v:50+Math.random()*60,ph:Math.random()*6}); }
      bubbles.forEach(b=>{ b.y-=b.v*dt; b.x+=Math.sin(t*6+b.ph)*0.4; b.r+=dt*1.6; if(b.y<surf){ b.dead=true; puffs.push({x:b.x,y:surf,u:0}); if(capOpen) gas.push({x:b.x,y:surf-4,vx:(Math.random()-0.5)*30,vy:-60-Math.random()*40,up:true}); } });
      bubbles=bubbles.filter(b=>!b.dead); puffs.forEach(p=>p.u+=dt*3); puffs=puffs.filter(p=>p.u<1);
      // headspace gas
      const ng=Math.round(clamp(so.p*9,0,45));
      while(gas.filter(g=>!g.up).length<ng) gas.push({x:bx+12+Math.random()*(bw-24),y:bTop+6+Math.random()*(surf-bTop-14),vx:(Math.random()-0.5)*80,vy:(Math.random()-0.5)*80,up:false});
      let free=gas.filter(g=>!g.up); while(free.length>ng){ const g=free.pop(); gas.splice(gas.indexOf(g),1); if(capOpen) gas.push({x:g.x,y:g.y,vx:(nx-g.x)*1.4,vy:-110,up:true}); }
      gas.forEach(g=>{ if(g.up){ g.x+=g.vx*dt+(nx-g.x)*dt*0.9; g.y+=g.vy*dt; g.vy-=20*dt; if(g.y<nTop-80) g.dead=true; }
        else { g.x+=g.vx*dt; g.y+=g.vy*dt; if(g.x<bx+8){ g.x=bx+8; g.vx=Math.abs(g.vx);} if(g.x>bx+bw-8){ g.x=bx+bw-8; g.vx=-Math.abs(g.vx);} if(g.y<bTop+4){ g.y=bTop+4; g.vy=Math.abs(g.vy);} if(g.y>surf-6){ g.y=surf-6; g.vy=-Math.abs(g.vy);} } });
      gas=gas.filter(g=>!g.dead);
      // bottle outline
      const body=()=>{ ctx.beginPath(); ctx.moveTo(nx-nw/2,nTop); ctx.lineTo(nx-nw/2,bTop-34); ctx.quadraticCurveTo(nx-nw/2,bTop,bx,bTop+10); ctx.lineTo(bx,bBot-12); ctx.quadraticCurveTo(bx,bBot,bx+12,bBot); ctx.lineTo(bx+bw-12,bBot); ctx.quadraticCurveTo(bx+bw,bBot,bx+bw,bBot-12); ctx.lineTo(bx+bw,bTop+10); ctx.quadraticCurveTo(nx+nw/2,bTop,nx+nw/2,bTop-34); ctx.lineTo(nx+nw/2,nTop); };
      ctx.save(); body(); ctx.clip(); liquidFill(ctx,bx-4,bx+bw+4,surf,bBot,'rgba(217,160,23,0.20)',t,1.8,COL.yellow); ctx.restore();
      ctx.save(); body(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3.2; ctx.lineJoin='round'; ctx.stroke(); ctx.restore();
      // dissolved CO2 dots
      const nd=Math.round(clamp(so.C*110,0,26)); for(let i=0;i<nd;i++){ const u=(i*0.7548+0.1)%1, v=(i*0.5698+0.3)%1; circ(ctx,bx+12+u*(bw-24)+Math.sin(t*1.6+i)*3,surf+14+v*(bBot-surf-30)+Math.cos(t*1.3+i*1.7)*3,3.2,COL.blue,'#e6f1fc',1.5); }
      bubbles.forEach(b=>circ(ctx,b.x,b.y,b.r,COL.blue,'rgba(255,255,255,0.7)',1.5));
      puffs.forEach(p=>{ ctx.save(); ctx.globalAlpha=1-p.u; ctx.strokeStyle=COL.blue; ctx.lineWidth=1.4; ctx.beginPath(); ctx.ellipse(p.x,p.y,3+p.u*9,1+p.u*2.5,0,0,6.283); ctx.stroke(); ctx.restore(); });
      gas.forEach(g=>circ(ctx,g.x,g.y,3.6,COL.ink,'#fff',1.7));
      // cap
      ctx.save(); ctx.translate(nx+capS.x*58,nTop-capS.x*52); ctx.rotate(capS.x*0.7); rect(ctx,-nw/2-4,-12,nw+8,12,COL.ink,'#dfe7f1',2.6); ctx.restore();
      textAt(ctx,'p = '+fmt(so.p,so.p<0.1?4:2)+' atm',bx+bw+12,surf-28,{size:12,weight:700,color:COL.ink});
      textAt(ctx,capOpen?'open to air':'sealed',bx+bw+12,surf-12,{size:11,weight:700,color:capOpen?COL.red:COL.muted});
      thermo(ctx,bx-26,bTop,bBot-18,clamp(T/40,0,1),COL.ink,COL.red);
      if(so.C<0.004) chip(ctx,bx+bw/2,bBot+28,'flat soda',COL.mid,'center');
      textAt(ctx,'CO₂(g)  ⇌  CO₂(aq)',bx+bw/2,bBot+(so.C<0.004?52:26),{align:'center',size:12,weight:700,color:COL.muted});
      /* chart: dissolved C and kH·p against time */
      hAcc+=dt; if(hAcc>0.12){ hAcc=0; hist.push([hT,so.C,kh*so.p]); if(hist.length>700) hist.shift(); }
      const W=40, w0=Math.max(0,hT-W), gy=h*0.12, gh=h*0.34, ymax=Math.max(0.2,kHco2(T)*5*1.05);
      const a=hist.filter(p=>p[0]>=w0).map(p=>[p[0]-w0,p[1]]), b=hist.filter(p=>p[0]>=w0).map(p=>[p[0]-w0,p[2]]);
      chart(ctx,cx0,gy,cw,gh,W,ymax,'time','C (mol/L)',[{pts:b,col:COL.green,w:2.4,dash:[6,4]},{pts:a,col:COL.blue,w:3}],{yticks:[0,fmt(ymax/2,2)*1,fmt(ymax,2)*1]});
      legendRow(ctx,cx0+6,gy+gh+34,[['dissolved C',COL.blue],['kH · p',COL.green]]);
      rateBars(ctx,cx0,h*0.66,cw,kh*so.p*KX*40,so.C*KX*40,12,'dissolving','escaping',true);
      set(wrap,'#aV',fmt(so.C,3)+' M'); set(wrap,'#bV',fmt(kh,3)+' M/atm'); set(wrap,'#cV',capOpen?'Fizzing · new equilibrium at 0.0004 atm':'Sealed · C = kH · p');
      wrap.querySelector('#aV').previousElementSibling.textContent='Dissolved CO₂'; wrap.querySelector('#bV').previousElementSibling.textContent='Henry constant kH'; wrap.querySelector('#cV').previousElementSibling.textContent='State';
    }
  });
  return wrap;
}
/* two horizontal bars: forward (red) and reverse (blue) rate, with an "=" chip when equal */
function rateBars(ctx,x,y,w,rf,rr,rmax,lf,lr,log){
  const sc=v=>log?Math.sqrt(clamp(v/ (rmax*1.6),0,1)):clamp(v/rmax,0,1);
  const bh=20; textAt(ctx,'rates',x,y-10,{size:11,weight:700,color:COL.mid});
  rect(ctx,x,y,w,bh,COL.ink,'#f6f9fc',2); rect(ctx,x+1,y+1,(w-2)*sc(rf),bh-2,COL.red,COL.red,0);
  rect(ctx,x,y+bh+10,w,bh,COL.ink,'#f6f9fc',2); rect(ctx,x+1,y+bh+11,(w-2)*sc(rr),bh-2,COL.blue,COL.blue,0);
  textAt(ctx,lf,x+8,y+14,{size:11,weight:700,color:sc(rf)>0.3?'#fff':COL.red});
  textAt(ctx,lr,x+8,y+bh+24,{size:11,weight:700,color:sc(rr)>0.3?'#fff':COL.blue});
  if(rf>0.3 && Math.abs(rf-rr)<=0.05*rf) chip(ctx,x+w/2,y+bh*2+42,'equal  =  equilibrium',COL.green,'center');
}

/* =====================================================================
   6.3 TWO MEASURING CYLINDERS   (Section 6.2, "Dynamic Equilibrium — A Student's
   Activity", Fig. 6.3)
   Tube 1 carries water from cylinder 1 to 2, tube 2 carries it back.  Each trip
   lifts the column of water inside the tube, so   ΔV = a · h   (a = π d²/4,
   h = V / A).  Levels stop changing when  a₁h₁ = a₂h₂,  i.e.
       V₁ / V₂ = a₂ / a₁ = (d₂ / d₁)²
   — yet both tubes keep carrying the same volume every trip.
   CHECK: equal tubes → equal levels (25 mL each from 50 mL);
          d₁ = 3 mm, d₂ = 5 mm → V₁ : V₂ = 25 : 9  (the text's "different diameters").
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    SL('d1','Tube 1 diameter (1 → 2)',3,5,0.1,4)+SL('d2','Tube 2 diameter (2 → 1)',3,5,0.1,4)+
    SL('spd','Speed',1,8,0.5,5)+
    CG(`<div class="toggle-group"><button class="toggle-btn small" id="same">Same tubes</button><button class="toggle-btn small" id="diff">3 mm vs 5 mm</button><button class="toggle-btn small" id="rs">↺ Reset</button></div>`)+
    RC([['v1','Cylinder 1','var(--f-red)'],['v2','Cylinder 2','var(--f-green)'],['f1','Carried 1 → 2 per trip',null],['f2','Carried 2 → 1 per trip',null],['rt','Level ratio  V₁ : V₂',null,true]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), d1R=$('#d1'), d2R=$('#d2'), spR=$('#spd');
  const AC=3.0;                                  // cylinder cross-section, cm²
  let V=[50,0], clock=0, cycles=0, hist=[], hAcc=0, last=[0,0], flux=[0,0];
  const tubes=[{src:0,dst:1,off:0,up:0,col:COL.red},{src:1,dst:0,off:0.5,up:1,col:COL.green}].map(o=>Object.assign(o,{cap:0,took:0,gave:0,lastU:0,captured:false}));
  const ease=u=>{ u=clamp(u,0,1); return u*u*(3-2*u); };
  const area=mm=>Math.PI*Math.pow(mm/20,2);      // cm²
  function reset(){ V=[50,0]; clock=0; cycles=0; hist=[]; tubes.forEach(o=>{ o.cap=0;o.took=0;o.gave=0;o.lastU=0;o.captured=false; }); }
  $('#same').onclick=()=>{ d1R.value=4; d2R.value=4; reset(); };
  $('#diff').onclick=()=>{ d1R.value=3; d2R.value=5; reset(); };
  $('#rs').onclick=reset; d1R.oninput=d2R.oninput=()=>{};
  animLoop(dt=>{
    const dd=[+d1R.value,+d2R.value]; $('#d1V').textContent=dd[0].toFixed(1)+' mm'; $('#d2V').textContent=dd[1].toFixed(1)+' mm'; $('#spdV').textContent='×'+spR.value;
    const P=2.4, adv=dt*(+spR.value)/P; clock+=adv; cycles=clock;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const wC=Math.min(w*0.11,86), top=h*0.40, bot=h*0.86, cylH=bot-top, cxs=[w*0.17,w*0.45], Lt=h*0.30;
    const lvl=i=>bot-8-(V[i]/100)*(cylH-18);
    tubes.forEach((o,k)=>{
      const a=area(dd[k]), u=((clock+o.off)%1+1)%1;
      if(u<o.lastU){ o.captured=false; o.took=0; o.gave=0; }
      o.lastU=u;
      const hcm=V[o.src]/AC;
      if(u>=0.2 && !o.captured){ o.captured=true; o.cap=Math.min(a*hcm,V[o.src]); flux[k]=o.cap; }
      // volume leaves the source as the tube is lifted, arrives as it is emptied
      if(o.captured){
        const ft=ease((u-0.3)/0.1), fg=ease((u-0.62)/0.1);
        if(u>=0.3){ const dv=(ft-o.took)*o.cap; V[o.src]-=dv; o.took=ft; }
        if(u>=0.62){ const dv=(fg-o.gave)*o.cap; V[o.dst]+=dv; o.gave=fg; }
      }
      o.u=u; o.a=a;
    });
    /* cylinders */
    cxs.forEach((cx,i)=>{
      const x0=cx-wC/2;
      ctx.save(); ctx.beginPath(); ctx.rect(x0+1,top,wC-2,cylH-2); ctx.clip(); liquidFill(ctx,x0,x0+wC,lvl(i),bot,'rgba(47,143,224,0.34)',clock*2.4,1.3,COL.blue); ctx.restore();
      glass(ctx,x0,top,wC,bot,COL.ink,3); line(ctx,x0-10,bot,x0+wC+10,bot,COL.ink,3);
      for(let m=0;m<=100;m+=10){ const y=bot-8-(m/100)*(cylH-18), L=m%50===0?12:7; line(ctx,x0+wC,y,x0+wC-L,y,COL.mid,1.2); if(m%50===0) textAt(ctx,String(m),x0+wC+4,y+4,{size:10,weight:600,color:COL.muted}); }
      textAt(ctx,'mL',x0+wC+4,top-6,{size:10,weight:700,color:COL.muted});
      textAt(ctx,'cylinder '+(i+1),cx,bot+22,{align:'center',size:12,weight:700,color:i?COL.green:COL.red});
      textAt(ctx,fmt(V[i],1)+' mL',cx,bot+40,{align:'center',size:13,weight:700,color:i?COL.green:COL.red});
    });
    /* tubes (drawn after the cylinders so they sit in front) */
    tubes.forEach((o,k)=>{
      const u=o.u, xs=cxs[o.src], xd=cxs[o.dst], yUp=top-18-o.up*20, yDip=bot-8, yDest=top+14;
      let x,y;
      if(u<0.2){ x=xs; y=lerp(yUp,yDip,ease(u/0.2)); }
      else if(u<0.3){ x=xs; y=yDip; }
      else if(u<0.5){ const s=(u-0.3)/0.2; x=lerp(xs,xd,ease((s-0.3)/0.7)); y=lerp(yDip,yUp,ease(s/0.4)); }
      else if(u<0.62){ x=xd; y=lerp(yUp,yDest,ease((u-0.5)/0.12)); }
      else if(u<0.72){ x=xd; y=yDest; }
      else { const s=(u-0.72)/0.28; x=lerp(xd,xs,ease((s-0.25)/0.75)); y=lerp(yDest,yUp,ease(s/0.3)); }
      const wt=dd[k]*2.2;
      // column of water inside the tube
      const pxcm=(cylH-18)/(100/AC);
      let colcm=0;
      if(u<0.2) colcm=(V[o.src]/AC)*ease(u/0.2); else if(u<0.62) colcm=o.cap/o.a; else if(u<0.72) colcm=(o.cap/o.a)*(1-ease((u-0.62)/0.1));
      const colPx=Math.min(Lt-6,colcm*pxcm);
      rect(ctx,x-wt/2,y-Lt,wt,Lt,o.col,'rgba(255,255,255,0.8)',2.4);
      if(colPx>0.5) rect(ctx,x-wt/2+1.2,y-colPx,wt-2.4,colPx,COL.blue,'rgba(47,143,224,0.55)',0);
      if(u>=0.2&&u<0.62){ circ(ctx,x,y-Lt-3,wt*0.8+3,COL.ink,COL.yellow,2); }
      if(u>=0.64&&u<0.72){ ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=Math.max(1.5,wt*0.4); ctx.beginPath(); ctx.moveTo(x,y+2); ctx.lineTo(x,lvl(o.dst)); ctx.stroke(); ctx.restore(); }
      textAt(ctx,'tube '+(k+1),x+wt/2+7,y-Lt+12,{size:11,weight:700,color:o.col});
    });
    /* direction labels */
    vec(ctx,cxs[0]+wC/2+16,top+78,cxs[1]-wC/2-16,top+78,COL.red,2.2); vec(ctx,cxs[1]-wC/2-16,top+100,cxs[0]+wC/2+16,top+100,COL.green,2.2);
    /* chart */
    hAcc+=dt; if(hAcc>0.2){ hAcc=0; hist.push([cycles,V[0],V[1]]); if(hist.length>900) hist.shift(); }
    const xmax=Math.max(40,Math.ceil((cycles+5)/20)*20);
    const gx=w*0.67, gy=h*0.14, gw=w*0.28, gh=h*0.42;
    const a1=area(dd[0]), a2=area(dd[1]), p1=100*0+ (V[0]+V[1])*a2/(a1+a2), p2=(V[0]+V[1])-p1;
    const tot=V[0]+V[1];
    const m=chart(ctx,gx,gy,gw,gh,xmax,100,'trips','V (mL)',[{pts:[[0,p1],[xmax,p1]],col:COL.red,w:1.4,dash:[5,5]},{pts:[[0,p2],[xmax,p2]],col:COL.green,w:1.4,dash:[5,5]},{pts:hist.map(p=>[p[0],p[1]]),col:COL.red,w:3},{pts:hist.map(p=>[p[0],p[2]]),col:COL.green,w:3}],{yticks:[0,50,100]});
    textAt(ctx,'dashed = predicted from diameters',gx,gy+gh+46,{size:10.5,weight:600,color:COL.mid});
    // flow strength: both tubes carry the same volume at equilibrium
    const bx=gx, by=h*0.74, bw=gw;
    textAt(ctx,'carried per trip',bx,by-8,{size:11,weight:700,color:COL.mid});
    const fm=Math.max(2.5,flux[0],flux[1])*1.1;
    rect(ctx,bx,by,bw,16,COL.ink,'#f6f9fc',1.8); rect(ctx,bx+1,by+1,(bw-2)*clamp(flux[0]/fm,0,1),14,COL.red,COL.red,0);
    rect(ctx,bx,by+24,bw,16,COL.ink,'#f6f9fc',1.8); rect(ctx,bx+1,by+25,(bw-2)*clamp(flux[1]/fm,0,1),14,COL.green,COL.green,0);
    const settled=Math.abs(V[0]-p1)<0.6 && tot>5;
    if(settled && Math.abs(flux[0]-flux[1])<0.06*Math.max(flux[0],0.1)) chip(ctx,bx+bw/2,by+66,'levels steady  ·  trips go on',COL.green,'center');
    set(wrap,'#v1',fmt(V[0],1)+' mL'); set(wrap,'#v2',fmt(V[1],1)+' mL'); set(wrap,'#f1',fmt(flux[0],2)+' mL'); set(wrap,'#f2',fmt(flux[1],2)+' mL');
    set(wrap,'#rt',(V[1]>0.5?fmt(V[0]/V[1],2):'—')+'   (predicted '+fmt(a2/a1,2)+')');
  });
  return wrap;
}

/* =====================================================================
   6.4 REACHING EQUILIBRIUM:  H2(g) + I2(g) ⇌ 2HI(g)   (Section 6.2, Fig. 6.2, 6.5)
   Real molecules react by chance collisions:
        forward events/s = kf·nH·nI / N        reverse events/s = kr·nHI² / N
   with  Kc = kf / kr = 57.0 at 700 K  (Section 6.6).  Start from reactants, from
   pure HI, or from a lopsided mixture: the same Kc is reached, the rates meet,
   and the molecules go on reacting.
   CHECK: 1 M H2 + 1 M I2 → [HI] = 1.58 M, [H2] = [I2] = 0.21 M  (Qc = 57).
   ===================================================================== */
function buildA4(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    CG(`<div class="toggle-group" id="st"><button class="toggle-btn small active" data-k="a">H₂ + I₂</button><button class="toggle-btn small" data-k="b">only HI</button><button class="toggle-btn small" data-k="c">2 H₂ : 1 I₂</button></div>`,'Start with')+
    SL('spd','Speed',0.5,3,0.1,1.2)+
    CG('<button class="toggle-btn navy" id="rs" style="margin-top:0">↺ Restart</button>')+
    RC([['cH','[H₂] M','var(--f-blue)'],['cI','[I₂] M','var(--f-yellow)'],['cHI','[HI] M','var(--f-green)'],['qc','Qc  →  Kc = 57',null],['rr','Forward ÷ reverse rate',null,true]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), spR=$('#spd');
  const N=40, KF=0.45, KR=KF/57;
  const START={a:[40,40,0],b:[0,0,80],c:[60,30,0]};
  let rmaxV=0.5, parts=[], flashes=[], hist=[], hT=0, hAcc=0, sm=[0,0,0], key='a', t=0;
  const BOX={x0:0,y0:0,x1:1,y1:1};
  function restart(){
    const s=START[key]; parts=[]; flashes=[]; hist=[]; hT=0; hAcc=0;
    ['H2','I2','HI'].forEach((ty,i)=>{ for(let k=0;k<s[i];k++) parts.push(newP(ty,0,0,1,1)); });
    parts.forEach(p=>{ p.u=Math.random(); p.v=Math.random(); }); sm=s.slice();
  }
  toggleWire([...wrap.querySelectorAll('#st button')],b=>{ key=b.dataset.k; restart(); });
  $('#rs').onclick=restart; restart();
  const cnt=ty=>parts.filter(p=>p.type===ty);
  animLoop(dt=>{
    t+=dt; hT+=dt; const sp=+spR.value; $('#spdV').textContent='×'+sp.toFixed(1);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const x0=w*0.05, x1=w*0.50, y0=h*0.12, y1=h*0.62;
    // reaction events (Poisson)
    const H=cnt('H2'), I=cnt('I2'), Q=cnt('HI');
    const rf=KF*sp*H.length*I.length/N, rr=KR*sp*Q.length*Math.max(0,Q.length-1)/N;     // events per second
    const nf=Math.random()<rf*dt, nr=Math.random()<rr*dt;
    if(nf&&H.length&&I.length){ const a=H[Math.floor(Math.random()*H.length)], b=I[Math.floor(Math.random()*I.length)];
      parts.splice(parts.indexOf(a),1); parts.splice(parts.indexOf(b),1);
      const x=(a.u+b.u)/2, y=(a.v+b.v)/2; [0,1].forEach(()=>{ const p=newP('HI',0,0,1,1); p.u=x+(Math.random()-0.5)*0.03; p.v=y+(Math.random()-0.5)*0.03; parts.push(p); }); flashes.push({u:x,v:y,k:0,col:COL.red}); }
    if(nr&&Q.length>1){ const a=Q[Math.floor(Math.random()*Q.length)]; parts.splice(parts.indexOf(a),1); const b=cnt('HI')[Math.floor(Math.random()*(Q.length-1))]; parts.splice(parts.indexOf(b),1);
      const pa=newP('H2',0,0,1,1), pb=newP('I2',0,0,1,1); pa.u=a.u; pa.v=a.v; pb.u=b.u; pb.v=b.v; parts.push(pa,pb); flashes.push({u:(a.u+b.u)/2,v:(a.v+b.v)/2,k:0,col:COL.blue}); }
    // wander in the unit box (px speed → fraction)
    const bw=x1-x0, bh=y1-y0, spd=0.06*sp+0.05;
    parts.forEach(p=>{ p.a+=(Math.random()-0.5)*5*dt; p.rot+=p.w*dt; p.u+=Math.cos(p.a)*spd*dt*(bh/bw)*0.9; p.v+=Math.sin(p.a)*spd*dt;
      if(p.u<0.03){ p.u=0.03; p.a=Math.PI-p.a; } if(p.u>0.97){ p.u=0.97; p.a=Math.PI-p.a; } if(p.v<0.04){ p.v=0.04; p.a=-p.a; } if(p.v>0.96){ p.v=0.96; p.a=-p.a; } });
    flashes.forEach(f=>f.k+=dt*2.2); flashes=flashes.filter(f=>f.k<1);
    const c=[cnt('H2').length,cnt('I2').length,cnt('HI').length]; for(let i=0;i<3;i++) sm[i]=approach(sm[i],c[i],0.8,dt);
    const cH=c[0]/N, cI=c[1]/N, cQ=c[2]/N, mf=KF*sp*cH*cI, mr=KR*sp*cQ*cQ;

    /* ---- flask ---- */
    rrect(ctx,x0,y0,bw,bh,16); ctx.save(); ctx.fillStyle='#f6f9fc'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
    parts.forEach(p=>drawMol(ctx,p.type,x0+p.u*bw,y0+p.v*bh,p.rot,1.0));
    flashes.forEach(f=>{ ctx.save(); ctx.globalAlpha=1-f.k; ctx.strokeStyle=f.col; ctx.lineWidth=2.2; ctx.beginPath(); ctx.arc(x0+f.u*bw,y0+f.v*bh,8+f.k*22,0,6.283); ctx.stroke(); ctx.restore(); });
    textAt(ctx,'H₂ (g)  +  I₂ (g)   ⇌   2 HI (g)',(x0+x1)/2,y1+24,{align:'center',size:13,weight:700});
    // legend glyphs
    [['H2','H₂',COL.blue],['I2','I₂',COL.yellow],['HI','HI',COL.green]].forEach(([ty,lab,col],i)=>{ const lx=x0+bw*(0.18+i*0.28); drawMol(ctx,ty,lx,y1+48,0,1); textAt(ctx,lab,lx+20,y1+53,{size:12,weight:700,color:col==COL.green?COL.ink:col}); });
    rateBars(ctx,x0,h*0.80,bw,mf,mr,rmaxV,'forward  (→)','reverse  (←)');

    /* ---- charts ---- */
    hAcc+=dt; if(hAcc>0.2){ hAcc=0; hist.push([hT,cH,cI,cQ,mf,mr]); if(hist.length>900) hist.shift(); }
    const W=30, w0=Math.max(0,hT-W), view=hist.filter(p=>p[0]>=w0);
    const gx=w*0.60, gw=w*0.36, g1y=h*0.10, g1h=h*0.30, g2y=h*0.62, g2h=h*0.20;
    chart(ctx,gx,g1y,gw,g1h,W,2.2,'time','concentration (M)',[{pts:view.map(p=>[p[0]-w0,p[1]]),col:COL.blue},{pts:view.map(p=>[p[0]-w0,p[2]]),col:COL.yellow,w:2.4,dash:[6,3]},{pts:view.map(p=>[p[0]-w0,p[3]]),col:COL.green}],{yticks:[0,1,2]});
    legendRow(ctx,gx+4,g1y+g1h+46,[['H₂',COL.blue],['I₂',COL.yellow],['HI',COL.green]]);
    rmaxV=approach(rmaxV,Math.max(0.04,...view.map(p=>Math.max(p[4],p[5])))*1.15,3,dt);
    chart(ctx,gx,g2y,gw,g2h,W,rmaxV,'time','rate (M/s)',[{pts:view.map(p=>[p[0]-w0,p[4]]),col:COL.red},{pts:view.map(p=>[p[0]-w0,p[5]]),col:COL.blue}],{yticks:[0,rmaxV/2,rmaxV],yfmt:v=>fmt(v,3)});
    legendRow(ctx,gx+4,g2y+g2h+46,[['forward',COL.red],['reverse',COL.blue]]);

    const qc=sm[0]>0.3&&sm[1]>0.3?(sm[2]*sm[2])/(sm[0]*sm[1]):NaN;
    set(wrap,'#cH',fmt(c[0]/N,2)); set(wrap,'#cI',fmt(c[1]/N,2)); set(wrap,'#cHI',fmt(c[2]/N,2));
    set(wrap,'#qc',isFinite(qc)?fmt(qc,0):'—'); set(wrap,'#rr',mr>0.001?fmt(mf/mr,2)+(Math.abs(mf/mr-1)<0.12?'  ✓ equal · equilibrium':''):'∞ (no HI yet)');
  });
  return wrap;
}

/* =====================================================================
   6.5 WHICH WAY WILL IT GO?  Qc against Kc   (Section 6.6.2, Fig. 6.7)
   Qc has the form of Kc but uses whatever concentrations are present now.
        Qc < Kc → net forward   ·   Qc > Kc → net reverse   ·   Qc = Kc → no net change
   The needle shows log10(Qc/Kc); "Let it react" drives the mixture to Qc = Kc with
   the true rate-law shape (rf = rr only at equilibrium).
   CHECK: H2 + I2 ⇌ 2HI, Kc = 57.0: [H2] = 0.10, [I2] = 0.20, [HI] = 0.40 M
          → Qc = 0.40² / (0.10 × 0.20) = 8.0 < 57 → forward.
          Problem 6.7: 2A ⇌ B + C, Kc = 2×10⁻³, [A] = [B] = [C] = 3×10⁻⁴ M
          → Qc = 1 > Kc → reverse.
   ===================================================================== */
const QR={
  hi:{ name:['H₂','I₂','HI'], ty:['H2','I2','HI'], rx:{R:[[0,1],[1,1]],P:[[2,2]]}, K:57, max:2, per:30, step:0.01,
       eq:'H₂ + I₂ ⇌ 2HI   (Kc = 57.0)', ex:[0.10,0.20,0.40], cols:[COL.blue,COL.yellow,COL.green] },
  ab:{ name:['A','B','C'],    ty:['A','B','C'],    rx:{R:[[0,2]],P:[[1,1],[2,1]]}, K:2e-3, max:1e-3, per:36, step:1e-5,
       eq:'2A ⇌ B + C   (Kc = 2×10⁻³)', ex:[3e-4,3e-4,3e-4], cols:[COL.red,COL.blue,COL.green] },
};
function buildA5(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    CG(TG('rx',[['hi','H₂ + I₂ ⇌ 2HI'],['ab','2A ⇌ B + C']],'small'),'Reaction')+
    ['0','1','2'].map(i=>SL('c'+i,`<span id="n${i}"></span>`,0,100,1,0)).join('')+
    CG(`<div class="toggle-group"><button class="toggle-btn small" id="ex">Textbook example</button><button class="toggle-btn play" id="go" style="flex:1.4">▶ Let it react</button></div>`)+
    RC([['qV','Qc',null],['kV','Kc',null],['vV','Verdict',null,true]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let R=QR.hi, c=R.ex.slice(), running=false, parts=[[],[],[]], t=0, rf=0, rr=0;
  const needle={x:-0.5,v:0};

    seg(Math.PI,1.5*Math.PI-0.05,'rgba(31,157,85,0.55)'); seg(1.5*Math.PI-0.05,1.5*Math.PI+0.05,COL.blue); seg(1.5*Math.PI+0.05,2*Math.PI,'rgba(217,67,43,0.55)');

    const na=1.5*Math.PI+needle.x*0.5*Math.PI;

/* =====================================================================

   in between both are present.  The equilibrium composition is the x that makes
   Qc = Kc — solved exactly (not by guessing) from the initial mixture.
   CHECK (Problem 6.9): 3.00 M PCl5, Kc = 1.80  →  x = 1.592:

const XR={

  toggleWire([...wrap.querySelectorAll('#rx button')],b=>{ R=XR[b.dataset.k]; kR.value=Math.log10(R.K); c0R.value=R.c0; parts=[[],[],[]]; restart();
    $('#a2').parentElement.classList.toggle('hidden',R.name.length<3); });

    // a steady flicker of forward / reverse events shows the exchange never stops
    fl+=dt; const ex=Math.min(2.2,0.4+1.3*Math.min(1,Math.sqrt(Math.min(K,1/Math.max(K,1e-9))*4)));

    flashes.forEach(f=>{ ctx.save(); ctx.globalAlpha=(1-f.k)*0.8; ctx.strokeStyle=f.col; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x0+f.u*bw,y0+f.v*bh,6+f.k*18,0,6.283); ctx.stroke(); ctx.restore(); });
    textAt(ctx,R.eq,(x0+x1)/2,y1+26,{align:'center',size:13,weight:700});
    R.name.forEach((nm,i)=>{ const lx=x0+bw*(0.12+i*0.3); drawMol(ctx,R.ty[i],lx,y1+52,0,0.9); textAt(ctx,nm,lx+20,y1+57,{size:12,weight:700,color:R.cols[i]===COL.yellow?COL.muted:(R.cols[i]===COL.ink?COL.ink:R.cols[i])}); });

    textAt(ctx,'M',gx+4,gy-10,{size:11,weight:700});
    const bwid=gw/n*0.30, cols=R.cols.map(cc=>cc===COL.ink?COL.red:cc===COL.yellow?COL.yellow:cc);
    R.name.forEach((nm,i)=>{
      const cxx=gx+gw*(i+0.5)/n, init=i?0:+c0R.value, eqv=c[i], colr=i===0?COL.red:(i===1?COL.green:COL.blue);
      rect(ctx,cxx-bwid-3,Yv(init),bwid,gy+gh-Yv(init),COL.mid,'rgba(129,149,171,0.15)',1.6);

    wrap.querySelector('#a0').previousElementSibling.textContent='['+R.name[0]+']'; wrap.querySelector('#a1').previousElementSibling.textContent='['+R.name[1]+']'; if(R.name.length>2) wrap.querySelector('#a2').previousElementSibling.textContent='['+R.name[2]+']';

/* =====================================================================
   6.7 CHANGING THE CONCENTRATION   (Section 6.8.1, Fig. 6.8, Fe³⁺/SCN⁻ experiment)
   Disturb an equilibrium by adding or removing a species: Qc moves away from Kc,
   then net reaction runs (rate-law relaxation) in the direction that undoes the
   change until Qc = Kc again.  Fe³⁺ + SCN⁻ ⇌ [Fe(SCN)]²⁺  (yellow + colourless → deep red)
     + Fe³⁺ or + SCN⁻ : Qc < Kc → forward, red deepens
     oxalic acid takes Fe³⁺ away, HgCl₂ takes SCN⁻ away : Qc > Kc → reverse, red fades
   H₂(g) + I₂(g) ⇌ 2HI(g), Kc = 57: adding H₂ → forward, [H₂] ends below its peak
   but above its old value ("more than original, less than after the addition").
   ===================================================================== */
const CM={
  fe:{ eq:'Fe³⁺ + SCN⁻ ⇌ [Fe(SCN)]²⁺', name:['Fe³⁺','SCN⁻','[Fe(SCN)]²⁺'], ty:['Fe3','SCN','FeSCN'], rx:{R:[[0,1],[1,1]],P:[[2,1]]}, K:140, init:[0.020,0.020,0],
       cols:[COL.yellow,COL.blue,COL.red], per:[1500,1500,1500],
       btn:[['Fe','+ Fe³⁺',COL.yellow],['SCN','+ SCN⁻',COL.blue],['ox','+ Oxalic acid  (removes Fe³⁺)',COL.green],['hg','+ HgCl₂  (removes SCN⁻)',COL.red]] },
  hi:{ eq:'H₂ + I₂ ⇌ 2HI', name:['H₂','I₂','HI'], ty:['H2','I2','HI'], rx:{R:[[0,1],[1,1]],P:[[2,2]]}, K:57, init:[0.5,0.5,0],
       cols:[COL.blue,COL.yellow,COL.green], per:[22,22,10],
       btn:[['H2','+ H₂',COL.blue],['I2','+ I₂',COL.yellow],['HI','+ HI',COL.green],['rm','− Remove HI',COL.red]] },

function buildA7(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    CG(TG('md',[['fe','Fe³⁺ + SCN⁻ test tube'],['hi','H₂ + I₂ ⇌ 2HI']],'small'),'System')+
    `<div class="control-group"><label style="margin-bottom:4px">Disturb the equilibrium</label><div id="acts"></div>
      <button class="toggle-btn navy" id="rs" style="margin-top:8px">↺ Reset</button></div>`+
    RC([['qV','Qc',null],['kV','Kc',null],['vV','Shift',null,true]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let M=CM.fe, c=M.init.slice(), parts=[[],[],[]], drops=[], splashes=[], marks=[], hist=[], hT=0, hAcc=0, t=0, bulb=0, ymax=0.2;
  const dot={x:0,v:0};
  function build(){
    $('#acts').innerHTML=M.btn.map(b=>`<button class="opt-btn" data-k="${b[0]}" style="border-left:5px solid ${b[2]}">${b[1]}</button>`).join('');
    [...wrap.querySelectorAll('#acts button')].forEach(b=>b.onclick=()=>{ drops.push({k:b.dataset.k,col:M.btn.find(x=>x[0]===b.dataset.k)[2],y:null,vy:0}); bulb=1; });
  }
  function apply(k){
    if(k==='Fe') c[0]+=0.02; if(k==='SCN') c[1]+=0.02; if(k==='ox') c[0]*=0.2; if(k==='hg') c[1]*=0.2;
    if(k==='H2') c[0]+=0.5; if(k==='I2') c[1]+=0.5; if(k==='HI') c[2]+=0.5; if(k==='rm') c[2]*=0.25;
    marks.push({t:hT,label:M.btn.find(x=>x[0]===k)[1].replace(/\s+\(.*\)/,'')});
  }
  function reset(){ c=M.init.slice(); parts=[[],[],[]]; drops=[]; splashes=[]; marks=[]; hist=[]; hT=0; dot.x=0; }
  toggleWire([...wrap.querySelectorAll('#md button')],b=>{ M=CM[b.dataset.k]; build(); reset(); });
  $('#rs').onclick=reset; build();

  animLoop(dt=>{
    t+=dt; hT+=dt; bulb=Math.max(0,bulb-dt*4);
    relax(c,M.rx,M.K,dt,2.4);
    const Q=Qof(c,M.rx), lr=Math.log10(Math.max(Q,1e-300)/M.K), eq=Math.abs(lr)<0.012;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const isFe=M===CM.fe;

    /* ---- the vessel ---- */
    const tcx=w*0.27, tw=w*0.15, tTop=h*0.26, tBot=h*0.74, x0=tcx-tw/2, x1=tcx+tw/2;
    const surf=isFe?h*0.44:tTop;
    // colour of the solution / gas
    if(isFe){
      const red=clamp(1-Math.exp(-c[2]/0.008),0,0.95), yel=clamp(c[0]/0.04*0.3,0,0.5);
      ctx.save(); ctx.beginPath(); ctx.moveTo(x0,tTop); ctx.lineTo(x0,tBot-tw/2); ctx.arc(tcx,tBot-tw/2,tw/2,Math.PI,0,true); ctx.lineTo(x1,tTop); ctx.clip();
      liquidFill(ctx,x0-3,x1+3,surf,tBot+4,'rgba(217,160,23,'+yel+')',t,1.6); liquidFill(ctx,x0-3,x1+3,surf,tBot+4,'rgba(190,35,30,'+(red*0.85)+')',t,1.6,COL.ink);
      ctx.restore();
    } else {
      const vio=clamp(c[1]/0.9*0.45,0,0.55);
      ctx.save(); ctx.beginPath(); ctx.moveTo(x0,tTop); ctx.lineTo(x0,tBot-tw/2); ctx.arc(tcx,tBot-tw/2,tw/2,Math.PI,0,true); ctx.lineTo(x1,tTop); ctx.closePath(); ctx.fillStyle='rgba(110,55,160,'+vio+')'; ctx.fill(); ctx.restore();
    }
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3.2; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(x0-5,tTop); ctx.lineTo(x0,tTop); ctx.lineTo(x0,tBot-tw/2); ctx.arc(tcx,tBot-tw/2,tw/2,Math.PI,0,true); ctx.lineTo(x1,tTop); ctx.lineTo(x1+5,tTop); ctx.stroke(); ctx.restore();
    // ions / molecules
    const ix0=x0+8, ix1=x1-8, iy0=(isFe?surf:tTop)+10, iy1=tBot+tw/2-24, iw=ix1-ix0, ih=iy1-iy0;
    [0,1,2].forEach(i=>{ parts[i]=syncPop(parts[i],M.ty[i],Math.round(clamp(c[i]*M.per[i],0,60)),dt,ih/iw,0.06); });
    parts.forEach(arr=>arr.forEach(p=>drawMol(ctx,p.type,ix0+p.u*iw,iy0+p.v*ih,p.rot,0.85,p.al)));
    // dropper above the tube
    const dy=h*0.06, dcol=drops.length?drops[drops.length-1].col:COL.ink;
    ctx.save(); ctx.translate(tcx,dy); rect(ctx,-9,0,18,52,COL.ink,'#fff',2.4); ctx.beginPath(); ctx.moveTo(-9,52); ctx.lineTo(0,70); ctx.lineTo(9,52); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,-10,15,12-bulb*4,0,0,6.283); ctx.fillStyle=dcol===COL.ink?'#e3e8ef':dcol; ctx.globalAlpha=0.55; ctx.fill(); ctx.globalAlpha=1; ctx.stroke(); ctx.restore();

const PR={

    parts[4]=syncPop(parts[4],'Ar',Math.round(nAr*8),dt,ih/iw,0.09);
    if(R.solid){ for(let k=0;k<7;k++) rect(ctx,cx0+10+k*(cwid-24)/7+(k%2)*4,cBot-14-(k%2)*6,(cwid-24)/7-4,12,COL.ink,'#3a4a5e',1.6); }

    glass(ctx,cx0,cTop-6,cwid,cBot,COL.ink,3.4);

    textAt(ctx,'push',cx0+cwid/2-34,cTop-118,{align:'center',size:11,weight:700,color:COL.blue}); textAt(ctx,'gas',cx0+cwid/2+44,pY+70,{align:'left',size:11,weight:700,color:COL.red});
    textAt(ctx,R.eq,cx0+cwid/2,cBot+26,{align:'center',size:13,weight:700}); textAt(ctx,R.note,cx0+cwid/2,cBot+44,{align:'center',size:11,weight:700,color:COL.muted});

    line(ctx,X(0),ay-8,X(0),ay+24,COL.blue,3); textAt(ctx,'Kc',X(0),ay-12,{align:'center',size:11,weight:700,color:COL.blue});

    textAt(ctx,'Qc < Kc  forward →',X(-1.2),ay+40,{size:11,weight:700,color:COL.green}); textAt(ctx,'← reverse  Qc > Kc',X(1.2),ay+40,{align:'right',size:11,weight:700,color:COL.red});

/* =====================================================================
   6.9 TEMPERATURE CHANGES K   (Section 6.8.4, Fig. 6.9)
   Unlike concentration or pressure, temperature changes the value of K itself
   (van't Hoff):   ln K(T) = ln K(298) − (ΔH / R)(1/T − 1/298)
   2NO2(g) ⇌ N2O4(g)   ΔH = −57.2 kJ/mol  (exothermic)  Kc(298) = 1/(4.64×10⁻³) = 215
        cold → K rises → more colourless N2O4, brown fades
        hot  → K falls → more brown NO2
   [Co(H2O)6]²⁺ + 4Cl⁻ ⇌ [CoCl4]²⁻ + 6H2O   (endothermic, modelled with ΔH = +50 kJ/mol)
        heating → blue ; cooling → pink
   Two sealed tubes start together at room temperature, then are moved to the
   freezing mixture (−10 °C), room water or hot water (90 °C).
   ===================================================================== */
const TS={
  no2:{ eq:'2NO₂ (brown)  ⇌  N₂O₄ (colourless)', name:['NO₂','N₂O₄'], ty:['NO2','N2O4'], rx:{R:[[0,2]],P:[[1,1]]}, lnK298:Math.log(1/4.64e-3), dH:-57200, c0:0.02, endo:false },
  co :{ eq:'[Co(H₂O)₆]²⁺ (pink)  ⇌  [CoCl₄]²⁻ (blue)', name:['pink','blue'], ty:['CoP','CoB'], rx:{R:[[0,1]],P:[[1,1]]}, lnK298:Math.log(0.35), dH:50000, c0:1, endo:true },
};
const BATH=[{T:263,label:'freezing mixture',t:'−10 °C',col:'rgba(92,200,255,0.30)'},{T:298,label:'room water',t:'25 °C',col:'rgba(47,143,224,0.20)'},{T:363,label:'hot water',t:'90 °C',col:'rgba(217,67,43,0.22)'}];
function buildA9(){
  const wrap=labShell();
  const bath=id=>TG(id,[['0','Ice'],['1','Room'],['2','Hot']],'small');
  wrap.querySelector('.lab-side').innerHTML =
    CG(TG('sy',[['no2','NO₂ / N₂O₄'],['co','Cobalt complex']],'small'),'System')+
    CG(bath('bA'),'Tube A  →  beaker')+CG(bath('bB'),'Tube B  →  beaker')+
    RC([['tA','Tube A  T',null],['tB','Tube B  T',null],['kA','K  at A',null],['kB','K  at B',null],['vV','Rule',null,true]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let S=TS.no2, t=0;
  const Kof=(T)=>Math.exp(S.lnK298-(S.dH/R_GAS)*(1/T-1/298));
  const tube=[0,1].map(i=>({i,bath:1,idx:1,x:0,y:0,T:298,c:[S.c0,0],parts:[[],[]],started:false}));
  const goal=[1,1];
  function settle(tb){ tb.c=S.name.map((_,k)=>k?0:S.c0); const K=Kof(tb.T); for(let n=0;n<60;n++) relax(tb.c,S.rx,K,0.5,1.2); }
  function resetTubes(){ tube.forEach(tb=>{ tb.idx=1; goal[tb.i]=1; tb.T=298; tb.started=false; tb.parts=[[],[]]; settle(tb); }); [...wrap.querySelectorAll('#bA button,#bB button')].forEach(b=>b.classList.toggle('active',b.dataset.k==='1')); }
  toggleWire([...wrap.querySelectorAll('#sy button')],b=>{ S=TS[b.dataset.k]; resetTubes(); });
  toggleWire([...wrap.querySelectorAll('#bA button')],b=>{ goal[0]=+b.dataset.k; });
  toggleWire([...wrap.querySelectorAll('#bB button')],b=>{ goal[1]=+b.dataset.k; });
  [...wrap.querySelectorAll('#bA button,#bB button')].forEach(b=>b.classList.toggle('active',b.dataset.k==='1'));
  resetTubes();

  animLoop(dt=>{
    t+=dt;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const baseY=h*0.86, bTop=h*0.50, bw=w*0.15, bcx=[w*0.11,w*0.29,w*0.47], Lt=h*0.30, yDip=h*0.80, yUp=h*0.42;
    /* beakers */
    BATH.forEach((B,i)=>{
      const x0=bcx[i]-bw/2, lv=bTop+(baseY-bTop)*0.30;
      ctx.save(); ctx.beginPath(); ctx.rect(x0+1,lv-4,bw-2,baseY-lv+4); ctx.clip(); liquidFill(ctx,x0,x0+bw,lv,baseY,B.col,t+i,1.8,i===2?COL.red:COL.blue); ctx.restore();
      glass(ctx,x0,bTop,bw,baseY,COL.ink,3.2);
      if(i===0){ for(let k=0;k<5;k++){ const ix=x0+12+k*(bw-34)/4+Math.sin(t*1.4+k)*2, iy=lv+8+(k%2)*10+Math.cos(t*1.1+k*2)*2; ctx.save(); ctx.translate(ix,iy); ctx.rotate(0.4*k); rect(ctx,-7,-7,14,14,COL.blue,'rgba(255,255,255,0.7)',1.8); ctx.restore(); } }
      if(i===2){ for(let k=0;k<4;k++){ const sx=x0+14+k*(bw-28)/3, ph=(t*0.6+k*0.27)%1; ctx.save(); ctx.globalAlpha=1-ph; ctx.strokeStyle=COL.red; ctx.lineWidth=2; ctx.beginPath(); for(let yy=0;yy<40;yy+=3){ const px=sx+Math.sin(yy*0.2+t*5+k)*5; if(yy) ctx.lineTo(px,lv-8-ph*40-yy*0.5); else ctx.moveTo(px,lv-8-ph*40); } ctx.stroke(); ctx.restore(); } }
      textAt(ctx,B.label,bcx[i],baseY+20,{align:'center',size:11.5,weight:700,color:i===0?COL.blue:i===2?COL.red:COL.muted}); textAt(ctx,B.t,bcx[i],baseY+36,{align:'center',size:11.5,weight:700,color:COL.muted});
    });
    /* tubes: lift → carry → lower; they exchange heat with the bath only while dipped */
    tube.forEach(tb=>{
      const off=tb.i?14:-14, tx=bcx[goal[tb.i]]+off;
      if(!tb.started){ tb.x=bcx[tb.idx]+off; tb.y=yDip; tb.started=true; }
      const sameBath=tb.idx===goal[tb.i];
      let ty=yDip, tgx=bcx[tb.idx]+off;

      tb.y=approach(tb.y,ty,5.5,dt); tb.x=approach(tb.x,tgx,5.5,dt);
      if(!sameBath && Math.abs(tb.x-tx)<2 && tb.y<yUp+8) tb.idx=goal[tb.i];
      const dipped=tb.y>yDip-14, Tb=dipped?BATH[tb.idx].T:298;
      tb.T=approach(tb.T,Tb,dipped?0.9:0.15,dt);
      const K=Kof(tb.T); relax(tb.c,S.rx,K,dt,1.6);
    });
    tube.forEach(tb=>{
      const wt=22, x=tb.x, yTip=tb.y, yTop=yTip-Lt;
      const frac=S.endo?tb.c[1]/S.c0:(tb.c[0]/S.c0);                       // endo: blue fraction · exo: NO2 fraction
      // contents
      ctx.save(); ctx.beginPath(); ctx.moveTo(x-wt/2,yTop+14); ctx.lineTo(x-wt/2,yTip-wt/2); ctx.arc(x,yTip-wt/2,wt/2,Math.PI,0,true); ctx.lineTo(x+wt/2,yTop+14); ctx.closePath(); ctx.clip();
      if(S.endo){ ctx.fillStyle=mixCol('#e99ab8','#2f6fd0',tb.c[1]/S.c0); ctx.globalAlpha=0.75; ctx.fillRect(x-wt,yTop+Lt*0.30,wt*2,Lt); }
      else { ctx.fillStyle='rgba(150,70,18,'+clamp(frac*0.85,0,0.85)+')'; ctx.fillRect(x-wt,yTop,wt*2,Lt); }
      ctx.restore();
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(x-wt/2,yTop+14); ctx.lineTo(x-wt/2,yTip-wt/2); ctx.arc(x,yTip-wt/2,wt/2,Math.PI,0,true); ctx.lineTo(x+wt/2,yTop+14); ctx.stroke(); ctx.restore();
      rect(ctx,x-wt/2-2,yTop+4,wt+4,12,COL.ink,'#b9885a',2.2);               // stopper, sealed
      textAt(ctx,tb.i?'B':'A',x,yTop-6,{align:'center',size:13,weight:700,color:tb.i?COL.green:COL.red});
    });
    textAt(ctx,S.eq,w*0.29,h*0.07,{align:'center',size:12.5,weight:700});

    /* magnified molecules for each tube */
    const zw=w*0.18, zh=h*0.26, zx=[w*0.60,w*0.80], zy=h*0.08;
    tube.forEach(tb=>{
      const bx=zx[tb.i], c=tb.c, n0=S.endo?Math.round(c[0]/S.c0*22):Math.round(c[0]/S.c0*20), n1=S.endo?Math.round(c[1]/S.c0*22):Math.round(c[1]/S.c0*10);
      tb.parts[0]=syncPop(tb.parts[0],S.ty[0],n0,dt,zh/zw,0.09); tb.parts[1]=syncPop(tb.parts[1],S.ty[1],n1,dt,zh/zw,0.09);
      rrect(ctx,bx,zy,zw,zh,10); ctx.save(); ctx.fillStyle='#f6f9fc'; ctx.fill(); ctx.strokeStyle=tb.i?COL.green:COL.red; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
      tb.parts.forEach(arr=>arr.forEach(p=>drawMol(ctx,p.type,bx+8+p.u*(zw-16),zy+8+p.v*(zh-16),p.rot,0.72,p.al)));
      textAt(ctx,'Tube '+(tb.i?'B':'A')+'  '+Math.round(tb.T-273.15)+' °C',bx+zw/2,zy+zh+16,{align:'center',size:11.5,weight:700,color:tb.i?COL.green:COL.red});
    });
    legendRow(ctx,zx[0],zy+zh+36,[[S.name[0],S.endo?'#c4457a':COL.red],[S.name[1],S.endo?COL.blue:COL.blue]]);

    /* K against T */
    const gx=w*0.60, gy=h*0.52, gw=w*0.34, gh=h*0.26, TM=130, YM=6;
    const pts=[]; for(let T=250;T<=380;T+=5) pts.push([T-250,clamp(Math.log10(Kof(T))+2,0,YM)]);
    const m=chart(ctx,gx,gy,gw,gh,TM,YM,'T (K)','K',[{pts,col:COL.blue,w:3}],{xticks:[10,50,90,130],xfmt:v=>v+250,yticks:[0,2,4,6],yfmt:v=>v===2?'1':'10'+supNum(v-2)});
    tube.forEach(tb=>{ const T=clamp(tb.T,250,380); circ(ctx,m.X(T-250),m.Y(clamp(Math.log10(Kof(tb.T))+2,0,YM)),7,COL.ink,tb.i?COL.green:COL.red,2.2); });
    const KA=Kof(tube[0].T), KB=Kof(tube[1].T);
    set(wrap,'#tA',fmt(tube[0].T-273.15,0)+' °C'); set(wrap,'#tB',fmt(tube[1].T-273.15,0)+' °C');
    set(wrap,'#kA',sci(KA,2)); set(wrap,'#kB',sci(KB,2));
    set(wrap,'#vV',S.endo?'Endothermic: K rises with T → more blue when hot':'Exothermic: K falls as T rises → more brown NO₂ when hot');
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   ACTIVITIES + ROUTER
   --------------------------------------------------------------------- */
const ACT_DEF = [
  ['6.1', 'Vapour Pressure',    'Sealed box · mercury manometer',        'buildA1'],
  ['6.2', 'Dissolving',         'Sugar crystals · soda gas',             'buildA2'],
  ['6.3', 'Two Cylinders',      'Level steady · transfer never stops',   'buildA3'],
  ['6.4', 'Reaching Equilibrium','H₂ + I₂ ⇌ 2HI from either side',       'buildA4'],
  ['6.5', 'Which Way? Qc vs Kc','Reaction quotient decides',             'buildA5'],
  ['6.6', 'How Far? Kc',        'ICE table · PCl₅ ⇌ PCl₃ + Cl₂',         'buildA6'],
  ['6.7', 'Concentration',      'Add · remove · Le Chatelier',           'buildA7'],
  ['6.8', 'Pressure & Inert Gas','Squeeze the piston · add argon',       'buildA8'],
  ['6.9', 'Temperature',        'NO₂ / N₂O₄ and cobalt tubes',           'buildA9'],
  ['6.10','Catalyst',           'Faster · same equilibrium',             'buildA10'],
  ['6.11','Acid Ionisation & pH','Strong · weak · dilute',               'buildA11'],
  ['6.12','Buffer',             'Acid in · pH hardly moves',             'buildA12'],
  ['6.13','Solubility Product', 'Ksp · common-ion effect',               'buildA13'],
];
const activities = ACT_DEF.filter(d=>typeof window[d[3]]==='function').map(d=>({num:d[0],title:d[1],desc:d[2],build:window[d[3]]}));
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
render();
</script>
