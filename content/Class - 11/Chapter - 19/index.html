<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 11 · Chapter 6 — Equilibrium | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

<script>
/* =========================================================================
   GRADE 11 — CHAPTER 6: EQUILIBRIUM
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn object eases, springs or is integrated toward it every
   frame. Chemistry is driven by the real relations (Antoine vapour pressure,
   Henry's law, rate-law relaxation to Kc, Qc vs Kc, van't Hoff, Arrhenius,
   Henderson–Hasselbalch, Ksp) and checked against the textbook's own worked
   problems (see CHECK comments).
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};
const R_GAS = 8.314;

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.stroke();} ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function sgn(x,d){ return (x>0.0005?'+':x<-0.0005?'−':'')+fmt(Math.abs(x),d); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
function sciK(K){
  if(!isFinite(K)) return '∞'; if(K<=0) return '0';
  if(K>=0.01&&K<1000) return fmt(K,K<1?3:1);
  const e=Math.floor(Math.log10(K)), m=K/Math.pow(10,e);
  const es=String(e).split('').map(c=>c==='-'?'⁻':SUP[+c]).join('');
  return fmt(m,1)+'×10'+es;
}

/* thermometer: frac 0→1 fills the column */
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  if(inten<=0.01) return;
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}
/* travelling wavy arrow = heat flow (red). t animates the wave along the path */
function heatArrow(ctx,x1,y1,x2,y2,t,alpha,color){
  color=color||COL.red;
  const L=Math.hypot(x2-x1,y2-y1); if(L<12) return;
  const ux=(x2-x1)/L, uy=(y2-y1)/L, nx=-uy, ny=ux, amp=3.2, wl=15;
  const a=clamp(alpha===undefined?1:alpha,0,1);
  ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle=color; ctx.lineWidth=2.4; ctx.lineCap='round';
  ctx.beginPath();
  for(let s=0;s<=L-8;s+=2){ const o=Math.sin((s/wl-t*3)*Math.PI*2)*amp; const px=x1+ux*s+nx*o, py=y1+uy*s+ny*o; if(s) ctx.lineTo(px,py); else ctx.moveTo(px,py); }
  ctx.stroke(); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,9); ctx.restore();
}
function bar(ctx,x,y,w,h,frac,color,bg){ rect(ctx,x,y,w,h,COL.ink,bg||'#f6f9fc',1.6); if(frac>0) rect(ctx,x+1,y+1,(w-2)*clamp(frac,0,1),h-2,color,color,0); }
/* read-out chip drawn on the canvas */
function chip(ctx,x,y,txt,col,align){
  ctx.save(); ctx.font='700 12px Poppins, sans-serif'; const tw=ctx.measureText(txt).width+14; ctx.restore();
  const bx=align==='center'?x-tw/2:align==='right'?x-tw:x;
  ctx.save(); rrect(ctx,bx,y-15,tw,22,7); ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore();
  textAt(ctx,txt,bx+7,y+1,{size:12,weight:700,color:col});
  return tw;
}

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
let activeTicks = [];   // exposed as window.__sim so the physics can be stepped deterministically in tests
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; activeTicks=[]; }
window.__sim = (seconds,step)=>{ step=step||0.02; for(let t=0;t<seconds;t+=step) activeTicks.forEach(f=>f(step)); };
function animLoop(tick){
  let last = performance.now();
  let raf;
  activeTicks.push(tick);
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now;
    tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}
function labShell(){
  const wrap=document.createElement('div'); wrap.className='lab-view';

function sci(x,d){                       // 0.0042 → 4.2×10⁻³ ;  3.2 → 3.2
  if(!isFinite(x)) return '∞'; if(x===0) return '0';
  const ax=Math.abs(x); d=d===undefined?2:d;
  if(ax>=0.01&&ax<1000) return fmt(x,ax<1?3:(ax<10?2:1));
  const e=Math.floor(Math.log10(ax)), m=x/Math.pow(10,e);
  return fmt(m,d-1)+'×10'+String(e).split('').map(c=>c==='-'?'⁻':SUP[+c]).join('');
}

function drawMol(ctx,type,x,y,ang,s,alpha){
  const m=MOLS[type]; if(!m) return; s=s||1;
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang||0); ctx.scale(s,s); if(alpha!==undefined) ctx.globalAlpha=alpha;
  if(m.a.length===2){ ctx.strokeStyle=COL.ink; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(m.a[0][0],m.a[0][1]); ctx.lineTo(m.a[1][0],m.a[1][1]); ctx.stroke(); }
  m.a.forEach(([dx,dy,r,st,fl])=>circ(ctx,dx,dy,r,st,fl,1.7));
  if(m.plus||m.minus){ ctx.strokeStyle=m.plus?COL.red:COL.blue; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(-3,0); ctx.lineTo(3,0); if(m.plus){ ctx.moveTo(0,-3); ctx.lineTo(0,3);} ctx.stroke(); }
  ctx.restore();
}
/* wandering particles in a rectangle (u,v in px); returns array growth is up to caller */
function newP(type,x0,y0,x1,y1){ return {type,x:x0+Math.random()*(x1-x0),y:y0+Math.random()*(y1-y0),a:Math.random()*6.283,rot:Math.random()*6.283,w:(Math.random()-0.5)*3,life:0}; }
function stepP(arr,dt,speed,x0,y0,x1,y1){
  arr.forEach(p=>{
    p.a+=(Math.random()-0.5)*5*dt; p.rot+=p.w*dt; p.life+=dt;
    p.x+=Math.cos(p.a)*speed*dt; p.y+=Math.sin(p.a)*speed*dt;
    if(p.x<x0){ p.x=x0; p.a=Math.PI-p.a; } if(p.x>x1){ p.x=x1; p.a=Math.PI-p.a; }
    if(p.y<y0){ p.y=y0; p.a=-p.a; } if(p.y>y1){ p.y=y1; p.a=-p.a; }
  });
}
/* keep a population of drifting molecules (unit-box coords u,v) at an integer target; they fade in and out */
function syncPop(arr,ty,target,dt,aspect,spd){
  const live=arr.filter(p=>!p.dying);
  if(live.length<target){ const p=newP(ty,0,0,1,1); p.u=Math.random(); p.v=Math.random(); p.al=0; arr.push(p); }
  else if(live.length>target){ live[Math.floor(Math.random()*live.length)].dying=true; }
  spd=spd||0.07; aspect=aspect||1;
  arr.forEach(p=>{ p.a+=(Math.random()-0.5)*5*dt; p.rot+=p.w*dt; p.u+=Math.cos(p.a)*spd*dt*aspect; p.v+=Math.sin(p.a)*spd*dt;
    if(p.u<0.04){ p.u=0.04; p.a=Math.PI-p.a; } if(p.u>0.96){ p.u=0.96; p.a=Math.PI-p.a; } if(p.v<0.05){ p.v=0.05; p.a=-p.a; } if(p.v>0.95){ p.v=0.95; p.a=-p.a; }
    p.al=clamp((p.al===undefined?1:p.al)+(p.dying?-dt*2.5:dt*2.5),0,1); });
  return arr.filter(p=>!(p.dying&&p.al<=0));
}
/* soft wavy liquid fill: rectangle x0..x1, surface yTop, floor yBot */
function liquidFill(ctx,x0,x1,yTop,yBot,fill,t,amp,edge){
  if(yBot-yTop<1) return;
  ctx.save(); ctx.beginPath(); ctx.moveTo(x0,yBot);
  for(let x=x0;x<=x1;x+=4) ctx.lineTo(x,yTop+Math.sin(x*0.07+t*2.2)*(amp||1.6));
  ctx.lineTo(x1,yBot); ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
  if(edge){ ctx.strokeStyle=edge; ctx.lineWidth=1.8; ctx.beginPath(); for(let x=x0;x<=x1;x+=4){ const y=yTop+Math.sin(x*0.07+t*2.2)*(amp||1.6); if(x===x0) ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.stroke(); }
  ctx.restore();
}
/* glass: open-top vessel outline */
function glass(ctx,x,yTop,w,yBot,col,lw){
  ctx.save(); ctx.strokeStyle=col||COL.ink; ctx.lineWidth=lw||3; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,yTop); ctx.lineTo(x,yBot-8); ctx.quadraticCurveTo(x,yBot,x+8,yBot); ctx.lineTo(x+w-8,yBot); ctx.quadraticCurveTo(x+w,yBot,x+w,yBot-8); ctx.lineTo(x+w,yTop); ctx.stroke(); ctx.restore();
}

/* ---------- rate-law equilibrium engine ----------
   A reaction is {R:[[i,ν],…], P:[[i,ν],…]}; c is an array of concentrations.
   Q = Π cP^ν / Π cR^ν  (pure solids/liquids simply are not listed).        */
function logQ(c,rx){ let s=0; rx.P.forEach(([i,n])=>s+=n*Math.log(Math.max(c[i],1e-300))); rx.R.forEach(([i,n])=>s-=n*Math.log(Math.max(c[i],1e-300))); return s; }
function Qof(c,rx){ return Math.exp(clamp(logQ(c,rx),-690,690)); }
/* extent dξ (may be negative) that takes the mixture c to Q = K  (exact, by bisection) */
function eqShift(c,rx,K){
  let lo=-Infinity, hi=Infinity;
  rx.R.forEach(([i,n])=>hi=Math.min(hi,c[i]/n)); rx.P.forEach(([i,n])=>lo=Math.max(lo,-c[i]/n));
  if(!isFinite(lo)) lo=-hi-1; if(!isFinite(hi)) hi=-lo+1;
  const lnK=Math.log(K), d=c.slice();
  const f=x=>{ rx.R.forEach(([i,n])=>d[i]=c[i]-n*x); rx.P.forEach(([i,n])=>d[i]=c[i]+n*x); return logQ(d,rx)-lnK; };
  let a=lo, b=hi;
  for(let k=0;k<90;k++){ const m=(a+b)/2; if(f(m)<0) a=m; else b=m; }
  return (a+b)/2;
}
function applyShift(c,rx,x){ rx.R.forEach(([i,n])=>c[i]=Math.max(0,c[i]-n*x)); rx.P.forEach(([i,n])=>c[i]=Math.max(0,c[i]+n*x)); }
/* Advance c toward equilibrium for dt seconds using the true rate-law shape.
   rf = Rex·Π(cR/ceR)^ν   rr = Rex·Π(cP/ceP)^ν   (rf = rr at equilibrium, kr/kf = K).
   Rex is set so that the linear relaxation time near equilibrium is tau.
   Returns {rf,rr} (in M s⁻¹). */
function relax(c,rx,K,dt,tau){
  const dx=eqShift(c,rx,K), ce=c.slice(); applyShift(ce,rx,dx);
  const ctot=ce.reduce((a,b)=>a+b,0)||1;
  let sum=0; rx.R.forEach(([i,n])=>sum+=n*n/Math.max(ce[i],1e-9*ctot)); rx.P.forEach(([i,n])=>sum+=n*n/Math.max(ce[i],1e-9*ctot));
  const Rex=1/(tau*sum);
  const rates=cc=>{ let rf=Rex, rr=Rex; rx.R.forEach(([i,n])=>rf*=Math.pow(Math.max(cc[i],0)/Math.max(ce[i],1e-300),n)); rx.P.forEach(([i,n])=>rr*=Math.pow(Math.max(cc[i],0)/Math.max(ce[i],1e-300),n)); return [rf,rr]; };
  let left=dx, rem=dt, g=0, rf=0, rr=0;
  while(rem>1e-9 && g++<60 && Math.abs(left)>1e-15*ctot){
    [rf,rr]=rates(c); let r=rf-rr; if(!isFinite(r)) break;
    if(Math.sign(r)!==Math.sign(left)) r=Math.sign(left)*Math.abs(r)*0.0;       // never run away from equilibrium
    if(r===0) break;
    const step=Math.min(rem, 0.3*Math.abs(left)/Math.abs(r));
    let x=r*step; if(Math.abs(x)>Math.abs(left)) x=left;
    applyShift(c,rx,x); left-=x; rem-=step;
  }
  [rf,rr]=rates(c);
  return {rf,rr};
}

/* =====================================================================
   6.1 VAPOUR PRESSURE IN A CLOSED BOX   (Section 6.1.2, Fig. 6.1)
   Water (or another liquid) in a watch-glass inside a sealed, dried box with
   a mercury manometer.  Evaporation is steady; condensation grows with the
   vapour present, so  dp/dt = (p_sat − p)/τ  until the two rates are equal.
   p_sat from the Antoine equation  log10 P(mmHg) = A − B/(T + C).
   CHECK: water 25 °C → 23.8 mmHg = 3.17 kPa · ether 25 °C → 534 mmHg = 71 kPa.
   An open box leaks vapour out faster than it forms: equilibrium is never reached.
   ===================================================================== */
const LIQ={
  water  :{name:'Water',  A:8.07131,B:1730.63, C:233.426,col:COL.blue,  fill:'rgba(47,143,224,0.30)', bp:100},
  ethanol:{name:'Ethanol',A:8.20417,B:1642.89, C:230.300,col:COL.green, fill:'rgba(31,157,85,0.26)',  bp:78},
  acetone:{name:'Acetone',A:7.11714,B:1210.595,C:229.664,col:COL.yellow,fill:'rgba(217,160,23,0.30)', bp:56},
  ether  :{name:'Ether',  A:6.92032,B:1064.07, C:228.8,  col:COL.red,   fill:'rgba(217,67,43,0.26)',  bp:35},
};
const psatMm=(L,T)=>Math.pow(10,L.A-L.B/(T+L.C));
function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    CG(TG('liq',[['water','Water'],['ethanol','Ethanol'],['acetone','Acetone'],['ether','Ether']],'small'),'Liquid in the dish')+
    SL('tR','Temperature',10,50,1,25)+
    CG(TG('lid',[['sealed','Sealed box'],['open','Open to room']],'small'),'Lid')+
    CG('<button class="toggle-btn navy" id="dry" style="margin-top:0">↺ Dry the box · start again</button>')+
    RC([['pV','Vapour pressure p','var(--f-green)'],['psV','p at equilibrium',null],['eqV','Condensation ÷ evaporation',null,true]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), tR=$('#tR');
  let L=LIQ.water, open=false, t=0, hT=0, hAcc=0, hist=[], mols=[], rings=[];
  const Td={x:25}, st={p:0,ev:0,level:1}, hg={x:0,v:0}, lid={x:0};
  function reset(){ st.p=0; st.ev=0; st.level=1; mols.length=0; hist=[]; hT=0; hAcc=0; hg.x=0; hg.v=0; }
  toggleWire([...wrap.querySelectorAll('#liq button')],b=>{
    L=LIQ[b.dataset.k]; tR.max=Math.min(50,L.bp-4); if(+tR.value>+tR.max) tR.value=tR.max; reset(); });
  toggleWire([...wrap.querySelectorAll('#lid button')],b=>{ open=b.dataset.k==='open'; });
  $('#dry').onclick=reset;

  animLoop(dt=>{
    t+=dt; hT+=dt;
    const Ts=parseFloat(tR.value); Td.x=approach(Td.x,Ts,3,dt); $('#tRV').textContent=Ts+' °C';
    const ps=psatMm(L,Td.x), liquid=st.level>0.002, tau=4, leak=0.25;
    // pressure: steady evaporation in, condensation (∝ p) and leakage out
    st.p=Math.max(0,st.p+(((liquid?ps:0)-st.p)/tau-(open?st.p/leak:0))*dt);
    const netEv=liquid?Math.max(0,(ps-st.p)/tau):0;
    st.ev+=netEv*dt; st.level=clamp(1-st.ev/600,0,1);
    lid.x=approach(lid.x,open?1:0,5,dt);
    springTo(hg,st.p,34,8.5,dt);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const bx0=w*0.075, bx1=w*0.55, by0=h*0.12, floor=h*0.60;
    const dw=(bx1-bx0)*0.34, dcx=(bx0+bx1)/2, rimY=floor-17;
    const surf=floor-3-14*st.level;

    /* ---------- molecules: births at the surface, deaths back into it ---------- */
    const psK=ps*0.13332, neq=Math.max(psK*1.1,0.05), birth=liquid?neq/tau:0;
    if(Math.random()<birth*dt && mols.length<120){
      const sp=70+Td.x*1.6; const a=-Math.PI/2+(Math.random()-0.5)*1.6;
      mols.push({x:dcx+(Math.random()-0.5)*dw*0.8,y:surf-3,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,mode:'fly',rot:Math.random()*6.283}); }
    mols.forEach(m=>{
      if(m.mode==='fly'){
        if(Math.random()<dt/tau) m.mode='sink'; else if(open&&lid.x>0.5&&Math.random()<dt/leak) m.mode='esc';
        m.x+=m.vx*dt; m.y+=m.vy*dt; m.rot+=dt*3;
        if(m.x<bx0+4){ m.x=bx0+4; m.vx=Math.abs(m.vx); } if(m.x>bx1-4){ m.x=bx1-4; m.vx=-Math.abs(m.vx); }
        if(m.y<by0+4&&!(open&&lid.x>0.5)){ m.y=by0+4; m.vy=Math.abs(m.vy); } if(m.y>floor-30){ m.y=floor-30; m.vy=-Math.abs(m.vy); }
        if(open&&lid.x>0.5&&m.y<by0-30) m.dead=true;
      } else if(m.mode==='sink'){
        const dx=dcx-m.x, dy=surf-m.y, d=Math.hypot(dx,dy)||1; m.x+=dx/d*190*dt; m.y+=dy/d*190*dt;
        if(d<8){ m.dead=true; rings.push({x:m.x,y:surf,u:0}); }
      } else { const dx=dcx-m.x, dy=by0-40-m.y, d=Math.hypot(dx,dy)||1; m.x+=dx/d*210*dt; m.y+=dy/d*210*dt; if(d<10) m.dead=true; }
    });
    mols=mols.filter(m=>!m.dead); rings.forEach(r=>r.u+=dt*2.5); rings=rings.filter(r=>r.u<1);

    /* ---------- box ---------- */
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(bx0,by0); ctx.lineTo(bx0,floor); ctx.lineTo(bx1,floor); ctx.lineTo(bx1,by0); ctx.stroke();
    ctx.fillStyle='rgba(238,242,248,0.5)'; ctx.fillRect(bx0,by0,bx1-bx0,floor-by0); ctx.restore();
    // lid slides up and away

    rect(ctx,lx-3,ly-6,(bx1-bx0)+6,8,COL.ink,'#dfe7f1',2.4);
    // dish + liquid
    ctx.save(); ctx.beginPath(); ctx.moveTo(dcx-dw/2,rimY); ctx.quadraticCurveTo(dcx-dw/2+4,floor-1,dcx,floor-1); ctx.quadraticCurveTo(dcx+dw/2-4,floor-1,dcx+dw/2,rimY); ctx.closePath(); ctx.clip();
    liquidFill(ctx,dcx-dw/2,dcx+dw/2,surf,floor,L.fill,t,1.2,L.col);
    for(let i=0;i<12;i++){ const u=(i*0.618+t*0.07*(1+i%3))%1; circ(ctx,dcx-dw/2+8+u*(dw-16),surf+5+((i*7)%9)+Math.sin(t*3+i)*1.4,2.3,L.col,null,1.2); }
    ctx.restore();
    ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(dcx-dw/2,rimY); ctx.quadraticCurveTo(dcx-dw/2+4,floor-1,dcx,floor-1); ctx.quadraticCurveTo(dcx+dw/2-4,floor-1,dcx+dw/2,rimY); ctx.stroke(); ctx.restore();
    rings.forEach(r=>{ ctx.save(); ctx.globalAlpha=1-r.u; ctx.strokeStyle=L.col; ctx.lineWidth=1.6; ctx.beginPath(); ctx.ellipse(r.x,r.y,4+r.u*14,1.5+r.u*4,0,0,6.283); ctx.stroke(); ctx.restore(); });
    mols.forEach(m=>{ circ(ctx,m.x,m.y,3.6,L.col,'#fff',1.8); if(m.mode==='sink') line(ctx,m.x,m.y,m.x+(dcx-m.x)*-0.08,m.y-9,L.col,1.2); });
    textAt(ctx,L.name+' (l)  ⇌  '+L.name+' (vapour)',(bx0+bx1)/2,floor+24,{align:'center',size:12,weight:700,color:L.col});
    if(open&&lid.x>0.5) textAt(ctx,'vapour escapes — open system',(bx0+bx1)/2,by0-46,{align:'center',size:12,weight:700,color:COL.red});
    // thermometer
    thermo(ctx,bx0-22,by0+10,floor-18,clamp((Td.x-0)/60,0,1),COL.ink,COL.red);
    textAt(ctx,Math.round(Td.x)+' °C',bx0-22,floor+22,{align:'center',size:11,weight:700,color:COL.red});

    /* ---------- manometer (mercury U-tube) ---------- */
    const xL=w*0.625, xR=w*0.725, yTop=h*0.12, yBot=h*0.80, yM0=h*0.50, pxmm=h*0.00066, tw=15, xm=(xL+xR)/2, rr=(xR-xL)/2;
    const dL=hg.x/2*pxmm, yl=yM0+dL, yr=yM0-dL;

    const Upath=()=>{ ctx.beginPath(); ctx.moveTo(xL,yTop+14); ctx.lineTo(xL,yBot); ctx.arc(xm,yBot,rr,Math.PI,0,true); ctx.lineTo(xR,yTop); };
    ctx.save(); ctx.lineJoin='round'; Upath(); ctx.strokeStyle=COL.ink; ctx.lineWidth=tw+5; ctx.stroke(); Upath(); ctx.strokeStyle='#fff'; ctx.lineWidth=tw-1; ctx.stroke();
    // mercury: clip to "below the level" in each limb

    Upath(); ctx.strokeStyle='#b7c4d6'; ctx.lineWidth=tw-2; ctx.stroke(); ctx.restore();
    line(ctx,xL-tw/2,yl,xL+tw/2,yl,COL.ink,2); line(ctx,xR-tw/2,yr,xR+tw/2,yr,COL.ink,2);
    line(ctx,xL+tw/2+3,yl,xR+tw/2+22,yl,COL.mid,1.2,[4,4]); line(ctx,xR+tw/2+3,yr,xR+tw/2+22,yr,COL.mid,1.2,[4,4]);
    if(hg.x>6) dimArrow(ctx,xR+tw/2+18,yr,yl);

    /* ---------- rates ---------- */
    const rx=w*0.905, rt=h*0.18, rb=h*0.66, rw=24, rmax=Math.max(ps,60)*1.1;
    const evH=(rb-rt)*clamp(liquid?ps/rmax:0,0,1), cdH=(rb-rt)*clamp(st.p/rmax,0,1);
    rect(ctx,rx-rw-6,rt,rw,rb-rt,COL.ink,'#f6f9fc',2); rect(ctx,rx-rw-5,rb-evH,rw-2,evH,COL.red,COL.red,0);
    rect(ctx,rx+6,rt,rw,rb-rt,COL.ink,'#f6f9fc',2); rect(ctx,rx+7,rb-cdH,rw-2,cdH,COL.blue,COL.blue,0);
    textAt(ctx,'evap.',rx-rw/2-6,rt-8,{align:'center',size:11,weight:700,color:COL.red}); textAt(ctx,'cond.',rx+6+rw/2,rt-8,{align:'center',size:11,weight:700,color:COL.blue});
    const ratio=liquid&&ps>0?st.p/ps:0, eq=liquid&&ratio>0.985&&!open;
    if(eq){ chip(ctx,rx,rb+30,'equal  =  equilibrium',COL.green,'center'); }

    /* ---------- p against time ---------- */
    hAcc+=dt; if(hAcc>0.12){ hAcc=0; hist.push([hT,st.p]); if(hist.length>700) hist.shift(); }
    const W=40, w0=Math.max(0,hT-W), ymax=Math.max(ps*1.18,40);
    const pts=hist.filter(p=>p[0]>=w0).map(p=>[p[0]-w0,p[1]]);
    const gx=bx0+10, gy=h*0.72, gw=bx1-bx0-10, gh=h*0.17;
    const m=chart(ctx,gx,gy,gw,gh,W,ymax,'time','p (mmHg)',[{pts:[[0,liquid?ps:0],[W,liquid?ps:0]],col:COL.mid,w:1.6,dash:[6,5]},{pts,col:COL.green,w:3}],{yticks:[0,Math.round(ymax/2/10)*10,Math.round(ymax/10)*10]});
    textAt(ctx,'p at equilibrium',gx+gw-2,m.Y(ps)-5,{align:'right',size:10,weight:700,color:COL.mid});

    $('#pV').textContent=fmt(st.p*0.13332,1)+' kPa'; $('#psV').textContent=fmt(ps*0.13332,1)+' kPa';
    $('#eqV').textContent=open?fmt(ratio*100,0)+' %  (leaking — never equal)':fmt(ratio*100,0)+' %'+(eq?'  ✓ equilibrium':'');
  });
  return wrap;
}

/* =====================================================================
   6.10 A CATALYST   (Section 6.8.5)
   A catalyst opens a lower-energy path: it cuts the activation energy of the
   forward AND the reverse step by the same amount, so both rate constants
   (Arrhenius  k = A·e^(−Ea/RT)) grow by the same factor  e^(Δ/RT)  and
   K = kf / kr  does not move.  Equilibrium is reached sooner — not shifted.
   Model reaction: Ea(fwd) = 60 kJ, ΔH = −30 kJ  (Ea(rev) = 90 kJ), ΔS = −48 J/K  (K = 4.2 at 500 K).
   CHECK: Δ = 15 kJ at 500 K speeds both directions up ×e^(15000/(8.314·500)) = ×37;
          K = e^(−ΔG/RT) is identical with and without catalyst.
   ===================================================================== */
function buildA10(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    SL('cat','Catalyst',0,100,1,0)+SL('tR','Temperature',400,600,10,500)+
    CG('<button class="toggle-btn navy" id="rs" style="margin-top:0">↺ Restart · all reactant</button>')+
    RC([['eaf','Ea  forward',null],['ear','Ea  reverse',null],['kV','K  (same either way)','var(--f-blue)'],['spV','Rates ×',null]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), catR=$('#cat'), tR=$('#tR');
  const EAF=60e3, DH=-30e3, DS=-48, DMAX=15e3, M=30;
  const kOf=(T,dl)=>{ const kr=Math.exp(-(EAF-DH-dl)/(R_GAS*T)), kf=Math.exp(DS/R_GAS)*Math.exp(-(EAF-dl)/(R_GAS*T)); return [kf,kr]; };
  const base=kOf(500,0), A=1/(14*(base[0]+base[1]));          // 14 s relaxation at 500 K without catalyst
  let balls=[], listR=[], listP=[], f={x:0}, fg={x:0}, hist=[], hT=0, hAcc=0, t=0;
  function init(){ balls=[]; listR=[]; listP=[]; for(let i=0;i<M;i++){ const b={loc:'R',x:0.2,y:0,fly:null,placed:false,j:Math.random()*6.28}; balls.push(b); listR.push(b); } f.x=0; fg.x=0; hist=[]; hT=0; }
  $('#rs').onclick=init; init();
  animLoop(dt=>{
    t+=dt; hT+=dt;
    const T=+tR.value, dl=(+catR.value)/100*DMAX; $('#tRV').textContent=T+' K'; $('#catV').textContent=Math.round(+catR.value)+' %';
    const [kf0,kr0]=kOf(T,0), [kf1,kr1]=kOf(T,dl), kf=A*kf1, kr=A*kr1, gf=A*kf0, gr=A*kr0;
    const K=kf0/kr0, feq=K/(1+K);
    // analytic fraction of product (clean curves for the chart), integrated with sub-steps
    const sub=Math.max(1,Math.ceil(dt*Math.max(kf+kr,gf+gr)/0.2));
    for(let s=0;s<sub;s++){ const h=dt/sub; f.x+=(kf*(1-f.x)-kr*f.x)*h; fg.x+=(gf*(1-fg.x)-gr*fg.x)*h; }
    // the balls hop over the barrier with the real rates
    balls.forEach(b=>{ if(b.fly) return;
      if(b.loc==='R' && Math.random()<kf*dt){ listR.splice(listR.indexOf(b),1); listP.push(b); b.loc='P'; b.fly={u:0,x0:b.x}; }
      else if(b.loc==='P' && Math.random()<kr*dt){ listP.splice(listP.indexOf(b),1); listR.push(b); b.loc='R'; b.fly={u:0,x0:b.x}; } });
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    /* ---- energy profile ---- */
    const px=w*0.06, pw=w*0.54, py=h*0.12, ph=h*0.64, Emax=100, Emin=-45;
    const Y=E=>py+ph*(Emax-E)/(Emax-Emin), Xp=x=>px+pw*x;
    const ER=0, EP=DH/1000, Ea=(EAF-dl)/1000, amp=Ea-(EP-ER)/2;
    const prof=x=>{ const sm=x<=0?0:x>=1?1:x*x*(3-2*x); return ER+(EP-ER)*sm+amp*Math.exp(-Math.pow((x-0.5)/0.15,2)); };
    ctx.save(); ctx.beginPath(); for(let i=0;i<=120;i++){ const x=i/120, X=Xp(x), Yy=Y(prof(x)); if(i) ctx.lineTo(X,Yy); else ctx.moveTo(X,Yy); } ctx.strokeStyle=dl>0.5e3?COL.green:COL.ink; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.stroke(); ctx.restore();
    // ghost: uncatalysed hill
    if(dl>0.5e3){ ctx.save(); ctx.beginPath(); const am0=EAF/1000-(EP-ER)/2; for(let i=0;i<=120;i++){ const x=i/120, sm=x*x*(3-2*x), yy=Y(ER+(EP-ER)*sm+am0*Math.exp(-Math.pow((x-0.5)/0.15,2))); if(i) ctx.lineTo(Xp(x),yy); else ctx.moveTo(Xp(x),yy); } ctx.setLineDash([6,5]); ctx.strokeStyle=COL.mid; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); }
    line(ctx,px,Y(0),px+pw*0.30,Y(0),COL.mid,1.2,[5,4]); line(ctx,px+pw*0.70,Y(EP),px+pw,Y(EP),COL.mid,1.2,[5,4]);
    // Ea and ΔH dimensions
    const peakY=Y(prof(0.5)); dimArrow(ctx,Xp(0.5),Y(0),peakY); chip(ctx,Xp(0.5)+10,(Y(0)+peakY)/2+4,'Ea = '+fmt(Ea,0)+' kJ',COL.red,'left');
    dimArrow(ctx,Xp(1)+14,Y(0),Y(EP)); chip(ctx,Xp(1)+22,Y(0)-14,'ΔH = −30',COL.blue,'right');
    textAt(ctx,'reactants',Xp(0.17),Y(ER)+Math.max(40,0)+10,{align:'center',size:13,weight:700,color:COL.red}); textAt(ctx,'products',Xp(0.83),Y(EP)+46,{align:'center',size:13,weight:700,color:COL.green});
    textAt(ctx,'energy',px-2,py-8,{size:11,weight:700}); textAt(ctx,'reaction path',px+pw,py+ph+30,{align:'right',size:11,weight:700});
    line(ctx,px-6,py+ph+2,px+pw+8,py+ph+2,COL.ink,2); arrowHead(ctx,px+pw+8,py+ph+2,0,COL.ink,7); line(ctx,px-6,py+ph+2,px-6,py-4,COL.ink,2); arrowHead(ctx,px-6,py-4,-Math.PI/2,COL.ink,7);
    // balls
    const rad=6.4;
    const slot=(k,cx)=>{ const per=7; const row=Math.floor(k/per), col=k%per; return cx+((col-(per-1)/2)*0.0285+(row%2)*0.012); };
    const slotY=(k,x)=>{ const row=Math.floor(k/7); return Y(prof(x))-rad-row*rad*1.9; };
    const jit=0.5+(T-400)/200*1.6;
    balls.forEach(b=>{
      const list=b.loc==='R'?listR:listP, k=list.indexOf(b), cx=b.loc==='R'?0.17:0.83;
      const sx=slot(k,cx);
      if(b.fly){ b.fly.u+=dt/0.62; const u=Math.min(1,b.fly.u), e=u*u*(3-2*u); b.x=lerp(b.fly.x0,sx,e); b.y=Y(prof(b.x))-rad-Math.sin(u*Math.PI)*10; if(u>=1){ b.fly=null; } }
      else { b.x=approach(b.x,sx,12,dt); b.y=slotY(k,b.x)+Math.sin(t*(6+b.j)+b.j*3)*jit; }
      circ(ctx,Xp(b.x),b.y,rad,b.loc==='P'?COL.green:COL.red,b.loc==='P'?'#e4f7ec':'#fdece7',2);
    });
    textAt(ctx,'at equilibrium  '+fmt(feq*100,0)+' % products',px+pw/2,py+ph+54,{align:'center',size:12,weight:700,color:COL.muted});

    /* ---- fraction of product against time ---- */
    hAcc+=dt; if(hAcc>0.1){ hAcc=0; hist.push([hT,f.x,fg.x]); if(hist.length>1000) hist.shift(); }
    const W=40, w0=Math.max(0,hT-W), view=hist.filter(p=>p[0]>=w0);
    const gx=w*0.70, gw=w*0.26, gy=h*0.14, gh=h*0.46;
    chart(ctx,gx,gy,gw,gh,W,1,'time','fraction of products',[{pts:[[0,feq],[W,feq]],col:COL.blue,w:1.6,dash:[6,4]},{pts:view.map(p=>[p[0]-w0,p[2]]),col:COL.mid,w:2.4,dash:[7,5]},{pts:view.map(p=>[p[0]-w0,p[1]]),col:COL.green,w:3.2}],{yticks:[0,0.5,1],yfmt:v=>fmt(v,1)});
    legendRow(ctx,gx,gy+gh+46,[['catalysed',COL.green],['no catalyst',COL.mid]]); textAt(ctx,'same plateau  =  same K',gx+gw,gy+gh+66,{align:'right',size:11,weight:700,color:COL.blue});

    set(wrap,'#eaf',fmt(Ea,0)+' kJ'); set(wrap,'#ear',fmt(Ea-DH/1000,0)+' kJ'); set(wrap,'#kV',sci(K,3)); set(wrap,'#spV','× '+fmt(Math.exp(dl/(R_GAS*T)),0));
  });
  return wrap;
}

/* =====================================================================
   6.11 ACID IONISATION AND pH   (Sections 6.11.1–6.11.3, Table 6.5, 6.6, Fig. 6.11)
   HA + H2O ⇌ H3O⁺ + A⁻        Ka = [H⁺][A⁻] / [HA]        pH = −log[H⁺]
   [H⁺] is found exactly from charge balance   [H⁺] = [A⁻] + Kw/[H⁺],
   [A⁻] = c·Ka/(Ka + [H⁺])   (so very dilute acids feel water's own 10⁻⁷ M).
   Adding water lowers c and RAISES the degree of ionisation α of a weak acid.
   CHECK (Problem 6.18): HF, Ka = 3.2×10⁻⁴, c = 0.02 M → α = 0.12, [H⁺] = 2.4×10⁻³ M, pH = 2.62.
         (Problem 6.17): 1.0×10⁻⁸ M HCl → pH = 6.98.
   ===================================================================== */
const ACIDS={
  hcl:{n:'HCl',     Ka:1e7},     hf:{n:'HF',Ka:3.2e-4}, hcooh:{n:'HCOOH',Ka:1.8e-4},
  hac:{n:'CH₃COOH', Ka:1.74e-5}, hocl:{n:'HOCl',Ka:3.0e-8}, hcn:{n:'HCN',Ka:4.9e-10},
};
const KW=1e-14;
function solveH(c,Ka){                 // exact [H⁺] for a monoprotic acid of total concentration c
  let lo=-15, hi=1;
  for(let i=0;i<70;i++){ const m=(lo+hi)/2, h=Math.pow(10,m), f=h-KW/h-c*Ka/(Ka+h); if(f>0) hi=m; else lo=m; }
  return Math.pow(10,(lo+hi)/2);
}
function buildA11(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    CG(TG('ac',[['hcl','HCl'],['hf','HF'],['hcooh','HCOOH'],['hac','CH₃COOH'],['hocl','HOCl'],['hcn','HCN']],'small'),'Acid')+
    SL('cR','Concentration',-8,0,0.05,Math.log10(0.02))+
    CG(`<div class="toggle-group"><button class="toggle-btn small" id="dil">💧 Add water ×2</button><button class="toggle-btn small" id="paper">pH paper</button><button class="toggle-btn small" id="rv">↺ Volume</button></div>`)+
    RC([['phV','pH','var(--f-red)'],['alV','Ionised  α',null],['kaV','Ka',null],['hV','[H⁺]',null]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), cR=$('#cR');
  const V0=0.1; let A=ACIDS.hf, n=Math.pow(10,-1.7)*V0, V=V0, Vt=V0, parts=[[],[],[]], t=0, strip={y:0,st:'up',tm:0,ph:7,col:7};
  const pHs={x:7,v:0};
  toggleWire([...wrap.querySelectorAll('#ac button')],b=>{ A=ACIDS[b.dataset.k]; });
  A=ACIDS.hcl; wrap.querySelector('#ac button[data-k=hf]').click();
  cR.oninput=()=>{ n=Math.pow(10,+cR.value)*V; };
  $('#dil').onclick=()=>{ Vt=Math.min(0.8,Vt*2); };
  $('#rv').onclick=()=>{ Vt=V0; V=V0; };
  $('#paper').onclick=()=>{ if(strip.st==='up'){ strip.st='down'; strip.tm=0; } };
  animLoop(dt=>{
    t+=dt;
    V=approach(V,Vt,2.2,dt); if(Math.abs(V-Vt)<1e-4) V=Vt;
    const c=n/V, h=solveH(c,A.Ka), Am=c*A.Ka/(A.Ka+h), HA=Math.max(c-Am,0), alpha=Am/c, pH=-Math.log10(h);
    if(document.activeElement!==cR) cR.value=clamp(Math.log10(c),-8,0); $('#cRV').textContent=sci(c,2)+' M';
    springTo(pHs,pH,60,9,dt);
    const {ctx,w,h:H}=fitCanvas(canvas); ctx.clearRect(0,0,w,H);

    /* ---- beaker ---- */
    const bx=w*0.07, bw=w*0.34, top=H*0.20, bot=H*0.80, lvl=bot-clamp(0.36+0.19*Math.log2(V/V0),0.1,0.97)*(bot-top-6);
    const tint=phColor(pHs.x);
    ctx.save(); ctx.beginPath(); ctx.rect(bx+1,lvl-4,bw-2,bot-lvl+4); ctx.clip(); liquidFill(ctx,bx,bx+bw,lvl,bot,'rgba(47,143,224,0.18)',t,1.8,COL.blue); ctx.restore();
    const NU=30, nIon=Math.round(clamp(alpha,0,1)*NU), ix0=bx+10, iw=bw-20, iy0=lvl+10, ih=Math.max(30,bot-lvl-26);
    parts[0]=syncPop(parts[0],'HA',NU-nIon,dt,ih/iw,0.08); parts[1]=syncPop(parts[1],'Hp',nIon,dt,ih/iw,0.1); parts[2]=syncPop(parts[2],'Am',nIon,dt,ih/iw,0.1);
    parts.forEach(arr=>arr.forEach(p=>drawMol(ctx,p.type,ix0+p.u*iw,iy0+p.v*ih,p.rot,0.9,p.al)));
    glass(ctx,bx,top,bw,bot,COL.ink,3.2);
    textAt(ctx,'HA + H₂O ⇌ H₃O⁺ + A⁻',bx+bw/2,bot+24,{align:'center',size:13,weight:700}); textAt(ctx,'V = '+fmt(V,2)+' L',bx+bw/2,bot+42,{align:'center',size:11.5,weight:700,color:COL.muted});
    // legend
    [['HA','HA',COL.ink],['Hp','H₃O⁺',COL.red],['Am','A⁻',COL.blue]].forEach(([ty,lab,col],i)=>{ const lx=bx+bw*(0.08+i*0.34); drawMol(ctx,ty,lx,bot+64,0,0.9); textAt(ctx,lab,lx+14,bot+69,{size:11.5,weight:700,color:col}); });
    // water jug when diluting
    const pouring=V<Vt-0.002;
    ctx.save(); ctx.translate(bx+bw*0.86,top-62); ctx.rotate(pouring?-0.55:0.12); ctx.globalAlpha=pouring?1:0.0; rect(ctx,-18,-8,36,44,COL.blue,'rgba(47,143,224,0.18)',2.4); ctx.restore();
    if(pouring){ ctx.save(); ctx.strokeStyle=COL.blue; ctx.lineWidth=5; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(bx+bw*0.78,top-30); ctx.lineTo(bx+bw*0.74,lvl); ctx.stroke(); ctx.restore(); }
    // pH meter probe
    line(ctx,bx+bw*0.22,top-34,bx+bw*0.22,lvl+(bot-lvl)*0.55,COL.ink,5); line(ctx,bx+bw*0.22,top-34,bx+bw*0.22,lvl+(bot-lvl)*0.55,'#dfe7f1',2.4);
    chip(ctx,bx+bw*0.22,top-44,'pH '+fmt(pH,2),COL.red,'center');

    /* ---- pH paper animation ---- */

/* =====================================================================
   6.12 A BUFFER SOLUTION   (Section 6.12, Henderson–Hasselbalch eq. 6.39–6.42)
   A weak acid + its conjugate base resist a change of pH:
        pH = pKa + log ( [base form] / [acid form] )
   Here pH is solved EXACTLY from charge balance (not only from the equation),
   so you can see the buffer finally collapse when one component is used up.
   Acetic acid / sodium acetate  pKa = 4.76  → pH ≈ 4.76 when equal
   NH3 / NH4Cl                   pKa = 9.25  → pH = 9.25 + log([NH3]/[NH4⁺])
   CHECK (text): 0.10 M NH3 + 0.20 M NH4Cl → pH = 9.25 + log(0.10/0.20) = 8.95.
   Dilution leaves the ratio — hence the pH — unchanged; pure water just moves.
   ===================================================================== */
const BUF={
  ac:{ name:'CH₃COOH / CH₃COO⁻', pKa:4.76,  accN:'[CH₃COOH]', baseN:'[CH₃COO⁻]', tyA:'HA',  tyB:'Am',  d:[0.10,0.10], neutralAcid:true },
  nh:{ name:'NH₄⁺ / NH₃',        pKa:9.25,  accN:'[NH₄⁺]',   baseN:'[NH₃]',     tyA:'NH4', tyB:'NH3', d:[0.20,0.10], neutralAcid:false },
};
function bufSolve(B,na,nb,nH,nOH,V){        // moles in, litres → exact [H⁺] and species (mol)
  const Ka=Math.pow(10,-B.pKa), Ct=(na+nb)/V; let lo=-15,hi=1;
  for(let i=0;i<64;i++){ const m=(lo+hi)/2, h=Math.pow(10,m); let f;
    if(B.neutralAcid) f=(nb+nOH-nH)/V + h - KW/h - Ct*Ka/(Ka+h);        // HA + A⁻ (Na⁺ spectator)
    else f=Ct*h/(Ka+h) + h + nOH/V - KW/h - (na+nH)/V;                   // NH4⁺ / NH3 (Cl⁻ spectator)
    if(f>0) hi=m; else lo=m; }
  const h=Math.pow(10,(lo+hi)/2), fa=B.neutralAcid?h/(Ka+h):h/(Ka+h);      // fraction in the acid form
  return {h,pH:-Math.log10(h),acid:Ct*V*fa,base:Ct*V*(1-fa)};
}
function waterSolve(nH,nOH,V){ let lo=-15,hi=1; for(let i=0;i<64;i++){ const m=(lo+hi)/2,h=Math.pow(10,m), f=h+(nOH-nH)/V-KW/h; if(f>0) hi=m; else lo=m; } const h=Math.pow(10,(lo+hi)/2); return {h,pH:-Math.log10(h),oh:KW/h*V,hp:h*V}; }
function buildA12(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML =
    CG(TG('bf',[['ac','Acetic acid buffer'],['nh','Ammonia buffer']],'small'),'Buffer')+
    SL('aR','<span id="aN">[CH₃COOH]</span>',0.01,0.5,0.01,0.10)+SL('bR','<span id="bN">[CH₃COO⁻]</span>',0.01,0.5,0.01,0.10)+
    CG(`<div class="toggle-group"><button class="toggle-btn small" id="hcl">+ 1 mmol HCl</button><button class="toggle-btn small" id="oh">+ 1 mmol NaOH</button></div>
        <div class="toggle-group"><button class="toggle-btn small" id="dil">💧 Dilute ×2</button><button class="toggle-btn small" id="rs">↺ Reset</button></div>`)+
    RC([['pb','pH  buffer','var(--f-green)'],['pw','pH  pure water','var(--f-red)'],['hh','Henderson–Hasselbalch',null,true]]);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), aR=$('#aR'), bR=$('#bR');
  const V0=0.1; let B=BUF.ac, na=0.01, nb=0.01, nH=0, nOH=0, cntA=0, cntB=0, Vb=V0, Vbt=V0, drops=[], splashes=[], hist=[], pbuf=[[],[]], pw=[[],[]], t=0;
  const sp={b:{x:7,v:0},w:{x:7,v:0}};
  function reset(){ na=+aR.value*V0; nb=+bR.value*V0; nH=0; nOH=0; cntA=0; cntB=0; Vb=V0; Vbt=V0; drops=[]; pbuf=[[],[]]; pw=[[],[]]; }

  aR.oninput=bR.oninput=reset; $('#rs').onclick=reset; $('#dil').onclick=()=>{ Vbt=Math.min(0.4,Vbt*2); };

  animLoop(dt=>{
    t+=dt; Vb=approach(Vb,Vbt,2.2,dt); if(Math.abs(Vb-Vbt)<1e-4) Vb=Vbt;
    const V=Vb+0.001*(cntA+cntB);

      ctx.save(); ctx.beginPath(); ctx.rect(bx+1,lvl-4,bw-2,bot-lvl+4); ctx.clip(); liquidFill(ctx,bx,bx+bw,lvl,bot,tint.replace('rgb','rgba').replace(')',',0.40)'),t+i,1.8,col); ctx.restore();
      glass(ctx,bx,top,bw,bot,COL.ink,3.2);
      const ix0=bx+10, iw=bw-20, iy0=lvl+10, ih=Math.max(30,bot-lvl-24);
      if(i===0){ pbuf[0]=syncPop(pbuf[0],B.tyA,Math.round(clamp(sol.acid/0.0005,0,60)),dt,ih/iw,0.08); pbuf[1]=syncPop(pbuf[1],B.tyB,Math.round(clamp(sol.base/0.0005,0,60)),dt,ih/iw,0.08); pbuf.forEach(a=>a.forEach(p=>drawMol(ctx,p.type,ix0+p.u*iw,iy0+p.v*ih,p.rot,0.85,p.al))); }
      else { pw[0]=syncPop(pw[0],'Hp',Math.round(clamp(sol.hp/0.0005,0,60)),dt,ih/iw,0.1); pw[1]=syncPop(pw[1],'Am',Math.round(clamp(sol.oh/0.0005,0,60)),dt,ih/iw,0.1); pw.forEach(a=>a.forEach(p=>drawMol(ctx,p.type,ix0+p.u*iw,iy0+p.v*ih,p.rot,0.85,p.al))); }
      // probe + digital pH
      line(ctx,bx+bw*0.8,top-4,bx+bw*0.8,bot-34,COL.ink,5); line(ctx,bx+bw*0.8,top-4,bx+bw*0.8,bot-34,'#dfe7f1',2.4);
      chip(ctx,bx+bw/2,top-14,'pH '+fmt(pHdisp,2),col,'center');
      textAt(ctx,label,bx+bw/2,bot+24,{align:'center',size:12.5,weight:700,color:col});
    };
    draw(0,bs,sp.b.x,COL.green,'buffer  '+B.name); draw(1,ws,sp.w.x,COL.red,'pure water');
    // droppers + drops
    const dy=h*0.03;
    [0,1].forEach(i=>{ const cx=bxs[i]+bw*0.4; const dc=drops.length?drops[drops.length-1].col:COL.ink; rect(ctx,cx-8,dy+8,16,34,COL.ink,'#fff',2.2); ctx.save(); ctx.beginPath(); ctx.moveTo(cx-8,dy+42); ctx.lineTo(cx,dy+54); ctx.lineTo(cx+8,dy+42); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke(); ctx.beginPath(); ctx.ellipse(cx,dy,13,10,0,0,6.283); ctx.fillStyle=dc===COL.ink?'#e3e8ef':dc; ctx.globalAlpha=0.5; ctx.fill(); ctx.globalAlpha=1; ctx.stroke(); ctx.restore(); });
    let landed=false;
    drops.forEach(d=>{ if(d.y===null) d.y=dy+56; d.vy+=900*dt; d.y+=d.vy*dt; if(d.y>=lvl){ d.done=true; splashes.push({x:bxs[d.i]+bw*0.4,y:lvl,u:0,col:d.col}); if(d.i===0){ landed=d; } } });
    if(landed){ if(landed.k==='H'){ nH+=0.001; cntA++; } else { nOH+=0.001; cntB++; } }
    drops=drops.filter(d=>!d.done);
    drops.forEach(d=>{ const cx=bxs[d.i]+bw*0.4; ctx.save(); ctx.fillStyle=d.col; ctx.strokeStyle=COL.ink; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(cx,d.y-9); ctx.quadraticCurveTo(cx+7,d.y+3,cx,d.y+7); ctx.quadraticCurveTo(cx-7,d.y+3,cx,d.y-9); ctx.fill(); ctx.stroke(); ctx.restore(); });
    splashes.forEach(s=>s.u+=dt*2.4); splashes=splashes.filter(s=>s.u<1);
    splashes.forEach(s=>{ ctx.save(); ctx.globalAlpha=1-s.u; ctx.strokeStyle=s.col; ctx.lineWidth=2.2; ctx.beginPath(); ctx.ellipse(s.x,s.y,5+s.u*20,2+s.u*5,0,0,6.283); ctx.stroke(); ctx.restore(); });
    // legend
    [[B.tyA,B.accN],[B.tyB,B.baseN]].forEach(([ty,lab],i)=>{ drawMol(ctx,ty,bxs[0]+i*bw*0.66+4,bot+50,0,0.9); textAt(ctx,lab,bxs[0]+i*bw*0.66+18,bot+55,{size:11,weight:700,color:COL.muted}); });
    drawMol(ctx,'Hp',bxs[1]+10,bot+50,0,0.9); textAt(ctx,'H⁺',bxs[1]+24,bot+55,{size:11,weight:700,color:COL.red}); drawMol(ctx,'Am',bxs[1]+bw*0.4,bot+50,0,0.9); textAt(ctx,'OH⁻',bxs[1]+bw*0.4+14,bot+55,{size:11,weight:700,color:COL.blue});

    /* ---- titration-style chart: pH against strong acid (+) or base (−) added ---- */
    const gx=w*0.64, gy=h*0.14, gw=w*0.32, gh=h*0.50;
    const pb=[], pwc=[]; for(let x=-10;x<=10.01;x+=0.5){ const nh=Math.max(0,x)*0.001, no=Math.max(0,-x)*0.001, VV=Vb+0.001*Math.abs(x);

    const m=chart(ctx,gx,gy,gw,gh,20,14,'strong acid added (mmol)  →','pH',[{pts:pwc,col:COL.red,w:2.6,dash:[6,4]},{pts:pb,col:COL.green,w:3.2}],{xticks:[0,5,10,15,20],xfmt:v=>(v-10>0?'+':'')+(v-10),yticks:[0,7,14]});
