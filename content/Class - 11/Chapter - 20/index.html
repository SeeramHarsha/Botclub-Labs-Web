<title>Grade 11 · Part 2 · Chapter 1 — Redox Reactions | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --fs-xl:clamp(18px,1.5vw,25px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:26px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.side-sub{display:flex; flex-direction:column; gap:var(--sp-3);}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--navy-2); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.toggle-btn.play{background:var(--f-green); border-color:var(--f-green); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%; margin-top:9px;}
.toggle-btn:disabled{opacity:.5; cursor:not-allowed;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn.ok{border-color:var(--f-green);} .chip-btn.bad{border-color:var(--f-red);}
.chip-wrap{display:flex; flex-wrap:wrap; margin-top:3px;}

.role-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:var(--fs-sm); font-weight:600;}
.role-row .rdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; display:inline-block;}
.role-row .rname{width:70px; flex:0 0 auto; color:var(--text-2);}
.role-row select{flex:1; min-width:0; padding:6px 7px; border:1px solid var(--border-strong); border-radius:7px; font-size:var(--fs-sm); background:var(--surface-1); color:var(--text-1); cursor:pointer;}

.step-row{display:flex; gap:5px;}
.step-pill{flex:1; padding:6px 4px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:10.5px; font-weight:700; color:var(--text-3); cursor:pointer;}
.step-pill.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.step-pill.done{border-color:var(--f-green); color:var(--f-green);}
.step-pill.active.done{color:#fff;}
.opt-btn{display:block; width:100%; text-align:left; margin-top:6px; padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:500; color:var(--text-1); cursor:pointer; line-height:1.3;}
.opt-btn.active{border-color:var(--navy-2); background:#e3ecf7; font-weight:600;}
.var-row{display:flex; align-items:center; gap:6px; margin-top:7px;}
.var-row .vname{flex:0 0 88px; font-size:var(--fs-sm); font-weight:600;}
.var-row .toggle-group{margin-top:0; flex:1;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.result-cards.three{grid-template-columns:1fr 1fr 1fr;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
.fb{font-size:var(--fs-xs); font-weight:600; margin-top:6px; padding:5px 8px; border-radius:7px;}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.log{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px;}
.log th{text-align:left; color:var(--text-3); font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.04em; padding:3px 4px; border-bottom:1px solid var(--border);}
.log td{padding:4px; border-bottom:1px solid var(--surface-2); color:var(--text-2);}
.log td.r-ok{color:var(--f-green); font-weight:700;} .log td.r-bad{color:var(--f-red); font-weight:700;} .log td.r-warn{color:var(--f-yellow); font-weight:700;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

<script>
/* =========================================================================
   GRADE 11 — PART 2 — CHAPTER 1: REDOX REACTIONS
   Every activity runs a continuous animation loop: sliders/buttons set a
   TARGET; the drawn object eases, springs or physically integrates toward
   it every frame. Atoms vibrate, electrons hop, ions drift, bubbles rise —
   nothing is ever a static picture with only a label changed.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};

/* ---------------------------------------------------------------------
   0. CANVAS HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){ line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7); }
function dimArrow(ctx,x,y1,y2,color){ line(ctx,x,y1,x,y2,color,1.6); arrowHead(ctx,x,y1,-Math.PI/2,color,5); arrowHead(ctx,x,y2,Math.PI/2,color,5); }
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} ctx.strokeStyle=stroke; ctx.stroke(); ctx.restore(); }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2247; }
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mixCol(a,b,t){ const A=hexRgb(a),B=hexRgb(b); t=clamp(t,0,1); return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'; }
function rampCol(stops,x){ // stops: [[pos,hex],...]
  if(x<=stops[0][0]) return mixCol(stops[0][1],stops[0][1],0);
  for(let i=1;i<stops.length;i++){ if(x<=stops[i][0]){ const a=stops[i-1],b=stops[i]; return mixCol(a[1],b[1],(x-a[0])/(b[0]-a[0])); } }
  const l=stops[stops.length-1][1]; return mixCol(l,l,0);
}
function thermo(ctx,x,top,bot,frac,outline,liquid){
  const br=8;
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle=outline; ctx.fillStyle='#fff';
  rrect(ctx,x-5,top,10,bot-top+2,5); ctx.fill(); ctx.stroke(); ctx.restore();
  const lh=(bot-top-5)*clamp(frac,0,1);
  ctx.save(); ctx.fillStyle=liquid; ctx.fillRect(x-2.2,bot-lh,4.4,lh+6); ctx.restore();
  circ(ctx,x,bot+br,br,outline,'#fff',2); circ(ctx,x,bot+br,br-3.2,liquid,liquid,1);
  for(let i=0;i<=4;i++){ const yy=top+5+(bot-top-5)*i/4; line(ctx,x+5,yy,x+9,yy,outline,1.1); }
}
function flame(ctx,cx,baseY,width,inten,t){
  const n=5;
  for(let i=0;i<n;i++){
    const fx=cx-width/2+width*(i+0.5)/n;
    const hh=(6+inten*32)*(0.78+0.22*Math.sin(t*13+i*1.7));
    const sway=Math.sin(t*9+i*2.1)*3;
    ctx.save(); ctx.lineJoin='round';
    ctx.strokeStyle=COL.red; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-7,baseY); ctx.quadraticCurveTo(fx-7,baseY-hh*0.55,fx+sway,baseY-hh); ctx.quadraticCurveTo(fx+7,baseY-hh*0.55,fx+7,baseY); ctx.stroke();
    ctx.strokeStyle=COL.yellow; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(fx-3.5,baseY); ctx.quadraticCurveTo(fx-3,baseY-hh*0.35,fx+sway*0.5,baseY-hh*0.55); ctx.quadraticCurveTo(fx+3,baseY-hh*0.35,fx+3.5,baseY); ctx.stroke();
    ctx.restore();
  }
}

let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
/* frame scheduler — real requestAnimationFrame, or a manual queue (window.__manual) used for deterministic testing */
const __Q=new Map(); let __id=0, __clock=0;
function raf(cb){ if(window.__manual){ __Q.set(++__id,cb); return -__id; } return requestAnimationFrame(cb); }
function caf(i){ if(i<0) __Q.delete(-i); else cancelAnimationFrame(i); }
window.__step=function(n,dt){ for(let k=0;k<n;k++){ const arr=[...__Q.values()]; __Q.clear(); __clock+=dt*1000; arr.forEach(cb=>cb(__clock)); } };
function animLoop(tick){
  let last = performance.now();
  let id;
  function frame(now){
    const dt = Math.max(0, Math.min(window.__maxdt||0.04, (now-last)/1000));
    last = now;
    tick(dt);
    id = raf(frame);
  }
  id = raf(frame);
  const stop = ()=>caf(id);
  activeStops.push(stop);
  return stop;
}
/** Exponential ease — frame-rate independent, always smooth. */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** Spring-damper — gives natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt;
  state.x += state.v*dt;
  return state.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function lw(k,base){ return clamp(k*base,1,3); }

function tag(ctx,px,py,tx,ty,txt,col){
  const W=ctx.canvas._w||800;
  ctx.save(); ctx.font='700 12px Poppins, sans-serif'; const tw=ctx.measureText(txt).width; ctx.restore();
  const right=tx>px; let bx=right?tx+4:tx-tw-12;
  if(bx+tw+10>W-4) bx=W-tw-14;
  line(ctx,px,py,right?bx:bx+tw+8,ty,col,1.6); circ(ctx,px,py,3,col,col,1);
  ctx.save(); rrect(ctx,bx,ty-10,tw+10,20,6); ctx.fillStyle='rgba(255,255,255,0.94)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
  textAt(ctx,txt,bx+5,ty+4,{size:12,weight:700,color:col});
}

/* ---------------------------------------------------------------------
   0c. CHEMISTRY HELPERS — sub/superscript text, beakers, ions, electrons
   --------------------------------------------------------------------- */
function chemTokens(s){
  const out=[]; let i=0, buf='';
  const flush=()=>{ if(buf){ out.push({t:buf,m:0}); buf=''; } };
  while(i<s.length){
    const c=s[i];
    if(c==='_'){ flush(); let j=i+1, v=''; while(j<s.length && /[0-9]/.test(s[j])){ v+=s[j]; j++; } out.push({t:v,m:1}); i=j; }
    else if(c==='^'){ flush(); let j=i+1, v=''; while(j<s.length && /[0-9]/.test(s[j])){ v+=s[j]; j++; } if(j<s.length && /[+\-−]/.test(s[j])){ v+=s[j]; j++; } out.push({t:v.replace('-','−'),m:2}); i=j; }
    else { buf+=c; i++; }
  }
  flush(); return out;
}
function chemHTML(s){ return chemTokens(s).map(k=>k.m===1?'<sub>'+k.t+'</sub>':k.m===2?'<sup>'+k.t+'</sup>':k.t).join(''); }
function chemW(ctx,s,size,wt){
  ctx.save(); const sm=size*0.7; let W=0;
  chemTokens(s).forEach(k=>{ ctx.font=(wt||600)+' '+(k.m?sm:size)+'px Poppins, sans-serif'; W+=ctx.measureText(k.t).width; });
  ctx.restore(); return W;
}
function chemAt(ctx,s,x,y,o){
  o=o||{}; const size=o.size||12, wt=o.weight||600, sm=size*0.7, toks=chemTokens(s);
  ctx.save(); ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  const wd=toks.map(k=>{ ctx.font=wt+' '+(k.m?sm:size)+'px Poppins, sans-serif'; return ctx.measureText(k.t).width; });
  const W=wd.reduce((a,b)=>a+b,0);
  let X=o.align==='center'?x-W/2:o.align==='right'?x-W:x;
  ctx.fillStyle=o.color||COL.ink; if(o.alpha!==undefined) ctx.globalAlpha=o.alpha;
  toks.forEach((k,i)=>{ ctx.font=wt+' '+(k.m?sm:size)+'px Poppins, sans-serif'; const dy=k.m===1?size*0.22:k.m===2?-size*0.4:0; ctx.fillText(k.t,X,y+dy); X+=wd[i]; });
  ctx.restore(); return W;
}
function sgn(n){ return n>0?'+'+n:n<0?'−'+(-n):'0'; }
/* pill label with chemistry text */
function chemPill(ctx,s,cx,cy,col,size,fill){
  size=size||13; const W=chemW(ctx,s,size,700)+14, H=size+10;
  ctx.save(); rrect(ctx,cx-W/2,cy-H/2,W,H,H/2); ctx.fillStyle=fill||'rgba(255,255,255,0.96)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore();
  chemAt(ctx,s,cx,cy+size*0.36,{size,weight:700,color:col,align:'center'});
  return W;
}
function electron(ctx,x,y,r){ r=r||3.4; circ(ctx,x,y,r,'#a9780a',COL.yellow,1.2); }
/* glass beaker. returns inner geometry. level 0..1 */
function beaker(ctx,x,y,w,h,level,liquid,t,opts){
  opts=opts||{}; const lip=8, top=y, bot=y+h, L=x-w/2, Rr=x+w/2;
  const ly=bot-(h-12)*level;
  if(level>0.001){
    ctx.save(); ctx.beginPath(); ctx.rect(L+2,ly,w-4,bot-ly-2); ctx.fillStyle=liquid; ctx.fill(); ctx.restore();
    ctx.save(); ctx.strokeStyle=opts.surf||'rgba(19,42,68,0.35)'; ctx.lineWidth=1.6; ctx.beginPath();
    for(let xx=L+3;xx<=Rr-3;xx+=3){ const yy=ly+Math.sin(xx*0.06+t*2.4)*1.3*(opts.wave===undefined?1:opts.wave); xx===L+3?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy); } ctx.stroke(); ctx.restore();
  }
  ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(L-lip,top-2); ctx.lineTo(L,top+2); ctx.lineTo(L,bot-8); ctx.quadraticCurveTo(L,bot,L+8,bot); ctx.lineTo(Rr-8,bot); ctx.quadraticCurveTo(Rr,bot,Rr,bot-8); ctx.lineTo(Rr,top+2); ctx.lineTo(Rr+lip,top-2); ctx.stroke();
  if(!opts.noTicks){ ctx.strokeStyle=COL.mid; ctx.lineWidth=1.2; for(let i=1;i<=4;i++){ const yy=bot-8-(h-16)*i/5; ctx.beginPath(); ctx.moveTo(Rr-12-(i%2?0:6),yy); ctx.lineTo(Rr-2,yy); ctx.stroke(); } }
  ctx.restore();
  return {L:L+3,R:Rr-3,top:top+4,bot:bot-3,ly};
}

/* ---------------------------------------------------------------------
   0d. REACTION MORPH ENGINE — atoms glide from reactant to product layout
   atom: {e,x,y,X,Y,on0,on1,role,arc}   bonds: [i,j,order]
   p: 0 → 1 progress.  Reactants vibrate; bonds fade out then in.
   --------------------------------------------------------------------- */
const EL_R={H:0.46,C:0.7,N:0.68,O:0.66,F:0.6,Mg:0.95,S:0.8,Hg:1.0,Cl:0.82,Zn:0.95,Ca:0.95,Na:0.95};
function rxnPos(a,i,p,t){
  const u=smooth01(0.2,0.82,p), j=0.06+0.05*(1-u);
  const x=lerp(a.x,a.X,u)+Math.sin(t*9+i*1.9)*j, y=lerp(a.y,a.Y,u)-(a.arc||0)*Math.sin(Math.PI*u)+Math.cos(t*8+i*2.3)*j;
  return [x,y];
}
function drawRxn(ctx,cx,cy,sc,R,p,t,o){
  o=o||{};
  const pos=R.atoms.map((a,i)=>rxnPos(a,i,p,t));
  const fR=1-smooth01(0.28,0.5,p), fP=smooth01(0.58,0.82,p);
  const key=(b)=>Math.min(b[0],b[1])+'-'+Math.max(b[0],b[1]);
  const seen={};
  R.bR.forEach(b=>{ seen[key(b)]={b,r:1,p:0,oR:b[2]||1}; });
  R.bP.forEach(b=>{ const k=key(b); if(seen[k]){ seen[k].p=1; seen[k].oP=b[2]||1; } else seen[k]={b,r:0,p:1}; });
  Object.values(seen).forEach(s=>{
    const al=s.r&&s.p?1:(s.r?fR:fP); if(al<0.02) return;
    const A=pos[s.b[0]], B=pos[s.b[1]], ord=(s.r&&s.p)?(p<0.5?s.oR:s.oP):(s.b[2]||1);
    const dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
    ctx.save(); ctx.globalAlpha=al;
    for(let k=0;k<ord;k++){ const off=(k-(ord-1)/2)*0.26*sc;
      line(ctx,cx+A[0]*sc+nx*off,cy+A[1]*sc+ny*off,cx+B[0]*sc+nx*off,cy+B[1]*sc+ny*off,COL.ink,2.4); }
    ctx.restore();
  });
  const roleMix=smooth01(0.45,0.85,p);
  R.atoms.forEach((a,i)=>{
    const [x,y]=pos[i], X=cx+x*sc, Y=cy+y*sc, r=(EL_R[a.e]||0.7)*sc;
    let role=a.role; if(o.autoRole){ role=a.on1>a.on0?'ox':a.on1<a.on0?'rd':null; }
    const col=role==='ox'?COL.red:role==='rd'?COL.blue:COL.ink;
    const stroke=role?mixCol(COL.ink,col,roleMix):COL.ink;
    circ(ctx,X,Y,r,stroke,'#fff',2.4);
    textAt(ctx,a.e,X,Y+4.5,{align:'center',size:Math.max(10,r*0.72),weight:700,color:stroke});
    if(o.showON && a.on0!==undefined){
      const flip=smooth01(0.42,0.62,p), v=flip<0.5?a.on0:a.on1, ch=a.on1!==a.on0;
      const pulse=ch?1+0.35*Math.sin(Math.PI*clamp((p-0.42)/0.2,0,1)):1;
      const tc=ch&&flip>0.5?col:COL.ink;
      ctx.save(); ctx.translate(X,Y-r-12); ctx.scale(pulse,pulse); textAt(ctx,sgn(v),0,0,{align:'center',size:14,weight:700,color:tc}); ctx.restore();
    }
  });
}
function rxnFlash(ctx,cx,cy,sc,p,xc){
  const q=(p-0.5)/0.3; if(q<=0||q>=1) return;
  ctx.save(); ctx.globalAlpha=1-q; ctx.strokeStyle=COL.yellow; ctx.lineWidth=3*(1-q)+0.5;
  ctx.beginPath(); ctx.arc(cx+xc*sc,cy,sc*(1+q*3),0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle=COL.red; ctx.lineWidth=1.5*(1-q); ctx.beginPath(); ctx.arc(cx+xc*sc,cy,sc*(0.6+q*2.2),0,Math.PI*2); ctx.stroke(); ctx.restore();
}
/* shared progress driver: slider + Run/Replay, eased draw value */
let SNAP=false; window.__snap=function(v){ SNAP=v!==false; };
function progressDriver(wrap,sliderSel,runSel,dur){
  const S=wrap.querySelector(sliderSel), B=wrap.querySelector(runSel);
  const L0=B.textContent, st={tgt:0,x:0,auto:false};
  S.oninput=()=>{ st.auto=false; st.tgt=S.value/100; B.textContent=L0; };
  B.onclick=()=>{ if(st.tgt>=0.999||st.x>=0.995){ st.tgt=0; st.x=0; } st.auto=true; B.textContent='⏳ Reacting…'; };
  st.step=(dt)=>{
    if(st.auto){ st.tgt=Math.min(1,st.tgt+dt/(dur||4)); if(st.tgt>=1){ st.auto=false; B.textContent='↺ Run again'; } S.value=Math.round(st.tgt*100); }
    st.x=SNAP?st.tgt:approach(st.x,st.tgt,st.auto?9:6,dt);
    if(Math.abs(st.x-st.tgt)<0.0007) st.x=st.tgt;
    return st.x;
  };
  st.reset=()=>{ st.tgt=0; st.x=0; st.auto=false; S.value=0; B.textContent=L0; };
  return st;
}

/* springy scalar state used with springTo */
function spr(x,v){ return {x:x||0,v:v||0}; }

/* rounded note card with a leader to a point */
function noteCard(ctx,x,y,w,h,title,body,col,alpha,fromX,fromY){

/* =====================================================================
   1.1 CLASSICAL REDOX — oxygen & hydrogen (Section 7.1, eqs 7.1–7.11)
   Oxidation: gain of O / electronegative element, loss of H / electropositive.
   Reduction: loss of O / electronegative element, gain of H / electropositive.
   ===================================================================== */
const RX1=[
  { chip:'2Mg + O_2', eq:'2Mg + O_2 → 2MgO', flash:-1.2,
    atoms:[ {e:'Mg',x:-6,y:1.6,X:1.2,Y:1.6,role:'ox',arc:-1.5},{e:'Mg',x:-6,y:-1.6,X:1.2,Y:-1.6,role:'ox',arc:1.5},
            {e:'O',x:-1.2,y:0.62,X:3.0,Y:1.6,role:'rd'},{e:'O',x:-1.2,y:-0.62,X:3.0,Y:-1.6,role:'rd'} ],
    bR:[[2,3,2]], bP:[[0,2],[1,3]],
    ox:['Mg is OXIDISED','gains oxygen'], rd:['O_2 is REDUCED','gains electropositive Mg'] },
  { chip:'2H_2S + O_2', eq:'2H_2S + O_2 → 2S + 2H_2O', flash:-2.5,
    atoms:[ {e:'S',x:-6.2,y:1.9,X:5,Y:1.6,role:'ox',arc:-1.7},{e:'H',x:-7.2,y:1.0,X:-0.2,Y:0.75},{e:'H',x:-5.2,y:1.0,X:1.8,Y:0.75},
            {e:'S',x:-6.2,y:-1.9,X:5,Y:-1.6,role:'ox',arc:1.7},{e:'H',x:-7.2,y:-1.0,X:-0.2,Y:-0.75},{e:'H',x:-5.2,y:-1.0,X:1.8,Y:-0.75},
            {e:'O',x:-2.2,y:0.5,X:0.8,Y:1.6,role:'rd'},{e:'O',x:-2.2,y:-0.5,X:0.8,Y:-1.6,role:'rd'} ],
    bR:[[0,1],[0,2],[3,4],[3,5],[6,7,2]], bP:[[6,1],[6,2],[7,4],[7,5]],
    ox:['H_2S is OXIDISED','loses hydrogen'], rd:['O_2 is REDUCED','gains hydrogen'] },
  { chip:'2HgO', eq:'2HgO → 2Hg + O_2', flash:-3, heat:true,
    atoms:[ {e:'Hg',x:-6,y:1.7,X:4.2,Y:1.8,role:'rd'},{e:'O',x:-4.2,y:1.7,X:0,Y:0.62},
            {e:'Hg',x:-6,y:-1.7,X:4.2,Y:-1.8,role:'rd'},{e:'O',x:-4.2,y:-1.7,X:0,Y:-0.62} ],
    bR:[[0,1],[2,3]], bP:[[1,3,2]],
    rd:['HgO is REDUCED','loses oxygen'] },
  { chip:'C_2H_4 + H_2', eq:'CH_2=CH_2 + H_2 → CH_3–CH_3', flash:-1.5,
    atoms:[ {e:'C',x:-6.5,y:0,X:1.5,Y:0,role:'rd'},{e:'C',x:-4.5,y:0,X:3.5,Y:0,role:'rd'},
            {e:'H',x:-7.4,y:1.2,X:0.4,Y:1.0},{e:'H',x:-7.4,y:-1.2,X:0.4,Y:-1.0},{e:'H',x:-3.6,y:1.2,X:4.6,Y:1.0},{e:'H',x:-3.6,y:-1.2,X:4.6,Y:-1.0},
            {e:'H',x:-1.2,y:0.5,X:1.5,Y:-1.9},{e:'H',x:-1.2,y:-0.5,X:3.5,Y:1.9} ],
    bR:[[0,1,2],[0,2],[0,3],[1,4],[1,5],[6,7]], bP:[[0,1],[0,2],[0,3],[1,4],[1,5],[0,6],[1,7]],
    rd:['C_2H_4 is REDUCED','gains hydrogen'] },
  { chip:'Mg + F_2', eq:'Mg + F_2 → MgF_2', flash:-1,
    atoms:[ {e:'Mg',x:-6,y:0,X:2,Y:0,role:'ox',arc:2.6},{e:'F',x:-1.2,y:0.5,X:0.0,Y:0,role:'rd'},{e:'F',x:-1.2,y:-0.5,X:4.0,Y:0,role:'rd',arc:-2.4} ],
    bR:[[1,2]], bP:[[0,1],[0,2]],
    ox:['Mg is OXIDISED','gains electronegative F'], rd:['F_2 is REDUCED','gains electropositive Mg'] }

function buildA1(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Reaction</label>${chipsHTML('rxC',RX1.map(r=>r.chip))}</div>
    <div class="control-group"><label>Progress <span class="val" id="pV">0%</span></label><input type="range" id="pR" min="0" max="100" step="1" value="0">
      <button class="toggle-btn navy" id="runB">▶ Run reaction</button></div>
    <div class="control-group"><div class="result-cards">
      ${rcard('Oxidation','oV',COL.red)}${rcard('Reduction','rV',COL.blue)}</div>
      <p class="hint">Oxidation and reduction always happen together — the word “redox”.</p></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let R=RX1[0], t=0;
  const PD=progressDriver(wrap,'#pR','#runB',4.2);
  wireChips(wrap,'#rxC',i=>{ R=RX1[i]; PD.reset(); });
  animLoop(dt=>{
    t+=dt; const p=PD.step(dt);

    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const sc=Math.min(w/17,(h-170)/7.6), cx=w/2-0.5*sc, cy=(74+h-112)/2;
    chemAt(ctx,R.eq,w/2,40,{size:Math.min(26,w/26),weight:700,align:'center'});
    line(ctx,w*0.3,56,w*0.7,56,'#dbe4f0',2);
    // reaction arrow bar
    const bx0=w*0.3, bx1=w*0.7; line(ctx,bx0,56,bx0+(bx1-bx0)*p,56,COL.green,3.4);
    if(R.heat) flame(ctx,cx-5.1*sc,cy+3.6*sc,3.4*sc,0.9*(1-smooth01(0.55,0.85,p)),t);

    const posOf=(role)=>{ const i=R.atoms.findIndex(a=>a.role===role); const q=rxnPos(R.atoms[i],i,p,t); return [cx+q[0]*sc, cy+q[1]*sc+(EL_R[R.atoms[i].e]||0.7)*sc]; };
    if(R.ox){ const f=posOf('ox'); noteCard(ctx,w*0.5-cw-14,yy,cw,ch,R.ox[0],R.ox[1],COL.red,mixA,f[0],f[1]); }

/* =====================================================================
   1.2 ELECTRON TRANSFER (Section 7.2, eqs 7.12–7.14)
   Each Na donates one valence electron; Cl, O, S, H accept.
   Oxidation = loss of e⁻ ; Reduction = gain of e⁻.
   ===================================================================== */
const ET=[
  { chip:'Na + Cl_2', don:'Na', nd:2, acc:'Cl', na:2, k:1, mol:true, eq:'2Na + Cl_2 → 2NaCl', ox:'2Na → 2Na^+ + 2e^-', rd:'Cl_2 + 2e^- → 2Cl^-', sum:'2Na + Cl_2 → 2Na^+Cl^-' },
  { chip:'Na + O_2', don:'Na', nd:4, acc:'O', na:2, k:2, mol:true, eq:'4Na + O_2 → 2Na_2O', ox:'4Na → 4Na^+ + 4e^-', rd:'O_2 + 4e^- → 2O^2-', sum:'4Na + O_2 → 2(Na^+)_2O^2-' },
  { chip:'Na + S', don:'Na', nd:2, acc:'S', na:1, k:2, mol:false, eq:'2Na + S → Na_2S', ox:'2Na → 2Na^+ + 2e^-', rd:'S + 2e^- → S^2-', sum:'2Na + S → (Na^+)_2S^2-' },
  { chip:'Na + H_2', don:'Na', nd:2, acc:'H', na:2, k:1, mol:true, eq:'2Na + H_2 → 2NaH', ox:'2Na → 2Na^+ + 2e^-', rd:'H_2 + 2e^- → 2H^-', sum:'2Na + H_2 → 2Na^+H^-' }
];
function buildA2(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label style="margin-bottom:4px;">Sodium reacts with</label>${chipsHTML('etC',ET.map(r=>r.chip))}</div>
    <div class="control-group"><label>Electron transfer <span class="val" id="pV">0%</span></label><input type="range" id="pR" min="0" max="100" step="1" value="0">
      <button class="toggle-btn navy" id="runB">▶ Run reaction</button></div>
    <div class="control-group"><div class="result-cards three">
      ${rcard('e⁻ given','eG',COL.red)}${rcard('e⁻ taken','eT',COL.blue)}${rcard('Ions','iV',COL.green)}</div>
      <p class="hint">Oxidation = loss of e⁻ · Reduction = gain of e⁻<br>Reducing agent donates · oxidising agent accepts.</p></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas');
  let S=ET[0], t=0;
  const PD=progressDriver(wrap,'#pR','#runB',4.6);
  wireChips(wrap,'#etC',i=>{ S=ET[i]; PD.reset(); });
  animLoop(dt=>{
    t+=dt; const p=PD.step(dt);
    $('#pV').textContent=Math.round(p*100)+'%';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const sc=Math.min(w/16,(h-250)/8.2), cx=w*0.46, cy=h*0.4;
    chemAt(ctx,S.eq,w/2,40,{size:Math.min(26,w/26),weight:700,align:'center'});
    const move=smooth01(0.55,0.95,p), nd=S.nd, na=S.na, k=S.k;
    // geometry
    const D=[], A=[];
    for(let d=0;d<nd;d++){ const a=Math.floor(d/k), j=d%k;
      const ya=(na===1?0:(a-(na-1)/2)*4.2);
      D.push({x0:-6,y0:(d-(nd-1)/2)*2.5, x1:4.5-2.4,y1:ya+(j-(k-1)/2)*2.3, a}); }
    for(let a=0;a<na;a++){ const y0=(a-(na-1)/2)*(S.mol?1.9:0), ya=(na===1?0:(a-(na-1)/2)*4.2); A.push({x0:0.5,y0,x1:4.5,y1:ya}); }
    const P=o=>[lerp(o.x0,o.x1,move)*sc+cx, lerp(o.y0,o.y1,move)*sc+cy];
    // acceptor-acceptor covalent bond fades as electrons arrive
    if(S.mol){ const a0=P(A[0]), a1=P(A[1]); ctx.save(); ctx.globalAlpha=1-smooth01(0.3,0.6,p); line(ctx,a0[0],a0[1],a1[0],a1[1],COL.ink,2.6); ctx.restore(); }
    // ionic attraction (dashed) once close
    const ionA=smooth01(0.88,1,p);
    if(ionA>0.02) D.forEach((d,i)=>{ const dp=P(d), ap=P(A[d.a]); ctx.save(); ctx.globalAlpha=ionA; line(ctx,dp[0],dp[1],ap[0],ap[1],COL.green,2,[5,4]); ctx.restore(); });
    // electrons: start/finish hop windows
    const eState=[];
    D.forEach((d,i)=>{ const t0=0.1+0.42*(i/Math.max(1,nd-0.001)), t1=t0+0.2; eState.push({t0,t1,q:clamp((p-t0)/(t1-t0),0,1)}); });
    const arrived=A.map(()=>0); D.forEach((d,i)=>{ if(eState[i].q>=1) arrived[d.a]++; });
    const gone=eState.filter(e=>e.q>0.5).length;
    // atoms
    const rD=(EL_R.Na)*sc, rA=(EL_R[S.acc]||0.8)*sc;
    D.forEach((d,i)=>{
      const [x,y]=P(d), lost=eState[i].q>0.5, wob=Math.sin(t*9+i*2)*1.2*(1-move);
      const col=lost?mixCol(COL.ink,COL.red,1):COL.ink;

    chemAt(ctx,C.chip,w/2,42,{size:Math.min(30,w/22),weight:700,align:'center'});
    const pe=p*p*(3-2*p), P=C.A.map(a=>[cx+a[1]*sc,cy+a[2]*sc]);

    C.B.forEach(b=>{ const A=P[b[0]],B=P[b[1]]; line(ctx,A[0],A[1],B[0],B[1],COL.mid,2); });
    // atoms

      const r=(EL_R[a[0]]||0.7)*sc*0.92, v=C.on[i], col=v>0?COL.red:v<0?COL.blue:COL.ink, mix=smooth01(0.3,0.95,p);

      textAt(ctx,'EN '+ENEG[a[0]].toFixed(2),P[i][0],P[i][1]+r+14,{align:'center',size:10,weight:600,color:COL.mid});
      const al=smooth01(0.55,0.9,p); textAt(ctx,sgn(v),P[i][0],P[i][1]-r-9,{align:'center',size:17,weight:800,color:v===0?COL.ink:col,alpha:al});
      if(C.fc[i]<0){ const an=t*2.6+i, rr=r*1.35; electron(ctx,P[i][0]+Math.cos(an)*rr,P[i][1]+Math.sin(an)*rr,3.8); }
    });
    // bonding pairs
    C.B.forEach((b,bi)=>{
      const A=P[b[0]], B=P[b[1]], dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, nx=-uy, ny=ux, to=C.own[bi];
      const rA=(EL_R[C.A[b[0]][0]]||0.7)*sc*0.92, rB=(EL_R[C.A[b[1]][0]]||0.7)*sc*0.92;
      let sT=0.5; if(to===b[1]) sT=1-(rB+9)/L; else if(to===b[0]) sT=(rA+9)/L;

    $('#sV').textContent=p>0.9?sgn(C.sum).replace('+','')+' ✓':'…'; $('#qV').textContent=sgn(C.q).replace('+','');

/* =====================================================================
   1.6 METALS IN ACID — activity series (Section 7.3.1, eqs 7.37–7.39)
   M + 2HCl → MCl₂ + H₂.  Rate (mL H₂ per min at 1 M, 25 °C):
   Mg 24 · Zn 6 · Fe 0.9 · Cu 0 · Ag 0  (limit 48 mL = 0.002 mol).
   Rate scales with [HCl] and doubles every 10 °C.
   ===================================================================== */
const MA=[
  {m:'Mg',rate:24,col:'#dfe5ec'},{m:'Zn',rate:6,col:'#b7c2cf'},{m:'Fe',rate:0.9,col:'#8d99a8'},{m:'Cu',rate:0,col:'#e3a47c'},{m:'Ag',rate:0,col:'#eef2f6'}
];
function buildA6(){
  const wrap=labShell();
  wrap.querySelector('.lab-side').innerHTML = `
    <div class="control-group"><label>Time <span class="val" id="tV">0 min</span></label><input type="range" id="tR" min="0" max="10" step="0.05" value="0">
      <button class="toggle-btn navy" id="runB">▶ Start the clock</button></div>
    <div class="control-group"><label>HCl concentration <span class="val" id="cV">1.0 M</span></label><input type="range" id="cR" min="0.5" max="3" step="0.1" value="1"></div>
    <div class="control-group"><label>Temperature <span class="val" id="kV">25 °C</span></label><input type="range" id="kR" min="15" max="60" step="1" value="25"></div>
    <div class="control-group"><div class="result-cards three">${rcard('Mg  H₂','vMg',COL.green)}${rcard('Zn  H₂','vZn',COL.green)}${rcard('Fe  H₂','vFe',COL.green)}</div>
      <p class="hint">Cu and Ag sit below hydrogen in the series — they cannot displace it from acid. Less active metal → slower gas.</p></div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), tR=$('#tR'), runB=$('#runB'), cR=$('#cR'), kR=$('#kR');
  let t=0, timeD=0, auto=false;
  const tubes=MA.map(()=>({V:0,bub:[],pops:[],bal:{x:0,v:0},sway:0}));
  tR.oninput=()=>{ auto=false; runB.textContent='▶ Start the clock'; };
  runB.onclick=()=>{ if(+tR.value>=9.95){ tR.value=0; timeD=0; tubes.forEach(q=>{q.V=0;q.bub=[];}); } auto=true; runB.textContent='⏳ Running…'; };
  animLoop(dt=>{
    t+=dt;
    if(auto){ tR.value=Math.min(10,+tR.value+dt*10/9); if(+tR.value>=10){ auto=false; runB.textContent='↺ Run again'; } }
    const conc=+cR.value, T=+kR.value, tgt=+tR.value; const fT=Math.pow(2,(T-25)/10);
    const tPrev=timeD; timeD=SNAP?tgt:approach(timeD,tgt,6,dt); if(Math.abs(timeD-tgt)<0.01) timeD=tgt;
    $('#tV').textContent=fmt(timeD,1)+' min'; $('#cV').textContent=fmt(conc,1)+' M'; $('#kV').textContent=T+' °C';
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    chemAt(ctx,'M(s) + 2HCl(aq) → MCl_2(aq) + H_2(g)',w/2,36,{size:Math.min(22,w/30),weight:700,align:'center'});
    const n=MA.length, sp=w/(n+0.4), tw=Math.min(62,sp*0.42), tTop=h*0.46, tH=Math.min(h*0.28,200), tBot=tTop+tH;
    const rMax=Math.min(sp*0.46,(tTop-84)/2.1,78);
    MA.forEach((a,i)=>{
      const Q=tubes[i], x=sp*(i+0.7), rate=a.rate*conc*fT;
      const Vnew=Math.min(48,rate*timeD), dV=Vnew-Q.V; Q.V=Vnew;
      // bubbles: one per 1.5 mL of new gas, born on the metal surface
      if(dV>0){ const nb=dV/1.5+(Q.carry||0); const k=Math.floor(nb); Q.carry=nb-k; for(let b=0;b<Math.min(k,12);b++) Q.bub.push({x:(Math.random()-0.5)*tw*0.55,y:tBot-26-Math.random()*8,r:2+Math.random()*2.4,vy:55+Math.random()*60,ph:Math.random()*6}); }
      // tube
      const lvl=tTop+tH*0.28;
      ctx.save(); ctx.beginPath(); ctx.moveTo(x-tw/2+2,lvl); ctx.lineTo(x+tw/2-2,lvl); ctx.lineTo(x+tw/2-2,tBot-tw/2); ctx.arc(x,tBot-tw/2,tw/2-2,0,Math.PI); ctx.closePath(); ctx.fillStyle='#eaf3fb'; ctx.fill(); ctx.restore();
      ctx.save(); ctx.strokeStyle='rgba(19,42,68,0.3)'; ctx.lineWidth=1.5; ctx.beginPath(); for(let xx=x-tw/2+3;xx<=x+tw/2-3;xx+=3){ const yy=lvl+Math.sin(xx*0.12+t*3+i)*1.2; xx===x-tw/2+3?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy); } ctx.stroke(); ctx.restore();
      // metal piece, eaten away as gas is made
      const left=1-0.85*Q.V/48, mh=34*left, mw=tw*0.46;
      ctx.save(); rrect(ctx,x-mw/2,tBot-tw/2-mh+8,mw,mh,3); ctx.fillStyle=a.col; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
      // bubbles rise, wobble, pop at surface
      Q.bub=Q.bub.filter(b=>{ b.y-=b.vy*dt; const bxx=x+b.x+Math.sin(t*7+b.ph)*2.2; if(b.y<=lvl+2){ Q.pops.push({x:bxx,y:lvl,q:0}); return false; } circ(ctx,bxx,b.y,b.r,COL.green,'rgba(255,255,255,0.8)',1.4); return true; });
      Q.pops=Q.pops.filter(p=>{ p.q+=dt*4; if(p.q>=1) return false; ctx.save(); ctx.globalAlpha=1-p.q; circ(ctx,p.x,p.y-2,3+p.q*5,COL.green,null,1.4); ctx.restore(); return true; });
      // glass
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x-tw/2,tTop-4); ctx.lineTo(x-tw/2,tBot-tw/2); ctx.arc(x,tBot-tw/2,tw/2,Math.PI,0,true); ctx.lineTo(x+tw/2,tTop-4); ctx.stroke();
      ctx.lineWidth=3.4; ctx.beginPath(); ctx.moveTo(x-tw/2-4,tTop-4); ctx.lineTo(x+tw/2+4,tTop-4); ctx.stroke(); ctx.restore();
      // balloon on the mouth — spring-damped radius, gentle sway
      const rest=Q.V>0.2?8+(rMax-8)*Math.cbrt(Q.V/48):4;
      springTo(Q.bal,rest,70,6.5,dt); const r=Math.max(3,Q.bal.x);
      const sw=Math.sin(t*1.7+i*1.3)*0.05*Math.min(1,r/rMax+0.3), by=tTop-4-14-r*1.05;
      ctx.save(); ctx.translate(x,tTop-4-8); ctx.rotate(sw);
      const nk=Math.min(r*0.25,tw*0.2); ctx.beginPath(); ctx.moveTo(-tw*0.34,0); ctx.lineTo(tw*0.34,0); ctx.lineTo(nk,-14); ctx.lineTo(-nk,-14); ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=COL.ink; ctx.lineWidth=2.2; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0,-14-r*1.05,r*0.92,r*1.08,0,0,Math.PI*2);
      ctx.fillStyle=Q.V>0.2?'rgba(31,157,85,0.12)':'rgba(129,149,171,0.1)'; ctx.fill(); ctx.strokeStyle=Q.V>0.2?COL.green:COL.mid; ctx.lineWidth=2.4; ctx.stroke();
      ctx.beginPath(); ctx.arc(-r*0.3,-14-r*1.3,r*0.5,Math.PI*1.1,Math.PI*1.45); ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2.4; ctx.stroke();
      ctx.restore();
      // labels
      chemPill(ctx,a.m,x,tBot+24,COL.ink,14);
      textAt(ctx,fmt(Q.V,1)+' mL',x,tBot+48,{align:'center',size:13,weight:700,color:Q.V>0.05?COL.green:COL.mid});
      if(a.rate===0) textAt(ctx,'no reaction',x,tBot+64,{align:'center',size:11,weight:600,color:COL.red});
    });
    // series arrow
    const ay=h-14; vec(ctx,sp*0.7-20,ay,sp*(n-0.3)+20,ay,COL.red,2.4);
    textAt(ctx,'stronger reducing agent',sp*0.7-20,ay-8,{size:11,weight:700,color:COL.red}); textAt(ctx,'weaker',sp*(n-0.3)+20,ay-8,{size:11,weight:700,color:COL.red,align:'right'});
    $('#vMg').textContent=fmt(tubes[0].V,1)+' mL'; $('#vZn').textContent=fmt(tubes[1].V,1)+' mL'; $('#vFe').textContent=fmt(tubes[2].V,1)+' mL';
  });
  return wrap;
}

const activities = [
  { num:'1.1', title:'Classical Redox',        desc:'Oxygen & hydrogen · Sec 7.1',          build: typeof buildA1==='function'?buildA1:null },
  { num:'1.2', title:'Electron Transfer',      desc:'Na gives · Cl takes · Sec 7.2',        build: typeof buildA2==='function'?buildA2:null },
  { num:'1.3', title:'Metals Compete',         desc:'Zn / Cu / Ag / Co / Ni · Fig 7.1–7.2', build: typeof buildA3==='function'?buildA3:null },
  { num:'1.4', title:'Oxidation Number',       desc:'Electron-pair book-keeping · Sec 7.3', build: typeof buildA4==='function'?buildA4:null },
  { num:'1.5', title:'Four Types of Redox',    desc:'Combine · split · displace · disproportionate', build: typeof buildA5==='function'?buildA5:null },
  { num:'1.6', title:'Metals in Acid',         desc:'Activity series · Eq 7.37–7.39',       build: typeof buildA6==='function'?buildA6:null },
  { num:'1.7', title:'Halogen Layer Test',     desc:'Cl₂ · Br₂ · I₂ displace · Eq 7.41–7.43', build: typeof buildA7==='function'?buildA7:null },
  { num:'1.8', title:'Balancing Half-Reactions', desc:'Fe²⁺ + Cr₂O₇²⁻ · Sec 7.3.2',        build: typeof buildA8==='function'?buildA8:null },
  { num:'1.9', title:'Redox Titration',        desc:'Burette · flask · end-point · Sec 7.3.3', build: typeof buildA9==='function'?buildA9:null },
  { num:'1.10', title:'Daniell Cell',          desc:'Salt bridge · electrode potentials · Fig 7.3', build: typeof buildA10==='function'?buildA10:null },
].filter(a=>a.build);
let currentIndex = 0;

function buildNav(){
  const nav = document.getElementById('sideNav');
  nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops();
  buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody');
  body.innerHTML='';
  body.appendChild(a.build());
}
const _q=new URLSearchParams(location.search); if(_q.get('a')) currentIndex=Math.max(0,Math.min(activities.length-1,(+_q.get('a'))-1));
render();
</script>
<script src="../../nav/back-button.js"></script>
