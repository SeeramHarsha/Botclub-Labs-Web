<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}
.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{ flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px); display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5; }
.topbar .brand-badge{ width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center; font-size:clamp(15px,1.3vw,20px); flex:0 0 auto; }
.topbar .chip{ display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px; }
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}
.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{ flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px; }
.nav-item{ display:flex; align-items:center; gap:8px; text-align:left; width:100%; border:1px solid var(--border); background:var(--surface-1);
  border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease; color:var(--text-1); }
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}

.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}
.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}
.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}

.control-group input[type=range]{width:100%; margin-top:7px; accent-color:var(--f-yellow); cursor:pointer;}
.toggle-group{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
.toggle-group:first-child{margin-top:0;}
.toggle-btn{flex:1; min-width:56px; padding:7px 5px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn:hover{border-color:var(--navy-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.toggle-btn.navy{background:var(--navy-2); border-color:var(--navy-2); color:#fff; width:100%;}
.toggle-btn.small{font-size:10.5px; padding:6px 3px;}
.glabel{font-size:var(--fs-sm); font-weight:600; margin-bottom:6px; display:block;}
.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px; word-break:break-word;}
.rcard.wide{grid-column:1/-1;}
.hint{font-size:var(--fs-xs); color:var(--text-3); margin-top:6px; line-height:1.4;}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
@media (max-width:1000px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}

<body>
<div class="app">
  <div class="topbar">
    <div class="brand-badge">⚖️</div>
    <div>
      <div class="chip">Grade 11 · Physics Part 1 · Ch 1</div>

    </div>

      <span><i style="background:var(--f-yellow)"></i>What you change</span>
      <span><i style="background:var(--f-blue)"></i>Reference · Unit · Length</span>
      <span><i style="background:var(--f-green)"></i>Certain · Correct</span>

        <p id="panelDesc"></p>
      </div>

    </main>
  </div>

<script>
/* =========================================================================
   GRADE 11 PHYSICS PART 1 — CHAPTER 1: UNITS AND MEASUREMENT
   Every activity runs on a continuous animation loop. Sliders and buttons
   only set a TARGET; the drawn object springs, rolls, swings or falls toward
   it every frame — it never jumps. Colours: yellow = what you change,
   blue = reference / unit / length, green = certain / correct,
   red = uncertain / error / mismatch.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab', faint:'#dbe4f0'};

/* ---------------- canvas + drawing helpers ---------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.lineCap='round';
  ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function vec(ctx,x1,y1,x2,y2,color,width){
  if(Math.hypot(x2-x1,y2-y1)<2) return;
  line(ctx,x1,y1,x2,y2,color,width||2.6); arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),color,7);
}
function dimLine(ctx,x1,y1,x2,y2,color){
  const a=Math.atan2(y2-y1,x2-x1);
  line(ctx,x1,y1,x2,y2,color,1.6); arrowHead(ctx,x1,y1,a+Math.PI,color,6); arrowHead(ctx,x2,y2,a,color,6);
}
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||500)+' '+(opts.size||12)+'px Poppins, system-ui, sans-serif';
  ctx.fillStyle=opts.color||COL.ink; ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.alpha!==undefined) ctx.globalAlpha=opts.alpha;
  ctx.fillText(txt,x,y); ctx.restore();
}
function rect(ctx,x,y,w,h,stroke,fill,lw,dash){
  ctx.save(); ctx.lineWidth=lw===undefined?2.2:lw; ctx.setLineDash(dash||[]);
  if(fill){ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);} if(lw!==0){ctx.strokeStyle=stroke; ctx.strokeRect(x,y,w,h);} ctx.restore();
}
function circ(ctx,x,y,r,stroke,fill,lw,dash){
  ctx.save(); ctx.lineWidth=lw||2.2; ctx.setLineDash(dash||[]); ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2);
  if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.stroke();} ctx.restore();
}
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function box(ctx,x,y,w,h,r,stroke,fill,lw,dash){
  ctx.save(); rrect(ctx,x,y,w,h,r); if(fill){ctx.fillStyle=fill; ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw||2; ctx.setLineDash(dash||[]); ctx.stroke();} ctx.restore();
}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; return Number(x.toFixed(d)).toString(); }
function fixed(x,d){ return isFinite(x)?x.toFixed(d):'—'; }
function sup(n){ const m={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'}; return String(n).split('').map(c=>m[c]||c).join(''); }
function smooth01(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }

/* ---------------- animation engine ---------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now(), raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now; tick(dt);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** frame-rate independent exponential ease */
function approach(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }
/** spring-damper — natural overshoot and settle */
function springTo(s,target,k,damping,dt){
  const sub=Math.max(1,Math.ceil(dt/0.008)), h=dt/sub;
  for(let i=0;i<sub;i++){ s.v += ((target-s.x)*k - s.v*damping)*h; s.x += s.v*h; }
  return s.x;
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

/* ---------------- UI builders ---------------- */
function lab(side){
  const wrap=document.createElement('div'); wrap.className='lab-view';
  wrap.innerHTML = `<div class="lab-canvas-wrap"><canvas></canvas></div><div class="lab-side">${side}</div>`;
  const $=s=>wrap.querySelector(s);
  return {wrap,$,canvas:$('canvas')};
}
function slider(id,label,min,max,step,val){
  return `<div class="control-group"><label>${label}<span class="val" id="${id}V"></span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}
function toggles(id,items,cls){
  return `<div class="toggle-group" id="${id}">${items.map((it,i)=>`<button class="toggle-btn ${cls||''}${i?'':' active'}" data-v="${it[0]}">${it[1]}</button>`).join('')}</div>`;
}
function group(inner){ return `<div class="control-group">${inner}</div>`; }
function cards(arr){
  return `<div class="control-group"><div class="result-cards">${arr.map(c=>`<div class="rcard${c.wide?' wide':''}"><div class="rlabel">${c.l}</div><div class="rval" id="${c.id}" style="${c.col?'color:'+c.col:''}">—</div></div>`).join('')}</div></div>`;
}
function hint(t){ return `<p class="hint">${t}</p>`; }
</script>
<script>

/* =====================================================================
   1.1  MEASURE WITH A UNIT      (Sections 1.1 – 1.2)
   A measurement = number × unit. Same rod, different unit → different number.
   ===================================================================== */
function buildA1(){
  const {wrap,$,canvas}=lab(
    slider('len','Length of rod',0.3,2,0.01,1.2)+
    group(`<span class="glabel">Unit used to measure</span>${toggles('unit',[['0.01','cm'],['0.3048','ft'],['1','m']])}
      <div class="toggle-group"><button class="toggle-btn navy" id="again">▶ Measure again</button></div>`)+
    cards([{l:'Number',id:'n',col:COL.blue},{l:'Unit',id:'u'},{l:'Same rod',id:'oth',wide:1}])+
    hint('Result of a measurement = number × unit.'));
  const UN={'0.01':'cm','0.3048':'ft','1':'m'};
  let u=0.01, Lq=1.2, tau=0, lastKey='', t=0;
  const Ls={x:1.2,v:0};
  toggleWire(wrap.querySelectorAll('#unit button'),b=>{ u=+b.dataset.v; });
  $('#again').onclick=()=>{ tau=0; };
  animLoop(dt=>{
    t+=dt;
    const L=+$('#len').value; $('#lenV').textContent=fmt(L,2)+' m';
    const key=L+'|'+u; if(key!==lastKey){ lastKey=key; tau=0; }
    tau+=dt;
    springTo(Ls,L,60,9,dt);
    const N=L/u, ease=smooth01(0,3.2,tau), p=N*ease;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const x0=w*0.07, pxM=(w*0.86)/2.0, rodY=h*0.40, up=u*pxM;
    // laid-down unit blocks (blue/yellow alternate), fractional last block dashed red
    const full=Math.floor(p+1e-9), frac=p-full;
    for(let i=0;i<full;i++){
      const bx=x0+i*up;
      rect(ctx,bx,rodY-34,up,22,COL.blue,i%2?'rgba(217,160,23,0.16)':'rgba(47,143,224,0.16)',up>6?1.8:0.6);
    }
    if(frac>0.002 && full<Math.floor(N+1e-9)+1){
      const bx=x0+full*up;
      const isLast=full>=Math.floor(N+1e-9);
      const hop=Math.sin(Math.PI*clamp(frac,0,1))*clamp(up*0.7+12,12,70);
      if(p<N-1e-6 && !isLast){
        rect(ctx,bx+frac*up,rodY-34-hop,up,22,COL.yellow,'rgba(217,160,23,0.22)',2);
      } else {
        rect(ctx,bx,rodY-34,up*frac,22,COL.red,'rgba(217,67,43,0.12)',1.8,[4,3]);
      }
    }
    // the rod (stretches with a settle when the slider moves)
    const rl=Ls.x*pxM;
    box(ctx,x0,rodY-8,rl,16,4,COL.ink,'#fff',2.4);
    line(ctx,x0,rodY-46,x0,rodY+26,COL.ink,2); line(ctx,x0+rl,rodY-14,x0+rl,rodY+26,COL.ink,2);
    dimLine(ctx,x0,rodY+20,x0+rl,rodY+20,COL.blue);
    textAt(ctx,'one '+({0.01:'centimetre',0.3048:'foot',1:'metre'}[u])+' laid end to end',x0,rodY-58,{size:12,weight:600,color:COL.muted});
    // live count
    textAt(ctx,fixed(p,u===1?2:(u===0.01?1:2))+' × '+UN[u],w*0.5,h*0.19,{align:'center',size:Math.min(38,w*0.05),weight:700,color:COL.blue});
    // same length, three numbers
    const rows=[[0.01,'cm','centimetre'],[0.3048,'ft','foot'],[1,'m','metre']];
    rows.forEach((r,i)=>{
      const y=h*0.64+i*h*0.105, act=(r[0]===u);
      box(ctx,x0,y,rl,16,4,act?COL.blue:COL.mid,act?'rgba(47,143,224,0.18)':'#f6f9fc',act?2.4:1.4);
      const n=Ls.x/r[0];
      textAt(ctx,fixed(n,r[0]===0.01?0:2)+' '+r[1],Math.max(x0+rl+12,w*0.2),y+13,{size:15,weight:act?700:500,color:act?COL.blue:COL.muted});
    });
    textAt(ctx,'the length never changes — only the number does',w*0.5,h*0.97,{align:'center',size:12,color:COL.mid});
    $('#n').textContent=fixed(N,u===0.01?0:2); $('#u').textContent={0.01:'centimetre (CGS)',0.3048:'foot (FPS)',1:'metre (MKS / SI)'}[u];
    $('#oth').textContent=fixed(L*100,0)+' cm = '+fixed(L/0.3048,2)+' ft = '+fixed(L,2)+' m';
  });
  return wrap;
}

/* =====================================================================
   1.2  PLANE ANGLE — THE RADIAN      (Fig 1.1a)   dθ = ds / r
   ===================================================================== */
function buildA2(){
  const {wrap,$,canvas}=lab(
    slider('r','Radius r',3,10,0.1,6)+
    slider('th','Angle θ',0,360,1,57.3)+
    group(`<div class="toggle-group"><button class="toggle-btn" id="sw">⟳ Sweep the angle</button><button class="toggle-btn" id="one">θ = 1 rad</button></div>`)+
    cards([{l:'Arc  s',id:'s',col:COL.red},{l:'Radius  r',id:'rr',col:COL.blue},{l:'θ = s / r',id:'a',col:COL.green},{l:'In degrees',id:'d'}])+
    hint('1 radian is the angle whose arc is exactly one radius long.'));
  let sweep=false, t=0;
  const R={x:6,v:0}, TH={x:1,v:0};
  $('#sw').onclick=()=>{ sweep=!sweep; $('#sw').classList.toggle('active',sweep); };
  $('#one').onclick=()=>{ sweep=false; $('#sw').classList.remove('active'); $('#th').value=57.2958; };
  animLoop(dt=>{
    t+=dt;
    let thT=+$('#th').value*Math.PI/180;
    if(sweep){ thT=(0.5-0.5*Math.cos(t*0.55))*2*Math.PI; $('#th').value=thT*180/Math.PI; }
    $('#rV').textContent=fmt(+$('#r').value,1)+' cm'; $('#thV').textContent=fmt(thT*180/Math.PI,0)+'°';
    springTo(R,+$('#r').value,70,10,dt); springTo(TH,thT,sweep?400:80,sweep?40:11,dt);
    const rcm=R.x, th=Math.max(0,TH.x), s=rcm*th;
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cx=w*0.30, cy=h*0.46, Rmax=Math.min(h*0.36,w*0.24), Rp=Rmax*rcm/10, k=Rp/rcm;
    circ(ctx,cx,cy,Rp,COL.faint,null,2);
    // arc pieces, each exactly one radius long (alternate red / yellow)
    const full=Math.floor(th), ro=Rp+9;
    for(let i=0;i<=full;i++){
      const a0=i, a1=Math.min(i+1,th); if(a1-a0<1e-4) continue;
      ctx.save(); ctx.strokeStyle=(i%2)?COL.yellow:COL.red; ctx.lineWidth=5; ctx.lineCap='butt';
      ctx.beginPath(); ctx.arc(cx,cy,ro,-a0,-a1,true); ctx.stroke(); ctx.restore();
      if(a1-a0>0.999){ const am=a0+0.5; textAt(ctx,'r',cx+Math.cos(-am)*(ro+16),cy+Math.sin(-am)*(ro+16)+4,{align:'center',size:12,weight:700,color:COL.blue}); }
    }
    // radii
    line(ctx,cx,cy,cx+Rp,cy,COL.blue,2.8);
    const bx=cx+Math.cos(-th)*Rp, by=cy+Math.sin(-th)*Rp;
    line(ctx,cx,cy,bx,by,COL.blue,2.8);
    ctx.save(); ctx.strokeStyle=COL.green; ctx.lineWidth=2.4; ctx.beginPath(); ctx.arc(cx,cy,Math.min(26,Rp*0.3),0,-th,true); ctx.stroke(); ctx.restore();
    textAt(ctx,'θ',cx+Math.cos(-th/2)*Math.min(40,Rp*0.42),cy+Math.sin(-th/2)*Math.min(40,Rp*0.42)+5,{align:'center',size:15,weight:700,color:COL.green});
    circ(ctx,cx,cy,4,COL.ink,COL.ink,1);
    // a dot walks the arc while its twin walks the unrolled bar — measuring s with the radius
    const f=th>0.01?((t*0.35)%1):0, da=f*th;
    circ(ctx,cx+Math.cos(-da)*Rp,cy+Math.sin(-da)*Rp,6,COL.ink,'#fff',2.2);
    // unrolled bar
    const bx0=w*0.60, by0=h*0.80, bw=Math.min(w*0.34,Rmax*2.6*th/6.3+30);
    const unit=Rp, bl=Math.min(th*unit,w*0.36);
    const sc=bl/Math.max(1e-6,th*unit);
    const rpx=unit*sc*(th*unit>w*0.36?1:1);
    textAt(ctx,'radius laid along a straight line',bx0,by0-62,{size:12,weight:600,color:COL.muted});
    line(ctx,bx0,by0-40,bx0+Rp*sc,by0-40,COL.blue,5); line(ctx,bx0,by0-48,bx0,by0-32,COL.blue,2); line(ctx,bx0+Rp*sc,by0-48,bx0+Rp*sc,by0-32,COL.blue,2);
    textAt(ctx,'r',bx0+Rp*sc/2,by0-50,{align:'center',size:12,weight:700,color:COL.blue});
    for(let i=0;i<=full;i++){
      const a0=i, a1=Math.min(i+1,th); if(a1-a0<1e-4) continue;
      line(ctx,bx0+a0*Rp*sc,by0,bx0+a1*Rp*sc,by0,(i%2)?COL.yellow:COL.red,7);
      line(ctx,bx0+a0*Rp*sc,by0-8,bx0+a0*Rp*sc,by0+8,COL.ink,1.6);
    }
    line(ctx,bx0+th*Rp*sc,by0-8,bx0+th*Rp*sc,by0+8,COL.ink,1.6);
    circ(ctx,bx0+da*Rp*sc,by0,6,COL.ink,'#fff',2.2);
    textAt(ctx,'arc  s = '+fixed(s,1)+' cm  =  '+fixed(th,2)+' radii',bx0,by0+30,{size:13,weight:700,color:COL.red});
    $('#s').textContent=fixed(s,2)+' cm'; $('#rr').textContent=fixed(rcm,1)+' cm'; $('#a').textContent=fixed(th,3)+' rad'; $('#d').textContent=fixed(th*180/Math.PI,1)+'°';
  });
  return wrap;
}

/* =====================================================================
   1.3  SOLID ANGLE — THE STERADIAN      (Fig 1.1b)   dΩ = dA / r²
   cap of a cone on a sphere:  Ω = 2π(1 − cos α)
   ===================================================================== */
function buildA3(){
  const {wrap,$,canvas}=lab(
    slider('om','Solid angle Ω',0.2,12.5,0.1,1)+
    slider('r','Sphere radius r',2,8,0.1,4)+
    group(`<div class="toggle-group"><button class="toggle-btn" id="b1">Ω = 1 sr</button><button class="toggle-btn" id="b4">Whole sphere</button></div>`)+
    cards([{l:'Patch area  A',id:'A',col:COL.yellow},{l:'Radius  r',id:'rr',col:COL.blue},{l:'Ω = A / r²',id:'o',col:COL.green},{l:'Share of sphere',id:'f'}])+
    hint('Make the sphere bigger: the patch grows as r², but Ω does not change.'));
  let t=0;
  const OM={x:1,v:0}, R={x:4,v:0};
  $('#b1').onclick=()=>{ $('#om').value=1; }; $('#b4').onclick=()=>{ $('#om').value=12.5; };
  animLoop(dt=>{
    t+=dt;
    const omT=+$('#om').value; $('#omV').textContent=fmt(omT,1)+' sr'; $('#rV').textContent=fmt(+$('#r').value,1)+' cm';
    springTo(OM,omT,60,9,dt); springTo(R,+$('#r').value,70,10,dt);
    const om=clamp(OM.x,0.01,4*Math.PI-0.001), rcm=R.x;
    const al=Math.acos(clamp(1-om/(2*Math.PI),-1,1));
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const cx=w*0.5, cy=h*0.5, Rp=Math.min(h*0.40,w*0.36)*(0.55+0.45*rcm/8);
    const yaw=t*0.5, tilt=0.42;
    const ax=[0.35,0.55,0.76]; const an=Math.hypot(...ax); const a=ax.map(v=>v/an);
    // orthonormal frame around axis a
    let u=[a[1],-a[0],0]; const un=Math.hypot(...u); u=u.map(v=>v/un);
    const v=[a[1]*u[2]-a[2]*u[1], a[2]*u[0]-a[0]*u[2], a[0]*u[1]-a[1]*u[0]];
    const P=p=>{ // rotate about vertical, then tilt; return [sx,sy,depth]
      const x1=p[0]*Math.cos(yaw)+p[2]*Math.sin(yaw), z1=-p[0]*Math.sin(yaw)+p[2]*Math.cos(yaw);
      const y2=p[1]*Math.cos(tilt)-z1*Math.sin(tilt), z2=p[1]*Math.sin(tilt)+z1*Math.cos(tilt);
      return [cx+x1*Rp, cy-y2*Rp, z2];
    };
    // sphere outline + two faint rings
    circ(ctx,cx,cy,Rp,COL.blue,'rgba(47,143,224,0.04)',2.4);
    const ring=(fn,col)=>{ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=1.2; ctx.setLineDash([4,5]); ctx.beginPath();
      for(let i=0;i<=60;i++){ const q=P(fn(i/60*Math.PI*2)); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); } ctx.stroke(); ctx.restore(); };
    ring(th=>[Math.cos(th),0,Math.sin(th)],COL.faint); ring(th=>[Math.cos(th),Math.sin(th),0],COL.faint);
    // cone rim
    const rim=[]; const N=48;
    for(let i=0;i<N;i++){ const ph=i/N*Math.PI*2;
      const p=[0,1,2].map(k=>a[k]*Math.cos(al)+Math.sin(al)*(Math.cos(ph)*u[k]+Math.sin(ph)*v[k])); rim.push(P(p)); }
    const O=P([0,0,0]);
    // cap (yellow = area A)
    ctx.save(); ctx.beginPath(); rim.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
    ctx.fillStyle='rgba(217,160,23,0.30)'; ctx.fill(); ctx.strokeStyle=COL.yellow; ctx.lineWidth=2.6; ctx.stroke(); ctx.restore();
    // cone edges (red) and axis radius (blue)
    for(let i=0;i<N;i+=4){ line(ctx,O[0],O[1],rim[i][0],rim[i][1],COL.red,1.8); }
    const ap=P(a); line(ctx,O[0],O[1],ap[0],ap[1],COL.blue,2.8,[7,4]);
    textAt(ctx,'r',(O[0]+ap[0])/2+10,(O[1]+ap[1])/2-4,{size:13,weight:700,color:COL.blue});
    circ(ctx,O[0],O[1],4.5,COL.ink,COL.ink,1);
    textAt(ctx,'O',O[0]-14,O[1]+16,{size:13,weight:700});
    textAt(ctx,'A',ap[0]+10,ap[1]-8,{size:14,weight:700,color:COL.yellow});
    // 1-steradian reference square (area r² drawn flat at left) beside the live patch
    const sx=w*0.05, sy=h*0.70, sq=Math.min(w*0.12,Rp*0.5);
    textAt(ctx,'a square of area r²',sx,sy-10,{size:12,weight:600,color:COL.muted});
    rect(ctx,sx,sy,sq,sq,COL.blue,'rgba(47,143,224,0.12)',2);
    textAt(ctx,'r',sx+sq/2,sy+sq+16,{align:'center',size:12,weight:700,color:COL.blue});
    textAt(ctx,'r',sx-10,sy+sq/2+4,{align:'center',size:12,weight:700,color:COL.blue});
    textAt(ctx,'= 1 steradian',sx,sy+sq+36,{size:12,weight:700,color:COL.green});
    textAt(ctx,'Ω = '+fixed(om,2)+' sr',w*0.96,h*0.1,{align:'right',size:Math.min(30,w*0.04),weight:700,color:COL.green});
    $('#A').textContent=fixed(om*rcm*rcm,1)+' cm²'; $('#rr').textContent=fixed(rcm,1)+' cm'; $('#o').textContent=fixed(om,2)+' sr'; $('#f').textContent=fixed(om/(4*Math.PI)*100,1)+' %';
  });
  return wrap;
}

/* ---------------- shared digit-tile helper ---------------- */
function tile(ctx,x,y,tw,th,txt,kind,alpha){
  const S={ sure:[COL.green,'#e4f7ec',COL.ink,null], est:[COL.red,'#fdece7',COL.red,null],
            lead:[COL.red,'#fdf3f0',COL.mid,[4,3]], trail:[COL.yellow,'#fdf4dc',COL.mid,[4,3]],
            plain:[COL.border||COL.faint,'#f6f9fc',COL.ink,null], blue:[COL.blue,'#e6f1fc',COL.ink,null], drop:[COL.red,'#fdece7',COL.red,[3,3]] }[kind]||[COL.mid,'#fff',COL.ink,null];
  ctx.save(); if(alpha!==undefined) ctx.globalAlpha=clamp(alpha,0,1);
  box(ctx,x-tw/2,y-th/2,tw,th,tw*0.16,S[0],S[1],2.2,S[3]);
  textAt(ctx,txt,x,y+th*0.2,{align:'center',size:th*0.62,weight:700,color:S[2]});
  ctx.restore();
}
function dotMark(ctx,x,y,r,alpha){ ctx.save(); ctx.globalAlpha=clamp(alpha===undefined?1:alpha,0,1); circ(ctx,x,y,r,COL.ink,COL.ink,1); ctx.restore(); }

/* =====================================================================
   1.4  READING AN INSTRUMENT — certain digits + one uncertain digit  (1.3)
   ===================================================================== */
function buildA4(){
  const {wrap,$,canvas}=lab(
    slider('L','Length of the rod',4,12,0.001,7.34)+
    group(`<span class="glabel">Marks on the scale</span>${toggles('lc',[['1','1 cm'],['0.1','1 mm'],['0.01','0.1 mm']])}`)+
    cards([{l:'Reading',id:'rd',col:COL.green},{l:'Significant figures',id:'sf'},{l:'Least count',id:'lcv'},{l:'Uncertain digit is',id:'ud',col:COL.red}])+
    hint('Green digits are certain. The last digit, red, is your estimate between two marks.'));
  let lc=1, t=0; const Ls={x:7.34,v:0};
  toggleWire(wrap.querySelectorAll('#lc button'),b=>{ lc=+b.dataset.v; });
  animLoop(dt=>{
    t+=dt;
    const Lt=+$('#L').value; $('#LV').textContent='';
    springTo(Ls,Lt,38,5.5,dt);
    const L=Ls.x, d=Math.round(-Math.log10(lc));
    let cert=Math.floor(L/lc+1e-9)*lc, est=Math.round((L-cert)/lc*10);
    if(est>=10){ cert+=lc; est=0; }
    const reading=(cert+est*lc/10);
    const rs=reading.toFixed(d+1);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    // --- ruler with the rod being pulled out
    const x0=w*0.06, pc=(w*0.88)/14, ry=h*0.20;
    box(ctx,x0,ry,14*pc,h*0.075,4,COL.ink,'#f6f9fc',2);
    for(let i=0;i<=140;i++){ const x=x0+i*pc/10, big=i%10===0; line(ctx,x,ry,x,ry+(big?h*0.05:h*0.022),COL.ink,big?1.6:0.8); if(big) textAt(ctx,String(i/10),x,ry+h*0.073,{align:'center',size:10.5,weight:600,color:COL.muted}); }
    textAt(ctx,'cm',x0+14*pc+4,ry+h*0.05,{size:10.5,color:COL.muted});
    box(ctx,x0,ry-h*0.085,Math.max(4,L*pc),h*0.05,4,COL.blue,'rgba(47,143,224,0.16)',2.4);
    const tipX=x0+L*pc;
    line(ctx,tipX,ry-h*0.095,tipX,ry+h*0.01,COL.red,2.2);
    // --- leader lines to the zoom window
    const zx=w*0.08, zw=w*0.84, zy=h*0.57, zh=h*0.31;
    line(ctx,tipX,ry+h*0.01,zx,zy,COL.blue,1.2,[5,5]); line(ctx,tipX,ry+h*0.01,zx+zw,zy,COL.blue,1.2,[5,5]);
    // --- zoom window: ticks slide past as the rod settles
    ctx.save(); box(ctx,zx,zy,zw,zh,8,COL.blue,'#fff',2.4); ctx.clip();
    const span=8*lc, ppu=zw/span, cxz=zx+zw/2, at=v=>cxz+(v-L)*ppu/1;
    const kk0=Math.floor((L-span/2)/lc)-1, kk1=Math.ceil((L+span/2)/lc)+1;
    // rod body to the tip
    rect(ctx,zx,zy+zh*0.12,cxz-zx,zh*0.2,COL.blue,'rgba(47,143,224,0.14)',2);
    line(ctx,cxz,zy+zh*0.05,cxz,zy+zh*0.95,COL.red,2.6);
    for(let k=kk0;k<=kk1;k++){
      const v=k*lc, x=at(v); line(ctx,x,zy+zh*0.5,x,zy+zh*0.78,COL.ink,2);
      textAt(ctx,v.toFixed(d),x,zy+zh*0.93,{align:'center',size:13,weight:700,color:COL.ink});
    }
    // the ten sub-divisions your eye imagines between the two marks around the tip
    const gx0=at(cert), gw=lc*ppu;
    for(let j=0;j<=10;j++){ line(ctx,gx0+gw*j/10,zy+zh*0.5,gx0+gw*j/10,zy+zh*(j%5===0?0.66:0.6),COL.mid,1); }
    ctx.fillStyle='rgba(217,67,43,0.18)'; ctx.fillRect(gx0+gw*(est-0.5)/10,zy+zh*0.5,gw/10,zh*0.28);
    ctx.restore();
    textAt(ctx,'eye-estimated tenth of a division',cxz+10,zy+zh*0.46,{size:11,weight:600,color:COL.red});
    // --- the reading, digit by digit
    const ty=h*0.455, tw=Math.min(54,w*0.07), th=tw*1.15, n=rs.length, sx=w/2-(n*tw)/2+tw/2;
    for(let i=0;i<n;i++){
      const ch=rs[i], isEst=(i===n-1);
      if(ch==='.') dotMark(ctx,sx+i*tw,ty+th*0.35,4); else tile(ctx,sx+i*tw,ty,tw*0.9,th,ch,isEst?'est':'sure');
    }
    textAt(ctx,'cm',sx+n*tw-tw*0.3,ty+th*0.25,{size:Math.min(22,tw*0.5),weight:700,color:COL.blue});
    $('#rd').textContent=rs+' cm'; $('#sf').textContent=String(rs.replace('.','').length);
    $('#lcv').textContent=lc===1?'1 cm':(lc===0.1?'1 mm':'0.1 mm'); $('#ud').textContent=rs[rs.length-1]+'  (±1)';
  });
  return wrap;
}

/* =====================================================================
   1.5  THE DECIMAL SLIDES, THE FIGURES STAY     (1.3 rules + scientific notation)
   ===================================================================== */
const NUMS={
  a:{D:'2308',e:-3,base:2,txt:'2.308 cm'},   // base unit index into UNITS below
  b:{D:'4700',e:-3,base:1,txt:'4.700 m'},
  c:{D:'123', e:0, base:1,txt:'123 m'},
  d:{D:'3500',e:-3,base:1,txt:'3.500 m'}
};
const UNITS=[['km',3],['m',0],['cm',-2],['mm',-3]];
function layoutNum(D,q){
  const n=D.length, out=[];
  if(q>=0){ for(let i=0;i<n;i++) out.push({ch:D[i],id:'d'+i,k:'sig'}); for(let j=0;j<q;j++) out.push({ch:'0',id:'zr'+j,k:'trail'}); }
  else{ const m=-q;
    if(m<n){ for(let i=0;i<n;i++){ if(i===n-m) out.push({ch:'.',id:'dot',k:'dot'}); out.push({ch:D[i],id:'d'+i,k:'sig'}); } }
    else{ out.push({ch:'0',id:'zl0',k:'lead'}); out.push({ch:'.',id:'dot',k:'dot'}); for(let j=0;j<m-n;j++) out.push({ch:'0',id:'zl'+(j+1),k:'lead'}); for(let i=0;i<n;i++) out.push({ch:D[i],id:'d'+i,k:'sig'}); }
  }
  return out;
}
function sigByRules(s){
  const hasPt=s.includes('.'); let d=s.replace('.','').replace(/^0+/,''); if(!hasPt) d=d.replace(/0+$/,''); return d.length;
}
function buildA5(){
  const {wrap,$,canvas}=lab(
    group(`<span class="glabel">Measured value</span>${toggles('num',[['a','2.308 cm'],['b','4.700 m'],['c','123 m'],['d','3.500 m']],'small')}`)+
    group(`<span class="glabel">Write it in</span>${toggles('un',[['0','km'],['1','m'],['2','cm'],['3','mm']])}
      <div class="toggle-group"><button class="toggle-btn" id="sci">Scientific notation</button></div>`)+
    cards([{l:'Written as',id:'wr',col:COL.blue},{l:'Real figures',id:'tr',col:COL.green},{l:'Plain rules say',id:'ru'},{l:'Verdict',id:'vd',wide:1}])+
    hint('Changing units slides the decimal point. It never changes how many figures were measured.'));
  let cur='a', ui=2, sci=false, t=0; const T={};
  const st=id=>T[id]||(T[id]={x:{x:0,v:0},a:0,init:false,y:0});
  toggleWire(wrap.querySelectorAll('#num button'),b=>{ cur=b.dataset.v; ui=NUMS[cur].base; setUnitBtn(); });
  const ub=wrap.querySelectorAll('#un button');
  function setUnitBtn(){ ub.forEach((b,i)=>b.classList.toggle('active',i===ui)); }
  ub.forEach((b,i)=>b.onclick=()=>{ ui=i; setUnitBtn(); });
  setUnitBtn(); ui=2;
  $('#sci').onclick=()=>{ sci=!sci; $('#sci').classList.toggle('active',sci); };
  const expS={x:0,v:0};
  animLoop(dt=>{
    t+=dt;
    const N=NUMS[cur], D=N.D, n=D.length, q=N.e+UNITS[N.base][1]-UNITS[ui][1];
    let chars, str, expo=q+n-1;
    if(sci){ chars=[]; for(let i=0;i<n;i++){ if(i===1) chars.push({ch:'.',id:'dot',k:'dot'}); chars.push({ch:D[i],id:'d'+i,k:'sig'}); } str=D[0]+(n>1?'.'+D.slice(1):''); }
    else{ chars=layoutNum(D,q); str=chars.map(c=>c.ch).join(''); }
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const tw=clamp(w*0.8/(chars.length+(sci?4:1)),30,66), th=tw*1.15;
    const widths=chars.map(c=>c.k==='dot'?tw*0.4:tw);
    const total=widths.reduce((a,b)=>a+b,0)+(sci?tw*3.4:0);
    let px=w/2-total/2; const ty=h*0.47;
    const seen={};
    chars.forEach((c,i)=>{
      const s=st(c.id), x=px+widths[i]/2; px+=widths[i]; seen[c.id]=1;
      if(!s.init){ s.init=true; s.x.x=x; s.x.v=0; s.y=-26; s.a=0; }
      springTo(s.x,x,110,15,dt); s.a=approach(s.a,1,9,dt); s.y=approach(s.y,0,10,dt);
      if(c.k==='dot') dotMark(ctx,s.x.x,ty+th*0.35+s.y,5,s.a);
      else tile(ctx,s.x.x,ty+s.y,tw*0.9,th,c.ch,c.k==='sig'?'sure':(c.k==='lead'?'lead':'trail'),s.a);
    });
    Object.keys(T).forEach(id=>{ if(!seen[id]){ T[id].a=approach(T[id].a,0,12,dt); if(T[id].a<0.02) T[id].init=false; else if(T[id].init){ const s=T[id]; tile(ctx,s.x.x,ty,tw*0.9,th,'0','lead',s.a); } } });
    if(sci){
      const ex=px+tw*0.2; springTo(expS,expo,60,10,dt);
      textAt(ctx,'× 10',ex,ty+th*0.2,{size:th*0.55,weight:700,color:COL.blue});
      textAt(ctx,fixed(expS.x,0),ex+th*1.18,ty-th*0.12,{size:th*0.42,weight:700,color:COL.blue});
    }
    // fixed physical rod: same length whatever the number says
    const rx0=w*0.2, rx1=w*0.8, ry=h*0.17;
    box(ctx,rx0,ry-8,rx1-rx0,16,4,COL.ink,'#fff',2.4);
    line(ctx,rx0,ry-24,rx0,ry+24,COL.ink,2); line(ctx,rx1,ry-24,rx1,ry+24,COL.ink,2);
    dimLine(ctx,rx0,ry+30,rx1,ry+30,COL.blue);
    textAt(ctx,(sci?str+' × 10'+sup(expo):str)+' '+UNITS[ui][0],w/2,ry-34,{align:'center',size:15,weight:700,color:COL.blue});
    textAt(ctx,'the same rod, the same length',w/2,ry+52,{align:'center',size:11.5,color:COL.mid});
    // counting balls
    const rules=sci?n:sigByRules(str), tru=n, by=h*0.72;
    textAt(ctx,'figures measured',w*0.5,by-30,{align:'center',size:12,weight:700,color:COL.green});
    for(let i=0;i<tru;i++){ const bob=Math.abs(Math.sin(t*3+i*0.7))*6; circ(ctx,w/2+(i-(tru-1)/2)*26,by-bob,9,COL.green,'#e4f7ec',2.2); }
    const bad=rules!==tru;
    textAt(ctx,'figures the plain rules would count',w*0.5,by+36,{align:'center',size:12,weight:700,color:bad?COL.red:COL.green});
    for(let i=0;i<rules;i++){ const bob=Math.abs(Math.sin(t*3+i*0.7+1))*6; circ(ctx,w/2+(i-(rules-1)/2)*26,by+62-bob,9,bad?COL.red:COL.green,bad?'#fdece7':'#e4f7ec',2.2); }
    $('#wr').textContent=(sci?str+' × 10'+sup(expo):str)+' '+UNITS[ui][0]; $('#tr').textContent=String(tru); $('#ru').textContent=String(rules);
    $('#vd').textContent=bad?'Trailing zeros are ambiguous — use scientific notation':'Consistent';
    $('#vd').style.color=bad?COL.red:COL.green;
  });
  return wrap;
}

/* =====================================================================
   1.6  ARITHMETIC WITH SIGNIFICANT FIGURES   (1.3.1 – 1.3.2)
   modes: × ÷  |  + −  |  rounding off
   ===================================================================== */
function toSigStr(x,n){ return Number(x).toPrecision(n); }
function buildA6(){

/* =====================================================================

function buildA7(){

    slider('l','Length  l',5,25,0.1,16.2)+slider('b','Breadth  b',5,25,0.1,10.1)+

    hint('Sheet edges breathe inside their ± limits. Percent errors add when you multiply.'));
  let t=0; const Ls={x:16.2,v:0}, Bs={x:10.1,v:0}, Dd={x:0.1,v:0};

    t+=dt;
    const lT=+$('#l').value, bT=+$('#b').value, dT=+$('#d').value;

    dimLine(ctx,ox,oy+18,ox+lj*pc,oy+18,COL.blue); textAt(ctx,'l = '+fixed(l,1)+' ± '+fixed(de,2)+' cm',ox+lj*pc/2,oy+38,{align:'center',size:13,weight:700,color:COL.blue});

    textAt(ctx,'A = '+fixed(lj*bj,1),ox+lj*pc/2,oy-bj*pc/2+6,{align:'center',size:Math.min(22,pc*2.4),weight:700,color:COL.ink});
    // percent-error bars (right)

/* =====================================================================

const OBJS=[
  {k:'h',n:'Hydrogen atom',a:1.06,b:-10,col:COL.blue},
  {k:'r',n:'Width of a hair',a:8.0,b:-5,col:COL.yellow},
  {k:'a',n:'An ant',a:3.0,b:-3,col:COL.green},

function buildA8(){

    slider('z','View width = 10ˣ metres',-11,8,0.01,0)+
    group(`<span class="glabel">Fly to</span><div class="toggle-group" id="fly">${OBJS.map(o=>`<button class="toggle-btn small" data-v="${o.k}">${o.n}</button>`).join('')}</div>

    cards([{l:'Selected',id:'sel',col:COL.blue},{l:'Size',id:'sz'},{l:'Order of magnitude',id:'om',col:COL.green},{l:'Earth vs hydrogen',id:'gap',col:COL.red,wide:1}])+

/* =====================================================================
   1.10  THE DIMENSIONAL BALANCE     (1.6.1, Examples 1.3 and 1.4)
   Only quantities with the same dimensions can be added or equated.
   ===================================================================== */
const FORMS=[
  {k:'0',lab:'½mv² = mgh', L:[['½ m v²',[1,2,-2]]], R:[['m g h',[1,2,-2]]], note:'Example 1.3 — both sides [M L² T⁻²]'},
  {k:'a',lab:'K = m²v³',   L:[['K',[1,2,-2]]], R:[['m² v³',[2,3,-3]]], note:'Example 1.4 (a)'},
  {k:'b',lab:'K = ½mv²',   L:[['K',[1,2,-2]]], R:[['½ m v²',[1,2,-2]]], note:'Example 1.4 (b) — passes'},
  {k:'c',lab:'K = ma',     L:[['K',[1,2,-2]]], R:[['m a',[1,1,-2]]], note:'Example 1.4 (c)'},
  {k:'d',lab:'K = 3⁄16 mv²',L:[['K',[1,2,-2]]], R:[['3⁄16 m v²',[1,2,-2]]], note:'Example 1.4 (d) — also passes! Dimensions cannot tell (b) from (d).'},
  {k:'e',lab:'K = ½mv² + ma',L:[['K',[1,2,-2]]], R:[['½ m v²',[1,2,-2]],['m a',[1,1,-2]]], note:'Example 1.4 (e) — unlike quantities added'},
  {k:'f',lab:'x = x₀ + v₀t + ½at²',L:[['x',[0,1,0]]], R:[['x₀',[0,1,0]],['v₀ t',[0,1,0]],['½ a t²',[0,1,0]]], note:'every term is a length [L]'},
  {k:'g',lab:'x = x₀ + v₀ + ½at²',L:[['x',[0,1,0]]], R:[['x₀',[0,1,0]],['v₀',[0,1,-1]],['½ a t²',[0,1,0]]], note:'v₀ alone is [L T⁻¹] — it cannot be added to a length'}
];
function buildA10(){
  const {wrap,$,canvas}=lab(
    group(`<span class="glabel">Put an equation on the balance</span><div class="toggle-group" id="fm">${FORMS.map((f,i)=>`<button class="toggle-btn small${i?'':' active'}" data-v="${i}" style="flex:1 1 44%">${f.lab}</button>`).join('')}</div>`)+
    cards([{l:'Left side',id:'ls',col:COL.blue},{l:'Right side',id:'rs',col:COL.blue},{l:'Verdict',id:'vd',wide:1}])+
    hint('Passing the test does not prove an equation right — failing it proves it wrong.'));

    t+=dt;

    line(ctx,cx-ex,py-ey,cx+ex,py+ey,equal?COL.green:(bothOk?COL.red:COL.red),5);

        const ch=Math.min(64,h*0.1), cwid=Math.min(pw*0.92,150), yy=by+hang-ch*(i+1)-2+Math.sin(t*30+i)*(S.ok?0:2);
        box(ctx,bx-cwid/2+shake,yy,cwid,ch-4,7,(S.ok?(equal?COL.green:COL.blue):COL.red),S.ok?(equal?'#e4f7ec':'#e6f1fc'):'#fdece7',2.2);

        textAt(ctx,dimStr(tm[1]),bx+shake,yy+ch*0.75,{align:'center',size:Math.min(12,cwid*0.09),weight:700,color:(S.ok&&!equal)?COL.red:COL.blue});

    textAt(ctx,F.lab,cx,h*0.09,{align:'center',size:Math.min(28,w*0.034),weight:700,color:COL.ink});
    textAt(ctx,msg,cx,h*0.15,{align:'center',size:15,weight:700,color:equal?COL.green:COL.red});

    $('#ls').textContent=L.ok?dimStr(L.d):'mixed'; $('#rs').textContent=R.ok?dimStr(R.d):'mixed';
    $('#vd').textContent=!bothOk?'Wrong — unlike dimensions added':(equal?'Dimensionally correct':'Wrong — dimensions differ'); $('#vd').style.color=equal?COL.green:COL.red;
  });

function buildA11(){

    cards([{l:'x₀  [L]',id:'c0',col:COL.blue},{l:'v₀t  [L T⁻¹][T]',id:'c1',col:COL.green},{l:'½at²  [L T⁻²][T²]',id:'c2',col:COL.yellow},{l:'Position  x',id:'cx'}]));
  let t=0, tm=0, bad=false, lastK=''; const V={lo:{x:-2,v:0},hi:{x:12,v:0}};

  $('#rp').onclick=()=>{ tm=0; };

    line(ctx,ax0,ty,ax1,ty,COL.ink,2.6);
    const step=Math.max(1,Math.ceil((V.hi.x-V.lo.x)/18));
    for(let m=Math.ceil(V.lo.x);m<=V.hi.x;m++){ if(m%step) continue; line(ctx,M(m),ty,M(m),ty+9,COL.ink,1.4); textAt(ctx,String(m),M(m),ty+26,{align:'center',size:11,weight:600,color:COL.muted}); }
    textAt(ctx,'m',ax1+2,ty+26,{size:11,color:COL.muted});
    // cart with spinning wheels
    const x=X(ts), cxp=M(x), spin=x*3;
    box(ctx,cxp-30,ty-44,60,28,5,COL.ink,'#fff',2.6);
    [-18,18].forEach(o=>{ circ(ctx,cxp+o,ty-10,9,COL.ink,'#fff',2.4); line(ctx,cxp+o,ty-10,cxp+o+Math.cos(spin)*8,ty-10+Math.sin(spin)*8,COL.ink,1.8); });
    const vel=v0+a*ts;
    vec(ctx,cxp,ty-60,cxp+clamp(vel*10,-120,120),ty-60,COL.green,3.4); textAt(ctx,'v',cxp+clamp(vel*10,-120,120)+(vel>=0?8:-14),ty-56,{size:13,weight:700,color:COL.green});
    if(Math.abs(a)>0.01){ vec(ctx,cxp,ty-78,cxp+clamp(a*26,-110,110),ty-78,COL.yellow,3.4); textAt(ctx,'a',cxp+clamp(a*26,-110,110)+(a>=0?8:-14),ty-74,{size:13,weight:700,color:COL.yellow}); }
    circ(ctx,M(x0),ty,5,COL.blue,'#fff',2.2); textAt(ctx,'x₀',M(x0),ty+44,{align:'center',size:12,weight:700,color:COL.blue});
    textAt(ctx,'t = '+fixed(ts,1)+' s',ax0,h*0.09,{size:20,weight:700,color:COL.ink});
    // stacked bar: how x is built from the three terms
    const by=h*0.64, bh=h*0.1, s1=x0, s2=v0*ts, s3=0.5*a*ts*ts;
    textAt(ctx,'x is the sum of three lengths',ax0,by-bh-16,{size:13,weight:700,color:COL.muted});
    line(ctx,M(0),by-bh-6,M(0),by+bh+36,COL.faint,1.6,[4,4]);
    let cur=0;
    const seg=(len,col,fill,lab,dim,dashed)=>{
      const a0=M(cur), a1=M(cur+len);
      box(ctx,Math.min(a0,a1),by,Math.max(2,Math.abs(a1-a0)),bh,5,col,fill,2.4,dashed?[6,4]:[]);
      textAt(ctx,lab,(a0+a1)/2,by+bh*0.45,{align:'center',size:13,weight:700,color:col});
      textAt(ctx,dim,(a0+a1)/2,by+bh*0.82,{align:'center',size:11,weight:700,color:col});
      cur+=len;
    };
    seg(s1,COL.blue,'rgba(47,143,224,0.18)','x₀','[L]');
    if(!bad) seg(s2,COL.green,'rgba(31,157,85,0.18)','v₀t','[L]'); else { seg(v0,COL.red,'rgba(217,67,43,0.14)','v₀','[L T⁻¹]',true); }
    seg(s3,COL.yellow,'rgba(217,160,23,0.20)','½at²','[L]');
    line(ctx,M(cur),by+bh+4,M(cur),ty+8,bad?COL.red:COL.green,1.8,[5,4]);
    textAt(ctx,bad?'a speed cannot join a length — the sum has no meaning':'x = '+fixed(cur,2)+' m',M(cur),by+bh+28,{align:'center',size:13,weight:700,color:bad?COL.red:COL.green});
    $('#c0').textContent=fixed(s1,2)+' m'; $('#c1').textContent=bad?'not a length':fixed(s2,2)+' m'; $('#c2').textContent=fixed(s3,2)+' m'; $('#cx').textContent=bad?'meaningless':fixed(x,2)+' m';
  });
  return wrap;
}

/* =====================================================================
   1.12  PENDULUM BY DIMENSIONS     (Example 1.5)
   T = k l^x g^y m^z   →   x = ½,  y = −½,  z = 0   →   T = 2π√(l/g)
   ===================================================================== */
function buildA12(){
  const {wrap,$,canvas}=lab(
    slider('l','Length  l',0.2,2,0.01,1)+
    group(`<span class="glabel">Where is it swinging?  (g)</span>${toggles('pl',[['9.8','Earth 9.8'],['1.62','Moon 1.62'],['24.8','Jupiter 24.8']],'small')}`)+
    slider('m','Mass of bob  m',0.1,2,0.05,0.5)+slider('am','Starting angle',3,20,1,10)+
    cards([{l:'T = 2π√(l/g)',id:'tf',col:COL.blue},{l:'Stopwatch T',id:'tw',col:COL.green},{l:'Exponents',id:'ex',wide:1}]));
  let g=9.8, t=0, phi=0, ph0=0, lastCross=0, Tm=0, cnt=0; const H=[], H0=[];
  toggleWire(wrap.querySelectorAll('#pl button'),b=>{ g=+b.dataset.v; });
  const Lv={x:1,v:0}, Mv={x:0.5,v:0}, GG={x:9.8,v:0};
  animLoop(dt=>{
    t+=dt;
    const lT=+$('#l').value, mT=+$('#m').value, am=+$('#am').value*Math.PI/180;
    $('#lV').textContent=fmt(lT,2)+' m'; $('#mV').textContent=fmt(mT,2)+' kg'; $('#amV').textContent=fmt(am*180/Math.PI,0)+'°';
    springTo(Lv,lT,50,9,dt); springTo(Mv,mT,50,9,dt); springTo(GG,g,50,9,dt);
    const l=Lv.x, om=Math.sqrt(GG.x/l), om0=Math.sqrt(9.8/1);
    const prev=phi; phi+=om*dt; ph0+=om0*dt;
    if(Math.floor(prev/(2*Math.PI))<Math.floor(phi/(2*Math.PI))){ Tm=t-lastCross; lastCross=t; cnt++; if(cnt<2) Tm=0; }
    const th=am*Math.cos(phi), th0=am*Math.cos(ph0);
    H.push([t,th]); H0.push([t,th0]); while(H.length&&H[0][0]<t-6){ H.shift(); H0.shift(); }
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const pxM=h*0.27, py=h*0.07;
    // pendulum drawing (yellow = what you change)
    const draw=(px,len,ang,mass,col,dash)=>{
      line(ctx,px-50,py,px+50,py,COL.ink,5);
      const bx=px+Math.sin(ang)*len*pxM, by=py+Math.cos(ang)*len*pxM, r=8+11*Math.cbrt(mass);
      ctx.save(); ctx.strokeStyle=COL.faint; ctx.lineWidth=1.2; ctx.setLineDash([4,5]); ctx.beginPath(); ctx.arc(px,py,len*pxM,Math.PI/2-am*1.25,Math.PI/2+am*1.25); ctx.stroke(); ctx.restore();
      line(ctx,px,py,bx,by,col,2.6,dash);
      circ(ctx,bx,by,r,col,dash?'rgba(47,143,224,0.12)':'rgba(217,160,23,0.20)',2.8,dash);
      circ(ctx,px,py,4,COL.ink,COL.ink,1);
      return [bx,by];
    };
    line(ctx,w*0.07,py,w*0.07+0.01,py,COL.ink,1);
    const p1=w*0.26, p2=w*0.58;
    draw(p2,1,th0,0.5,COL.blue,[6,4]); textAt(ctx,'reference:  1 m · Earth',p2,py+1.0*pxM+54,{align:'center',size:11.5,weight:700,color:COL.blue});
    draw(p1,l,th,Mv.x,COL.yellow);
    dimLine(ctx,p1-70,py,p1-70,py+l*pxM,COL.blue); textAt(ctx,'l',p1-84,py+l*pxM/2+5,{align:'right',size:14,weight:700,color:COL.blue});
    // scrolling θ(t) traces
    const gx=w*0.06, gw=w*0.88, gy=h*0.84, gh=h*0.09;
    box(ctx,gx,gy-gh-6,gw,2*gh+12,6,COL.faint,'#fbfdff',1.6);
    line(ctx,gx,gy,gx+gw,gy,COL.faint,1.4);
    const tr=(arr,col,dash)=>{ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.setLineDash(dash||[]); ctx.beginPath();
      arr.forEach((p,i)=>{ const X=gx+(p[0]-(t-6))/6*gw, Y=gy-p[1]/am*gh; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.stroke(); ctx.restore(); };
    tr(H0,COL.blue,[6,4]); tr(H,COL.yellow);
    textAt(ctx,'swing angle against time (last 6 s)',gx+8,gy-gh+6,{size:11,weight:600,color:COL.mid});
    // dimensional-analysis panel
    const qx=w*0.66, qy=h*0.12, fz=Math.min(13.5,w*0.021);
    textAt(ctx,'T = k · lˣ · gʸ · mᶻ',qx,qy,{size:Math.min(19,w*0.024),weight:700,color:COL.ink});
    textAt(ctx,'[T] = [L]ˣ [L T⁻²]ʸ [M]ᶻ',qx,qy+30,{size:fz,weight:600,color:COL.blue});
    textAt(ctx,'x + y = 0     −2y = 1     z = 0',qx,qy+56,{size:fz,weight:600,color:COL.muted});
    textAt(ctx,'x = +½   y = −½',qx,qy+86,{size:15,weight:700,color:COL.green});
    box(ctx,qx-8,qy+100,w*0.31,40,8,COL.red,'#fdece7',2.2);
    textAt(ctx,'z = 0  →  mass does not matter',qx+4,qy+125,{size:fz,weight:700,color:COL.red});
    const Tf=2*Math.PI*Math.sqrt(l/GG.x);
    textAt(ctx,'T = 2π √(l / g) = '+fixed(Tf,2)+' s',qx,qy+174,{size:Math.min(17,w*0.022),weight:700,color:COL.blue});
    $('#tf').textContent=fixed(Tf,2)+' s'; $('#tw').textContent=Tm>0?fixed(Tm,2)+' s':'timing…';
    $('#ex').textContent='x = ½ ,  y = −½ ,  z = 0';
  });
  return wrap;
}

/* =====================================================================
   ACTIVITIES + ROUTER
   ===================================================================== */
const activities = [
  { num:'1.1',  title:'Measure with a Unit',      desc:'Same rod · different unit · different number', build: buildA1 },
  { num:'1.2',  title:'The Radian',               desc:'Lay the radius along the arc', build: buildA2 },
  { num:'1.3',  title:'The Steradian',            desc:'A patch of area r² on a sphere', build: buildA3 },
  { num:'1.4',  title:'Reading an Instrument',    desc:'Certain digits and one uncertain digit', build: buildA4 },
  { num:'1.5',  title:'Decimal Slides, Figures Stay', desc:'Change units · count figures', build: buildA5 },
  { num:'1.6',  title:'Arithmetic with Figures',  desc:'Digits you cannot trust fall away', build: buildA6 },
  { num:'1.7',  title:'Error in an Area',         desc:'Percent errors add when you multiply', build: buildA7 },
  { num:'1.8',  title:'Orders of Magnitude',      desc:'Zoom through powers of ten', build: buildA8 },
  { num:'1.9',  title:'Dimensions of Quantities', desc:'Powers of [M] [L] [T]', build: buildA9 },
  { num:'1.10', title:'The Dimensional Balance',  desc:'Both sides must carry the same dimensions', build: buildA10 },
  { num:'1.11', title:'Every Term a Length',      desc:'x = x₀ + v₀t + ½at²', build: buildA11 },
  { num:'1.12', title:'Pendulum by Dimensions',   desc:'T = k lˣ gʸ mᶻ  →  T = 2π√(l/g)', build: buildA12 },
];
let currentIndex = 0;
function buildNav(){
  const nav = document.getElementById('sideNav'); nav.innerHTML='';
  activities.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item'+(i===currentIndex?' active':'');
    btn.innerHTML = `<span class="n-num">${a.num}</span><span class="n-title">${a.title}</span>`;
    btn.onclick = ()=>{ currentIndex=i; render(); };
    nav.appendChild(btn);
  });
}
function render(){
  stopAllLoops(); buildNav();
  const a = activities[currentIndex];
  document.getElementById('panelBadge').textContent = a.num;
  document.getElementById('panelTitle').textContent = a.title;
  document.getElementById('panelDesc').textContent = a.desc||'';
  const body = document.getElementById('panelBody'); body.innerHTML='';
  body.appendChild(a.build());
}
render();
</script>
