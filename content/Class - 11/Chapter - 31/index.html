<!DOCTYPE html>
<html lang="en">
<head>

<title>Grade 11 · Chapter 9 — Straight Lines | Botclub Labs</title>
<style>
:root{
  --navy-1:#0f2640; --navy-2:#1a3a5c; --navy-3:#234a73;
  --accent:#2f8fe0; --accent-2:#5cc8ff;
  --bg:#eef2f8; --surface-0:#ffffff; --surface-1:#f6f9fc; --surface-2:#eef2f8;
  --border:#dbe4f0; --border-strong:#c2d1e5;
  --text-1:#132a44; --text-2:#4c6178; --text-3:#8195ab;
  --f-red:#d9432b; --f-blue:#2f8fe0; --f-green:#1f9d55; --f-yellow:#d9a017;
  --radius:14px; --radius-sm:9px;
  --fs-xs:clamp(10px,0.62vw,12px); --fs-sm:clamp(11px,0.72vw,13.5px);
  --fs-md:clamp(12.5px,0.85vw,15px); --fs-lg:clamp(15px,1.15vw,19px);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--text-1); overflow:hidden; }
button, input, select{font-family:inherit;}

.app{height:100vh; display:flex; flex-direction:column; min-height:0;}
.topbar{
  flex:0 0 auto; background:linear-gradient(120deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:#fff; padding:clamp(9px,1vh,16px) clamp(14px,1.6vw,28px);
  display:flex; align-items:center; gap:var(--sp-4); box-shadow:0 2px 10px rgba(15,38,64,0.25); z-index:5;
}
.topbar .brand-badge{
  width:clamp(32px,2.4vw,40px); height:clamp(32px,2.4vw,40px); border-radius:10px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,1.3vw,20px); flex:0 0 auto;
}
.topbar .chip{
  display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
  border-radius:6px; padding:2px 9px; font-size:var(--fs-xs); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin-bottom:3px;
}
.topbar h1{font-size:var(--fs-lg); font-weight:600; line-height:1.2; white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .legend{display:flex; gap:14px; font-size:var(--fs-xs); color:rgba(255,255,255,0.85); align-items:center;}
.topbar .legend span{display:inline-flex; align-items:center; gap:5px;}
.topbar .legend i{width:12px; height:4px; border-radius:2px; display:inline-block;}

.body-wrap{flex:1; display:flex; min-height:0; overflow:hidden;}
.sidenav{
  flex:0 0 clamp(170px,13.5vw,230px); background:var(--surface-0); border-right:1px solid var(--border);
  overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  border:1px solid var(--border); background:var(--surface-1); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; transition:all .15s ease;
}
.nav-item:hover{background:var(--surface-2); border-color:var(--border-strong);}
.nav-item.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.nav-item .n-num{font-size:var(--fs-xs); font-weight:700; color:var(--accent); flex:0 0 auto; min-width:34px;}
.nav-item.active .n-num{color:var(--accent-2);}
.nav-item .n-title{font-size:var(--fs-sm); font-weight:600; line-height:1.25;}

.content{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
.panel-head{flex:0 0 auto; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--surface-0); display:flex; align-items:baseline; gap:12px;}
.panel-badge{background:var(--navy-2); color:#fff; font-size:var(--fs-xs); font-weight:700; padding:3px 10px; border-radius:6px;}
.panel-head h2{font-size:var(--fs-lg); font-weight:600; color:var(--text-1);}
.panel-head p{font-size:var(--fs-sm); color:var(--text-2); flex:1; text-align:right;}
.panel-body{flex:1; min-height:0; overflow:hidden; padding:var(--sp-3) var(--sp-5); display:flex;}

.lab-view{flex:1; display:flex; gap:var(--sp-4); min-height:0; min-width:0;}
.lab-canvas-wrap{flex:7 1 0; min-width:0; min-height:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius); position:relative; overflow:hidden;}
.lab-canvas-wrap canvas{width:100%; height:100%; display:block;}
.lab-side{flex:3 1 0; min-width:230px; display:flex; flex-direction:column; gap:var(--sp-3); min-height:0; overflow-y:auto; padding-right:2px;}

.control-group{background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.control-group label{font-size:var(--fs-sm); font-weight:600; color:var(--text-1); display:flex; justify-content:space-between;}
.control-group label .val{color:var(--accent); font-weight:700;}
.control-group input[type=range]{width:100%; margin-top:6px; accent-color:var(--navy-2); cursor:pointer;}
.control-group input[type=range]:disabled{opacity:.45; cursor:not-allowed;}
.toggle-group{display:flex; gap:6px; flex-wrap:wrap;}
.toggle-btn{flex:1; min-width:56px; padding:8px 6px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-align:center; color:var(--text-2);}
.toggle-btn.active{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.chip-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; margin:3px 3px 0 0; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:18px; cursor:pointer; font-size:var(--fs-sm); font-weight:600; color:var(--text-2);}
.chip-btn:hover{border-color:var(--navy-2); color:var(--navy-2);}
.chip-wrap{display:flex; flex-wrap:wrap;}

.result-cards{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.rcard{background:var(--surface-0); border:1px solid var(--border); border-radius:9px; padding:7px 9px; min-width:0;}
.rcard .rlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); font-weight:600;}
.rcard .rval{font-size:var(--fs-md); font-weight:700; color:var(--text-1); margin-top:1px; overflow-wrap:anywhere;}
.rcard.wide{grid-column:1/-1;}
.fb{font-size:var(--fs-xs); font-weight:600; padding:6px 9px; border-radius:7px; background:var(--surface-2); color:var(--text-3);}
.fb.ok{background:#e4f7ec; color:#1f6b3d;}
.fb.bad{background:#fdece7; color:#a4331c;}
.fb.warn{background:#fdf4dc; color:#8a6410;}
.hidden{display:none !important;}

@media (max-width:1000px) and (orientation:portrait), (max-width:1000px) and (min-height:601px){
  .body-wrap{flex-direction:column;}
  .sidenav{flex:0 0 auto; width:100%; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--border); padding:6px;}
  .nav-item{flex:0 0 auto; width:150px;}
  .panel-body{overflow-y:auto;}
  .lab-view{flex-direction:column;}
  .lab-canvas-wrap{min-height:320px;}
  .lab-side{min-width:0;}
  .content{overflow-y:auto;}
  .topbar .legend{display:none;}
  .topbar h1{white-space:normal;}
}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

<div class="app">
  <div class="topbar">
    <div class="brand-badge">📐</div>

<script>
/* =========================================================================
   GRADE 11 — CHAPTER 9: STRAIGHT LINES
   Every activity runs on a continuous animation loop. Sliders and buttons
   only set a TARGET; points, lines and angles are spring-damped toward it
   every frame (they glide, overshoot slightly and settle — never jump).
   Ambient motion is always on: balls roll down inclines under real gravity
   (a = 5/7·g·sin θ for a solid sphere), probes slide along lines, pulses
   mark intersections. Numbers shown are exact (from the slider targets);
   the drawing is the animated version of the same numbers.
   ========================================================================= */
const COL = {red:'#d9432b', blue:'#2f8fe0', green:'#1f9d55', yellow:'#d9a017', ink:'#132a44', muted:'#4c6178', mid:'#8195ab'};
const PI = Math.PI;

/* ---------------------------------------------------------------------
   0. CANVAS + MATH HELPERS
   --------------------------------------------------------------------- */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(200, r.width), h = Math.max(160, r.height);
  if(canvas._w!==w || canvas._h!==h || canvas._dpr!==dpr){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function line(ctx,x1,y1,x2,y2,color,width,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||2;
  if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrowHead(ctx,x,y,ang,color,size){
  size=size||7; ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.42); ctx.lineTo(-size,-size*0.42); ctx.closePath(); ctx.fill(); ctx.restore();
}
function textAt(ctx,txt,x,y,opts){
  opts=opts||{}; ctx.save();
  ctx.font=(opts.weight||600)+' '+(opts.size||12.5)+'px Poppins, system-ui, sans-serif';
  ctx.textAlign=opts.align||'left'; ctx.textBaseline=opts.baseline||'alphabetic';
  if(opts.halo!==false){ ctx.lineJoin='round'; ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.strokeText(txt,x,y); }
  ctx.fillStyle=opts.color||COL.ink; ctx.fillText(txt,x,y); ctx.restore();
}
function circ(ctx,x,y,r,stroke,fill,lw){ ctx.save(); ctx.lineWidth=lw||2.2; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,PI*2); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.stroke();} ctx.restore(); }
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(x,d){ if(!isFinite(x)) return '—'; d=d===undefined?2:d; const s=Number(x.toFixed(d)).toString(); return s==='-0'?'0':s; }
function angDiff(a,b){ return Math.atan2(Math.sin(a-b),Math.cos(a-b)); }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a; }
const deg = r=>r*180/PI;

/** nice fraction for slopes / coordinates: 1.5 → "3/2" */
function fr(v){
  if(!isFinite(v)) return '∞';
  if(Math.abs(v)<1e-9) return '0';
  const s=v<0?'−':''; v=Math.abs(v);
  for(let d=1; d<=12; d++){ const n=Math.round(v*d); if(Math.abs(v*d-n)<1e-6) return s+(d===1?n:n+'/'+d); }
  return s+fmt(v,2);
}
/** " − 3" / " + 2" suffix used in  y − y₀  and  x + 2  */
function sub(v){ if(Math.abs(v)<1e-9) return ''; return v>0 ? '− '+fr(v) : '+ '+fr(-v); }
/** Ax + By + C = 0 with integer coefficients. bPos → make B positive (textbook style) */
function intForm(A,B,C,bPos){
  let k=0;
  for(let q=1;q<=24;q++){ if([A,B,C].every(v=>Math.abs(v*q-Math.round(v*q))<1e-6*Math.max(1,q))){ k=q; break; } }
  if(!k) return null;
  let a=Math.round(A*k), b=Math.round(B*k), c=Math.round(C*k);
  const g=gcd(gcd(a,b),c)||1; a/=g; b/=g; c/=g;
  if(bPos && (b<0 || (b===0 && a<0))){ a=-a; b=-b; c=-c; }
  return [a,b,c];
}
function eqStr(abc){
  if(!abc) return '—';
  let s=''; const add=(v,sym)=>{ if(!v) return; const av=Math.abs(v), body=(sym&&av===1?'':av)+sym;
    s += s ? (v<0?' − ':' + ')+body : (v<0?'−':'')+body; };
  add(abc[0],'x'); add(abc[1],'y'); add(abc[2],'');
  return (s||'0')+' = 0';
}
function eqGen(A,B,C,bPos){ return eqStr(intForm(A,B,C,bPos) || [A,B,C].map(v=>+fmt(v,2))); }

/* ---------------------------------------------------------------------
   0b. ANIMATION ENGINE
   --------------------------------------------------------------------- */
let activeStops = [];
function stopAllLoops(){ activeStops.forEach(s=>{ try{ s(); }catch(e){} }); activeStops=[]; }
function animLoop(tick){
  let last = performance.now(), raf;
  function frame(now){
    const dt = Math.max(0, Math.min(0.04, (now-last)/1000));
    last = now; tick(dt); raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const stop = ()=>cancelAnimationFrame(raf);
  activeStops.push(stop);
  return stop;
}
/** Spring-damper — natural overshoot and settle. */
function springTo(state,target,k,damping,dt){
  const acc = (target-state.x)*k - state.v*damping;
  state.v += acc*dt; state.x += state.v*dt;
  return state.x;
}
/** Bank of springs, one per named quantity. mod=π makes line angles take the short way round. */
function follower(k,c){
  k=k||70; c=c||12; const m={};
  return function(n,tgt,dt,mod){
    let s=m[n]; if(!s) s=m[n]={x:tgt,v:0};
    if(mod) tgt += mod*Math.round((s.x-tgt)/mod);
    springTo(s,tgt,k,c,dt); return s.x;
  };
}
function toggleWire(btns,cb){
  btns.forEach(b=>b.onclick=()=>{ btns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); cb(b); });
}

/* ---------------------------------------------------------------------
   0c. COORDINATE PLANE — world units → pixels, grid, axes
   --------------------------------------------------------------------- */
function plane(w,h){
  const sc=Math.min(w,h)/21, cx=w/2, cy=h/2;
  const P={w,h,sc,cx,cy, X:x=>cx+x*sc, Y:y=>cy-y*sc};
  P.x0=-cx/sc; P.x1=(w-cx)/sc; P.y1=cy/sc; P.y0=-(h-cy)/sc;
  return P;
}
function drawPlane(ctx,P){
  const {w,h,sc}=P, step=sc>=22?1:2;
  ctx.save(); ctx.lineWidth=1;
  for(let x=Math.ceil(P.x0); x<=P.x1; x++){ ctx.strokeStyle=x%5===0?'#d3deec':'#edf2f8'; ctx.beginPath(); ctx.moveTo(P.X(x),0); ctx.lineTo(P.X(x),h); ctx.stroke(); }
  for(let y=Math.ceil(P.y0); y<=P.y1; y++){ ctx.strokeStyle=y%5===0?'#d3deec':'#edf2f8'; ctx.beginPath(); ctx.moveTo(0,P.Y(y)); ctx.lineTo(w,P.Y(y)); ctx.stroke(); }
  ctx.restore();
  line(ctx,0,P.Y(0),w,P.Y(0),COL.ink,1.8); line(ctx,P.X(0),0,P.X(0),h,COL.ink,1.8);
  arrowHead(ctx,w-1,P.Y(0),0,COL.ink,9); arrowHead(ctx,P.X(0),1,-PI/2,COL.ink,9);
  for(let n=Math.ceil(P.x0); n<=P.x1; n++){ if(n===0||n%step) continue; textAt(ctx,n,P.X(n),P.Y(0)+15,{align:'center',size:10.5,weight:500,color:COL.mid,halo:false}); }
  for(let n=Math.ceil(P.y0); n<=P.y1; n++){ if(n===0||n%step) continue; textAt(ctx,n,P.X(0)-7,P.Y(n)+4,{align:'right',size:10.5,weight:500,color:COL.mid,halo:false}); }
  textAt(ctx,'O',P.X(0)-9,P.Y(0)+15,{align:'right',size:11,color:COL.muted,halo:false});
  textAt(ctx,'X',w-14,P.Y(0)-8,{size:12,weight:700,color:COL.ink,halo:false});
  textAt(ctx,'Y',P.X(0)+9,16,{size:12,weight:700,color:COL.ink,halo:false});
}
function pt(ctx,P,x,y,col,r){ circ(ctx,P.X(x),P.Y(y),r||6.5,COL.ink,col,2.2); }
function lblW(ctx,P,txt,x,y,col,dx,dy,align){ textAt(ctx,txt,P.X(x)+(dx||0),P.Y(y)+(dy||0),{color:col||COL.ink,align:align||'left',size:12.5,weight:700}); }
function caption(ctx,txt,col,row){ textAt(ctx,txt,16,26+(row||0)*21,{size:14,weight:700,color:col||COL.ink}); }
/** infinite line through (x,y) with direction (dx,dy) */
function wline(ctx,P,x,y,dx,dy,col,lw,dash,off){
  const n=Math.hypot(dx,dy)||1; dx/=n; dy/=n; const L=(P.w+P.h)/P.sc+2;
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||3; ctx.lineCap='round';
  if(dash){ ctx.setLineDash(dash); ctx.lineDashOffset=off||0; }
  ctx.beginPath(); ctx.moveTo(P.X(x-dx*L),P.Y(y-dy*L)); ctx.lineTo(P.X(x+dx*L),P.Y(y+dy*L)); ctx.stroke(); ctx.restore();
}
/** infinite line Ax + By + C = 0 */
function gline(ctx,P,A,B,C,col,lw,dash,off){ const d=A*A+B*B; if(d<1e-9) return; wline(ctx,P,-A*C/d,-B*C/d,-B,A,col,lw,dash,off); }
function wseg(ctx,P,x1,y1,x2,y2,col,lw,dash){ line(ctx,P.X(x1),P.Y(y1),P.X(x2),P.Y(y2),col,lw||2.5,dash); }
/** filled/outlined angle sector, world angles a0<a1 (counter-clockwise) */
function arcW(ctx,P,x,y,a0,a1,rpx,col,fillc,dash){
  const sx=P.X(x), sy=P.Y(y); ctx.save();
  if(fillc){ ctx.beginPath(); ctx.moveTo(sx,sy); ctx.arc(sx,sy,rpx,-a0,-a1,true); ctx.closePath(); ctx.fillStyle=fillc; ctx.fill(); }
  ctx.beginPath(); ctx.arc(sx,sy,rpx,-a0,-a1,true); ctx.strokeStyle=col; ctx.lineWidth=2.6; if(dash) ctx.setLineDash(dash); ctx.stroke(); ctx.restore();
}
/** right-angle square at (x,y) between unit vectors u and v (world) */
function rightMark(ctx,P,x,y,ux,uy,vx,vy,s,col){
  const ox=P.X(x), oy=P.Y(y); ctx.save(); ctx.beginPath();
  ctx.moveTo(ox+ux*s,oy-uy*s); ctx.lineTo(ox+(ux+vx)*s,oy-(uy+vy)*s); ctx.lineTo(ox+vx*s,oy-vy*s);
  ctx.strokeStyle=col||COL.green; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
}
function ring(ctx,P,x,y,t,col,period,maxR){
  const u=((t/period)%1+1)%1; ctx.save(); ctx.globalAlpha=(1-u)*0.9;
  circ(ctx,P.X(x),P.Y(y),(0.25+u)*(maxR||1.6)*P.sc,col,null,2.4); ctx.restore();
}
/** double-headed dimension arrow (screen space) */
function dimW(ctx,P,x1,y1,x2,y2,col){
  const a=Math.atan2(P.Y(y2)-P.Y(y1),P.X(x2)-P.X(x1));
  line(ctx,P.X(x1),P.Y(y1),P.X(x2),P.Y(y2),col,2.2);
  arrowHead(ctx,P.X(x2),P.Y(y2),a,col,8); arrowHead(ctx,P.X(x1),P.Y(y1),a+PI,col,8);
}

/* ---------------------------------------------------------------------
   0d. ROLLING BALL — real incline physics. A solid sphere rolls without
       slipping down a line of inclination θ with a = (5/7)·g·sin θ.
       (g is scaled so a 20-unit slope takes a watchable few seconds.)
   --------------------------------------------------------------------- */
function newRoller(){ return {s:null,v:0,age:0,rot:0}; }
function rollStep(r,px,py,th,dt){
  let dx=Math.cos(th), dy=Math.sin(th); if(dy<0){ dx=-dx; dy=-dy; }
  const sn=dy;
  if(sn<=0.02){ r.s=0; r.v=0; r.age=1; }
  else{
    const lim=14; let sTop=(8.8-py)/sn, sEnd=(-9.6-py)/sn;
    if(dx>1e-6){ sTop=Math.min(sTop,(lim-px)/dx); sEnd=Math.max(sEnd,-(lim+px)/dx); }
    else if(dx<-1e-6){ sTop=Math.min(sTop,(lim+px)/-dx); sEnd=Math.max(sEnd,-(lim-px)/-dx); }
    if(r.s===null || r.s>sTop+0.5 || r.s<sEnd){ r.s=sTop; r.v=0; r.age=0; }
    r.age+=dt; r.v+=7*sn*dt; r.s-=r.v*dt; r.rot+=(dx>=0?-1:1)*r.v*dt/0.36;
  }
  const nx=dx>=0?-dy:dy, ny=dx>=0?dx:-dx;
  return {x:px+dx*r.s+nx*0.36, y:py+dy*r.s+ny*0.36, rot:r.rot, a:Math.min(1,r.age*4)};
}
function drawBall(ctx,P,b){
  const x=P.X(b.x), y=P.Y(b.y), r=0.36*P.sc;
  ctx.save(); ctx.globalAlpha=b.a;
  circ(ctx,x,y,r,COL.ink,'#fff',2.4);
  for(let i=0;i<3;i++){ const a=b.rot+i*PI*2/3; line(ctx,x,y,x+Math.cos(a)*r*0.92,y+Math.sin(a)*r*0.92,COL.yellow,2.2); }
  circ(ctx,x,y,2.4,COL.ink,COL.ink,1);
  ctx.restore();
}

function sliderGroup(defs,id){
  return `<div class="control-group"${id?` id="${id}"`:''}>`+defs.map((d,i)=>
    `<label${i?' style="margin-top:8px;"':''}>${d.label} <span class="val" id="${d.id}V"></span></label>`+
    `<input type="range" id="${d.id}" min="${d.min}" max="${d.max}" step="${d.step===undefined?1:d.step}" value="${d.val}">`).join('')+`</div>`;
}
function readVals(wrap,defs){

    wrap.querySelector('#'+d.id+'V').textContent=fmt(o[d.id],d.dec||0)+(d.unit||''); });
  return o;
}
function setVals(wrap,vals){ for(const k in vals){ const el=wrap.querySelector('#'+k); if(el) el.value=vals[k]; } }
function presetHTML(list){ return `<div class="control-group"><div class="chip-wrap">`+list.map((p,i)=>`<button class="chip-btn" data-p="${i}">${p.label}</button>`).join('')+`</div></div>`; }
function wirePresets(wrap,list){ wrap.querySelectorAll('.chip-btn[data-p]').forEach(b=>b.onclick=()=>{ const p=list[+b.dataset.p]; setVals(wrap,p.set); if(p.then) p.then(); }); }
function cardsHTML(list){

function toggleHTML(id,items){ return `<div class="control-group"><div class="toggle-group" id="${id}">`+items.map((t,i)=>`<button class="toggle-btn${i===0?' active':''}" data-v="${i}">${t}</button>`).join('')+`</div></div>`; }

/* =====================================================================
   9.1  DISTANCE & SECTION POINT
   PQ = √[(x₂−x₁)² + (y₂−y₁)²]       R = ((m·x₂+n·x₁)/(m+n), (m·y₂+n·y₁)/(m+n))
   Textbook check: (6,−4),(3,0) → 5.   (1,−3),(−3,9) in 1:3 → (0,0).
   ===================================================================== */
function buildA1(){
  const wrap=labShell();
  const d1=[{id:'x1',label:'P · x₁',min:-9,max:9,val:6},{id:'y1',label:'P · y₁',min:-9,max:9,val:-4},
            {id:'x2',label:'Q · x₂',min:-9,max:9,val:3},{id:'y2',label:'Q · y₂',min:-9,max:9,val:0}];
  const d2=[{id:'rm',label:'Ratio  m',min:1,max:9,val:1},{id:'rn',label:'Ratio  n',min:1,max:9,val:3}];
  const defs=d1.concat(d2);
  const presets=[{label:'(6,−4) → (3,0)',set:{x1:6,y1:-4,x2:3,y2:0}},{label:'(1,−3) → (−3,9) · 1:3',set:{x1:1,y1:-3,x2:-3,y2:9,rm:1,rn:3}}];
  wrap.querySelector('.lab-side').innerHTML = presetHTML(presets)+sliderGroup(d1)+sliderGroup(d2)+cardsHTML([
    {id:'cD',label:'Distance PQ',color:COL.blue,wide:true},{id:'cR',label:'Section point R',color:COL.green},{id:'cM',label:'Mid-point',color:COL.blue}]);
  wirePresets(wrap,presets);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(); let t=0;
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const P=plane(w,h); drawPlane(ctx,P);
    const x1=F('x1',V.x1,dt), y1=F('y1',V.y1,dt), x2=F('x2',V.x2,dt), y2=F('y2',V.y2,dt), m=F('m',V.rm,dt), n=F('n',V.rn,dt);
    const dx=x2-x1, dy=y2-y1;
    // legs of the right triangle
    wseg(ctx,P,x1,y1,x2,y1,COL.blue,2.2,[7,5]); wseg(ctx,P,x2,y1,x2,y2,COL.blue,2.2,[7,5]);
    if(Math.abs(dx)>0.6&&Math.abs(dy)>0.6) rightMark(ctx,P,x2,y1,Math.sign(-dx),0,0,Math.sign(dy),11,COL.blue);
    lblW(ctx,P,'|Δx| = '+fmt(Math.abs(dx),1),(x1+x2)/2,y1,COL.blue,0,dy>=0?19:-9,'center');
    lblW(ctx,P,'|Δy| = '+fmt(Math.abs(dy),1),x2,(y1+y2)/2,COL.blue,dx>=0?10:-10,4,dx>=0?'left':'right');
    // the segment, with a pulse travelling along it
    wseg(ctx,P,x1,y1,x2,y2,COL.red,4.2);
    const u=0.5-0.5*Math.cos(t*2.1); circ(ctx,P.X(lerp(x1,x2,u)),P.Y(lerp(y1,y2,u)),5,COL.red,'#fff',2.4);
    // section point R and mid-point M
    const rx=(m*x2+n*x1)/(m+n), ry=(m*y2+n*y1)/(m+n);
    ring(ctx,P,rx,ry,t,COL.green,1.8,1.2);
    pt(ctx,P,rx,ry,COL.green,7); lblW(ctx,P,'R',rx,ry,COL.green,10,-10);
    circ(ctx,P.X((x1+x2)/2),P.Y((y1+y2)/2),4.5,COL.blue,'#fff',2);
    pt(ctx,P,x1,y1,COL.yellow); pt(ctx,P,x2,y2,COL.yellow);
    lblW(ctx,P,'P ('+V.x1+', '+V.y1+')',x1,y1,COL.ink,10,-11); lblW(ctx,P,'Q ('+V.x2+', '+V.y2+')',x2,y2,COL.ink,10,-11);
    caption(ctx,'PQ = √[(x₂−x₁)² + (y₂−y₁)²]');
    // exact numbers from the targets
    const DX=V.x2-V.x1, DY=V.y2-V.y1;
    $('#cD').textContent='√('+DX*DX+' + '+DY*DY+') = '+fmt(Math.hypot(DX,DY),2)+' units';
    $('#cR').textContent='('+fr((V.rm*V.x2+V.rn*V.x1)/(V.rm+V.rn))+', '+fr((V.rm*V.y2+V.rn*V.y1)/(V.rm+V.rn))+')';
    $('#cM').textContent='('+fr((V.x1+V.x2)/2)+', '+fr((V.y1+V.y2)/2)+')';
  });
  return wrap;
}

/* =====================================================================
   9.2  INCLINATION & SLOPE      m = tan θ   (undefined at 90°)
   Ball: solid sphere rolling down the line, a = (5/7) g sin θ.
   Textbook check: θ = 60° → m = √3 ≈ 1.73.
   ===================================================================== */
function buildA2(){
  const wrap=labShell();
  const defs=[{id:'th',label:'Inclination θ',min:0,max:180,step:1,val:60,unit:'°'}];
  const presets=[0,30,45,60,90,135].map(a=>({label:a+'°',set:{th:a}}));
  wrap.querySelector('.lab-side').innerHTML = sliderGroup(defs)+presetHTML(presets)+cardsHTML([
    {id:'cT',label:'Inclination θ',color:COL.yellow},{id:'cM',label:'Slope m = tan θ',color:COL.blue},
    {id:'cE',label:'Line through O',color:COL.red,wide:true}]);
  wirePresets(wrap,presets);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(); const R=newRoller(); let t=0;
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const P=plane(w,h); drawPlane(ctx,P);
    const thd=F('th',V.th,dt), th=thd*PI/180, cs=Math.cos(th), sn=Math.sin(th), m=sn/cs;
    // slope triangle on the line
    if(Math.abs(cs)>0.04 && Math.abs(m)<14){
      const a=3.2, r=Math.min(4,5/Math.max(Math.abs(m),0.01)), ya=m*a, yb=m*(a+r);
      wseg(ctx,P,a,ya,a+r,ya,COL.blue,2.4,[7,5]); wseg(ctx,P,a+r,ya,a+r,yb,COL.blue,2.4,[7,5]);
      lblW(ctx,P,'run '+fmt(r,1),a+r/2,ya,COL.blue,0,m>=0?19:-8,'center');
      lblW(ctx,P,'rise '+fmt(yb-ya,1),a+r,(ya+yb)/2,COL.blue,10,4);
    }
    wline(ctx,P,0,0,cs,sn,COL.red,4.8);
    const b=rollStep(R,0,0,th,dt); drawBall(ctx,P,b);
    if(thd>0.5&&thd<179.5){
      arcW(ctx,P,0,0,0,th,1.8*P.sc,COL.yellow,'rgba(217,160,23,0.16)');
      lblW(ctx,P,'θ = '+fmt(thd,0)+'°',2.4*Math.cos(th/2),2.4*Math.sin(th/2),COL.yellow,0,4,'center');
    }
    pt(ctx,P,0,0,'#fff',5);
    caption(ctx,'m = tan θ');
    if(Math.abs(cs)<0.02) textAt(ctx,'vertical — slope undefined',P.X(0)+16,P.Y(6),{color:COL.red,size:13,weight:700});
    // exact numbers
    const tr=V.th*PI/180, vert=V.th===90;
    $('#cT').textContent=V.th+'°';
    $('#cM').textContent=vert?'undefined':fr(Math.tan(tr));
    $('#cE').textContent=vert?'x = 0':V.th===0||V.th===180?'y = 0':'y = '+fmt(Math.tan(tr),2)+'x';
  });
  return wrap;
}

/* =====================================================================
   9.2.1  SLOPE FROM TWO POINTS     m = (y₂ − y₁)/(x₂ − x₁)
   Textbook check (Ex 1): (3,−2),(−1,4) → −3/2 · (3,−2),(7,−2) → 0 · (3,−2),(3,4) → undefined
   ===================================================================== */
function buildA3(){
  const wrap=labShell();
  const defs=[{id:'x1',label:'P · x₁',min:-9,max:9,val:3},{id:'y1',label:'P · y₁',min:-9,max:9,val:-2},
              {id:'x2',label:'Q · x₂',min:-9,max:9,val:-1},{id:'y2',label:'Q · y₂',min:-9,max:9,val:4}];
  const presets=[{label:'(3,−2) → (−1,4)',set:{x1:3,y1:-2,x2:-1,y2:4}},{label:'(3,−2) → (7,−2)',set:{x1:3,y1:-2,x2:7,y2:-2}},{label:'(3,−2) → (3,4)',set:{x1:3,y1:-2,x2:3,y2:4}}];
  wrap.querySelector('.lab-side').innerHTML = presetHTML(presets)+sliderGroup(defs)+cardsHTML([
    {id:'cDy',label:'Rise Δy',color:COL.blue},{id:'cDx',label:'Run Δx',color:COL.blue},
    {id:'cM',label:'Slope m = Δy / Δx',color:COL.green,wide:true},{id:'cT',label:'Inclination θ',color:COL.yellow,wide:true}]);
  wirePresets(wrap,presets);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(); const R=newRoller(); let t=0;
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const P=plane(w,h); drawPlane(ctx,P);
    const x1=F('x1',V.x1,dt), y1=F('y1',V.y1,dt), x2=F('x2',V.x2,dt), y2=F('y2',V.y2,dt);
    const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
    wseg(ctx,P,x1,y1,x2,y1,COL.blue,2.4,[7,5]); wseg(ctx,P,x2,y1,x2,y2,COL.blue,2.4,[7,5]);
    lblW(ctx,P,'run '+fmt(dx,1),(x1+x2)/2,y1,COL.blue,0,dy>=0?19:-9,'center');
    lblW(ctx,P,'rise '+fmt(dy,1),x2,(y1+y2)/2,COL.blue,dx>=0?10:-10,4,dx>=0?'left':'right');
    if(len>0.05){
      const ang=((Math.atan2(dy,dx)%PI)+PI)%PI, low=y1<=y2?{x:x1,y:y1}:{x:x2,y:y2};
      wline(ctx,P,x1,y1,dx,dy,COL.red,4.8);
      wseg(ctx,P,low.x-2.4,low.y,low.x+2.4,low.y,COL.mid,1.6,[5,4]);
      if(ang>0.01&&ang<PI-0.01){ arcW(ctx,P,low.x,low.y,0,ang,1.5*P.sc,COL.yellow,'rgba(217,160,23,0.16)'); lblW(ctx,P,'θ',low.x+1.95*Math.cos(ang/2),low.y+1.95*Math.sin(ang/2),COL.yellow,0,4,'center'); }
      const b=rollStep(R,low.x,low.y,ang,dt); drawBall(ctx,P,b);
    }
    pt(ctx,P,x1,y1,COL.yellow); pt(ctx,P,x2,y2,COL.yellow);
    lblW(ctx,P,'P ('+V.x1+', '+V.y1+')',x1,y1,COL.ink,10,-11); lblW(ctx,P,'Q ('+V.x2+', '+V.y2+')',x2,y2,COL.ink,10,-11);
    caption(ctx,'m = (y₂ − y₁) / (x₂ − x₁)');
    const DX=V.x2-V.x1, DY=V.y2-V.y1;
    $('#cDy').textContent=fr(DY); $('#cDx').textContent=fr(DX);
    if(DX===0&&DY===0){ $('#cM').textContent='same point'; $('#cT').textContent='—'; }
    else if(DX===0){ $('#cM').textContent=fr(DY)+' / 0 → undefined'; $('#cT').textContent='90°'; }
    else { $('#cM').textContent=fr(DY)+' / '+(DX<0?'('+fr(DX)+')':fr(DX))+' = '+fr(DY/DX); $('#cT').textContent=fmt(((deg(Math.atan2(DY,DX))%180)+180)%180,1)+'°'; }
  });
  return wrap;
}

/* =====================================================================
   9.2.2  PARALLEL & PERPENDICULAR
   Parallel ⇔ m₁ = m₂         Perpendicular ⇔ m₁·m₂ = −1
   ===================================================================== */
function buildA4(){
  const wrap=labShell();
  const defs=[{id:'m1',label:'Slope m₁  (red)',min:-5,max:5,step:0.1,val:0.5,dec:1},{id:'m2',label:'Slope m₂  (blue)',min:-5,max:5,step:0.1,val:0.5,dec:1}];
  wrap.querySelector('.lab-side').innerHTML = toggleHTML('modeB',['Parallel','Perpendicular','Free'])+sliderGroup(defs)+cardsHTML([
    {id:'c1',label:'m₁',color:COL.red},{id:'c2',label:'m₂',color:COL.blue},{id:'cP',label:'m₁ · m₂',wide:true,color:COL.green}])+`<div class="fb" id="st">—</div>`;
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(), m2el=$('#m2'); let mode=0, t=0;
  const R1=newRoller(), R2=newRoller();
  toggleWire(wrap.querySelectorAll('#modeB button'),b=>{ mode=+b.dataset.v; });
  const p1={x:-2.5,y:2}, p2={x:2.5,y:-2};
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs);
    const th1t=Math.atan(V.m1);
    let th2t;
    if(mode===0){ th2t=th1t; m2el.value=V.m1; }
    else if(mode===1){ th2t=th1t+PI/2; if(Math.abs(V.m1)>0.05) m2el.value=clamp(-1/V.m1,-5,5); }
    else th2t=Math.atan(V.m2);
    m2el.disabled=mode!==2;
    const th1=F('a1',th1t,dt,PI), th2=F('a2',th2t,dt,PI);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const P=plane(w,h); drawPlane(ctx,P);
    const c1=Math.cos(th1), s1=Math.sin(th1), c2=Math.cos(th2), s2=Math.sin(th2);
    wline(ctx,P,p1.x,p1.y,c1,s1,COL.red,4.6); wline(ctx,P,p2.x,p2.y,c2,s2,COL.blue,4.6);
    drawBall(ctx,P,rollStep(R1,p1.x,p1.y,th1,dt)); drawBall(ctx,P,rollStep(R2,p2.x,p2.y,th2,dt));
    pt(ctx,P,p1.x,p1.y,COL.yellow,5); pt(ctx,P,p2.x,p2.y,COL.yellow,5);
    const cross=c1*s2-s1*c2, dot=c1*c2+s1*s2;
    if(Math.abs(cross)>0.02){
      const tt=((p2.x-p1.x)*s2-(p2.y-p1.y)*c2)/cross, ix=p1.x+c1*tt, iy=p1.y+s1*tt;
      if(Math.abs(dot)<0.04){ rightMark(ctx,P,ix,iy,c1,s1,-s1*Math.sign(cross)*-1,c1*Math.sign(cross)*-1,15,COL.green); ring(ctx,P,ix,iy,t,COL.green,1.4,1.3); }
      else { pt(ctx,P,ix,iy,'#fff',4.5); }
    }
    caption(ctx,mode===0?'m₁ = m₂':mode===1?'m₁ · m₂ = −1':'drag m₂ freely');
    // exact numbers
    const t2=mode===0?th1t:mode===1?th1t+PI/2:Math.atan(V.m2);
    const vert2=Math.abs(Math.cos(t2))<1e-9, m2=vert2?NaN:Math.tan(t2);
    $('#c1').textContent=fr(V.m1); $('#c2').textContent=vert2?'undefined':fr(m2);
    $('#cP').textContent=vert2?'—':fmt(V.m1*m2,2);
    const dth=((t2-th1t)%PI+PI)%PI, st=$('#st');
    if(dth<0.004||dth>PI-0.004) setFb(st,'ok','Parallel ✓  slopes equal');
    else if(Math.abs(dth-PI/2)<0.004) setFb(st,'ok','Perpendicular ✓  m₁m₂ = −1');
    else setFb(st,'','Neither — keep turning');
  });
  return wrap;
}

/* =====================================================================
   9.2.3  ANGLE BETWEEN TWO LINES    tan θ = |(m₂ − m₁)/(1 + m₁m₂)|
   Textbook check (Ex 2): m₁ = ½, θ = 45° → m₂ = 3 or −⅓
   ===================================================================== */
function buildA5(){
  const wrap=labShell();

  const presets=[{label:'m₂ = 3',set:{m1:0.5,m2:3}},{label:'m₂ = −⅓',set:{m1:0.5,m2:-1/3}},{label:'m₁m₂ = −1',set:{m1:0.5,m2:-2}}];
  wrap.querySelector('.lab-side').innerHTML = presetHTML(presets)+sliderGroup(defs)+cardsHTML([
    {id:'cA',label:'Acute θ',color:COL.green},{id:'cB',label:'Obtuse φ = 180° − θ',color:COL.muted},
    {id:'cN',label:'m₂ − m₁',color:COL.blue},{id:'cD',label:'1 + m₁m₂',color:COL.blue},{id:'cT',label:'tan θ',color:COL.green,wide:true}]);
  wirePresets(wrap,presets);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(); let t=0;
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs);
    const a1=F('a1',Math.atan(V.m1),dt,PI), a2=F('a2',Math.atan(V.m2),dt,PI);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const P=plane(w,h); drawPlane(ctx,P);
    let d=angDiff(a2,a1); if(Math.abs(d)>PI/2) d=angDiff(a2+PI,a1);
    const s0=a1+Math.min(0,d), s1=a1+Math.max(0,d), acute=Math.abs(d);
    // sectors
    arcW(ctx,P,0,0,s1,s0+PI,2.9*P.sc,COL.mid,'rgba(129,149,171,0.10)',[6,5]);
    arcW(ctx,P,0,0,s0,s1,2.0*P.sc,COL.green,'rgba(31,157,85,0.20)');
    wline(ctx,P,0,0,Math.cos(a1),Math.sin(a1),COL.red,4.6,null);
    wline(ctx,P,0,0,Math.cos(a2),Math.sin(a2),COL.blue,4.6,null);
    // little runners along both lines
    [[a1,COL.red,0],[a2,COL.blue,1.3]].forEach(([a,c,ph])=>{ const u=((t*0.22+ph)%1)*18-9; circ(ctx,P.X(Math.cos(a)*u),P.Y(Math.sin(a)*u),4.5,c,'#fff',2.2); });
    ring(ctx,P,0,0,t,COL.green,2,1.5); pt(ctx,P,0,0,'#fff',5);
    const mid=(s0+s1)/2, mid2=s1+(PI-acute)/2;
    lblW(ctx,P,'θ = '+fmt(deg(acute),1)+'°',3.7*Math.cos(mid),3.7*Math.sin(mid),COL.green,0,4,'center');
    lblW(ctx,P,'φ = '+fmt(180-deg(acute),1)+'°',4.4*Math.cos(mid2),4.4*Math.sin(mid2),COL.muted,0,4,'center');
    caption(ctx,'tan θ = |(m₂ − m₁) / (1 + m₁m₂)|');
    const num=V.m2-V.m1, den=1+V.m1*V.m2, par=Math.abs(den)<1e-9;
    const th=par?90:deg(Math.atan(Math.abs(num/den)));
    $('#cN').textContent=fmt(num,2); $('#cD').textContent=fmt(den,2);
    $('#cT').textContent=par?'denominator 0 → perpendicular':fmt(Math.abs(num/den),3);
    $('#cA').textContent=fmt(th,1)+'°'; $('#cB').textContent=fmt(180-th,1)+'°';
  });
  return wrap;
}

/* =====================================================================
   9.3.2 / 9.3.3  POINT–SLOPE & TWO-POINT FORM
   y − y₀ = m(x − x₀)        y − y₁ = [(y₂−y₁)/(x₂−x₁)](x − x₁)
   Textbook check: Ex 5 (−2,3), m=−4 → 4x + y + 5 = 0 · Ex 6 (1,−1),(3,5) → −3x + y + 4 = 0
   ===================================================================== */
function buildA6(){
  const wrap=labShell();
  const dP=[{id:'x1',label:'Point · x',min:-9,max:9,val:-2},{id:'y1',label:'Point · y',min:-9,max:9,val:3}];
  const dM=[{id:'m',label:'Slope m',min:-5,max:5,step:0.5,val:-4,dec:1}];
  const dQ=[{id:'x2',label:'Second point · x',min:-9,max:9,val:3},{id:'y2',label:'Second point · y',min:-9,max:9,val:5}];
  const defs=dP.concat(dM,dQ);
  const presets=[{label:'Ex 5 · (−2,3), m = −4',set:{x1:-2,y1:3,m:-4},then:()=>setMode(0)},{label:'Ex 6 · (1,−1) → (3,5)',set:{x1:1,y1:-1,x2:3,y2:5},then:()=>setMode(1)}];
  wrap.querySelector('.lab-side').innerHTML = toggleHTML('modeB',['Point + slope','Two points'])+presetHTML(presets)+
    sliderGroup(dP)+`<div id="gM">${sliderGroup(dM)}</div><div id="gQ" class="hidden">${sliderGroup(dQ)}</div>`+cardsHTML([
    {id:'cEq',label:'Equation',color:COL.blue,wide:true},{id:'cG',label:'General form',color:COL.green,wide:true},
    {id:'cL',label:'y − y₀',color:COL.blue},{id:'cR',label:'m (x − x₀)',color:COL.blue}]);
  wirePresets(wrap,presets);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(); let mode=0, t=0;
  function setMode(i){ mode=i; wrap.querySelectorAll('#modeB button').forEach((b,j)=>b.classList.toggle('active',j===i)); $('#gM').classList.toggle('hidden',i===1); $('#gQ').classList.toggle('hidden',i===0); }
  toggleWire(wrap.querySelectorAll('#modeB button'),b=>setMode(+b.dataset.v));
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs);
    // target geometry
    let tdx,tdy; if(mode===0){ tdx=1; tdy=V.m; } else { tdx=V.x2-V.x1; tdy=V.y2-V.y1; }
    const degenerate=tdx===0&&tdy===0, vertical=tdx===0&&tdy!==0;
    const angT=degenerate?0:Math.atan2(tdy,tdx);
    const x0=F('x0',V.x1,dt), y0=F('y0',V.y1,dt), ang=F('ang',angT,dt,PI);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);

    const c=Math.cos(ang), s=Math.sin(ang);
    if(!degenerate){
      wline(ctx,P,x0,y0,c,s,COL.red,4.6);
      // probe P(x,y) slides along the line; the triangle shows y − y₀ = m(x − x₀) live
      const sp=4.6*Math.sin(t*0.8), px=x0+c*sp, py=y0+s*sp;
      wseg(ctx,P,x0,y0,px,y0,COL.blue,2.2,[7,5]); wseg(ctx,P,px,y0,px,py,COL.blue,2.2,[7,5]);
      if(Math.abs(sp)>1.8){
        lblW(ctx,P,'x − x₀ = '+fmt(px-x0,1),(x0+px)/2,y0,COL.blue,0,(py-y0)>=0?19:-9,'center');
        lblW(ctx,P,'y − y₀ = '+fmt(py-y0,1),px,(y0+py)/2,COL.blue,(px-x0)>=0?10:-10,4,(px-x0)>=0?'left':'right');
      }

    }
    pt(ctx,P,x0,y0,COL.yellow,7); lblW(ctx,P,(mode===0?'P₀ ':'P₁ ')+'('+V.x1+', '+V.y1+')',x0,y0,COL.ink,10,-12);
    if(mode===1){ const x2=F('x2',V.x2,dt), y2=F('y2',V.y2,dt); pt(ctx,P,x2,y2,COL.yellow,7); lblW(ctx,P,'P₂ ('+V.x2+', '+V.y2+')',x2,y2,COL.ink,10,-12); }
    caption(ctx,mode===0?'y − y₀ = m (x − x₀)':'y − y₁ = [(y₂−y₁)/(x₂−x₁)] (x − x₁)');
    // exact numbers
    let gen;
    if(degenerate){ $('#cEq').textContent='pick two different points'; gen=null; $('#cL').textContent='—'; $('#cR').textContent='—'; }
    else if(vertical){ $('#cEq').textContent='x = '+V.x1+'   (slope undefined)'; gen=[1,0,-V.x1]; $('#cL').textContent='—'; $('#cR').textContent='—'; }
    else {
      const m=tdy/tdx, mt=m===1?'':m===-1?'−':(fr(m).includes('/')?'('+fr(m)+')':fr(m));
      $('#cEq').textContent=m===0?'y '+sub(V.y1)+' = 0':'y '+sub(V.y1)+' = '+mt+'(x '+sub(V.x1)+')';
      gen=mode===0?intForm(-m,1,m*V.x1-V.y1,true):intForm(-tdy,tdx,tdy*V.x1-tdx*V.y1,true);
      const sp=4.6*Math.sin(t*0.8);   // the probe's actual position: y − y₀ read off the line vs m(x − x₀) from the slope

/* =====================================================================
   9.3.4  SLOPE–INTERCEPT FORM     y = mx + c   |   y = m(x − d)
   Textbook check (Ex 7): m = ½, c = −3/2 → 2y − x + 3 = 0 · m = ½, d = 4 → 2y − x + 4 = 0
   ===================================================================== */
function buildA7(){
  const wrap=labShell();
  const dM=[{id:'m',label:'Slope m',min:-5,max:5,step:0.1,val:0.5,dec:1}];
  const dC=[{id:'c',label:'y-intercept c',min:-8,max:8,step:0.5,val:-1.5,dec:1}];
  const dD=[{id:'d',label:'x-intercept d',min:-8,max:8,step:0.5,val:4,dec:1}];
  const defs=dM.concat(dC,dD);
  const presets=[{label:'Ex 7(i) · ½, −3/2',set:{m:0.5,c:-1.5},then:()=>setMode(0)},{label:'Ex 7(ii) · ½, d = 4',set:{m:0.5,d:4},then:()=>setMode(1)}];
  wrap.querySelector('.lab-side').innerHTML = toggleHTML('modeB',['y-intercept  c','x-intercept  d'])+presetHTML(presets)+sliderGroup(dM)+
    `<div id="gC">${sliderGroup(dC)}</div><div id="gD" class="hidden">${sliderGroup(dD)}</div>`+cardsHTML([
    {id:'cEq',label:'Equation',color:COL.blue,wide:true},{id:'cG',label:'General form',color:COL.green,wide:true},
    {id:'cY',label:'Cuts y-axis at',color:COL.green},{id:'cX',label:'Cuts x-axis at',color:COL.green}]);
  wirePresets(wrap,presets);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(); let mode=0, t=0;
  function setMode(i){ mode=i; wrap.querySelectorAll('#modeB button').forEach((b,j)=>b.classList.toggle('active',j===i)); $('#gC').classList.toggle('hidden',i===1); $('#gD').classList.toggle('hidden',i===0); }
  toggleWire(wrap.querySelectorAll('#modeB button'),b=>setMode(+b.dataset.v));
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs);
    const cT=mode===0?V.c:-V.m*V.d;
    const a=F('a',Math.atan(V.m),dt,PI), c=F('c',cT,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const P=plane(w,h); drawPlane(ctx,P);
    const co=Math.cos(a), si=Math.sin(a), m=si/co;
    // unit step triangle at the y-intercept: run 1, rise m
    if(Math.abs(m)<=6){
      wseg(ctx,P,0,c,1,c,COL.blue,2.4,[6,4]); wseg(ctx,P,1,c,1,c+m,COL.blue,2.4,[6,4]);
      lblW(ctx,P,'1',0.5,c,COL.blue,0,m>=0?18:-8,'center'); lblW(ctx,P,'m',1,c+m/2,COL.blue,9,4);
    }
    wline(ctx,P,0,c,co,si,COL.red,4.6);
    // intercepts
    const yCol=mode===0?COL.yellow:COL.green, xCol=mode===0?COL.green:COL.yellow;
    ring(ctx,P,0,c,t,yCol,1.8,1.1); pt(ctx,P,0,c,yCol,7);
    if(Math.abs(m)>0.02){ const xi=-c/m; ring(ctx,P,xi,0,t+0.9,xCol,1.8,1.1); pt(ctx,P,xi,0,xCol,7); }
    // probe: x sweeps, y = mx + c read off the line
    const px=6*Math.sin(t*0.9), py=m*px+c;
    wseg(ctx,P,px,0,px,py,COL.blue,2,[5,4]); circ(ctx,P.X(px),P.Y(py),7,COL.green,'#fff',3);
    lblW(ctx,P,'('+fmt(px,1)+', '+fmt(py,1)+')',px,py,COL.green,0,-14,'center');
    caption(ctx,mode===0?'y = mx + c':'y = m (x − d)');
    // exact numbers
    const cE=cT, mS=V.m===0?'':V.m===1?'x':V.m===-1?'−x':fmt(V.m,2)+'x';
    if(mode===0){ const cs=Math.abs(V.c)<1e-9?'':V.c>0?' + '+fmt(V.c,2):' − '+fmt(-V.c,2); $('#cEq').textContent='y = '+(mS+cs||'0'); }
    else $('#cEq').textContent='y = '+fmt(V.m,2)+'(x '+(V.d>=0?'− '+fmt(V.d,2):'+ '+fmt(-V.d,2))+')';
    $('#cG').textContent=eqGen(V.m,-1,cE,true);
    $('#cY').textContent='(0, '+fr(cE)+')';
    $('#cX').textContent=Math.abs(V.m)<1e-9?'never (parallel)':'('+fr(-cE/V.m)+', 0)';
  });
  return wrap;
}

/* =====================================================================
   9.3.5  INTERCEPT FORM     x/a + y/b = 1  ⇒  b·x + a·y − ab = 0
   Textbook check (Ex 8): a = −3, b = 2 → 2x − 3y + 6 = 0
   ===================================================================== */
function buildA8(){
  const wrap=labShell();
  const defs=[{id:'a',label:'x-intercept a',min:-9,max:9,step:0.5,val:-3,dec:1},{id:'b',label:'y-intercept b',min:-9,max:9,step:0.5,val:2,dec:1}];
  const presets=[{label:'Ex 8 · a = −3, b = 2',set:{a:-3,b:2}},{label:'a = 4, b = 3',set:{a:4,b:3}},{label:'a = b = 5',set:{a:5,b:5}}];
  wrap.querySelector('.lab-side').innerHTML = presetHTML(presets)+sliderGroup(defs)+cardsHTML([
    {id:'cEq',label:'Intercept form',color:COL.blue,wide:true},{id:'cG',label:'General form',color:COL.green,wide:true},
    {id:'cA',label:'Triangle area ½|ab|',color:COL.blue},{id:'cL',label:'x/a + y/b (bug)',color:COL.green}]);
  wirePresets(wrap,presets);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(); let t=0;
  const fix=v=>Math.abs(v)<0.25?(v<0?-0.5:0.5):v;
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs); const aT=fix(V.a), bT=fix(V.b);
    const a=F('a',aT,dt), b=F('b',bT,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const P=plane(w,h); drawPlane(ctx,P);
    // triangle with the axes
    ctx.save(); ctx.beginPath(); ctx.moveTo(P.X(0),P.Y(0)); ctx.lineTo(P.X(a),P.Y(0)); ctx.lineTo(P.X(0),P.Y(b)); ctx.closePath(); ctx.fillStyle='rgba(47,143,224,0.10)'; ctx.fill(); ctx.restore();
    wline(ctx,P,a,0,-a,b,COL.red,4.6);
    dimW(ctx,P,0,-0.9*Math.sign(b||1),a,-0.9*Math.sign(b||1),COL.yellow);
    dimW(ctx,P,-0.9*Math.sign(a||1),0,-0.9*Math.sign(a||1),b,COL.yellow);
    lblW(ctx,P,'a = '+fmt(a,1),a/2,-0.9*Math.sign(b||1),COL.yellow,0,b>=0?20:-8,'center');
    lblW(ctx,P,'b = '+fmt(b,1),-0.9*Math.sign(a||1),b/2,COL.yellow,a>=0?-10:10,4,a>=0?'right':'left');
    // a bug runs from (a,0) to (0,b) and back; x/a + y/b stays 1
    const u=0.5-0.5*Math.cos(t*1.6), bx=a*(1-u), by=b*u;
    wseg(ctx,P,bx,0,bx,by,COL.blue,1.8,[4,4]); wseg(ctx,P,0,by,bx,by,COL.blue,1.8,[4,4]);
    circ(ctx,P.X(bx),P.Y(by),7,COL.green,'#fff',3);
    pt(ctx,P,a,0,COL.yellow,7); pt(ctx,P,0,b,COL.yellow,7);
    caption(ctx,'x / a  +  y / b  =  1');
    caption(ctx,fmt(bx/a,2)+'  +  '+fmt(by/b,2)+'  =  '+fmt(bx/a+by/b,2),COL.green,1);
    // exact numbers
    $('#cEq').textContent='x/'+(aT<0?'('+fr(aT)+')':fr(aT))+' + y/'+(bT<0?'('+fr(bT)+')':fr(bT))+' = 1';
    $('#cG').textContent=eqGen(bT,aT,-aT*bT,false);
    $('#cA').textContent=fmt(Math.abs(aT*bT)/2,2)+' sq. units';
    $('#cL').textContent=fmt(bx/a+by/b,2);
  });
  return wrap;
}

/* =====================================================================
   9.4  DISTANCE OF A POINT FROM A LINE      d = |Ax₁ + By₁ + C| / √(A² + B²)
   Textbook check (Ex 9): (3,−5), 3x − 4y − 26 = 0 → 3/5
   ===================================================================== */
function buildA9(){
  const wrap=labShell();
  const dL=[{id:'A',label:'A',min:-6,max:6,val:3},{id:'B',label:'B',min:-6,max:6,val:-4},{id:'C',label:'C',min:-30,max:30,val:-26}];
  const dP=[{id:'x1',label:'P · x₁',min:-9,max:9,val:3},{id:'y1',label:'P · y₁',min:-9,max:9,val:-5}];
  const defs=dL.concat(dP);
  const presets=[{label:'Ex 9 · (3,−5), 3x − 4y − 26 = 0',set:{A:3,B:-4,C:-26,x1:3,y1:-5}}];
  wrap.querySelector('.lab-side').innerHTML = presetHTML(presets)+sliderGroup(dL)+sliderGroup(dP)+cardsHTML([
    {id:'cN',label:'|Ax₁ + By₁ + C|',color:COL.blue},{id:'cS',label:'√(A² + B²)',color:COL.blue},
    {id:'cD',label:'Distance d',color:COL.green,wide:true},{id:'cQ',label:'Probe |PQ| (≥ d)',color:COL.yellow,wide:true}]);
  wirePresets(wrap,presets);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(); let t=0;
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const P=plane(w,h); drawPlane(ctx,P);
    const A=F('A',V.A,dt), B=F('B',V.B,dt), C=F('C',V.C,dt), x1=F('x',V.x1,dt), y1=F('y',V.y1,dt);
    if(V.A===0&&V.B===0){
      pt(ctx,P,x1,y1,COL.yellow,7); caption(ctx,'A and B cannot both be 0',COL.red);
      ['cN','cS','cD','cQ'].forEach(i=>$('#'+i).textContent='—'); return;
    }
    const d2=A*A+B*B, n=Math.sqrt(d2), k=(A*x1+B*y1+C)/d2, fx=x1-A*k, fy=y1-B*k, dist=Math.abs(A*x1+B*y1+C)/n;
    gline(ctx,P,A,B,C,COL.red,4.6);
    // the perpendicular, with the ball dropping along it (accelerating, then a splash)
    wseg(ctx,P,x1,y1,fx,fy,COL.blue,2.6,[7,5]);
    if(dist>0.5) rightMark(ctx,P,fx,fy,A/n*Math.sign(k||1),B/n*Math.sign(k||1),-B/n,A/n,11,COL.green);
    const T=2.6, ph=(t%T)/T, u=ph<0.55?Math.pow(ph/0.55,2):1;
    circ(ctx,P.X(lerp(x1,fx,u)),P.Y(lerp(y1,fy,u)),6,COL.green,'#fff',2.6);
    if(ph>=0.55) ring(ctx,P,fx,fy,(ph-0.55)*T,COL.green,1.2,0.9);
    // sliding probe Q on the line — never closer than the foot
    const s=6*Math.sin(t*0.8), qx=fx-B/n*s, qy=fy+A/n*s;
    wseg(ctx,P,x1,y1,qx,qy,COL.yellow,1.8,[3,5]); circ(ctx,P.X(qx),P.Y(qy),5.5,COL.yellow,'#fff',2.4);
    pt(ctx,P,x1,y1,COL.yellow,7); lblW(ctx,P,'P ('+V.x1+', '+V.y1+')',x1,y1,COL.ink,10,-12);
    pt(ctx,P,fx,fy,COL.green,5);
    lblW(ctx,P,'d = '+fmt(dist,2),(x1+fx)/2,(y1+fy)/2,COL.blue,12,-8);
    caption(ctx,eqGen(V.A,V.B,V.C,false),COL.red); caption(ctx,'d = |Ax₁ + By₁ + C| / √(A² + B²)',COL.ink,1);
    // exact numbers
    const num=Math.abs(V.A*V.x1+V.B*V.y1+V.C), den=Math.sqrt(V.A*V.A+V.B*V.B);
    $('#cN').textContent=num; $('#cS').textContent=fmt(den,2);
    $('#cD').textContent=num+' / '+fmt(den,2)+' = '+fmt(num/den,2);
    $('#cQ').textContent=fmt(Math.hypot(qx-x1,qy-y1),2);
  });
  return wrap;
}

/* =====================================================================
   9.4.1  DISTANCE BETWEEN PARALLEL LINES    d = |C₁ − C₂| / √(A² + B²)
   Textbook check (Ex 10): 3x − 4y + 7 = 0 and 3x − 4y + 5 = 0 → 2/5
   ===================================================================== */
function buildA10(){
  const wrap=labShell();
  const defs=[{id:'A',label:'A',min:-6,max:6,val:3},{id:'B',label:'B',min:-6,max:6,val:-4},
              {id:'C1',label:'C₁  (red line)',min:-30,max:30,val:7},{id:'C2',label:'C₂  (blue line)',min:-30,max:30,val:5}];
  const presets=[{label:'Ex 10 · C₁ = 7, C₂ = 5',set:{A:3,B:-4,C1:7,C2:5}},{label:'Wider gap',set:{A:3,B:-4,C1:20,C2:-10}}];
  wrap.querySelector('.lab-side').innerHTML = presetHTML(presets)+sliderGroup(defs)+cardsHTML([
    {id:'cN',label:'|C₁ − C₂|',color:COL.blue},{id:'cS',label:'√(A² + B²)',color:COL.blue},{id:'cD',label:'Distance d',color:COL.green,wide:true}]);
  wirePresets(wrap,presets);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(); let t=0;
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const P=plane(w,h); drawPlane(ctx,P);
    const A=F('A',V.A,dt), B=F('B',V.B,dt), C1=F('C1',V.C1,dt), C2=F('C2',V.C2,dt);
    if(V.A===0&&V.B===0){ caption(ctx,'A and B cannot both be 0',COL.red); ['cN','cS','cD'].forEach(i=>$('#'+i).textContent='—'); return; }
    const d2=A*A+B*B, n=Math.sqrt(d2), ux=-B/n, uy=A/n;           // direction along both lines
    const b1={x:-A*C1/d2,y:-B*C1/d2}, b2={x:-A*C2/d2,y:-B*C2/d2};   // feet of the origin's perpendicular
    const L=40; ctx.save(); ctx.beginPath(); [[b1,-1],[b1,1],[b2,1],[b2,-1]].forEach(([b,s],i)=>{ const X=P.X(b.x+ux*L*s), Y=P.Y(b.y+uy*L*s); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.closePath(); ctx.fillStyle='rgba(31,157,85,0.10)'; ctx.fill(); ctx.restore();
    gline(ctx,P,A,B,C1,COL.red,4.4); gline(ctx,P,A,B,C2,COL.blue,4.4);
    // a common perpendicular glides along the strip — its length never changes
    const s0=4.5*Math.sin(t*0.55), g1={x:b1.x+ux*s0,y:b1.y+uy*s0}, g2={x:b2.x+ux*s0,y:b2.y+uy*s0};
    dimW(ctx,P,g1.x,g1.y,g2.x,g2.y,COL.green);
    const dist=Math.hypot(g2.x-g1.x,g2.y-g1.y);
    if(dist>0.5) rightMark(ctx,P,g1.x,g1.y,ux,uy,(g2.x-g1.x)/dist,(g2.y-g1.y)/dist,10,COL.green);
    const u=0.5-0.5*Math.cos(t*2.4); circ(ctx,P.X(lerp(g1.x,g2.x,u)),P.Y(lerp(g1.y,g2.y,u)),5.5,COL.yellow,'#fff',2.4);
    lblW(ctx,P,'d = '+fmt(dist,2),(g1.x+g2.x)/2,(g1.y+g2.y)/2,COL.green,14,-10);
    caption(ctx,eqGen(V.A,V.B,V.C1,false),COL.red); caption(ctx,eqGen(V.A,V.B,V.C2,false),COL.blue,1);
    caption(ctx,'d = |C₁ − C₂| / √(A² + B²)',COL.ink,2);
    const num=Math.abs(V.C1-V.C2), den=Math.sqrt(V.A*V.A+V.B*V.B);
    $('#cN').textContent=num; $('#cS').textContent=fmt(den,2); $('#cD').textContent=num+' / '+fmt(den,2)+' = '+fmt(num/den,2);
  });
  return wrap;
}

/* =====================================================================
   Ex 13  MIRROR IMAGE IN A LINE      Q = P − 2·(Ax₁+By₁+C)/(A²+B²)·(A, B)
   The line is the perpendicular bisector of PQ.
   Textbook check: P(1,2) in x − 3y + 4 = 0 → (6/5, 7/5) ·  (3,8) in x + 3y = 7 → (−1,−4)
   ===================================================================== */
function buildA11(){
  const wrap=labShell();
  const dL=[{id:'A',label:'A',min:-6,max:6,val:1},{id:'B',label:'B',min:-6,max:6,val:-3},{id:'C',label:'C',min:-30,max:30,val:4}];
  const dP=[{id:'x1',label:'P · x₁',min:-9,max:9,val:1},{id:'y1',label:'P · y₁',min:-9,max:9,val:2}];
  const defs=dL.concat(dP);
  const presets=[{label:'Ex 13 · (1,2) in x − 3y + 4 = 0',set:{A:1,B:-3,C:4,x1:1,y1:2}},{label:'Misc 17 · (3,8) in x + 3y = 7',set:{A:1,B:3,C:-7,x1:3,y1:8}}];
  wrap.querySelector('.lab-side').innerHTML = presetHTML(presets)+sliderGroup(dL)+sliderGroup(dP)+cardsHTML([
    {id:'cQ',label:'Image Q',color:COL.green,wide:true},{id:'cM',label:'Foot M (mid-point)',color:COL.blue},{id:'cD',label:'PM = MQ',color:COL.blue}]);
  wirePresets(wrap,presets);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(); let t=0;
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const P=plane(w,h); drawPlane(ctx,P);
    const A=F('A',V.A,dt), B=F('B',V.B,dt), C=F('C',V.C,dt), x1=F('x',V.x1,dt), y1=F('y',V.y1,dt);
    if(V.A===0&&V.B===0){ pt(ctx,P,x1,y1,COL.yellow,7); caption(ctx,'A and B cannot both be 0',COL.red); ['cQ','cM','cD'].forEach(i=>$('#'+i).textContent='—'); return; }
    const d2=A*A+B*B, n=Math.sqrt(d2), k=(A*x1+B*y1+C)/d2, mx=x1-A*k, my=y1-B*k, qx=x1-2*A*k, qy=y1-2*B*k, dist=Math.abs(k)*n;
    // mirror: red line with hatching on the side away from P
    gline(ctx,P,A,B,C,COL.red,4.6);
    const side=k>=0?-1:1, nx=A/n*side, ny=B/n*side, ux=-B/n, uy=A/n, b={x:-A*C/d2,y:-B*C/d2};
    ctx.save(); ctx.strokeStyle=COL.red; ctx.lineWidth=1.6; ctx.beginPath();
    for(let s=-24;s<=24;s+=0.7){ const X=b.x+ux*s, Y=b.y+uy*s; ctx.moveTo(P.X(X),P.Y(Y)); ctx.lineTo(P.X(X+nx*0.5+ux*0.3),P.Y(Y+ny*0.5+uy*0.3)); }
    ctx.stroke(); ctx.restore();
    // PQ is the perpendicular bisector pair
    wseg(ctx,P,x1,y1,qx,qy,COL.blue,2.2,[7,5]);
    if(dist>0.5) rightMark(ctx,P,mx,my,A/n*Math.sign(k||1),B/n*Math.sign(k||1),ux,uy,11,COL.green);
    circ(ctx,P.X(mx),P.Y(my),4.5,COL.blue,'#fff',2);
    // a copy of P flips over the mirror along a half-circle centred on M
    const T=3.4, ph=(t%T)/T, e=ph<0.15?0:ph>0.7?1:(0.5-0.5*Math.cos(PI*(ph-0.15)/0.55)), r=dist;
    const gx=mx+(x1-mx)*Math.cos(PI*e)+ux*r*Math.sin(PI*e), gy=my+(y1-my)*Math.cos(PI*e)+uy*r*Math.sin(PI*e);
    if(dist>0.2){ circ(ctx,P.X(gx),P.Y(gy),6,COL.green,'rgba(31,157,85,0.25)',2.2); }
    ring(ctx,P,qx,qy,t,COL.green,1.8,1.1);
    pt(ctx,P,x1,y1,COL.yellow,7); lblW(ctx,P,'P ('+V.x1+', '+V.y1+')',x1,y1,COL.ink,10,-12);
    pt(ctx,P,qx,qy,COL.green,7); lblW(ctx,P,'Q',qx,qy,COL.green,10,-12);
    caption(ctx,eqGen(V.A,V.B,V.C,false),COL.red); caption(ctx,'the line is the ⟂ bisector of PQ',COL.ink,1);
    const K=(V.A*V.x1+V.B*V.y1+V.C)/(V.A*V.A+V.B*V.B), dd=V.A*V.A+V.B*V.B;
    $('#cQ').textContent='('+fr(V.x1-2*V.A*K)+', '+fr(V.y1-2*V.B*K)+')';
    $('#cM').textContent='('+fr(V.x1-V.A*K)+', '+fr(V.y1-V.B*K)+')';
    $('#cD').textContent=fmt(Math.abs(K)*Math.sqrt(dd),2);
  });
  return wrap;
}

/* =====================================================================
   Ex 11  CONCURRENT LINES      2x + y − 3 = 0,  3x − y − 2 = 0,  5x + ky + e = 0
   Concurrent ⇔ determinant of coefficients = 0  (here 5k + 5e + 25)
   Textbook check: k = −2 (with e = −3) → all three meet at (1, 1)
   ===================================================================== */
function buildA12(){
  const wrap=labShell();
  const defs=[{id:'k',label:'k  in  5x + ky + e = 0',min:-8,max:8,step:0.1,val:1,dec:1},{id:'e',label:'e',min:-9,max:9,val:-3}];
  const presets=[{label:'Ex 11 · k = −2, e = −3',set:{k:-2,e:-3}}];
  wrap.querySelector('.lab-side').innerHTML = presetHTML(presets)+sliderGroup(defs)+cardsHTML([
    {id:'cDet',label:'Determinant',color:COL.blue},{id:'cAr',label:'Triangle area',color:COL.blue},
    {id:'cDs',label:'Distance of (1, 1) from yellow line',color:COL.green,wide:true}])+`<div class="fb" id="st">—</div>`;
  wirePresets(wrap,presets);
  const $=s=>wrap.querySelector(s), canvas=$('canvas'), F=follower(); let t=0;
  const L1=[2,1,-3], L3=[3,-1,-2];
  const inter=(p,q)=>{ const det=p[0]*q[1]-q[0]*p[1]; if(Math.abs(det)<1e-6) return null; return {x:(p[1]*q[2]-q[1]*p[2])/det, y:(q[0]*p[2]-p[0]*q[2])/det}; };
  animLoop(dt=>{
    t+=dt; const V=readVals(wrap,defs);
    const k=F('k',V.k,dt), e=F('e',V.e,dt);
    const {ctx,w,h}=fitCanvas(canvas); ctx.clearRect(0,0,w,h);
    const P=plane(w,h); drawPlane(ctx,P);
    const L2=[5,k,e], v12=inter(L1,L2), v23=inter(L2,L3), v13=inter(L1,L3);
    if(v12&&v23&&v13){
      ctx.save(); ctx.beginPath(); [v12,v23,v13].forEach((v,i)=>{ i?ctx.lineTo(P.X(v.x),P.Y(v.y)):ctx.moveTo(P.X(v.x),P.Y(v.y)); }); ctx.closePath();
      ctx.fillStyle='rgba(217,160,23,0.22)'; ctx.fill(); ctx.restore();
      [v12,v23].forEach(v=>circ(ctx,P.X(v.x),P.Y(v.y),4.5,COL.yellow,'#fff',2));
    }
    gline(ctx,P,L1[0],L1[1],L1[2],COL.red,4.2); gline(ctx,P,L3[0],L3[1],L3[2],COL.blue,4.2); gline(ctx,P,L2[0],L2[1],L2[2],COL.yellow,4.6);
    if(v13){ ring(ctx,P,v13.x,v13.y,t,COL.green,1.6,1.4); pt(ctx,P,v13.x,v13.y,COL.green,7); lblW(ctx,P,'(1, 1)',v13.x,v13.y,COL.green,10,-12); }
    caption(ctx,'2x + y − 3 = 0',COL.red); caption(ctx,'3x − y − 2 = 0',COL.blue,1); caption(ctx,eqGen(5,V.k,V.e,false),COL.yellow,2);
    // exact numbers
    const det=2*(V.k*-2-V.e*-1)-1*(5*-2-V.e*3)+(-3)*(5*-1-V.k*3);
    $('#cDet').textContent=fmt(det,2);
    const p12=inter(L1,[5,V.k,V.e]), p23=inter([5,V.k,V.e],L3);
    $('#cAr').textContent=p12&&p23?fmt(Math.abs((p12.x-1)*(p23.y-1)-(p23.x-1)*(p12.y-1))/2,2):'—';
    $('#cDs').textContent=fmt(Math.abs(5+V.k+V.e)/Math.hypot(5,V.k),2);
    setFb($('#st'),Math.abs(det)<0.04?'ok':'warn',Math.abs(det)<0.04?'Concurrent ✓  triangle collapses to a point':'Not concurrent — a triangle remains');
  });
  return wrap;
}

render();
</script>
